<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 13 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>

    <button class="start-btn" onclick="startTest()">Start Test</button>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">

          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Promotion of Buddhism, establishment of Nalanda and Vikramshila Universities.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Which Article of the Constitution of India guarantees equality of opportunity in matter of public employment?</p>", "options": ["<p>Article 14</p>", "<p>Article 15</p>", "<p>Article 16</p>", "<p>Article 17</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 16 of the Constitution of India guarantees equality of opportunity in matters of public employment. It prohibits discrimination on grounds of religion, race, caste, sex, descent, place of birth, or residence in the matters of public employment. It ensures that all citizens have equal access to employment opportunities under the State, subject to reasonable exceptions and qualifications.</span></span></p>\r\n\r\n<table border=\"1\" style=\"width:674px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:35px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:35px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Title</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:35px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Content</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 14</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Right to Equality</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The State shall not deny to any person equality before the law or equal protection of the laws within India.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 15</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Prohibition of Discrimination</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The State shall not discriminate against any citizen on grounds of religion, race, caste, sex, or place of birth.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 16</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Equality of Opportunity in Public Employment</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">There shall be equality of opportunity for all citizens in matters of public employment under the State.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 17</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Abolition of Untouchability</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">&quot;Untouchability&quot; is abolished, and its practice in any form is forbidden.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 18</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Abolition of Titles</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:56px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The State shall not confer titles except military and academic distinctions.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p> </p>"}, {"qid": "", "question": "\r\n<p>Who among the following musicians was awarded India&rsquo;s highest civilian honour, the Bharat Ratna, in 1999?</p>", "options": ["\r\n<p>Ustad Zakir Hussain</p>", "\r\n<p>Ustad Amjad Ali Khan</p>", "\r\n<p>Pandit Ram Narayan</p>", "\r\n<p>Pandit Ravi Shankar</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Pandit Ravi Shankar. </span></span></p>\r\n\r\n<ul style=\"list-style-type:circle\">\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Pandit Ravi Shankar, the renowned sitar maestro, was awarded India&#39;s highest civilian honour, the Bharat Ratna, in 1999. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He was a globally acclaimed musician and composer, known for his significant contributions to Indian classical music and for popularizing Indian music worldwide.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Additional Information: </span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ustad Zakir Hussain is a world-famous tabla player and percussionist from India. He is considered one of the greatest tabla players in the world and has collaborated with numerous renowned musicians from various genres. He is the son of the legendary tabla player Ustad Alla Rakha.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ustad Amjad Ali Khan is a prominent Indian classical sarod player and one of the leading figures in the world of classical music. He comes from a long line of sarod players and belongs to the famous Bangash lineage.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Pandit Ram Narayan is a renowned Indian classical musician known for his mastery of the sarangi, a traditional bowed string instrument. He is considered one of the leading sarangi players in the world.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>What is the basic requirement for an ecosystem to function and sustain?</p>", "options": ["<p>Micro-organism</p>", "<p>Organisms</p>", "<p>Soil structure</p>", "<p>Input of solar energy</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The basic requirement for an ecosystem to function and sustain is the input of solar energy. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Solar energy is the primary source of energy for most ecosystems on Earth. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is captured by plants through the process of photosynthesis, where they convert sunlight into chemical energy. This energy is then transferred to other organisms through the food chain.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">While micro-organisms, organisms, and soil structure are essential components of ecosystems, they rely on the input of solar energy to maintain their functions and sustain life in the ecosystem.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following is considered as small earthquakes in underground caves and mines which are caused by the seismic waves produced by the eruption of rock on the surface?</p>", "options": ["<p>Collapse earthquake</p>", "<p>Explosion earthquake</p>", "<p>Volcanic earthquake</p>", "<p>Reservoir induced earthquakes</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;Collapse Earthquake&rsquo;. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Collapse earthquakes</strong> are considered as small earthquakes that occur in underground caves and mines. They are caused by the seismic waves produced when rocks collapse or cave-in on the surface. These earthquakes are relatively localized and generally of low magnitude.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Explosion earthquakes</strong> are seismic events caused by large-scale explosions, such as nuclear tests or controlled detonations for construction purposes. These explosions generate seismic waves that can be detected and measured like natural earthquakes.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Volcanic earthquakes</strong> are earthquakes that occur in association with volcanic activity. They are caused by the movement of magma or volcanic gases within or beneath a volcano. These earthquakes can signal volcanic unrest and are an essential tool for monitoring volcanic activity.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Reservoir-induced earthquakes</strong> are earthquakes triggered by the construction of large reservoirs or dams. The weight of the water in the reservoir can change stress distribution in the Earth&#39;s crust, leading to seismic activity.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>The world&rsquo;s first 3D printed Hindu temple is being built in which of the following states?</p>", "options": ["<p>Telangana</p>", "<p>Tamil Nadu</p>", "<p>Karnataka</p>", "<p>Madhya Pradesh</p>"], "correct": 1, "marks": "1", "explanation": "<p>The correct answer is &lsquo;Telangana&rsquo;.</p>\r\n\r\n<p>World&#39;s first 3D-printed temple is currently taking shape in Telangana. This architectural marvel is being built inside Charvitha Meadows, a gated villa community at Burugupally in Siddipet.</p>\r\n\r\n<p>The 3D printed temple is a three-part structure being built in an area of 3,800 square feet by city-based Apsuja Infratech. </p>"}, {"qid": "", "question": "<p>When was the first time that Mahatma Gandhi appeared on a Congress platform?</p>", "options": ["<p>1904 Bombay Session</p>", "<p>1915 Bombay Session</p>", "<p>1899 Lucknow Session</p>", "<p>1901 Calcutta Session</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;1901 Calcutta Session&rsquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The 1901 Calcutta Session was the first time Mahatma Gandhi appeared on the Congress platform. Then a lawyer based in South Africa, Gandhi ji urged the Congress to support the struggle against racial discrimination and exploitation in the country.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Important facts: </span></strong></span></span></p>\r\n\r\n<table border=\"1\" style=\"width:666px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:34px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Satyagraha</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:34px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Year</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:34px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Aim</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:53px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Champaran Satyagraha</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:53px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1917</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:53px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Protest against the forced indigo cultivation and exploitation of farmers in Champaran, Bihar.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Kheda Satyagraha</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1918</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Protest against the oppressive land revenue policy and demand for relief during a famine in Kheda, Gujarat.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Non-Cooperation Movement</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1920-1922</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Boycott of British goods, institutions, and withdrawal of support to the British government to demand self-governance.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Civil Disobedience Movement</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1930-1934</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Campaign against British salt laws, and civil disobedience against various unjust British policies and taxes.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:33px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Quit India Movement</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:33px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1942</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:33px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Demand for immediate British withdrawal from India during World War II.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Noakhali Riots</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1946</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:54px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Gandhi&#39;s effort to bring peace and communal harmony in Noakhali district, which experienced violent riots between Hindus and Muslims.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Which of the following gases are greenhouse gases?<br />\r\nA. Water Vapour (H2O)<br />\r\nB. Carbon dioxide (CO2)<br />\r\nC. Methane (CH4)<br />\r\nD. Nitrous Oxide (N2O)<br />\r\n </p>", "options": ["<p>A and B</p>", "<p>A, B, C and D</p>", "<p>A and C</p>", "<p>A, B and C</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option b is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Water vapor (H2O), carbon dioxide (CO2), Nitrous Oxide (N2O), and methane (CH4) are all greenhouse gases</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">These gases trap heat in the Earth&#39;s atmosphere, leading to the greenhouse effect, which is essential for maintaining a stable climate. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">However, human activities, such as the burning of fossil fuels and deforestation, have led to an increase in the concentration of these greenhouse gases, contributing to global warming and climate change.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Major Greenhouse Gases: </span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Carbon dioxide (CO2)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Methane (CH4)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Nitrous oxide (N2O)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Water vapor (H2O)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ozone (O3)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Chlorofluorocarbons (CFCs)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Hydrochlorofluorocarbons (HCFCs)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Hydrofluorocarbons (HFCs)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Perfluorocarbons (PFCs)</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Sulfur hexafluoride (SF6)</span></span></li>\r\n</ol>"}, {"qid": "", "question": "\r\n<p>Who amongst the following is author of the book titled &ldquo;Four Stars of Destiny&rdquo;?</p>", "options": ["\r\n<p>Shashi Tharoor</p>", "\r\n<p>MJ Akbar</p>", "\r\n<p>MM Naravane</p>", "\r\n<p>Dr Vijay Darda</p>"], "correct": 3, "marks": "1", "explanation": "<p>The correct answer is MM Naravane.</p>\r\n\r\n<ul>\r\n\t<li>M.M. Naravane has been the former Army Chief of the country.</li>\r\n\t<li>Recently M.M. The book &#39;Four Stars of Destiny&#39; written by Naravane has been unveiled.</li>\r\n\t<li>In this, Naravane has mentioned the Galvan Valley military clash that occurred in the year 2020.</li>\r\n\t<li>The Galwan Valley military clash took place between the troops of India and China on August 31, 2020.</li>\r\n\t<li>To deal with the situation in Galwan Valley, the government had given a free hand to the Indian Army and ordered it to do whatever was appropriate.</li>\r\n\t<li>General M.M. How Naravane faced the situation has been mentioned in his book.</li>\r\n\t<li>About Agniveer Yojana has also been written in this book.</li>\r\n\t<li>M.M. Naravane was the Army Chief from December 2019 to April 2022.</li>\r\n</ul>"}, {"qid": "", "question": "<p>Triple point can be defined as:</p>", "options": ["<p>the condition of temperature under which the gaseous and liquid phases of a substance can exist in equilibrium</p>", "<p>the temperature at which solid is converted into liquid</p>", "<p>the condition of pressure under which the solid and liquid phases of a substance can exist in equilibrium</p>", "<p>the condition of temperature and pressure under which the gaseous, liquid and solid phases of a substance can exist in equilibrium</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The triple point of a substance is a specific temperature and pressure at which the solid, liquid, and gas phases of that substance coexist in equilibrium. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">At the triple point, all three phases have the same unique vapor pressure, and any change in temperature or pressure will cause a phase transition between these three states. It is a critical point on the phase diagram of a substance.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The concept of the triple point is essential in understanding phase diagrams of substances and provides valuable information about the behavior of substances at different temperatures and pressures.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following is NOT correct about Fundamental Duties?</p>", "options": ["<p>These are not enforceable</p>", "<p>They are primarily moral duties.</p>", "<p>They are not related to any legal rights.</p>", "<p>These duties were added by 44th constitutional Amendment.</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Fundamental Duties were added by the 42nd Constitutional Amendment, not the 44th. The 42nd Amendment, enacted in 1976, introduced the provisions related to Fundamental Duties in Article 51A of the Constitution of India.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The other statements are correct: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(A) These are not enforceable. While Fundamental Duties are an essential part of the Constitution, there is no specific provision for their direct enforcement through legal sanctions. However, they are considered moral and ethical obligations for citizens to uphold the values enshrined in the Constitution.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(B) They are primarily moral duties. Fundamental Duties emphasize the moral and ethical responsibilities of citizens towards the nation and society. These duties are intended to foster a sense of responsible citizenship and promote the welfare of the nation.</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">(C) They are not related to any legal rights. Fundamental Duties are separate from Fundamental Rights, which are justiciable and can be legally enforced through courts. Fundamental Duties, on the other hand, serve as guiding principles for citizens&#39; conduct and are non-justiciable.</span></span></p>"}, {"qid": "", "question": "<p>The election commission of India was established in_______?</p>", "options": ["<p>1953</p>", "<p>1950</p>", "<p>1951</p>", "<p>1952</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;1950&rsquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Election Commission of India was established on <strong>25th January 1950</strong>, with the appointment of the Chief Election Commissioner and two Election Commissioners. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">However, the Election Commission conducted its <strong>first general elections in India in 1951-1952.</strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The constitutional provision for the Election Commission of India can be found in Article 324 of the Indian Constitution. <strong>Article 324 empowers the President of India to establish an Election Commission and also outlines its composition and powers</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Therefore, the correct answer is 1951.</span></span></p>"}, {"qid": "", "question": "<p>What is the strength of a hydrogen bond determined by?</p>", "options": ["<p>Interaction between the lone-pair electrons of the polar molecule and the hydrogen atom of another molecule</p>", "<p>Interaction between the lone-pair electrons of the electropositive atom of one molecule and the hydrogen atom of another molecule</p>", "<p>Interaction between the lone-pair electrons of the electronegative atom of one molecule and the hydrogen atomof another molecule</p>", "<p>Interaction between the lone-pair electrons of the electronegative atom of one molecule and the oxygen atom of another molecule</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The strength of a hydrogen bond is determined by the interaction between the lone-pair electrons of an electronegative atom (usually nitrogen, oxygen, or fluorine) in one molecule and the hydrogen atom attached to an electronegative atom (usually nitrogen, oxygen, or fluorine) in another molecule. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This electrostatic interaction results in a relatively strong bond compared to other intermolecular forces, such as van der Waals forces. Hydrogen bonding plays a crucial role in various chemical and biological processes and is responsible for many unique properties of substances like water.</span></span></p>"}, {"qid": "", "question": "<p>Union Ministry of Home Affairs has formed a three-member judicial inquiry panel to probe ethnic violence in Manipur. Who amongst the following will chair the inquiry panel?</p>", "options": ["<p>Ajai Lamba</p>", "<p>Sanjay Baru</p>", "<p>Himanshu Shekhar Das</p>", "<p>Ritu Raj Awasthi</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Ajai Lamba.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The ministry of home affairs (MHA) has formed a three-member judicial inquiry panel led by former chief justice of Gauhati high court Ajai Lamba to probe the ethnic violence in Manipur. </span></span></p>"}, {"qid": "", "question": "<p>Dholavira, a Harappan Site is presently located in which state?</p>", "options": ["<p> Gujarat</p>", "<p> Uttar Pradesh</p>", "<p>Maharashtra</p>", "<p>Punjab</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;Gujarat&rsquo;.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dholavira, a Harappan archaeological site, is presently located in the state of Gujarat, India. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is one of the most important a s": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Kerala.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Makaravilakku festival is celebrated in the state of Kerala, India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is an important religious event held annually at the Sabarimala Temple, which is one of the most famous pilgrimage centers for Hindus. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The festival takes place in the month of January during the Makara Sankranti, and it marks the culmination of the Sabarimala pilgrimage season.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>What is the correct order of radiations in descending order of frequencies?</p>", "options": ["<p>Infrared &gt; Microwaves &gt; Radio waves &gt; X-rays</p>", "<p>Radio waves &gt; X-rays &gt; Microwaves &gt; Infrared</p>", "<p>X-rays &gt; Infrared &gt; Microwaves &gt; Radio waves</p>", "<p>Infrared &gt; Microwaves &gt; X-rays &gt; Radio waves</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct order of radiations in descending order of frequencies is as follows:</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>X-rays</strong>: X-rays have the highest frequency among the given options. They are a form of ionizing electromagnetic radiation with very high energy levels. X-rays are commonly used in medical imaging, security screening, and various scientific applications.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Infrared</strong>: Infrared radiation has a lower frequency than X-rays but is higher than microwaves and radio waves. Infrared radiation is not visible to the human eye but is detected as heat. It is commonly used in night vision devices, remote controls, and heat-seeking technologies.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Microwaves</strong>: Microwaves have a lower frequency than both X-rays and infrared radiation. They are used in microwave ovens for cooking food and in various communication technologies, including satellite communication and wireless communication.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Radio</strong> <strong>waves</strong>: Radio waves have the lowest frequency among the given options. They are widely used in radio and television broadcasting, mobile communication, and other wireless communication systems.</span></span></li>\r\n</ol>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">So, the correct order of radiations in descending order of frequencies is:</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong> X-rays &gt; Infrared &gt; Microwaves &gt; Radio waves.</strong></span></span></p>"}, {"qid": "", "question": "<p>Which of the following statement is correct regarding large dams?<br />\r\nI. They have social problems because they displace large number of peasants and tribals without adequate compensation or rehabilitation.<br />\r\nII. They have Environmental problems because they contribute enormously to deforestation and the loss of biological diversity.</p>", "options": ["<p>Only I correct</p>", "<p>Only II correct</p>", "<p>Both I and II correct</p>", "<p>Neither I nor II correct</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Both statements are correct regarding large dams.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">I. Large dams often lead to social problems because they require the displacement of a significant number of people, including peasants and tribal communities, from their homes and lands to make way for the reservoirs. In many cases, the displaced people are not adequately compensated or rehabilitated, leading to social and economic hardships for them.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">II. Large dams also have environmental problems because the construction of dams can lead to deforestation and the loss of biological diversity in the area. The creation of large reservoirs can submerge forests and wildlife habitats, leading to ecological imbalances and negative impacts on the local flora and fauna.</span></span></p>"}, {"qid": "", "question": "<p>In India, the executive power of the union is vested with the ___________.</p>", "options": ["<p>Vice President</p>", "<p>Chief Justice</p>", "<p>Prime Minister</p>", "<p>President</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;President&rsquo;.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>The executive power of the Union is vested with the President of India. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The President is the head of the state and the commander-in-chief of the Indian Armed Forces.</span></s <p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Clarifies that a President can be re-elected for a second term if eligible.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 58</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:163px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Qualifications for election as President</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:402px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Lists the qualifications that a person must possess to be eligible for election as President.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 59</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:163px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Conditions of President&#39;s office</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:402px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Lays down the oath or affirmation that the President takes before entering upon the office.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 60</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:163px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Oath or affirmation by the President</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:402px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Details the conditions under which the President can be impeached for violation of the Constitution.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 61</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:163px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Procedure for impeachment</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:402px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Outlines the procedure for the impeachment of the President by Parliament.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 62</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:163px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Time of holding election of President</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:49px; vertical-align:bottom; width:402px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Specifies the time frame for holding a presidential election in case of a vacancy.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Which of the following pairs of &lsquo;mineral &ndash; source&rsquo; is correct?<br />\r\n1. Vitamin A - Papaya<br />\r\n2. Iron &ndash; Spinach</p>", "options": ["<p>Both 1 and 2</p>", "<p>Only 1</p>", "<p>Only 2</p>", "<p>Neither 1 nor 2</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option A is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Both the statements are correct.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Vitamin A</strong> - Papaya: Vitamin A is indeed found in papaya. Papaya is a good source of beta-carotene, a provitamin A compound that gets converted into vitamin A in the body. Vitamin A is essential for maintaining healthy vision, immune system function, and skin health. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Iron</strong> - Spinach: Spinach is a well-known source of iron. It is a leafy green vegetable that contains a significant amount of iron, which is a crucial mineral for the formation of hemoglobin in red blood cells and for transporting oxygen throughout the body. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following organization has launched the &ldquo;100 Days 100 Pays&rdquo; campaign?</p>", "options": ["<p>Security and Exchange Board of India (SEBI)</p>", "<p>Reserve Bank of India (RBI)</p>", "<p>Ministry of Finance</p>", "<p>National Payments Corporation of India (NPCI)</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;Reserve Bank of India (RBI)&rsquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Reserve Bank of India (RBI) has recently initiated the &#39;100 Days 100 Pays&#39; campaign, aimed at tracing and settling the top 100 unclaimed deposits of every bank in every district within a span of 100 days.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following statement is NOT correct with respect to the poverty line?<br />\r\n1. In India, it is normally estimated after every ten years.<br />\r\n2. The proportion of people below poverty line is not same for all social groups and economic categories in India.</p>", "options": ["<p>Only 1</p>", "<p>Only 2</p>", "<p>Both 1 and 2</p>", "<p>Neither 1 nor 2</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option A is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The statement &quot;In India, it is normally estimated after every ten years&quot; is not correct with respect to the poverty line.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">In India, the estimation of the poverty line and the proportion of people below the poverty line is not done every ten years. Instead, poverty estimates are regularly updated and monitored by various government agencies and institutions using different methodologies and data sources. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The poverty estimates are based on periodic surveys, data from the National Sample Survey Office (NSSO), and other socio-economic data sources. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The estimates are not fixed for a ten-year period but are subject to revision and updates based on changing economic and social conditions.</span></span></li>\r\n</ul>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>64, 121,</span><span>  </span><span>? ,256, 334, 419</span></p>", "options": ["<span> 196</span>", "<span> 185</span>", "<span> 169</span>", "<span> 174</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image001.png\" width=\"331\" height=\"239\" alt=\"\"></p>"}, {"qid": "", "question": " <span> The second number in the given number-pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) is/are followed in all the number-pairs except one. Find that odd number-pair.</span>", "options": ["<span> 16: 4080</span>", "<span> 17: 4896</span>", "<span> 18: 5814</span>", "<span> 19: 6878</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image002.png\" width=\"363\" height=\"296\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the correct combination of mathematical signs to sequentially replace the * signs and balance the given equation.</span><p><span>301 * 7 * 18 * 6 * 8 = 73</span></p>", "options": ["<span> ×</span><span>  </span><span>÷</span><span>  </span><span>+</span><span>  </span><span>−</span>", "<span> ÷</span><span>  </span><span>−</span><span>  </span><span>+</span><span>  </span><span>×</span>", "<span> ÷</span><span>  </span><span>×</span><span>  </span><span>+</span><span>  </span><span>−</span>", "<span> +</span><span>  </span><span>×</span><span>  </span><span>−</span><span>  </span><span>÷</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image003.png\" width=\"317\" height=\"239\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Directions: A statement is given followed by two inferences I and II. You have to consider the statement to be true even if it seems to be at variance with commonly known facts. You have to decide which of the given inferences, if any, follow from the given statement.</span><span>  </span><p><span>Statement: Nowadays, the sale of laptops of Dell company has increased.</span></p><p><span>I. Sale of laptops of other companies has decreased.</span></p><p><span>II. Sale of laptops of Dell company was nil earlier.</span></p>", "options": ["<span> Only inference I follows</span>", "<span> Neither inference I nor II follows.</span>", "<span> Only inference II follows.</span>", "<span> Both inferences follow.</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>In the statement, nothing is said about the sale of television sets of the other companies. Hence, inference I is not true. The second inference is not related to the statement as none of it has been talked about in the statement. So, it is also not valid.</span></p><p><span>Hence, both inferences don’t follow.</span></p>"}, {"qid": "", "question": " <span> A paper is folded and cut as shown below. How will it appear when unfolded?</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image004.png\" width=\"424\" height=\"119\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image005.jpeg\" width=\"103\" height=\"103\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image006.jpeg\" width=\"103\" height=\"103\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image007.jpeg\" width= = NMI, % = PFU</span>", "<span> # = MJB, % = OBT</span>", "<span> # = LHA, % = KCU</span>", "<span> # = LAH, % = CKU</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531385284_image058.png\" width=\"317\" height=\"220\" alt=\"\"></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
