<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 3 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Barometer’ is related to ‘Pressure’ in the same way as ‘Hygrometer’ is related to .</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Height </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Humidity </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Temperature </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Wind </span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Barometer </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">measures Pressure</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Hygrometer </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">measures Humidity</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct option:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Humidity</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A farmer is preparing his field. He starts his tractor from the garage and drives 5 km towards East. From there, he turns right and drives 6 km. Then, he turns right and drives 8 km. Again, he turns right and drives 10 km when his tractor breaks down. What is the shortest distance between his current location and garage?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">6 km</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2 km</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">9 km</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">5 km</span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769518793256_image001.png\" width=\"228\" height=\"249\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Shortest distance = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769518793256_image002.png\" width=\"67\" height=\"22\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Nirmala UI'\"> = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">5 km</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FM 25 is related to IJ 125 in a certain way. In the same way, NO 36 is related to QL 216. To which of the following is MP 16 related following the same logic?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ON 64</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PN 64</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PM 64</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PM 32</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">First letter </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">+3</span><span style=\"font-family:'Nirmala UI'\">, second letter </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">−3</span><span style=\"font-family:'Nirmala UI'\">, third number</span><span style=\"font-family:Arial\">→</span><br><span style=\"font-family:'Nirmala UI'\">Multiply by square root </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">FM 25 </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> IJ 125</span><br><span style=\"font-family:'Nirmala UI'\">F</span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\">I (+3), M</span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\">J (−3), 25×5 = 125</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">MP 16 </span><span style=\"font-family:Arial\">→</span><br><span style=\"font-family:'Nirmala UI'\">M</span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\">P (+3), P</span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\">M (−3), 16×4 = </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Answer: PM 64 (Option C)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">In a row of boys, Srinath is 7th from the left and Venkat is 12th from the right. If they interchange their positions, Srinath becomes 22nd from the left. How many boys are there in the row in total?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">32</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">33</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">34</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">30</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"height:0pt;display:block;position:absolute;z-index:1\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769518793256_image003.png\" width=\"54\" height=\"22\" alt style=\"margin-top:9.45pt;margin-left:103.1pt;position:absolute\" ></span><span style=\"font-family:'Nirmala UI'\">First condition </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">6</span><span style=\"font-family:'Nirmala UI'\"> S ………V </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style le=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Galvanization</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The process of adding a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">protective coating of zinc</span><span> to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">iron or steel</span><span> to prevent rusting is called </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Galvanization</span><span>. </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Zinc acts as a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">sacrificial metal</span><span>, protecting iron from corrosion.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Even if the zinc layer is scratched, it continues to protect the underlying iron.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who was the founder of the 'Madras Labour Union' in 1918, which is considered one of the first organized labour unions in India?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Lala Lajpat Rai</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Subodh Banerjee</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B.P</span><span>  </span><span>Wadia</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V. Kalyanasundaram Mudaliar</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Madras Labour Union (1918)</span><span> was founded by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">B. P. Wadia</span><span>. </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Additional:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">It is regarded as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">one of the earliest organized labour unions in India</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">B. P. Wadia</span><span style=\"font-family:Cambria\"> was a social reformer and a follower of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Annie Besant</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">The union was formed to protect the interests of workers in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Buckingham and Carnatic Mills</span><span style=\"font-family:Cambria\"> in Madras.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Singaravelu Chettiar</span><span style=\"font-family:Cambria\"> also played an important supporting role in the labour movement, but the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">founder</span><span style=\"font-family:Cambria\"> was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">B. P. Wadia</span><span style=\"font-family:Cambria\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">B. P. Wadia</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 'Chola Bronzes' are best known for their exquisite depiction of:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Buddha and Bodhisattvas </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jain Tirthankaras</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Yakshas and Yakshinis</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shiva Nataraja</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Chola Bronzes’</span><span> are best known for their </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">exquisite depiction of Hindu deities</span><span>, especially </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Shiva in the form of Nataraja (the cosmic dancer)</span><span>. </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">Originated during the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chola dynasty (9th–13th century CE)</span><span style=\"font-family:Cambria\"> in South India.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">Made using the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">lost-wax casting technique</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">Famous for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">graceful proportions, detailed ornamentation, and dynamic posture</span><span style=\"font-family:Cambria\">, primarily depicting </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Shiva, Vishnu, and Parvati</span><span style=\"font-family:Cambria\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The process of the formation of gametes (sperms and egg cells) in humans occurs through which type of cell division?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mitosis</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Meiosis</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Binary Fission</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Budding</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The formation of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">gametes (sperms and egg cells)</span><span> in humans occurs through:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(B) Meiosis</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Meiosis</span><span style=\"font-family:Cambria\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">reduction division</span><span style=\"font-family:Cambria\"> that halves the chromosome number, producing </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">haploid gametes</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:Cambria\">This ensures that after fertilization, the normal </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">diploid</span><span style=\"font-family:Cambria\"> chromosome number is restored.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why others are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mitosis</span><span style=\"font-family:Cambria\"> – Growth and repair of body cells</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Binary fission</span><span style=\"font-family:Cambria\"> – Common in bacteria</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Budding</span><span style=\"font-family:Cambria\"> – Seen in yeast and hydra</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:Cambria\"> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">(B) Meiosis</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In early 2025, India successfully flight-tested which new generation submarine-launched ballistic missile (SLBM) from INS Arighaat?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K-4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Agni-V</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prithvi-II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BrahMos</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>India recently </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">launched a submarine</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">launched ballistic missile (SLBM)</span><span> from the nuclear</span><span>‑</span><span>powered submarine </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">INS Arighaat</span><span> — and the missile tested was the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">K</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">4 SLBM</span><span>, with an estimated range of about </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">3,500 km</span><span>. This test </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">enhances India’s sea</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">based nuclear deterrence and second</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">strike capability</span><span>. </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">Consider the following statements regarding the distribution of minerals in India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. India is one of the world's largest producers of Mica and a major exporter of it.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. The Kolar Gold Fields, one of the primary sources of gold in India, are located in Andhra Pradesh.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. The largest iron ore reserves in India are predominantly found in the Odisha-Jharkhand belt.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 &amp; 3</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 3 are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – India is among the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">world’s leading producers of mica</span><span style=\"font-family:Cambria\"> and has historically been a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">major exporter</span><span style=\"font-family:Cambria\">, especially of sheet mica.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kolar Gold Fields</span><span style=\"font-family:Cambria\"> are located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Karnataka</span><span style=\"font-family:Cambria\">, not Andhra Pradesh.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">largest iron ore reserves</span><span style=\"font-family:Cambria\"> in India are mainly found in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Odisha–Jharkhand belt</span><span style=\"font-family:Cambria\">, which is the most important iron ore belt of the country.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">1 and 3 only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which one of the following musical instruments is a wind instrument with finger-holes, famously played by the late Ustad Bismillah Khan?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tabla</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vina</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sarangi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shehnai</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-family:'Cambria Math'\">Shehnai</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Shehnai</span><span> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">double-reed wind instrument</span><span> with finger-holes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ustad Bismillah Khan popularized it in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">classical Indian music</span><span> and at ceremonial occasions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Known for its </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">sweet, melodious, and auspicious sound</span><span>, often played in weddings and temples.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">Shehnai</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The \"Lorenz Curve\" is a graphical representation in economics showing the relationship between:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Inflation and Unemployment</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Money supply and Interest rates</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tax rates and Tax revenue</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Income inequality and population</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-weight:bold\">Income inequality and population</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Explanation:</span><br><span>The </span><span style=\"font-weight:bold\">Lorenz Curve</span><span> shows the relationship between the </span><span style=\"font-weight:bold\">cumulative percentage of population</span><span> and the </span><span style=\"font-weight:bold\">cumulative percentage of income (or wealth)</span><span>, and is used to depict </span><span style=\"font-weight:bold\">income inequality</span><span> in an economy.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">Which of the following statements about the Peninsular Rivers of India are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. The Narmada and Tapi are west-flowing rivers that do not form deltas but instead form estuaries.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. The Godavari river is the longest river in Peninsular India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. The Mahanadi and Krishna rivers both flow into the Arabian Sea.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 &amp; 3 All</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 2 are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Narmada</span><span style=\"font-family:Cambria\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tapi (Tapti)</span><span style=\"font-family:Cambria\"> are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">west-flowing rivers</span><span style=\"font-family:Cambria\"> that drain into the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Arabian Sea</span><span style=\"font-family:Cambria\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">form estuaries</span><span style=\"font-family:Cambria\">, not deltas, due to their swift flow and rift-valley origin.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Godavari</span><span style=\"font-family:Cambria\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">longest river in Peninsular India</span><span style=\"font-family:Cambria\">, often called the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">“Dakshin Ganga”</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mahanadi</span><span style=\"font-family:Cambria\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Krishna</span><span style=\"font-family:Cambria\"> rivers flow </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">eastward into the Bay of Bengal</span><span style=\"font-family:Cambria\">, not the Arabian Sea.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">1 and 2 only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">Which of the following statements regarding the Gupta Empire is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. The Chinese pilgrim Fa-Hien visited India during the reign of Chandragupta I.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. The period is often referred to as the 'Golden Age' of ancient India due to advancements in science, art, and literature.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. Emperor Skandagupta successfully repelled the invasion of the Hunas.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 &amp; 3 All</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 2 and 3 are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – The Chinese pilgrim </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fa</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‑</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hien</span><span style=\"font-family:Cambria\"> visited India during the reign of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chandragupta II (Vikramaditya)</span><span style=\"font-family:Cambria\">, not Chandragupta I.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – The Gupta period is called the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Golden Age of India”</span><span style=\"font-family:Cambria\"> because of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">remarkable progress in science, art, literature, mathematics, and astronomy</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Emperor Skandagupta</span><span style=\"font-family:Cambria\"> successfully repelled the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Huna (Hephthalite) invasions</span><span style=\"font-family:Cambria\">, maintaining the stability of the empire.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">2 and 3 only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following elements is a metalloid?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tin (Sn)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bromine (Br)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Germanium (Ge)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Calcium (Ca)</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">metalloid</span><span> among the given options is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-family:'Cambria Math'\">(C) Germanium (Ge)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Germanium (Ge)</span><span style=\"font-family:Cambria\"> shows properties of both </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">metals and non-metals</span><span style=\"font-family:Cambria\">, which is the defining characteristic of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">metalloids</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tin (Sn)</span><span style=\"font-family:Cambria\"> – Metal</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bromine (Br)</span><span style=\"font-family:Cambria\"> – Non-metal (halogen)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Calcium (Ca)</span><span style=\"font-family:Cambria\"> – Metal (alkaline earth metal)</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">(C) Germanium (Ge)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following is </span><span style=\"font-style:italic\">not</span><span> a component of the Capital Account in the Balance of Payments (BOP)?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Foreign Loans</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Foreign Investments</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Banking Capital</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Invisible Trade</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The component that is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not part of the Capital Account</span><span> in the Balance of Payments (BOP) is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span> </span><span style=\"font-family:'Cambria Math'\">(D) Invisible Trade</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Capital Account</span><span style=\"font-family:Cambria\"> in BOP includes </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">foreign loans, foreign investments, and banking capital</span><span style=\"font-family:Cambria\">—all representing financial flows between countries.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Invisible Trade</span><span style=\"font-family:Cambria\"> (services, insurance, shipping, tourism, royalties) is part of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Current Account</span><span style=\"font-family:Cambria\">, not the Capital Account.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">(D) Invisible Trade</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">Which of the following statements about deficiency diseases are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. Night blindness is primarily caused by a deficiency of Vitamin D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. Rickets in children is a deficiency disease associated with Vitamin C.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. Goitre, characterized by an enlarged thyroid gland, is associated with the deficiency of Iodine.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 &amp; 3 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 3 </span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only Statement 3 is correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Night blindness</span><span style=\"font-family:Cambria\"> is caused by a deficiency of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vitamin A</span><span style=\"font-family:Cambria\">, not Vitamin D.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rickets</span><span style=\"font-family:Cambria\"> in children is due to deficiency of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vitamin D</span><span style=\"font-family:Cambria\">, not Vitamin C.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Goitre</span><span style=\"font-family:Cambria\">, marked by enlargement of the thyroid gland, is caused by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">iodine deficiency</span><span style=\"font-family:Cambria\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-family:'Cambria Math'\">3 only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;background-color:#ffffff\">Which of the following statements about the Five-Year Plans in India are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. The Second Five-Year Plan (1956-61) was based on the Mahalanobis Model and focused on rapid industrialization.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. The Planning Commission was replaced by NITI Aayog in 2015.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. The slogan 'Garibi Hatao' (Poverty eradication) w ont-family:'Cambria Math'\">Planning Commission</span><span style=\"font-family:Cambria\">, which had been formulating India’s Five-Year Plans, was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">replaced by NITI Aayog in 2015</span><span style=\"font-family:Cambria\"> to promote cooperative federalism and policy innovation.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – The slogan </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Garibi Hatao”</span><span style=\"font-family:Cambria\"> was central to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fifth Five-Year Plan (1974–79)</span><span style=\"font-family:Cambria\">, which focused on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">poverty alleviation and social welfare programs</span><span style=\"font-family:Cambria\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span> Correct Answer: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1, 2, and 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In which year did the Second Battle of Tarain take place, leading to the establishment of Muslim rule in North India?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1191 CE</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1192 CE</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1206 CE</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1526 CE</span></p>"], "correct": 2, "marks": "1", "explanation": ""}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">With reference to the procedure for the Amendment of the Constitution (Article 368), consider the following:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">1. The Parliament cannot amend those provisions which form the 'basic structure' of the Constitution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">2. A Bill for the amendment of the Constitution requires the prior permission of the President of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f\">3. An amendment bill can be initiated in either the Lok Sabha or the Rajya Sabha.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 &amp; 3 All</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 3 are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – As per the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Basic Structure Doctrine</span><span style=\"font-family:Cambria\"> (Kesavananda Bharati case, 1973), </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Parliament cannot amend those provisions which form the basic structure of the Constitution</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:Cambria\"> – A Constitutional Amendment Bill </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">does NOT require prior permission of the President</span><span style=\"font-family:Cambria\"> for its introduction. Presidential assent is required </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only after the bill is passed by Parliament</span><span style=\"font-family:Cambria\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:Cambria\"> – An </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Amendment Bill can be introduced in either the Lok Sabha or the Rajya Sabha</span><span style=\"font-family:Cambria\">, but </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not in State Legislatures</span><span style=\"font-family:Cambria\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The power of the Supreme Court of India to decide disputes between the Centre and States falls under its:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Advisory Jurisdiction</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Appellate Jurisdiction</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original Jurisdiction</span \"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A focused, deep immersion into a single narrative</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The passage explains that traditional reading of physical books encouraged a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“linear” cognitive process</span><span style=\"font-family:'Nirmala UI'\">, meaning sustained attention and deep engagement with one continuous narrative or argument, rather than skimming or multitasking.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Read the following passage and answer the given questions accordingly:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The digital revolution has fundamentally altered the landscape of human cognition, specifically regarding our attention spans and deep-reading capabilities. Historically, the act of reading a physical book encouraged a \"linear\" cognitive process—a focused, deep immersion into a single narrative or argument. This practice facilitated the development of critical thinking and the ability to follow complex logical threads over hundreds of pages.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">However, the advent of the internet has ushered in a \"nonlinear\" style of consumption. We no longer read; we \"skim.\" Our eyes move in an F-shaped pattern across the screen, searching for keywords and bullet points rather than absorbing the nuance of prose. The constant barrage of notifications and the hyperlinked nature of the web create a state of \"con span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">However, the advent of the internet has ushered in a \"nonlinear\" style of consumption. We no longer read; we \"skim.\" Our eyes move in an F-shaped pattern across the screen, searching for keywords and bullet points rather than absorbing the nuance of prose. The constant barrage of notifications and the hyperlinked nature of the web create a state of \"continuous partial attention.\" While this allows us to process vast amounts of information quickly, neuroscientists warn that it may be rewiring our brains. The \"plasticity\" of the human brain—its ability to adapt to new environments—means that as we become experts at multitasking and rapid information retrieval, we may be losing our capacity for deep, contemplative thought.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Furthermore, the \"echo chamber\" effect of social media algorithms compounds this issue. Not only is our attention fragmented, but it is also directed toward content that reinforces our existing biases. This dual threat—the loss of deep focus and the narrowing of perspective—poses a significant challenge to democratic discourse, which requires both the patience to understand complex issues and the openness to engage with opposing viewpoints.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Q- What does the author suggest is a \"dual threat\" to democratic discourse?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Fragmented attention and narrowed perspectives</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">High-speed internet and expensive books</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:1 : Governments are now rushing to create regulations that balance innovation with consumer protection.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">R: Artificial Intelligence has evolved from a science-fiction concept into a transformative force in modern industry.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">S: It has streamlined manufacturing processes and enhanced data analysis capabilities across various sectors.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PQRS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RSPQ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PRSQ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RPQS</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct order is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> S </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> P </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></ le=\"font-family:'Nirmala UI'\">The father said to his son, \"Do not forget to submit your application before the deadline, or you might lose this opportunity.\" </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The father advised his son not to forget to submit his application before the deadline or he might lose that opportunity.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The father ordered his son that he should not forget to submit his application.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The father reminded his son to not forget to submit his application before the deadline or he may lose that opportunity.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The father told his son that he does not forget to submit his application.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct answer is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> The father advised his son not to forget to submit his application before the deadline or he might lose that opportunity.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why this is correct:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Imperative sentence is correctly changed to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">advised</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Do not forget </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> not to forget</span><span style=\"font-family:'Nirmala UI'\"> (infinitive form).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">You </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> he</span><span style=\"font-family:'Nirmala UI'\"> (pronoun change).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">This opportunity </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> that opportunity</span><span style=\"font-family:'Nirmala UI'\"> (demonstrative change).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Meaning is fully preserved.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other options are incorrect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 2:</span><span style=\"font-family:'Nirmala UI'\"> Incomplete; omits the warning about losing the opportunity.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">may</span><span style=\"font-family:'Nirmala UI'\"> instead of </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">might</span><span style=\"font-family:'Nirmala UI'\"> and has awkward phrasing (“to not forget”).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"font-family:'Nirmala UI'\"> Grammatically incorrect and does not convey advice or warning.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Identify the segment with the grammatical error.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Neither the captain / nor the crew members / were aware off the storm / approaching from the west.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Neither the captain</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">nor the crew members</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">were aware off the storm</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">approaching from the west.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The segment with the grammatical error is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">were aware off the storm</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“off”</span><span style=\"font-family:'Nirmala UI'\"> is incorrect; it should be </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“of”</span><span style=\"font-family:'Nirmala UI'\"> (aware of).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Also, with </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">neither…nor</span><span style=\"font-family:'Nirmala UI'\">, the verb agrees with the </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">nearest subject</span><span style=\"font-family:'Nirmala UI'\"> (crew members), so </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">were</span><span style=\"font-family:'Nirmala UI'\"> is correct—but the preposition error makes this segment incorrect.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the incorrectly spelled word.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Sovereignty</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Renaissance</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Perseverence</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hierarchy</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Sovereignty</span><br><span style=\"font-family:'Nirmala UI'\">English: Supreme power or authority of a state to govern itself</span><br><span style=\"font-family:'Nirmala UI'\">Hindi: संप्रभुता, स्वाधीन सत्ता</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'  style=\"font-family:'Nirmala UI'\">Forgo</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ABSTAIN</span><br><span style=\"font-family:'Nirmala UI'\">English: To deliberately avoid or keep away from something</span><br><span style=\"font-family:'Nirmala UI'\">Hindi: परहेज़ करना, दूर रहना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Refrain</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><br><span style=\"font-family:'Nirmala UI'\">English: To stop oneself from doing something</span><br><span style=\"font-family:'Nirmala UI'\">Hindi: रोकना, परहेज़ करना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Indulge</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> (Antonym)</span><br><span style=\"font-family:'Nirmala UI'\">English: To allow oneself to enjoy or take part in something</span><br><span style=\"font-family:'Nirmala UI'\">Hindi: लिप्त होना, आनंद लेना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Curb</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><br><span style=\"font-family:'Nirmala UI'\">English: To control or restrain</span><br><span style=\"font-family:'Nirmala UI'\">Hindi: नियंत्रित करना, रोक लगाना</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Forgo</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><br><span style=\"font-family:'Nir s the original meaning.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the correct one-word substitute:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The practice of examining one's own conscious thoughts and feelings.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Retrospection</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Circumspection</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Extrospection</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Introspection</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct answer is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Introspection</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Introspection</span><span style=\"font-family:'Nirmala UI'\"> means the act of examining or observing one’s own thoughts, feelings, and mental processes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why others are incorrect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> ><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Idiom Meaning:</span><span style=\"font-family:'Nirmala UI'\"> Hoist with one’s own petard</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">English:</span><br><span style=\"font-family:'Nirmala UI'\">To be harmed, defeated, or exposed by one’s </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">own plan or actions</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Hindi:</span><br><span style=\"font-family:'Nirmala UI'\">अपनी ही चाल या योजना में फँस जाना;</span><br><span style=\"font-family:'Nirmala UI'\">खुद के किए का ही नुकसान उठाना।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Example (Hindi):</span><br><span style=\"font-family:'Nirmala UI'\">उसने दूसरों को फँसाने की कोशिश की, लेकिन अंत में वह </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">अपनी ही चाल में फँस गया</span><span style=\"font-family:'Nirmala UI'\">।</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Homonyms: Select the most appropriate word to fill in the blank.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The principal's _______ on the matter was based on a long-standing _______ of the school board.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">dual / duel</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">canon / cannon</span></p>", " <p style=\"margin-top:0pt;mar
