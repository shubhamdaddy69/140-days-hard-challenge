<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 3 - Hindi</h1>
    <div class="instructions">

    <div class="question-panel">

        <div id="solutionSlot"></div>

      <div class="result" id="result">

        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     sum of Rs x was invested for 7 years in scheme A which offers     simple interest at 9% p.a. The amount received after 7 years was     reinvested in scheme B for 2 years at compound interest at 15%     p.a., compounded 8-monthly. If the interest received from B was     ₹10,790.6, then what is the value of x?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     45,000</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     40,000</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     32,000</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     20,000</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_6b4d98a6d8253ca8.jpg\" width=\"280\" height=\"449\" > </p>"}, {"qid": "", "question": "<p>A boat can go 96 km upstream and the same distance downstream in a total time of 5.12 hours. The speed of the stream is 75% less than the speed of the boat in still water. How much time (in hours) will it take to go 150 km downstream?</p>\r\n\r\n<p> </p>", "options": ["<p>3</p>", "<p>3<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_3a53b47cf27d6123.gif\" /></p>", "<p>2<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_ee82c9bee2474325.gif\" /></p>", "<p>2<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_cff39ebd0e0e2452.gif\" /></p>"], "correct": 1, "marks": "1", "explanation": ""}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     cost of Cloth A is 20% less than the cost of a Cloth B. The total     cost of 4 meter Cloth B and 5 meter cloth A is 144. If the cost     of cloth B is decreased by 10% and the cost of cloth A remains     the same, then what is the cost of 5 meter of cloth B and 3 meter     cloth A?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     138.60</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     120.50</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     130.80</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     124.20</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_80d0f36b1848e16e.gif\" alt=\"Picture 57\" width=\"410\" height=\"445\" > </p>"}, {"qid": "", "question": "<p>The internal and external radii of a hollow metallic cylinder are 4.65 cm and 19.35 cm, respectively, and its heights is 2.8 m. It is melted and recast into a sphere. The surface area (in cm2) of the sphere is:</p>\r\n\r\n<p> </p>", "options": ["<p>22176</p>", "<p>22776</p>", "<p>21716</p>", "<p>27166</p>"], "correct": 1, "marks": "1", "explanation": ""}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Pipes     A and B can fill an empty tank in 30 minutes and 40 minutes,     respectively. Both pipes are opened for x minutes and then B is     closed and A continues to fill. If the tank was completely filled     in a total time of 18 ¾ minutes, then what is the value of x?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     12</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     8</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     9</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     15</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_7e0908549149672e.jpg\" width=\"317\" height=\"293\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     man started his journey in the morning. By 10 a.m., he covered 25     % of his journey and at 1:00 p.m. on the same day, he covered     3/4<sup>th</sup>     part of the journey. At what time in the morning did he start his     journey? (assuming his speed as constant throught)</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     8:00</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     7:30</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     9:00</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     8:30</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690023660666_html_cf53c5b447b26177.gif\" alt=\"Picture 11\" width=\"311\" height=\"411\" > </p>"}, {"qid": "", "question": "<p><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"font-family:Cambria-Bold\">Two circles touch each other internally. The radii are 2 cm and 3 cm. What will be the length of the biggest chord of the greater circle which is outside the inner circle?</span></span></span></p>", "options": ["<p><strong><span style=\"font-size:12.0pt\"><span style=\"font-family:Cambria-Bold\">2</span></span></strong><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/17035862443104de10-1703586244.png\" style=\"height:21px; width:20px\" /></p>", "<p><span style=\"font-family:Cambria-Bold\"><span style=\"font-size:16px\"><strong>3</strong></span></span><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/170358624477f  a     religious or caste or tribal society.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     In the contemporary world we belong, in a sense, to more than one     ‘society’. When amidst foreigners reference to ‘our     society’ may mean ‘Indian society’. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     This diversity makes deciding which ‘society’ we are talking     about difficult.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     CBDA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BDAC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BACD</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: CBDA: <b>In     the contemporary world we belong, in a sense, to more than one     ‘society’. When amidst foreigners reference to ‘our     society’ may mean ‘Indian society’, but when amongst fellow     Indians we may use the term ‘our society’ to denote a     linguistic or ethnic community, a religious or caste or tribal     society. This diversity makes deciding which ‘society’ we are     talking about difficult. But perhaps this difficulty of mapping     society is one not confined to sociologists alone as the comment     below will show.</b></span></p>"}, {"qid": "", "question": "<p style many living organisms such as phytoplankton and     algae are present. In theory, biological productivity should     change as ocean waters become warmer with climate change.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">But     the amount of chlorophyll in surface waters can vary markedly     from year to year, making it hard to differentiate any changes     induced by climate change from the big natural swings. Scientists     thought it might take up to 40 years of observations to spot any     trends.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Another     complicating factor is that numerous satellites have measured     ocean colour over time, and each did so in a slightly different     way, so the data cannot be combined. Cael’s team decided to     analyse data from MODIS, a sensor aboard NASA’s Aqua satellite,     which was launched in 2002 and is still orbiting Earth, far     surpassing its anticipated six-year lifetime. The researchers     looked for trends in seven different wavelengths of light from     the ocean, rather than sticking with the single wavelength used     to track the often-used single measure of chlorophyll. “I’ve     thought for a long time that we could do better by looking at the     full colour spectrum,” Cael says.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">With     two decades of MODIS data, the scientists were able to see     long-term changes in ocean colour. They observed notable shifts     in 56% of the world’s ocean surface, mostly in the waters     between the latitudes of 40º S and 40º N. These tropical and     subtropical waters generally don’t vary much in colour     throughout the year, because the regions don’t experience     extreme seasons and so small long-term changes are more apparent     there, Cael says.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     intensity of the colour change depends on the wavelength of light     measured. In general, the waters are becoming greener over time.     To see if the shifts could be linked to climate change, the     researchers compared the observations to the results of a model     that simulated how marine ecosystems might respond to increasing     levels of greenhouse gases in the atmosphere. The observed     changes matched those in the model.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Data     of which satellite helped scientists to observe the colour of the     ocean for 2</span><span><b>     </b></span><span>decades?</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     NAVIC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CARTASAT</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     MODIS</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ROHINI</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer to this question is option C</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>According     to the passage: “Cael’s team decided to analyse data from     MODIS, a sensor aboard NASA’s Aqua satellite, which was     launched in 2002. With two decades of MODIS data, the scientists     were able to see long-term changes in ocean colour.”</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Read     the following passage and answer the questions given after it.</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">We     are affecting the ecosystem in a way that we haven’t seen     before, the ocean can change colour for many reasons, such as     when nutrients well up from its depths and feed enormous blooms     of phytoplankton, which contain the green pigment chlorophyll. By     studying the wavelengths of sunlight reflected off the ocean’s     surface, scientists can estimate how much chlorophyll there is     and thus how many living organisms such as phytoplankton and     algae are present. In theory, biological productivity should     change as ocean waters become warmer with climate change.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">But     the amount of chlorophyll in surface waters can vary markedly     from year to year, making it hard to differentiate any changes     induced by climate change from the big natural swings. Scientists     thought it might take up to 40 years of observations to spot any     trends.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0 e biological changes and changes in one’s     environment. The environment can change or alter during any time     of the individual’s life-span. Urie Bronfenbrenner’s     contextual view of development emphasises the role of     environmental factors in the development of an individual. The     microsystem is the immediate environment/setting in which the     individual lives. It is in these settings where the child     directly interacts with social agents – the family, peers,     teachers, and neighbourhood. The mesosystem consists of relations     between these contexts. For instance, how a child’s parents     relate to the teachers, or how the parents view the adolescent’s     friends, are experiences likely to influence an individual’s     relationships with others. The exosystem includes events in     social settings where the child does not participate directly,     but they influence the childs experiences in the immediate     context. For example, the transfer of father or mother may cause     tension among the parents which might affect their interactions     with the child or the general amenities available to the child     like quality of schooling, libraries, medical care, means of     entertainment, etc. Macrosystem includes the culture in which the     individual lives. Chronosystem involves events in the     individual’s life course, and socio-historical circumstances of     the time such as, divorce of parents or parents’ economic     setback, and their effect on the child. In a nutshell,     Bronfenbrenner’s view is that a child’s development is     significantly affected by the complex world that envelops her/him     – whether it be the <b>minutiae</b>     of the conversations s/he has with her/his playmates, or the     social and economic life circumstances into which s/he is born.     Research has shown that children in impoverished environments     have unstimulating environment devoid of books, magazines, toys,     etc., lack experiences such as visits to library, museum, zoo,     etc., have parents who are ineffective as role models, and live     in overcrowded and noisy surroundings. As a result of these     conditions children are at a disadvantage and have difficulties     in learning.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">According     to Urie Bronfenbrenner’s contextual view what environmental     factors play a major role in the development of the individual?</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     I. Microsystem view</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     II. Mesosystem view</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     III. Exosystem view</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     IV. Chronosystem view</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     V.     Macrosystem view</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     I, II, III and V</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     I, II, III, IV and V</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     I, II, III and IV</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     I, II, III and V</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is option B</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">According     to Urie Bronfenbrenner’s contextual vi      <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     They     have difficulty in learning</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They     are shy and underconfident</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They     are poor</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They     adopt to this environment with time</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is option A.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">According     to the passage: “Research has shown that children in     impoverished environments have unstimulating environment devoid     of books, magazines, toys, etc., lack experiences such as visits     to library, museum, zoo, etc., have parents who are ineffective     as role models, and live in overcrowded and noisy surroundings.     As a result of these conditions children are at a disadvantage     and have difficulties in learning.”</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Read     the following passage and answer the questions given after it.</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Development     does not take place in a vacuum. It is always embed duled Tribes (STs)</b> and <b>other     weaker sections.</b></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which     of the following statement is correct about human heart?<b>     </b>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Statements:     </b>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     1<b>.     </b>The     upper chambers of the heart are called the left atrium and the     right atrium(or the atria).</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2.      The lower chambers of the heart are called the left ventricle     and the right ventricle.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     3.     Heart muscle is made up of three layers of tissue.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement A</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement A and B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     All     the statement A, B and C</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement A and C</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option     c is the correct answer. All the statement are correct.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Heart     has a left side and a right side, they are separated by a thin     muscular wall called the Septum. Both sides of your heart have an     upper chamber and a lower chamber.        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     upper chambers of the heart are called the left atrium and the     right atrium(or the atria).</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     lower chambers of the heart are called the left ventricle and the     right ventricle.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Heart     muscle is made up of three layers of tissue.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Pericardium:     a thin, outer lining that protects and surrounds your heart.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Myocardium:     a thick, muscular middle layer that contracts and relaxes to pump     blood around of your heart.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Endocardium:     a thin, inner layer that makes up the lining of the four chambers     and the valves in your heart.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Rajaji Tiger Reserve is located in which of the following state?</p>\r\n\r\n<p> </p>", "options": ["<p>Rajasthan</p>", "<p>Madhya Pradesh</p>", "<p>Uttarakhand</p>", "<p>Uttar Pradesh</p>"], "correct": 3, "marks": "1", "explanation": "<p>The correct answer is Uttarakhand.</p>\r\n\r\n<p>Tiger reserve in</p>\r\n\r\n<p>Uttarakhand: Corbett Tiger Reserve, Rajaji Tiger Reserve</p>\r\n\r\n<p>West Bengal: Buxa Tiger Reserve, Sunderbans Tiger Reserve.</p>\r\n\r\n<p>Madhya Pradesh: Bandhavgarh Tiger Reserve, Kanha Tiger Reserve, Panna Tiger Reserve, Pench, Sanjay-Dubri, Satpura.</p>\r\n\r\n<p>Maharashtra: Bor, Melghat, Nawegaon-Nagzira, Sahyadri, Tadoba-Andhari Tiger Reserve.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Indira     Sagar Dam which is a concrete gravity dam is located in which     state of India?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Karnataka</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Madhya     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Odissa</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Uttarakhand</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Madhya Pradesh.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The <b>Indira     Sagar Dam</b> is     the largest dam in India, in terms of volume of water stored     in the reservoir. It is located on the Narmada River at     the town of Narmada Nagar, Punasa in the Khandwa     district of Madhya Pradesh in India. The     foundation stone of the project was laid by the prime     minister of India Indira Gandhi on 23 October 1984. The     construction of the main dam started in 1992. It is 92m high and     653m long concrete gravity dam.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     conservation principle is applicable in the case of the motion of     rocket?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Conservation     of heat</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Conservation     of momentum</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Conservation     of mass</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     None     of these</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Conservation of momentum.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Rocket     work on the principle of conservation of momentum. <span>A     rocket works on the principle of action and reaction. In a     rocket, the hot gases produced by the rapid burning of fuel rush     out of a jet at the bottom of the rocket at a very high speed.     The equal and opposite reaction force of the downward going gases     pushes the rocket upward with a great speed.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     famous Sri Meenakshi-Sundareswar temple is located in which     state?       </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Karnataka</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Andhra     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil     Nadu</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kerala</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Tamil Nadu.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Meenakshi     Sundereshwar Temple is a historic Hindu temple located in     Madurai, Tamil Nadu, India. It is dedicated to Goddess Parvati     who is known as Meenakshi and Shiva as Sundereshwar.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     SEBI     (Security and Exchange Board of India) was established as a     non-statutory body in _________.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1992</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1988</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1989</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1990</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is 1988.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>The     Securities and Exchange Board of India was constituted as a     non-statutory body on April 12, 1988 through a resolution of the     Government of India.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>The     Securities and Exchange Board of India was established as a     statutory body in the year 1992 and the provisions of the     Securities and Exchange Board of India Act, 1992 (15 of 1992)     came into force on January 30, 1992.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Police     force of which of the following states/union territories has     launched a community policing initiatives “We Care”?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra     Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Delhi     Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil     Nadu Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Nagaland     Police</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Delhi Police.         </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Lt     General <b>V     K Saxena</b> inaugurated <b>‘We     Care’</b> a     community policing initiative here aimed at spreading awareness     about various schemes of the <b>Delhi     Police among people.</b> This     initiative is inaugurated at an event organised at Kartvaya Path     at India Gate on the occasion of ‘Sewa Divas, which is being     celebrated to mark the 72nd birthday of Prime Minister Narendra     Modi. The aim of this initiative is to spread awareness among     people about different schemes of the Delhi Police to maintain     coordination and establish a police-public interface.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following amendment gave the status of a state to Nagaland     and made special provisions for it?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Twelfth     Amendment</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Thirteen     Amendment</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Fourteen     Amendment</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Seventeenth     Amendment</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Thirteen Amendment.                   </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Thirteen     Amendment Act, 1962: Gave the status of a state to Nagaland and     made special provisions for it.                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Twelfth     Amendment Act, 1962: Incorporated Goa, Daman and Diu in the     Indian Union.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Fourteen     Amendment: Incorporated Puducherry in the Indian Union.        Provided for the creation of legislatures and council of     ministers for the Union Territories of Himachal Pradesh, Manipur,     Tripura, Goa, Daman and Diu, and Puducherry.        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Seventeenth     Amendment Act, 1964: Prohibited the acquisition of land under     personal cultivation unless the market value of t px-db.akamai.net.in/bulk_uploader_images/1711519353355_image007.png\" width=\"31\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\"> = 41</span></p><p><span style=\"font-family:Calibri\">41 = 41</span></p><p><span style=\"font-family:Calibri\">LHS = RHS (proved).</span></p><p><span style=\"font-family:Calibri\">Hence, option b is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Directions: A statement is given followed by two inferences I and II. Youhave to consider the statement to be true even if it seems to be at variance with commonly known facts. You have to decide which of the given inferences, if any, follow from the given statement.</span><p><span style=\"font-family:Calibri\">Statement:</span></p><p><span style=\"font-family:Calibri\">Many students are addicted to mobile games and this leads to poor academic performance.</span></p><p><span style=\"font-family:Calibri\">Inference:</span></p><p><span style=\"font-family:Calibri\">I. Many Students are not paying attention to studies due to mobile games.</span></p><p><span style=\"font-family:Calibri\">II. It is only because of mobile games that students fail in the examination.</span></p>", "options": ["<span style=\"font-family:Calibri\"> If only I follows</span>", "<span style=\"font-family:Calibri\"> If both I and II follow</span>", "<span style=\"font-family:Calibri\"> If neither I nor II follows</span>", "<span style=\"font-family:Calibri\"> If only II follows</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">The given statement is talk about many students are addicted to mobile games and this leads to poor academic performance. Due to over use of mobile games students neglect their study</span></p><p><span style=\"font-family:Calibri\">Inference 1 many students are not paying attention to studies due to mobile games. This is true that when students are addicted to mobile games, they forget their study and other thing. Therefore inference 1 is follow the statement.</span></p><p><span style=\"font-family:Calibri\">Inference 2 it is only because of mobile games that students fail in the examination. We cannot say that students who fail in the examination is due to mobile games. There are many others reason also maybe their health is not well during examination, they are absent in examination due to some personal reason. there are many other reasons also. Therefore, inference 2 doesn’t follow the statement. </span></p><p><span style=\"font-family:Calibri\">Hence, option a is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> The sequence of folding a piece of paper and the manner in which the folded paper has been cut is shown below. Choose a figure which would most closely resemble the unfolded form of the paper.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image008.png\" width=\"408\" height=\"124\" alt=\"\"></p>", "options": [" <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image009.jpeg\" width=\"100\" height=\"95\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image010.jpeg\" width=\"102\" height=\"100\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image011.jpeg\" width=\"102\" height=\"102\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image012.jpeg\" width=\"104\" height=\"100\" alt=\"\">"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><span style=\"font-family:Calibri\"> </span><span style=\"font-family:Calibri\">By unfolding the paper  answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> A situation is given, followed by two conclusions I and II.</span><span style=\"font-family:Calibri\">  </span><span style=\"font-family:Calibri\">Read the situation and both the conclusions carefully and select the correct answer.</span><p><span style=\"font-family:Calibri\">Situation:</span></p><p><span style=\"font-family:Calibri\">Since the past 15 years, 75% of the products in the world’s pottery market comes from Country K. However, the employment in the pottery industry of Country K has been consistently declining by 5-9% every year since the past 3 years.</span></p><p><span style=\"font-family:Calibri\">Conclusions:</span></p><p><span style=\"font-family:Calibri\">I. Even after declining employment, Country K has enough potters to continue contributing equally to the international market.</span></p><p><span style=\"font-family:Calibri\">II. The local demand of pottery in Country K has substantially decreased leading to less interest among potters.</span></p>", "options": ["<span style=\"font-family:Calibri\"> Only I can be concluded</span>", "<span style=\"font-family:Calibri\"> Neither I nor II can be concluded</span>", "<span style=\"font-family:Calibri\"> Both I and II can be concluded</span>", "<span style=\"font-family:Calibri\"> Only II can be concluded</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">Given statement is talking about Since the past 15 years, 75% of the products in the world’s pottery market comes from Country K. However, the employment in the pottery industry of Country K has been consistently declining by 5-9% every year since the past 3 years.</span></p><p><span style=\"font-family:Calibri\">We can conclude from the given statement that despite declining of employment in pottery industry of country K their contribution to the world’s pottery market is 75% since last 15 years. Therefore, Conclusion I “Even after declining employment, Country K has enough potters to continue contributing equally to the international market” is absolutely correct.</span></p><p><span style=\"font-family:Calibri\">Conclusion II is talking about the local demand of pottery in Country K has substantially decreased leading to less interest among potters which is not mention in the given statement. Therefor, we cannot conclude it from the given statement.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> In this question, a question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statement/s are sufficient to answer the question. Read both the statements and choose your answer carefully.</span><p><span style=\"font-family:Calibri\">P, Q, R, S, T, U and V are 7 people standing in a row all facing North (not necessarily in the same order). Who is standing second to the right of T?</span></p><p><span style=\"font-family:Calibri\">Statements:</span></p><p><span style=\"font-family:Calibri\">(I) U is standing 3rd from the right end and 2nd to the left of R.</span></p><p><span style=\"font-family:Calibri\">(II) Q is standing to the immediate right of T. Q is standing 2nd to the left of P.</span></p>", "options": ["<span style=\"font-family:Calibri\"> The data in Statement (II) alone is sufficient to answer the question, while the data in statement (I) alone is not sufficient to answer the question.</span>", "<span style=\"font-family:Calibri\"> The data in both the Statements (I) and (II) together are sufficient to answer the question.</span>", "<span style=\"font-family:Calibri\"> The data in Statement (I) alone is sufficient to answer the question, while the data in Statement (II) alone is not sufficient to answer the question.</span>", "<span style=\"font-family:Calibri\"> The data in both the Statements (I) and (II) together are NOT sufficient to answer the question.</span>"], "correct": 4, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image045.png\" width=\"314\" height=\"864\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Three statements are given, followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.</span><p><span style=\"font-family:Calibri\">Statements:</span></p><p><span style=\"font-family:Calibri\">l. All phones are laptops.</span></p><p><span style=\"font-family:Calibri\">ll. All pen-drives are phones.</span></p><p><span style=\"font-family:Calibri\">lll. All pen-drives are pens.</span></p><p><span style=\"font-family:Calibri\">Conclusions:</span></p><p><span style=\"font-family:Calibri\">I. All pens are phones.</span></p><p><span style=\"font-family:Calibri\">II. All laptops are pens.</span></p><p><span style=\"font-family:Calibri\">III. All pen-drives are laptops.</span></p>", "options": ["<span style=\"font-family:Calibri\"> Only conclusion III follows</span>", "<span style=\"font-family:Calibri\"> Only conclusions II and III follow</span>", "<span style=\"font-family:Calibri\"> Only conclusions I and III follow</span>", "<span style=\"font-family:Calibri\"> Only conclusions I and II follow</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image046.png\" width=\"216\" height=\"244\" alt=\"\"></p><p><span style=\"font-family:Calibri\">Conclusions:</span></p><p><span style=\"font-family:Calibri\">I. All pens are phones. We cannot say that all pens are phones so, this conclusion doesn’t follow.</span></p><p><span style=\"font-family:Calibri\">II. All laptops are pens: we cannot say that all laptops are pens so, this conclusion doesn’t follow.</span></p><p><span style=\"font-family:Calibri\">III. All pen-drives are laptops: we can say that all pen drives are phones and all phones are laptops so, all pen drives are laptops.</span></p><p><span style=\"font-family:Calibri\">Therefore, only conclusion III follows </span></p><p><span style=\"font-family:Calibri\">Hence, option a is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> There are 4 friends A, B, C and D standing in a straight line, though not necessarily in the same order. A and B are ahead of at least 1 person. B stands between C and D. D does not stand last. Who stands first?</span>", "options": ["<span style=\"font-family:Calibri\"> C</span>", "<span style=\"font-family:Calibri\"> A</span>", "<span style=\"font-family:Calibri\"> B</span>", "<span style=\"font-family:Calibri\"> D</span>"], "correct": 2, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">According to question A</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image047.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">D</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image047.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">B</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image047.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">C</span></p><p><span style=\"font-family:Calibri\">Therefore, A stands first in the line. </span></p><p><span style=\"font-family:Calibri\">Hence, option b is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> If ÷ means −, − means ×, × means +, + means ÷, what will come in place of the question mark (?)?</span><p><span style=\"font-family:Calibri\">77 ÷ 7 × 17 – 49 + 7 = ?</span></p>", "options": ["<span style=\"font-family:Calibri\"> 169</span>", "<span style=\"font-family:Calibri\"> 189</span>", "<span style=\"font-family:Calibri\"> 145</span>", "<span style=\"font-family:Calibri\"> 119</span>"], "correct": 2, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">Put these sign (÷ means −, − means ×, × means +, + means ÷) in the given equation:</span></p><p><span style=\"font-family:Calibri\">77</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image048.png\" width=\"115\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\"> </span></p><p><span style=\"font-family:Calibri\">77</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image018.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">7</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image003.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">17</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image002.png\" width=\"17\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\"> 7</span></p><p><span style=\"font-family:Calibri\">77</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image018.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">7</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image003.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\">119</span></p><p><span style=\"font-family:Calibri\">196</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image018.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span style=\"font-family:Calibri\"> 7</span></p><p><span style=\"font-family:Calibri\">189 </span></p><p><span style=\"font-family:Calibri\">Hence, option b is correct answer.</span></p><p><span style=\"font-family:Calibri\"> </span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Select the correct mirror image of the given combination when the mirror is placed at ‘PQ’ as shown below.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image049.png\" width=\"167\" height=\"54\" alt=\"\"></p>", "options": [" <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image050.png\" width=\"95\" height=\"18\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image051.png\" width=\"94\" height=\"15\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image052.png\" width=\"94\" height=\"20\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image053.png\" width=\"96\" height=\"19\" alt=\"\">"], "correct": 3, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">According to mirror image:</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image052.png\" width=\"94\" height=\"20\" alt=\"\"></p><p><span style=\"font-family:Calibri\">Hence, option c is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.</span><p><span style=\"font-family:Calibri\">F I R _ D F _ _ E D F _ T _ D F I _ E _</span></p>", "options": ["<span style=\"font-family:Calibri\"> E I S I E U E</span>", "<span style=\"font-family:Calibri\"> E H S I E U D</span>", "<span style=\"font-family:Calibri\"> E I S I E U D</span>", "<span style=\"font-family:Calibri\"> E G S J E U E</span>"], "correct": 3, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">F I R _ D F _ _ E D F _ T _ D F I _ E _</span></p><p><span style=\"font-family:Calibri\">F I R E D/ F I S E D/ F I T E D/ F I U E D.</span></p><p><span style=\"font-family:Calibri\">So, the correct answer is (c) E I S I E U D.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Each of A, B, C, D, E, F and G has an exam on a different day of a week starting from Monday and ending on Sunday of the same week. A has an exam on Wednesday. Only one person has an exam between A and B. D has an exam on the day immediately before B. Only one person has an exam between F and B. G’s exam is on one of the days before A but on one of the days after C. On which day does G have an exam?</span>", "options": ["<span style=\"font-family:Calibri\"> Tuesday</span>", "<span style=\"font-family:Calibri\"> Friday</span>", "<span style=\"font-family:Calibri\"> Wednesday</span>", "<span style=\"font-family:Calibri\"> Monday</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image054.png\" width=\"304\" height=\"410\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> ‘A # B’ means ‘A is the brother of B’.</span><p><span style=\"font-family:Calibri\">‘A @ B’ means ‘A is the daughter of B’.</span></p><p><span style=\"font-family:Calibri\">‘A &amp; B’ means ‘A is the husband of B’.</span></p><p><span style=\"font-family:Calibri\">‘A % B’ means ‘A is the wife of B’.</span></p><p><span style=\"font-family:Calibri\">If D @ N @ H &amp; Y @ F % V, then how is Y related to D?</span></p>", "options": ["<span style=\"font-family:Calibri\"> Mother’s mother</span>", "<span style=\"font-family:Calibri\"> Mother</span>", "<span style=\"font-family:Calibri\"> Husband’s mother</span>", "<span style=\"font-family:Calibri\"> Father’s sister</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image055.png\" width=\"270\" height=\"409\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Select the figure that will come in place of the question mark (?) in the following figure series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image056.png\" width=\"340\" height=\"67\" alt=\"\"></p>", "options": [" <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image057.jpeg\" width=\"60\" height=\"60\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image058.jpeg\" width=\"57\" height=\"56\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image059.jpeg\" width=\"59\" height=\"60\" alt=\"\">", " <span style=\"font-family:Calibri\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image060.jpeg\" width=\"56\" height=\"55\" alt=\"\">"], "correct": 2, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">According to series option b is the correct.</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image058.jpeg\" width=\"57\" height=\"56\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of ::?</span><p><span style=\"font-family:Calibri\"># : KNF :: QCV : %</span></p>", "options": ["<span style=\"font-family:Calibri\"> # = MLH, % = OET</span>", "<span style=\"font-family:Calibri\"> # = HQC, % = NFS</span>", "<span style=\"font-family:Calibri\"> # =</span><span style=\"font-family:Calibri\">  </span><span style=\"font-family:Calibri\">HPD, % = NFS</span>", "<span style=\"font-family:Calibri\"> # = IPD, % = OET</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519353355_image061.png\" width=\"251\" height=\"519\" alt=\"\"></p><p><span style=\"font-family:Calibri\"> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
