<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">

  <div id="nav" style="display:none;">

    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

>Clarify:     make clear by removing impurities or solids, as by heating.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Stun:     make senseless or dizzy by or as if by a blow. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Shock:     an unpleasant or disappointing surprise.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Confuse:     mistake one thing for another. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Thus,     the most appropriate antonym of the word ‘Astound’ is     ‘Clarify’.</span></span></p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in Passive voice.</p>\r\n\r\n<p>They say he can teach almost anything in this world.</p>\r\n\r\n<p> </p>", "options": ["<p>It is said that almost anything in this world can be taught by him.</p>", "<p>It was said that almost anything could be taught by him.</p>", "<p>They say almost anything could be taught by him.</p>", "<p>They say anything almost will be taught by him.</p>"], "correct": 1, "marks": "1", "explanation": "<p>Option a is the correct answer.</p>\r\n\r\n<p><strong>Active Voice to Passive Voice transformation rules: </strong></p>\r\n\r\n<p><strong>Sub + may/can(modal) + v1 + Obj ------ Obj + modal + be + v3 + by + Sub. </strong></p>\r\n\r\n<p>Thus, the correct answer is: <strong>It is said that almost anything in this world can be taught by him.</strong></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sel graphein (describe) implying the description of     people.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     PSRQ</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     PSQR</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     QRPS</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     PQRS</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct arrangement is: PSQR: Demography is the systematic study     of population. The term is of Greek origin and is composed of the     two words, demos(people) and graphein (describe) implying the     description of people. Demography studies the trends processes     associated with population including -changes in population     including – changes in population size; patterns of births,     deaths, and migration; and the structure and composition of the     Population. Such as the relative proportions of women, men and     different age groups.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">More     than one man __________ present there.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none ows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     and a daughter, though not considered a curse, was not generally     welcome.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     The only woman in the world who has scaled Mt Everest twice was     born in a society where the birth of a son was regarded as a     blessing.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     DCAB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DACB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ACDB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DCAB: The only woman in the world who has     scaled Mt Everest twice was born in a society where the birth of     a son was regarded as a blessing, and a daughter, though not     considered a curse, was not generally welcome. When her mother     was expecting Santosh, a travelling ‘holy man’, giving her     his blessing, assumed that she wanted a son. But, to everyone’s     surprise, the unborn child’s grandmother, who was standing     close by, told him that they did not want a son.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     < ense</b>     and reported speech(sentence in inverted comm(a) is also in <b>past     tense</b>     then following transformation occurs: </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Simple     Past tense -------- Past Perfect Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Past     Continuous tense ----- Past Perfect Continuous Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>But     in the case of universal fact no tense is changed. </b></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span><b>Thus,     the correct indirect speech of the given sentence is: </b></span><span>The     teacher said that Netaji Subhash Chandra Bose was born in India.</span></span></p>"}, {"qid": "", "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ. Wुiिध पुध ीiनौप ोnक पुध िोौप ौधnपधncधौ ोनध in cयननधcप यनकधन, पुध ौधnपधncधौ in ृधपथधधn ोनध ुहंृिधक हू. Aननोngध पुध ौधnपधncधौ in पुध नigुप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. S1. Rों Mयुोn थोौ ो ियॅधन यी ुiौ cयहnपनद. P. Dोॅiक ौोiक पुोप iप थयिहक ृध ो gययक ूिोn पय ुोॅध ोn Engिiौु ौcुयिय ोnक cियिधgध. Q. Hध थोौ पोिाing थiपु Dोॅiक ोृयहप हूिiीपing पुध ंinक यी InकiAnौ: R. Sय, ुध ोिसय पुयहgुप पुोप पुiौ ौहृुधcप थोौ ॅधनद inपधनधौपing. S. Dोॅiक ोिसय ुोक ो ौपनयng ृयnक थiपु Inकiो. S6. Inकiोnौ ोnक Eहनयूधोnौ ंधप nधसप दधोन पय ूहप पुiौ iकधो inपय ौुोूध.", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     RPQS</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     SRPQ</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     RSPQ</p>", "<p style=\"orphans:0;widow "orphans:0;widows:0;text-decoration:none\">     a great many     difficulty</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     much great     difficulties</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is grammatically correct.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">We     use a great many + plural noun to mean a large number of     something.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Example:     There have been a great many books written about sports injuries.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     In 1676, the Qing navy engaged a fleet of the Zheng kingdom, a     trading empire based in Taiwan that controlled sea lanes from     Japan to Southeast Asia.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     Despite regarding the Zheng state as little more than a pirate     organisation, a Qing captain had to respect the size of its     fleet, describing its ships as ‘uncountable, we saw only masts     like a forest.’</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     Others have written at length and in detail on the political and     military aspects of the Qing-Zheng war.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     To me, the sheer scale of this naval battle requires us to pay     attention to other places far from the coast and, indeed, to     other species entirely.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     ACBD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDBA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ADBC</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     C is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct arrangement is: ABCD: </span><span><b>In     1676, the Qing navy engaged a fleet of the Zheng kingdom, a     trading empire based in Taiwan that controlled sea lanes from     Japan to Southeast Asia. Despite regarding the Zheng state as     little more than a pirate organisation, a Qing captain had to     respect the size of its fleet, describing its ships as     ‘uncountable, we saw only masts like a forest.’ Others have     written at length and in detail on the political and military     aspects of the Qing-Zheng war. To me, the sheer scale of this     naval battle requires us to pay attention to other places far     from the coast and, indeed, to other species entirely.</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">(A)      For half the day we are slaves to necessities which we cannot     shirk, whether we are monarchs with a thousand slaves or humble     labourers with no servants but their wives.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">(B)     What is a perfectly free person? Evidently a person who can do     what he likes, when he likes, and where he likes, or do nothing     at all if he prefers it.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">(C)     Whether we like it or not, we must all sleep for one third of our     lifetime—wash and dress and undress—we must spend a couple of     hours eating and drinking—we must spend nearly as much in     getting about from place to place.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">(D)     Well, there is no such person, and there never can be any such     person.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BDCA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DBAC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDAB</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: BDCA: <b>What     is a perfectly free person? Evidently a person who can do what he     likes, when he likes, and where he likes, or do nothing at all if     he prefers it. Well, there is no such person, and there never can     be any such person. Whether we like it or not, we must all sleep     for one third of our lifetime—wash and dress and undress—we     must spend a couple of hours eating and drinking—we must spend     nearly as much in getting about from place to place. For half the     day we are slaves to necessities which we cannot shirk, whether     we are monarchs with a thousand slaves or humble labourers with     no servants but their wives. </b></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     following sentence has been split into three segments. Identify     the segment that contains a grammatical error or choose the no     error. </spa over. The hollow mould thus created was filled with molten     metal which took the original shape of the object.</b></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option that can substitute the highlighted     segment in the given sentence. If there is no need to substitute     it, select ‘No substitution required’.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>I     </span><span><b>am     preparing</b></span><span>     for competitive exams now-a-days.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     was     preparing</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     No     substitution required</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     have     prepared</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     have     preparing</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Rule:     An action that is going on at the time of speaking comes in     Present Continuous Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">If     the statement deals with a routine action, Simple Present Tense     is used a tal? Well, the     first question you will have to decide is who gets to decide what     the laws governing the society should be? You may want rule X,     but others may want rule Y. How do we decide whose rules or     preferences should govern us? You may think the rules you want     everyone to live by are the best; but others think that their     rules are the best. How do we resolve this dispute? So even     before you decide what rules should govern this group you have to     decide: Who gets to decide? The constitution has to provide an     answer to this question. It specifies the basic allocation of     power in a society. It decides who gets to decide what the laws     will be. In principle, this question, who gets to decide, can be     answered in many ways: in a monarchical constitution, a monarch     decides; in some constitutions like the old Soviet Union, one     single party was given the power to decide. But in democratic     constitutions, broadly speaking, the people get to decide. But     this matter is not so simple. Because even if you answer that the     people should decide, it will not answer the question: how should     the people decide? For something to be law, should everyone agree     to it? Should the people directly vote on each matter as the     ancient Greeks did? Or should the people express their     preferences by electing representatives? But if the people act     through their representatives, how should these representatives     be elected? How many should there be?</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">In     the Indian Constitution for example, it is specified that in most     instances, Parliament gets to decide laws and policies, and that     Parliament itself be organised in a particular manner. Before     identifying what the law in any given society is, you have to     identify who has the authority to enact it. If Parliament has the     authority to enact laws, there must be a law that bestows this     authority on Parliament in the first place. This is the function     of the constitution. It is an authority that constitutes     government in the first place. The second function of a     constitution is to specify who has the power to make decisions in     a society. It decides how the government will be constituted.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Which     word best describes the tone of the passage?</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Enthusiastic</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Critical</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Indifferent</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Analytical</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     passage can be described as analytical because it presents a     logical and systematic examination of the fundamental principles     and functions of a constitution. It objectively discusses the     questions and considerations involved in determining who gets to     decide the laws, resolving disputes, and allocating power in a     society. The passage presents different perspectives and options     without expressing strong emotions or biases. It aims to analyze     and explain the topic in a thoughtful and objective manner.</span></p>     <p style=\"or e\">     Right     to move freely throughout the territory of World.</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is option d. Article 19 gives Right to move freely     throughout the territory of India not world.                                                                                                                              </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Article     19 guarantee to all citizens the six rights of freedom including:                                             </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Right      to freedom of speech and expression</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Right      to assemble peaceably and without arms.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Right      to form associations or unions or co-operative societies.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Right      to move freely throughout the territory of India.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Right      to reside and settle in any part of the territory of India.</p>      </li><li><p style=\"orphans:0;widows:0\">Right      to practice any profession or to carry on any occupation, trade      or business.</p>     </li></ol>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following state government has launched a new initiative     called “Shashan Aplya Dari”(government at your desktop)?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     West     Bengal</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jharkhand</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Karnataka</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Maharashtra.                                       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The <b>Maharashtra</b> government,     under the leadership of Chief Minister <b>Eknath     Shinde</b>,     has launched a new initiative called <b>‘Shasan     Aplya Dari’</b> (government     at your doorstep). The primary objective of this initiative is to     provide citizens with easy access to government schemes and     documents, all in one place.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "\r\n\r\n\r\n\r\n<p>Who amongst the following has been appointed as the Central Vigilance Commissioner (CVC) as of Aug 2024?</p>", "options": ["\r\n\r\n\r\n\r\n<p>TS Sivagnanam</p>", "\r\n\r\n\r\n\r\n<p>R Dinesh</p>", "\r\n\r\n\r\n\r\n<p>Aadgav Arjuna</p>", "\r\n\r\n<p>Praveen Kumar Srivastava</p>"], "correct": 4, "marks": "1", "explanation": "\r\n\r\n<p>The current CVC of India is Praveen Kumar Srivastava.  </p>\r\n\r\n<p><strong>Central Vigilance Commission</strong> (<strong>CVC</strong>) is an apex Indian governmental body created in 1964 to address governmental corruption. It has the status of an autonomous body, free of control from any executive authority, charged with monitoring all vigilance activity under the Central Government of India, advising various authorities in central Government organizations in planning, executing, reviewing and reforming their vigilance work.                                   </p>"}, {"qid": "", "question": "<p>Achanakmar tiger reserve is located in which state?</p>", "options": ["<p>Chhattisgarh</p>", "<p>Madhya Pradesh</p>", "<p>Karnataka</p>", "<p>Odisha</p>"], "correct": 1, "marks": "1", "explanation": "<p>The correct answer is Chhattisgarh. There are total three tiger reserves in Chhattisgarh- 1. Achanakmar Tiger Reserve, 2. Indravati Tiger Reserve, 3. Udanti-Sitanadi Tiger Reserve.</p>\r\n\r\n<p> </p>\r\n\r\n<p>Tiger Reserve in M.P.- 1. Bandhavgarh Tiger Reserve, 2. Kanha Tiger Reserve, 3. Panna Tiger Reserve, 4. Pench Tiger Reserve, 5. Sanjay-Dubri Tiger Reserve, 6. Satpura Tiger Reserve.</p>\r\n\r\n<p> </p>\r\n\r\n<p>Tiger Reserve in Karnataka: 1. Bandipur Tiger Reserve, 2. Bhadra Tiger Reserve, 3. Bilgiri Ranganatha Temple Tiger Reserve, 4. Dandeli-Anshi Tiger Reserve, 5. Nagarhole Tiger Reserve.</p>\r\n\r\n<p> </p>\r\n\r\n<p>Tiger Reserve in Odisha: 1. Satkosia Tiger Reserve, 2. Similipal Tiger Reserve.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Swaraj     Party was established by who amongst the following?      </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Motilal      Nehru       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      C.R.      Das       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      N.C      Kelkar</p>      </li><li><p style=\"orphans:0;widows:0\">Lala      Lajpat Rai       </p>     </li></ol>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     B     and C only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A     and B only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A,     B and C</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     B,     C and D only</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     Option     C is the correct answer. Swaraj Party was organized by Motilal     Nehru, C.R. Das and N.C Kelkar. The foundation of the Swaraj     Party was laid on Jan. 1, 1923, as the ‘Congress     Khilafat-Swaraj Party’.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     is the author of the book titled “My Journey: Transforming     Dreams into Actions”?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Abraham     Lincoln</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A.P.J.     Abdul Kalam</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sachin     Tendulkar</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ratan     Ji Tata</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is A.P.J. Abdul Kalam.                                                                                              </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     A.P.J.     Abdul Kalam books: Wings of Fire: An Autobiography, India 2020: A     Vision for the New Millenium, Ignited Minds: Unleashing the Power     within India, The Luminous Sparks: A Biography in Verse and     Colours, Guiding Souls: Dialogues on the Purpose of Life, Mission     of India: A Vision of Indian Youth, My Journey: Transforming     Dreams into Actions.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> A question is given, followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements is sufficient to answer the question. Read both the statements and select the appropriate answer.</span><p><span style=\"font-family:Calibri\">Q. Six people sit in two parallel rows. In Row 1 - J, K and L sit facing towards north, and in Row 2 - F, G and H sit facing towards south. Each person in a row faces a person in the other row. Who faces G?</span></p><p><span style=\"font-family:Calibri\">Statements:</span></p><p><span style=\"font-family:Calibri\">(I) H faces K; L faces an imme const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
