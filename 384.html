<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">

    <button id="nextBtn" onclick="next()">Next →</button>

 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690186957756_html_98dff5b84addc580.jpg\" width=\"276\" height=\"352\" > </p>"}, {"qid": "", "question": "<p>The selling price of an article marked for Rs.50,000 after giving three discounts, 5%, 10% and K% is Rs.34200. What will be the selling price (in Rs.) of the same article if a single discount of (k+5) % is allowed?</p>\r\n\r\n<p> </p>", "options": ["<p>37500</p>", "<p>38500</p>", "<p>36000</p>", "<p>39000</p>"], "correct": 1, "marks": "1", "explanation": "<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586349a7dec710-1703586349.png\" style=\"height:1166px; width:1280px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     It was so warm, so bright! The birds were chirping at the edge of     the woods; and in the open field back of the sawmill the Prussian     soldiers were drilling.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     It was all much more tempting than the rule for participles, but     I had the strength to resist, and hurried off to school. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     For a moment I thought of running away and spending the day out     of doors.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     I started for school very late that morning and was in great     dread of a scolding, especially because M. Hamel had said that he     would question us on participles, and I did not know the first     word about them. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     DCAB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DBCA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DCAB: </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>I     started for school very late that morning and was in great dread     of a scolding, especially because M. Hamel had said that he would     question us on participles, and I did not know the first word     about them. For a moment I thought of running away and spending     the day out of doors. It was so warm, so bright! The birds were     chirping at the edge of the woods; and in the open field back of     the sawmill the Prussian soldiers were drilling. It was all much     more tempting than the rule for participles, but I had the     strength to resist, and hurried off to school.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in passive voice.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     accountant took the cheque from the customer.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     The     cheque is taken from the customer by the accountant.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     cheque was taken from the customer by the accountant.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     customer was taken the cheque by the accountant.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     cheque had been taken from the customer by the accountant.</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     Voice to Passive Voice transformation: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + v2 + Obj ----------- Obj + was/were + v3 + by sub. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     cheque was taken from the customer by the accountant. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Some might make quite extravagant claims for it as being, in its     highest form, a source of truth, and, in its practice, an art.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     Since its invention a little over 130 years ago, the interview     has become a commonplace of journalism.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     So it is hardly surprising that opinions of the interview — of     its functions, methods and merits — vary considerably.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     Today, almost everybody who is literate will have read an     interview at some point in their lives, while from the other     point of view, several thousand celebrities have been interviewed     over the years, some of them repeatedly.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     ACBD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BCDA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BDCA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDBA</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct arrangement is: BDCA: Since its invention a little over     130 years ago, the interview has become a commonplace of     journalism. Today, almost everybody who is literate will have     read an interview at some point in their lives, while from the     other point of view, several thousand celebrities have been     interviewed over the years, some of them repeatedly. So it is     hardly surprising that opinions of the interview — of its     functions, methods and merits — vary considerably. Some might     make quite extravagant claims for it as being, in its highest     form, a source of truth, and, in its practice, an art.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">An     involuntary action under a stimulus is described as a-</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Complex</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Reflex</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Reflection</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Response</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Reflex. led as------------?</p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Halophytes</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Saprophytes</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Xerophytes</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Heliophytes</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Xerophyte. It is a species of plant that has     adapted to survive in an environment with little liquid water,     such as a desert or an ice-or snow-covered region in the Alps or     the Arctic.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span><b>Halophytes:     </b></span><span>Halophytes     are plants that can withstand salt. They are greater osmotic     pressure, salt-tolerant plants that thrive in more salinity and     have the capacity to withstand higher salt concentrations.     Halophytes comprise just 2% of all plant species on Earth.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span><b>Heliophytes:     </b></span><span>Heliophytes     are the plant that require high sunlight intensity to grow. They     are also called sun loving plants.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span><b>Xerophytes:     </b></span><span>Xerophytes     are a group of plants that are adapted to survive in arid regions     like desert and snow-covered areas. Xerophytes have stomata with     microscopic openings and elongated leaves that store large     amounts of water. Sometimes even their stems store water. They     have deep-spreading roots that search for water. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Who     was not associated with </span><span><b>Hindustan     Socialist Republican Association (HSRA)</b></span><span>     during the Indian freedom struggle?</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Bhagat     Singh</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Sachindranath     Sanyal</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Ramprasad     Bismil</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Lala     Lajpat Rai</span></p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Lala Lajpat Rai.         </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Hindustan     Socialist Republican Association (HSRA) previously it was known     as the Hindustan Republican Army, founded by Ram Prasad Bismil,     Sachindra Nath Bakshi, Sachindranath Sanyal, and Jogesh Chandra     Chatterjee.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span>The     party was initially named Hindustan Republican Association (HRA)     by Bismil when he formed it in 1923. The main reason for the     party’s formation was Mahatma Gandhi’s calling off     the non-cooperation movement in 1922 because of the     Chauri Chaura incident.       </span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of th uestion mark (?) in the following series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image053.png\" width=\"562\" height=\"111\" alt=\"\"></p>", "options": [" <span style=\"font-family:Calibri;font-weight:bold\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image054.png\" width=\"86\" height=\"84\" alt=\"\">", " <span style=\"font-family:Calibri;font-weight:bold\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image055.png\" width=\"86\" height=\"89\" alt=\"\">", " <span style=\"font-family:Calibri;font-weight:bold\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image056.png\" width=\"77\" height=\"83\" alt=\"\">", " <span style=\"font-family:Calibri;font-weight:bold\"> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image057.png\" width=\"84\" height=\"82\" alt=\"\">"], "correct": 2, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image055.png\" width=\"86\" height=\"89\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri;font-weight:bold\"> </span><span style=\"font-family:Calibri\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of ::?</span><p><span style=\"font-family:Calibri\"># : LOG :: RDW : %</span></p>", "options": ["<span style=\"font-family:Calibri\"> # = NMI, % = PFU</span>", "<span style=\"font-family:Calibri\"> # = IRD, % = OGT</span>", "<span style=\"font-family:Calibri\"> # =</span><span style=\"font-family:Calibri\">  </span><span style=\"font-family:Calibri\">IQE, % = FGT</span>", "<span style=\"font-family:Calibri\"></span><span style=\"font-family:Calibri\">  </span><span style=\"font-family:Calibri\"># = JQE, % = PFU</span>"], "correct": 1, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> The correct answer is A.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522760484_image058.png\" width=\"408\" height=\"332\" alt=\"\"></p><p><span style=\"font-family:Calibri\"> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
