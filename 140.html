<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 2 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the following question, by using which mathematical operators will the expression become correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">29_33_837__31_120 = 800</span></p>", "options": [" <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">+,</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image001.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">,</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image002.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">,-</span></p>", "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image003.png\" width=\"79\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">+, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image002.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">, -,</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image001.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image004.png\" width=\"79\" height=\"21\" alt style=\"vertical-align:middle\" ></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Try option </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+, ×, ÷, −</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Expression becomes:</span><br><span style=\"font-family:'Cambria Math'\">29 + 33 × 837 ÷ 31 – 120</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">29+33</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image005.png\" width=\"82\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">29+891-120</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">920-120</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">800</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+, ×, ÷, −</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seven friends P, Q, R, S, T, U and V are watching a cricket match sitting in a stadium. P is sitting at one extreme end. T is sitting second to the right of P and to the immediate left of U. V is sitting between Q and U. Q is sitting to the immediate left of S. Who is sitting at the extreme right end?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">S</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">P</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">T</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509404472_image006.png\" width=\"259\" height=\"130\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First condition is not possible because it is given p is at extreme end and t is second right of p which is not possible.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So S is at extreme end. we can clearly see in second diagram. </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jiya is heavier than Priya but not as much as Yana. Shreya is not the lightest among the group. Yana is heavier than Disha and Shreya. Shreya is lighter than Priya. Who is the third heaviest person in the group?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jiya</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Priya </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Disha </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shreya </span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let us arrange step by step.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Jiya is heavier than Priya but lighter than Yana</span><br><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">→ </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Yana &gt; Jiya &gt; Priya</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Yana is heavier than Disha and Shreya</span><br><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">→ </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Yana &gt; Disha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Yana &gt; Shreya</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Shreya is lighter than Priya</span><br><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">→ </span><span st .</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only statement I is implicit </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I &amp; II are implicit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II is implicit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None </span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Analysis:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The statement talks about developing unhackable global communication networks through a quantum satellite, which clearly assumes that </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">quantum satellites can be used as a communication method</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Assumption I is implicit.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The use of the word unhackable suggests a contrast with existing systems, implying that </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">current communication networks are vulnerable to hacking</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Assumption II is also implicit.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Assumption I and Assumption II are implicit.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statements:</span><br><span style=\"font-family:'Cambria Math'\">X ≥ Y &lt; Z = A &gt; B ≤ C</span><br><span style=\"font-family:'Cambria Math'\">Conclusions:</span><br><span style=\"font-family:'Cambria Math'\">I. X &gt; B</span><br><span style=\"font-family:'Cambria Math'\">II. Y ≤ A</span><br><span style=\"font-family:'Cambria Math'\">III. Z ≥ C</span><br><span style=\"font-family:'Cambria Math'\">Which of the above conclusions are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II &amp; III</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements:</span><br><span style=\"font-family:'Cambria Math'\">X ≥ Y &lt; Z = A &gt; B ≤ C</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">X ≥ Y</span><span style=\"font-family:'Cambria Math'\">, but </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Y</span><span style=\"font-family:'Cambria Math'\"> may be less than </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">B</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">X &gt; B</span><span style=\"font-family:'Cambria Math'\"> not sure </span><span style=\"font-family:'Symbol'\">✘</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">From </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Y &lt; Z = A</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Y &lt; A</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Y ≤ A</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Symbol'\">✔</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">A &gt; B ≤ C</span><span style=\"font-family:'Cambria Math'\"> → no fixed relation between </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">A (Z)</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">C</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Symbol'\">✘</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Conclusion: Only II</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Omi initially faces the west. Turning to his left, he walks 3  </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dioptres (D)</span><span style=\"font-family:'Cambria Math'\">, which is the reciprocal of focal length (in metres).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Zoji La Pass connects which of the following two locations?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Leh and Kargil</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Srinagar and Leh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shimla and Tibet</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gangtok and Lhasa</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Srinagar and Leh</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Zoji La Pass</span><span style=\"font-family:'Cambria Math'\"> lies on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Srinagar–Leh National Highway</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It connects the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kashmir Valley (Srinagar)</span><span style=\"font-family:'Cambria Math'\"> with </span><span style=\"font-weight:bold;font-family:'Cambria ly:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct statements:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1, 2 and 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Qutb-ud-din Aibak</span><span style=\"font-family:'Cambria Math'\"> was the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">founder of the Slave (Mamluk) Dynasty</span><span style=\"font-family:'Cambria Math'\"> and the first Sultan of Delhi.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Alauddin Khalji</span><span style=\"font-family:'Cambria Math'\"> introduced the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Dagh’ system</span><span style=\"font-family:'Cambria Math'\"> (branding of horses) and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Chehra’ system</span><span style=\"font-family:'Cambria Math'\"> (descriptive rolls of soldiers) to prevent corruption and ensure military efficiency.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Muhammad bin Tughlaq</span><span style=\"font-family:'Cambria Math'\"> shifted the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">capital from Delhi to Devagiri</span><span style=\"font-family:'Cambria Math'\">, later renamed </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Daulatabad</span><span style=\"font-family:'Cambria Math'\">, though the decision was eventually reversed.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 360 of the Indian Constitution relates to which type of Emergency?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">National Emergency</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">State Emergency (President's Rule)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Financial Emergency</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Administrative Emergency</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 360 of the Indian Constitution</span><span style=\"font-family:'Cambria Math'\"> relates to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Financial Emergency</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 360 empowers the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"font-family:'Cambria Math'\"> to proclaim a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Financial Emergency</span><span style=\"font-family:'Cambria Math'\"> when the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">financial stability or credit of India</span><span style=\"font-family:'Cambria Math'\"> is threatened.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">During this emergency, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Centre can give directions to states</span><span style=\"font-family:'Cambria Math'\"> on financial matters, and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">salaries of government servants (including judges)</span><span style=\"font-family:'Cambria Math'\"> may be reduced.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">So far, a Financial Emergency has never been imposed in India.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amoeba acquires its food through which of the following processes?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Exocytosis</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Diffusion</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Photosynthesis</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Endocytosis</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Endocytosis</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amoeba acquires its food by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">endocytosis</span><span style=\"font-family:'Cambria Math'\"> (specifically </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">phagocytosis</span><span style=\"font-family:'Cambria Math'\">), in which it </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">engulfs food particles using pseudopodia</span><span style=\"font-family:'Cambria Math'\"> and forms a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">food vacuole</span><span style=\"font-family:'Cambria Math'\"> for digestion.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Exocytosis</span><span style=\"font-family:'Cambria Math'\"> → removal of waste materials</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Diffusion</span><span style=\"font-family:'Cambria Math'\"> → passive movement of small molecules</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Photosynthesis</span><span style=\"font-family:'Cambria Math'\"> → not performed by Amoeba</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Endocytosis</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regarding the Soils of India, consider these statements and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Alluvial soil is the most widespread soil in India, found mostly in the Indo-Gangetic plains.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Black soil (Regur) is ideal for growing cotton and is rich in iron and lime.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Laterite soil is formed due to intense leaching in areas of high rainfall and temperature</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis – Soils of India</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Alluvial soil</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">most widespread</span><span style=\"font-family:'Cambria Math'\"> in India, predominantly found in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indo-Gangetic plains</span><span style=\"font-family:'Cambria Math'\"> and river valleys.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Black soil (Regur)</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">ideal for cotton cultivation</span><span style=\"font-family:'Cambria Math'\"> and is rich in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">iron and lime</span><span style=\"font-family:'Cambria Math'\"> (with good moisture retention).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 3:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Laterite soil</span><span style=\"font-family:'Cambria Math'\"> forms due to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">intense leaching</span><span style=\"font-family:'Cambria Math'\"> under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">high rainfall and temperature</span><span style=\"font-family:'Cambria Math'\"> conditions.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: All statements are correct.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pandit Shivkumar Sharma, who passed away recently, was a master of which instrument?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Santoor</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sarangi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Shehnai</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sitar</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pandit Shivkumar Sharma</span><span style=\"font-family:'Cambria Math'\"> was a master of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Santoor</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pandit Shivkumar Sharma</span><span style=\"font-family:'Cambria Math'\"> was one of the most renowned Indian classical musicians.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">He </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">popularised the Santoor</span><span style=\"font-family:'Cambria Math'\"> as a solo classical instrument on the Indian classical music stage.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">He belonged to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kashmir Shaivite Santoor tradition</span><span style=\"font-family:'Cambria Math'\"> and significantly contributed to Hindustani classical music.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regarding the Fundamental Rights in the Indian Constitution, consider the following statements and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Right to Property is currently a Fundamental Right under Article 31.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Article 21A provides for free and compulsory education to all children aged 6 to 14 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Fundamental Rights can be suspended during a National Emergency, except Articles 20 and 21.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1,2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct statements:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 and 3 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Right to Property</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">no longer a Fundamental Right</span><span style=\"font-family:'Cambria Math'\">; it was removed by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">44th Constitutional Amendment Act, 1978</span><span style=\"font-family:'Cambria Math'\"> and is now a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">legal right under Article 300A</span><span style=\"font-family:'Cambria Math'\">, so statement 1 is incorrect.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 21A</span><span style=\"font-family:'Cambria Math'\"> provides for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">free and compulsory education</span><span style=\"font-family:'Cambria Math'\"> to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">all children aged 6 to 14 years</span><span style=\"font-family:'Cambria Math'\">, making statement 2 correct.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">During a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">National Emergency</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fundamental Rights can be suspended</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">except Articles 20 and 21</span><span style=\"font-family:'Cambria Math'\">, which always remain in force—so statement 3 is correct.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to Indian Classical Dance, consider these statements and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Bharatanatyam is the oldest classical dance form of India, originating in Tamil Nadu.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Kathak is characterized by intricate footwork and 'Chakkars' (pirouettes).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Sattriya is a classical dance form that originated in the state of Odisha.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct statements:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 and 2 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharatanatyam</span><span style=\"font-family:'Cambria Math'\"> is considered the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">oldest classical dance form of India</span><span style=\"font-family:'Cambria Math'\"> and originated in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tamil Nadu</span><span style=\"font-family:'Cambria Math'\"> — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathak</span><span style=\"font-family:'Cambria Math'\"> is well known for its </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">intricate footwork (tat te thai)</span><span style=\"font-family:'Cambria Math'\"> and fast </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">‘Chakkars’ (pirouettes)</span><span style=\"font-family:'Cambria Math'\"> — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sattriya</span><span style=\"font-family:'Cambria Math'\"> originated in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assam</span><span style=\"font-family:'Cambria Math'\">, not Odisha — so </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">statement 3 is incorrect</span><span style=\"font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regarding the Five-Year Plans (FYP) of India, consider these statements and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The First FYP (1951-56) focused primarily on the development of the agricultural sector.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Second FYP was based on the Mahalanobis Model and focused on heavy industries.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. The Planning Commission was replaced by NITI Aayog in 2015.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct statements:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1, 2 and 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">First Five-Year Plan (1951–56)</span><span style=\"font-family:'Cambria Math'\"> gave </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">primary emphasis to agriculture</span><span style=\"font-family:'Cambria Math'\">, irrigation, and food security to stabilise the economy after Independence.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Second Five-Year Plan (1956–61)</span><span style=\"font-family:'Cambria Math'\"> was based on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mahalanobis Model</span><span style=\"font-family:'Cambria Math'\"> and focused on the development of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">heavy and basic industries</span><span style=\"font-family:'Cambria Math'\"> to build long-term industrial capacity.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Planning Commission</span><span style=\"font-family:'Cambria Math'\"> was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">replaced by NITI Aayog in 2015</span><span style=\"font-family:'Cambria Math'\">, marking a shift from centralised planning to a more cooperative and policy-oriented approach.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about Earthquakes and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The point on the Earth's surface directly above the focus is called the Epicenter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. P-waves are longitudinal waves and can travel through solids, liquids, and gases.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. S-waves are faster than P-waves.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis – Earthquakes</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">epicenter</span><span style=\"font-family:'Cambria Math'\"> is the point on the Earth’s surface </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">directly above the focus (hypocenter)</span><span style=\"font-family:'Cambria Math'\"> where the earthquake originates.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">P-waves (Primary waves)</span><span style=\"font-family:'Cambria Math'\"> are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">longitudinal waves</span><span style=\"font-family:'Cambria Math'\"> and can travel through </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">solids, liquids, and gases</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 3:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">S-waves (Secondary waves)</span><span style=\"font-family:'Cambria Math'\"> are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">slower than P-waves</span><span style=\"font-family:'Cambria Math'\"> and can travel </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only through solids</span><span style=\"font-family:'Cambria Math'\">, not through liquids.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer: Statements 1 and 2 only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In economic terms, 'Repo Rate' refers to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rate at which banks lend to the public.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rate at which RBI lends to commercial banks for short-term.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rate at which RBI borrows from commercial banks.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rate of interest on savings accounts.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In economic terms, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Repo Rate</span><span style=\"font-family:'Cambria Math'\"> refers to:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: (B) The rate at which RBI lends to commercial banks for short-term.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Repo Rate</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">interest rate at which the Reserve Bank of India (RBI)</span><span style=\"font-family:'Cambria Math'\"> lends </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">short-term funds to commercial banks</span><span style=\"font-family:'Cambria Math'\"> against government securities.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is a key </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">monetary policy tool</span><span style=\"font-family:'Cambria Math'\"> used by RBI to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">control inflation and liquidity</span><span style=\"font-family:'Cambria Math'\"> in the economy.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">An </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">increase in repo rate</span><span style=\"font-family:'Cambria Math'\"> makes borrowing costlier for banks, while a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">decrease</span><span style=\"font-family:'Cambria Math'\"> makes loans cheaper, influencing overall credit flow.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which medieval Gujarat ruler handed over the territory of Diu to the Portuguese in 1534?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ahmad Shah</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahmud Begarha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bahadur Shah</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Muzaffar Shah II</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The medieval Gujarat ruler who handed over the territory of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Diu to the Portuguese in 1534</span><span style=\"font-family:'Cambria Math'\"> was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bahadur Shah of Gujarat</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1534</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sultan Bahadur Shah of Gujarat</span><span style=\"font-family:'Cambria Math'\"> signed the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Treaty of Bassein</span><span style=\"font-family:'Cambria Math'\"> with the Portuguese.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under this treaty, he </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">ceded Diu</span><span style=\"font-family:'Cambria Math'\"> to the Portuguese in return for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">military assistance</span><span style=\"font-family:'Cambria Math'\"> against Mughal pressure.</span></li><li style=\"margin-left:10.52pt;padding-left:7.4 static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509592634_image041.png\" width=\"271\" height=\"228\" alt ></p>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The line graph shows the production (in tonnes) and the sales (in tonnes) of a company.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769509592634_image042.png\" width=\"402\" height=\"246\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What percentage (approximately) of the total production of the company is the total sales of the company in all the years together? (correct to 2 decimal places)</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">79.54%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">77.94%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">76.34%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">78.44%</span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total sale of the company in all the years</span><br><span style=\"font-family:'Cambria Math'\">= 450 + 525 + 500 + 400 + 516 = 2391 tonnes</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total production of the company in all the years</span><br><span style=\"font-fam >“wherever you go”</span><span style=\"font-family:'Nirmala UI'\"> modifies the verb </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“will go”</span><span style=\"font-family:'Nirmala UI'\"> and tells where, so it functions as an </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">adverb clause</span><span style=\"font-family:'Nirmala UI'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the voice of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">\"Why did your brother write such a scathing letter?\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why was such a scathing letter written by your brother?</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why is such a scathing letter being written by your brother?</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why had such a scathing letter been written by your brother?</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why such a scathing letter was written by your brother?</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer: Why was such a scathing letter written by your brother?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><span style=\"font-family:'Nirmala UI'\"> The active sentence is in </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">simple past tense</span><span style=\"font-family:'Nirmala UI'\"> (did write). The correct passive form is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">was written</span><span style=\"font-family:'Nirmala UI'\">, and the interrogative word order is properly maintained.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other options are incorrect:</span><br><span style=\"font-family:'Nirmala UI'\">Option 2 (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">is being written</span><span style=\"font-family:'Nirmala UI'\">) is in </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">present continuous tense</span><span style=\"font-family:'Nirmala UI'\">, which changes the tense of the original sentence.</span><br><span style=\"font-family:'Nirmala UI'\">Option 3 (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">had been written</span><span style=\"font-family:'Nirmala UI'\">) is in </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">past perfect tense</span><span style=\"font-family:'Nirmala UI'\">, which is not present in the original sentence.</span><br><span style=\"font-family:'Nirmala UI'\">Option 4 has </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">incorrect interrogative word order</span><span style=\"font-family:'Nirmala UI'\">; in passive questions, the auxiliary verb should come before the subject.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Arrange the following sentences to form a coherent paragraph:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P:</span><span style=\"font-family:'Nirmala UI'\"> He was so tired that he fell asleep alm
