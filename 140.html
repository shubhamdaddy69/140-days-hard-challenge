rmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Vacuum</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Mischievous</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Choose the option that best describes the meaning of the highlighted idiom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"lion’s share\"</span><span style=\"font-family:'Nirmala UI'\"> of the profits went to the director.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A small portion</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">No portion at all</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The largest part</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">An equal share</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer:</span><span style=\"font-family:'Nirmala UI'\"> The largest part</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The idiom </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“lion’s share”</span><span style=\"font-family:'Nirmala UI'\"> means the </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">biggest or major portion</span><span style=\"font-family:'Nirmala UI'\"> of something, usually more than what others receive.</span></p>"}, {"qid": "", "question": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the synonym of the given word:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">PERIPHRASTIC</span></p>", "options": ["\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Concise</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Direct</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Pithy</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Roundabout</span></p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p style=\"margin-bottom:13px\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Correct Answer: </b>Roundabout</span></span></p>\r\n\r\n<p style=\"margin-bottom:13px\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Explanation:</b></span></span></p>\r\n\r\n<p style=\"margin-bottom:13px\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Periphrastic means</b> expressing something in a long, indirect, or unnecessarily wordy way instead of saying it simply and clearly.</span></span></p>\r\n\r\n<p style=\"margin-bottom:13px\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Periphrastic</b> का अर्थ होता है किसी बात को सीधे और संक्षेप में कहने के बजाय घुमा-फिराकर, अनावश्यक शब्दों के साथ कहना।</span></span></p>\r\n\r\n<p style=\"margin-bottom:13px\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\">इसलिए <b>Roundabout</b> इसका सही समानार्थी (synonym) है।</span></span></p>\r\n\r\n<p><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Hindi and English meanings of options:</b></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Concise </b>&mdash; संक्षिप्त &mdash; expressing much in few words; brief and clear</span></span></li>\r\n\t<li><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Direct </b>&mdash; सीधा &mdash; going straight to the point; clear and straightforward</span></span></li>\r\n\t<li style=\"margin-bottom: 13px;\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Pithy </b>&mdash; सारगर्भित, संक्षेप लेकिन प्रभावी &mdash; brief but meaningful and forceful</span></span></li>\r\n\t<li style=\"margin-bottom: 13px;\"><span style=\"font-size:14px;\"><span style=\"font-family:&quot;Nirmala UI&quot;;\"><b>Roundabout</b> &mdash; घुमा-फिराकर कहा हुआ &mdash; indirect and not said in a simple or straightforward way</span></span></li>\r\n</ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the voice of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">\"The researchers are currently investigating the environmental impact caused by the sudden surge in industrial waste disposal near the coastal areas.\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The environmental impact caused by the sudden surge in industrial waste disposal near the coastal areas is currently investigated by the researchers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The environmental impact caused by the sudden surge in industrial waste disposal near the coastal areas is being currently investigated by the researchers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Investigation of the environmental impact caused by the sudden surge in industrial waste disposal near the coastal areas is being done by the researchers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The environmental impact of industrial waste disposal near the coastal areas has been investigated by the researchers.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 2 –</span><span style=\"font-family:'Nirmala UI'\"> The environmental impact caused by the sudden surge in industrial waste disposal near the coastal areas is being currently investigated by the researchers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The active sentence is in </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">present continuous tense</span><span style=\"font-family:'Nirmala UI'\"> (“are currently investigating”), so the passive must also be </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">present continuous</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> is being investigated.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Option 2 correctly retains the tense and meaning.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other options are incorrect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 1:</span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">simple present</span><span style=\"font-family:'Nirmala UI'\"> (“is investigated”), which changes the tense.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"font-family:'Nirmala UI'\"> Changes the sentence structure into a noun phrase (“Investigation of…”), not a true voice change.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">present perfect passive</span><span style=\"font-family:'Nirmala UI'\"> (“has been investigated”), which again changes the tense and meaning.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Convert the following Complex sentence into a Simple sentence: </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">\"Since he was ill, he could not attend the summit.\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">He being ill, he could not attend the summit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Because of his illness, he could not attend the summit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">He was ill and so he did not attend the summit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">His illness prevented him to attend the summit.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 2 –</span><span style=\"font-family:'Nirmala UI'\"> Because of his illness, he could not attend the summit.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">simple sentence</span><span style=\"font-family:'Nirmala UI'\"> uses a phrase instead of a clause.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">“Because of his illness” is a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">prepositional phrase</span><span style=\"font-family:'Nirmala UI'\"> replacing the dependent clause “Since he was ill,” making it a correct simple sentence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other options are incorrect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 1:</span><span style=\"font-family:'Nirmala UI'\"> Grammatically faulty due to repetition (“He being ill, he…”).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"font-family:'Nirmala UI'\"> This is a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">compound sentence</span><span style=\"font-family:'Nirmala UI'\"> (joined by and), not a simple sentence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"font-family:'Nirmala UI'\"> Incorrect construction — it should be “prevented him from attending”, not “prevented him to attend”.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the narration of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The diplomat said to the press, \"I will not comment on the ongoing negotiations until a formal agreement has been signed by both the nations.\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The diplomat told the press that he would not comment on the ongoing negotiations until a formal agreement had been signed by both the nations.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The diplomat said to the press that I will not comment on the ongoing negotiations until a formal agreement was signed by both the nations.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The diplomat informed the press that he will not comment on the ongoing negotiations until a formal agreement had been signed by both the nations.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The diplomat told the press that he would not have commented on the negotiations until a formal agreement was signed.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The diplomat told the press that he would not comment on the ongoing negotiations until a formal agreement had been signed by both the nations.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">This option correctly changes direct to indirect speech:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">“said to” </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> “told”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">“I” </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> “he”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Future tense “will not comment” </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> “would not comment”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Present perfect “has been signed” </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> past perfect “had been signed”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why the other options are incorrect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 2:</span><span style=\"font-family:'Nirmala UI'\"> The diplomat said to the press that I will not comment on the ongoing negotiations until a formal agreement was signed by both the nations.</span><br><span style=\"font-family:'Nirmala UI'\">Incorrect because the pronoun </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“I”</span><span style=\"font-family:'Nirmala UI'\"> is not changed to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“he”</span><span style=\"font-family:'Nirmala UI'\">, the tense </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“will not comment”</span><span style=\"font-family:'Nirmala UI'\"> is not back-shifted to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“would not comment”</span><span style=\"font-family:'Nirmala UI'\">, and </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“said to”</span><span style=\"font-family:'Nirmala UI'\"> should change to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“told”</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"font-family:'Nirmala UI'\"> The diplomat informed the press that he will not comment on the ongoing negotiations until a formal agreement had been signed by both the nations.</span><br><span style=\"font-family:'Nirmala UI'\">Incorrect because </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“will not comment”</span><span style=\"font-family:'Nirmala UI'\"> should change to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“would not comment”</span><span style=\"font-family:'Nirmala UI'\"> in indirect speech. There is also an inconsistency between </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“will”</span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“had been signed”</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"font-family:'Nirmala UI'\"> The diplomat told the press that he would not have commented on the negotiations until a formal agreement was signed.</span><br><span style=\"font-family:'Nirmala UI'\">Incorrect because </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“would not have commented”</span><span style=\"font-family:'Nirmala UI'\"> expresses a past hypothetical situation, which changes the original meaning. The original sentence refers to a future condition, not an unreal past action.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Identify the grammatical error in the given sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The newly appointed manager / together with his subordinates / have completed the audit / before the deadline.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The newly appointed manager</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">together with his subordinates</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">have completed the audit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">before the deadline.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Answer: have completed the audit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The subject is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“The newly appointed manager”</span><span style=\"font-family:'Nirmala UI'\"> (singular). The phrase </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“together with his subordinates”</span><span style=\"font-family:'Nirmala UI'\"> is parenthetical and does not affect the number of the subject. Therefore, the verb should be singular (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">has completed</span><span style=\"font-family:'Nirmala UI'\">, not </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">have completed</span><span style=\"font-family:'Nirmala UI'\">).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Arrange the following sentences to form a coherent paragraph:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P:</span><span style=\"font-family:'Nirmala UI'\"> This shift is driven by the rapid advancement in Generative AI, which can now automate creative tasks previously thought to be uniquely human. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Q:</span><span style=\"font-family:'Nirmala UI'\"> However, this automation also raises significant ethical concerns regarding copyright and the displacement of entry-level workers. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R:</span><span style=\"font-family:'Nirmala UI'\"> The global labor market is currently experiencing a seismic shift in how professional services are delivered. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">S:</span><span style=\"font-family:'Nirmala UI'\"> Therefore, policymakers must balance the benefits of increased productivity with the need for robust social safety nets.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QSPR</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RPQS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QRPS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">RSQP</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct order</span><span style=\"font-family:'Nirmala UI'\">: R </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> P </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> Q </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Start with R</span><span style=\"font-family:'Nirmala UI'\">: “The global labor market is currently experiencing a seismic shift…”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Sets the broad context and introduces the main topic.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Next P</span><span style=\"font-family:'Nirmala UI'\">: “This shift is driven by the rapid advancement in Generative AI…”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Explains the cause of the shift, logically following R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Then Q</span><span style=\"font-family:'Nirmala UI'\">: “However, this automation also raises significant ethical concerns…”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Introduces the key challenges and tensions arising from P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Finally S</span><span style=\"font-family:'Nirmala UI'\">: “Therefore, policymakers must balance the benefits…”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Provides a policy response and conclusion, naturally following the concerns in Q.</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
