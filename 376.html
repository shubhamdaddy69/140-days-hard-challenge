<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>

    <h1 class="start-title">CGL T-2 Mock 2 - Hindi</h1>

        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "<p><span style=\"font-size:22px\"><span style=\"font-family:Calibri,sans-serif\">If interest be compounded half-yearly, then find the amount which will be collected on ₹41,875 at the rate of 16% per annum after 1 year.</span></span></p>\r\n\r\n<p> </p>", "options": ["<p>40,000</p>", "<p>43,000</p>", "<p>48,843</p>", "<p>40,517</p>"], "correct": 3, "marks": "1", "explanation": "<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019036969_html_92644eb0bb76170e.png\" style=\"height:273px; width:298px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     man can row 15 km/hr in still water. When the river is running at     a speed of 4.5 km/hr, then it takes him 2 hr to row to a place     and comes back to the initial point. How much distance did the     man covered in his to and for journey (in km)?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     13.65</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     28.3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     13.0</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     27.3</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019036969_html_432896033452102b.jpg\" width=\"257\" height=\"333\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     vessel contains mixture of oil and water in the ratio 7:4. Using     a separator, 5 litres of water is separated from the vessel and     10 litres of oil is added in the vessel. Find the ratio of water     to oil after separation if initial quantity of the mixture was     407 litres.       </p>     <p style=\"orphans:0;widows:0;text-decoration:none\ >     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Waste:     something that is not necessary</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Waist:     the narrowest part around the middle of your body</span></p>"}, {"qid": "", "question": "<p>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</p>\r\n\r\n<p>(a) The rise and fall/ (b) of the tide are due/ (c) to lunar influence. /(d) No error</p>", "options": ["<p>The rise and fall</p>", "<p>of the tide are due</p>", "<p>to lunar influence</p>", "<p>No error</p>"], "correct": 2, "marks": "1", "explanation": "<p>Option b is the correct answer.</p>\r\n\r\n<p>The &ldquo;rise and fall&rdquo; is a singular subject. Hence singular verb &lsquo;is&rsquo; will be used.</p>\r\n\r\n<p>The correct sentence is: <strong>The rise and fall of the tide is due to lunar influence.</strong></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Identify     the pair of synonyms from the given word.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Camouflage</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Hide</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Reveal</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Disguise</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Pretend</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.  the house that something unusual was about to happen, so I went to the door and waited on the steps.</p>\r\n\r\n<p>B. I did not know what the future held of marvel or surprise for me and anger and bitterness had preyed upon me continually for weeks and a deep languor had succeeded this passionate struggle.</p>\r\n\r\n<p>C. The most important day I remember in all my life is the one on which my teacher, Anne Mansfield Sullivan, came to me and I am filled with wonder when I consider the immeasurable contrasts between the two lives which it connects and it was the third of March, 1887, three months before I was seven years old.</p>\r\n\r\n<p>D. The afternoon sun penetrated the mass of honeysuckle that covered the porch, and fell on my upturned face and my fingers lingered almost unconsciously on the familiar leaves and blossoms which had just come forth to greet the sweet southern spring.</p>\r\n\r\n<p> </p>\r\n\r\n<p> </p>", "options": ["<p>CBAD</p>", "<p>DABC</p>", "<p>CADB</p>", "<p>CDAB</p>"], "correct": 3, "marks": "1", "explanation": "<p>Option c is the correct answer.</p>\r\n\r\n<p>The correct arrangement is: CADB:</p>\r\n\r\n<p><strong>The most important day I remember in all my life is the one on which my teacher, Anne Mansfield Sullivan, came to me and I am filled with wonder when I consider the immeasurable contrasts between the two lives which it connects and it was the third of March, 1887, three months before I was seven years old. On the afternoon of that eventful day, I stood on the porch, dumb, expectant and guessed vaguely from my mother&#39;s signs and from the hurrying to and fro in the house that something unusual was about to happen, so I went to the door and waited on the steps. The afternoon sun penetrated the mass of honeysuckle that covered the porch, and fell on my upturned face and my fingers lingered almost unconsciously on the familiar leaves and blossoms which had just come forth to greet the sweet southern spring. I did not know what the future held of marvel or surprise for me and anger and bitterness had preyed upon me continually for weeks and a deep languor had succeeded this passionate struggle.</strong></p>"}, {"qid": "", "question": "\r\n\r\n<p>Five thousand rupees _________ been spent on different useful commodities.</p>", "options": ["\r\n\r\n<p>Were</p>", "\r\n\r\n<p>Has</p>", "\r\n\r\n<p>Have</p>", "\r\n\r\n<p>Was</p>"], "correct": 3, "marks": "1", "explanation": "\r\n\r\n<p>Option c is the correct answer.</p>\r\n\r\n<p><strong>Rule-: Plural Noun always takes plural verb. </strong></p>\r\n\r\n<p>Hence the correct word to fill in the blank is &ndash; have.</p>\r\n\r\n<p><strong>Confusion: - </strong></p>\r\n\r\n<p><strong>If plural noun is used after cardinal adjectives (one, two, three, four etc.) and if plural noun denotes certain amount, weight, height or period, singular verb will be used. </strong></p>\r\n\r\n<p><strong>In other word we can say that plural number used as a singular unit will take singular verb. </strong></p>\r\n\r\n<p><strong>E.g.- Five thousand rupees is a handsome amount.</strong></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Select the INCORRECTLY spelt word.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Groan</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Guarentee</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Greave</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Gravely</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct spelling is: Guarantee: an unconditional commitment that     something will happen or that something is true. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Groan:</b>     an utterance expressing pain or disapproval. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Greave:</b>     armor plate that protects legs below the knee. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Gravely:</b>     in a grave and sober manner.</span></p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in direct speech.</p>\r\n\r\n<p>Veronica said that she had had a strange experience the day before.</p>", "options": ["<p>Varonica said, &ldquo;I have a strange experience yesterday.&rdquo;</p>", "<p>Varonica said, &ldquo;I have had a strange experience yesterday.&rdquo;</p>", "<p>Varonica said, &ldquo;I had a strange experience yesterday.&rdquo;</p>", "<p>Varonica said, &ldquo;I had had a strange experience yesterday.&rdquo;</p>"], "correct": 3, "marks": "1", "explanation": "<p>Option c is the correct answer.</p>\r\n\r\n<p>It is an indirect speech. So, the third person (she) will change into first person (I). As the sentence is in past perfect tense (had had), it will change to simple past (had). Day before will change to yesterday.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that will improve the highlighted part of the given     sentence. In case no improvement is needed, select 'No     improvement required'.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">I     have been wondering <b>at     taking</b>     cycling as a hobby.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     About taking up</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     No improvement     required</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     On taking to</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     To take up</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is grammatically incorrect and to rectify the     sentence ‘about taking up’ should be used instead of ‘at     taking’.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Wonder     about: To have a strong curiosity about something or someone.   </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct answer is: I have been wondering <b>about     taking up</b>     cycling as a hobby. </span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Identify     the option that arranges the given parts in the correct order to     form a meaningful paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Production, exchange and consumption of goods and services are     among the basic economic activities of life.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     The scarce resources of an economy have competing usages. In     other words, every society has to decide on how to use its scarce     resources.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     In other words, every society has to decide on how to use its     scarce resources.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     In the course of these basic economic activities, every society     has to face scarcity of resources and it is the scarcity of     resources that gives rise to the problem of choice.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BDCA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABDC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BCDA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ADBC</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is – ADBC: <b>Production,     exchange and consumption of goods and services are among the     basic economic activities of life. In the course of these basic     economic activities, every society has to face scarcity of     resources and it is the scarcity of resources that gives rise to     the problem of choice. The scarce resources of an economy have     competing usages. In other words, every society has to decide on     how to use its scarce resources.</b></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted idiom.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     army is <b>bidding     defiance</b>     by going against the government. </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     To follow the     order</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     To defy</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     To enroll in a     fight with neighbouring country</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     To make a     heroic move</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Bid     defiance: behaviour in which you refuse to obey someone or     something; To defy.</span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\"> n;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     NSO’s report on ‘State-wise and Item-wise Value of Output     from Agriculture, Forestry and Fishing’ said, “It may be     perused that the crops sub-sector accounted for 62.4% of the     agriculture and allied sectors in 2011-12, which has gradually     come down to 54.9% in 2020-21.”</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     share of the livestock sub-sector in the agriculture and allied     sectors has increased to 30.58 in 2020-21 from 25.57 per cent in     2011-21. The agriculture and allied sectors comprise four     sub-sectors namely crop, livestock, forestry &amp; logging and     fishing &amp; aquaculture. The share of Forestry and Logging, and     Fishing and Aquaculture too has increased marginally. The share     of forestry and logging has increased from 7.8 per cent in     2011-12 to 8.42 per cent in 2020-21, while the contribution of     fishing and aquaculture rose from 4.19 per cent to 6.08 per cent     during this period. According to the report, the gross value of     output (at constant prices 2011-12) of the Agriculture, Forestry     and Fishing sector (excluding irrigation) was recorded at Rs     26.12 lakh in 2020-21, which was Rs 19.08 lakh crore in 2011-12.     In 2020-21, three states—Uttar Pradesh (Rs 3.11 lakh crore),     Maharashtra (RS 2.46 lakh crore) and Rajasthan (Rs 2.36 lakh     crore)—contributed the most in the gross value of agriculture,     forestry and fishing sector in the country.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Which     of the following statement is NOT correct according to t on:none\">     Only     statement A and B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     statement A</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     statement A and C</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     All     the statement A, B and C</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.      </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Nuclear     Fission: Nuclear fission is a nuclear reaction in which the     nucleus of an atom is bombarded with low-energy neutrons which     splits the nucleus into smaller nuclei. An abundant amount of     energy is released in this process. Nuclear fission reactions are     used in nuclear power reactors since it is easy to control and     produces large amounts of energy.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Nuclear     fusion: Nuclear fusion is a reaction that occurs when two or more     atoms combine together to form to a single heavier nucleus. An     enormous amount of energy is released in this process, much     greater than the energy released during the nuclear fission     reaction.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Fusion     occurs in the sun where the atoms of deuterium and tritium     combine in a high-pressure atmosphere with extremely high     temperatures to produce an output in the form of a neutron and an     isotope of Helium.</span></p>"}, {"qid": "", "question": "\r\n\r\n<p>India rank in Global Hunger Index (GHI) in 2023 is:</p>", "options": ["\r\n\r\n<p>101</p>", "\r\n\r\n<p>121</p>", "\r\n\r\n<p>103</p>", "\r\n\r\n<p>111</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p>The 2023 Global Hunger Index gives India a rank of 111 out of 125 countries. This indicates a hunger severity level of &#39;serious&#39; for the country.</p>\r\n\r\n<p>India ranked 107 out of 121 countries in the Global Hunger Index (GHI) 2022.</p>\r\n\r\n<p>India ranked 101 out of 116 countries in the Global Hunger Index (GHI) 2021.</p>\r\n\r\n<p>The Global Hunger Index (GHI) is a tool for comprehensively measuring and tracking at global, regional, and national levels.</p>\r\n\r\n<p>GHI scores are based on the values of four component indica-tors:</p>\r\n\r\n<p>1. Understanding</p>\r\n\r\n<p>2. Child Stunting</p>\r\n\r\n<p>3. Child wasting</p>\r\n\r\n<p>4. Child mortality</p>\r\n\r\n<p>The GHI score is calculated on a 100-point scale reflecting the se-verity of hunger - zero is the best score (implies no hunger) and 100 is the worst.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     is the largest freshwater lake in the India?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     The     Wular Lake</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Loktak     Lake</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Dal     Lake</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Chilika     Lake</p>"], "correct": 1, "marks": "1", "explanation": "<ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>The Wular      lake in Jammu and Kashmir is the largest freshwater lake in      India.   </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Lake      Baikal in Russia is the world’s largest freshwater lake by      both volume and depth. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Chilika      Lake in Odisha is the largest saline water lake in India.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Vembanad      Lake in Kerala is the </span><span>longest      lake in India</span><span>.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Cholamu      Lake in Sikkim is the </span><span>highest      lake in India.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Lonar      Lake is a notified National Geo-heritage Monument, saline, soda      lake, located at Lonar in Buldhana district, Maharashtra.</span></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     of the following statement is correct about India?</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">           </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>A.     The Finance Commission(FC) is a constitutional body, that     determines the method and formula for distributing the tax     proceeds between the Centre and states, and among the states as     per the Constitutional arrangement and present requirements. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;border:none;padding:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-right:0.1in;margin-bottom:0.1in;border:none;padding:0in\">     B.     Under<span style=\"font-weight:normal\"> Article     280 of the Constitution, the President of India</span> is     required to constitute a Finance Commission at an interval of     five years or earlier.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement A</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Statement     A and B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Neither     Statement A nor B</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Both     the Statement are correct about Finance Commission of India.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      The Finance      Commission (FC) is a constitutional body, that      determines the method and formula for distributing      the <u><a href=\"<a href=\"https://www.drishtiias.com/to-the-points/paper3/goods-and-services-tax-gst-1\" target=\"_blank\" rel=\"noopener\">https://www.drishtiias.com/to-the-points/paper3/goods-and-services-tax-gst-1</a>\" target=\"_blank\">tax</a></u> proceeds      between the Centre and states, and among the states as per      the constitutional arrangement and present requirements.       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      Under      Article 280 of the Constitution, the President of India is      required to constitute a Finance Commission at an interval of      five years or earlier.       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>The      15</span><sup><span>th</span></sup><span> Finance      Commission was constituted by the President of India in Novemb  Uttar    Pradesh.   </span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <span>The    state which share their border with Uttar Pradesh-: </span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <span>Uttarakhand,    Himachal Pradesh, Delhi, Haryana, Rajasthan, Madhya Pradesh,    Chhattisgarh, Bihar and Jharkhand. </span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <br>     </p>    <p style=\"orphans:0;widows:0;text-decoration:none\"><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_24d8c0d85aa2005c.png\" width=\"370\" height=\"246\" > </p>"}, {"qid": "", "question": "\r\n\r\n<p>Which of the following Volcano is active volcano?</p>\r\n\r\n<p> </p>", "options": ["\r\n\r\n<p>Mount Kilauea</p>", "\r\n\r\n<p>Mount Vesuvis</p>", "\r\n\r\n<p>Mount Kilimanjaro</p>", "\r\n\r\n<p>Kulal</p>"], "correct": 1, "marks": "1", "explanation": "\r\n\r\n<p>The correct answer is Mount Kilauea.</p>\r\n\r\n<p>Active Volcano</p>\r\n\r\n<ul>\r\n\t<li>\r\n\t<p>Its vent is open and keep emitting gas, smoke and lava from time to time</p>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Eg: Mount Kilauea &ndash; Hawai Island (USA)</p>\r\n\r\n<p>Stromboli &ndash; Mediterranean sea near Italy</p>\r\n\r\n<p>Dormant Volcano</p>\r\n\r\n<ul>\r\n\t<li>\r\n\t<p>It is the volcano which has not erupted recently but is expected to do so again.</p>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Eg: Mount Vesuvis - Italy</p>\r\n\r\n<p>Extinct Volcano</p>\r\n\r\n<ul>\r\n\t<li>\r\n\t<p>Those volcanoes that scientist consider unlikely to erupt again as these volcanoes have no longer magma supply</p>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Eg: Kilimanjaro and Kulal in Africa</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     of the following police forces has launched the “Operation     Kawach” against drug traffickers? </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra     Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Telangana     Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Delhi     Police</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Assam     Police</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Delhi Police.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     'Operation     Kawach' is focused on saving youth and children from the menace     of drug addiction.        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Important     Central Govt. Scheme:</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_13352cffc647688b.png\" width=\"437\" height=\"215\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">                     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Which of the following is an example of monosaccharides?</p>\r\n\r\n<p>A. Fructose</p>\r\n\r\n<p>B. Sucrose</p>\r\n\r\n<p>C. Starch</p>\r\n\r\n<p>D. Glucose</p>\r\n\r\n<p> </p>", "options": ["<p>Only B</p>", "<p>Both A and D</p>", "<p>Both B and C</p>", "<p>Only C</p>"], "correct": 2, "marks": "1", "explanation": "<p>The correct answer is Fructose and glucose.</p>\r\n\r\n<p>Monosaccharides: Monosaccharides are the simplest carbohydrates; they conform to the general chemical formula (CH<sub>2</sub>O)<sub>x</sub> and are termed simple sugars.</p>\r\n\r\n<p>The three main monosaccharides that we consume are fructose, galactose and glucose.</p>\r\n\r\n<p>Disaccharide: Disaccharide (also called a double sugar) is the sugar formed when two monosaccharides (simple sugars) are joined by glycosidic linkage. Like monosaccharides, disaccharides are soluble in water. Three common examples are Sucrose, Lactose, and maltose.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     of the following constitutional amendment added “The     cooperative Socities”?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     97<sup>th</sup>          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     99<sup>th</sup>          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     101<sup>st</sup>          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     96<sup>th</sup>          </p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is 97</span><sup><span>th</span></sup><span>     Amendment.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>It     Gave constitutional status and protection to cooperative     societies. It made the following three changes in the     constitution.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      made the right to form co-operative societies a fundamental      right (Article 19). </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      included a new Directive Principle of State Policy on the      promotion of co-operative societies.          </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      added a new Part IX-B in the constitutional which is entitled      “The Co-operative societies”.    </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>99</span><sup><span>th</span></sup><span>     Constitutional Amendment-:  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Amendments:<br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      Replaced      the collegium system of appointing judges to the Supreme Court      and High Courts with a new body called the National Judicial      Appointments Commission (NJAC).</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      However,      in 2015, the Supreme Court declared this Amendment Act as      unconstitutional and void. Consequently, the earlier collegium      system became operative again.             </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     101<sup>st</sup>     Amendment-:      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      Introduction      of the Goods and Services Tax</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      Goods      and Services Tax (GST) is an indirect tax (or consumption tax)      used in India on the supply of goods and services. It is a      comprehensive, multistage, destination-based tax: comprehensive      because it has subsumed almost all the indirect taxes except a      few state taxes.</p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     Park was known as Hailey National Park? </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Pench     National Park</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jim     Corbett National Park</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Gir     National Park</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sundarban     National Park</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Jim Corbett National Park.                                         </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>The      Jim Corbett National Park is a part of the largest Corbett Tiger      Reserve; the Project Tiger lies in the Nainital district of      Uttarakhand. The Majestic landscape of Corbett is well-known for      its tiger richness. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Established      in the year 1936 as Hailey National Park, Corbett has the glory      of being India’s oldest and most prestigious National Park. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      is also being honoured as the place where Project Tiger was      first launched in the year 1973. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>This      Unique tiger territory is best known as the father who gave      birth to Project Tiger in India to safeguard the most endangered      species and the Royal wild animal of India called Tigers. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>List     of National Parks in India-: </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Corbett      National Park - (Uttarakhand), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Kanha      National Park - (Madhya Pradesh), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Tadoba      National Park - (Maharashtra), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Madhav      National Park - (M.P.), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Bandhavgarh      National Park - (M.P.), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Kaziranga      National Park - (Assam),</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Bandipur      National Park - (Karnataka), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Bannerghatta      National Park - (Karnataka), </span>      </p>      </li><li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>Gir      National Park – (Gujarat).</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\"><span>‘Shigmo’     is a famous folk dance of which state? </span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Madhya     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Goa</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jharkhand</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Arunachal     Pradesh</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is ‘Goa’.           </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Famous     folk dance of Goa-: Tarangamel, Koli, Dekhni, Fugdi, Shigmo,     Ghode, Modni, Samayi nrutya, Jagar, Ranmale, Gonph, Tonnya mell. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_a36f546581caee2.png\" width=\"444\" height=\"346\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Yashwant     Sagar wetland is designated as Ramsar Sites. It is located in     which state?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Odisha          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Madhya     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Telangana</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil     Nadu</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Madhya Pradesh. Yashwant Sagar wetland is     located in Madhya Pradesh. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Yashwant     Sagar is one of the two Important Bird Areas (IBA) in the Indore     region as well as one of the most important birding sites in     Malwa region of Madhya Pradesh. Presently it is mainly used for     water supply to the city of Indore and is also being used for     fish culture on a commercial scale.        </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_500f947bfab326a9.png\" width=\"444\" height=\"609\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Who     was the first President of the United States?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     George     Washington</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Thomas     Jefferson</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     John     Adams</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Benjamin     Franklin</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is a) George Washington. </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>George      Washington served as the first President of the United States      from 1789 to 1797. He is often referred to as the \"Father      of His Country.\"  </span></p>      </li><li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>He      was also the Continental Army's commander-in-chief during the      American War of Independence.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     of the following organelles is responsible for protein synthesis     in a cell?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Golgi     apparatus</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Endoplasmic     reticulum</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Lysosome</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Nucleus</span></p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is b) Endoplasmic reticulum. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>The      endoplasmic reticulum, specifically the rough endoplasmic      reticulum (RER), is responsible for protein synthesis in a cell.      </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      contains ribosomes on its surface, which are involved in the      production of proteins. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0in\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Endoplasmic      Reticulum is a complex network of tubular membranes exclusively      present in the cytoplasm of the eukaryotic cell.</span></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Golgi     Apparatus functions: Its main function is the packaging and     secretion of proteins. It receives proteins from Endoplasmic     Reticulum. It packages it into membrane-bound vesicles, which are     then transported to various destinations, such as lysosomes,     plasma membrane or secretion. They also take part in the     transport of lipids and the formation of lysosomes.</span></p>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     ancient Indian ruler built the famous Sun Temple at Konark?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Harsha</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Ashoka</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Chandragupta     Maurya</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Narasimhadeva     I</span></p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is d) Narasimhadeva I. </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Narasimhadeva      I, a ruler of the Eastern Ganga dynasty, built the Sun Temple at      Konark in the 13th century. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>The      temple is renowned for its architectural grandeur and intricate      carvings. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_2b99fe1640cc38b9.png\" width=\"378\" height=\"231\" > </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>On      the shores of the Bay of Bengal, bathed in the rays of the      rising sun, the temple at Konarak is a monumental      representation of the sun god Surya's chariot; its 24 wheels are      decorated with symbolic designs and it is led by a team of six      horses.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;text-decoration:none\">    <span>Which    of the following is a characteristic of a perfectly competitive    market?</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">    <span>A    large number of sellers and buyers</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">    <span>Product    differentiation</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">    <span>Control    over market prices by individual firms</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">    <span>Barriers    to entry and exit</span></p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <span>The    correct answer is a) A large number of sellers and buyers. </span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <span>Perfectly    competitive markets are characterized by a large number of sellers    and buyers, all producing and consuming homogeneous products.    Individual firms in such markets have no control over market    prices and face easy entry and exit.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    <span>Types    of market: </span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    Monopoly:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    A    monopolistic market is a market formation with the qualities of a    pure market. A pure monopoly can only exist when one provider    gives a specific service or a product to numerous customers. In a    monopolistic market, the imposing business organisation, or the    controlling organisation, has the overall control of the entire    market, so it sets the supply and price of its goods and services.    E.g. Indian Railway.       </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    Oligopoly:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">    An    oligopoly is a market form with a few firms, none of which can    hold the others back from having a critical impact. The fixation    or concentration proportion estimates the piece of the market    share of the biggest firms. E.g - commercial air travel.     </p>    <p style=\"orphans:0;widows:0;text-decoration:none\">Perfect    competition, Monopolistic competition.     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     state had the highest percentage of scheduled castes population     in India as per the 2011 census?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Punjab</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Uttar     Pradesh</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Tamil     Nadu</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Rajasthan</span></p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Punjab. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>As     per Census 2011, the State of Punjab, has the highest     percentage of Scheduled Caste population amongst all the States     of the Country. The Scheduled Caste population in Punjab is 88.60     lac which is 31.94% of the total population i.e. 277.43 lac of     the State.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Facts-:      </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the highest population density – Bihar </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the lowest population density - Arunachal Pradesh</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Union      territory with least population – Lakshadweep </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the highest population – Uttar Pradesh</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the lowest population – Sikkim </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the highest sex ratio – Kerala </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the lowest sex ration – Haryana</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>State      with the highest literacy rate – Kerala</span></p>      </li><li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>State      with the lowest literacy rate – Bihar.  </span>      </p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Which     national park in India is known for its population of Indian     one-horned rhinoceros?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Kaziranga     National Park</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Jim     Corbett National Park</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Bandipur     National Park</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>Periyar     National Park</span></p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is a) Kaziranga National Park. </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Kaziranga      National Park, located in Assam, is famous for its population of      Indian one-horned rhinoceros. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>It      is a UNESCO World Heritage Site and home to several other      wildlife species.</span></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690019994296_html_889d797c68fe6555.png\" width=\"387\" height=\"219\" > </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>Along      with the iconic Greater one-horned rhinoceros, the park is the      breeding ground of elephants, wild water buffalo, and swamp      deer.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>How     many types of ecological pyramids are present in ecosystem?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Two</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Three</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Four          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Five</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is three. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>There     are three types of ecological pyramids </span>     </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Pyramids      of Number </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Pyramids      of Biomass </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Pyramid      of Energy  </span>      </p>     </li></ol>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>An      ecological pyramid is a graphical representation of the      relationship between the different living organisms at different      trophic levels. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">      <span>Charles      Elton developed the concept of the pyramid of numbers. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>Later,      G.Evylen Hutchinson and Raymond Lindeman developed the idea of      the pyramid of energy or productivity.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Indian     Institute of Technology (IIT) will open its first-ever overseas     campus in which of the following countries? </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Combodia          </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Tanzania</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     USA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Taiwan</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Tanzania.   </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span>Indian     Institute of Technology, IIT Madras will open its first ever     international campus very soon. It will open its international     campus in Zanzibar, Tanzania in October 2023.</span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Who     amongst the following is the author of the new book “RINGSIDE-     Up, Close and Personal on India and Beyond”?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Hardeep     Puri</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Shashi     Tharoor</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Rajdeep     Sardesai</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Dr     Vijay Darda</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     correct answer is Dr Vijay Darda. He is the author of the new     book “RINGSIDE: Up, Close and Personal on India and Beyond.”</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;text-decoration:none\"><span>The      book is a captivating compilation of Darda's weekly articles,      which were published in the Lokmat Media Group newspapers and      other prominent national and regional dailies of the country      between 2011 and 2016.</span></p>     </li></ul>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Given below is a question followed by two statements I and II. Read both statements carefully to decide which one of them is sufficient to answer the question.</span><p><span style=\"font-family:Calibri\">Six people - A, B, C, D, E and F are sitting in a straight line facing north. Who sits to the immediate left of D?</span></p><p><span style=\"font-family:Calibri\">(I) A sits second from one of the extreme ends of the line. Only two people sit between A and B. E sits to the immediate right of C.</span></p><p><span style=\"font-family:Calibri\">(II) C sits third from the left end of the line. Only one person sits between C and F. E sits third to the right of F.</span></p>", "options": ["<span style=\"font-family:Calibri\"> Data in statements I and II together are sufficient to answer the question.</span>", "<span style=\"font-family:Calibri\"> Data in statement I alone is sufficient to answer the question while data in statement II is not.</span>", "<span style=\"font-family:Calibri\"> Data in statements I and II together are not sufficient to answer the question.</span>", "<span style=\"font-family:Calibri\"> Data in statement II alone is sufficient to answer the question while data in statement I is not.</span>"], "correct": 3, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">Statement (I): A sits second from one of the extreme ends of the line. Only two people sit between A and B. E sits to the immediate right of C.</span></p><p><span style=\"font-family:Calibri\">Here, position of D cannot be determined in both the cases, therefore who is sitting to the immediate left of D cannot be answered.</span></p><p><span style=\"font-family:Calibri\">Statement (II): C sits third from the left end of the line. Only one person sits between C and F. E sits third to the right of F.</span></p><p><span style=\"font-family:Calibri\">Here, Either A or B is sitting to the immediate left of D. Thus it cannot be determined. Therefore, Data in statements I and II together are not sufficient to answer the question. </span></p><p><span style=\"font-family:Calibri\">Hence, Option C is correct answer.</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519137653_image001.png\" width=\"285\" height=\"483\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Select the figure from among the given options that can replace the question mark (?) in the following series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uplo ont-family:Calibri\">I. B &gt; F</span></p><p><span style=\"font-family:Calibri\">II. C &lt; A</span></p>", "options": ["<span style=\"font-family:Calibri\"> Only conclusion I is true.</span>", "<span style=\"font-family:Calibri\"> Neither conclusion I nor II is true.</span>", "<span style=\"font-family:Calibri\"> Only conclusion II is true.</span>", "<span style=\"font-family:Calibri\"> Both conclusions I and II are true.</span>"], "correct": 2, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">Conclusion I. B &gt; F </span></p><p><span style=\"font-family:Calibri\">We can see that there is no direct comparison between B and F in the given statement. Therefore, we cannot that B is greater than F. </span></p><p><span style=\"font-family:Calibri\">Hence, conclusion I is false. </span></p><p><span style=\"font-family:Calibri\">Conclusion II. C &lt; A</span></p><p><span style=\"font-family:Calibri\">In the given statement: A = B ≥ C. combining these two equations, we can conclude that A ≥ C. therefore, conclusion II is false. </span></p><p><span style=\"font-family:Calibri\">Hence, neither conclusion I nor II is true. Option C is correct.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Three of the following words are alike in some manner and hence form a group. Which word does NOT belong to that group? (The words must be considered as meaningful English words and must not be grouped based on the number of letters/number of consonants/vowels in the word)</span>", "options": ["<span style=\"font-family:Calibri\"> Clarinet</span>", "<span style=\"font-family:Calibri\"> Flute</span>", "<span style=\"font-family:Calibri\"> Piano</span>", "<span style=\"font-family:Calibri\"> Piccolo</span>"], "correct": 3, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><span style=\"font-family:Calibri\">All the given options are related to musical instrument.</span></p
