<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct option that indicates the arrangement of the following processes in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Chewing</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Absorption in intestines</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Swallowing</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Stomach digestion</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Ingestion</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 3, 1, 4, 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 1, 3, 4, 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 5, 1, 4, 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 3, 4, 1, 2</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (1) 5, 3, 1, 4, 2</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Ingestion (intake of food) → Swallowing → Chewing (oral phase) → Stomach digestion → Absorption.</span></p>"}, {"qid": "", "question": "In पुध थयनक PREDICTION, iी थध नधूिोcध cयnौयnोnपौ थiपु पुध ौहccधधकing ोिूुोृधप ोnक ॅयथिधस थiपु ूनधcधकing ोिूुोृधपौ. Tुधn ुयथ ंोnद ॅयथिधस थiिि पुधनध ृध in पुध nधिथद ीयनंधक थयनक?", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nil</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (3)</span><span style=\"font-weight:bold\"> </span><span>three</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The newly</span><span> </span><span>formed word is:</span><span> </span><span style=\"font-weight:bold\">QSDEHDUHNO</span><span> </span><span>and there are three vowels</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span><span> </span><span>The government plans to promote rooftop solar systems to reduce pressure on large land-based projects.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following can be inferred from the above statement?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Land shortage is a concern for large solar projects.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rooftop solar systems are less effective.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The government has stopped all solar projects.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rooftop solar is banned in India.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Only 1 can be inferred from the statement. Whereas others are unrelated to the statement.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option which shares the same relationship with the third word as the second word shares with the first ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Benzene : Aromatic :: Cyclohexane : ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Aromatic</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alkyne</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturated (non-aromatic)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conjugated</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The correct answer is: (3) Saturated (non-aromatic)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Benzene</span><span> </span><span>is an</span><span> </span><span>aromatic (unsaturated with</span><span style=\"font-weight:bold\"> </span><span>delocalized π)</span><span> </span><span>whereas</span><span> </span><span style=\"font-weight:bold\">Cyclohexane</span><span> </span><span>is a saturated non-aromatic ring.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which letter cluster should come in place of a question mark?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">CUE, FRH, IOK, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KLN</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LJN</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LLN</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LLM</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (3) LLN</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Pattern:</span><span> </span><span>First letter+2= third letter.</span><span> </span><span>Third letter+1=first letter</span><span> </span><span>of the next</span><span> </span><span>set of alphabets. For example; C+2=E+1=F+2=H+1=I+2=K</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Middle letter-3. For example; U-3=R-3=O</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Hence</span><span style=\"font-weight:bold\">, K+1=L, L+2=N, O-3=L; LLN</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Six people are sitting in a row. Some of them are facing north while others are facing south. G sits at the end of the row and faces the north direction. E sits second to the left of G while C sits second to the right of E. Two people sit between C and A. B doesn't sit near E and faces the south direction. Both neighbours of C face the same direction but opposite to C. An equal number of people face the same direction.</span><span> </span><span style=\"font-weight:bold\">What is the position of A with respect to C?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third to the left</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third to the right</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second to the left </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediate left</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (2) Third to the right</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1765242371804_image001.jpeg\" width=\"206\" height=\"101\" alt ></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span><span style=\"font-weight:bold\"> </span><span>all water is salt</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some salt is sugar</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No sugar is water</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusion:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1</span><span>) some salt is not water</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) no sugar is salt</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2 follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither 1 nor 2 follow</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (1) Only 1 follows</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Some salt which is sugar cannot be water.</span><span> </span><span style=\"font-weight:bold\">Hence, 1 follows</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Some parts of sugar are salt.</span><span> </span><span style=\"font-weight:bold\">Hence, 2 does not follows</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1765242371804_image002.jpeg\" width=\"246\" height=\"105\" alt ></p>"}, {"qid": "", "question": " <p style=\"margin-top:0p ach blank.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The philosophical implications of quantum mechanics are immense, particularly concerning the observer effect. The prevailing Copenhagen interpretation posits that a particle exists in a superposition of states until the moment of measurement, at which point its wave function (1) _________ into a single, defined state. This instantaneous transformation raises deeply (2) _________ questions about the nature of objective reality; if properties are not determined prior to detection, the universe cannot be defined by pre-existing, deterministic facts but rather hinges upon an (3) _________ interaction. Such a finding forces us to perpetually re-examine the (4) _________ between the subjective consciousness and the fabric of physical existence.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>autonomous</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>fortuitous</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>indeterminate</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>obsolete</span></p>"], "correct": 3, "marks": "1", "explanation": "\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Quantum interpretation suggests outcomes are</span><span> </span><span style=\"font-weight:bold\">not predetermined</span><span>, but</span><span> </span><span style=\"font-weight:bold\">indeterminate</span><span> </span><span>until measured.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">autonomous (स्वायत्त)</span><span> </span><span> = independent</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">fortuitous (आकस्मिक)</span><span style=\"font-weight:bold\"> </span><span>= unexpectedly</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">obsolete (अप्रचलित)</span><span> </span><span>= outdated</span></p>"}, {"qid": "", "question": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The philosophical implications of quantum mechanics are immense, particularly concerning the observer effect. The prevailing Copenhagen interpretation posits that a particle exists in a superposition of states until the moment of measurement, at which point its wave function (1) _________ into a single, defined state. This instantaneous transformation raises deeply (2) _________ questions about the nature of objective reality; if properties are not determined prior to detection, the universe cannot be defined by pre-existing, deterministic facts but rather hinges upon an (3) _________ interaction. Such a finding forces us to perpetually re-examine the (4) _________ bet an><span style=\"font-weight:bold\">Sentence 2:</span><span> </span><span>Introduces the problem (Raj is tired and stressed).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 1:</span><span> </span><span>Shows his decision to do something about it.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 4:</span><span> </span><span>Describes the effect of his action (walk refreshing him).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 3:</span><span> </span><span>Concludes with the outcome (feeling ready for the day).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Choose the sentence in which the idiom “hit the nail on the head” is used correctly.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>During the meeting, Rina hit the nail on the head by identifying the real cause of the project delay.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The teacher told the students to hit the nail on the head while writing the essay.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>She accidentally hit the nail on the head and hurt her finger.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ravi hit the nail on the head while hammering the broken chair.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Hit the nail on the head</span><span> </span><span>– to describe exactly what is causing a situation or problem. (किसी समस्या या स्थिति का सही कारण बताना या सही बात कहना)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Read the given passage and answer the question that follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The human body maintains its internal temperature close to 37°C through a process known as thermoregulation. This process is controlled primarily by the hypothalamus, which functions like a thermostat. When body temperature rises, mechanisms such as sweating and vasodilation are activated to release excess heat. Conversely, when the temperature drops, the body responds through shivering and vasoconstriction to conserve heat.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>At the cellular level, enzymes play a crucial role in facilitating biochemical reactions, but they are extremely sensitive to temperature fluctuations. Even slight deviations from normal temperature can alter enzyme structure, reducing their efficiency. Prolonged exposure to high temperatures may cause enzymes to denature permanently, disrupting metabolism. Thermoregulation is therefore essential for sustaining enzyme activity and maintaining homeostasis.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Recent research indicates that brown adipose tissue (BAT) also contributes to temperature regulation through non-shivering thermogenesis. Unlike white fat, BAT generates heat by burning calories, especially in infants and during cold exposure. Scientists believe that activating BAT in adults may help manage obesity and metabolic disorders.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>According to the passage, which mechanism is triggered when the body needs to conserve heat?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sweating</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vasodilation</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vasoconstriction</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Increased enzyme activity</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>When the body is cold, it narrows (constricts) its blood vessels to reduce heat loss.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The passage directly mentions:</span><span> </span><span> “the body responds through</span><span> </span><span style=\"font-weight:bold\">shivering and vasoconstriction</span><span> </span><span>to conserve heat.”</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Hence,</span><span> </span><span style=\"font-weight:bold\">C is correct</span><span>.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Read the given passage and answer the question that follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The human body maintains its internal temperature close to 37°C through a process known as thermoregulation. This process is controlled primarily by the hypothalamus, which functions like a thermostat. When body temperature rises, mechanisms such as sweating and vasodilation are activated to release excess heat. Conversely, when the temperature drops, the body responds through shivering and vasoconstriction to conserve heat.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>At the cellular level, enzymes play a crucial role in facilitating biochemical reactions, but they are extremely sensitive to temperature fluctuations. Even slight deviations from normal temperature can alter enzyme structure, reducing their efficiency. Prolonged exposure to high temperatures may cause enzymes to denature permanently, disrupting metabolism. Thermoregulation is therefore essential for sustaining enzyme activity and maintaining homeostasis.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Recent "qid": "", "question": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Read the given passage and answer the question that follows.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The human body maintains its internal temperature close to 37&deg;C through a process known as thermoregulation. This process is controlled primarily by the hypothalamus, which functions like a thermostat. When body temperature rises, mechanisms such as sweating and vasodilation are activated to release excess heat. Conversely, when the temperature drops, the body responds through shivering and vasoconstriction to conserve heat.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>At the cellular level, enzymes play a crucial role in facilitating biochemical reactions, but they are extremely sensitive to temperature fluctuations. Even slight deviations from normal temperature can alter enzyme structure, reducing their efficiency. Prolonged exposure to high temperatures may cause enzymes to denature permanently, disrupting metabolism. Thermoregulation is therefore essential for sustaining enzyme activity and maintaining homeostasis.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Recent research indicates that brown adipose tissue (BAT) also contributes to temperature regulation through non-shivering thermogenesis. Unlike white fat, BAT generates heat by burning calories, especially in infants and during cold exposure. Scientists believe that activating BAT in adults may help manage obesity and metabolic disorders.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Which of the following can be inferred from the passage?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the hypothalamus is damaged, the body&rsquo;s ability to regulate temperature may be impaired.</span><br />\r\n<span> </span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thermoregulation is unnecessary if enzymes adapt to temperature changes.</span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vasodilation is a mechanism used to conserve heat during cold exposure.</span><br />\r\n<span> </span></p>", "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Increasing body temperature always improves metabolic reactions.</span></p>"], "correct": 1, "marks": "1", "explanation": "\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The passage says the hypothalamus acts like a &ldquo;</span><span style=\"font-weight:bold\">thermostat</span><span>.&rdquo;</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>If this thermostat malfunctions &rarr; temperature control fails.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>This is a logical inference, not directly stated.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Hence,</span><span> </span><span style=\"font-weight:bold\">A is correct</span><span>.</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
