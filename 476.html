<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span><span style=\"font-weight:bold\"> </span><span>P ≥ Q = R &gt; S ≤ T &lt; U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. P &gt; S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. R &lt; U</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None follow</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Conclusion 2 is wrong:</span><span> </span><span>Opposite symbols are present between R and U so no defined relation present.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the letter number combination which should come in place of the question mark?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MN20: QL3:: RS25:?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VT8</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VQ8</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UV2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VQ18</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (2) VQ 8</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>first letter +4, second letter −2, number −17.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>R(18)+4</span><span> </span><span>=</span><span> </span><span>V(22), S(19)−2</span><span> </span><span>=</span><span> </span><span>Q(17), 25−17 =</span><span> </span><span style=\"font-weight:bold\">VQ 8.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span><span style=\"font-weight:bold\"> </span><span>The government has announced subsidies for industries adopting eco-friendly technologies to reduce carbon emissions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumptions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. Industries contribute significantly to carbon emissions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. Subsidies will encourage industries to adopt green technologies.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption A is implicit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption B is implicit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both A and B are implicit.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither A nor B is implicit.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (3) Both A and B are implicit.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">How is P related to Q?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. R is the only daughter of Q. S is the mother of R and is the sister of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T, the father of Q is the brother of U. U is the father of P.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 1 is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 2 is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both together are sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None is sufficient</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The correct answer is: (2)</span><span style=\"font-weight:bold\"> </span><span>Statement 2 is sufficient</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">From (1</span><span>) S is mother of R and sister of P. P's gender is not specified</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">From (2</span><span>) T (Q’s father) is brother of U and U is father of P. U and T are siblings so P and Q are cousins.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement 2 is sufficient to answer this question.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Complete the series given below:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3, 5, 9, 17, 33, 65, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>127</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>129</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>131</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>133</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (2) 129</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Each term = (previous ×2) −1; 3×2−1=5, 5×2−1=9, 9×2−1=17 similarly;</span><span> </span><span style=\"font-weight:bold\">65×2−1=129</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A @ B means A &lt; B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A # B means A &gt; B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A $ B means A ≤ B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A % B means A ≥ B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A &amp; B means A = B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span><span style=\"font-weight:bold\"> </span><span>X % Y &amp; Z @ W $ V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I</span><span>. Y &lt; V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. X &lt; V</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither follows</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (1) Only I follows</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>From Y &amp; Z we get Y = Z. Z @ W gives Z &lt; W: so Y &lt; W.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>W $ V gives W ≤ V. Combining Y &lt; W and W ≤ V give Y &lt; V. So</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">I follow.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>For II (X &lt; V): we have X % Y we</span><span> </span><span>get</span><span> </span><span>X ≥ Y. Knowing X ≥ Y and Y &lt; V does not guarantee X &lt; V (X could be ≥ V). So</span><span> </span><span style=\"font-weight:bold\">II does not follow.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement</span><span>: Surveys show that most unemployed youth in India are graduates seeking salaried positions</span><span style=\"font-weight:bold\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Educated youth face higher competition in the job market.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only uneducated people can easily find work.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 follows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2 follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither 1 nor 2 follow</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\ g of the students.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">PQ 3</span><span> </span><span>is related to</span><span> </span><span style=\"font-weight:bold\">NW 12</span><span> </span><span>in a certain way. In the same way,</span><span> </span><span style=\"font-weight:bold\">TS 5</span><span> </span><span>is related to ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RY 14</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RY 4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RU 11</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RU 4</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-weight:bold\">(1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>first letter −2, second letter +6, number +9.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>T(20)−2 = R(18), S(19)+6 = Y(25), 5+9 = 14.</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">Therefore, RY 14</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement I:</span><span> </span><span>The government has decided to increase taxes on cigarettes and tobacco products.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement II:</span><span> </span><span>There is a significant decline in the sale of cigarettes and tobacco products.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is true?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is the cause and Statement II is its effect.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is the cause and Statement I is its effect.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both are independent causes.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both are effects of a common cause.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-weight:bold\">(1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Higher taxes increase prices, leading to reduced sales.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the set in which the numbers are related in the same way as are the numbers of the following sets:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(5, 100, 25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(3, 18, 9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 35 – Operations on 35 such as adding /subtracting /multiplying etc. to 35 can be performed. Breaking down 35 into 3 and 5 and then performing mathematical operations on 3 and 5 is not allowed.)</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(2, 8, 4)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(4, 48, 16)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(6, 25, 36)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(7, 28, 49)</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-weight:bold\">(2)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>First digit</span><span style=\"font-size:8pt;vertical-align:super\">2</span><span>= third digit, third digit× (first digit-1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>= second digit</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>For example; 5</span><span style=\"font-size:8pt;vertical-align:super\">2</span><span>= 25, 25× (5-1)= 100, 3</span><span style=\"font-size:8pt;vertical-align:super\">2</span><span>= 9, 9× (3-1)= 18</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">So, 4</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super\">2</span><span style=\"font-weight:bold\">= 16, 16× (4-1)= 48</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a code language, ‘cat is small’ is coded as 12 6 24, ‘Dog is big’ is coded as 18 6 14. What is the code for “cat”?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><ol type=\"1\"><li><span>The code for ‘small’ is 24.</span></li><li><span>The code for “IS” is a common number in the first two codes.</span></li></ol>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Either 1 or 2 is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2 is sufficient</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>From 1; we get code for ‘small’ and code for ‘is’ already fixed. Hence, we can get code for cat very easily. But from 2; code for cat and small cannot be determined.</span><span> </span><span style=\"font-weight:bold\">Therefore, only 1 is sufficient to give the answer.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the letter cluster that shares the same relationship with the third letter cluster as the second letter cluster shares with the first. ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">DINE: EHPC :: CALL: ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DZKL</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DZNJ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BBKJ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DBKL</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-weight:bold\">(2)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>D+1= E, I-1= H, N+2= P, E-2= C</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">C+1= D, A-1= Z, L+2= N, L-2= J</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>People in a town are protesting because they feel their area is not getting enough development funds. They want the government to take action quickly. You are the officer in charge.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What will you do?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. Listen to the protestors and promise to take their complaint to higher authorities.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. Ignore the protest because it may stop on its own.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C. Use police force to stop the protest immediately.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D. Tell the people to meet after a week when you are free.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only A</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only B</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A and D</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B and C</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (1)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option A</span><span> </span><span>shows responsibility and concern for public issues.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Other options show carelessness or harsh behavior which can increase public anger.</span></p>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What should come in place of question?</span> le=\"font-weight:bold\">Indian Evidence Act, 1872</span><span> </span><span>governed the rules of evidence for over 150 years.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The new Act—</span><span style=\"font-weight:bold\">Bharatiya Sakshya Adhiniyam, 2023</span><span>—updates provisions related to the admissibility of electronic evidence, digital records, and modern investigative methods.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Thus, it</span><span> </span><span style=\"font-weight:bold\">replaces the Indian Evidence Act, 1872</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">The Bharatiya Nyaya Sanhita (BNS) replaces</span><span style=\"font-weight:bold\"> </span><span>Indian Penal Code (IPC), 1860</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">The Bharatiya Nagarik Suraksha Sanhita (BNSS) replaces</span><span style=\"font-weight:bold\"> </span><span>Criminal Procedure Code (CrPC), 1973</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Regarding the Preamble of the Indian Constitution, consi ater overturned in the</span><span> </span><span style=\"font-weight:bold\">Kesavananda Bharati vs. State of Kerala case (1973).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following statements about the Mahasandhivigrahika during Gupta's rule is correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>He was the chief justice of the kingdom and presided over land disputes.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>He supervised irrigation works and public revenue collection.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>He acted as the foreign minister and collaborated closely with the king and military.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>He managed temple endowments and religious affairs.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>During the Gupta period, the</span><span> </span><span style=\"font-weight:bold\">Mahasandhivigrahika</span><span> </span><span>was an important high-ranking official in the central administration.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Mahasandhivigrahika</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline- d insights expressed with exceptional clarity and elegance.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>perspicuity</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>perspecuity</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>perspicuety</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>perspicousity</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Perspicuity (स्पष्टता,</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">सुस्पष्टता, या</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">सहज समझ में आने वाली बात)</span><span> </span><span>– the quality of being clear, easily understood, and intellectually transparent.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It is often used for writing or speech that presents complex ideas with clarity.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Synonyms</span><span style=\"font-weight:bold\"> </span><span>– Lucidity, Clarity, Transparency, Plainness</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Antonyms</span><span style=\"font-weight:bold\"> </span><span>– Obscurity, Ambiguity, Vagueness, Confusion</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parts of the following sentence have been given as options. Select the option that contains an error.</span><br><span>The government, together with several policy advisors, are planning to introduce new regulations to curb the rising inflation, which has alarmed economists nationwide.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The government, together with several policy advisors,</span><br><span> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>are planning to introduce new regulations to curb the</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>rising inflation,</span><span> </span><span>which has alarmed economists nationwide.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No error</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The subject of the sentence is</span><span> </span><span style=\"font-weight:bold\">“The government”</span><span>, which is</span><span> </span><span style=\"font-weight:bold\">singular</span><span>, despite the phrase</span><span> </span><span style=\"font-weight:bold\">“together with several policy advisors”</span><span>. Parenthetical phrases like “together with,” “along with,” or “as well as”</span><span> </span><span style=\"font-weight:bold\">do not change the number of the subject</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Option</span><span> </span><span style=\"font-weight:bold\">b</span><span> </span><span>incorrectly uses</span><span> </span><span style=\"font-weight:bold\">“are planning”</span><span> </span><span>(plural verb). The correct singular verb should be</span><span> </span><span style=\"font-weight:bold\">“is planning.”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option that expresses the given sentence in indirect speech.</span><br><span>The professor said, “Students must submit their assignments by Friday, otherwise they will face a penalty.”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The professor said that students must submit their assignments by Friday, otherwise they will face a penalty.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The professor said that students had to submit their assignments by Friday, otherwise they would face a penalty.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The professor said that students must submit their assignments by Friday, otherwise they would face a penalty.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The professor said students had to submit their assignments by Friday, otherwise they will face a penalty.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When converting into indirect speech:</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The reporting verb “said” remains.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">“must”</span><span> </span><span>(obligation) →</span><span> </span><span style=\"font-weight:bold\">“had to”</span><span> </span><span>(past tense backshift for indirect speech).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">“will”</span><span> </span><span>→</span><span> </span><span style=\"font-weight:bold\">“would”</span><span> </span><span>(future tense backshift).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Indirect speech form:</span><br><span style=\"font-weight:bold\">“The professor said that students had to submit their assignments by Friday, otherwise they would face a penalty.”</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the most appropriate option to fill in the blank:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Even after decades of research, the true nature of dark matter remains a source of persistent scientific ________, challenging physicists worldwide.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>unanimity</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>scrutiny</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>indifference</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>revelation</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sentence highlights that dark matter continues to puzzle scientists and is being closely examined.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Scrutiny (सूक्ष्म जांच / critical examination)</span><span> </span><span>– fits the idea of continuous scientific investigation.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Unanimity (एकमतता)</span><span> </span><span>– opposite of uncertainty.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Indifference (उदासीनता)</span><span> </span><span>– scientists are not indifferent; they are deeply engaged.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Revelation (प्रकाशन / खुलासा)</span><span> </span><span>– implies something already revealed; does not fit the context of mystery.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option that expresses the given sentence in passive voice:</span><br><span>Researchers expect that the newly discovered particle will transform our understanding of quantum interactions.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The newly discovered particle is expected by researchers to have transformed our understanding of quantum interactions.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It is being expected by researchers that our understanding of quantum interactions transforms by the newly discovered particle.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It is expected by researchers that the newly discovered particle will transform our understanding of quantum interactions.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Our understanding of quantum interactions is expected to be transformed by researchers through the newly discovered particle.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option c</span><span> </span><span>correctly uses the impersonal passive structure: It is expected that…</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline- rd substitution for the phrase below:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A person who pretends to have knowledge or skills they do not actually possess.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Charlatan</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Savant</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtuoso</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pedant</span></p>"], "correct": 1, "marks": "1", "explanation": "● Cुोिनोपोn = ो ूधनौयn थुय ीोिसिधद cिोiंौ पय ुोॅध ौूधciोि ाnयिथधकgध यन ौाiििसे ो ीनोहक → ूधनीधcिपद ीiपौ पुध कधौcनiूपiयn.● Sोॅोnप = ो िधोनnधक यन ाnयिथधकgधोृिध ूधनौयn → यूूयौiपध ंधोning.● Viनपहयौय = ो ूधनौयn ुigुिद ौाiििधक in ोn ोनप, धौूधciोििद ंहौic → हnनिधोपधक.● Pधकोnप = ो ूधनौयn यॅधिनद cयncधनnधक थiपु ीयनंोि निहधौ यन ंinयन कधपोiिस → कयधौ nयप iंूिद कधcधiप."}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Choose the correct pair of homonyms to complete the sentence meaningfully.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The ancient maritime law stipulated that a ship owner could not be held ________ for damages that occurred during a major storm, which was considered an ________ of nature.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>liable / act</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>libel / axe</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>libel / act</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>libel / act</span></p>"], "correct": 1, "marks": "1", "explanation": "● िiोृिध / ोcप-य िiोृिध: Lधgोििद नधौूयnौiृिध यन ोnौथधनोृिध ीयन ौयंधपुing.▪ Eसोंूिध: \"Tुध ौुiू यथnधन cयिहक nयप ृध ुिधक िiोृिध ीयन कोंोgधौ...\" (Mधोning: Tुध यथnधन cोnnयप ृध ुिधक िधgोििद नधौूयnौiृिध.)य ोcप: A पुing कयnधे यीपधn हौधक in पुध ूुनोौध \"ोcप यी Gयक\" यन \"ोcप यी nोपहनध,\" नधीधननing पय ोn हnोॅयiकोृिध, nोपहनोि धॅधnप (िiाध ो ंोुयन ौपयनं).▪ Eसोंूिध: \"...थुicु थोौ cयnौiकधनधक ोn ोcप यी nोपहनध.\" (Mधोning: Tुध ौपयनं थोौ ोn हnोॅयiकोृिध nोपहनोि धॅधnप.)● िiृिध / ोसध-य िiृिध: (Nयहn) A ूहृिiौुधक ीोिसध ौपोपधंधnप पुोप iौ कोंोging पय ो ूधनौयnैौ नधूहपोपiयnे ो थनiपपधn कधीोंोपiयn. (Wनयng ंधोning ीयन िधgोि नधौूयnौiृiिiपद.)य ोसध: (Nयहn) A पयिय ीयन cुयूूing थययक. (Wनयng ंधोning.)● िiृिध / ोcप-य िiृिध: (Nयहn) A ूहृिiौुधक ीोिसध ौपोपधंधnप पुोप iौ कोंोging पय ो ूधनौयnैौ नधूहपोपiयn. (Wनयng ंधोning.)य ोcप: (Cयननधcप, ृहप ूोiनधक थiपु पुध थनयng ुयंयnदं.)● िiोृिध / ोसध-य िiोृिध: (Cयननधcप, ृहप ूोiनधक थiपु पुध थनयng ुयंयnदं.)य ोसध: (Nयहn) A पयिय ीयन cुयूूing थययक. (Wनयng ंधोning.)"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
