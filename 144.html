ily:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Kibithu is often referred to as the place where the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sun rises first in India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indira Col</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Northernmost point of India (in Siachen Glacier, Ladakh).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sir Creek</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Located in Gujarat, near the western border with Pakistan.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kanyakumari</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Southernmost tip of mainland India, but not the easternmost.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kibithu</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Correct, as it is the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">easternmost point of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which law states that the total energy of an isolated system remains constant over a period of time?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Motion</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Magnetism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Gravitation</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Conservation</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Law of Conservation</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Law of Conservation of Energy</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> states that the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">total energy of an isolated system remains constant over time</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Energy can neither be created nor destroyed; it only changes from one form to another (e.g., kinetic ↔ potential, chemical ↔ thermal).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This principle is fundamental in physics and applies universally, from mechanical systems to thermodynamics.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Law of Motion</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Newton’s laws deal with motion and forces, not energy conservation.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Law of Magnetism</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Explains magnetic interactions, not energy conservation.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Law of Gravitation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Explains attraction between masses, not energy conservation.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'Mission Karmayogi' is a capacity building program for which group of people?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">School Level Teachers</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rural Health Workers</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Civil Service Officers</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Micro Scale Entrepreneurs</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Civil Service Officers</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mission Karmayogi</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Programme for Civil Services Capacity Building (NPCSCB)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> launched in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">2020</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its objective is to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">transform the Indian civil services</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> into a more </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">competent, professional, and future-ready workforce</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It focuses on:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Continuous learning and training for civil servants.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Building skills in technology, governance, and citizen-centric service delivery.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Creating a digital platform called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">iGOT Karmayogi</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for online learning and capacity building.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">School Level Teachers</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Covered under other education-focused programs, not Mission Karmayogi.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rural Health Workers</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Targeted by health schemes, not this mission.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Micro Scale Entrepreneurs</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Supported by schemes like PMEGP, Mudra Yojana, etc.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which act for the first time made a provision of ₹1 Lakh for the promotion of education in India?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regulating Act 1773 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Charter Act 1813 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Charter Act 1833 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Charter Act 1853 </span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Charter Act 1813</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Charter Act of 1813</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was the first act that made a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">provision of ₹1 lakh per year</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">promotion of education in India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It marked the beginning of the British government’s involvement in Indian education.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The Act also allowed Christian missionaries to enter India and promote education and religious learning.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This provision laid the foundation for later educational reforms, including the famous </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Macaulay’s Minute (1835)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Wood’s Dispatch (1854)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Namo Bharat' Rapid Rail Transit System connects?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Delhi And Mumbai </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mumbai And Pune</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Delhi And Meerut</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bengaluru And Chennai</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Delhi and Meerut</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Namo Bharat” Rapid Rail Transit System (RRTS)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is India’s first semi-high-speed regional rail service.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It connects </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Delhi to Meerut</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (via Ghaziabad), covering about </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">82 km</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The project is being implemented by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Capital Region Transport Corporation (NCRTC)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Trains under this system can run at speeds up to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">160 km/h</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, significantly reducing travel time between Delhi and Meerut.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The service is designed to provide </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fast, reliable, and sustainable public transport</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for commuters in the NCR region.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Method of Election of the President' is borrowed from which Constitution?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">United States of America</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">United Kingdom</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">South Africa</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ireland</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Ireland</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">method of election of the President of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is borrowed from the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Irish Constitution</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In India, the President is elected indirectly by an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Electoral College</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> consisting of:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Elected members of both Houses of Parliament.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Elected members of the Legislative Assemblies of the States and Union Territories.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This system is similar to the one adopted in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ireland</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, where the President is also elected indirectly.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">United States of America</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → President is elected through an Electoral College, but the system is different (directly linked to popular vote).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">United Kingdom</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Has a constitutional monarchy, not an elected President.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">South Africa</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → President is elected by the National Assembly, not through a system like India’s.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 91st Amendment Act, 2003, restricted the size of the Council of Ministers to what percentage of the House?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ten Percent of Members</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fifteen Percent Members</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Twenty Percent Members</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Twenty Five Percent Members</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Fifteen Percent Members</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">91st Constitutional Amendment Act, 2003</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> introduced a restriction on the size of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Council of Ministers</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (both at the Union and State levels).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It states that the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">total number of ministers, including the Prime Minister/Chief Minister, shall not exceed 15% of the total strength of the Lok Sabha/State Legislative Assembly</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This was done to prevent the practice of excessively large councils of ministers, which often led to inefficiency and unnecessary expenditure.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who among the following was the Chairman of the Union Powers Committee of the Constituent Assembly of India?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sardar Vallabhbhai Patel</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dr. Rajendra Prasad</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pandit Jawaharlal Nehru</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alladi Krishnaswami Iyer</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Pandit Jawaharlal Nehru</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Powers Committee</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Constituent Assembly of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was chaired by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pandit Jawaharlal Nehru</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This committee was responsible for recommending the distribution of powers between the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union (Centre)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">States</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its work laid the foundation for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">federal structure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of India, ensuring a strong Centre while allowing autonomy to the States.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sardar Vallabhbhai Patel</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Chaired the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Provincial Constitution Committee</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Advisory Committee on Fundamental Rights, Minorities, and Tribal Areas</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not the Union Powers Committee.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Dr. Rajendra Prasad</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → President of the Constituent Assembly, but not the chairman of this committee.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alladi Krishnaswami Iyer</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → A distinguished member of the Assembly and Drafting Committee, but not the chairman here.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pandit Jawaharlal Nehru</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Correct, as he chaired the Union Powers Committee.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Saptaparni Cave' is located in which of the following cities?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajgir </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pataliputra </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vaishali </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sravasti </span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Rajgir</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Saptaparni Cave</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (also called Saptaparni Gufa) is located near </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rajgir</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in Bihar.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It holds great historical and religious significance in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buddhism</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">After the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahaparinirvana of Buddha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">First Buddhist Council</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was convened here around 483 BCE.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The teachings of Buddha were collected and preserved in this cave.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Thus, Rajgir is directly associated with this important site.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regarding 'Soil Erosion' and Conservation, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1- 'Sheet erosion' occurs when the entire top layer of soil is removed by water over a large area.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- 'Contour ploughing' and 'Terrace farming' are effective methods to prevent erosion in hilly regions.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Both 1 &amp; 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> 'Sheet erosion' occurs when the entire top layer of soil is removed by water over a large area. </span><span style=\"line-height:108%;font-size:12pt;font-family:'Symbol'\">✔</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct — In sheet erosion, thin layers of soil are washed away uniformly by rainwater or surface runoff, reducing soil fertility.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> 'Contour ploughing' and 'Terrace farming' are effective methods to prevent erosion in hilly regions. </span><span style=\"line-height:108%;font-size:12pt;font-family:'Symbol'\">✔</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct —</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Contour ploughing</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">: Ploughing along the natural contours of slopes reduces water runoff and soil loss.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Terrace farming</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">: Creating step-like terraces on slopes slows down water flow and prevents erosion.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thus, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">both statements are correct</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'National Commission for Scheduled Castes' and 'National Commission for Scheduled Tribes' were bifurcated by which amendment?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">65th Amendment </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">89th Amendment </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">92nd Amendment </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">102nd Amendment </span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: 89th Amendment</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">89th Constitutional Amendment Act, 2003</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> bifurcated the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">National Commission for Scheduled Castes and Scheduled Tribes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> into two separate bodies:</span><ol type=\"1\"><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">National Commission for Scheduled Castes (NCSC)</span></li><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">National Commission for Scheduled Tribes (NCST)</span></li></ol></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Before this amendment, a single commission looked after both SC and ST issues.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The bifurcation was done to give </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">focused attention</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to the specific needs and rights of Scheduled Tribes, which were often overshadowed by the larger Scheduled Caste population.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statement describes the 'Repo Rate' accurately?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1- It is the rate at which the RBI lends money to commercial banks against government securities.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- Increasing the repo rate helps in controlling inflation by reducing liquidity in the economy.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Both 1 &amp; 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Repo Rate is the rate at which the RBI lends money to commercial banks against government securities. </span><span style=\"line-height:108%;font-size:12pt;font-family:'Symbol'\">✔</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct — This is the definition of Repo Rate. Banks borrow short-term funds from RBI by selling government securities with an agreement to repurchase them later.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Increasing the repo rate helps in controlling inflation by reducing liquidity in the economy. </span><span style=\"line-height:108%;font-size:12pt;font-family:'Symbol'\">✔</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct — When RBI raises the repo rate, borrowing becomes costlier for banks. This reduces lending to the public, lowers money supply, and helps control inflation.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Thus, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">both statements are correct</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following Harappan sites provides the earliest evidence of a settled agricultural life in the Indian subcontinent?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mohenjodaro </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mehrgarh </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kalibangan </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Banawali</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Mehrgarh</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mehrgarh</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (located in present-day Balochistan, Pakistan) is considered the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">earliest site of settled agricultural life</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in the Indian subcontinent.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Archaeological evidence from Mehrgarh (around </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">7000 BCE</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">) shows:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Cultivation of crops like wheat and barley.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Domestication of animals such as cattle, sheep, and goats.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Use of mud-brick houses and storage facilities.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This makes Mehrgarh a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pre-Harappan Neolithic site</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, much earlier than the mature Harappan cities like Mohenjodaro and Kalibangan.</span></li></ul>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the simplified value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1775807583060_image001.png\" width=\"86\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0.000015</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0.00015</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0.0015</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0.015</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1775807583060_image002.png\" width=\"147\" height=\"42\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">= </span><img src=\"https://stati an><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Disuse (प्रयोग का अभाव / उपयोग न होना)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The word </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Desuetude</span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">a state of disuse or inactivity</span><span style=\"font-family:'Nirmala UI'\">, when something is no longer practiced or used. It refers to the condition of being obsolete or neglected. Thus, the synonym is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Disuse</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Meanings of Options</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Disuse (प्रयोग का अभाव / उपयोग न होना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> The state of not being used; neglect. Example: The old law fell into disuse.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Practice (अभ्यास / प्रचलन)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> The actual application or use of an idea, belief, or method. Example: Yoga is a daily practice for her.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Custom (रीति-रिवाज / परंपरा)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> A traditional and widely accepted way of behaving or doing something. Example: Greeting elders respectfully is a custom in many cultures.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Usage (प्रयोग / उपयोग)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> The action of using something; also refers to the way words are used in language. Example: The usage of smartphones has increased rapidly.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the narration of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The traveler remarked, \"I visited the ancient ruins of Hampi last year and was mesmerized by the intricate carvings on the stone pillars.\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The traveler remarked that he visited the ancient ruins of Hampi the previous year and was mesmerized by the intricate carvings on the stone pillars.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The traveler remarked that he had visited the ancient ruins of Hampi the previous year and had been mesmerized by the intricate carvings on the stone pillars.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The traveler remarked that he had visited the ancient ruins of Hampi the last year and was mesmerized by the intricate carvings on the stone pillars.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The traveler remarked that he was visiting the ancient ruins of Hampi the previous year and was mesmerized by the intricate carvings on the stone pillars.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The correct indirect speech is Option B: \"The traveler remarked that he had visited the ancient ruins of Hampi the previous year and had been mesmerized by the intricate carvings on the stone pillars.\"</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Original is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">direct speech</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">(simple past: \"visited\" + \"was mesmerized\"). Indirect rules:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\"remarked\" + comma </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">remarked that</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\".</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Pronoun \"I\" </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">he</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\" (3rd person).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Simple past </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">past perfect</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">(\"had visited\", \"had been mesmerized\").</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\"last year\" </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">the previous year</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\" (backshift time).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why the others are wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option A</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: No tense shift (\"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">visited</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\" + \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">was</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\") – stays direct-like.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option C</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">the last year</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\" (wrong article); mixed tenses (\"had visited\" but \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">was</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\").</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option D</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: \"</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">was visiting</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">\" (wrong tense/original meaning).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Identify the error given in the sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">He and myself / went to / the mall / yesterday evening. </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">He and myself </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">went to </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">the mall </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">yesterday evening. </span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer:</span><span style=\"font-family:'Nirmala UI'\"> a</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">What the error is:</span><br><span style=\"font-family:'Nirmala UI'\">The phrase </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“He and myself”</span><span style=\"font-family:'Nirmala UI'\"> is incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correction:</span><br><span style=\"font-family:'Nirmala UI'\">It should be </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“He and I”</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“Myself”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">reflexive pronoun</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">, which is used only when the subject and object are the same (e.g., </span><span style=\"line-height:108%;font-size:12pt;font-style:italic;font-family:'Nirmala UI'\">I hurt myself</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">). </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Here, the pronoun is part of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">subject</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">, so we need a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">subject pronoun</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">The correct subject pronoun is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“I”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">, not “myself”. </span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct sentence:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">He and I went to the mall yesterday evening.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the voice of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The teacher showed the students the correct method to solve the complex mathematical equation.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct method to solve the complex mathematical equation was being shown to the students.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The students are shown the correct method to solve the complex mathematical equation by the teacher.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The students had been shown the correct method to solve the complex mathematical equation by the teacher.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The students were shown the correct method to solve the complex mathematical equation by the teacher.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The correct passive voice is Option D: \"The students were shown the correct method to solve the complex mathematical equation by the teacher.\"</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The original is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">active voice, simple past</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">(\"showed\") with a direct object (\"the correct method\") and indirect object (\"the students\"). Standard passive conversion:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Object (\"the students\") becomes subject.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Use</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">simple past passive</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: \"were shown\" (+ \"by the teacher\").</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Infinitive phrase (\"to solve...\") stays intact.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why the others are wrong:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option A</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: Wrong tense (\"was</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">being</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">shown\") – continuous, not simple past.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option B</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: Shifts to</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">present</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">(\"are shown\") – mismatches original past tense.</span></li><li style=\"ma rs”</span><span style=\"font-family:'Nirmala UI'\">, we say:</span><br><span style=\"font-family:'Segoe UI Emoji'\">👉</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“the first two chapters”</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Arrange the following sentences to form a coherent paragraph:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P.</span><span style=\"font-family:'Nirmala UI'\"> These particles, known as PM2.5, can penetrate deep into the lungs and even enter the bloodstream. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Q.</span><span style=\"font-family:'Nirmala UI'\"> Recent studies indicate that children living in high-traffic areas are the most vulnerable to these effects. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">R.</span><span style=\"font-family:'Nirmala UI'\"> Long-term exposure to such pollutants is linked to chronic respiratory diseases and heart failure. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">S.</span><span style=\"font-family:'Nirmala UI'\"> Air pollution in metropolitan cities is largely caused by vehicular emissions and industrial smoke.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">SRQP</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">QSRP</span></p>", " <p style=\"margin-top
