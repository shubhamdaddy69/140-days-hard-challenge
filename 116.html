<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 13 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What will come in the place of the question mark (?) in the following equation, if ‘+’ and ‘–’ are interchanged and ‘×’ and ‘÷’ are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(28 ÷ 4) – (15 × 3) + 48 = ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">58</span><span style=\"font-family:'Cambria Math'\">    </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">75</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">62</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">69</span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Original equation: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771332093120_image001.png\" width=\"169\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Interchange the operators</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">'+' becomes '–' and '–' becomes '+'</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">'×' becomes '÷' and '÷' becomes '×'</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771332093120_image002.png\" width=\"170\" height=\"26\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">28 × 4 = 112</span><br><span style=\"font-family:'Cambria Math'\">15 ÷ 3 = 5</span><br><span style=\"font-family:'Cambria Math'\">112 + 5 – 48 = 117 – 48 = 69</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">69</span><span style=\"font-family:'Cambria Math'\"> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the option that represents the correct order of the given words as they would appear in an English dictionary.</span><br><span style=\"font-family:'Cambria Math'\">1. BRILLIANT</span><br><span style=\"font-family:'Cambria Math'\">2. BRITTLE</span><br><span style=\"font-family:'Cambria Math'\">3. BRIGHTON</span><br><span style=\"font-family:'Cambria Math'\">4. BRITISH</span><br><span style=\"font-family:'Cambria Math'\">5. BRIDGESTONE</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3, 1, 5, 2, 4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5, 1, 3, 4, 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5, 3, 1, 4, 2</span><br><span style=\"font-family:'Cambria Math'\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3, 5, 1, 2, 4</span></p>"], "correct": 3, "marks": "1", "explanation": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">All words start with </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">BR</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → compare the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">3rd letter</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">: all I → check </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">4th letter</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">4th letters: BRIDGESTONE (D), BRIGHTON (G), BRILLIANT (L), BRITISH (T), BRITTLE (T) → alphabetical order: D, G, L, T, T.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">For the two T’s (BRITISH, BRITTLE), compare </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">5th letter</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">: I (BRITISH) comes before L (BRITTLE).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Final order:</span><span style=\"font-family:'Cambria Math'\"> 5, 3, 1, 4, 2 </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What will be the next term in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">520, 738, 1010, 1342, 1740, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2197</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2205</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2210</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2193</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><span style=\"font-family:'Cambria Math'\"> The series follows the pattern: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">n³ + n</span><span style=\"font-family:'Cambria Math'\">, where n starts from 8 and increases by 1 for each term.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Check each term:</span></li></ul><ol type=\"1\"><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>520 → 8³ + 8 = 512 + 8 = 520</span></li><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>738 → 9³ + 9 = 729 + 9 = 738</span></li><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>1010 → 10³ + 10 = 1000 + 10 = 1010</span></li><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>1342 → 11³ + 11 = 1331 + 11 = 1342</span></li><li style=\"margin-left:32.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>1740 → 12³ + 12 = 1728 + 12 = 1740</span></li></ol><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Next term:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">n = 13 → 13³ + 13 = 2197 + 13 = 2210</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, 'RAHUL' is coded as 76, and 'POOJA' is coded as 52. How will 'RAJIV' be coded in the same language?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">85</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">92</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">97</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">100</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The rule is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Code = 2 × (Sum of consonants)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let’s verify again clearly:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RAHUL</span><br><span style=\"font-family:'Cambria Math'\">Consonants: R(18), H(8), L(12)</span><br><span style=\"font-family:'Cambria Math'\">Sum = 18 + 8 + 12 = 38</span><br><span style=\"font-family:'Cambria Math'\">Code = 2 × 38 = 76 </span><span style=\"font-family:'Symbol'\">✔</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">POOJA</span><br><span style=\"font-family:'Cambria Math'\">Consonants: P(16), J(10)</span><br><span style=\"font-family:'Cambria Math'\">Sum = 16 + 10 = 26</span><br><span style=\"font-family:'Cambria Math'\">Code = 2 × 26 = 52 </span><span style=\"font-family:'Symbol'\">✔</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now RAJIV</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consonants:</span><br><span style=\"font-family:'Cambria Math'\">R = 18</span><br><span style=\"font-family:'Cambria Math'\">J = 10</span><br><span style=\"font-family:'Cambria Math'\">V = 22</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sum = 18 + 10 + 22 = 50</span></p><p style=\"margin-top e=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Storage of cell sap</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Contains water, ions, sugars, amino acids, and waste products.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Regulation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Helps in osmoregulation and detoxification.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The vacuole can occupy up to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">90% of the plant cell’s volume</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, making it the primary storage and pressure-maintaining organelle.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other options clarified</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lysosome</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Involved in digestion and breakdown of waste, not turgidity.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Golgi apparatus</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria :8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">SHAKTI policy</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Scheme for Harnessing and Allocating Koyala Transparently in India) was launched by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ministry of Power in 2017</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It provides a transparent mechanism for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">allocation of coal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to power producers.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The policy ensures coal supply to independent power producers (IPPs) and state/central generating companies through </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">linkages and auctions</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, reducing dependence on imports.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its aim is to improve efficiency, reduce power costs, and ensure reliable electricity supply.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;li ily:'Cambria Math'\">Supernovae are crucial for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cosmic recycling process</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, as they enrich the interstellar medium with elements that later form new stars and planets.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The \"Pari-Nirvana\" circuit being developed by the Ministry of Tourism connects sites related to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Rama</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Buddha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Krishna</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Mahavira</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Buddha</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pari-Nirvana circuit</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is being developed by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ministry of Tourism, Government of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It connects important sites associated with the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">life and Mahaparinirvana (final salvation)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lord Buddha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The circuit includes places such as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kushinagar (Uttar Pradesh)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, where Buddha attained Mahaparinirvana, and other related Buddhist pilgrimage sites.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This initiative is part of India’s effort to promote </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Buddhist tourism</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and highlight India’s role as the birthplace of Buddhism.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under Indian macroeconomic policy, which of the following is the primary objective of the \"Inflation Targeting\" framework adopted by the Reserve Bank of India (RBI)?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To ensure zero inflation irrespective of growth impact.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To maintain a fixed exchange rate of the rupee against the US dollar.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To achieve a pre-announced quantitative target for money supply growth.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">To maintain price stability while keeping in mind the objective of growth.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">To maintain price stability while keeping in mind the objective of growth</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Inflation Targeting framework</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was formally adopted by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in 2016, with amendments to the RBI Act.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">primary objective</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">price stability</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, i.e., keeping inflation within a pre-announced target range (currently 4% ± 2%).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">At the same time, the RBI must also consider the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">objective of economic growth</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, ensuring that monetary policy does not stifle development.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This makes India’s framework a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">flexible inflation targeting system</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, balancing inflation control with growth needs.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the \"Sangam Age,\" the 'Virakkal' was erected to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mark the boundary of a kingdom.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Record the donations made to a temple.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Commemorate a warrior who died in battle.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Worship the five basic elements of Nature as The God.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Commemorate a warrior who died in battle</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sangam Age</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (early historic period of South India), the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Virakkal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Hero Stone) was a memorial stone erected to honor a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fallen warrior</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> who died bravely in battle.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">These stones often carried </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">inscriptions and carvings</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> narrating the hero’s valor, sacrifice, and sometimes the circumstances of death.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The practice reflects the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">martial culture and values</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of the Sangam society, where bravery and loyalty in warfare were highly esteemed.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which body oversees the \"Weighted Voting\" system in India, where the Union has 1/3rd and States have 2/3rd of the total votes cast?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">NITI Aayog </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Inter-State Council</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Finance Commission </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">GST Council </span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">GST Council</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Goods and Services Tax (GST) Council</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is the constitutional body that oversees the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">weighted voting system</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in India.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In this system:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Government</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> has </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1/3rd of the total votes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">All </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">States collectively have 2/3rd of the total votes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Decisions of the GST Council require at least a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">75% majority of weighted votes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This arrangement ensures a balance between the Centre and the States in shaping GST policies, making it a unique example of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cooperative federalism</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In terms of India’s fiscal policy, which of the following measures is most likely to be adopted by the government to directly reduce demand-pull inflation?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reduce government subsidies</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reduce direct taxes on personal incomes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increase the repo rate through the RBI</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increase capital expenditure on infrastructure projects</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reduce government subsidies</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Demand-pull inflation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> occurs when aggregate demand in the economy exceeds aggregate supply, pushing prices upward.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fiscal policy</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the government can directly influence demand by adjusting </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">taxation and subsidies</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reducing subsidies</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (for fuel, food, electricity, etc.) raises prices of subsidized goods, discourages excess consumption, and thereby </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">reduces aggregate demand</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, helping to control inflation.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why not the other options?</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reduce direct taxes on personal incomes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Increases disposable income, which actually </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">raises demand</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, worsening inflation.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Increase the repo rate through RBI</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → This is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">monetary policy tool</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not fiscal policy.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Increase capital expenditure on infrastructure projects</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Boosts demand and investment, which can </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">increase inflationary pressure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Reduce government subsidies</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Correct; directly curtails demand, making it a fiscal measure against demand-pull inflation.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If the Earth suddenly stops rotating on its axis, the value of 'g' (acceleration due to gravity) at the Equator will:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Decrease</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Remain the same</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increase </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Decrease initially and then increase</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Increase</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">At the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Equator</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the effective acceleration due to gravity (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771332140198_image001.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">) is slightly less than the true gravitational acceleration because of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">centrifugal force</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> caused by Earth’s rotation.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Mathematically:</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771332140198_image002.png\" width=\"133\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">where ω = angular velocity of Earth, and R = radius of Earth at the equator.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">If the Earth suddenly </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">stops rotating</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the centrifugal force disappears.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">As a result, the effective value of g at the equator will </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">increase</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, since there is no longer any reduction due to rotation.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">\"Sial\" and \"Sima\" are terms used to describe the composition of:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Different types of Alluvial soil.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Earth’s Crust.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The layers of the atmosphere.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Local Winds in the continent of Africa.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Earth’s Crust</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sial</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sima</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> are terms used in geology to describe the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">composition of the Earth’s crust</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sial</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Refers to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">upper layer of the continental crust</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, rich in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">silica (Si) and aluminium (Al)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sima</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Refers to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">lower layer of the crust</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, rich in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">silica (Si) and magnesium (Ma)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Together, they explain the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">layered composition</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of the Earth’s crust, with Sial forming the continents and Sima underlying them, extending towards the oceanic crust.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Devendra Jhajharia, a prominent Indian Athlete, is associated with which sport?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Steeplechase</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Boxing</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Power Lifting</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Javelin Throw</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Javelin Throw</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Devendra Jhajharia</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is one of India’s most celebrated </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Paralympic athletes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, specializing in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Javelin Throw</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">He made history by becoming the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first Indian Paralympian to win two gold medals</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Athens 2004 and Rio 2016) in Javelin Throw.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">He also won a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">silver medal at Tokyo 2020</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, further cementing his legacy.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Jhajharia is known for his exceptional skill, determination, and contribution to Indian sports, inspiring countless athletes.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which one of the following Fundamental Rights cannot be suspended even during a Proclamation of Emergency under Article 352?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to move freely throughout the territory of India.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to freedom of speech and expression.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Protection in respect of conviction for offences.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Right to practice any profession or to carry on any occupation.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Protection in respect of conviction for offences</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Under </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 20 of the Indian Constitution</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, certain protections are guaranteed to individuals in respect of conviction for offences:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">No </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ex post facto law</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (you cannot be punished for an act that was not an offence when committed).</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">No </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">double jeopardy</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (you cannot be prosecuted and punished for the same offence twice).</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">No </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">self-incrimination</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (you cannot be compelled to be a witness against yourself).</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">These protections are considered so fundamental that they </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cannot be suspended even during a Proclamation of Emergency under Article 352</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Indian classical dance form is famous for its intricate feet percussions called ‘Tatkaar’?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odissi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manipuri</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sattriya</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathak</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathak.</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kathak</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, one of the major classical dance forms of North India, the hallmark is its </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">intricate footwork (Tatkaar)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Tatkaar refers to the rhythmic stamping of feet on the floor, producing complex patterns that synchronize with the tabla or pakhawaj.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Dancers wear </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ghungroos (ankle bells)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to accentuate the beats, making the percussive footwork a central feature of Kathak.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This element distinguishes Kathak from other classical dance forms, which emphasize different aspects (e.g., sculpturesque poses in Odissi, graceful circular movements in Manipuri, storytelling in Sattriya).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rennin enzyme is found in which body part of infants/small children?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Stomach</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Liver</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pancreas</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gall Bladder</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Stomach.</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rennin</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (also called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">chymosin</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">) is an enzyme found in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">stomach of infants and small children</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Its primary role is to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">curdle milk</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> by converting soluble casein into insoluble paracasein, which helps in the digestion of milk proteins.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In adults, rennin is largely replaced by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pepsin</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, but in infants it is crucial for efficient milk digestion.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The excavation at 'Hastinapur' between 1950-52, which linked the site to the Mahabharata period, was led by:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">N. P. Chakravarti</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">B.B. Lal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">M. N. Deshpand lanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Oil of Vitriol</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is the old name for </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sulfuric Acid (H₂SO₄)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The term “vitriol” comes from the Latin word vitriolum meaning “glassy,” because sulfuric acid was historically obtained by distilling green vitriol (iron sulfate crystals).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is a highly corrosive mineral acid, widely used in industry for fertilizers, dyes, petroleum refining, and chemical synthesis.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other options clarified</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Boric Acid</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Mild antiseptic, not called Oil of Vitriol.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nitric Acid</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Known as Aqua Fortis, not Oil of Vitriol.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hydrochloric Acid</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Known as Muriatic Acid, not Oil of Vitriol.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">\"Thullal\" is a solo satirical dance-drama performing art from which state?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerela</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Telangana</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil Nadu</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Thullal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a traditional performing art of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, created by the poet </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kunchan Nambiar</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in the 18th century.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">solo satirical dance-drama</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, performed with rhythmic movements, expressive gestures, and verses sung in Malayalam.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The art form uses humor and satire to criticize social evils, hypocrisy, and corruption, making it both entertaining and thought-provoking.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">There are three main types of Thullal: </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ottan Thullal, Seethankan Thullal, and Parayan Thullal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, each with variations in costume, rhythm, and performance style.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who among the following was the founder of the \"Varkari Sect\" in Maharashtra?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tukaram</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Namdev</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Eknath</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dnyaneshwar </span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dnyaneshwar (Jnaneshwar).</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Varkari Sect</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in Maharashtra was founded in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;
