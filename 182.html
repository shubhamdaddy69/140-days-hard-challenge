rgin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. It replaces the Indian Penal Code (IPC), 1860.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. It has 358 sections, compared to 511 in the IPC.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. For the first time, 'Community Service' has been introduced as a form of punishment for petty offences.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: 1, 2 &amp; 3 All</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharatiya Nyaya Sanhita (BNS), 2023</span><span style=\"font-family:'Cambria Math'\"> has been enacted to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">replace the Indian Penal Code (IPC), 1860</span><span style=\"font-family:'Cambria Math'\">, which was a colonial-era law.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The BNS has been </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">restructured and simplified</span><span style=\"font-family:'Cambria Math'\">, containing </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">358 sections</span><span style=\"font-family:'Cambria Math'\">, whereas the IPC had </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">511 sections</span><span style=\"font-family:'Cambria Math'\">, making the new law more concise.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">For the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first time</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">community service</span><span style=\"font-family:'Cambria Math'\"> has been introduced as a form of punishment for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">petty offences</span><span style=\"font-family:'Cambria Math'\">, reflecting a reformative and restorative approach to justice.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">all three statements are correct</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements and answer which of them is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Brahmaputra is known as 'Tsangpo' in Tibet and 'Meghana' in Bangladesh.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Majuli island, the largest river island in the world, is located on Brahmaputra.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: 2 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"font-family:'Cambria Math'\"> The Brahmaputra is known as 'Tsangpo' in Tibet and 'Meghana' in Bangladesh.</span><br><span style=\"font-family:'Cambria Math'\">This statement is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">incorrect</span><span style=\"font-family:'Cambria Math'\">. While the Brahmaputra is indeed called </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tsangpo</span><span style=\"font-family:'Cambria Math'\"> in Tibet, in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bangladesh it is known as the Jamuna</span><span style=\"font-family:'Cambria Math'\">, not the Meghna. The Meghna is a different river that later joins the Padma–Jamuna system.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"font-family:'Cambria Math'\"> The Majuli island, the largest river island in the world, is located on Brahmaputra.</span><br><span style=\"font-family:'Cambria Math'\">This statement is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Majuli Island</span><span style=\"font-family:'Cambria Math'\">, located in Assam, lies on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Brahmaputra River</span><span style=\"font-family:'Cambria Math'\"> and is recognized as the world’s largest river island.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only statement 2 is correct</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The famous 'Vaikom Satyagraha' (1924-25) was related to which societal matter?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Land Revenue</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Salt Tax</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Untouchability in Temples</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Widow Remarriage and Sati</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Untouchability in Temples</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vaikom Satyagraha (1924–25)</span><span style=\"font-family:'Cambria Math'\"> was a major social reform movement in Travancore (present-day Kerala) aimed at </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">abolishing untouchability</span><span style=\"font-family:'Cambria Math'\">. It specifically fought for the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">right of lower-caste people to use public roads surrounding temples</span><span style=\"font-family:'Cambria Math'\">, which were denied to them due to caste discrimination. The movement played a significant role in advancing temple entry reforms and social equality.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Land Revenue</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; the movement was not related to taxation or land issues.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Salt Tax</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; this was associated with the Civil Disobedience Movement, not Vaikom Satyagraha.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Widow Remarriage and Sati</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; these were separate social reform issues addressed in earlier reform movements.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arrange the following Himalayan ranges from North to South:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Pir Panjal Range</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Ladakh Range</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Zanskar Range</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4. Karakoram Range</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3-4-2-1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2-1-3-4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1-2-3-4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4-2-3-1</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: 4-2-3-1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">From </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">north to south</span><span style=\"font-family:'Cambria Math'\">, the Himalayan ranges are arranged as follows:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Karakoram Range (4)</span><span style=\"font-family:'Cambria Math'\"> – northernmost</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ladakh Range (2)</span><span style=\"font-family:'Cambria Math'\"> – south of Karakoram</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Zanskar Range (3)</span><span style=\"font-family:'Cambria Math'\"> – south of Ladakh</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pir Panjal Range (1)</span><span style=\"font-family:'Cambria Math'\"> – southernmost (part of the Lesser Himalayas)</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a \"Vestigial Organ\" in humans?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Appendix</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kidney</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Spleen</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pancreas</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Appendix</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">A </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">vestigial organ</span><span style=\"font-family:'Cambria Math'\"> is one that has </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">lost most or all of its original function</span><span style=\"font-family:'Cambria Math'\"> through evolution.</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">appendix</span><span style=\"font-family:'Cambria Math'\"> in humans is considered vestigial, as it no longer plays a major role in digestion.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kidney</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it is essential for filtering blood and maintaining fluid balance.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Spleen</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it plays an important role in immunity and blood filtration.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pancreas</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it is vital for digestion and blood sugar regulation.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the chemical name of \"Baking Soda\"?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sodium Carbonate </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sodium Bicarbonate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Calcium Hypochlorite</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sodium Hydroxide</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sodium Bicarbonate</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Baking Soda</span><span style=\"font-family:'Cambria Math'\"> is chemically known as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sodium Bicarbonate (NaHCO₃)</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is a mild alkali used in cooking (as a leavening agent), cleaning, and neutralizing acids.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sodium Carbonate (Na₂CO₃)</span><span style=\"font-family:'Cambria Math'\"> → Washing soda, not baking soda.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Calcium Hypochlorite (Ca(OCl)₂)</span><span style=\"font-family:'Cambria Math'\"> → Used as a bleaching agent and disinfectant.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sodium Hydroxide (NaOH)</span><span style=\"font-family:'Cambria Math'\"> → Caustic soda, a strong base, not baking soda.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When a bus starts suddenly, the passengers tend to fall backwards. This is an example of which law?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conservation of Momentum</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Newton’s Second Law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Inertia</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Law of Angular Momentum</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Law of Inertia</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When a bus starts suddenly, the lower part of the passenger’s body moves forward with the bus, but the upper part tends to remain at rest due to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">inertia</span><span style=\"font-family:'Cambria Math'\">. This causes the passenger to fall backward. This phenomenon illustrates </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Newton’s First Law of Motion</span><span style=\"font-family:'Cambria Math'\">, also known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Law of Inertia</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Conservation of Momentum</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; this applies to isolated systems with no external forces.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Newton’s Second Law</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it relates force to mass and acceleration.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Law of Angular Momentum</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it deals with rotational motion, not linear motion.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With respect to Hindu Rate of Growth, which among the following options is correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It refers to the growth of the agricultural sector.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is a term coined by Amartya Sen.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It refers to the growth rate of the religious population. </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It refers to the low annual growth rate of the Indian economy (1950s-1980s).</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: It refers to the low annual growth rate of the Indian economy (1950s–1980s).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindu Rate of Growth</span><span style=\"font-family:'Cambria Math'\"> refers to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">slow economic growth rate (around 3–4% per year)</span><span style=\"font-family:'Cambria Math'\"> experienced by India roughly from the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1950s to the late 1980s</span><span style=\"font-family:'Cambria Math'\">, before economic liberalization. The term was used critically to describe stagnation caused by factors like heavy regulation, licensing, and limited industrial expansion.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">It refers to the growth of the agricultural sector.</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it refers to overall economic growth, not just agriculture.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">It is a term coined by Amartya Sen.</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; the term is commonly attributed to economist </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Raj Krishna</span><span style=\"font-family:'Cambria Math'\">, not Amartya Sen.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">It refers to the growth rate of the religious population.</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; the term has no relation to religion or population growth.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Aral Sea', often mentioned in environmental reports, is located between which two countries?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kazakhstan and Uzbekistan</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Iran and Iraq</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Turkey and Armenia</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Russia and Ukraine</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kazakhstan and Uzbekistan</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✔️</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Aral Sea</span><span style=\"font-family:'Cambria Math'\"> is located in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Central Asia</span><span style=\"font-family:'Cambria Math'\">, between </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kazakhstan (to the north)</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Uzbekistan (to the south)</span><span style=\"font-family:'Cambria Math'\">. It is frequently cited in environmental studies due to one of the world’s worst man-made ecological disasters caused by diversion of rivers for irrigation.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Iran and Iraq</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✖️</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; these countries are located in West Asia and have no geographical connection with the Aral Sea.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Turkey and Armenia</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✖️</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; the Aral Sea is far east of both Turkey and Armenia.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Russia and Ukraine</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✖️</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; these countries border the Black Sea and Sea of Azov, not the Aral Sea.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to the process of photosynthesis in plants, consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Photosynthesis occurs only in the leaves of plants and not in any other green parts.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Chlorophyll absorbs mainly blue and red wavelengths of light for photosynthesis.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Oxygen released during photosynthesis comes from the carbon dioxide absorbed by the plant.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are incorrect?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 and 3 are incorrect</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Photosynthesis occurs only in the leaves of plants and not in any other green parts.</span><br><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><br><span style=\"font-family:'Cambria Math'\">Photosynthesis occurs in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">all green parts</span><span style=\"font-family:'Cambria Math'\"> of the plant that contain chlorophyll, such as green stems and young green fruits, not only in leaves.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chlorophyll absorbs mainly blue and red wavelengths of light for photosynthesis.</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-family:'Cambria Math'\">Chlorophyll absorbs light most efficiently in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">blue and red regions</span><span style=\"font-family:'Cambria Math'\"> of the visible spectrum.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Oxygen released during photosynthesis comes from the carbon dioxide absorbed by the plant.</span><br><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><br><span style=\"font-family:'Cambria Math'\">The oxygen released during photosynthesis comes from the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">splitting of water (H₂O)</span><span style=\"font-family:'Cambria Math'\"> during the light reactions, not from carbon dioxide.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to the Indian freedom struggle, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Non-Cooperation Movement was launched in response to the Jallianwala Bagh massacre and the Khilafat issue.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Quit India Movement was launched before the outbreak of the Second World War.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Non-Cooperation Movement was launched in response to the Jallianwala Bagh massacre and the Khilafat issue.\\</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-family:'Cambria Math'\">The Non-Cooperation Movement (1920) was launched by Mahatma Gandhi as a reaction to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Jallianwala Bagh massacre (1919)</span><span style=\"font-family:'Cambria Math'\"> and to support the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Khilafat Movement</span><span style=\"font-family:'Cambria Math'\">, which aimed to protest against British policies toward the Ottoman Caliphate.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Quit India Movement was launched before the outbreak of the Second World War.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><br><span style=\"font-family:'Cambria Math'\">The Quit India Movement was launched in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">August 1942</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">during</span><span style=\"font-family:'Cambria Math'\"> the Second World War, not before it. The war had begun in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1939</span><span style=\"font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Tungbuk' and 'Pumtong Pulit' are indigenous musical instruments of which tribe, recognized in 2025?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Khasi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gond</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lepcha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bodo</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lepcha</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tungbuk</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pumtong Pulit</span><span style=\"font-family:'Cambria Math'\"> are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">traditional indigenous musical instruments of the Lepcha tribe</span><span style=\"font-family:'Cambria Math'\">. They are associated with the cultural heritage of the Lepcha community of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sikkim and parts of West Bengal</span><span style=\"font-family:'Cambria Math'\"> and were officially recognized in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2025</span><span style=\"font-family:'Cambria Math'\"> as part of efforts to preserve indigenous tribal art forms.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why other options are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Khasi</span><span style=\"font-family:'Cambria Math'\"> – Known for instruments like Tangmuri and Bamboo drums, not Tungbuk or Pumtong Pulit.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Gond</span><span style=\"font-family:'Cambria Math'\"> – Associated with instruments such as Bana and Mandar.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bodo</span><span style=\"font-family:'Cambria Math'\"> – Uses instruments like Kham and Siphung.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In context of Indian Physiography, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Eastern Ghats are more continuous and uniform in height than the Western Ghats.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Western Ghats play a major role in intercepting the southwest monsoon winds.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1️) </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Eastern Ghats are more continuous and uniform in height than the Western Ghats.</span><br><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect.</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Eastern Ghats are discontinuous and irregular</span><span style=\"font-family:'Cambria Math'\">, broken by rivers like the Godavari, Krishna, and Kaveri. In contrast, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Western Ghats are more continuous and have a relatively uniform structure</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2️) </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Western Ghats play a major role in intercepting the southwest monsoon winds.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct.</span><br><span style=\"font-family:'Cambria Math'\">The Western Ghats act as a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">climatic barrier</span><span style=\"font-family:'Cambria Math'\">, forcing the southwest monsoon winds to rise, resulting in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">heavy orographic rainfall</span><span style=\"font-family:'Cambria Math'\"> along the western coastal region.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to the office of the Governor in Indian states, consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Governor holds office during the pleasure of the President.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Governor must be a resident of the state to which he or she is appointed.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. The same person can be appointed as Governor of two or more states.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 &amp; 3 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Governor holds office during the pleasure of the President.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct.</span><br><span style=\"font-family:'Cambria Math'\">The Governor does not have a fixed security of tenure and continues in office </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">as long as the President desires</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2️ </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Governor must be a resident of the state to which he or she is appointed.</span><br><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect.</span><br><span style=\"font-family:'Cambria Math'\">There is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">no constitutional requirement</span><span style=\"font-family:'Cambria Math'\"> that the Governor must belong to or be a resident of the state. In fact, Governors are often appointed from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">outside the state</span><span style=\"font-family:'Cambria Math'\"> to ensure neutrality.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3️ </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">The same person can be appointed as Governor of two or more states.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct.</span><br><span style=\"font-family:'Cambria Math'\">The Constitution allows </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">one person to act as Governor of multiple states simultaneously</span><span style=\"font-family:'Cambria Math'\">, usually as an additional charge.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Chola King assumed the title 'Gangaikonda' after his successful expedition to the North?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajendra I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajaraja I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kulottunga I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aditya I</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Rajendra I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rajendra Chola I</span><span style=\"font-family:'Cambria Math'\"> assumed the title </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Gangaikonda”</span><span style=\"font-family:'Cambria Math'\"> (meaning the one who conquered the Ganga) after his successful </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">northern expedition up to the River Ganga</span><span style=\"font-family:'Cambria Math'\">. He also founded a new capital named </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Gangaikonda Cholapuram</span><span style=\"font-family:'Cambria Math'\"> to commemorate this victory.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rajaraja I</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; he expanded the Chola empire in the south but did not lead the Ganga expedition.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kulottunga I</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; he belonged to a later period and is not associated with the Ganga expedition.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Aditya I</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; he was an early Chola ruler and did not undertake northern campaigns.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is used in the \"Vulcanization\" of rubber?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Phosphorus</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sulphur</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carbon</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Silicon</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sulphur</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vulcanization of rubber</span><span style=\"font-family:'Cambria Math'\"> is the process of heating natural rubber with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">sulphur</span><span style=\"font-family:'Cambria Math'\"> to improve its elasticity, strength, and durability.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This process was discovered by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Charles Goodyear</span><span style=\"font-family:'Cambria Math'\"> in 1839.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sulphur forms cross-links between polymer chains, making rubber less sticky, more resistant to heat, and longer-lasting.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arrange the following events in chronological order:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Third Battle of Panipat</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Battle of Plassey</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Battle of Buxar</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3-2-1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2-3-1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3-1-2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2-1-3</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: 2-1-3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">Let’s look at the years of each event:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Battle of Plassey</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1757</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Third Battle of Panipat</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1761</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Battle of Buxar</span><span style=\"font-family:'Cambria Math'\"> → </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1764</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arranging them from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">earliest to latest</span><span style=\"font-family:'Cambria Math'\">:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">1757 (Plassey) → 1761 (Panipat) → 1764 (Buxar)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So the correct chronological order is:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 → 1 → 3</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Standing Deposit Facility' (SDF) of the RBI is used to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Inject liquidity into the banking system </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Absorb excess liquidity without collateral</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lend money to the government</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Manage foreign exchange reserves</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Absorb excess liquidity without collateral</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Standing Deposit Facility (SDF)</span><span style=\"font-family:'Cambria Math'\"> is a monetary policy tool of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reserve Bank of India (RBI)</span><span style=\"font-family:'Cambria Math'\"> used to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">absorb excess liquidity from the banking system without providing any collateral</span><span style=\"font-family:'Cambria Math'\">. Banks can park their surplus funds with the RBI under this facility.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Inject liquidity into the banking system</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; SDF is used to absorb, not inject, liquidity.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lend money to the government</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; SDF has no relation to government borrowing.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Manage foreign exchange reserves</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; this function is carried out through other RBI mechanisms.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following pairs is INCORRECTLY matched?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Yakshagana : Karnataka </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lavani : Maharashtra</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ghoomar : Rajasthan</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karagattam : Kerala</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Karagattam : Kerala</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Karagattam</span><span style=\"font-family:'Cambria Math'\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">folk dance of Tamil Nadu</span><span style=\"font-family:'Cambria Math'\">, not Kerala. Hence, this pair is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">incorrectly matched</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Yakshagana : Karnataka</span><span style=\"font-family:'Cambria Math'\"> – Correct (traditional dance-drama of Karnataka)</span><br><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lavani : Maharashtra</span><span style=\"font-family:'Cambria Math'\"> – Correct (popular folk dance of Maharashtra)</span><br><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ghoomar : Rajasthan</span><span style=\"font-family:'Cambria Math'\"> – Correct (traditional dance of Rajasthan)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which UNESCO World Heritage site is known as the \"Cradle of Indian Architecture\"?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pattadakal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aihole</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahabalipuram</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hampi</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: Aihole</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aihole, located in Karnataka, is renowned as the \"Cradle of Indian Architecture\" due to its over 120 early Chalukyan temples from the 6th-8th centuries, where architects experimented with styles that evolved into mature Dravidian and Nagara forms.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pattadakal:</span><span style=\"font-family:'Cambria Math'\"> UNESCO site (1987) showcasing the peak of Chalukyan architecture with blended Northern and Southern styles, but not the \"cradle\".</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Aihole:</span><span style=\"font-family:'Cambria Math'\"> Correct. The experimental birthplace of temple architecture under Chalukyas, featuring Lad Khan and Durga temples.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mahabalipuram:</span><span style=\"font-family:'Cambria Math'\"> UNESCO site (1984) famous for Pallava rock-cut monuments like Shore Temple, linked to South Indian coastal style.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hampi:</span><span style=\"font-family:'Cambria Math'\"> UNESCO site (1986) for Vijayanagara ruins, a later medieval architectural marvel, not the origin point.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Philips Curve' shows the relationship between:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Inflation and Unemployment </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tax Rates and Tax Revenue</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Income and Inequality</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Demand and Supply</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Inflation and Unemployment</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Phillips Curve</span><span style=\"font-family:'Cambria Math'\"> illustrates the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">inverse relationship between inflation and unemployment</span><span style=\"font-family:'Cambria Math'\"> in the short run—when inflation is high, unemployment tends to be low, and vice versa.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tax Rates and Tax Revenue</span><br><span style=\"font-family:'Cambria Math'\">This relationship is shown by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Laffer Curve</span><span style=\"font-family:'Cambria Math'\">, not the Phillips Curve.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Income and Inequality</span><br><span style=\"font-family:'Cambria Math'\">This is explained by concepts like the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kuznets Curve</span><span style=\"font-family:'Cambria Math'\">, not the Phillips Curve.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Demand and Supply</span><br><span style=\"font-family:'Cambria Math'\">This relationship is represented by standard </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">demand–supply curves</span><span style=\"font-family:'Cambria Math'\">, not the Phillips Curve.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Revolutionary organization was associated with the Kakori Train Robbery (1925)?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Anushilan Samiti</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ghadar Party</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hindustan Republican Association</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Abhinav Bharat</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Option: Hindustan Republican Association</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kakori Train Robbery (1925)</span><span style=\"font-family:'Cambria Math'\"> was carried out by members of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hindustan Republican Association (HRA)</span><span style=\"font-family:'Cambria Math'\">, a revolutionary organization that aimed to overthrow British rule in India. Prominent revolutionaries involved included </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ram Prasad Bismil, Ashfaqulla Khan, Chandrashekhar Azad, and Rajendra Lahiri</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Anushilan Samiti</span><br><span style=\"font-family:'Cambria Math'\">Incorrect; it was active mainly in Bengal and not associated with the Kakori incident.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;fon -weight:bold;font-family:'Nirmala UI'\">B</span><span style=\"font-family:'Nirmala UI'\">, which should appear at the beginning, not the conclusion.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the correct meaning of the idiom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">“Back to the salt mines”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Following a false lead</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Returning to hard work</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">To solve a complex problem directly</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A hopeless search</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct Option:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Returning to hard work</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The idiom </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“back to the salt mines”</span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">going back to work</span><span style=\"font-family:'Nirmala UI'\">, often after a break, and usually implies that the work is </span><span style=\"font-w
