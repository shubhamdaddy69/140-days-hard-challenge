<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 14 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

ct": 3, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is c.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Irretrievable:</b></span><span>     not able to be retrieved or put right.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Irreparable:</b></span><span>     (of an injury or loss) impossible to rectify or repair.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Irrevocable:</b></span><span>     not able to be changed, reversed, or recovered; final.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Irreconcilable:</b></span><span>     (of ideas or statements) so different from each other that they     cannot be made compatible.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate ANTONYM of the given word.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Digressive</span></span></p>", "options": [" <p>     <span>Rambling</span></p>", " <p>     Pertinent</p>", " <p>     Tangential</p>", " <p>     Discursive</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Digressive:</b></span><span>     moves away from the main subject.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Rambling:</b></span><span>     (of writing or speech) lengthy and confused or inconsequential.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Pertinent:</b></span><span>     relevant or applicable to a particular matter; apposite.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Tangential:</b></span><span>     relating to or along a tangent.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Discursive:</b></span><span>     digressing from subject to subject.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the right order to form a meaningful and coherent     paragraph.<br> A. According to his hypothesis, now known as     the neuron theory, each nerve cell communicates with others     through contiguity rather than continuity.<br> B. The     watershed of all studies of the nervous system was an observation     made in 1889 by Spanish scientist Santiago Ramón y     Cajal.<br> C. It has since been proved that Cajal’s theory is     not universally true, but his central idea has remained an     accurate guiding principle for all further study.<br> D. That     is, communication between adjacent but separate cells     must take place across the space and barriers separating them.</span></span></p>", "options": [" <p>     ADCB</p>", " <p>     BADC</p>", " <p>     BCDA</p>", " <p>     CDAB</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>The     correct order of the sentences to form a coherent paragraph is:</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><i>B.     The watershed of all studies of the nervous system was an     observation made in 1889 by Spanish scientist Santiago Ramón y     Cajal.</i></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><i>A.     According to his hypothesis, now known as the neuron theory, each     nerve cell communicates with others through contiguity rather     than continuity.</i></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><i>D.     That is, communication between adjacent but separate cells must     take place across the space and barriers separating them.</i></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><i>C.     It has since been proved that Cajal’s theory is not universally     true, but his central idea has remained an accurate guiding     principle for all further study.</i></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>So,     the correct answer is (B) BADC.</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that expresses the given sentence in passive voice.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     chef is preparing a delicious meal in the kitchen.</span></span></p>", "options": [" <p>     <span>A     delicious meal is being prepared by the chef in the kitchen.</span></p>", " <p>     <span>A     delicious meal was being prepared by the chef in the kitchen.</span></p>", " <p>     <span>A     delicious meal has been prepared by the chef in the kitchen.</span></p>", " <p>     <span>A delicious meal will be prepared by the chef     in the kitchen.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is a.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Rule:</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Subject     + is/am/are + V1 + Ing + Object ------ Object + is/am/are + being     + V3 + by + subject</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Hence,     the chef is preparing a delicious meal in the kitchen ---- A     delicious meal is being prepared by the chef in the kitchen.</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate option to fill in the blank.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>I     was deeply interested in flying and was making my own _______     with flying machines</span></span></p>", "options": [" <p>     judgements</p>", " <p>     experiments</p>", " <p>     trying</p>", " <p>     indulging</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(a)     </span><span><b>Judgements     -</b></span><span>     This word does not fit the context of the sentence. Judgments are     opinions or decisions formed about something, and they do not     relate directly to making or creating flying machines.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(b)     </span><span><b>Experiments     -</b></span><span>     This is the correct choice. \"Experiments\" refers to     practical activities undertaken to discover or demonstrate     something new. In the context of the sentence, the speaker is     likely conducting experiments with flying machines.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(c)     </span><span><b>Trying     -</b></span><span>     While \"trying\" is a valid word, it doesn't fit as well     in the sentence as \"experiments.\" \"Trying\"     implies making an effort or attempting to do something, but it     doesn't capture the idea of hands-on creative work with flying     machines.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(d</span><span><b>)     Indulging -</b></span><span>     \"Indulging\" means allowing oneself to enjoy something,     often in excess. It doesn't convey the idea of actively engaging     in the process of making flying machines.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>So,     the complete sentence with the correct choice would be: \"I     was deeply interested in flying and was making my own experiments     with flying machines.\" This implies that the speaker is     enthusiastically and creatively working on their own experiments     related to flying machines.</span></span></p>     <p>     <br>      </p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that can be used as a one-word substitution for the     given group of words.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Anything     written in a letter after it is signed</span></span></p>", "options": [" <p>     Corrigendum</p>", " <p>     Manuscript</p>", " <p>     Postcript</p>", " <p>     Postdiction</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is c.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Corrigendum</b></span><span>:     a thing to be corrected, typically an error in a printed book.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Manuscript</b></span><span>:     a book, document, or piece of music written by hand rather than     typed or printed.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Postscript</b></span><span>:     an additional remark at the end of a letter, after the signature     and introduced by ‘PS’.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Postdiction</b></span><span>:     involves explanation after the fact.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentence     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>A.     Environment Education unit of Centre for Science &amp;     Environment has always been working towards providing easy to     understand reading material.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>B.     Their new publication on this subject is an attempt to lend     teachers a helping hand.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>C.     It unfolds in two sections: Climate change: how to make sense of     it all</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     And natural resources how to share &amp; care.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>E.     However, they are introduced to students not as a paragraph to     memorize but as an activity to do.</span></span></p>     <p>     <br>      </p>", "options": [" <p>     ACEBD</p>", " <p>     DBCAE</p>", " <p>     ABCDE</p>", " <p>     BECAD</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option a.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>A     introduces the topic ‘Environment Education Unit'<br> The     pronoun 'their' in sentence 'B' refers to the same.<br> C and D     form a mandatory pair as both of them tell the two topics     discussed in the new publication. Also 'And' in D makes it     obvious that it will follow C<br> In E , 'however' concludes the     paragraph<br> Hence, ABCDE should be the right answer. Option C.</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>A.     As the ship rose to the top of each wave, we could see endless     enormous seas rolling towards us, and the screaming of the wind     and spray was painful to the ears.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>B.     Then we double-lashed everything, went through our life-raft     drill, attached lifelines, donned oilskins and life jackets —     and waited.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>C.     At dawn on January 2, the waves were gigantic. We were sailing     with only a small storm jib and were still making eight knots. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     To slow the boat down, we dropped the storm jib and lashed a     heavy mooring rope in a loop across the stern. </span></span>     </p>     <p>     <br>      </p>", "options": [" <p>     CDAB</p>", " <p>     CADB</p>", " <p>     BDAC</p>", " <p>     BACD</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>The     arrangement CADB presents a logical and coherent flow of     information, moving from the conditions on the ship to the     actions taken to manage the situation and the preparations made     for safety.</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that expresses the given sentence in direct speech.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Tom     said that the burglar had come in through the window.</span></span></p>", "options": [" <p>     <span>Tom said, “The burglar had came in through     the window.”</span></p>", " <p>     <span>Tom     said, “The burglar must have come in through the window.”</span></p>", " <p>     <span>Tom     said, “Did the burglar come in through the window.”</span></p>", " <p>     <span>Tom     said, “The burglar came in through the window.”</span></p>"], "correct": 4, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option d.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Transformation     rule- Direct to Indirect Speech:</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>If     </span><span><b>Reporting     Verb</b></span><span>     (sentence outside inverted comma) is in past tense and </span><span><b>Reported     Speech</b></span><span>     (Sentence inside the inverted comma) then following     transformation occurs-</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Simple     present Tense ------------------------- Simple Past Tense</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Present     Continuous Tense -------------------- Past Continuous Tense.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Present     Perfect Tense -------------------------- Past Perfect tense.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Present     Perfect Continuous Tense ---------- Past Perfect Continuous     Tense.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Other     transformation occurs according to the basic rule of     transformation.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Thus,     the correct direct speech of the given sentence is:</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Tom     said, “The burglar came in through the window.”</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate option to fill in the blank.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>He     would always be late with submissions because he would ________     whatever he was supposed to do.</span></span></p>", "options": [" <p>     <span>prevaricate</span></p>", " <p>     <span>procrastinate</span></p>", " <p>     <span>interrogate</span></p>", " <p>     <span>discriminate</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Prevaricate:</b></span><span>     speak or act in an evasive way.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Procrastinat ans-serif\"><span style=\"font-size:12.0pt\">- Patronized art, literature, and learning</span></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:36px; vertical-align:bottom; width:110px\"> </td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:36px; vertical-align:bottom; width:319px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:12.0pt\">- Developed the famous Vikramashila and Nalanda universities</span></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:31px; vertical-align:bottom; width:110px\"> </td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:31px; vertical-align:bottom; width:319px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:12.0pt\">- Known for their naval power and trade with Southeast Asia</span></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:36px; vertical-align:bottom; width:110px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:12.0pt\">Decline</span></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:36px; vertical-align:bottom; width:319px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:12.0pt\">- Internal struggles and weak rulers contributed to the decline</span></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>What type of electroacoustic transducer is used in a seismograph to measure vibrations in rockets?</p>", "options": ["<p>Pressure transducer</p>", "<p>Temperature transducer</p>", "<p>Ultrasonic transducer</p>", "<p>Piezoelectric transducer</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Piezoelectric transducers are commonly used in seismographs and other vibration monitoring devices. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">When subjected to mechanical vibrations, piezoelectric materials generate electrical signals proportional to the applied mechanical stress or strain. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">These materials are sensitive to changes in pressure or acceleration, making them ideal for measuring seismic vibrations and other dynamic movements, such as those experienced during rocket launches.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Pressure transducers</strong> are devices used to measure pressure changes in a system. They convert the mechanical pressure into an electrical signal that can be measured and analyzed. They are commonly used in various applications, such as monitoring fluid pressures, gas pressures, and atmospheric pressures.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Temperature transducers</strong>, also known as temperature sensors or thermocouples, are devices used to measure temperature changes in a system.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Ultrasonic transducers</strong> are devices that use ultrasonic waves (sound waves with frequencies higher than the human audible range) to measure distances, detect objects, or perform other specific functions.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following is an act of Privatization?</p>", "options": ["<p>Implementation of GST</p>", "<p>Nationalisation of a bank</p>", "<p>Disinvestment in Public Sector Units</p>", "<p>Reduction in Custom Duty</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer.</span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Disinvestment in Public Sector Units (PSUs) involves the sale of government-owned shares or assets in these entities to private investors or the general public. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This process reduces the government&#39;s ownership and control over these PSUs, allowing private investors to have a stake in their ownership and operations. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The goal of disinvestment is often to improve the efficiency and financial performance of the PSU and promote private sector participation in various industries.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following state governments has launched the Chief Minister&rsquo;s Learn and Earn scheme (Mukhyamantri Seekho Kamao Yojana)?</p>", "options": ["<p>Bihar</p>", "<p>Delhi</p>", "<p>Madhya Pradesh</p>", "<p>Uttar Pradesh</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;Madhya Pradesh&rsquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mukhyamantri Sikho Kamao Yojana (Chief Minister Learn and Earn Scheme) was approved by the Madhya Pradesh Cabinet. Youth who have passed class 12, ITI, UG and PG are eligible for this scheme. The scheme will provide stipend to the youths along with training, skill upgradation will boost their employment opportunities and pave way for a better way of earning.</span></span></p>"}, {"qid": "", "question": "<p>Christopher Guruswamy is an exponent of which of the following Indian classical dance forms?</p>", "options": ["<p>Kathakali</p>", "<p>Kathak</p>", "<p>Bharatnatyam</p>", "<p>Mohiniyattam</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is BharatNatyam. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Bharatnatyam is one of the major classical dance forms of India and has its origins in the state of Tamil Nadu. Christopher Guruswamy is known for his expertise and contributions to this graceful and expressive dance style. </span></span></p>\r\n\r\n<table border=\"1\" style=\"width:500px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:100px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><st nd powers entrusted to it by the State Legislatures.</p>", "options": ["<p>76th</p>", "<p>73rd</p>", "<p>44th</p>", "<p>42nd</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: (B) 73rd. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>73rd amendment</strong> introduced the <strong>Panchayati Raj system</strong> in India and provided constitutional recognition and statutory status to the Gram Sabha and the Panchayats (<strong>local self-government institutions) at the village, intermediate, and district levels. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The amendment aimed to empower local communities and promote grassroots democracy by devolving powers and responsibilities to the Panchayats, making them an essential foundation of the decentralized governance structure in rural areas.</span></span></p>"}, {"qid": "", "question": "<p>What is the function of hemoglobin in the human body?</p>", "options": ["<p>Transporting oxygen in the blood</p>", "<p>Breaking down toxins in the liver</p>", "<p>Regulating blood sugar levels</p>", "<p>Aiding in the digestion of proteins</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is option A; Transporting oxygen in the blood. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Hemoglobin is a protein found in red blood cells and is responsible for binding with oxygen in the lungs and transporting it throughout the body via the bloodstream. This process ensures that oxygen is efficiently delivered to various tissues and organs, supporting cellular respiration and energy production in the body.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The liver plays a crucial role in detoxifying harmful substances in the body, primarily through processes involving enzymes and the hepatic portal system. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Blood sugar regulation is mainly controlled by hormones such as insulin and glucagon, which are produced by the pancreas. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Protein digestion primarily occurs in the stomach and small intestine, where enzymes like pepsin and trypsin break down proteins into smaller peptides and amino acids for absorption.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>In which layer of atmosphere do we spend the most of our lives?</p>", "options": ["<p>Thermosphere</p>", "<p>Troposphere</p>", "<p>Stratosphere</p>", "<p>Exosphere</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is troposphere. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">We spend most of our lives in the troposphere, which is the lowest layer of the Earth&#39;s atmosphere. The troposphere extends from the Earth&#39;s surface up to an average altitude of about 10 to 14 kilometers (6 to 9 miles) above sea level, though its height can vary depending on the location and weather conditions. This layer contains the air we breathe, weather phenomena, and most of the Earth&#39;s clouds. The other layers of the atmosphere, such as the stratosphere and thermosphere, are higher up and less frequently visited by humans in their daily lives.</span></span></p>\r\n\r\n<table border=\"1\" style=\"width:519px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px s \n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:262px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Meteors burn up, very low temperatures</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Thermosphere</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:159px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">~85-500 km (53-311 mi)</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:262px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Auroras, space station orbits, high temperatures</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Exosphere</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:159px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">~500 km and beyond</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:262px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Transition to outer space, satellite orbits, low density of gases</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Losong festival is a celebration of harvesting of ___________.</p>", "options": ["<p>Sikkimese</p>", "<p>Gujarati</p>", "<p>Assamese</p>", "<p>Bengali</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is option A; Sikkimese. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Losong festival is a celebration of the harvesting season among the Sikkimese community. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is a traditional festival observed in the Indian state of Sikkim to mark the end of the agricultural year and the beginning of a new one. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The festival usually falls in the month of December and is characterized by cultural performances, traditional dances, and various rituals to express gratitude for a bountiful harvest.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "\r\n<p>What is rank of India in 2023 Corruption Perceptions Index?</p>", "options": ["\r\n<p>44th</p>", "\r\n<p>85th</p>", "\r\n<p>93th</p>", "\r\n<p>42nd</p>"], "correct": 3, "marks": "1", "explanation": "<p>The correct answer is 93th.</p>\r\n\r\n<p><strong>India ranked 93 among 180 countries</strong> in the current index (85th in 2022 &amp; 2021). Transparency International gave India a CPI score of 39.</p>\r\n\r\n<p>In CPI-2023, Denmark (with a score of 90) topped the index for the sixth consecutive year. Finland and New Zealand occupied second and third rank with scores of 87 and 85 respectively. Somalia was ranked last.</p>"}, {"qid": "", "question": "<p>Balban was the slave of which of the following Delhi Sultans?</p>", "options": ["<p>Iltutmish</p>", "<p>Nasiruddin Mahmud</p>", "<p>Qutbuddin Aibak</p>", "<p>Aram Shah</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Iltutmish. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Balban belonged to the famous group of 40 Turkic slaves of Iltutmish. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Balban, also known as Ghiyas ud-Din Balban, was a Turkish slave who rose to prominence in the Delhi Sultanate. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He entered the service of the Sultanate during the reign of Sultan Iltutmish, who ruled from 1211 to 1236. Balban&#39;s exceptional military skills, loyalty, and administrative acumen earned him a high position in the court. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">After the death of Nasiruddin Mahmud, Balban became the Sultan and ruled from 1266 to 1287.</span></span></p>"}, {"qid": "", "question": "\r\n\r\n<p>Who is the chief minister of Manipur as of Aug 2024?</p>", "options": ["\r\n\r\n<p>Pema Khandu</p>", "\r\n\r\n<p>Neiphiu Rio</p>", "\r\n\r\n<p>N. Biren Singh</p>", "\r\n\r\n<p>Hemant S  border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:102px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Between Kharif and Rabi seasons</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:187px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Between Rabi and Kharif seasons</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:186px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Cucumber, Watermelon, Muskmelon, Bitter gourd, Pumpkin, Moong (Green gram), Sesame (Til), Cowpea</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Gol Gumbaz in Karnataka is a tomb of which ruler?</p>", "options": ["<p>Aurangzeb</p>", "<p>Devaraya II</p>", "<p>Muhammad Shah I</p>", "<p>Adil Shah</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &lsquo;Adil Shah&rsquo;. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Gol Gumbaz, located in Bijapur (now known as Vijayapura) in the Indian state of Karnataka, is the tomb of Adil Shah, who was the Sultan of the Bijapur Sultanate. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The structure is a magnificent example of Indo-Islamic architecture and is famous for its massive dome, which is one of the largest domes in the world. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">It was built during the reign of Muhammad Adil Shah, who ruled from 1627 to 1656.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>The population of India according to their economic status is divided into:</p>", "options": ["<p>Marginal workers, household industrial workers, non-workers</p>", "<p>Main workers, marginal workers, non-workers</p>", "<p>cultivators, main workers, marginal workers</p>", "<p>Non workers, agricultural labourers, marginal workers</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The population is commonly categorized into three broad groups based on their economic activity:</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Main Workers</strong>: This category includes individuals who are engaged in productive economic activities for a major part of the year. They can be further divided into three sub-categories: Cultivators, Agricultural Laborers, and Other Workers (which includes workers in manufacturing, services, construction, etc.).</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Marginal Workers</strong>: Marginal workers are those individuals who are employed for a very small part of the year (less than 6 months) and are seeking or available for work during the rest of the year.</span></span></li>\r\n\t<li><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Non-workers</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">: This category includes individuals who are not engaged in any economic activity, either as workers or as job seekers.</span></span></li>\r\n</ol>"}, {"qid": "", "question": "<p>The Article of the Indian Constitution that deals with all the executive powers of the Governor is ________________.</p>", "options": ["<p>Article 154</p>", "<p>Article 169</p>", "<p>Article 73</p>", "<p>Article 129</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option A; Article 154. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 154 of the Indian Constitution deals with the executive powers of the Governor. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">According to this article, the executive powers of the state are vested in the Governor. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Governor acts as the head of the state&#39;s executive and exercises these powers on the advice of the Council of Ministers headed by the Chief Minister. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 169</strong>: Article 169 of the Indian Constitution deals with the creation or abolition of Legislative Councils in states.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 73:</strong> Article 73 of the Indian Constitution deals with the extent of executive power of the Union (Central Government) in the context of the federal structure of India. It states that the executive power of the Union extends to matters on which Parliament has the power to make laws. In other words, the Central Government has executive authority in subjects under the Union List (i.e., matters on which only the Central Government can legislate) and Concurrent List (i.e., matters on which both the Central and State Governments can legislate). </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Article 129</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">: Article 129 of the Indian Constitution deals with the Supreme Court&#39;s powers to punish for contempt of court. According to this article, the Supreme Court has the authority to punish any person for contempt of itself. Contempt of court refers to any act that shows disrespect or disregard for the authority, dignity, or orders of the court.</span></span></p>"}, {"qid": "", "question": "<p>Who amongst the following has won the Women&rsquo;s singles title at the 2023 French Open?</p>", "options": ["<p>Karolina Muchova</p>", "<p>Iga Swiatek</p>", "<p>Elena Rybakina</p>", "<p>Coco Gauff</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Iga Swiatek. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Iga Swiatek has won the 2023 French Open Women&rsquo;s Singles Title.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>French Open Men&rsquo;s Single Title: Novak Djokovic</strong> won his men&#39;s-record 23rd Grand Slam title with a victory over Casper Ruud in French Open Final. Djokovic broke a tie with rival Rafael Nadal for the most major singles trophies. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Australian Open&mdash;</strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Men&rsquo;s Single&mdash;Novak Djokovic. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Women&rsquo;s Single --- Aryna Sabalenka. </span></span></p>"}, {"qid": "", "question": "<p>Who is the current chairman of Rajya Sabha?</p>", "options": ["<p>Droupadi Murmu</p>", "<p>M. Venkaiah Naidu</p>", "<p>Jagdeep Dhankhar</p>", "<p>Om Birla</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Jagdeep Dhankhar. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>The Vice President of India</strong> is the ex-officio Chairman of Rajya Sabha. Jagdeep Dhankhar is current Vice President of India. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 64:</strong> The Vice-President shall be ex officio Chairman of the Council of States and shall not hold any other office of profit. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:12.0pt\">Vice President of India: </span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Vice President is the <strong>second highest constitutional office in India. He/She serves for a five-year term,</strong> but can continue to be in office. Irrespective of the expiry of the term, until the successor assumes office. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Vice President<strong> may resign his office by submitting his resignation to the President of India.</strong> The resignation becomes effective from the day it is accepted. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The Vice President can be removed from office by a resolution of the Council of States <strong>(Rajya Sabha)</strong>, passed by a majority of its members at that time and agreed to by the House of the People <strong>(Lok Sabha)</strong>. A resolution for this purpose may be moved only after a notice of at least a minimum of 14 days has been given of such an intention</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>The confluence of two holy rivers Alaknanda and Bhagirathi to form Ganga is known as ______.<br />\r\n </p>", "options": ["<p>Devkoomud<br />\r\n </p>", "<p>Devdristi<br />\r\n </p>", "<p>Devmukhut<br />\r\n </p>", "<p>Devprayag<br />\r\n </p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is option D; Devprayag. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The confluence of two holy rivers Alaknanda and Bhagirathi to form the Ganga (Ganges) is known as Devprayag. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is a sacred place and holds immense religious significance in Hindu mythology and culture. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Located in the state of Uttarakhand, India, Devprayag is one of the Panch Prayag (five confluences) of the river Alaknanda, where it meets various other rivers on its journey downstream.</span></span></li>\r\n</ul>\r\n\r\n<table border=\"1\" style=\"width:472px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ffe599; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Panch Prayag dth:205px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Bhagirathi River</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p>The &quot;August Offer&quot; made by the British government in 1940 proposed the expansion of which Indian institution?</p>", "options": ["<p>Legislative Councils</p>", "<p>Indian Civil Services</p>", "<p>Indian National Army</p>", "<p>Indian National Congress<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option A is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The &quot;August Offer&quot; was a proposal made by the British government in August 1940 during World War II. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It was an attempt to address Indian demands for self-governance and participation in the administration. The proposal suggested the expansion of the Indian Legislative Councils at both the provincial and central levels. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The plan aimed to increase Indian representation in these councils to include more Indians in the decision-making process.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>When was VAT introduced in India?</p>", "options": ["<p>2002</p>", "<p>2003</p>", "<p>2005</p>", "<p>2004</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option C; 2005. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Value Added Tax (VAT) was introduced in India on April 1, 2005. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It replaced the earlier sales tax system and aimed to bring about a more efficient and transparent tax regime in the country. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">VAT is an indirect tax levied on the value added to goods and services at each stage of production or distribution, and it is collected from end consumers.</span></span></li>\r\n</ul>"}, {"qid": "", "question": " <span> A question is given, followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements is sufficient to answer the question. Read both the statements and select the appropriate answer.</span><p><span>Q. Five colleagues, Chand Chandini, Nidhi, Vikram and Ajay, are sitting in a row facing north. Who sits in the right extreme?</span></p><p><span>I. Nidhi and Chandini occupy the extreme ends of the row. Vikram is sitting exactly in the centre. No two people with the name starting with the same letter are immediate neighbours of each other.</span></p><p><span>II. Ajay is sitting to the immediate left of Vikram. No two people with the name starting with the same letter are immediate neighbours of each other.</span></p>", "options": ["<span> Data in either statement I alone or statement II alone is sufficient to answer the question.</span>", "<span> Data in statements I and II together is sufficient to answer the question</span>", "<span> Data in statement I alone is sufficient to answer the question while data in statement II is not </span>", "<span> Data in statement II alone is sufficient to answer the question while data in statement I is not</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image001.png\" width=\"324\" height=\"791\" alt=\"\"></p>"}, {"qid": "", bulk_uploader_images/1711531541744_image048.png\" width=\"318\" height=\"230\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements maybe the effect of the other statement. Read both statements and select the correct answer.</span><p><span>I. A large number of candidates submitted applications against an advertisement for the post of MTS issued by SSC organisation.</span></p><p><span>II. The current year has witnessed an unparalleled surge in the count of unemployed youth as compared to the preceding year.</span></p>", "options": ["<span> I is the cause and II is its possible effect</span>", "<span> II is the cause and I is its possible effect</span>", "<span> Both I and II are effects of independent causes</span>", "<span> Both I and II are independent causes</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>Increase in the number of unemployed youths is the reason behind huge crowds for a single vacancy. So, it is very clear from here that statement I is effect of the cause stated in statement II. Hence option B is the correct answer.</span></p><p><span>Hence, option b is correct answer (II is the cause and I is its possible effect)</span></p>"}, {"qid": "", "question": " <span> Figure A is related to B in certain pattern. Following the same pattern, figure C is related to D. Study the pattern and select the figure which should be placed in place of D.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image049.jpeg\" width=\"377\" height=\"112\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image050.jpeg\" width=\"88\" height=\"88\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image051.jpeg\" width=\"82\" height=\"86\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image052.jpeg\" width=\"86\" height=\"83\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image053.jpeg\" width=\"86\" height=\"90\" alt=\"\">"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>[c]</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image052.jpeg\" width=\"86\" height=\"83\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the correct mirror image of the given combination when the mirror is placed at ‘PQ’ as shown.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image054.png\" width=\"196\" height=\"90\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image055.jpeg\" width=\"105\" height=\"17\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image056.jpeg\" width=\"101\" height=\"15\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image057.jpeg\" width=\"102\" height=\"15\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image058.jpeg\" width=\"103\" height=\"18\" alt=\"\">"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>[d]</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image058.jpeg\" width=\"103\" height=\"18\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.</span><p><span>S Y _ T V S _ H T _ S Y _ _ V _ _ J T V</span></p>", "options": ["<span> H Y V I T S Z</span>", "<span> G Z V I T S Z</span>", "<span> G Y V I T S Y</span>", "<span> G Y V J U S Y</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>S Y </span><span style=\"font-weight:bold\">G</span><span> T V/ S </span><span style=\"font-weight:bold\">Y</span><span> H T </span><span style=\"font-weight:bold\">V</span><span>/ S Y </span><span style=\"font-weight:bold\">J U</span><span> V/ </span><span style=\"font-weight:bold\">S Y</span><span> J T V.</span></p>"}, {"qid": "", "question": " <span> Eight people are sitting in two parallel rows with 4 people each in such a way that there is equal distance between adjacent persons and they are facing each other.</span><p><span>In row I – L, M, N and O are seated and all of them are facing south.</span></p><p><span>In row II – P, Q, R and S are seated and all of them are facing north.</span></p><p><span>N sits at the extreme right end of their row and is facing R. S sits at the extreme right end of their row. Q sits to the immediate right of R and is facing L. O sits at the extreme left end of their row.</span></p><p><span>Who sits opposite to the second left of P?</span></p>", "options": ["<span> M</span><span>   </span>", "<span> O</span><span>   </span>", "<span> N</span><span>   </span>", "<span> L</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image059.png\" width=\"357\" height=\"247\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of ::?</span><p><span># : DKR :: PCL: %</span></p>", "options": ["<span> # = COQ, % = OGH</span>", "<span> # = BNQ, % = NFM</span>", "<span> # = FHT, % = NFJ</span>", "<span> # = BNP, % = NFJ</span><span>   </span>"], "correct": 3, "marks": "1", "explanation": "<span> c</span><p><span>Hence, option c is correct.</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711531541744_image060.png\" width=\"229\" height=\"343\" alt=\"\"></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
