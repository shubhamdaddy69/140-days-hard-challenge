<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>

      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>

    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     After     selling 96 articles, a man earns a profit of selling price of 16     articles. Find profit %</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     20%</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     12.5%</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     10%</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     11.11%</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_bbc821bd9e01bc45.png\" width=\"324\" height=\"252\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">A’     can do a certain work in 60 days. ‘B’ is 25% more efficient     than ‘A’, while ‘C’ is 20% more efficient than ‘B’.     ‘B’ alone completed 37.5% of work. ‘A’ and ‘C’     together completed the remaining work. The entire work got     completed in (days):</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     35</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     33</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     32</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     30</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_5915e37bc48f6948.png\" width=\"287\" height=\"432\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     and B can complete a piece of work in 12.5 days and 25 days     respectively. If A works full time while B works half of the     time, In how many days the entire work will be completed?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     10</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     5</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     12</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     15</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_e7e149004dcca1a2.png\" width=\"359\" height=\"410\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     In     an office, 11/17 of the total number of employees are males and     the rest are females. 7/11 of the number of males are     non-technical workers while 1/3 of the number of females are     non-technical workers. What fraction of the total number of     employees are technical workers?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     3/17</p>", "<p style=\"orphans:0;widows:0\">     8/17       </p>", "<p style=\"orphans:0;widows:0\">     4/17</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     9/17</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_884ca7c485ef70df.gif\" alt=\"Shape1\" width=\"297\" height=\"246\" > </p>"}, {"qid": "", "question": "\r\n<p>Simplify the following expression:<img src=\"https://appxcontent.kaxa.in/paperimages/1727349126_1727349126272191_thump.png\" style=\"height:64px; width:292px\" /></p>", "options": ["\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_c0c753e0825c623a.gif\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_79095c5475da9ea7.gif\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_1b84721da01593da.gif\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_1359a313bcd6c6c4.gif\" /></p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p><img alt=\"Shape2\" src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_72a7af455e7b7ecb.gif\" style=\"height:228px; width:363px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>Three     partners X, Y and Z started their business by investing Rs     40,000, Rs 38,000 and Rs 30,000, respectively. After 6 months, X     and Z made additional investments of Rs 20,000 and Rs 15,000     respectively, whereas Y withdrew Rs 8,000. Find the share of Y in     the total profit of Rs 38,880 made at the end of the year.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>10950</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>10200</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>9800</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>10880</span></p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_49a8a924480dbc5d.gif\" alt=\"Shape3\" width=\"423\" height=\"343\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     ratio of the incomes of A and B is 6:5, whereas the ratio of     their expenditure is 4:5 respectively. If A and B save Rs 4,000     and 1,000 respectively then what is the difference between their     expenditures?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1200</span>           </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1400</span>           </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1000</span>           </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>800</span></p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_acaf712db3777321.jpg\" width=\"297\" height=\"352\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>What     is the fourth proportional of </span>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_3f52ec2dc0d2fb4.gif\" > <span>      ?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1/375          </span>     </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1/250          </span>     </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1/275          </span>     </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>1/350</span></p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690281767917_html_1dcbfd6466e70d79.jpg\" width=\"319\" height=\"270\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     On selling an article for Rs.525, the     gain is 50% more than the amount of loss incurred on selling it     for Rs.480. If the article is sold for Rs.5 style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted idiom.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Life     is not always a <u><b>bed     of roses</b></u>;     it has its fair share of challenges and difficulties.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     A comfortable     and luxurious resting place</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A situation or     experience that is pleasant and easy</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A beautiful     garden filled with roses</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A difficult and     challenging path in life</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     idiom \"bed of roses\" is a figurative expression that     means a situation or experience that is pleasant, easy, and free     from troubles or difficulties. It is often used to describe     something that appears to be effortless and enjoyable, without     any hardships or obstacles.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Some of them wanted to know about life after death, others wanted     to know why sacrifices should be performed.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     They described this as the atman or the individual soul and the     brahman or the universal soul. They believed that ultimately,     both the atman and the brahman were one. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     Many of these thinkers felt that there was something permanent in     the universe that would last even after death. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     Around the time that the Buddha was preaching and perhaps a     little earlier, other thinker also tried to find answers to     difficult questions.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     DCAB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DACB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ACDB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DACB: Around the time that the Buddha was     preaching and perhaps a little earlier, other thinker also tried     to find answers to difficult questions. Some of them wanted to     know about life after death, others wanted to know why sacrifices     should be performed. Many of these thinkers felt that there was     something permanent in the universe that would last even after     death. They described this as the atman or the individual soul     and the brahman or the universal soul. They believed that     ultimately, both the atman and the brahman were one. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in indirect     speech.<br> They cried, “Bravo! Well done.”</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     They shouted in     joy that they had done well.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They exclaimed     with wonder that they had done well.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They cried     loudly for doing well.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     They cried in     joy for doing well.</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is an exclamatory sentence. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">‘Cried’     will be changed to ‘shouted in joy’. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Hence,     the correct Indirect speech of the given sentence is: <i><b>They     shouted in joy that they had done well.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</p>\r\n\r\n<p>A. In modern times we sometimes feel that something to be used in everyday life need not be beautiful, or that something beautiful cannot be put to daily use.</p>\r\n\r\n<p>B. We assume that if an object is to be used frequently, it need not be delicate and graceful.</p>\r\n\r\n<p>C. This assumption is quite mistaken in the context of traditional crafts. The best way to understand why this is so, is by making something with your own hands.</p>\r\n\r\n<p>D. Aesthetic beauty and usefulness need not be two separate qualities.</p>\r\n\r\n<p> </p>", "options": ["<p>DABC</p>", "<p>DBCA</p>", "<p>ADBC</p>", "<p>BCAD</p>"], "correct": 1, "marks": "1", "explanation": "<p>Option a is the correct answer.</p>\r\n\r\n<p>The correct arrangement is: DABC: <em><strong>Aesthetic beauty and usefulness need not be two separate qualities. In modern times we sometimes feel that something to be used in everyday life need not be beautiful, or that something beautiful cannot be put to daily use. We assume that if an object is to be used frequently, it need not be delicate and graceful. This assumption is quite mistaken in the context of traditional crafts. The best way to understand why this is so, is by making something with your own hands.</strong></em></p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"o pan><span>:     terminate, end, or take out.  </span></span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Read     the following passage and answer the questions given after it.</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     presidents of the New York Central and the New York, New Haven     and Hartford railroads will swear on a stack of timetables that     there are only two. But I say there are three, because I’ve     been on the third level of the Grand Central Station. Yes, I’ve     taken the obvious step: I talked to a psychiatrist friend of     mine, among others. I told him about the third level at Grand     Central Station, and he said it was a waking dream wish     fulfilment. He said I was unhappy. That made my wife kind of mad,     but he explained that he meant the modern world is full of     insecurity, fear, war, worry and all the rest of it, and that I     just want to escape. Well, who doesn’t? Everybody I know wants     to escape, but they don’t wander down into any third level at     Grand Central Station. But that’s the reason, he said, and my     friends all agreed. Everything points to it, they claimed. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">My     stamp collecting, for example; that’s a ‘temporary refuge     from reality.’ Well, maybe, but my grandfather didn’t need     any refuge from reality; things were pretty nice and peaceful in     his day, from all I hear, and he started my collection. It’s a     nice collection too, blocks of four of practically every U.S.     issue, first-day covers, and so on. President Roosevelt collected     stamps too, you know. Anyway, here’s what happened at Grand     Central. One-night last summer I worked late at the office. I was     in a hurry to get uptown to my apartment so I decided to take the     subway from Grand Central because it’s faster than the bus.     Now, I don’t know why this should have happened to me. I’m     just an ordinary guy named Charley, thirty-one years old, and I     was wearing a tan gabardine suit and a straw hat with a fancy     band; I passed a dozen men who looked just like me. And I wasn’t     trying to escape from anything; I just wanted to get home to     Louisa, my wife. I turned into Grand Central from Vanderbilt     Avenue, and went down the steps to the first level, where you     take trains like the Twentieth Century. Then I walked down     another flight to the second level, where the suburban trains     leave from, ducked into an arched doorway heading for the subway     — and got lost. That’s easy to do. I’ve been in and out of     Grand Central hundreds of times, but I’m always bumping into     new doorways and stairs and corridors. Once I got into a tunnel     about a mile long and came out in the lobby of the Roosevelt     Hotel. Another time I came up in an office building on     Forty-sixth Street, three blocks away. Sometimes I think Grand     Central is growing like a tree, pushing out new corridors and     staircases like roots. There’s probably a long tunnel that     nobody knows about feeling its way under the city right now, on     its way to Times Square, and maybe another to Central Park. And     maybe — because for so many people through the years Grand     Central has been an exit, a way of escape — maybe that’s how     the tunnel I got into... But I never told my psychiatrist friend     about that idea.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style nd Central Station. Yes, I’ve     taken the obvious step: I talked to a psychiatrist friend of     mine, among others. I told him about the third level at Grand     Central Station, and he said it was a waking dream wish     fulfilment. He said I was unhappy. That made my wife kind of mad,     but he explained that he meant the modern world is full of     insecurity, fear, war, worry and all the rest of it, and that I     just want to escape. Well, who doesn’t? Everybody I know wants     to escape, but they don’t wander down into any third level at     Grand Central Station. But that’s the reason, he said, and my     friends all agreed. Everything points to it, they claimed. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">My     stamp collecting, for example; that’s a ‘temporary refuge     from reality.’ Well, maybe, but my grandfather didn’t need     any refuge from reality; things were pretty nice and peaceful in     his day, from all I hear, and he started my collection. It’s a     nice collection too, blocks of four of practically every U.S.     issue, first-day covers, and so on. President Roosevelt collected     stamps too, you know. Anyway, here’s what happened at Grand     Central. One-night last summer I worked late at the office. I was     in a hurry to get uptown to my apartment so I decided to take the     subway from Grand Central because it’s faster than the bus.     Now, I don’t know why this should have happened to me. I’m     just an ordinary guy named Charley, thirty-one years old, and I     was wearing a tan gabardine suit and a straw hat with a fancy     band; I passed a dozen men who looked just like me. And I wasn’t     trying to escape from anything; I just wanted to get home to     Louisa, my wife. I turned into Grand Central from Vanderbilt     Avenue, and went down the steps to the first level, where you     take trains like the Twentieth Century. Then I walked down     another flight to the second level, where the suburban trains     leave from, ducked into an arched doorway heading for the subway     — and got lost. That’s easy to do. I’ve been in and out of     Grand Central hundreds of times, but I’m always bumping into     new doorways and stairs and corridors. Once I got into a tunnel     about a mile long and came out in the lobby of the Roosevelt     Hotel. Another time I came up in an office building on     Forty-sixth Street, three blocks away. Sometimes I think Grand     Central is growing like a tree, pushing out new corridors and     staircases like roots. There’s probably a long tunnel that     nobody knows about feeling its way under the city right now, on     its way to Times Square, and maybe another to Central Park. And     maybe — because for so many people through the years Grand     Central has been an exit, a way of escape — maybe that’s how     the tunnel I got into... But I never told my psychiatrist friend     about that idea.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Which     term can be used to describe the narrator's state of mind when he     accessed the third level?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Anxious</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ordinary</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ecstatic</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Confused</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The f loans to states or     repayment of its borrowings.</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option a is the correct answer.                      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Revenue expenditure: It is the     expenditure by the government which does not impact its assets or     liabilities. For example, this includes salaries, interest,     payments, pensions, and administrative expenses.                                                                                                                                    </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Capital Expenditure: It is used to     create assets or to reduce liabilities. It consists of:      </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      )      the long-term investments by the government on creating assets      such as roads and hospitals, and</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">       the      money given by the government in the form of loans to states or      repayment of its borrowings.</p>     </li></ol>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Construction of Ports, highway and     school buildings they all comes in Capital expenditure.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Namami     Gange Programme was launched in------------?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     May     2014</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     June     2014</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     July     2014</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Aug     2015</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     Option     b is the correct answer. The Namami Gange Programme is an     Integrated Conservation Mission, approved as ‘Flagship     Programme’ by the Union Government in June 2014 with budget     outlay of Rs.20,000 Crore to accomplish the twin objectives of     effective abatement of pollution, conservation and rejuvenation     of National River Ganga.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     In which year was the Estimates     Committee constituted for the first time in India?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1948</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1949</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1947</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1950</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is 1950.                                                                             </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The first Estimates Committee in the     post-independence era was constituted in 1950. Originally, it had     25 members but in 1956 its <b>membership     was raised to 30. All the thirty members are from Lok Sabha     only.</b> The Rajya Sabha     has no representation in this committee. The function of the     committee is to examine the estimates included in the budget and     suggest ‘economies’ in public expenditure. Hence, it has been     described as a ‘<b>continuous     economy committee’.</b></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "\r\n\r\n<p>What is the rank of India in Human Development Report(HDI) in 2023-24?</p>\r\n\r\n<p> </p>", "options": ["\r\n\r\n<p>130</p>", "\r\n\r\n<p>126</p>", "\r\n\r\n<p>135</p>", "\r\n\r\n<p>134</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p>The correct answer is 134. India&rsquo;s rank in HDI index is 134. It was 132th in 2022, 130th in 2020.              </p>\r\n\r\n<p>HDI is a composite index that measures average achievement in human development taking into account four indicators:               </p>\r\n\r\n<p>1.            Life expectancy at birth (Sustainable Development Goal 3).</p>\r\n\r\n<p>2.            Expected ears of schooling (Sustainable Development Goal 4.3).</p>\r\n\r\n<p>3.            Mean years of schooling (Sustainable Development Goal 4.4).</p>\r\n\r\n<p>4.            Gross national income (GNI) (Sustainable Development Goal 8.5).</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     2<sup>nd</sup>     Buddhist council was held in the reign of which of the following     king?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Kanishka</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ajatashatru</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ashoka</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kalashoka</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Kalashoka.         </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2<sup>nd</sup>     Buddhist council was held in 383 BC in Vaishali in the Patronage     of Kalashoka. Sabbakami was the chairman of the council.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     First Council: It was <b>held     soon after the Mahaparinirvan</b> of     the Buddha, around <b>483     BC</b> <b>under     the patronage of</b> <b>King     Ajatshatru</b> and was     presided by Mahakasyapa, a monk. It was held in the Sattapani     cave at Rajgriha.                 </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                            </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Third Council: It was held in 250 BC     in<b> Patliputra</b> <b>under     the</b> <b>patronage     of Ashoka</b> and was     presided by Moggaliputta Tissa.           </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                                          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Fourth Council: It was held in 72 AD     at<b> Kundalvana,     Kashmir</b>. It was presided     by Vasumitra, while<b> Asvaghosa </b>was     his deputy under the patronage of King Kanishka of Kushan Empire.     In this council Buddhism was divided into two sects namely     Mahayan and Hinayan.                                                                            </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which of the following options is     correct regarding sexually transmitted disease (STD)?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Statement A: Sexually transmitted     diseases (STDs) are infections transmitted from an infected     person to an uninfected person through sexual contact.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Statement B: HIV, HPV and Hepatitis B     virus is responsible for STD.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement B is correct</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Both     Statements A and B incorrect</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement A is correct</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Both     Statements A and B correct</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option d is the correct answer.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Sexually transmitted diseases (STDs),     or sexually transmitted infections (STIs), are infections that     are passed from one person to another through sexual contact.     HIV, HPV and Hepatitis B virus is responsible for STD.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which of the following is the longest     river bridge of India?      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Dhola     Sadiya Bridge</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Dibang     River Bridge</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Mahatma     Gandhi Setu</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Bogibeel     Bridge</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Dhola Sadiya     Bridge. The Bhupen Hazarika Setu is another name for the Dhola     Sadiya Bridge. The Dhola Sadiya Bridge, which spans the great     Brahmaputra, is now the longest bridge above water in India. The     9.15 kilometre long bridge, which Prime Minister Narendra Modi     opened, connects Assam and Arunachal Pradesh. It shortens the     journey by five hours and 165 kilometres between Assam and     Arunachal Pradesh.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Dibang River Bridge is at the 2<sup>nd</sup>     Position with the length of 6.2 Km, Mahatma Gandhi Setu Bridge is     at 3<sup>rd</sup>     position with the length of 5.75 Km and Bgibeel Bridge is at 5<sup>th</sup>     position with length 4.94 Km.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     amongst the following is not a quality of Prokaryotes?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     It     contains single chromosome which is circular in shape.</p>", "<p style=\"orphans:0;widows:0\">     Nucleus is present.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Membrane     bound cell organelles are absent.</p>", "Sप्रध यी cिधि iौ gधnधनोििद ौंोिि cयंूोनध पय पुध ौप्रध यी cिधि यी Eहाोनदयपधौ."], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option b is the correct answer.        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                                         </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Nucleus is absent in the Prokaryotes.     It is present in Eukaryotes. Other three option are correct about     Prokaryotes.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     was the founder of Gupta dynasty?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Chandragupta     I</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sri     Gupta</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ghatotkach</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Samudragupta</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Sri Gupta. He     was the founder of Gupta dynasty. The period of Gupta is referred     as the ‘Classical Age’ or ‘Golden age’ of ancient India     and was perhaps the most Prosperous era in the Indian History.             </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                 </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Famous ruler of Gupta Dynasty:     Chandragupta I, Samudragupta, Chandragupta II (Vikramaditya),     Kumaragupta and Skandagupta.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     article of Indian Constitution is related to the Formation of new     States and alteration of areas, boundaries or names of existing     States?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     2</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     8</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     10</p>"], "correct": 2, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Aनपicिध 3. Iप धंूयथधनौ Pोिनiोंधnप पय ंोाध कधciौiयnौ in ोccयनकोncध थiपु पुध िोथ नधgोनकing ोnद cुोngधौ यन ोिपधनोपiयnौ नधतहiनधक in पुध ोनधोौ, ृयहnकोनiधौ, यन nोंधौ यी धसiौपing Sपोपधौ. Aनपicिध 2: “Pोिनiोंधnप ंोद ृद िोथ ोकंiप inपय पुध Uniयn, यन धौपोृिiौु, nधथ Sपोपधौ यn ौहcु पधनंौ ोnक cयnकiपiयnौ ोौ iप पुinो ीiप.” Aनपicिध 8: Ciपप्रधnौुiू यी cधनपोin ूधनौयnौ यी Inकiोn यनigin नधौiकing यहपौiकध Inकiो. Tुiौ ोनपicिध कधोिस थiपु पुध नigुपौ यी ूधयूिध यी Inकiोn यनigin नधौiकing यहपौiकध Inकiो ीयन ूहनूयौधौ यी धंूियदंधnप, ंोननiोgध, ोnक धकहcोपiयn. Aनपicिध 10: Anद ूधनौयn थुय iौ cयnौiकधनधक ो ciपप्रधn यी Inकiो हnकधन ोnद यी पुध ूनयॅiौiयnौ यी पुiौ Pोनप ौुोिि cयnपinहध पय ृध ciपप्रधnौ ोnक थiिि ोिसय ृध ौहृुधcप पय ोnद िोथ ंोकध ृद पुध Pोिनiोंधnप."}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Deficiency     of which of the following vitamins causes excessive bleeding from     wounds?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Vitamin     K</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Vitamin     A</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Vitamin     D</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Vitamin     E</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Vitamin K.                                                                                                        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Vitamin K is important for blood     clotting and bone health. The main symptom of a vitamin K     deficiency is excessive bleeding. Conditions that can lead to a     deficiency include celiac disease and cystic fibrosis.                                                                                                                                </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Vitamin A deficiency diseases: Night     blindness, Dry Skin, Dry Eyes, Infertility, Delayed growth, etc.                                                                                                                                                                                </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Vitamin D deficiency can lead to a     loss of bone density, which can contribute     to osteoporosis and fractures (broken bones).     In children, it causes the bones to become soft and bend.                                                                                                                                                                      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Vitamin E deficiency may cause     impaired reflexes and coordination, difficulty walking, and weak     muscles.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Shallbugh     Wetland Conservation Reserve is located in which state?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil     Nadu</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jammu     and Kashmir</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Uttar     Pradesh</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Jammu and     Kashmir. Shallbugh Wetland Conservation Reserve lies west of     Anchar Lake in the Sindh river delta. This shallow wetland is     primarily fed by rainfall, snowmelt from the Kashmir Himalayas,     and stream water flowing from the Sindh river and Anchar Lake. It     is 75<sup>th</sup>     Ramsar sites of India.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Top 5 Ramsar Sites in India:     Sunderbans Wetland (West Bengal), Vembanad Kol Wetland (Kerala),     Chilika Lake(Odisha), Kolleru Lake(Andhra Pradesh), Bhitarkanika     Mangroves (Odisha).      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Identify which of the following     statements are correct.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     1.The Sun is at the centre of the     Solar System.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2. The Sun is the composed of 71%     Hydrogen, 26.5% Helium and 2.5% other elements.       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     3. Hydrogen and Helium are the main     gases present in the Sun.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     2     and 3 only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1     and 2 only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1     and 3 only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1,     2 and 3</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option d is the correct answer.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     All of the above statement are     correct. The Sun is at the centre of the Solar system. Its size     is thirteen lakh times as that of the Earth. It is the nearest     star to the Earth. It is an ultimate energy for life on Earth.     Its diameter is 14 lakh kms. The outer layer of sun’s     atmosphere made up of thin hot gases, is called Corona. Corona is     visible only during a total eclipse of the sun. The sequence of     planets according to their distance from the Sun is Mercury,     Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     If     the radius of the current carrying wire is doubled then it’s     resistance will:</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     increase     by 4 times</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     decrease     by 4 times</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     increase     by 2 times</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     remain     same</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is decrease by 4     times.                                                        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Electrical Resistance R =      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690282536837_html_7395d79a40f3790c.gif\" >      . Hence if the radius of the wire is increased by 2 times then     its area will increased by 4 times and therefore from the above     equation resistance will decrease by 4 times.       </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     statement “pressure exerted by a gas (of a given mass, kept at     a constant temperature) is inversely proportional to the volume     occupied by it” is known as:</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Charle’s     law</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Boyle’s     law</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Pascal’s     law</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Avogadro’s     law</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Boyle’s law.     Boyles law states that the pressure exerted by a gas (of a given     mass, kept at a constant temperature) is inversely proportional     to the volume occupied by it. In other words, the pressure and     volume of a gas are inversely proportional to each other as long     as the temperature and the quantity of gas are kept constant.                                                                                                                                                                          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Charle’s law: It states that e     volume of a given mass of gas varies directly with the absolute     temperature of the gas when pressure is kept constant.                                                                          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Pascal’s law: “The external     static pressure applied on a confined liquid is distributed or     transmitted evenly throughout the liquid in all directions”.                                                                 </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Avogadro’s law: under the same     conditions of temperature and pressure, equal volumes of     different gases contain an equal number of molecules.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     What     is rank of India in GDP?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">< ns:</span></p><p><span>I. The government will ban all the vehicles that run on fossil fuel immediately.</span></p><p><span>II. The government will shut down all the coal-fired power plants.</span></p>", "options": ["<span> Only Conclusion I follows</span>", "<span> Both Conclusion I and Conclusion II follow</span>", "<span> Only Conclusion II follows</span>", "<span> Neither Conclusion I nor Conclusion II fo0llows</span>"], "correct": 4, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ D.Giॅधn ौपोपधंधnप iौ पोिाing ोृयहप “Tुध nधथ gयॅधनnंधnप ूियicद ोiंौ पय नधकहcध cोनृयn धंiौौiयnौ ृद 50% थiपुin पुध nधसप कधcोकध”.Cयncिहौiयn I iौ पोिाing ोृयहप “Tुध gयॅधनnंधnप थiिि ृोn ोिि पुध ॅधुicिधौ पुोप नहn यn ीयौौiिस ीहिध iंंधकiोपिधद”. Iंंधकiोपिधद ृोn यी ीयौौiिस ीहिध iौ nयप ूयौौiृिध. Tुधनधीयनध, cयncिहौiयn I कयधौn’प ीियियथौ पुध ौपोपधंधnप.Cयncिहौiयn II iौ पोिाing ोृयहप “Tुध gयॅधनnंधnप थiिि ौुहप कयथn ोिि पुध cयोि-ीiनधक ूयथधन ूिोnपौ”. Tुiौ cयncिहौiयn iौ ोिसय ूयौौiृिध. Tुधनधीयनध, cयncिहौiयn II कयधौn’प ीियियथ पुध ौपोपधंधnप.Hधncध, nधiपुधन cयncिहौiयn I nयन II ीियियथ पुध ौपोपधंधnप."}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
