<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>

</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Correct option: (a) A-3, B-4, C-1, D-2</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following statements is correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.</span><span> </span><span>Kamya Kartikayan became the youngest woman (17-year-old student) to conquer the highest peaks of the seven continents.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. She belongs to Bengaluru, Karnataka.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>·</span><span> </span><span> </span><span style=\"font-weight:bold\">Kamya Kartikeyan</span><span> </span><span>achieved the</span><span> </span><span style=\"font-weight:bold\">Seven Summits</span><span> </span><span>challenge.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>·</span><span> </span><span> She became the</span><span> </span><span style=\"font-weight:bold\">youngest Indian woman</span><span> </span><span>(at the age of 17) to scale the highest peaks on all seven continents.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>·</span><span>  </span><span>Kamya Kartikeyan</span><span> </span><span style=\"font-weight:bold\">belongs to Mumbai, Maharashtra</span><span>, not Bengaluru.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>·</span><span> </span><span> </span><span>Hence, statement 2 is factually wrong.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following Kingdoms were directly associated with the life of the Buddha?</span></p><ol type=\"1\"><li><span>Avanti</span></li><li><span>Gandhara</span></li><li><span>Kosala</span></li><li><span>Magadha</span></li></ol><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct answer using the code given below:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 and 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 and 4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 and 4 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 3 and 4</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Although Avanti (capital: Ujjain) was an important Mahajanapada, it is</span><span> </span><span style=\"font-weight:bold\">not directly associated</span><span> </span><span>with major events of Buddha’s life.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Gandhara became important</span><span> </span><span style=\"font-weight:bold\">after Buddha</span><span>, especially for Buddhist art (Gand ;font-size:12pt\"><span>44th Constitutional Amendment Act, 1978</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Article 352</span><span> </span><span>deals with the</span><span> </span><span style=\"font-weight:bold\">Proclamation of National Emergency</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Originally, the President could proclaim an emergency on the</span><span> </span><span style=\"font-weight:bold\">advice of the Council of Ministers</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>This wording was considered</span><span> </span><span style=\"font-weight:bold\">too broad</span><span>, as it did not clearly require a collective decision by the top executive body.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It</span><span> </span><span style=\"font-weight:bold\">explicitly inserted the word “Cabinet”</span><span> </span><span>in Article 352.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Now, a National Emergency can be proclaimed</span><span> </span><span style=\"font-weight:bold\">only on the written advice of the Cabinet</span><span> </span><span>(Prime Minister + Cabinet Ministers).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>This change was made to</span><span> </span><span style=\"font-weight:bold\">prevent misuse of emergency powers</span><span>, especially in light of the</span><span style=\"font-weight:bold\"> 1975 Emergency</span><span> experience.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Allographa effusosoredica, a newly discovered species in western ghats, belong to ____ . </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>lichen </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>cat </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>bat</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>butterfly</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Allographa effusosoredica is a newly discovered species of lichen reported from the Western Ghats.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Lichens</span><span> are </span><span style=\"font-style:italic\">symbiotic organisms</span><span> formed by the association of:</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>○</span><span style=\"width:11.4pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>a </span><span style=\"font-weight:bold\">fungus</span><span> (mycobiont) and</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>○</span><span style=\"width:11.4pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>an </span><span style=\"font-weight:bold\">alga or cyanobacterium</span><span> (photobiont).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>The genus </span><span style=\"font-weight:bold\">Allographa</span><span> belongs to </span><span style=\"font-weight:bold\">Graphidaceae</span><span>, a family of </span><span style=\"font-weight:bold\">crustose lichens</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>The Western Ghats is a global </span><span style=\"font-weight:bold\">biodiversity hotspot</span><span>, frequently yielding new species discoveries.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:12pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>The name </span><span style=\"font-weight:bold\">“effusosoredica”</span><span> refers to the presence of </span><span style=\"font-style:italic\">soredia</span><span> (powdery reproductive structures), a typical lichen trait.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following statements with respect to Dividend Distribution Tax (DDT) in India is/ are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. DDT was a tax on dividends paid to the shareholders of a company.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Budget 2025-26 has proposed to remove the DDT paid by the companies to investors.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. DDT was removed to avoid double taxation of dividends and make the Indian Equity Market more attractive.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 and 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 and 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 and 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 and 3</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Dividend Distribution Tax (DDT)</span><span> </span><span>was levied</span><span> </span><span style=\"font-weight:bold\">on the company</span><span> </span><span>distributing dividends.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Though paid by the company, it was</span><span> </span><span style=\"font-weight:bold\">effectively a tax on dividend income</span><span> </span><span>of shareholders.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">DDT was already abolished in Budget 2020–21</span><span>, effective from</span><span> </span><span style=\"font-weight:bold\">1 April 2020</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Since it no longer exists,</span><span> </span><span style=\"font-weight:bold\">Budget 2025–26 did not propose its removal</span><span>. So</span><span> </span><span style=\"font-weight:bold\">Statement 2 is Incorrect</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Under DDT, dividends were</span><span> </span><span style=\"font-weight:bold\">taxed twice</span><span>:</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>First at the</span><span> </span><span style=\"font-weight:bold\">company level (DDT)</span><span>,</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Then sometimes again at the</span><span> </span><span style=\"font-weight:bold\">shareholder level</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Its removal ensured</span><span> </span><span style=\"font-weight:bold\">dividends are taxed only in the hands of shareholders</span><span>, improving transparency and investor sentiment.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Wancho tribe of Arunachal Pradesh performs a war dance during which festival?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hornbill</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chalo Loku</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Oriah</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ojiyele</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The</span><span> </span><span style=\"font-weight:bold\">Wancho tribe</span><span> </span><span>of Arunachal Pradesh perform their traditional</span><span> </span><span style=\"font-weight:bold\">war dance</span><span> </span><span>during the</span><span> </span><span style=\"font-weight:bold\">Oriah Festival</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Oriah</span><span> </span><span>is the</span><span> </span><span style=\"font-weight:bold\">most important festival</span><span> </span><span>of the Wancho tribe.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It is celebrated to:</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Pray for</span><span> </span><span style=\"font-weight:bold\">prosperity and good harvest</span><span>,</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Honour ancestors and warriors,</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Display</span><span> </span><span style=\"font-weight:bold\">bravery and martial traditions</span><span> </span><span>through war dances, traditional weapons, and rituals.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which one of the following is the correct sequence of a food chain?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Diatoms → Crustaceans → Herrings</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Crustaceans → Diatoms → Herrings</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Diatoms → Herrings → Crustaceans</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Crustaceans → Herrings → Diatoms</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>A</span><span> </span><span style=\"font-weight:bold\">food chain</span><span> </span><span>follows the flow of energy from</span><span> </span><span style=\"font-weight:bold\">producers → primary consumers → secondary consumers</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Understanding Each Component</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Diatoms</span><span> </span><span>→</span><span> </span><span style=\"font-weight:bold\">Producers</span><br><span>Microscopic phytoplankton that perform photosynthesis.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Crustaceans</span><span> </span><span>→</span><span> </span><span style=\"font-weight:bold\">Primary consumers</span><br><span>Zooplankton (like copepods) that feed on diatoms.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Herrings</span><span> </span><span>→</span><span> </span><span style=\"font-weight:bold\">Secondary consumers</span><br><span>Small fish that feed on crustaceans.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Food Chain Sequence</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Diatoms → Crustaceans → Herrings</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mahatma Gandhi undertook fast unto death in 1932, mainly because</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Round Table Conference failed to satisfy Indian political aspirations</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Congress and Muslim League had differences of opinion</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ramsay MacDonald announced the Communal Award</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None of the statements</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Mahatma Gandhi</span><span> </span><span>undertook a</span><span> </span><span style=\"font-weight:bold\">fast unto death in 1932</span><span> </span><span>to oppose the</span><span> </span><span style=\"font-weight:bold\">Communal Award</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Communal Award (1932)</span><span> </span><span>was announced by</span><span> </span><span style=\"font-weight:bold\">Ramsay MacDonald</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It provided</span><span> </span><span style=\"font-weight:bold\">separate electorates to Depressed Classes</span><span>, which Gandhi believed would</span><span> </span><span style=\"font-weight:bold\">divide Hindu society</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>This fast led to the</span><span> </span><span style=\"font-weight:bold\">Poona Pact (1932)</span><span> </span><span>between Gandhi and Ambedkar.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Correct Answer </span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">is (C) Ramsay MacDonald announced the Communal Award</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following taxes has been replaced by Goods and Services Tax (GST)?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Additional Duty of Customs</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. State VAT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Central Excise Duty</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only </span><span> </span><span>1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 and 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 and 3</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>The</span><span> </span><span style=\"font-weight:bold\">Goods and Services Tax (GST)</span><span> </span><span>was introduced in India on</span><span> </span><span style=\"font-weight:bold\">1 July 2017</span><span> </span><span>as a</span><span> </span><span style=\"font-weight:bold\">comprehensive indirect tax</span><span>, subsuming multiple central and state-level taxes to create a</span><span> </span><span style=\"font-weight:bold\">single unified tax system</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>Taxes replaced by GST:</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Additional Duty of Customs (Countervailing Duty – CVD)</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Levied in lieu of excise duty on imported goods.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Subsumed under GST</span><span> </span><span>to ensure tax parity between imported and domestic goods.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">State Value Added Tax (State VAT)</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Imposed by states on the sale of goods.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Fully replaced by GST</span><span>, except on a few items like alcohol for human consumption.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-weight:bold\">Central Excise Duty</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Levied by the Centre on the manufacture of goods.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Merged into GST</span><span>, except for certain products like petroleum crude, diesel, petrol, natural gas, and ATF.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span>●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span>Since</span><span> </span><span style=\"font-weight:bold\">all three taxes (1, 2, and 3)</span><span> </span><span>have been replaced/subsumed by GST, the</span><span> </span><span style=\"font-weight:bold\">correct answer is Option 4</span><span>.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following correctly describes the composition of the selection committee for the Lokpal?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prime Minister, Chief Justice of India, Leader of the Opposition, Vice-President, and a Cabinet Minister</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prime Minister, Home Minister, Chief Justice of India, Attorney General, and Leader of the Opposition</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>President, Prime Minister, Chief Election Commissioner, Lok Sabha Speaker, and a Jurist</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prime Minister, Lok Sabha Speaker, Leader of the Opposition, Chief Justice of India, and an eminent jurist nominated by the President</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The</span><span> </span><span style=\"font-weight:bold\">Lokpal and Lokayuktas Act, 2013</span><span> </span><span>clearly defines the composition of the</span><span> </span><span style=\"font-weight:bold\">Selection Committee</span><span> </span><span>for appointing the Lokpal.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The Selection Committee consists of</span><span> </span><span style=\"font-weight:bold\">five members</span><span>:</span></p><ol type=\"1\"><li><span style=\"font-weight:bold\">Prime Minister</span><span> </span><span>–</span><span> </span><span style=\"font-style:italic\">Chairperson</span></li><li><span style=\"font-weight:bold\">Speaker of the Lok Sabha</span></li><li><span style=\"font-weight:bold\">Leader of Opposition in the Lok Sabha</span><ul><li><span style=\"font-family:Calibri;font-size:12pt\">If there is no recognised Leader of Opposition, then the</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Leader of the single largest opposition party</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">in the Lok Sabha</span></li></ul></li><li><span style=\"font-weight:bold\">Chief Justice of India (CJI)</span><span> </span><span>or a</span><span> </span><span style=\"font-weight:bold\">Judge of the Supreme Court nominated by the CJI</span></li><li><span style=\"font-weight:bold\">One eminent jurist</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">Nominated by the President.</span></li></ol>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which one of the following is the correct sequence of ecosystems in the order of decreasing productivity?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Oceans, lakes, grasslands, mangroves</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mangroves, oceans, grasslands, lakes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mangroves, grasslands, lakes, oceans</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Oceans, mangroves, lakes, grasslands</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Relative Productivity of Ecosystems (High → Low)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.</span><span> </span><span> </span><span style=\"font-weight:bold\">Mangroves</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Among the</span><span> </span><span style=\"font-weight:bold\">most productive ecosystems</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>High nutrient availability, warm climate, dense vegetation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2.</span><span> </span><span style=\"font-weight:bold\">Grasslands</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Moderate to high productivity</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Continuous growth of grasses, efficient energy transfer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span> </span><span style=\"font-weight:bold\">Lakes (Freshwater ecosystems)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Productivity depends on nutrient status (oligotrophic vs eutrophic)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Generally</span><span> </span><span style=\"font-weight:bold\">lower than grasslands</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4.</span><span> </span><span> </span><span style=\"font-weight:bold\">Oceans</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span style=\"font-weight:bold\">Lowest productivity per unit area</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;font-size:12pt\"><span>o</span><span> </span><span> </span><span> </span><span> </span><span>Large area but low nutrient availability in open oceans</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Correct Decreasing Order of Productivity</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Mangroves → Grasslands → Lakes → Oceans</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which state’s forest department established two parks, Ramayana Vatika and Mahabharata Vatika?</span><span> </span><span> </span><span> </span><span> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Madhya Pradesh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Uttarakhand</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Himachal Pradesh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Uttar Pradesh</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The</span><span> </span><span style=\"font-weight:bold\">Uttarakhand</span><span style=\"font-weight:bold\"> </span><span style=\"font-weight:bold\">Forest Department</span><span> </span><span>established two thematic parks named</span><span> </span><span style=\"font-weight:bold\">Ramayana Vatika</span><span> </span><span>and</span><span> </span><span style=\"font-weight:bold\">Mahabharata Vatika</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Key Points:</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>These parks are</span><span> </span><span style=\"font-weight:bold\">thematically based on Indian epics</span><span>—the</span><span> </span><span style=\"font-style:italic\">Ramayana</span><span> </span><span>and the</span><span> </span><span style=\"font-style:italic\">Mahabharata</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>They were developed as part of</span><span> </span><span style=\"font-weight:bold\">eco-tourism and cultural conservation initiatives</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The parks aim to:</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Promote</span><span> </span><span style=\"font-weight:bold\">environmental awareness</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Preserve</span><span> </span><span style=\"font-weight:bold\">cultural–mythological heritage</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Enhance</span><span> </span><span style=\"font-weight:bold\">tourism and education</span><span> </span><span>through nature-based interpretation.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parts of the following sentence have been given as options. Select the option that contains an error.</span><br><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By adopting a more disciplined approach to training, his performance improved significantly in the final months of the season.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>his performance improved significantly</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By adopting a more</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>disciplined approach to training,</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>in the final months of the season</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The sentence suffers from a</span><span> </span><span style=\"font-weight:bold\">dangling modifier</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The introductory phrase</span><span> </span><span style=\"font-weight:bold\">“By adopting a more disciplined approach to training”</span><span> </span><span>should logically refer to a</span><span> </span><span style=\"font-weight:bold\">person</span><span>, not to</span><span> </span><span style=\"font-weight:bold\">“his performance.”</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>As written, it incorrectly suggests that his performance adopted the approach.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>To be correct, the sentence should name the person, e.g., “By adopting a more disciplined approach to training,</span><span> </span><span style=\"font-weight:bold\">he</span><span> </span><span style=\"font-weight:bold\">improved his performance</span><span>…”</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Select the correct spelling of the word that best completes the sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The judge condemned the official’s actions as sheer __________, stating that such abuse of authority could not be tolerated in a democratic system.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>arbitariness</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>arbitrariness</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>arbitrarieness</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>arbitrarinass</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Arbitrariness (मनमानी)</span><span> </span><span>=</span><span> </span><span style=\"font-weight:bold\">the use of power based on personal whim rather than reason or law</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:72p \"><span style=\"font-weight:bold\">The correct answer: (D)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct option that indicates the</span><span> </span><span style=\"font-weight:bold\">logical and meaningful order</span><span> </span><span>of the following words.</span></p><ol type=\"1\"><li><span style=\"font-weight:bold\">Hypothesis</span></li><li><span style=\"font-weight:bold\">Observation</span></li><li><span style=\"font-weight:bold\">Conclusion</span></li><li><span style=\"font-weight:bold\">Experimentation</span></li><li><span style=\"font-weight:bold\">Analysis</span></li></ol>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 → 1 → 4 → 5 → 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 → 2 → 4 → 5 → 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 → 4 → 1 → 5 → 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 → 4 → 2 → 5 → 3</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The Correct Answer: (A) 2 → 1 → 4 → 5 → 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given words are related to the</span><span> </span><span style=\"font-weight:bold\">scientific method</span><span>.</span><br><span>The correct logical sequence is:</span></p><ol type=\"1\"><li><span style=\"font-weight:bold\">Observation</span><span> </span><span>– First, we observe a phenomenon.</span></li><li><span style=\"font-weight:bold\">Hypothesis</span><span> </span><span>– Based on observation, a possible explanation is proposed.</span></li><li><span style=\"font-weight:bold\">Experimentation</span><span> </span><span>– Experiments are conducted to test the hypothesis.</span></li><li><span style=\"font-weight:bold\">Analysis</span>< const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
