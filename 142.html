<html lang="en">
<head>

<title>CGL 2026 Paid Mock 1 - Hindi - Section</title>

<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 1 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, \"RIVER\" is coded as \"TKXGT\" and \"LAKE\" as \"NCMG\". How is \"POND\" coded in that language?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RQTF</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RQPF</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RQSE</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RQOF</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">LAKE → NCMG</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Check letter shift. L → N (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+2</span><span style=\"font-family:'Cambria Math'\">), A→C (+2), K→M (+2), E→G (+2)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Clear pattern: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">each letter is shifted 2 steps forward</span><span style=\"font-family:'Cambria Math'\"> in the English alphabet.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Same pattern in RIVER→TKXGT</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Apply the confirmed pattern to POND→RQPF</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement:</span><span style=\"font-family:'Cambria Math'\"> A major leakage in the main water pipeline has led to a flood-like situation in a posh residential locality, wasting thousands of liters of drinking water.</span><br><span style=\"font-family:'Cambria Math'\">I. The civic authorities should immediately shut off the water supply to the area and deploy repair teams on a war footing.</span><br><span style=\"font-family:'Cambria Math'\">II. The residents of the locality should be evacuated permanently to avoid future mishaps.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II folows</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I &amp; II follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I follow</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II follow</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Course of Action:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only I follows</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Course of Action I</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">logical, relevant, and immediate</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. Shutting off the water supply and deploying repair teams directly addresses the leakage and prevents further wastage and damage.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Course of Action II</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">illogical and extreme</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. A temporary pipeline leakage does not justify </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">permanent evacuation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of residents; the problem is repairable.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Identify the number that shall come in place of the question mark (?) in the following series:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">17, 20, 30, 47, 71, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">102</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">105</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">95</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">98</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769172015122_image001.png\" width=\"400\" height=\"154\" alt ></p>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If P means '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769172015122_image002.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">’ Q means '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769172015122_image003.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">’R means '+' and S means '-‘, then: </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18 Q 12 P 4 R 5 S 6 = ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">53</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">59</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-famil n style=\"font-family:'Cambria Math'\">20th</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18th</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">17th</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total persons = 50</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mukul is 25th from behind</span><br><span style=\"font-family:'Cambria Math'\">⇒ From front = 50 − 25 + 1 = 26th</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amrita is 10th from front</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mamta is exactly in the middle of positions 10 and 26</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Middle position</span><br><span style=\"font-family:'Cambria Math'\">= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769172015122_image010.png\" width=\"43\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">= 18</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: Mamta is 18th from the front</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, 'ROSE' is coded as '228', what is the code for 'TULIP'?</span></p>", "options": ["<p osphere</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The layer of the atmosphere that reflects radio waves back to Earth is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ionosphere</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It contains </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">charged particles (ions)</span><span style=\"font-family:'Cambria Math'\"> that help in the reflection of radio waves, enabling </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">long-distance radio communication</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Extra Details:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Weather → Troposphere</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ozone → Stratosphere</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Meteors → Mesosphere</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Radio waves &amp; aurora → Thermosphere (Ionosphere)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Satellites → Exosphere</span><span style=\"display:none;font-family:'Cambria Math'\">Top of FormBottom of Form</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider these statements about 'Jet Streams':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. They are high-altitude westerly wind systems.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. They influence the arrival and departure of monsoons in India. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which statements is/are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis – Jet Streams</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-family:'Cambria Math'\">Jet streams are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">narrow, fast-flowing air currents</span><span style=\"font-family:'Cambria Math'\"> found at </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">high altitudes</span><span style=\"font-family:'Cambria Math'\"> in the upper troposphere, and they generally flow from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">west to east (westerlies)</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><br><span style=\"font-family:'Cambria Math'\">Jet streams play an important role in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">onset and withdrawal of the Indian monsoon</span><span style=\"font-family:'Cambria Math'\">, especially the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">subtropical westerly jet</span><span style=\"font-family:'Cambria Math'\"> and the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">tropical easterly jet</span><span style=\"font-family:'Cambria Math'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span><span style=\"font-weight:bold;font-family:'Cambria Math'\"> Correct Answer:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Statement 1 and Statement 2 are correct.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which gas is used to fill weather forecasting balloons?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Helium</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nitrogen</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Argon</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Oxygen</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Helium</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Helium is Used</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Weather forecasting balloons (also known as sounding balloons) require a gas that is significantly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">less dense than air</span><span style=\"font-family:'Cambria Math'\"> to provide the necessary buoyancy to carry heavy meteorological instruments (radiosondes) into the upper atmosphere.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Helium (He):</span><span style=\"font-family:'Cambria Math'\"> It is the most common choice because it is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">non-flammable and safe</span><span style=\"font-family:'Cambria Math'\">. While it is more expensive than other options, its safety profile makes it the standard for most modern meteorological departments.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hydrogen (H2):</span><span style=\"font-family:'Cambria Math'\"> Although Hydrogen provides even more lift than Helium and is cheaper to produce, it is highly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">combustible</span><span style=\"font-family:'Cambria Math'\">.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">1</span><span style=\"font-family:'Cambria Math'\"> It is still used in some remote locations or by specific agencies, but only with strict safety protocols.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the 'Delhi Sultanate' is incorrect?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alauddin Khilji was the first Sultan to maintain a permanent standing army.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Iltutmish introduced the Silver Tanka and Copper Jital coins.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Firoz Shah Tughlaq is known for establishing a separate department for slaves called 'Diwan-i-Bandagan'.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Lodi Dynasty' was the first dynasty of the Delhi Sultanate.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement Analysis – Delhi Sultanate</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">A. Alauddin Khilji was the first Sultan to maintain a permanent standing army.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct — Alauddin Khilji maintained a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">large permanent standing army</span><span style=\"font-family:'Cambria Math'\"> to prevent rebellions and Mongol invasions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">B. Iltutmish introduced the Silver Tanka and Copper Jital coins.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Iltutmish</span><span style=\"font-family:'Cambria Math'\"> standardized the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Silver Tanka</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Copper Jital</span><span style=\"font-family:'Cambria Math'\">, strengthening the monetary system.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">C. Firoz Shah Tughlaq is known for establishing a separate department for slaves called 'Diwan-i-Bandagan'.</span><br><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct — </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Firoz Shah Tughlaq</span><span style=\"font-family:'Cambria Math'\"> created </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Diwan-i-Bandagan</span><span style=\"font-family:'Cambria Math'\"> for the welfare and management of slaves.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">D. The 'Lodi Dynasty' was the first dynasty of the Delhi Sultanate.</span><br><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:'Cambria Math'\"> — The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first dynasty</span><span style=\"font-family:'Cambria Math'\"> of the Delhi Sultanate was the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mamluk (Slave) Dynasty</span><span style=\"font-family:'Cambria Math'\">, not the Lodi dynasty.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Forward Policy' towards Afghanistan was followed by which Governor-General?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Lytton</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Ellenborough</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Mayo</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lord Dufferin</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Forward Policy' towards Afghanistan is most notably associated with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Lytton</span><span style=\"font-family:'Cambria Math'\"> (Viceroy from 1876–1880), though it was first advocated by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Auckland</span><span style=\"font-family:'Cambria Math'\"> (1836–1842).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">late 19th-century \"Great Game\" and the provocation of the Second Anglo-Afghan War—</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Lytton</span><span style=\"font-family:'Cambria Math'\"> is the primary answer.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Aspects of the Forward Policy</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The \"Forward Policy\" was an aggressive imperial strategy aimed at securing India’s North-West frontier by bringing Afghanistan under British influence to counter the perceived threat of Russian expansion.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Cabinet Mission Plan of 1946 suggested:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A partition of India into two nations.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A weak center with limited powers over defense and foreign affairs.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Abolition of the Princely States.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Immediate transfer of power to the Congress only.</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cabinet Mission Plan of 1946</span><span style=\"font-family:'Cambria Math'\"> was a critical turning point in Indian history, sent by the British government to discuss the transfer of power. Its primary goal was to preserve the unity of India while addressing the demands of the Muslim League.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Comparison with other Plans</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Plan</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Year</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Main Feature</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cripps Mission</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1942</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Offered \"Dominion Status\" after WWII; rejected by Congress.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Wavell Plan</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1945</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Proposed a balanced Executive Council; failed at the Simla Conference.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cabinet Mission</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1946</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Proposed a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">United India</span><span style=\"font-family:'Cambria Math'\"> with a weak center and provincial grouping.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mountbatten Plan</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1947</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Proposed the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Partition</span><span style=\"font-family:'Cambria Math'\"> of India into India and Pakistan.</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who has been elected as the first woman President of the Press Club of India in 2025?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sangeeta Barooah Pisharoty</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Barkha Dutt</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Faye D'Souza</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Palki Sharma</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Senior journalist </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sangeeta Barooah Pisharoty</span><span style=\"font-family:'Cambria Math'\"> was elected as the first woman President of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Press Club of India (PCI)</span><span style=\"font-family:'Cambria Math'\"> on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">December 14, 2025</span><span style=\"font-family:'Cambria Math'\">.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Her election is considered a historic milestone for the prestigious New Delhi-based institution, which was established in 1958.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">2</span><span style=\"font-family:'Cambria Math'\"> Ms. Pisharoty, a seasoned journalist who has worked with </span><span style=\"font-style:italic;font-family:'Cambria Math'\">The Hindu</span><span style=\"font-family:'Cambria Math'\"> and served as the National Affairs Editor at </span><span style=\"font-style:italic;font-family:'Cambria Math'\">The Wire</span><span style=\"font-family:'Cambria Math'\">, led her panel to a decisive </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">21–0 clean sweep</span><span style=\"font-family:'Cambria Math'\"> in the annual elections.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">+1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Election Details (2025–26)</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Post</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Winner</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">President</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sangeeta Barooah Pisharoty</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vice-President</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jatin Gandhi</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Secretary General</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Afzal Imam</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Treasurer</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Aditi Rajput (Elected unopposed)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Joint Secretary</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">P.R. Sunil (Elected unopposed)</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding Wind (Sushira Vadya) instruments and answer which of them is/are correct:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Shehnai was traditionally played in royal courts as part of the 'Naubat', a traditional ensemble of nine instruments.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Ustad Bismillah Khan is the only Shehnai player to have been awarded the Bharat Ratna, India's highest civilian award.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2 </span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Shehnai and the 'Naubat'</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Shehnai is a traditional wind instrument (</span><span style=\"font-style:italic;font-family:'Cambria Math'\">Sushira Vadya</span><span style=\"font-family:'Cambria Math'\">) that holds a significant place in Indian history and culture.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Naubat:</span><span style=\"font-family:'Cambria Math'\"> In the past, the Shehnai was an integral part of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Naubat</span><span style=\"font-family:'Cambria Math'\"> (or </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Naubat-khana</span><span style=\"font-family:'Cambria Math'\">), which was a traditional ensemble of nine musical instruments found in the royal courts, particularly during the Mughal era.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Transition to Stage:</span><span style=\"font-family:'Cambria Math'\"> Until recently, the Shehnai was primarily used in temples and during North Indian weddings because its sound was considered auspicious. It was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ustad Bismillah Khan</span><span style=\"font-family:'Cambria Math'\"> who is credited with bringing the instrument out of these ceremonial settings and onto the classical concert stage.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">2. Ustad Bismillah Khan and the Bharat Ratna</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ustad Bismillah Khan remains the most legendary figure associated with this instrument.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharat Ratna:</span><span style=\"font-family:'Cambria Math'\"> He was awarded India's highest civilian award, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharat Ratna</span><span style=\"font-family:'Cambria Math'\">, in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2001</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Exclusivity:</span><span style=\"font-family:'Cambria Math'\"> To date, he is indeed the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only Shehnai player</span><span style=\"font-family:'Cambria Math'\"> to have received this specific honor. He was the third classical musician to receive the award, following M.S. Subbulakshmi (1998) and Pandit Ravi Shankar (1999).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Historical Moment:</span><span style=\"font-family:'Cambria Math'\"> He notably played the Shehnai from the ramparts of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Red Fort</span><span style=\"font-family:'Cambria Math'\"> on August 15, 1947, as India greeted its first Independence Day.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Summary Table</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Feature</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Details</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Instrument Type</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sushira Vadya (Aerophone / Wind)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ensemble</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Part of the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Naubat</span><span style=\"font-family:'Cambria Math'\"> (9 instruments)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Award Year</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2001 (Bharat Ratna)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Achievement</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Popularized Shehnai as a classical concert instrument</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following about the 42nd Amendment Act, 1976:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. It added the words 'Socialist', 'Secular', and 'Integrity' to the Preamble.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. It introduced Fundamental Duties under Part IV-A. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which is/are correct? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">the correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(c) Both 1 and 2</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">42nd Amendment Act of 1976</span><span style=\"font-family:'Cambria Math'\"> is famously known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"Mini-Constitution\"</span><span style=\"font-family:'Cambria Math'\"> because of the extensive changes it brought to the Indian Constitution during the Emergency.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Breakdown of the Statements:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1 is Correct:</span><span style=\"font-family:'Cambria Math'\"> This amendment made the only changes ever made to the Preamble of India. It changed the description of India from a \"Sovereign Democratic Republic\" to a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"Sovereign Socialist Secular Democratic Republic\"</span><span style=\"font-family:'Cambria Math'\"> and changed \"unity of the nation\" to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"unity and integrity of the nation.\"</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2 is Correct:</span><span style=\"font-family:'Cambria Math'\"> Upon the recommendation of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Swaran Singh Committee</span><span style=\"font-family:'Cambria Math'\">, a new part, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Part IV-A</span><span style=\"font-family:'Cambria Math'\">, was added. This part contains only one article, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 51A</span><span style=\"font-family:'Cambria Math'\">, which originally listed </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">10 Fundamental Duties</span><span style=\"font-family:'Cambria Math'\"> for citizens (an 11th was added later by the 86th Amendment in 2002).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Other Key Features of the 42nd Amendment:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Shift of Subjects:</span><span style=\"font-family:'Cambria Math'\"> 5 subjects were moved from the State List to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Concurrent List</span><span style=\"font-family:'Cambria Math'\"> (Education, Forests, Weights &amp; Measures, Protection of Wild Animals/Birds, and Administration of Justice).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Primacy of DPSP:</span><span style=\"font-family:'Cambria Math'\"> It gave the Directive Principles of State Policy precedence over Fundamental Rights.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cabinet Advice:</span><span style=\"font-family:'Cambria Math'\"> It made the advice of the Cabinet </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">binding</span><span style=\"font-family:'Cambria Math'\"> on the President.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tenure Change:</span><span style=\"font-family:'Cambria Math'\"> It extended the term of the Lok Sabha and State Legislative Assemblies from 5 to 6 years (this was later reversed by the 44th Amendment).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Exam Tip:</span><span style=\"font-family:'Cambria Math'\"> Remember that the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">44th Amendment (1978)</span><span style=\"font-family:'Cambria Math'\"> was passed by the Janata Government primarily to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">undo</span><span style=\"font-family:'Cambria Math'\"> many of the controversial changes made by the 42nd Amendment (like restoring the 5-year term and adding safeguards for Emergency).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which state won the 78th Santosh Trophy national football championship title?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">West Bengal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Goa</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">West Bengal</span><span style=\"font-family:'Cambria Math'\"> won the 78th Santosh Trophy national football championship title.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They defeated </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"font-family:'Cambria Math'\"> with a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1–0</span><span style=\"font-family:'Cambria Math'\"> scoreline in a thrilling final held on December 31, 2024, at the GMC Balayogi Athletic Stadium in Gachibowli, Hyderabad.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Highlights of the 78th Santosh Trophy (2024–25):</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Winning Team:</span><span style=\"font-family:'Cambria Math'\"> West Bengal (this was their </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">33rd title</span><span style=\"font-family:'Cambria Math'\">, extending their record as the most successful team in the tournament's history).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Runner-up:</span><span style=\"font-family:'Cambria Math'\"> Kerala.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Deciding Goal:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Robi Hansda</span><span style=\"font-family:'Cambria Math'\"> scored the only goal of the match in the added time of the second half (or early extra time, depending on the report).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Top Scorer:</span><span style=\"font-family:'Cambria Math'\"> Robi Hansda (West Bengal) finished as the tournament's leading goal scorer with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">12 goals</span><span style=\"font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which city hosted the 8th International Solar Alliance (ISA) Assembly in October 2025?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Paris</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Geneva</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New Delhi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nairobi</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">8th International Solar Alliance (ISA) Assembly</span><span style=\"font-family:'Cambria Math'\"> was hosted by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">New Delhi, India</span><span style=\"font-family:'Cambria Math'\">, from October 27 to 30, 2025.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The event took place at </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharat Mandapam</span><span style=\"font-family:'Cambria Math'\">, the same venue that hosted the G20 Summit.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">2</span><span style=\"font-family:'Cambria Math'\"> The assembly was inaugurated by the President of India, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Droupadi Murmu</span><span style=\"font-family:'Cambria Math'\">, and chaired by the Union Minister for New and Renewable Energy, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pralhad Joshi</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Highlights of the 8th ISA Assembly (2025)</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Theme:</span><span style=\"font-family:'Cambria Math'\"> The assembly centered on the vision of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">\"One Sun, One World, One Grid\" (OSOWOG)</span><span style=\"font-family:'Cambria Math'\">.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">4</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Participation:</span><span style=\"font-family:'Cambria Math'\"> Representatives from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">124 member and signatory countries</span><span style=\"font-family:'Cambria Math'\"> attended, including over 40 ministers from across the globe.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">5</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Major Initiatives Launched:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">SUNRISE:</span><span style=\"font-family:'Cambria Math'\"> The </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Solar Upcycling Network for Recycling, Innovation &amp; Stakeholder Engagement</span><span style=\"font-family:'Cambria Math'\"> was introduced to manage solar e-waste and promote a circular economy.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">6</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Global Capability Centre (GCC):</span><span style=\"font-family:'Cambria Math'\"> Unveiled as a \"Silicon Valley for Solar\" in India to connect global research and innovation hubs.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">7</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">ISA Academy:</span><span style=\"font-family:'Cambria Math'\"> An AI-driven e-learning platform launched to provide specialized solar energy training globally.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">8</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Flagship Reports:</span><span style=\"font-family:'Cambria Math'\"> The ISA released two major reports—</span><span style=\"font-style:italic;font-family:'Cambria Math'\">Ease of Doing Solar 2025</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Solar Trends 2025</span><span style=\"font-family:'Cambria Math'\">—to guide global investments.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">9</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Summary Table for SSC/Competitive Exams</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Feature</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Details</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Event</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8th International Solar Alliance (ISA) Assembly</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dates</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">October 27–30, 2025</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Host City</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">New Delhi, India</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Venue</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharat Mandapam, Pragati Maidan</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">President of ISA</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India (Minister Pralhad Joshi)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Co-President</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">France (Benoit Faraco)</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which amendment reduced the voting age from 21 to 18 years?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">44th</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">61st</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">73rd</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">86th</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">61st Constitutional Amendment Act, 1988</span><span style=\"font-family:'Cambria Math'\"> reduced the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">voting age from 21 years to 18 years</span><span style=\"font-family:'Cambria Math'\"> in India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This change was made to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">encourage greater participation of youth</span><span style=\"font-family:'Cambria Math'\"> in the democratic process.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements regarding Indian musical instruments:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. The Santoor is a stringed instrument that originated in the Kashmir valley and traditionally had 100 strings, known as 'Shata-tantri Veena'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. The Pakhawaj is a two-headed, barrel-shaped drum predominantly used as an accompaniment in the Hindustani classical dance form, Kathak.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above is/are correct? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2 </span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Santoor (Shata-tantri Veena)</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Santoor is a unique stringed instrument belonging to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kashmir valley</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Historical Roots:</span><span style=\"font-family:'Cambria Math'\"> In ancient Sanskrit texts, it was referred to as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Shata-tantri Veena</span><span style=\"font-family:'Cambria Math'\"> (</span><span style=\"font-style:italic;font-family:'Cambria Math'\">Shata</span><span style=\"font-family:'Cambria Math'\"> = 100, </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Tantri</span><span style=\"font-family:'Cambria Math'\"> = strings).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mechanism:</span><span style=\"font-family:'Cambria Math'\"> It is a hammered dulcimer. The strings are stretched across a trapezoidal wooden box and played by striking them with a pair of curved wooden mallets called </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">mallets</span><span style=\"font-family:'Cambria Math'\"> or </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">kalam</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Modern Context:</span><span style=\"font-family:'Cambria Math'\"> Originally used in the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Sufiana Mausiqi</span><span style=\"font-family:'Cambria Math'\"> (Sufi music) of Kashmir, it was elevated to a classical concert instrument in the 20th century by maestros like </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pandit Shivkumar Sharma</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Pakhawaj and Kathak</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Pakhawaj is a traditional barrel-shaped, two-headed drum that serves as the rhythmic heartbeat for several ancient Indian art forms.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Structure:</span><span style=\"font-family:'Cambria Math'\"> It is a descendant of the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Mridangam</span><span style=\"font-family:'Cambria Math'\"> but has a deeper, more mellow tone. The right head is smaller and higher-pitched, while the left head provides a deep bass.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Role in Kathak:</span><span style=\"font-family:'Cambria Math'\"> While the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Tabla</span><span style=\"font-family:'Cambria Math'\"> is now the most common accompaniment for Kathak, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pakhawaj</span><span style=\"font-family:'Cambria Math'\"> is the traditional instrument used for the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dhrupad</span><span style=\"font-family:'Cambria Math'\"> style of singing and the older, more vigorous sequences of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathak</span><span style=\"font-family:'Cambria Math'\">. It is essential for providing the powerful rhythmic cycles (</spa
