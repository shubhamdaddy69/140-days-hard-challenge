n><span style=\"font-style:italic;font-family:'Cambria Math'\">taals</span><span style=\"font-family:'Cambria Math'\">) required for the intricate footwork and \"Chakkars\" (spins) in Kathak.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Summary Table</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"width:356.3pt;border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Instrument</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Type</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Primary Association</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Fact</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Santoor</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chordophone (Stringed)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kashmir / Hindustani Classical</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Played with wooden strikers; 100 strings.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pakhawaj</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Membranophone (Percussion)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathak / Dhrupad</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Precursor to the Tabla; deep, resonant bass.</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Identify the classical dance form based on the following descriptions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. It traditionally begins with an invocation called 'Alarippu'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. It is based on the 'Sadir' dance of temple dancers (Devadasis) in Tamil Nadu.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathakali</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharatnatyam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mohiniyattam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuchipudi</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The classical dance form described is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bharatanatyam</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why these descriptions identify Bharatanatyam:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Alarippu:</span><span style=\"font-family:'Cambria Math'\"> This is the traditional invocatory piece that marks the beginning of a Bharatanatyam recital. The word </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Alarippu</span><span style=\"font-family:'Cambria Math'\"> literally means \"to bloom\" or \"the blossoming of a flower.\" It is a piece of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nritta</span><span style=\"font-family:'Cambria Math'\"> (pure dance) designed to warm up the dancer's body, relax the mind, and pay respect to the Gods, the Guru, and the audience.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sadir Dance:</span><span style=\"font-family:'Cambria Math'\"> Bharatanatyam is the modern name for the ancient dance form known as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sadir</span><span style=\"font-family:'Cambria Math'\"> (or </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Sadir Attam</span><span style=\"font-family:'Cambria Math'\">). Historically, it was performed as a solo dance by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Devadasis</span><span style=\"font-family:'Cambria Math'\"> (temple dancers) in the temples and royal courts of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tamil Nadu</span><span style=\"font-family:'Cambria Math'\">. In the early 20th century, the dance was revived and rebranded as Bharatanatyam by pioneers like E. Krishna Iyer and Rukmini Devi Arundale to move away from the social stigma then associated with the Devadasi system.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Edakka' is the main percussion instrument used in which dance?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kathak</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mohiniyattam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuchipudi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bharatnatyam</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Edakka</span><span style=\"font-family:'Cambria Math'\"> (or </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Idakka</span><span style=\"font-family:'Cambria Math'\">) is the main percussion instrument used in the classical dance form of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mohiniyattam</span><span style=\"font-family:'Cambria Math'\">.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">While it is also used in other traditional Kerala art forms like </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Kathakali</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Koodiyattam</span><span style=\"font-family:'Cambria Math'\">, and </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Krishnanattam</span><span style=\"font-family:'Cambria Math'\">, it holds a uniquely central role in Mohiniyattam due to its soft, melodic capabilities which perfectly complement the graceful and feminine </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Lasya</span><span style=\"font-family:'Cambria Math'\"> style of the dance.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Features of the Edakka</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The \"Talking Drum\":</span><span style=\"font-family:'Cambria Math'\"> The Edakka is an hourglass-shaped drum.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">3</span><span style=\"font-family:'Cambria Math'\"> Unlike many other drums, it is considered a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">melodic percussion</span><span style=\"font-family:'Cambria Math'\"> instrument because the player can produce all seven musical notes (</span><span style=\"font-style:italic;font-family:'Cambria Math'\">swaras</span><span style=\"font-family:'Cambria Math'\">) by varying the tension on the strings while beating it with a stick.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">4</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sacred Status:</span><span style=\"font-family:'Cambria Math'\"> It is known as a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Devavadyam</span><span style=\"font-family:'Cambria Math'\"> (Divine Instrument) and is traditionally played during temple rituals and </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Sopana Sangeetham</span><span style=\"font-family:'Cambria Math'\"> (devotional music sung at temple steps) in Kerala.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">5</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Construction:</span><span style=\"font-family:'Cambria Math'\"> It features a wooden body with two drumheads.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">6</span><span style=\"font-family:'Cambria Math'\"> Interestingly, the drumheads are not permanently fixed to the body; they are held in place by a system of interlaced strings that the player squeezes to change the pitch.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">7</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Use in Different Dance Forms</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"width:320.15pt;border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dance Form</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Role of the Edakka</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mohiniyattam</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">primary</span><span style=\"font-family:'Cambria Math'\"> percussion instrument; provides the rhythmic and melodic backbone.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathakali</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Used primarily as an accompaniment for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">female characters</span><span style=\"font-family:'Cambria Math'\"> (</span><span style=\"font-style:italic;font-family:'Cambria Math'\">Stree Vesham</span><span style=\"font-family:'Cambria Math'\">) when the louder </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Chenda</span><span style=\"font-family:'Cambria Math'\"> drum is silenced to maintain a graceful atmosphere.</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Koodiyattam</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Cambria Math'\">8</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Acts as a supporting instrument to the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Mizhavu</span><span style=\"font-family:'Cambria Math'\"> (pot drum).</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">9</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which article of the Indian Constitution empowers the President to consult the Supreme Court?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 129</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 143</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 72</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 32</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 143</span><span style=\"font-family:'Cambria Math'\"> of the Indian Constitution, the President has the power to consult the Supreme Court. This provision is known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Advisory Jurisdiction</span><span style=\"font-family:'Cambria Math'\"> of the Supreme Court.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">+1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Provisions of Article 143</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The article is divided into two primary categories under which the President may seek an opinion:</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 143(1): Questions of Law or Fact</span><span style=\"font-family:'Cambria Math'\"> The President may refer any question of law or fact that has arisen, or is likely to arise, which is of such public importance that it is \"expedient\" to obtain the Supreme Court's opinion. In these cases, the Supreme Court </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">may</span><span style=\"font-family:'Cambria Math'\"> choose to give its opinion or may decline (as it did in the 1993 Ram Janmabhoomi case).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 143(2): Pre-Constitutional Disputes</span><span style=\"font-family:'Cambria Math'\"> The President may refer disputes arising out of any pre-Constitution treaty, agreement, or covenant. In these specific instances, the Supreme Court </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">must</span><span style=\"font-family:'Cambria Math'\"> tender its opinion to the President.</span></li></ul>"}, {"qid": "", "question": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Identify the ruler based on these statements:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. He was the first to issue silver coins called &#39;Rupiya&#39;.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. He built the Grand Trunk Road.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. He defeated Humayun in the Battle of Kannauj. </span></p>", "options": ["\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Akbar</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sher Shah Suri</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Babur</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Alauddin Khilji</span></p>"], "correct": 2, "marks": "1", "explanation": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ruler described by these statements is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sher Shah Suri</span><span style=\"font-family:'Cambria Math'\"> (reigned 1540&ndash;1545), the founder of the Suri Empire in North India.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why these statements define him:</span></p>\r\n\r\n<ul style=\"margin:0pt;padding-left:0pt\" type=\"disc\">\r\n\t<li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Rupiya:</span><span style=\"font-family:'Cambria Math'\"> Sher Shah Suri is credited with introducing the silver coin known as the </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Rupiya</span><span style=\"font-family:'Cambria Math'\">, which weighed 178 grains. This currency system laid the foundation for the modern Rupee used today in India, Pakistan, and several other nations.</span></li>\r\n\t<li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The Grand Trunk (GT) Road:</span><span style=\"font-family:'Cambria Math'\"> While the route existed in ancient times (known as </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Uttarapatha</span><span style=\"font-family:'Cambria Math'\">), Sher Shah Suri reconstructed and extended it to connect Chittagong (now in Bangladesh) to Kabul (now in Afghanistan). He built </span><span style=\"font-style:italic;font-family:'Cambria Math'\">sarais</span><span style=\"font-family:'Cambria Math'\"> (rest houses) and planted trees along the route to facilitate trade and communication.</span></li>\r\n\t<li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Defeat of Humayun:</span><span style=\"font-family:'Cambria Math'\"> Sher Shah Suri fought two decisive battles against the Mughal Emperor Humayun. After defeating him at the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Battle of Chausa (1539)</span><span style=\"font-family:'Cambria Math'\">, he delivered the final blow at the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Battle of Kannauj (1540)</span><span style=\"font-family:'Cambria Math'\">, forcing Humayun into exile for 15 years and establishing the Sur Dynasty in Delhi.</span></li>\r\n</ul>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Facts at a Glance</span></p>\r\n\r\n<table cellpadding=\"0\" cellspacing=\"0\" style=\"width:356.9pt;border:0.75pt solid #000000;border-collapse:collapse\">\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Feature</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Details</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Original Name</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Farid Khan</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Title</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">&quot;Sher Shah&quot; (bestowed after he killed a tiger)</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mausoleum</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A magnificent tomb in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sasaram, Bihar</span><span style=\"font-family:'Cambria Math'\">, located in the middle of an artificial lake.</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Administration</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"border: 1px solid black;\">\r\n\t\t\t<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Known for his brilliant land revenue system (Zabit system) later adopted by Akbar.</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"> </p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When did India become a member of the World Trade Organization (WTO)?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1991</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1995</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1999</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2001</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India became a member of the World Trade Organization (WTO) on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">January 1, 1995</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">India is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">founding member</span><span style=\"font-family:'Cambria Math'\"> of the WTO, as it was one of the original signatories to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Marrakesh Agreement</span><span style=\"font-family:'Cambria Math'\"> (signed in April 1994), which officially established the organization to replace the General Agreement on Tariffs and Trade (GATT).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Contextual Details</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Successor to GATT:</span><span style=\"font-family:'Cambria Math'\"> Before the WTO was formed, India had been a member of its predecessor, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">GATT</span><span style=\"font-family:'Cambria Math'\">, since July 8, 1948.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Role as a Developing Nation:</span><span style=\"font-family:'Cambria Math'\"> Since joining, India has been a prominent voice for developing countries, particularly in negotiations regarding agricultural subsidies, intellectual property rights (TRIPS), and food security.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">5</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Major Milestone:</span><span style=\"font-family:'Cambria Math'\"> Membership in 1995 was a significant step in India's \"Liberalization, Privatization, and Globalization\" (LPG) journey that began with the 1991 economic reforms.</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Cambria Math'\">6</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Comparison: GATT vs. WTO</span></li></ul><table cellspacing=\"0\" cellpadding=\"0\" style=\"width:350.9pt;border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Feature</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">GATT (1948–1994)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">WTO (1995–Present)</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Status</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A set of rules (Ad hoc agreement)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A permanent legal institution</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Scope</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only trade in goods</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Goods, Services, and Intellectual Property</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dispute Settlement</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Slower and non-binding</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Faster and legally binding</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">India's Role</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Original signatory (1948)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Founding member (1995)</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the 'Red Soil' in India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. It develops on crystalline igneous rocks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. It is generally poor in nitrogen and phosphorus. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which is/are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2 </span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">1. Development on Crystalline Igneous Rocks</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Red soil is primarily formed from the weathering of ancient </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">crystalline igneous</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">metamorphic rocks</span><span style=\"font-family:'Cambria Math'\"> (such as granite and gneiss).</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It develops specifically in areas with low rainfall, such as the eastern and southern parts of the Deccan Plateau.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The soil derives its characteristic red color from the high concentration and wide diffusion of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">iron oxide</span><span style=\"font-family:'Cambria Math'\"> (ferric oxide) within these crystalline rocks. When the soil occurs in a hydrated form, it may appear yellow.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements about the Gupta Empire:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Samudragupta is known as the 'Napoleon of India'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. Chandragupta II's court was adorned by the 'Navaratnas'. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the above is/are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">correct</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">1. Samudragupta as the 'Napoleon of India'</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This title was given to Samudragupta by the historian </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">V.A. Smith</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason:</span><span style=\"font-family:'Cambria Math'\"> Much like Napoleon Bonaparte, Samudragupta was a brilliant military strategist who never faced defeat.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Evidence:</span><span style=\"font-family:'Cambria Math'\"> His military conquests are detailed in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Prayag Prashasti</span><span style=\"font-family:'Cambria Math'\"> (Allahabad Pillar Inscription), composed by his court poet </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Harisena</span><span style=\"font-family:'Cambria Math'\">. It describes his \"Digvijaya\" (conquest of the world), including the defeat of nine kings in North India and twelve in South India.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">2. Chandragupta II and the 'Navaratnas'</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chandragupta II (also known as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vikramaditya</span><span style=\"font-family:'Cambria Math'\">) was the son of Samudragupta. His court at Ujjain was legendary for its patronage of art and science, adorned by nine scholars known as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Navaratnas</span><span style=\"font-family:'Cambria Math'\"> (Nine Gems).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sound waves travel fastest in which of the following mediums?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Air</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Water</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Steel</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vacuum</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(c) Steel</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why Sound Travels Fastest in Steel</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sound is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">mechanical wave</span><span style=\"font-family:'Cambria Math'\">, meaning it requires a physical medium to travel. Its speed is determined by how quickly the particles of that medium can pass vibrations to one another.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solids (Steel):</span><span style=\"font-family:'Cambria Math'\"> Particles in solids are packed very closely together and have strong intermolecular bonds. This allows the energy of the sound wave to transfer almost instantaneously from one atom to the next.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Liquids (Water):</span><span style=\"font-family:'Cambria Math'\"> Particles are further apart than in solids, so the speed of sound is slower (about ,480m/s.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Gases (Air):</span><span style=\"font-family:'Cambria Math'\"> Particles are very far apart and collide less frequently, making sound travel the slowest 343 m/s.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vacuum:</span><span style=\"font-family:'Cambria Math'\"> Sound </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">cannot travel</span><span style=\"font-family:'Cambria Math'\"> through a vacuum at all because there are no particles to carry the vibration.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Comparison of Speed</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The speed of sound generally follows this order: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Solids &gt; Liquids &gt; Gases</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rhodophyceae are commonly known as:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Brown algae</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Green algae</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Red algae</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Blue-green algae</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The members of the class </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Rhodophyceae</span><span style=\"font-family:'Cambria Math'\"> are commonly known as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">red algae</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Characteristics of Rhodophyceae</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The name \"red algae\" comes from the predominance of a specific red pigment that masks other colors.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pigmentation:</span><span style=\"font-family:'Cambria Math'\"> They contain </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">chlorophyll a</span><span style=\"font-family:'Cambria Math'\">, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">chlorophyll d</span><span style=\"font-family:'Cambria Math'\">, and the red pigment </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">r-phycoerythrin</span><span style=\"font-family:'Cambria Math'\">. This pigment allows them to absorb blue and green light, which penetrates deeper into the water, enabling some species to live at depths of up to 200 meters.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Habitat:</span><span style=\"font-family:'Cambria Math'\"> They are predominantly marine and are most abundant in warmer oceanic regions.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Stored Food:</span><span style=\"font-family:'Cambria Math'\"> They store food in the form of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">floridean starch</span><span style=\"font-family:'Cambria Math'\">, which is structurally very similar to amylopectin and glycogen.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cell Wall:</span><span style=\"font-family:'Cambria Math'\"> Their cell walls are composed of cellulose, pectin, and complex polysaccharides like </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">agar</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">carrageenan</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lack of Motility:</span><span style=\"font-family:'Cambria Math'\"> A unique feature of red algae is that they </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">completely lack flagella</span><span style=\"font-family:'Cambria Math'\"> at all stages of their life cycle; both their spores and gametes are non-motile.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Comparison with Other Algal Classes</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the study of the Plant Kingdom, algae are typically categorized into three main classes based on their color and pigments:</span></li></ul><table cellspacing=\"0\" cellpadding=\"0\" style=\"width:295.3pt;border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Class</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Common Name</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Major Pigments</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:center;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Stored Food</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;t t or perceived clearly</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Palpable</span><span style=\"font-family:'Nirmala UI'\"> has the same meaning and fits the context.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other options are incorrect</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Abstract</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — opposite of tangible</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Ethereal</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — light, delicate, not solid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Imaginary</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — not real</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
