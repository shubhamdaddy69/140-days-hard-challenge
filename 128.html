<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 8 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following numbers will replace the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">123, 119, 127, 123, 131, 127, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">139</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">136</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">135</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">137</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Odd positions:</span><br><span style=\"font-family:'Cambria Math'\">123 → 127 → 131</span><br><span style=\"font-family:'Cambria Math'\">Each term increases by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Even positions:</span><br><span style=\"font-family:'Cambria Math'\">119 → 123 → 127</span><br><span style=\"font-family:'Cambria Math'\">Each term also increases by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">+4</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">7th term</span><span style=\"font-family:'Cambria Math'\"> is at an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">odd position</span><span style=\"font-family:'Cambria Math'\">, so:</span><br><span style=\"font-family:'Cambria Math'\">131 + 4 = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">135</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: 135</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which option represents the correct order of the given words as they would appear in an English dictionary?</span><br><span style=\"font-family:'Cambria Math'\">1 Typographical</span><br><span style=\"font-family:'Cambria Math'\">2 Typologically</span><br><span style=\"font-family:'Cambria Math'\">3 Typifications</span><br><span style=\"font-family:'Cambria Math'\">4 Typicalness</span><br><span style=\"font-family:'Cambria Math'\">5 Tyrannosaurus</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5,2,1,3,4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4,3,1,2,5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2,3,5,4,1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2,3,5,1,4</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Words starting with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Typ</span><span style=\"font-family:'Cambria Math'\"> will come before </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tyr</span><span style=\"font-family:'Cambria Math'\">, so </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tyrannosaurus</span><span style=\"font-family:'Cambria Math'\"> will be </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">last</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now arrange the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Typ-</span><span style=\"font-family:'Cambria Math'\"> words:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Typicalness</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Typi</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">c</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">…)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Typifications</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Typi</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">f</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">…)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Typographical</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Typo</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">g</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">…)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Typologically</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Typo</span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">l</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">…)</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Because:</span><br><span style=\"font-family:'Cambria Math'\">c &lt; f &lt; g &lt; l (alphabetical order)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So the correct order is:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">4, 3, 1, 2, 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Correct option: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">4,3,1,2,5</span></p>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A paper is folded and cut as shown below. How will it appear when unfolded?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1770898855875_image001.png\" width=\"309\" height=\"97\" alt ></p>", "options": [" <p style=\"margin-top:0 t-weight:bold;font-family:'Cambria Math'\">Explanation:</span><span style=\"font-family:'Cambria Math'\"> The original Preamble of the Indian Constitution (1950) described India as a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sovereign Democratic Republic</span><span style=\"font-family:'Cambria Math'\">. However, during the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">42nd Amendment Act of 1976</span><span style=\"font-family:'Cambria Math'\">, two new terms—</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Socialist</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Secular</span><span style=\"font-family:'Cambria Math'\">—were inserted to emphasize the commitment to social and economic justice and religious neutrality. After this amendment, the sequence in the Preamble reads:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Sovereign Socialist Secular Democratic Republic.”</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Kuruwa' form of slash-and-burn agriculture is practiced in which state?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerela</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> Jharkhand</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kuruwa</span><span style=\"font-family:'Cambria Math'\"> form of slash-and-burn agriculture is practiced in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Jharkhand</span><span style=\"font-family:'Cambria Math'\">. It is a traditional method of shifting cultivation where forest patches are cleared, vegetation is burnt, and crops are grown for a few years before the land is left fallow to regain fertility. This practice is common among tribal communities in Jharkhand and is part of their subsistence farming system. Similar slash-and-burn methods exist in other states under different names, such as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Jhum</span><span style=\"font-family:'Cambria Math'\"> in the Northeast, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Podu</span><span style=\"font-family:'Cambria Math'\"> in Andhra Pradesh, and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bevar/Dahiya</span><span style=\"font-family:'Cambria Math'\"> in Madhya Pradesh.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In 2025, which Indian state became the first to implement the Scheduled Caste Categorisation of Reservations Act?</span></p>", "options": ["<p style पधनiौपic ोकोूपोपiयnौ यी ंोngनयॅधौ. Hधncध, ौपोपधंधnप 2 iौ ोिसय cयननधcप."}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karakattam, a traditional folk dance involving balancing pots on the head, is popular in:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerela</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tamil Nadu</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tamil Nadu</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Karakattam</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a traditional folk dance of Tamil Nadu, performed in praise of the rain goddess Mariamman.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The dance involves </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">balancing decorated pots on the head</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> while performing rhythmic movements.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is often accompanied by lively music and is a popular feature in village festivals.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This dance form showcases both devotion and physical skill, blending ritual with entertainment.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Monoecious plants are defined as:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Having only male flowers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Having only female flowers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Plants that flower only once in a lifetime.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Having both male and female reproductive organs on the same plant.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Having both male and female reproductive organs on the same plant</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Monoecious plants</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> are those in which both </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">male (staminate)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">female (carpellate)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> flowers occur on the same individual.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This adaptation ensures that a single plant can produce both pollen and ovules, increasing chances of reproduction.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Examples include </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">maize, cucumber, and castor</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In contrast, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">dioecious plants</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (like papaya, date palm) have male and female flowers on separate plants.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to basic physics, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1- In uniform circular motion, the speed of the object remains constant but its velocity changes continuously.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- Centripetal force in circular motion always acts along the tangent to the circle.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1 only</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>In </span><span style=\"font-weight:bold\">uniform circular motion</span><span>, the </span><span style=\"font-weight:bold\">speed remains constant</span><span>, but since the direction of motion changes continuously, the </span><span style=\"font-weight:bold\">velocity also changes continuously</span><span>. This makes statement 1 correct.</span></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">centripetal force</span><span> in circular motion always acts </span><span style=\"font-weight:bold\">towards the center of the circle</span><span>, not along the tangent. The tangent represents the instantaneous direction of velocity, while the centripetal force is perpendicular to it. Hence, statement 2 is incorrect.</span></li></ol>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to basic chemistry, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1- Water is called a universal solvent because it can dissolve all known substances.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- Ice generally floats on water because its density is lower than that of liquid water.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 only</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Statement 1 is </span><span style=\"font-weight:bold\">incorrect</span><span> because water is called a </span><span style=\"font-weight:bold\">universal solvent</span><span> not because it dissolves </span><span style=\"font-style:italic\">all</span><span> known substances, but because it can dissolve a </span><span style=\"font-weight:bold\">wide variety of substances</span><span> (especially ionic and polar compounds) more than most other liquids. Substances like oils and many non-polar compounds do not dissolve in water.</span></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Statement 2 is </span><span style=\"font-weight:bold\">correct</span><span> because </span><span style=\"font-weight:bold\">ice floats on water</span><span> due to its lower density. When water freezes, hydrogen bonding causes its molecules to arrange in a crystalline structure with more open space, making ice less dense than liquid water.</span></li></ol>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to Indian Polity, which among the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1- The Constitution of India provides for a Parliamentary system of government at the Union as well as State levels.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- The principle of collective responsibility of the Council of Ministers to the Lok Sabha is mentioned explicitly in the Constitution.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both 1 &amp; 2</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Statement 1 is correct — The </span><span style=\"font-weight:bold\">Constitution of India</span><span> establishes a </span><span style=\"font-weight:bold\">Parliamentary system of government</span><span> both at the Union level (Articles 74 &amp; 75) and at the State level (Articles 163 &amp; 164).</span></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span>Statement 2 is also correct — The principle of </span><span style=\"font-weight:bold\">collective responsibility</span><span> of the Council of Ministers to the Lok Sabha is explicitly mentioned in </span><span style=\"font-weight:bold\">Article 75(3)</span><span>, which states that the Council of Ministers shall be collectively responsible to the House of the People.</span></li></ol>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Identify the incorrect statement regarding Enzymes:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Their activity is independent of pH levels and temperature.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Most enzymes are chemically composed of proteins.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They possess specific \"active sites\" for substrate binding.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">They are biological catalysts that lower the activation energy of a reaction.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The incorrect statement is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Their activity is independent of pH levels and temperature.”</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Enzymes are </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">biological catalysts</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> that lower the activation energy of reactions.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Most enzymes are </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">proteins</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (though some RNA molecules, called ribozymes, also act as enzymes).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Enzymes have specific </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">active sites</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for substrate binding, ensuring high specificity.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Enzyme activity is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not independent of pH and temperature</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. Each enzyme has an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">optimum pH and temperature</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> range. Deviations can reduce activity or denature the enzyme, making this statement incorrect.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The \"Strait of Hormuz\" connects:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Red Sea and Gulf of Aden</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mediterranean Sea and Atlantic Ocean</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Persian Gulf and Gulf of Oman </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Black Sea and Sea of Marmara</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Persian Gulf and Gulf of Oman</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Strait of Hormuz</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a strategically vital waterway that connects the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Persian Gulf</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gulf of Oman</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, and further to the Arabian Sea.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is one of the world’s most important chokepoints for oil transport, with a significant portion of global petroleum trade passing through it.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The other options are mismatches:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Red Sea and Gulf of Aden are connected by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bab-el-Mandeb Strait</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Mediterranean Sea and Atlantic Ocean are connected by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Strait of Gibraltar</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Black Sea and Sea of Marmara are connected by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bosporus Strait</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Under the Bharatiya Nyaya Sanhita (BNS), which replaced the IPC in 2024/25, the term \"Sedition\" has been changed to?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Retained with the same definition.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Section penalizing acts endangering sovereignty and unity.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Completely abolished without any replacement.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Made a bailable offence.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Section penalizing acts endangering sovereignty and unity</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Under the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Indian Penal Code (IPC)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, sedition was defined in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 124A</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bharatiya Nyaya Sanhita (BNS), 2023/24</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, this provision has been </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">repealed</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> but effectively reintroduced under </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Section 152</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, titled </span><span style=\"line-height:108%;font-size:12pt;font-style:italic;font-family:'Cambria Math'\">“Acts endangering sovereignty, unity and integrity of India.”</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The new section broadens the scope: it penalizes anyone who, by words (spoken or written), signs, electronic communication, financial means, or other methods, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">excites or attempts to excite secession, armed rebellion, subversive activities, or endangers India’s sovereignty and unity</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Thus, sedition has not been abolished outright; it has been reframed with a new nomenclature and wider ambit.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sonal Mansingh is a famous exponent of which dance form?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bot \"font-family:'Cambria Math'\">Banks to borrow from RBI without collateral.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">RBI to print new currency.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Banks to deposit with RBI without collateral.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Corporates to borrow directly from RBI.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Banks to deposit with RBI without collateral</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Standing Deposit Facility (SDF)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was introduced by the Reserve Bank of India in 2022 as part of its liquidity management toolkit.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It allows </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">banks to park (deposit) their surplus funds with the RBI without the need for collateral</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, unlike the reverse repo which requires government securities as collateral.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The SDF rate acts as the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">floor of the Liquidity Adjustment Facility (LAF) corridor</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, giving RBI more flexibility in managing liquidity and interest rates.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Importantly, it does </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not involve borrowing by banks</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> or currency printing by RBI, and corporates cannot access it directly.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arrange the following Tiger Reserves from North to South:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1-Periyar</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2- Simlipal</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3- Pench</span></p><p style=\"margin-top:0pt;margin- ght:bold;font-family:'Cambria Math'\">Simple Majority</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Articles 2 and 3 </span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">of the Constitution deal with the admission of new states and the alteration of boundaries, names, or areas of existing states.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 4(2)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> clarifies that laws made under Articles 2 and 3 are considered </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ordinary laws</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not constitutional amendments.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Therefore, they can be passed by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">a simple majority in Parliament</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, unlike constitutional amendments which require a special majority (and sometimes ratification by states).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Kala Ghoda Arts Festival' is held annually in which city? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New Delhi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mumbai</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kolkata</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bengaluru</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> Mumbai</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kala Ghoda Arts Festival</span><span style=\"font-family:'Cambria Math'\"> is held annually in the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kala Ghoda precinct of South Mumbai, Maharashtra</span><span style=\"font-family:'Cambria Math'\">. It began in 1999 and has grown into one of India’s largest multidisciplinary street arts festivals, showcasing visual arts, music, dance, theatre, literature, heritage walks, and culinary experiences. The name “Kala Ghoda” (meaning </span><span style=\"font-style:italic;font-family:'Cambria Math'\">Black Horse</span><span style=\"font-family:'Cambria Math'\">) comes from a historic statue of King Edward VII that once stood in the area. Today, the festival is a major cultural highlight of Mumbai, attracting artists and visitors from across India and abroad.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The river 'Mahanadi' originates from the highlands of:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhattisgarh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madhya Pradesh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Maharashtra </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>"], "correct": 1, "marks": "1", "explanation": "Cयननधcप Anौथधन: CुुोपपiौgोनुEसूिोnोपiयn: Tुध नiॅधन Mोुोnोकi यनiginोपधौ ीनयं पुध Siुोथो ुiििस nधोन Nोgनi पयथn in Dुोंपोनi कiौपनicप यी Cुुोपपiौgोनु. Fनयं पुधनध, iप ीियथौ धोौपथोनक पुनयहgु Cुुोपपiौgोनु ोnक Oकiौुो ृधीयनध धंूपदing inपय पुध Bोद यी Bधngोि. Tुध नiॅधन iौ ोृयहप 900 ां ियng ोnक iौ ाnयथn ीयन iपौ ीधनपiिध ृोौin, थुicु ौहूूयनपौ धसपधnौiॅध ोgनicिहपहनध. Iप iौ ोिसय ुयंध पय पुध Hiनोाहक Dों, यnध यी पुध ियngधौप कोंौ in पुध थयिनक, ृहiिप in Oकiौुो."}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Tebhaga Movement' (1946) was a peasant movement in: </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihar</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bengal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Andhra Pradesh</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> Bengal</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Tebhaga Movement (1946–47)</span><span style=\"font-family:'Cambria Math'\"> was a significant peasant uprising in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bengal</span><span style=\"font-family:'Cambria Math'\">, led by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kisan Sabha</span><span style=\"font-family:'Cambria Math'\"> (the peasant front of the Communist Party of India). The sharecroppers (bargadars) demanded that instead of giving half of their produce to landlords, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">they should only give one-third (tebhaga = \"three shares\")</span><span style=\"font-family:'Cambria Math'\"> and keep two-thirds for themselves. The movement arose from widespread exploitation of peasants and was particularly strong in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">North Bengal districts.</span><span style=\"font-family:'Cambria Math'\"> Although it faced repression, the agitation laid the foundation for later land reforms and highlighted the struggle of peasants against feudal structures.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kumar’s monthly salary is ₹48,000. He spends 30% of his salary on household expenses and 15% of the remaining amount on transportation. After that, he pays 10% of his total salary as income tax and saves ₹6,000. What is the amount (in ₹) left with him after all expenses and savings?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹17,740</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹17,750</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹17,760</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">₹17,770</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Salary = 48,000</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Household = 30% → 14,400</span><br><span style=\"font-family:'Cambria Math'\">Remaining = 33,600</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Transport = 15% of 33,600 → 5,040</span><br><span style=\"font-family:'Cambria Math'\">Tax = 10% of 48,000 → 4,800</span><br><span style=\"font-family:'Cambria Math'\">Savings = 6,000</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Total deduction = 14,400 + 5,040 + 4,800 + 6,000</span><br><span style=\"font-family:'Cambria Math'\">= 30,240</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amount left = 48,000 − 30,240</span><br><span style=\"font-family:'Cambria Math'\">= ₹17,760</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a trapezoid ABCD with AB parallel to CD, the diagonals AC and BD intersect at E. What is the ratio of the area of △ABE to the area of △CDE?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ratio of AB to CD squared.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ratio of AB to CD.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ratio of the perimeter of △ABE to the perimeter of △CDE.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The ratio of the area of △ABC to the area of △BCD.</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;text-align:justify;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In trapezoid </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ABCD</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, where </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">AB ∥ CD</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the diagonals </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">AC</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">BD</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> intersect at </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">E</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The point of intersection of diagonals in a trapezoid divides them in the ratio of the parallel sides.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Thus, the triangles formed by the diagonals are similar in a ratio proportional to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">AB : CD</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Since area of similar triangles is proportional to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">square of corresponding sides</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">,</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Area of △ABE : Area of △CDE = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(AB : CD)²</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When 1452, 2178 and 3264 are divided by the greatest number ‘p’, the remainder in each case is ‘q’. What is the value of √(p − q)?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√6</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√3</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2178 − 1452 = 726</span><br><span style=\"font-family:'Cambria Math'\">3264 − 2178 = 1086</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">p = HCF(726, 1086)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1086 − 726 = 360</span><br><span style=\"font-family:'Cambria Math'\">726 − 2×360 = 6</span><br><span style=\"font-family:'Cambria Math'\">360 ÷ 6 = 60</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">∴ p = 6</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">q = remainder when 1452 ÷ 6 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√(p − q) = √(6 − 0) = √6</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pipes A and B can fill a tank in 24 minutes and 36 minutes respectively. A drain pipe C can empty the tank in 72 minutes. If all three pipes are opened together, in how many minutes will the tank be filled?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18 minutes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">16 minutes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">17 minutes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20 minutes</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1770898926250_image001.png\" width=\"388\" height=\"359\" alt ></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Two circles with radii 6 cm and 2 cm have their centers 10 cm apart. How many common tangents can be drawn between them, and what type(s) of tangents are they?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4 tangents: 2 direct and 2 transverse</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 tangents: 2 direct and 1 transverse</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 tangents: only direct tangents</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">0 tangents: the larger circle completely contains the smaller one</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Radii: r₁ = 6 cm, r₂ = 2 cm</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Distance between centres, d = 10 cm</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">r₁ + r₂ = 6 + 2 = 8 cm</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">r₁ − r₂ = 6 − 2 = 4 cm</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Since</span><br><span style=\"font-family:'Cambria Math'\">d &gt; r₁ + r₂ (10 &gt; 8),</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">the circles are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">separate and do not intersect</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">For two separate circles, the number of common tangents = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">4</span><br><span style=\"font-family:'Cambria Math'\">→ </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 direct (external) tangents</span><br><span style=\"font-family:'Cambria Math'\">→ </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 transverse (internal) tangents</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A fruit seller sells 18 kg of oranges for ₹900, thereby gaining the cost price of 3 kg of oranges. What is his profit percentage?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20%</span></p>", "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1770898926250_image002.png\" width=\"48\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1770898926250_image003.png\" width=\"48\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25%</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;mar n style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Means weak, delicate, not related to enthusiasm.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Callous (निर्दयी):</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Means insensitive or unfeeling, opposite in tone.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym of the word 'EXCORIATE'.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Castigate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Reprimand</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Laud</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Abrade</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct antonym of </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“Excoriate”</span><span style=\"font-family:'Nirmala UI'\"> is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Laud (प्रशंसा करना / सराहना करना)</span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul typ
