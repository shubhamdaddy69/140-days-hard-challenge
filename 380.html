<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">

    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

agraha (active     but non-violent resistance) that he had lived and worked for, had     failed to bind the people in troubled times.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     He was in Kolkata in the areas which were torn by gruesome riots     between Hindus and Muslims. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     Gandhiji went on to persuade the Hindus and Muslims to give up     violence.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     His presence in Kolkata greatly improved the situation, and the     coming of independence was celebrated in a spirit of communal     harmony, with joyous dancing in the streets</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>S6.     Gandhiji’s prayer meetings attracted large crowds. But this was     short lived as riots between Hindus and Muslims erupted once     again and Gandhiji had to resort to a fast to bring peace</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BACD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     ‘a’ is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: S1 BACD S6: <b>On     the 15th August 1947 Mahatma Gandhi did not participate in any of     the Independence Day celebrations. He was in Kolkata in the areas     which were torn by gruesome riots between Hindus and Muslims. He     was saddened by the communal violence and disheartened that the     principles of ahimsa (non-violence) and satyagraha (active but     non-violent resistance) that he had lived and worked for, had     failed to bind the people in troubled times. Gandhiji went on to     persuade the Hindus and Muslims to give up violence. His presence     in Kolkata greatly improved the situation, and the coming of     independence was celebrated in a spirit of communal harmony, with     joyous dancing in the streets. Gandhiji’s prayer meetings     attracted large crowds. But this was short lived as riots between     Hindus and Muslims erupted once again and Gandhiji had to resort     to a fast to bring peace.</b></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Are     you looking forward ______ Arpit again?</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     to     see</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     to     be seeing</p>", "<p style=\"orphans:0;widows:0;text-d ure, industry, or     services. Consumers participate in the market when they purchase     goods and services that they need. These are the final goods that     people as consumers use.</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">P.     At times false information is passed on through the media, and     other sources to attract consumers.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Q.      These companies with huge wealth, power and reach can manipulate     the market in various ways.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">R.     This happens especially when large companies are producing these     goods.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>S.     Markets do not work in a fair manner when producers are few and     powerful whereas consumers purchase in small amounts and are     scattered.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     QSRP</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     PQRS</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     SRQP</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     RPSQ</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct arrangement is: SRQP: </span><span><b>Markets     do not work in a fair manner when producers are few and powerful     whereas consumers purchase in small amounts and are scattered.     This happens especially when large companies are producing these     goods. These companies with huge wealth, power and reach can     manipulate the market in various ways. At times false information     is passed on through the media, and other sources to attract     consumers.</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in direct speech.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Manan     said that he had no work to do that day.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Manan     said, “I have no work to do today.”</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Manan     said, “I have no work to do that day.”</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Manan     says, “I had no work to do that day.”</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Manan     said, “Have I no work to do today?”</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Transformation     rule- Direct to Indirect Speech- </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">If     <b>Reporting     Verb</b>     (sentence outside inverted comma) is in past tense and <b>Reported     Speech</b>     (Sentence inside the inverted comma) then following     transformation occurs- </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Simple     Present Tense ----------------- Simple Past Tense</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Present     Continuous Tense ----------- Past Continuous Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Present     Perfect Tense ----------------- Past Perfect Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Present     Perfect Continuous Tense – Past Perfect Continuous Tense. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Other     transformation occurs according to the basic rule of     transformation. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct direct speech of the given sentence is: </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span><b>Manan     said, “I have no work to do today.”</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>I     assume that you have learnt a valuable lesson from this     experience, ____________ ̲?</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     did you</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     didn’t     you</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     haven’t     you</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     have     you</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     C is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Rules     for making question tag-: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>1.     </b></span><b>The     sentence and the question tag must be in the same tense. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>2.     If the sentence is positive, the question tag must be negative     and vice versa. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>3.     Always use pronoun in the question tag.</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>4.     For negative question tag, use the contracted form of ‘helping     verb’ and </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Not’.     Eg.- didn’t, hadn’t, won’t etc. </b></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Thus,     the completer sentence is</span><span><b>:     I assume that you have learnt a valuable lesson from this     experience, haven’t you.</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate One Word Substitution of the given group of     words. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>An     established principle of practical wisdom.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Marxism</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Neologism</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Platonism</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Maxim</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Maxim.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Maxim</b>:     a brief statement of a general truth, principle, or rule for     behavior; An established principle of practical wisdom.<b>     </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Marxism</b>:     Marxism is a social, economic and political philosophy that     analyses the impact of the ruling class on the laborers, leading     to uneven distribution of wealth and privileges in the society.     It stimulates the workers to protest the injustice.</span></p>     <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Neologism</b>:     a new word, phrase or expression, or a new meaning of a familiar     word. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span><b>Platonism</b></span><span>:     Platonism is the view that there exist such things as     abstract objects — where an abstract object is an object     that does not exist in space or time and which is therefore     entirely non-physical and non-mental.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Within the country the crafts industry has to compete with large     multinationals and corporates as young people buy branded     clothing and lifestyle products.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     Who produce cheap products in large quantities and are quick to     diversify to meet changing trends and fashions.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     The biggest threat to the crafts sector in India are from     industrial manufacturers, in India and aboard. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     Today globalisation and liberalisation of trade policies have     meant that quality handmade products from all other countries can     enter and compete with the existing crafts industry in India. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     CBAD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CBDA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDAB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentence     C is starting sentence and CB are pair. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Hence     the correct arrangement is: CBDA: </span><span><b>The     biggest threat to the crafts sector in India are from industrial     manufacturers, in India and aboard, who produce cheap products in     large quantities and are quick to diversify to meet changing     trends and fashions. Today globalisation and liberalisation of     trade policies have meant that quality handmade products from all     other countries can enter and compete with the existing crafts     industry in India. Within the country the crafts industry has to     compete with large multinationals and corporates as young people     buy branded clothing and lifestyle products.</b></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the correct passive voice of the given sentence.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sakshi     invited Riya for a party.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Riya has been     invited for a party by Sakshi.</p>", "<p style=\"orphans:0;widows: le=\"orphans:0;widows:0;margin-bottom:0in\">     1     Horse Power(HP)= 746 watt. <span>Power     in physics is defined as the rate of doing work or the rate at     which a particular work is performed by a machine.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Power     = Work Done / time (sec)</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Watt     (W) is used as an absolute unit of power.</span></p>     <p style=\"orphans:0;widows:0\"><span>When     talking about the practical unit of power, it is horsepower (HP).     1 HP is defined as the amount of work that can be done by a     standard horse in one second. </span>     </p>"}, {"qid": "", "question": "\r\n<p>What was the theme of Environment day 2024?</p>", "options": ["\r\n<p>Living Sustainably in Harmony with Nature</p>", "\r\n<p>Solutions to Plastic pollution</p>", "\r\n<p>Land Restoration, Desertification &amp; Drought Resilience</p>", "\r\n<p>Ecosystem Restoration</p>"], "correct": 3, "marks": "1", "explanation": "\r\n<p>World Environment Day is celebrated on <strong>June 5</strong> every year to raise awareness and encourage action for the protection of our planet.</p>\r\n\r\n<p>World Environment Day will celebrate its 51st anniversary in 2024 with the theme &ldquo;<strong>LAND RESTORATION, DESERTIFICATION &amp; DROUGHT RESILIENCE&rdquo;</strong> based on &ldquo;Ecosystem Restoration&rdquo; under the slogan &ldquo;Our land. Our future. We are #GenerationRestoration.&rdquo;.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     is the biggest Jute producer state in India?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     West     Bengal</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra</p>", "<p style=\"orphans:0;widows:0\">     Uttar     Pradesh      </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Bihar</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     correct answer is West Bengal. It is the largest producer of jute     in India with 80% of Jute production in India. It’s followed by     Assam and Bihar. India is the largest producer of jute in the     world. Approximately 60% of the total world produce of jute is     cultivated in India.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     is the Ex-officio Chairman of Rajya Sabha?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     President</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Vice-President</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Leader     of Opposition</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Prime     Minister of India</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Vice-President of India. The Vice President of     India is the ex-officio Chairman of Rajya Sabha. This means that     by virtue of his position as Vice President, he automatically     becomes the Chairman of the Upper House and presides over its     session. The House also elects a Deputy Chairman from among its     members.                                                 </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Article(63-73)     related to the Vice President of India:      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span><b>ARTICLE     63 : THE VICE-PRESIDENT OF INDIA</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span><b>ARTICLE     64 : THE VICE-PRESIDENT TO BE EX-OFFICIO CHAIRMAN OF THE COUNCIL     OF STATES</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span><b>ARTICLE     65 : THE VICE-PRESIDENT TO ACT AS PRESIDENT OR TO DISCHARGE HIS     FUNCTIONS DURING CASUAL VACANCIES IN THE OFFICE, OR DURING THE     ABSENCE, OF PRESIDENT</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span><b>ARTICLE     66 : ELECTION OF VICE-PRESIDENT.   Etc.</b></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following is considered a capital receipt?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0\">     Rent     received.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Money     received for services provided to customers.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sales     of fixed assets</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span style=\"background:#ffffff\">D</span>iscount     received from suppliers, vendors or creditors.</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is sales of fixed assets. It is a capital receipt.          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Capital     Receipts: Capital receipts refer to the funds or resources that a     government, organization, or individual receives from sources     representing increased capital or net worth. These receipts are     generally one-time or non-recurring and are not a regular source     of income. They aim to raise funds through long-term sources such     as equity, debt, and sale of assets to finance capital     expenditure<i>.     </i>Example:     Sale of land, equipment or investments, borrowings, grants. Etc.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Revenue     receipts: Revenue receipts can be defined as those receipts     which neither create any liability nor cause any reduction in the     assets of the government. They are regular and recurring in     nature and the government receives them in the normal course of     activities.          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Example:     Any kind of rent received, Interest earned, Money received from     goods and services provided to the clients, Discount received     from the vendors, suppliers, or the creditors etc.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "\r\n<p>Who amongst the following is cabinet secretary of India as of Sep 2024?</p>", "options": ["\r\n<p>TV Somanathan</p>", "\r\n<p>Hardeep Singh Puri</p>", "\r\n<p>Rajiv Gauba</p>", "\r\n<p>Pankaj Saran</p>"], "correct": 1, "marks": "1", "explanation": "\r\n<p>The correct answer is TV Somanathan. He is the current Cabinet secretary of India. The first Cabinet secretary of India was N.R Pillai.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     In     which year was the Estimates Committee constituted for the first     time in India?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1948</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1949</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1947</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1950</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is 1950. The first Estimates Committee in the     post-independence era was constituted in 1950 on the     recommendation of John Mathai, who was then finance minister of     India.                                                                                                      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Originally,     it had 25 members but in 1956 its membership was raised to 30.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     All     the thirty members are from Lok Sabha only, The Rajya Sabha has     no representation in this committee.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     What     is the rank of India in the Global Gender Gap Index 2023?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     135</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     127</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     146</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     154</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is 127<sup>th</sup>.     India’s rank is 127<sup>th</sup>     out of 146<sup>th</sup>     countries in the report’s 2023 edition. Last year India’s     rank was 135<sup>th</sup>.     India’s neighbours Pakistan ranked at 142, Bangladesh at 59,     China at 107, Nepal at 116, Sri Lanka at 115 and Bhutan at 103.                                                                          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Global     Gender Gap Index: It benchmarks countries on their progress     towards gender parity in four Key dimensions with Submatrices.</p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Economic      Participation and Opportunity.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Educational      Attainment.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Health      and Survival.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Political      Empowerment.       </p>     </li></ol>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     On     each of the four sub-indices as well as on the overall index the     GGG index provides scores between 0 and 1, where 1 shows full     gender parity and 0 is complete imparity.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Objective:     To serve as a <b>compass     to track progress on relative gaps</b> between     women and men on health, education, economy and politics.                                                </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Through     this annual yardstick, the <b>stakeholders     within each country are able to set priorities</b> relevant     in each specific economic, political and cultural context.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Who founded the &lsquo;All India Depressed Classes Federation&rsquo; in 1920?</p>\r\n\r\n<p> </p>", "options": ["<p>Mahatma Gandhi</p>", "<p>Abul Kalam Azad</p>", "<p>Jyotiba Phule</p>", "<p>B.R. Ambedkar</p>"], "correct": 4, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Dन. B.R. Aंृधकाोन. Tुध Aिि Inकiो कधूनधौौधक cिोौौधौ ोौौयciोपiयn थोौ ीयहnकधक ृद Dन B.R. Aंृधकाोन. Dन B.R. Aंृधकाोन धौपोृिiौुधक पुध Aिि Inकiो कधूनधौौधक cिोौौधौ ोौौयciोपiयn पय ंोाध ौहनध पुोप ीोiन नधूनधौधnपोपiयn थोौ giॅधn पय पुध Scुधकिहधक Cोौपधौ in पुध कधciौiयn ंोाing ृयकiधौ यी Inकiो."}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The dows:0;margin-bottom:0in\">     Article     352: Proclamation of emergency (National Emergency).</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Kathakali is a classical dance of which state?</p>\r\n\r\n<p> </p>", "options": ["<p>Andhra Pradesh</p>", "<p>Kerala</p>", "<p>Karnataka</p>", "<p>Tamil Nadu</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">The correct answer is Kerala.</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">&bull; Kathakali is an evolved dance form popular in the South Indian state of Kerala.</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">&bull; This Indian classical dance involves musical and vocal performances accompanied by graceful footwork and storytelling movements through expressive facial and hand gestures.</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:11.0pt\">There are total 8 classical dances of India.</span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">1. Bharatanatyam</span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">    -</span></span>    <span style=\"font-size:11.0pt\">Tamil Nadu</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">2. Kathak</span>            <span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">-    </span></span><span style=\"font-size:11.0pt\">Northern India</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">3. Kathakali </span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">         -    </span></span><span style=\"font-size:11.0pt\">Kerala</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">4. Kuchipudi </span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">        -</span></span>     <span style=\"font-size:11.0pt\">Andhra Pradesh</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">5. Manipuri</span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">         -    </span></span><span style=\"font-size:11.0pt\"> Manipur</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">6. Mohiniyattam</span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">    -     </span></span><span style=\"font-size:11.0pt\"> Kerala</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">7. Odissi</span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">           -     </span></span><span style=\"font-size:11.0pt\"> Odisha</span></span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">8. Sattriya </span></span><span style=\"font-size:10.0pt\"><span style=\"font-family:&quot;Mangal&quot;,serif\">         -</span></span>      <span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Assam</span></span></p>"}, {"qid": "", "question": "\r\n<p>Which of the following statement is/are correct?</p>\r\n\r\n<ol>\r\n\t<li>\r\n\t<p>Ajanta is a series of rock-cut caves in the <strong>Sahyadri ranges (Western Ghats)</strong> on Waghora river near Aurangabad in <strong>Maharashtra</strong>.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>There are a total of 29 caves out of which 25 were used as viharas or residential caves while 4 were used as chaityas or pryaer halls.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>The Ajanta caves were inscribed by Buddhist monks, under the patronage of the <strong>Vakataka kings</strong> &ndash; Harishena being a prominent one.</p>\r\n\t</li>\r\n</ol>", "options": ["\r\n<p>All A, B and C</p>", "\r\n<p>Only A and B</p>", "\r\n<p>Only B and C</p>", "\r\n<p>Only A and C</p>"], "correct": 1, "marks": "1", "explanation": "\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">Option A is the correct answer.</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">All the three statements about Ajanta caves are correct.</span></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">Ajanta is a series of rock-cut caves in the Sahyadri range (Western Ghats) on the Vaghora River near Aurangabad in Maharashtra.</span></span></span></li>\r\n\t<li><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">There are a total of 29 caves out of which 25 were used as viharas or residential caves while 4 were used as chaityas or prayer halls.</span></span></span></li>\r\n\t<li><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">The Ajanta Caves were carved by Buddhist monks under the patronage of the Vakataka kings &ndash; of whom Harishena was the chief.</span></span></span></li>\r\n\t<li><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-size:11.0pt\">The caves were developed between 200 BC to 650 AD.</span></span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">References to the Ajanta Caves can be found in the travelogues of the Chinese Buddhist travelers Fa Hien (during the reign of Chandragupta II; 380 &ndash; 415 CE) and Hiuen Tsang (during the reign of Emperor Harshavardhana; 606 &ndash; 647 CE).</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Sankirtana     is a style of _____________________, one of the classical dances     of India.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Kathak</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Odissi</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Manipuri</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kuchipudi</p>"], "correct": 3, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Mोniूहनi. Tुध कोncध in Mोniूहन iौ ोौौयciोपधक थiपु नiपहोिस ोnक पनोकiपiयnोि ीधौपiॅोिस, पुधनध ोनध िधgधnकोनद नधीधनधncधौ पय पुध कोncधौ यी Sुiॅो ोnक Pोनॅोपi ोnक यपुधन gयकौ ोnक gयककधौौधौ थुय cनधोपधक पुध हniॅधनौध. Mोniूहन कोncध ुोौ ो िोनgध नधूधनपयiनध, ुयथधॅधन, पुध ंयौप ूयूिहोन ीयनंौ ोनध पुध Rोौ, पुध Sोnाiनपोnो ोnक पुध Tुोng-Tो. Tुध Kiनपोn ीयनं यी cयngनधgोपiयnोि ौinging ोccयंूोniधौ पुध कोncध थुicु iौ ाnयथn ोौ Sोnाiनपोnो in Mोniूहन."}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     light bulb working on a 12 V battery draws a current of 2 A. What     will be the resistance of the bulb?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     24     Ω</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     18     Ω</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     6     Ω</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     3     Ω</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is 6 Ω.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     According     to Ohm’s law V= IR, where V = Voltage, I = current, and R =     resistance.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Hence     R = 12V/2A = 6 Ω.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Ohm’s     Law allows you to determine characteristics of a circuit, such as     how much current is flowing through it, if you know the voltage     of the battery in the circuit and how much resistance is in the     circuit.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Which of the following is not a primary colour?</p>\r\n\r\n<p> </p>", "options": ["<p>Red</p>", "<p>Green</p>", "<p>Blue</p>", "<p>White</p>"], "correct": 4, "marks": "1", "explanation": "<p>The spectral colour blue, Red and Green are primary called primary colours because all the colours can be produced by mixing these in proper proportion.</p>\r\n\r\n<p>Blue + Red + Green = White.</p>\r\n\r\n<p>Secondary Colour: The colour produced by mixing any two primary colours is called a secondary colour. There are three colours yellow, magneta and cyans.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which     of the following statement is correct about Important Functions     of RBI?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Statement:          </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Issue      of Bank Notes       </p>      </li>< planation for the mistakes. Therefore, this course of action follows.</span></p><p><span style=\"font-family:Calibri\">Hence, ( Both I and II follow ) option c is correct answer.</span></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> A question is given, followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements is sufficient to answer the question. Read both the statements and select the appropriate answer.</span><p><span style=\"font-family:Calibri\">Four people, A, B, C and D, are sitting in a straight line, facing south. Who is sitting at the right end?</span></p><p><span style=\"font-family:Calibri\">Statements:</span></p><p><span style=\"font-family:Calibri\">(I) Only two people sit between B and D; A sits to the immediate left of B.</span></p><p><span style=\"font-family:Calibri\">(II) Only one person sits between B and C; A sits to the immediate right of C.</span></p>", "options": ["<span style=\"font-family:Calibri\"> Data in statement II alone is sufficient to answer the question while data in statement I is not</span>", "<span style=\"font-family:Calibri\"> Data in either statement I alone or statement II alone is sufficient to answer the question</span>", "<span style=\"font-family:Calibri\"> Data in statements I and II together is sufficient to answer the question</span>", "<span style=\"font-family:Calibri\"> Data in statement I alone is sufficient to answer the question while data in statement II is not</span>"], "correct": 4, "marks": "1", "explanation": "<span style=\"font-family:Calibri\"> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711519523012_image012.png\" width=\"311\" height=\"345\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-family:Calibri\"> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span style=\"font-family:Calibri\">242,</span><span style=\" const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
