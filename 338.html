<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 19 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "<p>     A sum of     Rs.10,000 is lent at 3 (1/3)% per 4  months compound interest,     compounded annually. What is the difference between the compound     interest for 3rd year and 4th year?</p>     <p><br>      </p>", "options": ["<p>     Rs.169</p>", "<p>     Rs.196</p>", "<p>     Rs.144</p>", "<p>     Rs.121</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_71e1ab79d0c2ad71.png\" width=\"283\" height=\"353\" > </p>"}, {"qid": "", "question": "<p>     A, B and C     started a business with the investment of Rs. 10,000, Rs 27,000     and Rs 33,000 respectively. After 4 months, C left the business.     6 months after C left the business, B also left the business. B     and C took their investments with them. At the end of the year,     Total share of profit of A and C is Rs. 403.2, What is the total     share of profits of A and B?</p>     <p><br>      </p>", "options": ["<p>     594</p>", "<p>     692</p>", "<p>     237.5</p>", "<p>     624</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_24920798f7c64626.png\" width=\"364\" height=\"240\" > </p>"}, {"qid": "", "question": "<p>     The ratio of     milk to water in a 100 mitres mixture is 3:7. 10 litres of     mixture is withdrawn and replaced with milk. This process is     repeated 3 more times. What is the approximate percentage of milk     in the final mixture.</p>     <p><br>      </p>", "options": ["<p>     46</p>", "<p>     48</p>", "<p>     54</p>", "<p>     46</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_3af8af4d4737487.png\" width=\"293\" height=\"264\" > </p>"}, {"qid": "", "question": "<p>     A cuboidal     water tank has 216 liters of water. Its depth is 1/3 of its     length and breadth is ½ of 1/3 of the difference of length and     depth. The length of the tank (in cm) is?</p>     <p><br>      </p>", "options": ["<p>     18 cm</p>", "<p>     180 cm</p>", "<p>     1800 cm</p>", "<p>     18000 cm</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_a54ce3176f92401b.png\" width=\"317\" height=\"363\" > </p>"}, {"qid": "", "question": "<p>     The ratio of     the efficiencies of A, B and C is 7:4:5. Working together, they     can complete a piece of work in 18 days. A and B work together     for 8 days. The remaining work will be completed by C alone in     how many days if he works with twice efficiency?</p>     <p><br>      </p>", "options": ["<p>     27 days</p>", "<p>     18 days</p>", "<p>     20 days</p>", "<p>     24 days</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_720b1497a06a8499.png\" width=\"280\" height=\"291\" > </p>"}, {"qid": "", "question": "<p>     <span>Surbhi     sold an article for 177.5 after giving 29% discount on its marked     price. Had she not given any discount; she would have earned a     profit of 66.67%. What is the cost price (in rupees) of the     article?</span></p>     <p><br>      </p>", "options": ["<p>     <span>250</span></p>", "<p>     <span>200</span></p>", "<p>     <span>150</span></p>", "<p>     <span>110</span></p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_1ce1f9fe134f408d.png\" width=\"256\" height=\"240\" > </p>"}, {"qid": "", "question": " <p>     Consider the following frequency distribution of exam scores:</p>     <p>     <br>      </p>     <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_19e04b592035c8f.png\" width=\"165\" height=\"125\" > </p>     <p>     <br>      </p>     <p>     Calculate the mean of the exam scores using this frequency     distribution. (Round off your answer to the nearest integer).</p>     <p><br>      </p>", "options": ["<p>     102</p>", "<p>     88</p>", "<p>     95</p>", "<p>     91</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_f8cdb27caabc7402.png\" width=\"259\" height=\"310\" > </p>"}, {"qid": "", "question": " <p>     Find the LCM of           <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_43a7d47f41302bbb.gif\" > </p>     <p><br>      </p>", "options": ["<p>     4</p>", "<p>     12</p>", "<p>     ½      </p>", "<p>     36</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_864469ff42ebb731.jpg\" width=\"249\" height=\"240\" > </p>"}, {"qid": "", "question": " <p>     The figure     below shows two concentric circles with centre O. PQRS is a     square inscribed in the outer circle. It also circumscribes the     inner circle, touching it at point B, C, D and A. What is the     ratio of perimeter of the outer circle to that of polygon ABCD?</p>     <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_d6532ebef1230c1c.png\" width=\"171\" height=\"148\" > </p>     <p><br>      </p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_be61c054c4218e6f.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_6a3ab157e0265c9.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_e8489ca1bf8e7573.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_4954ad72c002102.gif\" > </p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_982ded4419381887.png\" width=\"369\" height=\"283\" > </p>     <p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_3ce9960569faee89.png\" width=\"213\" height=\"189\" > </p>"}, {"qid": "", "question": " <p>     What is the     value of      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_de9b906a573e9cc5.gif\" >      ?</p>     <p><br>      </p>", "options": ["<p>     0</p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_10402002e76ef735.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_aa8574105ea75968.gif\" > </p>", "<p>     1</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_4653ec89a3a8a27d.png\" width=\"408\" height=\"235\" > </p>"}, {"qid": "", "question": "<p>     One-third of     one fifth of one percent written in decimal.</p>     <p><br>      </p>", "options": ["<p>     0.667</p>", "<p>     0.0667       </p>", "<p>     0.00667</p>", "<p>     0.000667</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_cff8bd1d5bdce165.jpg\" width=\"285\" height=\"216\" > </p>"}, {"qid": "", "question": "\r\n<p>Given that x⁸ - 34x⁴ + 1 = 0, x &gt; 0. What is the value of <img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703587207a0a6fa24-1703587207.png\" style=\"height:27px; width:56px\" /><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\">)</span></span>?</p>\r\n\r\n<p> </p>", "options": ["<p>12</p>", "<p>14</p>", "<p>18</p>", "<p>16</p>"], "correct": 2, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_e8b91bedeee5eb97.png\" style=\"height:345px; width:252px\" /></p>"}, {"qid": "", "question": "<p>     <span>A     person lent a certain sum of money at 3 (1/3)% simple interest,     and in 6 years the interest amounted to Rs. 600 less than the sum     lent. Find the sum lent.</span></p>", "options": ["<p>     600</p>", "<p>     650</p>", "<p>     700</p>", "<p>     750</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_6086bbbf14a7ac9b.png\" width=\"221\" height=\"156\" > </p>"}, {"qid": "", "question": "<p>A, B and C are employed to do a work for Rs 1014. A and B together can do 9/13 of the work and (B &amp;C) together do 7/13 of the work. Find the amount A get?</p>\r\n\r\n<p> </p>", "options": ["<p>468</p>", "<p>234</p>", "<p>312</p>", "<p>425</p>"], "correct": 1, "marks": "1", "explanation": "\r\n<p> </p>"}, {"qid": "", "question": " <p>     The table below represents the sales data for a company over four     quarters of a year:</p>     <p>     <br>      </p>     <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_4009d0c2d130a579.png\" width=\"265\" height=\"127\" > </p>     <p>     Based on the data provided, answer the following question:</p>     <p>     What is the average profit (₹) per unit sold in Q4?</p>     <p><br>      </p>", "options": ["<p>     25000</p>", "<p>     250.55</p>", "<p>     25.83</p>", "<p>     20.83</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_930185b6534a9d14.gif\" alt=\"Shape1\" width=\"386\" height=\"251\" > </p>"}, {"qid": "", "question": " <p>     Evaluate the     following.</p>     <p>     <br>      </p>     <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_484f599c816c025c.gif\" > </p>     <p><br>      </p>", "options": ["<p>     2</p>", "<p>     4</p>", "<p>     3</p>", "<p>     1</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_5d95461c11e8122.png\" width=\"314\" height=\"363\" > </p>"}, {"qid": "", "question": "<p>     In a town, the     population was 6000. In one-year, male population increased by 6%     and female population increased by 9% but the total population     increased by 7%. The number of males in the town was.</p>     <p><br>      </p>", "options": ["<p>     4000       </p>", "<p>     2000       </p>", "<p>     5000       </p>", "<p>     3500</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_d015e17446ebac8d.jpg\" width=\"175\" height=\"286\" > </p>"}, {"qid": "", "question": "<p>     If I travel by     bus, I reach my office 12 min late, and if I travel by car, I     reach 10 min early. If the distance between my home and my office     is 44 km, then the difference of the reciprocals of average     speeds of the bus and the car, in second per metre is:</p>", "options": ["<p>     3/50</p>", "<p>     3/100</p>", "<p>     5/70</p>", "<p>     None of these</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_3a0072187603bdcf.png\" width=\"231\" height=\"284\" > <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_c404f45b3c642354.gif\" alt=\"Shape2\" width=\"21\" height=\"35\" > <span style=\"float:left;width:0.22in;border:none;padding:0in;background:#ffffff\"><p>      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693829934687_html_442a4eba7346d8fd.gif\" > </p>     </span>     </p>"}, {"qid": "", "question": "<p>     <span>Rs.     500 is distributed between A, B and C in such a way that Rs 16     more than 2/5th part of A, Rs 70 less than 3/4th part of B and Rs     4 less than 3/5th part of C are all equal. Find the money     received by B.</span></p>", "options": ["<p>     <span>200      </span>     </p>", m and readily remove their dead     branches to eliminate potential sources of fuel.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">C.<span style=\"background:#ffffff\">     </span>In     keeping their leaves and vital growth tissues far above the reach     of most flames, these trees can often survive a fire with only     minor charring to their trunks.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">D.<span style=\"background:#ffffff\">     </span>A     tall crown and few to no lower branches is a strategy a number of     tree species employ to reduce wildfire damage.</span></p>", "options": ["<p>     DCAB</p>", "<p>     ABCD</p>", "<p>     BCAD</p>", "<p>     CABD</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DCAB: D.) <i><b>A     tall crown and few to no lower branches is a strategy a number of     tree species employ to reduce wildfire damage. C) In keeping     their leaves and vital growth tissues far above the reach of most     flames, these trees can often survive a fire with only minor     charring to their trunks. A) This adaptation is common in several     pine species as well as in many Eucalyptus species. B)     Some of these trees, such as the ponderosa pine, have even     evolved a “self-pruning” mechanism and readily remove their     dead branches to eliminate potential sources of fuel.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in passive voice.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Someone     stole my phone last week. </span>     </p>", "options": ["<p>     Last week my     phone was steal by somebody.</p>", "<p>     My phone was     stolen last week by somebody.</p>", "<p>     My phone was     stolen that week by somebody.</p>", "<p>     Somebody last     week has stolen my phone.</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><u><b>Active     and Passive Voice Rules for Past Simple Tense</b></u></span></span></p>     <table>      <col>       <col>       <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Active        Voice</b></span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Passive        Voice</b></span></span></p>        <p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>(Auxiliary Verb-        was/were)</b></span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject        + V2+ object</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Object+        was/were V3+ by + subject</span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject        +did+ not+v1+ object</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Object        + was/were+ not +V3+ by Subject</span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Did+        subject+V1+ object+?</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Was/were        + Object+ V3+ by subject +?</span></span></p>       </td>      </tr>     </table>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct passive voice of the given sentence is: <i><b>My     phone was stolen last week by somebody.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Arrange     the statements in the correct order to make a meaningful     paragraph.<br> A. But, in developed societies, the childhood and     adolescence is extended.<br> B. In rural communities, the     customs are more uniform.<br> C. This provides more     opportunities for education and character development.<br> D.     The practices of child rearing vary from culture to culture.</span></p>", "options": ["<p>     DABC</p>", "<p>     BADC</p>", "<p>     BCDA</p>", "<p>     DBAC</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     D is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DBAC: </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     The practices of child rearing vary from culture to culture.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>B.     In rural communities, the customs are more uniform.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>A.     But, in developed societies, the childhood and adolescence is     extended.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>C.     This provides more opportunities for education and character     development.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Fear     of height. </span>     </p>", "options": ["<p>     Agoraphobia</p>", "<p>     Hydrophobia</p>", "<p>     Acrophobia</p>", "<p>     Pyrophobia</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     C is the correct answer.    </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Acrophobia</b>:     a morbid fear of great heights.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Agoraphobia</b>:     a morbid fear of open spaces (as fear of being caught alone in     some public place).</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Hydrophobia</b>:     a morbid fear of water.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Pyrophobia</b>:     a morbid fear of fire. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct OWS is “<i><b>Acrophobia</b></i>”.     </span>     </p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to substitute the underlined segment     in the given sentence. If there is no need to substitute it,     select ‘No substitution required’.<br> Hardly had <u><b>we     get in but</b></u>     the train started.</span></p>", "options": ["<p>     we got in when</p>", "<p>     No Substitution     required</p>", "<p>     we got in     before</p>", "<p>     we get in than</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option B. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>We     always use the pair of conjunctions: </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Hardly     ------- When.</b></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>No     sooner ---- than. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Scarcely     ------- When. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is in past tense. So, we need to use the past     tense form of the verb “get” which is “got”. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">So,     the correct sentence is: <i>Hardly     had </i><i><u><b>we     got in when</b></u></i><i>     the train started.</i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     following sentence has been divided into parts. One of them may     contain an error. Select the part that contains the error from     the given options. If you don’t find any error, mark ‘No     error’ as your answer.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     amount of/ money are/ not sufficient.  </span>     </p>", "options": ["<p>     The amount of      </p>", "<p>     No error</p>", "<p>     money are</p>", "<p>     not sufficient</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option C.  </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is grammatically incorrect. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Rule:     With uncountable nouns we use ‘Amount of / Quantity of’     followed by a singular verb. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     ‘is’ should come instead of ‘are’. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct sentence is: <i><b>The     amount of money is not sufficient.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in passive voice.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Ravi     Sihag would have written this essay in time. </span>     </p>", "options": ["<p>     The essay was     written on time</p>", "<p>     This essay     would have been written by Ravi Sihag in time.</p>", "<p>     The essay was     written by Ravi Sihag in time.</p>", "<p>     Ravi Sihag     wrote the essay on time</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.    </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     Voice to Passive Voice transformation rules: </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + would + have + v3 + Obj ------- Obj + would + have + been + v3     + by + Sub. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct passive form of the given sentence is: <i><b>This     essay would have been written by Ravi Sihag in time.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in passive voice.  </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     team completed the project ahead of schedule.</span></p>", "options": ["<p>     The project was completed by the team ahead of schedule.</p>", "<p>     The project was     being completed by the team ahead of schedule.</p>", "<p>     The project has     been completed by the team ahead of schedule.</p>", "<p>     The project was     completed after the schedule by the team.</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option C.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><u><b>Active     and Passive Voice Rules for Past Simple Tense</b></u></span></span></p>     <table>      <col>       <col>       <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Active        Voice</b></span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Passive        Voice</b></span></span></p>        <p>        <span style=\"display:inline-block;border:none;padding:0in\"><span><b>(Auxiliary Verb-        was/were)</b></span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject        + V2+ object</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Object+        was/were V3+ by + subject</span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject        +did+ not+v1+ object</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Object        + was/were+ not +V3+ by Subject</span></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Did+        subject+V1+ object+?</span></span></p>       </td>       <td><p>        <span style=\"display:inline-block;border:none;padding:0in\"><span>Was/were        + Object+ V3+ by subject +?</span></span></p>       </td>      </tr>     </table>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Hence,     the correct answer is: <i><b>The     project was completed by the team ahead of schedule.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     practice of refraining from marriage:</span></p>", "options": ["<p>     Celibacy</p>", "<p>     Monogamy</p>", "<p>     Polygamy</p>", "<p>     Pederasty</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Celibacy</b>:     the practice of abstaining from marriage and sexual relations. It     is a voluntary choice often associated with religious or personal     reasons. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Monogamy</b>:     having only one spouse at a time. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Polygamy</b>:     having more than one spouse at a time. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Pederasty</b>:     This term refers to a sexual relationship between an adult man     and a young boy, and it does not pertain to the practice of     refraining from marriage.</span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Given     below are four jumbled sentences. Select the option that gives     their correct logical sequence.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">A.     India is Sri Lanka's<b> </b>closest     neighbour.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">B.     In recent years, the relationship has been marked by close     contacts at the highest political level, growing trade and     investment, cooperation in the fields of development, education,     culture and defense.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">C.     The relationship between the two countries is more than 2,500     years old and both sides have built upon a legacy of     intellectual, cultural, religious and linguistic interaction.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">D.     As well as a broad understanding of major issues of international     interest.</span></p>", "options": ["<p>     ABCD</p>", "<p>     BCDA</p>", "<p>     ACBD</p>", "<p>     ABDC</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct logical sequence for the given jumbled sentences is:(C)     ACBD</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     arranged sentences are:</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>A.     India is Sri Lanka's closest neighbour.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>C.     The relationship between the two countries is more than 2,500     years old and both sides have built upon a legacy of     intellectual, cultural, religious and linguistic interaction.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>B.     In recent years, the relationship has been marked by close     contacts at the highest political level, growing trade and     investment, cooperation in the fields of development, education,     culture and defense.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     As well as a broad understanding of major issues of international     interest.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">In     summary, the logical sequence is ACBD, as it moves from     introducing the countries' proximity, to discussing their     historical relationship, then highlighting recent developments,     and concluding with their shared understanding on international     issues.</span></p>"}, {"qid": "", "question": "<p>Select the sentence that contains no spelling errors.</p>", "options": ["<p>The occurrence of their annual conference will take place next week, and they&#39;re excited to share their new findings and innovative research approaches with their peers.</p>", "<p>The occurence of their annual conferance will take place next week, and they&#39;re exctied to share theire new findings and innovative research approaches with their peers.</p>", "<p>The occurence of their annual conferance will take place next week, and they&#39;re excited to share their new findings and innovative research approaches with their peers.</p>", "<p>The occurrence of their annual conferance will take place next week, and they&#39;re excited to share their new findings and innnovative research approaches with their peers.</p>"], "correct": 1, "marks": "1", "explanation": "<p>Option A is the correct answer.</p>\r\n\r\n<p>The sentence with correct spelling is: The occurrence of their annual conference will take place next week, and they&#39;re excited to share their new findings and innovative research approaches with their peers.</p>\r\n\r\n<p>Some confusing word in the sentence are: Occurrence, Conference, Excited, their, innovative, etc.</p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate ANTONYM of the given word.<br> CLENCH</span></p>", "options": ["<p>     relax</p>", "<p>     tighten</p>", "<p>     hold</p>", "<p>     clasp</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">CLENCH:     When you <i>clench</i> something,     you grip, press, or squeeze it. You might <i>clench</i> your     fists when you're angry or <i>clench</i> your     teeth when you're worried, for example.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Relax:</b>     This is the correct antonym. \"Clench\" means to tightly     grasp or close something, often referring to the hands or teeth.     \"Relax,\" on the other hand, means to become less tense,     rigid, or stressed. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Tighten:</b>     This option is not the correct antonym. \"Tighten\" is     related to making something more secure, firm, or tense. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Hold:</b>     This option is not the correct antonym. \"Hold\" can be     similar to \"clench\" in some contexts, involving     grasping or keeping something in place. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Clasp:</b>     This option is not the correct antonym. \"Clasp\" is     somewhat related to \"clench,\" as both involve holding     or grasping something. </span>     </p>"}, {"qid": "", "question": "<p>     Select the most appropriate ANTONYM of the given word.<br> Ascent</p>", "options": ["<p>     present</p>", "<p>     resent</p>", "<p>     descent</p>", "<p>     patent</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Ascent</b>:     a movement upward. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Descent:</b>     This is the correct antonym. \"Ascent\" refers to moving     upward or climbing, while \"descent\" refers to moving     downward or descending. These two words represent opposite     directions of movement. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Present:</b>     This option is not the correct antonym. \"Present\"     refers to something that is currently existing or available. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Resent:</b>     This option is not the correct antonym. \"Resent\" means     to feel bitterness or indignation as a result of a perceived     injustice or offense. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Patent:</b>     This option is not the correct antonym. \"Patent\" refers     to a legal protection for an invention.</span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Many     students do not _____________ attention in zoology class.</span></p>", "options": ["<p>     pay</p>", "<p>     drive</p>", "<p>     exhibit</p>", "<p>     trace</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>a)     pay:</b></span><span>     This is the correct option. \"Pay attention\" is a common     expression that means to focus one's mind on something or to be     attentive. In the context of the sentence, it's saying that many     students are not attentive in their zoology class.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>b)     drive:</b></span><span>     \"Drive\" means to operate a vehicle or to propel     something forward. It does not fit in the context of students in     a zoology class not paying attention.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>c)     exhibit:</b></span><span>     \"Exhibit\" means to display, show, or present something.     It doesn't make sense in the context of students not paying     attention in class.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>d)     trace:</b></span><span>     \"Trace\" means to follow a path, outline, or trail. It     doesn't fit in the context of students' attention in a zoology     class.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">A.     The introduction of India's new space policy is a significant     milestone in fostering a commercial space ecosystem.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">B.     In ensuring that the policy leads to a thriving and sustainable     commercial space industry in India.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">C.     But there are still important questions to be addressed to fully     realize the potential benefits of private sector participation.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">D.     Clear directives on how the government and other entities will     actively engage with private start-ups and the regulatory role of     INSPACe will be critical. </span>     </p>", "options": ["<p>     ACDB</p>", "<p>     BADC</p>", "<p>     ABCD</p>", "<p>     ACBD</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: ACDB: <i><b>The     introduction of India's new space policy is a significant     milestone in fostering a commercial space ecosystem, but there     are still important questions to be addressed to fully realize     the potential benefits of private sector participation. Clear     directives on how the government and other entities will actively     engage with private start-ups and the regulatory role of INSPACe     will be critical in ensuring that the policy leads to a thriving     and sustainable commercial space industry in India.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in direct speech. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">I     warned Geeta that I could no longer tolerate her coming late. </span>     </p>", "options": ["<p>     I said to     Geeta, “You can no longer tolerate my coming late.”</p>", "<p>     I said to     Geeta, “I can no longer tolerate your coming late.”</p>", "<p>     I said to     Geeta, “he can no longer tolerate her coming late”.</p>", "<p>     I said to     Geeta, “I can no longer tolerate she coming late.”</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct direct speech of the given sentence is:   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">According     to the rules of Narration: <i><b>I     said to Geeta, “I can no longer tolerate your coming late.”</b></i></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>If     the reporting verb is in past tense and reported speech contains     modal verb then following transformation occurs: </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Can     ---- could </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Will     --- would </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>May     --- Might. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">And     rest of the part changes according to the basic rules of     Narration.</span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the correct word from the given options to fill in the blank.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     architect's design featured an innovative use of ____________     materials, showcasing his ability to merge aesthetics with     functionality. </span>     </p>", "options": ["<p>     banal</p>", "<p>     ephermeral</p>", "<p>     mundane</p>", "<p>     avant-grade</p>"], "correct": 4, "marks": "1", "explanation": "Oूपiयn D iौ पुध cयननधcप ोnौथधन. क) ोॅोnप-gोनकध: Tुiौ iौ पुध cयननधcप यूपiयn. \"Aॅोnप-gोनकध\" नधीधनौ पय nधथ ोnक धसूधनiंधnपोि iकधोौ, धौूधciोििद in पुध ोनपौ यन कधौign. Iप ीiपौ ूधनीधcिपद in पुध cयnपधसप यी ोn ोनcुiपधcपैौ कधौign ीधोपहनing innयॅोपiॅध ोnक हniतहध हौध यी ंोपधनiोिस. ो) ृोnोि: Tुiौ यूपiयn iौ nयप पुध cयननधcप cुयicध. \"Bोnोि\" ंधोnौ यनकinोनद, cयंंयn, यन िोcाing in यनiginोिiपद. Iप कयधौ nयप ंोपcु पुध cयnपधसप यी पुध ोनcुiपधcपैौ कधौign ृधing innयॅोपiॅध ोnक ौुयथcोौing ंधनging ोधौपुधपicौ थiपु ीहncपiयnोिiपद. ृ) धूुधंधनोि: \"Eूुधंधनोि\" ंधोnौ िोौपing ीयन ो ॅधनद ौुयनप पiंध यन ृधing पनोnौiपयनद. c) ंहnकोnध: \"Mहnकोnध\" ंधोnौ यनकinोनद, cयंंयnूिोcध, यन िोcाing धसciपधंधnप. Iप कयधौnैप ीiप पुध cयnपधसप यी पुध ोनcुiपधcपैौ कधौign ृधing innयॅोपiॅध ोnक ौुयथcोौing ो हniतहध हौध यी ंोपधनiोिस."}, {"qid": "", "question": "\r\n<p>The following sentence has been split into segments. One of them may contain an error. Identify the segment that contains a grammatical error. If you don&rsquo;t find any error, mark &lsquo;No error&rsquo; as your answer.<br />\r\nA shop nearby / sell all the goods / of daily use.</p>", "options": ["\r\n<p>a shop nearby</p>", "\r\n<p>no error</p>", "\r\n<p>of daily use</p>", "\r\n<p>sell all the goods</p>"], "correct": 4, "marks": "1", "explanation": "Oूपiयn D iौ पुध cयननधcप ोnौथधन. Sहृुधcप-Vधनृ Agनधधंधnप: In ो ौधnपधncध, पुध ौहृुधcप ोnक पुध ॅधनृ ंहौप ोgनधध in nहंृधन (ौingिहोन यन ूिहनोि). Iी पुध ौहृुधcप iौ ौingिहोन, पुध ॅधनृ ौुयिहक ृध in पुध ौingिहोन ीयनं. Iी पुध ौहृुधcप iौ ूिहनोि, पुध ॅधनृ ौुयिहक ृध in पुध ूिहनोि ीयनं. In पुध यनiginोि ौधnपधncध, &तहयपेौुयू&तहयपे iौ ो ौingिहोन nयहn (ौहृुधcप), ौय पुध ॅधनृ ौुयिहक ोिसय ृध in पुध ौingिहोन ीयनं. Tुधनधीयनध, पुध cयननधcप ॅधनृ ीयनं iौ &तहयपेौिधिस&तहयपे (ौingिहोन), nयप &तहयपेौिधि&तहयपे (ूिहनोि). Cयननधcपधक ौधnपधncध: &तहयपेA ौुयू nधोनृद ौिधिस ोिि पुध gययकौ यी कोiिद हौध.&तहयपे"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate synonym of the given word.<br> Succulent</span></p>", "options": ["<p>     Coarse</p>", "<p>     Foul</p>", "<p>     Juicy</p>", "<p>     Decent</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option C: ‘juicy’. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Succulent</b>:     <span>Succulent\"     means full of juice or moisture, often used to describe plants     that store water in their thick leaves or stems, as well as     flavourful and juicy food. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Juicy</b></span><span>:     This is the correct synonym for \"Succulent.\" \"Juicy\"     describes something that is full of liquid or moisture, often     implying a pleasing and rich taste. When used to describe food or     plants, \"juicy\" aligns well with the concept of     something being \"succulent.\"</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Coarse</b></span><span>:     It refers to something rough or having a rough texture, often     implying a lack of refinement or delicacy. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Foul</b></span><span>:     \"Foul\" generally means something unpleasant, offensive,     or disagreeable in taste, smell, or appearance. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Decent</b></span><span>:     It means satisfactory, appropriate, or respectable. </span></span>     </p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">A.     The main goal of colonialism is extraction of economic benefits     from the colony. </span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">B.     It is more subtle whereas Imperialism is more formal and     aggressive.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">C.     Colonialism implies domination of people’s life and culture.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">D.     Colonialism results in control over life of natives in political,     economic, cultural and social spheres.</span></p>", "options": ["<p>     CBAD</p>", "<p>     DABC</p>", "<p>     CADB</p>", "<p>     CDAB</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     C is the correct answer.   </span>     </p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentence      C introduces the concept of colonialism by explaining its      implication on the life and culture of people.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentence      A follows by describing the main goal of colonialism, which is      the extraction of economic benefits from the colony.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentence      D elaborates on the results of colonialism, mentioning the      control it exerts over various aspects of natives' lives.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentence      B provides a comparison with imperialism, describing its      subtlety and aggressive nature.</span></span></p>     </li></ul>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: CADB: <i><b>Colonialism     implies domination of people’s life and culture. The main goal     of colonialism is extraction of economic benefits from the     colony. Colonialism results in control over life of natives in     political, economic, cultural and social spheres. It is more     subtle whereas Imperialism is more formal and aggressive.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     economist's ____________ forecast for the economy's performance     turned out to be remarkably accurate, earning her widespread     recognition.</span></p>", "options": ["<p>     precient</p>", "<p>     myopic</p>", "<p>     ephermeral</p>", "<p>     equivocal</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Prescient</b></span><span>:     This is the correct answer. \"Prescient\" refers to     having knowledge of events before they take place, indicating a     keen ability to predict or foresee future outcomes. In the     context of the sentence, if the economist's forecast turned out     to be remarkably accurate, it means that she had a clear     understanding of the economy's performance before it happened,     showcasing her prescience.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Myopic</b></span><span>:     \"Myopic\" describes a lack of foresight or a narrow     perspective, often focusing on short-term gains or immediate     concerns without considering long-term consequences. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Ephemeral</b></span><span>:     \"Ephemeral\" refers to something that is short-lived or     transient, lasting for only a brief period. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Equivocal</b></span><span>:     \"Equivocal\" refers to something that is ambiguous or     unclear, often having multiple interpretations. </span></span>     </p>"}, {"qid": "", "question": "<p>Select the INCORRECTLY spelt word.</p>", "options": ["<p>Conscious</p>", "<p>Disturbence</p>", "<p>Genius</p>", "<p>Opportunity</p>"], "correct": 2, "marks": "1", "explanation": "<p>Option B is the correct answer.</p>\r\n\r\n<p>Disturbence is incorrectly spelt in option B.</p>\r\n\r\n<p><strong>Conscious</strong>: being aware of one&#39;s thoughts, feelings, sensations, and surroundings.</p>\r\n\r\n<p><strong>Disturbance</strong>: It refers to a disruption or interruption of normal conditions, peace, or order.</p>\r\n\r\n<p><strong>Genius</strong>: It refers to exceptional intellectual or creative ability, talent, or originality.</p>\r\n\r\n<p><strong>Opportunity</strong>: It refers to a favourable or suitable time or circumstance that provides a chance for advancement, success, or accomplishment.</p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in indirect     speech.<br> “What is Sonia saying?” said Rohit.</span></p>", "options": ["<p>     Rohit asked     what was Sonia saying.</p>", "<p>     Rohit asked     what Sonia was saying.</p>", "<p>     Rohit asked     that what was Sonia saying.</p>", "<p>     Rohit asked     what is Sonia saying.</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b><span style=\"background:#ffffff\">Direct     –</span></b><span style=\"background:#ffffff\"> Subject     + say, </span><b><span style=\"background:#ffffff\">“WH     + helping verb + main verb + ?\"</span></b></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b><span style=\"background:#ffffff\">Indirect     – Subject + ask/asks/asked + </span></b><u><b><span style=\"background:#ffffff\">Wh     + Subject + verb + object</span></b></u><b><span style=\"background:#ffffff\">.</span></b></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct Indirect speech of the given sentence is: Rohit asked     what Sonia was saying.</span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Despite     facing numerous obstacles, she exhibited remarkable __________     and determination in achieving her goals.</span></p>", "options": ["<p>     tenacity</p>", "<p>     frivolity</p>", "<p>     ambiguity</p>", "<p>     complacency</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Tenacity:</b></span><span>     This is the correct answer. \"Tenacity\" refers to the     quality of being persistent, determined, and unwilling to give up     in the face of difficulties. In the context of the sentence,     \"tenacity\" accurately describes the quality displayed     by the person in overcoming obstacles and working towards her     goals.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Frivolity:</b></span><span>     \"Frivolity\" means lack of seriousness, often involving     behaviour that is carefree and not focused on important matters.     It is the opposite of the determination and seriousness implied     in the sentence.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Ambiguity:</b></span><span>     \"Ambiguity\" refers to something that is unclear or open     to multiple interpretations. It does not capture the sense of     determined effort that the sentence conveys.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Complacency:</b></span><span>     \"Complacency\" refers to a state of self-satisfaction     and contentment, often leading to a lack of motivation to improve     or progress. It contradicts the idea of facing obstacles with     determination.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> Something     that is strong and lasts a long time without     breaking or becoming weaker.</span></p>", "options": ["<p>     Durable</p>", "<p>     Harsh</p>", "<p>     Pliable</p>", "<p>     Secure</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is “Durable”.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Durable:</b></span><span>     This term means able to withstand wear, pressure, or damage over     time. It implies the quality of being strong and long-lasting     without easily breaking or becoming weaker. An object that is     durable is capable of enduring harsh conditions and maintaining     its integrity.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Harsh:</b></span><span>     This term describes something that is severe, rough, or cruel. It     doesn't directly convey the idea of being strong and long-lasting     without breaking or weakening.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Pliable:</b></span><span>     This term means flexible or easily bendable, which is the     opposite of the intended meaning of something strong and not     easily weakened.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Secure:</b></span><span>     This term relates to being safe or free from danger, but it     doesn't specifically convey the notion of being strong and     long-lasting without breaking.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted idiom.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     artist's efforts to improve the painting were like <u><b>rearranging     deck chairs on the Titanic</b></u>.</span></p>", "options": ["<p>     To make a     situation worse unintentionally</p>", "<p>     To do futile     work</p>", "<p>     To create     something extraordinary</p>", "<p>     To complete a     task quickly</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.    </span>     </p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\">This      sentence contains a simile using the idiom \"rearranging      deck chairs on the Titanic.\" </span>      </p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\">This      idiom is commonly used to illustrate a situation where someone      is expending effort and energy on tasks that ultimately have      little or no effect on the overall outcome. </span>      </p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\">‘It      suggests that the tasks being performed are busy and active but      ultimately futile, just as rearranging deck chairs on the      sinking Titanic would have made no significant difference to the      ship's fate.</span></p>     </li></ul>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct answer is Option 2: To do futile work. </span>     </p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     old library had a distinctive __________ that evoked a sense of     nostalgia among its visitors.</span></p>", "options": ["<p>     aroma</p>", "<p>     ambiance</p>", "<p>     anomaly</p>", "<p>     adherence</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Ambiance:</b></span><span>     This is the correct answer. \"Ambiance\" refers to the     atmosphere or mood of a place. In this sentence, the word     \"distinctive\" suggests that the old library had a     unique and recognizable atmosphere that triggered feelings of     nostalgia among visitors. This is the best choice as it aligns     well with the sense of the place evoking emotions.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Aroma:</b></span><span>     It usually refers to a pleasant smell or fragrance, often     associated with food or specific scents. While it's possible for     a place like a library to have a distinct smell, \"aroma\"     doesn't necessarily evoke the idea of nostalgia as directly as     another option might.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Anomaly:</b></span><span>     It refers to something that deviates from the norm or is     irregular. It doesn't convey the idea of the library's distinct     quality that brings about nostalgia.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Adherence:</b></span><span>     It refers to sticking to rules, guidelines, or beliefs. It     doesn't connect to the idea of evoking nostalgia in the context     of a library's distinctive feature.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted idiom.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     new project's success was a <i><b>double-edged     sword</b></i>     for the team.</span></p>", "options": ["<p>     An unexpected     and positive turn of events</p>", "<p>     A challenge     that was easily overcome</p>", "<p>     A complete     failure that had serious consequences</p>", "<p>     A situation     with both advantages and disadvantages</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option D.    </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>The     new project's success was a double-edged sword for the team.</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>This     sente
