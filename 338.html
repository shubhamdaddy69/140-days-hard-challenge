-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">  II. Water typically moves across the cell membrane through a process called osmosis, which involves the movement of water molecules from an area of lower solute concentration to an area of higher solute concentration. This process helps in maintaining a balance of water and solutes inside and outside the cell. However, water moving from lower to higher concentration (against the concentration gradient) is not a common occurrence and generally requires energy input, which is not the typical behavior in osmosis. Therefore, the statement in option II is not correct.</span></span></p>"}, {"qid": "", "question": "<p>The Kanchenjunga peak is located in which sub-division of Himalaya from the following?</p>", "options": ["<p>Arunachal Himalayas</p>", "<p>Himachal and Uttaranchal Himalayas</p>", "<p>Darjeeling and Sikkim Himalayas</p>", "<p>Kashmir Himalayas</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Kanchenjunga</strong> is the third-highest mountain in the world and is located in the <strong>Darjeeling and Sikkim Himalayas</strong>. It is situated on the border between Nepal and the Indian state of Sikkim. The mountain&#39;s name &quot;Kanchenjunga&quot; translates to &quot;Five Treasures of Snow,&quot; referring to its five distinct peaks.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Darjeeling and Sikkim Himalayas</strong>: This region of the Himalayas includes the eastern part of India and the northern part of Nepal. The Darjeeling and Sikkim Himalayas are known for their stunning landscapes, rich biodiversity, and cultural diversity. The region is characterized by steep terrain, lush forests, and high peaks, including Kanchenjunga. The region is characterized by steep terrain, lush forests, and high peaks, including Kanchenjunga.</span></span></p>"}, {"qid": "", "question": "<p>The Telugu movie RRR created history by winning a Golden Globe for the Natu Natu song composed by whom among the following personalities?</p>", "options": ["<p>AR Rahman</p>", "<p>Shankar&ndash;Ehsaan&ndash;Loy</p>", "<p>MM Keeravani</p>", "<p>Mervin Solomon</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;MM Keeravani&rdquo;.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Composer <strong>MM Keeravani,</strong> along with singers <strong>Kaala Bhairava and Rahul Sipligunj,</strong> has won the <strong>Golden Globe</strong> for Best Original Song, for the track <strong>&ldquo;Naatu Naatu,&rdquo; from epic drama &ldquo;RRR&ldquo;.</strong> &ldquo;Naatu Naatu,&rdquo; a dance number featuring stars Jr NTR and Ram Charan, was competing against Taylor Swift&rsquo;s &ldquo;Carolina&rdquo; from Where the Crawdads Sing, &ldquo;Ciao Papa&rdquo; from Guillermo del Toro&rsquo;s Pinocchio, Lady Gaga&rsquo;s &ldquo;Hold My Hand&rdquo; from Top Gun: Maverick, and &ldquo;Lift Me Up&rdquo; from Black Panther: Wakanda Forever, performed by Rihanna. </span></span></p>"}, {"qid": "", "question": "<p>Who among the following was the first person to discuss poverty line in pre-independent India?</p>", "options": ["<p>Dr. BR Ambedkar</p>", "<p>Dadabhai Naoroji</p>", "<p>Mahalanobis</p>", "<p>RK Shanmukham Chetty</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dadabhai Naoroji was the first person to discuss the concept of the &quot;poverty line&quot; in pre-independent India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He is often referred to as the &quot;Grand Old Man of India&quot; and was a prominent Indian nationalist, scholar, and early leader in the Indian independence movement. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He discussed the economic exploitation of India by the British and highlighted the impoverishment of the Indian population due to colonial policies. </span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(A) <strong>Dr. B.R. Ambedkar</strong>: Dr. B.R. Ambedkar, also known as Babasaheb Ambedkar, was a prominent Indian jurist, social reformer, and the chief architect of the Indian Constitution. He played a significant role in advocating for the rights of Dalits (formerly known as untouchables) and other marginalized communities. He was a key figure in drafting the Constitution of India and worked towards social and economic justice for all.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(B) <strong>Mahalanobis</strong>: Prasanta Chandra Mahalanobis was an Indian scientist and statistician. He is known for his contributions to the field of statistics and for founding the Indian Statistical Institute (ISI) in 1931. Mahalanobis is also associated with the development of the &quot;Mahalanobis Distance,&quot; a statistical measure used in multivariate analysis.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">(D) <strong>R.K. Shanmukham Chetty</strong>: Sir Ramasamy K. Shanmukham Chetty was an Indian lawyer, economist, and politician. He was the first Finance Minister of independent India and presented the first budget of independent India in 1947. He also played a role in economic and financial policies during the early years of India&#39;s independence.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following has the highest boiling point?</p>", "options": ["<p>Alkanes</p>", "<p>Alkenes</p>", "<p>Free carbon dioxide</p>", "<p>Alkynes</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option D is the correct answer.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Among the given options, <strong>alkynes</strong> generally have the highest boiling point. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Alkynes are hydrocarbons with at least one carbon-carbon triple bond. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The presence of triple bonds results in stronger intermolecular forces between molecules, leading to higher boiling points compared to alkanes (saturated hydrocarbons with single bonds) and alkenes (hydrocarbons with at least one carbon-carbon double bond).</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Who has launched &ldquo;One Student One Tree Campaign 2023&rdquo;?</p>", "options": ["<p>IIT Madras</p>", "<p>Niti Aayog</p>", "<p>AICTE</p>", "<p>IISc Bangalore</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option C) AICTE.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">AICTE to launch &#39;One Student One Tree Campaign 2023&#39; in June 2023.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Union MoS Rajkumar Ranjan Singh has announced that the <strong>All India Council for Technical Education (AICTE) </strong>will launch &ldquo;<strong>One Student One Tree Campaign 2023</strong>&rdquo; and that UGC too has taken initiatives for creating awareness about <strong>Mission LiFE. </strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He also released guidelines and a curriculum framework for environmental education at the undergraduate level. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The guidelines include areas such as climate change, pollution, waste management, and sustainable development. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The mantra of Mission Life is <strong><em>&lsquo;Lifestyle For Environment&rsquo;</em></strong> to make the fight against climate change democratic, in which everyone can contribute within their capacity. </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>What are the main energy sources for earth&rsquo;s internal heat engine?</p>", "options": ["<p>Heat from volcanoes and solar heat</p>", "<p>Radiogenic heat and oceanic tide heat</p>", "<p>Radiogenic heat and primordial heat</p>", "<p>Solar heat and oceanic tide heat</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The main energy sources for Earth&#39;s internal heat engine are <strong>radiogenic heat</strong> and <strong>primordial heat</strong>.</span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Radiogenic Heat</strong>: This heat is generated by the natural decay of radioactive isotopes present in the Earth&#39;s mantle and crust. Radioactive decay releases energy in the form of heat, contributing significantly to the overall heat budget of the planet.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Primordial Heat</strong>: This heat originates from the time of Earth&#39;s formation and accretion, as well as the heat produced during the differentiation of materials in the early stages of its development.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following statements are correct regarding the Centre-State Relations pertaining to the three lists of the Indian Constitution?<br />\r\nA. The subjects which are not included in any of the three lists are called Residuary subjects.<br />\r\nB. If there is any conflict between the Union List and the State List, then the former prevails.<br />\r\nC. When the Parliament enacts a law on the request of two or more states, then that law made by the Parliament on the State List is applicable to all the states.</p>", "options": ["<p>A, B and C</p>", "<p>B and C only</p>", "<p>A and B only</p>", "<p>A and C only</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Only Statement A and B are correct. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A. <strong>The subjects which are not included in any of the three lists are called Residuary subjects.</strong> - This statement is correct. Residuary subjects are matters that do not fall under any of the three lists (Union List, State List, and Concurrent List) and are therefore the domain of the Parliament of India.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">B. <strong>If there is any conflict between the Union List and the State List, then the former prevails.</strong> - This statement is generally correct, but with an important clarification. In case of a conflict between the Union List and the State List on a matter in the Concurrent List, the law made by the Parliament prevails. However, if the subject falls exclusively within the Union List or the State List, the respective legislation will prevail.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">C. According to Article 252, if the legislatures of two or more states pass a resolution to the effect that it is desirable to have a parliamentary law on any item listed in the State List, the Parliament can make laws for <strong>those states</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">So statement C is incorrect because it is not applicable to all the states it is applicable to those states. </span></span></p>"}, {"qid": "", "question": "<p>Article 243K of the Indian constitution is related with which of the following?</p>", "options": ["<p>Election to the Panchayats.</p>", "<p>Reservation of seats in Panchayat.</p>", "<p>Durations of panchayat, etc.</p>", "<p>Grounds of disqualification from membership of Panchayat.</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option A is the correct answer.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 243 of the Indian Constitution pertains to the <strong>elections to the Panchayats</strong>. It provides the framework and guidelines for conducting elections for the local self-government institutions known as Panchayats in India. </span></span></p>\r\n\r\n<table border=\"1\" style=\"width:436px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1 Virupaksha temple is located on the south bank of the river Tungabadra in Hampi.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The temple was built by Lakkan Dandesha, a nayaka (chieftain) under the ruler Deva Raya II also known as Prauda Deva Raya of the Vijayanagara Empire.</span></span></li>\r\n</ul>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p>Select the option that is true regarding the following two statements labelled Assertion (A) and Reason (R).<br />\r\nA: An object slips less on a rough surface than a smooth surface.<br />\r\nR: When a surface is rough, frictional force increases.</p>", "options": ["<p>Assertion A is false and Reason R is true.</p>", "<p>Both Assertion A and Reason R are the true and Reason R is a correct explanation of Assertion A.</p>", "<p>Assertion A is true and Reason R is false.</p>", "<p>Neither Assertion A nor Reason R is true but Reason R is not a correct explanation of Assertion A.</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Assertion (A): An object slips less on a rough surface than a smooth surface.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Reason (R): When a surface is rough, frictional force increases.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Upon reevaluation, it&#39;s clear that both Assertion (A) and Reason (R) are true, and Reason (R) is a correct explanation of Assertion (A). </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Rough surfaces provide more contact points and irregularities that increase frictional force, ma 8</p>", "<p>Article 19</p>", "<p>Article 15</p>", "<p>Article 16</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The scenario described involves discrimination against the maid based on her social status, and since a cinema hall is a place of public entertainment, Article 15 could provide relief to the maid by asserting her right to be treated without discrimination.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 15 of the Indian Constitution prohibits discrimination on the grounds of religion, race, caste, sex, place of birth, or any of them. It states that the State shall not discriminate against any citizen on these grounds in matters of access to shops, public restaurants, hotels, and places of public entertainment or in the use of wells, tanks, bathing ghats, roads, and places of public resort maintained wholly or partly out of State funds or dedicated to the use of the general public.</strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 18: Deals with abolition of titles, not directly relevant to discrimination scenario.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 19: Guarantees freedoms like speech, assembly, etc., not directly applicable to discrimination in a cinema hall.</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Article 16: Pertains to equality in public employment, not applicable to the described scenario.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following pairs of &#39;nutrient - source&#39; is accurate?<br />\r\nCalcium - Oranges<br />\r\nVitamin D - Broccoli</p>", "options": ["<p>Both 1 and 2</p>", "<p>Only 1</p>", "<p>Only 2</p>", "<p>Neither 1 nor 2</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option D is the correct answer.    </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Oranges</strong> are a source of <strong>Vitamin C</strong>.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Broccoli</strong> is a source of <strong>Vitamin C</strong> along with other nutrients like <strong>Vitamin K</strong>, <strong>Vitamin A</strong>, <strong>Folate</strong>, and dietary <strong>Fiber</strong>. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Calcium is commonly found in dairy products and certain vegetables, while vitamin D is often obtained from sources like sunlight exposure and fortified foods. Oranges are not a significant source of calcium, and broccoli does not contain much vitamin D.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Union Home Minister Amit Shah has inaugurated the construction of the &lsquo;Balidan Stambh&rsquo; in which city?</p>", "options": ["<p>Srinagar, Jammu and Kashmir</p>", "<p>Dharwad, Karnataka</p>", "<p>Jaipur, Rajasthan</p>", "<p>Kochi, Kerala</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option A &ldquo;Srinagar, Jammu and Kashmir&rdquo;.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Union Home Minister <strong>Amit Shah</strong> has inaugurated the construction of the <strong>&lsquo;Balidan Stambh&rsquo; in Srinagar, Jammu and Kashmir,</strong> June 24. Jammu and Kashmir Lieu an><p><span>Statement: </span><span>  </span><span>M &gt; N = O ≥ P, Q ≥ R ≤ S = P </span></p><p><span>Conclusions:</span></p><p><span>I. O ≥ P </span></p><p><span>II. M &gt; S</span></p><p><span>III. </span><span style=\"color:#222222;background-color:#ffffff\">N ≥ R</span></p><p><span style=\"color:#222222;background-color:#ffffff\">IV. O &lt; Q</span></p>", "options": ["<span> Only conclusion I and II are true</span>", "<span> Only conclusion III and IV are true</span>", "<span> Only conclusions I, II and III are true</span>", "<span> All conclusion I, II, III and IV are true</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>Conclusions:</span></p><p><span>I. O ≥ P (True), it is very clear in the given statement.</span></p><p><span>II. M &gt; S (True), it is given that “M &gt; N = O ≥ P = S”</span></p><p><span>III. </span><span style=\"color:#222222;background-color:#ffffff\">N ≥ R (True), it is given that “</span><span>N = O ≥ P = S ≥ R”</span></p><p><span>IV. O &lt; Q (False), in the given statement we cannot any relation between O and Q.</span></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
