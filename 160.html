nd Gita Govinda.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This style later influenced other Pahari schools such as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kangra</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Guler</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">National Critical Mineral Mission (NCMM) was launched in:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">January 2025</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">March 2025</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">July 2025</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">October 2025</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">National Critical Mineral Mission (NCMM)</span><span style=\"font-family:'Cambria Math'\"> was launched in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">January 2025</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The Union Cabinet approved the mission in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">January 2025</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> with an expenditure of ₹16,300 crore.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It was announced in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Union Budget 2024–25</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and formally launched in early 2025.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The mission aims to ensure </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">self-reliance in critical minerals</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> essential for clean energy, electronics, defense, and other strategic sectors.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Geological Survey of India (GSI)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> has been tasked with conducting </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1,200 exploration projects</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> between 2024–25 and 2030–31.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which one of the following texts provides a detailed and connected account of Buddha’s life?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Baudhayana Dharmasutra</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mahavagga</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lalitavistara</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therigatha</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The text that provides a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">detailed and connected account of Buddha’s life</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lalitavistara Sūtra</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:116%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lalitavistara Sūtra</span><span style=\"font-family:'Cambria Math'\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mahayana Buddhist text in Sanskrit</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It narrates the life of Gautama Buddha from his </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">descent from Tushita heaven</span><span style=\"font-family:'Cambria Math'\"> until his </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first sermon at Deer Park, Sarnath</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;margin-bottom:8pt;line-height:108%;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is considered one of the most sacred Mahayana texts and is often described as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“extensive play”</span><span style=\"font-family:'Cambria Math'\"> of the Buddha’s incarnation, portraying his life as a divine performance for the benefit of beings.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Evaluating the options</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Baudhayana Dharmasutra</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Concerned with Hindu law and rituals, not Buddha’s life.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mahavagga</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Part of the Vinaya Pitaka, deals with monastic rules and some episodes of Buddha’s early ministry, but not a connected biography.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lalitavistara</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct — provides a continuous narrative of Buddha’s life.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Therigatha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Collection of verses by early Buddhist nuns, not a biography of Buddha.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If a sample of human blood is mixed with distilled water (hypotonic), the Red Blood Cells will swell and burst. However, if they are placed in a strong salt solution (hypertonic), they will shrivel. This shrivelling process is known as:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Haemolysis </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Crenation </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Plasmolysis </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Phagocytosis</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The shrivelling of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Red Blood Cells (RBCs)</span><span style=\"font-family:'Cambria Math'\"> when placed in a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">hypertonic solution</span><span style=\"font-family:'Cambria Math'\"> (like strong salt water) is known as </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Crenation</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">When RBCs are placed in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">distilled water (hypotonic solution)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, water enters the cells by osmosis, causing them to swell and eventually burst. This bursting is called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Haemolysis</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">When RBCs are placed in a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">strong salt solution (hypertonic solution)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, water moves out of the cells, causing them to shrink and develop a scalloped or notched appearance. This process is called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Crenation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Plasmolysis</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> refers to the shrinking of the cytoplasm away from the cell wall in plant cells, not RBCs.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Phagocytosis</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is the process by which certain cells engulf particles or microorganisms, unrelated to RBC shrinking.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the Indian constitutional scheme, which of the following pairs is correctly matched with respect to the body and the type of jurisdiction primarily associated with it?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Supreme Court of India – Advisory jurisdiction under Article 370</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">High Courts – Original jurisdiction over disputes between States</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Finance Commission – Quasi-judicial jurisdiction over tax disputes</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Central Administrative Tribunal – Jurisdiction over service matters of public servants</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correctly matched pair in the Indian constitutional scheme is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Central Administrative Tribunal – Jurisdiction over service matters of public servants</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Supreme Court of India – Advisory jurisdiction under Article 370</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Wrong. The Supreme Court’s advisory jurisdiction is under </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 143</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not Article 370 (which dealt with special status of Jammu &amp; Kashmir).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">High Courts – Original jurisdiction over disputes between States</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Wrong. Disputes between states fall under the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">original jurisdiction of the Supreme Court</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Article 131), not High Courts.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Finance Commission – Quasi-judicial jurisdiction over tax disputes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">❌</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Wrong. The Finance Commission is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">recommendatory body</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for distribution of financial resources between Union and States; it does not settle tax disputes.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Central Administrative Tribunal (CAT) – Jurisdiction over service matters of public servants</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">✅</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> Correct. CAT was established under the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Administrative Tribunals Act, 1985</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to adjudicate disputes and complaints relating to service matters of public servants (except armed forces).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karyala folk art is associated with which Indian State?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Himachal Pradesh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerela</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Karnataka</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhattisgarh</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Karyala (also spelled Kariyala)</span><span style=\"font-family:'Cambria Math'\"> folk art is associated with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Himachal Pradesh</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Karyala is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">folk theatre form</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> popular in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Solan, Shimla, and Sirmour districts</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of Himachal Pradesh.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is performed as a series of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">short skits, farces, and burlesques</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, often with strong elements of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">social satire</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Traditionally staged after agricultural prosperity or fulfillment of personal wishes, it begins with an invocation of local deities.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Musical instruments like </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">harmonium, shehnai, and danka</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> accompany the performances.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is considered one of the most vibrant and entertaining folk drama traditions of the state.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The only Indian State which shares border with Sikkim is?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arunachal Pradesh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Meghalaya</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">West Bengal</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The only Indian state that shares a border with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sikkim</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">West Bengal</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sikkim</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a Himalayan state bordered by:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Nepal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> on the west</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Bhutan</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> on the east</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">China (Tibet Autonomous Region)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> on the north</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">West Bengal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> on the south</span></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">None of the other options (Arunachal Pradesh, Assam, Meghalaya) touch Sikkim geographically.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Who has been named BBC Indian Sportswoman of the Year for 2025?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Harmanpreet Kaur</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Divya Deshmukh</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Smriti Mandhana</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Avani Lekhara</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">BBC Indian Sportswoman of the Year 2025</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Smriti Mandhana</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Smriti Mandhana, vice-captain of the Indian Women’s Cricket Team, was honoured with the award in recognition of her </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">pivotal role in India’s historic 2025 Women’s ODI World Cup victory</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> at home.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">She also had a standout year in domestic cricket, helping her team secure the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Women’s Premier League title</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Other honourees at the ceremony included </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Divya Deshmukh</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Emerging Player of the Year), </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Preethi Pal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Para-Sportswoman of the Year), and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Anjali Bhagwat</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (Lifetime Achievement Award).</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Earth in its initial phases of formation was a hot object with a thin layer of atmosphere comprising of which gases?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hydrogen and Helium</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Carbon Dioxide and Nitrogen</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Oxygen and Nitrogen</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hydrogen and Methane</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">initial phases of Earth’s formation</span><span style=\"font-family:'Cambria Math'\">, the planet was extremely hot and surrounded by a thin </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">primary atmosphere</span><span style=\"font-family:'Cambria Math'\"> composed mainly of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Hydrogen (H₂) and Helium (He)</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">These were the lightest and most abundant gases in the early solar nebula.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Because Earth was very hot and had weak gravity compared to larger planets, most of this </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">hydrogen and helium</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> eventually escaped into space.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Later, volcanic outgassing and cometary impacts contributed to a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">secondary atmosphere</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> dominated by water vapor, carbon dioxide, methane, and ammonia.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Free oxygen (O₂) appeared much later, after photosynthetic organisms evolved.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Article of the Constitution of India empowers the Parliament to make laws for the whole or any part of the territory of India for implementing international treaties, agreements or conventions?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 246</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 249</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 253</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 257</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Article 253</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 253 of the Constitution of India</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> empowers the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Parliament</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> to make laws for the whole or any part of the territory of India for implementing </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">international treaties, agreements, conventions, or decisions made at international conferences</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This provision overrides the usual division of powers between the Union and the States, ensuring that India can fulfill its international obligations effectively.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Why other options are incorrect</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 246</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Deals with the distribution of legislative powers between Union and States.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 249</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Allows Parliament to legislate on State subjects in the national interest if the Rajya Sabha passes a resolution.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 257</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> → Concerns the control of the Union over States in certain cases, not treaties.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following numbers is both a Rational Number and a Terminating Decimal?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2/7</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3/8</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">π</span></p>"], "correct": 2, "marks": "1", "explanation": "(ो) 2/72/7 iौ ो नोपiयnोि nहंृधन, ृहप iपौ कधciंोि ीयनं iौ 0.2857142857… (नधूधोपing).Iप iौ ो nयn-पधनंinोपing नधcहननing कधciंोि, ौय nयप पधनंinोपing.(ृ) 3/83/8 = 0.375Tुiौ iौ ो पधनंinोपing कधciंोि ोnक ोिसय ो नोपiयnोि nहंृधन.Sय, पुiौ ौोपiौीiधौ ृयपु cयnकiपiयnौ.(c) √5√5 iौ ोn iननोपiयnोि nहंृधन.Iप cोnnयप ृध थनiपपधn ोौ ू/त ोnक iौ nयn-पधनंinोपing nयn-नधूधोपing.(क) π (ूi)π iौ ोिसय iननोपiयnोि ोnक nयn-पधनंinोपing nयn-नधूधोपing."}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If x + y + z = 19, x² + y² + z² = 133 and xz = y², then the difference between z and x is:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771585666828_image001.png\" width=\"365\" height=\"577\" alt ></p>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Simplify: </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771585666828_image002.png\" width=\"191\" height=\"51\" alt style=\"vertical-align:middle\" ></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√10</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2√10</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2√5</span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">7 ± 2√10 = (√5 ± √2)²</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">√(7 + 2√10) + √(7 − 2√10)</span><br><span style=\"font-family:'Cambria Math'\">= (√5 + √2) + (√5 − √2)</span><br><span style=\"font-family:'Cambria Math'\">= 2√5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771585666828_image003.png\" width=\"35\" height=\"54\" alt style=\"vertical-align:middle\" ><span style=\"font-family:'Cambria Math'\">= √10</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A can do a certain work in 80 days. B is 25% more efficient than A, while C is 20% more efficient than B. B alone completed 25% of the work. A and C together completed the remaining work. The entire work got completed in:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">24 days</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">16 days</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">32 days</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">40 days</span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771585666828_image004.png\" width=\"290\" height=\"538\" alt ></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The surface area of a sphere is 256π cm². If the radius of the sphere is tripled, by what percentage does the surface area increase?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">700%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">800%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">900%</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">600%</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Short method:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Surface area ∝ r²</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Radius × 3 ⇒ Area × 3² = 9</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increase = 9 − 1 = 8 times</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Percentage increase = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">8 × 100 = 800%</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Basic method:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">4πr² = 256π</span><br><span style=\"font-family:'Cambria Math'\">⇒ r² = 64</span><br><span style=\"font-family:'Cambria Math'\">⇒ r = 8</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">If radius is tripled: new radius = 3r</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New surface area = 4π(3r)²</span><br><span style=\"font-family:'Cambria Math'\">= 4π × 9r²</span><br><span style=\"font-family:'Cambria Math'\">= 9 × (4πr²)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So, new area = 9 times original area</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increase = 9 − 1 = 8 times</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Percentage increase = 8 × 100 = 800%</span></p>"}, {"qid": "", "question": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">P and Q run a 16 km race on a circular track of length 1500 m. They complete one round in 200 seconds and 250 seconds, respectively. After how much time from the start will the faster person meet the slower person for the last time?</span></p>", "options": ["\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">33 min 20 sec</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">34 min 12 sec</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">35 min 40 sec</span></p>", "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">32 min 18 sec</span></p>"], "correct": 1, "marks": "1", "explanation": "\r\n\r\n<p style=\"margin-bottom:11px\">Track length = 1500 m</p>\r\n\r\n<p style=\"margin-bottom:11px\">Speeds: P = 1500/200 = 7.5 m/s, Q = 1500/250 = 6 m/s.</p>\r\n\r\n<p style=\"margin-bottom:11px\">Relative speed = 1.5 m/s.</p>\r\n\r\n<p style=\"margin-bottom:11px\">Time to gain 1 lap = 1500 / 1.5 = 1000 s.</p>\r\n\r\n<p style=\"margin-bottom:11px\">P finishes race in 16,000 / 7.5 = 2133.33 s.</p>\r\n\r\n<p style=\"margin-bottom:11px\">So they meet at 1000 s and again at 2000 s.</p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><b>Last meeting = 2000 seconds (&asymp; 33 min 20 s).</b></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A and B start a business with equal investments. After 6 months, A adds Rs. 20,000 more. At the end of 1 year, if the total profit is Rs. 50,000, and B’s share is Rs. 20,000, what was their initial investment?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">30,000</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">20,000</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">25,000</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">35,000</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Profit ratio = 30,000 : 20,000 = 3 : 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Let initial investment = x each</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A’s money = 12x + 20,000 × 6 = 12x + 1,20,000</span><br><span style=\"font-family:'Cambria Math'\">B’s money = 12x</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So,</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(12x + 1,20,000) : 12x = 3 : 2</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">⇒ 12x + 1,20,000 = (3/2) × 12x</span><br><span style=\"font-family:'Cambria Math'\">⇒ 12x + 1,20,000 = 18x</span><br><span style=\"font-family:'Cambria Math'\">⇒ 1,20,000 = 6x</span><br><span style=\"font-family:'Cambria Math'\">⇒ x = 20,000</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a city council election, a total of 4800 votes were polled. Maya, Kabir, and Sara were the candidates contesting the election. 15% of the total votes were declared invalid. Maya received one-third of the votes received by Kabir. The average of Maya’s and Kabir’s votes was equal to Sara’s votes. How many votes did Maya receive?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">680</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">650</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">560</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">590</s ine-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“asked … that if”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> is grammatically incorrect.</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">Correct usage should be either:</span><ul type=\"square\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:27.58pt;margin-bottom:8pt;padding-left:8.42pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">“The judge asked the witness if he had seen anyone suspicious…”</span></li><li style=\"margin-left:27.58pt;margin-bottom:8pt;padding-left:8.42pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">or “The judge asked the witness whether he had seen anyone suspicious…”</span></li></ul></li></ul></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">The word </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“that”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> is unnecessary and makes the construction faulty.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Improve the highlighted part of the sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The sales of electric vehicles have increased </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">more than 50% since last year</span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "options": le=\"font-weight:bold;font-family:'Nirmala UI'\">Option 3: My father advised me not to let the failures of the past discourage me from pursuing my dreams with renewed vigour and determination.</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Direct speech:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> My father said to me, \"Don't let the failures of the past discourage you from pursuing your dreams with renewed vigour and determination.\"</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">This is an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">imperative sentence</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> with advice. In indirect speech, imperatives often change into verbs like advised, requested, ordered, forbade depending on tone.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 1:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> forbade me… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Wrong. Forbade means prohibition, but here the father is encouraging, not prohibiting.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 2:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> told me that I should not… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Grammatically possible, but weaker than advised, and it drops renewed vigour and determination.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> advised me not to let… with renewed vigour and determination </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Correct. Retains the full meaning and matches the advisory tone.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> suggested that I don’t let… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Wrong. Suggested is not the right reporting verb for advice in imperative form.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the voice of the following sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Please ensure that you return all the borrowed library books to the circulation desk before the commencement of the semester exams.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">All the borrowed library books should be ensured to be returned by you before the exams commence.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Let the borrowed library books be returned to the circulation desk by you before the semester exams.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">It is requested that you must return all the borrowed library books to the desk before the exams.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">You are requested to ensure that all the borrowed library books are returned to the circulation desk before the commencement of the semester exams.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct passive voice transformation is:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4: You are requested to ensure that all the borrowed library books are returned to the circulation desk before the commencement of the semester exams.</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Active voice:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Please ensure that you return all the borrowed library books to the circulation desk before the commencement of the semester exams.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">This is an imperative sentence with please ensure. In passive voice, imperatives often change into polite requests like You are requested to ensure….</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 1:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Awkward and incorrect structure (should be ensured to be returned).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 2:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Let the borrowed library books be returned… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Possible passive form, but it loses the polite request tone of please ensure.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 3:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> It is requested that you must return… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Grammatically possible, but not the best transformation; adds must unnecessarily.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 4:</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> You are requested to ensure that all the borrowed library books are returned… </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Correct. Retains the polite request tone and matches the passive voice transformation.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Arrange the following sentences to form a coherent paragraph:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P.</span><span style=\"font-family:'Nirmala UI'\"> This change is driven by the rise of remote work and digital nomadism. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Q.</span><span style=\"font-family:'Nirmala UI'\"> Consequently, many companies are downsizing their physical real estate.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-famil pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Sentence S</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: Traditionally, the concept of an office was a fixed physical location. </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Introduces the traditional idea. (परंपरागत विचार)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Sentence R</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: However, the modern workforce is increasingly embracing flexibility. </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Shows the contrast with tradition. (विपरीत स्थिति)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Sentence P</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: This change is driven by the rise of remote work and digital nomadism. </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Explains the reason for flexibility. (कारण)</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Sentence Q</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\">: Consequently, many companies are downsizing their physical real estate. </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> States the result of this change. (परिणाम)</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Final Coherent Paragraph: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Traditionally, the concept of an office was a fixed physical location. However, the modern workforce is increasingly embracing flexibility. This change is driven by the rise of remote work and digital nomadism. Consequently, many companies are downsizing their physical real estate.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Mark the antonym of ‘Exculpate’</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Absolve</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Explain</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Forgive</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Indict</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The antonym of </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“Exculpate”</span><span style=\"font-family:'Nirmala UI'\"> is: </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option 4: Indict</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Exculpate (निर्दोष साबित करना / दोषमुक्त करना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Means to clear someone from blame or guilt.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Indict (अभियोग लगाना / दोषारोपण करना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Means to formally accuse or charge someone with a crime, which is the direct opposite of exculpate.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 1: Absolve (दोषमुक्त करना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Wrong. This is actually a synonym of exculpate.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 2: Explain (समझाना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Wrong. Not related to guilt or blame.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 3: Forgive (क्षमा करना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Wrong. Related to pardon, not accusation.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Option 4: Indict (अभियोग लगाना)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"line-height:108%;font-family:Arial;font-size:12pt\">→</span><span style=\"line-height:108%;font-size:12pt;font-family:'Nirmala UI'\"> Correct. Exact opposite.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Mark the synonym of ‘Truculent’.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Peaceful</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-f
