<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Live Mock 1 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a certain code language, 'FRIDGE' is coded as 'GTLHLK'. How will 'KETTLE' be coded in that language? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LGWXSK</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LGWXQK </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LHVXSK </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">LGVXQK</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Logic:</span><span style=\"font-family:'Cambria Math'\"> The pattern follows an increasing addition of prime numbers or a simple +1, +2, +3... sequence. Let's check:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">F (+1) → G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R (+2) → T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I (+3) → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">D (+4) → H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">G (+5) → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">E (+6) → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Applying to KETTLE:</span><span style=\"font-family:'Cambria Math'\"> K+1=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">L</span><span style=\"font-family:'Cambria Math'\">, E+2=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">G</span><span style=\"font-family:'Cambria Math'\">, T+3=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">W</span><span style=\"font-family:'Cambria Math'\">, T+4=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">X</span><span style=\"font-family:'Cambria Math'\">, L+5=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Q</span><span style=\"font-family:'Cambria Math'\"> E+6=</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">K</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement:</span><span style=\"font-family:'Cambria Math'\"> You are the Chief Medical Officer of a district. A pharmaceutical company has approached you with a high-quality vaccine for a local outbreak. However, you discover that the company bypassed one minor administrative documentation step in the federal approval process, though the clinical trials are 100% successful and the outbreak is spreading rapidly.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Which of the following is the most appropriate Decision/Course of Action?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Reject the vaccine immediately as it lacks complete federal documentation, maintaining the rule of law.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Approve the vaccine for immediate public use given the emergency, and ignore the documentation as clinical results are positive.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Use the vaccine only for the elite and high-risk groups while waiting for the paperwork to be completed for the general public.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Grant provisional emergency approval while simultaneously coordinating with federal authorities for an expedited \"retrospective\" clearance of the documentation.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer: (D)</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation (Ethics-based Decision Making):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chief Medical Officer</span><span style=\"font-family:'Cambria Math'\">, your </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">primary duty</span><span style=\"font-family:'Cambria Math'\"> is to protect </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">public health and human life</span><span style=\"font-family:'Cambria Math'\">, especially during a rapidly spreading outbreak.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Completely rejecting the vaccine (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option A</span><span style=\"font-family:'Cambria Math'\">) shows </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">rigidity</span><span style=\"font-family:'Cambria Math'\"> and ignores the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">urgency of the situation</span><span style=\"font-family:'Cambria Math'\">, potentially leading to avoidable loss of life.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Approving it outright and ignoring documentation (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option B</span><span style=\"font-family:'Cambria Math'\">) undermines the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">rule of law, accountability, and institutional integrity</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Restricting it to elite or select groups (</span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Option C</span><span style=\"font-family:'Cambria Math'\">) violates </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">equity, fairness, and ethical governance</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement:</span><span style=\"font-family:'Cambria Math'\"> \"To keep the city clean, the municipal corporation has decided to increase the fine for littering from ₹500 to ₹5,000 with immediate effect.\"</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assumptions:</span><span style=\"font-family:'Cambria Math'\"> </span><br><span style=\"font-family:'Cambria Math'\">I. The previous fine of ₹500 was not a sufficient deterrent for the citizens.</span><br><span style=\"font-family:'Cambria Math'\">II. People will be more cautious about littering due to the fear of a higher financial penalty.</span><br><span style=\"font-family:'Cambria Math'\">III. The municipal corporation will use this extra revenue to hire more sweepers.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I and II are implicit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II and III are implicit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">All I, II, and III are implicit</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II is implicit</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assumption I</span><span style=\"font-family:'Cambria Math'\"> is implicit because increasing the fine logically suggests that the earlier fine of ₹500 was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not effective enough</span><span style=\"font-family:'Cambria Math'\"> in preventing littering.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assumption II</span><span style=\"font-family:'Cambria Math'\"> is also implicit since the very purpose of raising the fine is to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">create fear of higher penalty</span><span style=\"font-family:'Cambria Math'\"> so that people become more cautious.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assumption III</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not implicit</span><span style=\"font-family:'Cambria Math'\">. The statement does not mention or suggest how the additional revenue will be used; hiring more sweepers is an unrelated inference.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only Assumptions I and II are implicit.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement:</span><span style=\"font-family:'Cambria Math'\"> Should there be a mandatory retirement age for politicians?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Argument I:</span><span style=\"font-family:'Cambria Math'\"> Yes, it will allow fresh young minds to enter the system and bring innovative ideas.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Argument II:</span><span style=\"font-family:'Cambria Math'\"> No, experience is the most important factor in governance, which comes only with age.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Argument I is strong</span><span style=\"font-family:'Cambria Math'\"> because it is logical and relevant. Introducing a mandatory retirement age can open opportunities for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">younger leaders</span><span style=\"font-family:'Cambria Math'\">, encouraging </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">fresh perspectives, innovation, and adaptability</span><span style=\"font-family:'Cambria Math'\"> to changing societal needs.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Argument II is also strong</span><span style=\"font-family:'Cambria Math'\"> as it rightly highlights that </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">experience plays a crucial role in governance</span><span style=\"font-family:'Cambria Math'\">. Political decision-making often benefits from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">long-term exposure, maturity, and practical understanding</span><span style=\"font-family:'Cambria Math'\">, which usually come with age.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Both Argument I and Argument II are strong.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Find next term of the series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2Z5, 7Y7, 14X9, 23W11, 34V13, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">45U14</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">47U15</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">47Y14</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">45Y15</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weigh ns": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1,2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 3 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1</span><span style=\"font-family:'Cambria Math'\"> is correct: The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">73rd Constitutional Amendment Act, 1992</span><span style=\"font-family:'Cambria Math'\"> added </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Part IX (Articles 243–243O)</span><span style=\"font-family:'Cambria Math'\"> to the Constitution, giving constitutional status to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Panchayati Raj system</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2</span><span style=\"font-family:'Cambria Math'\"> is incorrect: A </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">three-tier system is not mandatory for all states</span><span style=\"font-family:'Cambria Math'\">. States with a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">population below 20 lakh</span><span style=\"font-family:'Cambria Math'\"> may opt </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not</span><span style=\"font-family:'Cambria Math'\"> to have the intermediate (block) level.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 3</span><span style=\"font-family:'Cambria Math'\"> is correct: The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chairperson of the Panchayat at the intermediate level (Panchayat Samiti)</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">elected indirectly</span><span style=\"font-family:'Cambria Math'\"> by and from among the elected members.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about the 'Meander' landform of a river are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Meanders are a result of both erosion and deposition.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. They are typically found in the youthful stage of a river.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Continuous erosion on the concave bank only leads to the formation of ox-bow lakes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the correct answer using the code below:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2</span><span style=\"font-family:'Cambria Math'\">  </span><span style=\"font-family:'Cambria Math'\">&amp; 3 0nly</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1</span><span style=\"font-family:'Cambria Math'\"> is correct: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Meanders</span><span style=\"font-family:'Cambria Math'\"> are formed due to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">erosion on the concave bank</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">deposition on the convex bank</span><span style=\"font-family:'Cambria Math'\"> of a river.</span></li><li style=\"margin-left:10.52pt;padding-left:7. :'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1</span><span style=\"font-family:'Cambria Math'\"> is correct: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mitochondria</span><span style=\"font-family:'Cambria Math'\"> possess their own </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">DNA and ribosomes</span><span style=\"font-family:'Cambria Math'\">, enabling them to synthesize some of their proteins independently.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2</span><span style=\"font-family:'Cambria Math'\"> is incorrect: The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“powerhouse of the cell”</span><span style=\"font-family:'Cambria Math'\"> refers to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">mitochondria</span><span style=\"font-family:'Cambria Math'\">, not lysosomes; </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">lysosomes</span><span style=\"font-family:'Cambria Math'\"> are involved in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">intracellular digestion</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 3</span><span style=\"font-family:'Cambria Math'\"> is incorrect: The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">cell wall</span><span style=\"font-family:'Cambria Math'\"> is present in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">plant cells</span><span style=\"font-family:'Cambria Math'\"> (and some other organisms like fungi and bacteria) but </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">absent in animal cells</span><span style=\"font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Regarding the 'Constituent Assembly of India', which of the following statements are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Its members were elected directly by the people on the basis of universal adult franchise.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. It acted as the first Parliament of independent India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. Dr. Sachchidananda Sinha was the first temporary President of the Assembly.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 2 and 3 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1</span><span style=\"font-family:'Cambria Math'\"> is incorrect: Members of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Constituent Assembly of India</span><span style=\"font-family:'Cambria Math'\"> were </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">not elected directly by the people</span><span style=\"font-family:'Cambria Math'\">. They were elected </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">indirectly</span><span style=\"font-family:'Cambria Math'\"> by the Provincial Legislative Assemblies under the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Cabinet Mission Plan (1946)</span><span style=\"font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 2</span><span style=\"font-family:'Cambria Math'\"> is correct: After independence, the Constituent Assembly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">functioned as the first Parliament of independent India</span><span style=\"font-family:'Cambria Math'\"> until the first general elections in 1952.</span></li><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 3</span><span style=\"font-family:'Cambria Math'\"> is correct: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sachchidananda Sinha</span><span style=\"font-family:'Cambria Math'\"> served as the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">first temporary President</span><span style=\"font-family:'Cambria Math'\"> of the Constituent Assembly, while </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dr. Rajendra Prasad</span><span style=\"font-family:'Cambria Math'\"> later became its permanent President.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Standard Meridian of India' passes through which of the following cities?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Nagpur</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ahmedabad</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mirzapur</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Patna</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The p:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">3. The GST Council is a statutory body chaired by the Prime Minister.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the statements given above are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 &amp; 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1,2 &amp; 3 All</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 2 only</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:10.52pt;padding-left:7.48pt;font-family:serif;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statement 1</span><span style=\"font-family:'Cambria Math'\"> is correct: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">GST</span><span style=\"font-family:'Cambria Math'\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">destination-based consumption tax</span><span style=\"font-family:'Cambria Math'\">, meaning the tax revenue accrues to the state where the goods or services are consumed.</s font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Special Officer is appointed by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">President of India</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">He/She investigates matters relating to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">safeguards for linguistic minorities</span><span style=\"font-family:'Cambria Math'\"> and reports to the President, who places the report before </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">each House of Parliament</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a flat ring of small, icy bodies revolving around the Sun beyond Neptune? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Asteroid Belt</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuiper Belt </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Oort Cloud </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bow Shock</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kuiper Belt</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kuiper Belt</span><span style=\"font-family:'Cambria Math'\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">flat, disc-shaped ring of small icy bodies</span><span style=\"font-family:'Cambria Math'\"> that revolves around the Sun </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">beyond Neptune</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It includes objects like </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pluto</span><span style=\"font-family:'Cambria Math'\"> and other </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Trans-Neptunian Objects (TNOs)</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Asteroid Belt</span><span style=\"font-family:'Cambria Math'\"> lies between Mars and Jupiter, the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Oort Cloud</span><span style=\"font-family:'Cambria Math'\"> is a distant spherical cloud, and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Bow Shock</span><span style=\"font-family:'Cambria Math'\"> is unrelated to planetary debris.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As we move from the Equator to the North Pole, the value of 'g' (acceleration due to gravity)</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Decreases</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Increases</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Remains same</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Becomes zero</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As we move from the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Equator to the North Pole</span><span style=\"font-family:'Cambria Math'\">, the value of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">acceleration due to gravity (g)</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">increases</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Reason (Concise):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Earth is oblate</span><span style=\"font-family:'Cambria Math'\">, so the radius is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">maximum at the Equator</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">minimum at the Poles</span><span style=\"font-family:'Cambria Math'\">; smaller radius means </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">higher g</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">centrifugal force due to Earth’s rotation</span><span style=\"font-family:'Cambria Math'\"> is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">maximum at the Equator</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">zero at the Poles</span><span style=\"font-family:'Cambria Math'\">, reducing g more at the Equator.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">g is minimum at the Equator and maximum at the Poles</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which Buddhist Council was held during the reign of Kanishka in Kashmir?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First Council</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fourth Council</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Second Council</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Third Council</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fourth Buddhist Council</span><span style=\"font-family:'Cambria Math'\"> was held during the reign of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kanishka</span><span styl -weight:bold;font-family:'Cambria Math'\">social welfare</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements best defines \"Monoecious\"?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A flower with only gynoecium.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A plant having both male and female reproductive organs in the same individual</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A plant having only male flowers.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">A plant that reproduces only through fragmentation.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">A plant in which both male and female reproductive organs are present on the same individual</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Monoecious</span><span style=\"font-family:'Cambria Math'\"> organisms have </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">both male and female reproductive structures on the same plant</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Examples include </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">maize</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">coconut</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">This is different from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">dioecious</span><span style=\"font-family:'Cambria Math'\"> plants, where male and female flowers are on </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">separate plants</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following curves shows the relationship between tax rates and tax revenue?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kuznets Curve</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Phillips Curve</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lorenz Curve</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Laffer Curve</span></p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1768824705739_image001.png\" width=\"416\" height=\"301\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The relationship between </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">tax rates</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">tax revenue</span><span style=\"font-family:'Cambria Math'\"> is shown by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Laffer Curve</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation (brief):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">At </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">0% tax</span><span style=\"font-family:'Cambria Math'\">, revenue is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">0</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">As tax rates increase, revenue </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">rises</span><span style=\"font-family:'Cambria Math'\"> up to a point.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Beyond an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">optimal tax rate</span><span style=\"font-family:'Cambria Math'\">, higher taxes </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">reduce incentives</span><span style=\"font-family:'Cambria Math'\"> to work/invest, so revenue </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">falls</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Hence, the curve is an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">inverted U-shaped</span><span style=\"font-family:'Cambria Math'\"> curve.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct option (if given):</span><span style=\"font-family:'Cambria Math'\"> the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">inverted U-shaped curve</span><span style=\"font-family:'Cambria Math'\"> (Laffer Curve).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The \"Nil Darpan\", a play depicting the atrocities of indigo planters, was written by: </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Madhusudan Dutt</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dinabandhu Mitra</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bankim Chandra</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Dadabhai Naoroji</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dinabandhu Mitra</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Nil Darpan (1860)</span><span style=\"font-family:'Cambria Math'\"> was written by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dinabandhu Mitra</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The play exposed the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">atrocities of European indigo planters</span><span style=\"font-family:'Cambria Math'\"> on Indian peasants in Bengal.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It played an important role in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">shaping public opinion</span><span style=\"font-family:'Cambria Math'\"> during the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indigo Revolt (1859–60)</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In which state will the first university for the disabled be opened in eastern India?</span><span style=\"font-family:'Cambria Math'\">  </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Jharkhand</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihar</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Assam</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The first university for the disabled in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">eastern India</span><span style=\"font-family:'Cambria Math'\"> is planned to be opened in </sp an style=\"font-family:'Nirmala UI'\">D. This agreement marked the beginning of a new era of diplomatic cooperation.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BDCA</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ABDC</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ACBD</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">BADC</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> Correct Order</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">B </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> A </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> D </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Coherent Paragraph:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-style:italic;font-family:'Nirmala UI'\">The dispute over the land borders had been simmering for over a decade. It was only after hours of intense negotiation that the two parties reached a consensus. This agreement marked the beginning of a new era of diplomatic cooperation. Consequently, the local residents celebrated the news with great enthusiasm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Why other orders are wrong</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Starting with A</span><span style=\"font-family:'Nirmala UI'\">: Jumps straight to negotiations without explaining the background (illogical).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Starting with D</span><span style=\"font-family:'Nirmala UI'\">: Talks about the agreement before mentioning the dispute or negotiations (out of sequence).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Putting C before D</span><span style=\"font-family:'Nirmala UI'\">: Celebration cannot logically precede the announcement of the agreement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Any order skipping B first</span><span style=\"font-family:'Nirmala UI'\">: Loses context, because the dispute is the foundation of the narrative.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Identify the type of sentence given below:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">\"Although the rain was heavy, the match continued, and the fans stayed until the very end.\"</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Simple Sentence</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Compound Sentence</span></p>", " <p style=\"margin-top ader impact of remote work.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why other options are wrong</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">PQRS:</span><span style=\"font-family:'Nirmala UI'\"> Starts with the conclusion before introducing the context; feels abrupt.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">PSRQ:</span><span style=\"font-family:'Nirmala UI'\"> Begins with innovation, then jumps to costs, then balance, then context; illogical sequence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">QPRS:</span><span style=\"font-family:'Nirmala UI'\"> Goes from context to conclusion too quickly, skipping the logical flow of benefits.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Change the narration of the given sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">\"Do you know why the flight was delayed, and can you tell me when the next one departs?\" the passenger asked the clerk.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The passenger asked the clerk if he knew why the flight had been delayed and if he could tell him when the next one departed.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The passenger asked the clerk did he know why the flight was delayed.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The passenger enquired whether the clerk knows why the argin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">was delayed</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">had been delayed</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-style:italic;font-family:'Nirmala UI'\">departs</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">departed</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Pronouns</span><span style=\"font-family:'Nirmala UI'\"> are correctly changed (</span><span style=\"font-style:italic;font-family:'Nirmala UI'\">you</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-style:italic;font-family:'Nirmala UI'\">he</span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-style:italic;font-family:'Nirmala UI'\">me</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:Arial\">→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-style:italic;font-family:'Nirmala UI'\">him</span><span style=\"font-family:'Nirmala UI'\">).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the appropriate synonym of the given word:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">ANATHEMA</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Blessing</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Religious</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Musical</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Curse</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option: Curse</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">ANATHEMA</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">English:</span><span style=\"font-family:'Nirmala UI'\"> Something or someone that is intensely disliked, condemned, or cursed</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Hindi:</span><span style=\"font-family:'Nirmala UI'\"> अभिशाप, घोर निंदा की वस्तु</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option Meanings</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Blessing</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — वरदान (opposite meaning)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Religious</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — धार्मिक (not a synonym)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Musical</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Nirmala UI'\"> — संगीतमय</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Curse</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> — अभिशाप, शाप</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
