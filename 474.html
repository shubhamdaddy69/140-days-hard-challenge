<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>

<script>
const Q = [{"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Consider the following statements on the International Big Cat    Alliance:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.     India    is the initiator and lead coordinator of the alliance.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.     It    focuses on the conservation of 6 species of big cats.</p>    <p style=\"orphans:0;widows:0\">3.     The    alliance promotes scientific data sharing among member nations.</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 and 2 are correct</p>", " <p style=\"orphans:0;widows:0\">    Only 1 and 3 are correct</p>", " <p style=\"orphans:0;widows:0\">    Only 2 and 3 are correct</p>", " <p style=\"orphans:0;widows:0\">    All 1, 2 and 3 are correct</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The <b>International     Big Cat Alliance</b> was launched by <b>India in 2023</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">India     plays the role of <b>initiator, host, and lead coordinator</b>,     reflecting its long-standing experience in big cat conservation     (e.g., Project Tiger).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     IBCA focuses on the conservation of <b>7 big cat species</b>,     not 6.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">These     include: <b>Tiger + Lion + Leopard + Snow     Leopard + Cheetah + Jaguar + Puma</b></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">One     of the core objectives of IBCA is to:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Promote <b>scientific      research</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Encourage <b>data      and best-practice sharing</b></p>      </li><li><p style=\"orphans:0;widows:0\">Enhance <b>capacity      building and international cooperation</b> for big cat      conservation</p>     </li></ul>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Consider the following events related to the Indian National    Congress:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.    Gandhi-Irwin Pact</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.    Execution of Bhagat Singh</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">3. 1931    Karachi Session of the Indian National Congress</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">4.    Martyrdom of Chandra Shekhar Azad</p>    <p style=\"orphans:0;widows:0\">Choose the correct chronological    order from the code given below:</p>", "options": ["<p style=\"orphans:0;widows:0\">    4, 1, 2, 3</p>", " <p style=\"orphans:0;widows:0\">    1, 2, 3, 4</p>", " <p style=\"orphans:0;widows:0\">    2, 3, 4, 1</p>", " <p style=\"orphans:0;widows:0\">    4, 1, 3, 2</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    The correct chronological order is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Martyrdom of Chandra Shekhar Azad – 27 February 1931</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Gandhi-Irwin Pact – 5 March 1931</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Execution of Bhagat Singh – 23 March 1931</b></p>    <p style=\"orphans:0;widows:0\">• <b>Karachi Session of    Congress – 29 to 31 March 1931</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Morarji Desai was commemorated on his 129th birth anniversary, 29    February 2025, for his contributions to governance reforms in    India. Which of the following commissions did he chair in 1966 to    restructure the country's governance?</p>", "options": ["<p style=\"orphans:0;widows:0\">    1st Administrative Reforms Commission</p>", " <p style=\"orphans:0;widows:0\">    1st Finance Commission</p>", " <p style=\"orphans:0;widows:0\">    Planning Commission</p>", " <p style=\"orphans:0;widows:0\">    Sarkaria Commission</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Morarji     Desai was a prominent Indian leader known for his emphasis     on <b>administrative efficiency, probity, and governance     reforms</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">In <b>1966</b>,     the Government of India set up the <b>First Administrative     Reforms Commission (ARC)</b> to review and suggest reforms     in the public administration system.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Morarji Desai was     appointed as the Chairman of the 1st Administrative Reforms     Commission</b>.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Two identical bulbs will glow more when connected in–</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(1) Series</p>    <p style=\"orphans:0;widows:0\">(2) Parallel</p>", "options": ["<p style=\"orphans:0;widows:0\">    More in (1)</p>", " <p style=\"orphans:0;widows:0\">    More in (2)</p>", " <p style=\"orphans:0;widows:0\">    Same in both (1) and (2)</p>", " <p style=\"orphans:0;widows:0\">    Cannot be said</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Series     connection</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>The same      current flows through both bulbs.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>The total      resistance increases.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Each      bulb gets less voltage.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Hence,      the bulbs glow dim.</b></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Parallel     connection</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Each      bulb gets the full supply voltage.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Current      divides, but voltage remains the same.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>The total      resistance decrease.</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Each      bulb glows with greater brightness.</b></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><b>Household electric bulbs     are connected in parallel so that each bulb glows at     full brightness and works independently. Thus, bulbs glow     brighter in parallel.</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    What is the ascending order of India’s international boundary    length with its neighboring countries?</p>", "options": ["<p style=\"orphans:0;widows:0\">    China, Bangladesh, Pakistan, Nepal</p>", " <p style=\"orphans:0;widows:0\">    Nepal, Pakistan, China, Bangladesh</p>", " <p style=\"orphans:0;widows:0\">    Nepal, Pakistan, Bangladesh, China</p>", " <p style=\"orphans:0;widows:0\">    Pakistan, Nepal, China, Bangladesh</p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>India’s international boundary length</b> with    neighboring countries is as follows—</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Bangladesh – 4096.7 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• <b>China    – 3488 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Pakistan – 3323 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• <b>Nepal    – 1751 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Myanmar – 1643 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• <b>Bhutan    – 699 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">•    <b>Afghanistan – 106 km</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Total –    15,106.7 km</b></p>    <p style=\"orphans:0;widows:0\"><b>Hence, the ascending order is    Nepal, Pakistan, China, Bangladesh.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Which of the following is an example of structural unemployment?</p>", "options": ["<p style=\"orphans:0;widows:0\">    A worker choosing not to work due to a lack of job opportunities</p>", " <p style=\"orphans:0;widows:0\">    A worker losing their job due to a recession</p>", " <p style=\"orphans:0;widows:0\">    A worker being unable to find a job due to a lack of skills in a    new and expanding industry</p>", " <p style=\"orphans:0;widows:0\">    A worker being unable to find a job due to discrimination</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Types of Unemployment (Other than Structural)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>1 Cyclical    Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Economic     slowdown or recession</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> A     factory worker loses his job during an economic recession due to     reduced demand.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>2    Frictional Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Temporary     gap between jobs</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> A     graduate searching for a job after completing studies.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>3    Seasonal Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Work     available only in certain seasons</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> Agricultural     labourers remaining unemployed during the off-season.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>4    Disguised Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> More     workers employed than required</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> Five     people working on a farm where only three are needed.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>5    Voluntary Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Choice     of the worker</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> A     person refusing available work due to low wages.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>6    Technological Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Replacement     of labour by machines/automation</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> Workers     losing jobs due to the introduction of automated machines.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>7    Underemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Working     below one’s skill level or fewer hours</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Example:</b> An     engineering graduate working as a delivery executive.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>8 Open    Unemployment</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Cause:</b> Willing     and able to work but no job available</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Example:</b> Educated     youth actively seeking jobs but unable to find any.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Arrange the following classical dances in chronological order of    earliest historical references (oldest to newest):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.     Bharatanatyam</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.     Mohiniyattam</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">3.     Kathak</p>    <p style=\"orphans:0;widows:0\">4.     Manipuri</p>", "options": ["<p style=\"orphans:0;widows:0\">    1-3-2-4</p>", " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", " <p style=\"orphans:0;widows:0\">    1-3-4-2</p>", " <p style=\"orphans:0;widows:0\">    1-4-3-2</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Bharatanatyam (Oldest)</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Originated     in <b>Tamil Nadu</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">References     found in <b>ancient Tamil literature</b>, temple sculptures,     and <b>Nā</b><span><b>ṭ</b></span><b>yaśāstra</b> (around     2nd century BCE–2nd century CE).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Considered     the <b>oldest surviving classical dance form</b> of     India.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Kathak</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Originated     in <b>North India</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Early     roots in <b>ancient storytelling traditions (Kathakas)</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Gained     prominence during the <b>medieval period</b>, especially     under <b>Mughal patronage</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Manipuri</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Originated     in <b>Manipur</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Connected     with <b>Vaishnavism</b> and <b>Raslila traditions</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Historical     references become prominent from around the <b>15th–16th     century</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Mohiniyattam    (Newest among these)</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Originated     in <b>Kerala</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Though     inspired by older traditions, it developed as a <b>distinct     classical form much later</b>, mainly during the <b>18th–19th     century</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Final    Chronological Order:</b></p>    <p style=\"orphans:0;widows:0\"><b>Bharatanatyam → Kathak →    Manipuri → Mohiniyattam</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    From which Harappan site have the Citadel, Middle Town, and Lower    Town under urban planning been found?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(i) Kunal</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(ii)    Lothal</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(iii)    Rangpur</p>    <p style=\"orphans:0;widows:0\">(iv) Dholavira</p>", "options": ["<p style=\"orphans:0;widows:0\">    (i) and (ii)</p>", " <p style=\"orphans:0;widows:0\">    (iii) and (iv)</p>", " <p style=\"orphans:0;widows:0\">    (i), (ii) and (iii)</p>", " <p style=\"orphans:0;widows:0\">    Only (iv)</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Dholavira,     a major Harappan site</b> in Kutch district of Gujarat, is     unique for its urban planning. The city was <b>divided into     three parts —</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>1.     Citadel (fortified area)</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>2.     Middle Town</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>3.     Lower Town</b></p>     </li><li><p style=\"orphans:0;widows:0\">Most Harappan sites have     only Citadel and Lower Town, but Dholavira uniquely had a     three-part plan.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    With reference to the Global Peace Index 2025, consider the    following statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1. This    index is released by the World Economic Forum (WEF).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2. Iceland    has secured the top position in this index.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">3. India    has been ranked 115th in this index.</p>    <p style=\"orphans:0;widows:0\">Which of the above statement(s)    is/are correct?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only (3)</p>", " <p style=\"orphans:0;widows:0\">    Only (2) and (3)</p>", " <p style=\"orphans:0;widows:0\">    Only (1) and (2)</p>", " <p style=\"orphans:0;widows:0\">    All of the above</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     19th edition of the<b> Global Peace Index 2025 w</b>as     released by the<b> Institute for Economics and Peace (IEP).</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Iceland secured the top     position and India was ranked 115th.</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Consider the following statements about Boxing techniques and    training:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.     Offensive    boxing actions include \"Straight Left to the Body\" and    \"Right Uppercut to the Head\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.     Methods    like \"Shadow Boxing\" and \"Mirror Boxing\" are    used for developing boxing techniques.</p>    <p style=\"orphans:0;widows:0\">3.     The    four boxing distances or ranges are Long Distance, Medium    Distance, Close Distance, and Infighting. Which of the above    statements is/are correct?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 and 2 are Correct</p>", " <p style=\"orphans:0;widows:0\">    Only 2 and 3 are Correct</p>", " <p style=\"orphans:0;widows:0\">    Only 1 and 3 are correct</p>", " <p style=\"orphans:0;widows:0\">    1, 2 and 3 are Correct</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Both     techniques are standard <b>offensive punches</b> in     boxing:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Straight     Left to the Body</b> targets the opponent’s torso to     weaken stamina.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Right     Uppercut to the Head</b> is a powerful close-range punch     aimed at the chin or jaw.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">These     are widely used <b>training methods</b>:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Shadow      Boxing</b> improves footwork, coordination, speed, and      punch combinations.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Mirror      Boxing</b> helps boxers observe posture, balance, and      technique correction in real time.</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Boxing     is commonly divided into these <b>four fighting ranges</b>:</p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Long     Distance</b> – Jab and movement-based attacks</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Medium     Distance</b> – Combination punching range</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Close     Distance</b> – Short hooks and uppercuts</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Infighting</b> –     Very close combat with body shots and clinch work</p>    </li></ol>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    India Meteorological Department officially adopted the Bharat    Forecast System on 26 May 2025. It has been developed by ____ .</p>", "options": ["<p style=\"orphans:0;widows:0\">    IIT Kanpur</p>", " <p style=\"orphans:0;widows:0\">    IIT Kharagpur</p>", " <p style=\"orphans:0;widows:0\">    IIT Bombay</p>", " <p style=\"orphans:0;widows:0\">    Indian Institute of Tropical Meteorology</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The <b>India     Meteorological Department (IMD)</b> officially adopted     the <b>Bharat Forecast System (BFS)</b> on <b>26     May 2025</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The <b>Bharat     Forecast System</b> has been <b>developed by the Indian     Institute of Tropical Meteorology (IITM), Pune</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">IITM     is an autonomous research institute under the <b>Ministry of     Earth Sciences (MoES)</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     system is an <b>indigenous numerical weather prediction     (NWP) model</b>, designed to:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Improve <b>accuracy      of weather forecasts</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Enhance <b>early      warning systems</b> for extreme weather events such as      cyclones, heavy rainfall, and heatwaves</p>      </li><li><p style=\"orphans:0;widows:0\">Strengthen <b>India’s      self-reliance</b> in weather and climate modelling</p>     </li></ul>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Which Article of the Constitution of India permits minorities    based on language to establish educational institutes?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Article 29</p>", " <p style=\"orphans:0;widows:0\">    Article 30</p>", " <p style=\"orphans:0;widows:0\">    Article 32</p>", " <p style=\"orphans:0;widows:0\">    Article 28</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Article     30 of the Constitution of India</b> grants <b>minorities</b>,     whether based on <b>religion or language</b>, the <b>right     to establish and administer educational institutions of their     choice</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Key    Points about Article 30:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Applies     to <b>both religious and linguistic minorities</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Ensures     protection of <b>minority culture, language, and identity</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     State <b>cannot discriminate</b> against minority     educational institutions while granting aid.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Other     Info-</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Article     29</b> → Protects the <b>right to conserve language,     script, or culture</b>, but does <b>not</b> specifically     grant the right to establish institutions</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Article     32</b> → Deals with the <b>Right to Constitutional     Remedies</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Article 28</b> →     Relates to <b>freedom from religious instruction</b> in     certain educational institutions.</p>    </li></ul>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Which is correctly matched in sequence?</p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       (A) Radium</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       1. Alexander Fleming</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       (B) Penicillin</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       2. Madame Curie</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       (C) X-ray</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       3. Edward Jenner</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       (D) Smallpox</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       4. W.K. Roentgen</p>      </td>     </tr>    </table>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-2, B-1, C-4, D-3</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-2, B-3, C-4, D-1</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-3, B-4, C-1, D-2</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-4, B-1, C-2, D-3</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Radium </b>was     discovered by <b>Pierre Curie and Madame Curie</b> in     1898.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Penicillin</b> was     discovered by <b>Alexander Fleming</b> in 1928.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>X-rays</b> were     discovered by <b>Wilhelm K. Roentgen</b> in 1895.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Edward     Jenner </b>discovered the<b> smallpox vaccine </b>in     1796.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Where is the southernmost point of India, ‘Indira Point,’    located?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Tamil Nadu</p>", " <p style=\"orphans:0;widows:0\">    Little Nicobar</p>", " <p style=\"orphans:0;widows:0\">    Great Nicobar</p>", " <p style=\"orphans:0;widows:0\">    Car Nicobar Island</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    • <b>The southernmost point of India is Indira Point,    located on Great Nicobar Island.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• On the    Indian mainland, the southernmost point is Kanyakumari (Tamil    Nadu).Kanyakumari (Cape Comorin) is the place where the Bay of    Bengal, the Arabian Sea, and the Indian Ocean meet.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• <b>Northernmost    point: Indira Col, </b>near the Siachen Glacier (Ladakh).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">• <b>Westernmost    point: Guhar Moti</b> (Gujarat).</p>    <p style=\"orphans:0;widows:0\">• <b>Easternmost point:    Kibithu </b>(Arunachal Pradesh).</p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In the post-reform era, fiscal prudence became central to    macroeconomic stability. Which of the following Acts was enacted    in 2003 to institutionalise fiscal discipline in India?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Companies Act</p>", " <p style=\"orphans:0;widows:0\">    Banking Regulation Act</p>", " <p style=\"orphans:0;widows:0\">    FEMA Act</p>", " <p style=\"orphans:0;widows:0\">    Fiscal Responsibility and Budget Management Act</p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In the <b>post-reform era (after 1991)</b>,    maintaining <b>fiscal prudence</b> became essential for    ensuring <b>macroeconomic stability</b> in India. To    institutionalise fiscal discipline, the Government of India    enacted the <b>Fiscal Responsibility and Budget Management    (FRBM) Act</b> in <b>2003</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Key    Objectives of the FRBM Act, 2003:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Reduce <b>fiscal     deficit</b> and <b>revenue deficit</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Promote <b>long-term     macroeconomic stability</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Improve <b>transparency</b> in     fiscal operations</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Ensure <b>prudent     management of public finances</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Set <b>targets</b> for     government borrowings and debt</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Other     Info-</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Companies     Act</b> → Regulates corporate governance and company law</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Banking     Regulation Act</b> → Governs banking operations and     supervision</p>     </li><li><p style=\"orphans:0;widows:0\"><b>FEMA Act</b> →     Regulates foreign exchange and external trade, not fiscal     discipline.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Announced in the Union Budget 2025-26, what is the primary    objective of the National Geospatial Mission?<br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    To create and manage an integrated geospatial infrastructure for    governance and development</p>", " <p style=\"orphans:0;widows:0\">    To promote satellite launch services for private companies</p>", " <p style=\"orphans:0;widows:0\">    To provide free GPS services to rural areas</p>", " <p style=\"orphans:0;widows:0\">    To monitor climate change patterns through satellite data</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The <b>National     Geospatial Mission</b>, announced in the <b>Union Budget     2025–26</b>, aims to strengthen India’s <b>geospatial     ecosystem</b> and support evidence-based policymaking.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Primary     Objective of the National Geospatial Mission:</b></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Create     and manage an integrated geospatial infrastructure</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Enable <b>better     governance, planning, and development</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Improve     access to <b>standardised geospatial data</b> across     ministries and states</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Support     sectors such as:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Urban      and rural planning</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Infrastructure      development</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Disaster      management</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Agriculture      and land records</p>      </li><li><p style=\"orphans:0;widows:0\">Smart cities and public      service delivery</p>     </li></ul>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Which of the following pairs of revolutions and their associated    products in agriculture are correctly matched?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1. Pink    Revolution: Shrimp production</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2. Yellow    Revolution: Oilseed production</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">3. Black    Revolution: Biodiesel production</p>    <p style=\"orphans:0;widows:0\">4. Golden Revolution: Egg    production</p>", "options": ["<p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", " <p style=\"orphans:0;widows:0\">    Only 2 and 3</p>", " <p style=\"orphans:0;widows:0\">    Only 1 and 3</p>", " <p style=\"orphans:0;widows:0\">    Only 2 and 4</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Pink     Revolution:</b> Related mainly to <b>shrimp and onion     production</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Yellow     Revolution:</b> Related to <b>oilseed production</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Black     Revolution:</b> Related to     agriculture-based <b>petroleum/biodiesel production</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Golden     Revolution:</b> Related mainly to<b> fruits and honey,     not eggs</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In March 2025, which two institutions were given the status    of the 25th and 26th Navratna companies by the Government of    India?</p>", "options": ["<p style=\"orphans:0;widows:0\">    IRCTC and HAL</p>", " <p style=\"orphans:0;widows:0\">    IRFC and NTPC</p>", " <p style=\"orphans:0;widows:0\">    IRCTC and IRFC</p>", " <p style=\"orphans:0;widows:0\">    BSNL and BEML</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">In <b>March     2025</b>, the <b>Government of India</b> granted <b>Navratna     status</b> to two Central Public Sector Enterprises (CPSEs),     making them the <b>25th and 26th Navratna companies</b> of     the country.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The two    institutions are:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Indian     Railway Catering and Tourism Corporation (IRCTC)</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Indian Railway Finance     Corporation (IRFC)</b></p>    </li></ul>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Match the following:</p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       Column A (Acts and their year of enactment)</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       Column B (Year of Enactment)</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       A. Unlawful Activities (Prevention) Act (UAPA)</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       1.1967</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       B. Dowry Prohibition Act</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       2.1961</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       C. Armed Forces (Special Powers) Act (AFSPA)</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       3.1958</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       D. Micro, Small and Medium Enterprises Development Act (MSME       Act)</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       4.2006</p>      </td>     </tr>    </table>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-1, B-2, C-3, D-4</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-2, B-1, C-4, D-3</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-4, B-3, C-2, D-1</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A-1, B-3, C-2, D-4</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>UAPA     – 1967:</b> Enacted to control <b>terrorism and     anti-national activities</b> in India.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Dowry     Prohibition Act – 1961: </b>Made the giving and taking     of <b>dowry a criminal offence.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>AFSPA     – 1958: </b>Grants special powers to <b>armed forces     deployed in disturbed areas.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>MSME     Act – 2006:</b> For development, facilitation,     and <b>regulation of Micro, Small, and Medium</b> Enterprises.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Most of the Thar desert lies within India, spanning the states of    __ .</p>", "options": ["<p style=\"orphans:0;widows:0\">    Rajasthan, Gujarat, Punjab, and Himachal Pradesh</p>", " <p style=\"orphans:0;widows:0\">    Rajasthan, Gujarat, Punjab, and Madhya Pradesh</p>", " <p style=\"orphans:0;widows:0\">    Rajasthan, Gujarat, Punjab, and Haryana</p>", " <p style=\"orphans:0;widows:0\">    Rajasthan, Gujarat, Punjab, and Uttar Pradesh</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The <b>Thar     Desert</b>, also known as the <b>Great Indian Desert</b>,     lies primarily in <b>India</b>, with a smaller portion     extending into Pakistan.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Within     India, the Thar Desert mainly spans the following states:</p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Rajasthan</b> →     Covers the <b>largest portion</b> of the desert</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Gujarat</b> →     Especially the <b>Kutch region</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Punjab</b> →     Southwestern parts</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Haryana</b> →     Southern and western parts</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In August 2025, which medical college in India has launched the    country's first Department of Artificial Intelligence in    Healthcare?</p>", "options": ["<p style=\"orphans:0;widows:0\">    CMC, Vellore</p>", " <p style=\"orphans:0;widows:0\">    KMC, Manipal</p>", " <p style=\"orphans:0;widows:0\">    JIPMER, Puducherry</p>", " <p style=\"orphans:0;widows:0\">    BITS, Pilani</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">In <b>August     2025</b>, <b>Kasturba Medical College (KMC),     Manipal</b> became the <b>first medical college in     India</b> to launch a dedicated <b>Department of     Artificial Intelligence in Healthcare</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">It     marks a major step in integrating <b>Artificial Intelligence     (AI)</b> with <b>medical education, research, and     clinical practice</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     department focuses on:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">AI-driven <b>diagnostics      and imaging</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Predictive      analytics</b> in patient care</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Clinical      decision support systems</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Medical      data science and digital health innovations</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\">Strengthens India’s     position in <b>future-ready healthcare education</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    With reference to the early history of the Central Legislative    Assembly in India, consider the following statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.    Sachidanand Sinha was the first Deputy Chairman of the Central    Legislative Assembly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.    Vithalbhai J. Patel  was the first Indian and the first    elected President of the Central Legislative Assembly.</p>    <p style=\"orphans:0;widows:0\">Which of the above statements    is/are correct?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1</p>", " <p style=\"orphans:0;widows:0\">    Only 2</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement     1 is correct:</b> In 1921, under the provisions of the     Government of India Act, 1919 (Montagu–Chelmsford Reforms), the     offices of Speaker and Deputy Speaker were created for     the <b>Central Legislative Assembly</b>, though they were     then titled <b>President</b> and <b>Deputy     President</b>. <b>Sachidanand Sinha</b> was appointed     by the Governor-General as the<b> first Deputy President     (Deputy Speaker) of the Assembly in 1921.</b> He later     gained further distinction as the temporary Chairman of the     Constituent Assembly in 1946.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Statement 2 is     correct:</b> <b>Vitthalbhai J. Patel</b> (V.J. Patel)     was the first Indian and the first member to be elected as     the <b>President</b> (Speaker) of the Central     Legislative Assembly. He was elected to this position on August     22, 1925, following the retirement of the first appointed     President, Sir Frederick Whyte. Patel is remembered for     establishing key parliamentary traditions, such as the     independence of the Legislative Secretariat.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Which of the following Acts aims to prevent money laundering in    India?</p>", "options": ["<p style=\"orphans:0;widows:0\">    SEBI</p>", " <p style=\"orphans:0;widows:0\">    FCRA</p>", " <p style=\"orphans:0;widows:0\">    PMLA</p>", " <p style=\"orphans:0;widows:0\">    FEMA</p>"], "correct": 3, "marks": "1", "explanation": "Tुध Pनधॅधnपiयn यी Mयnधद Lोहnकधनing Acप (PMLA), 2002 iौ पुध ूनiंोनद िोथ in Inकiो ोiंधक ोप ूनधॅधnपing ंयnधद िोहnकधनing ोnक cयंृोपing पुध हौध यी iििधgोििद यृपोinधक ंयnधद in पुध ीinोnciोि ौदौपधं. Kधद Oृुधcपiॅधौ यी PMLA: Pनधॅधnप ोnक cयnपनिय ंयnधद िोहnकधनing Cयnीiौcोपध ोnक ौधप्रध ूनयूधनपद कधनiॅधक ीनयं ूनयcधधकौ यी cनiंध Pहniौु यीीधnकधनौ inॅियॅधक in िोहnकधनing ोcपiॅiपiधौ Sपनधngपुधn Inकiो’ौ ीनोंधथयना ोgोinौप ीinोnciोि cनiंधौ ोnक पधननयनiौं ीinोncing SEBI → A नधgिहोपयनद ृयकद gयॅधनning पुध ौधcहनiपiधौ ंोनाधप, nयप ोn ोnपi-ंयnधद िोहnकधनing िोथ FCRA → Rधgिहोपधौ ीयनधign cयnपनiृहपiयnौ पय inकiॅiकहोिस ोnक यनgोnप्रोपiयnौ FEMA → Gयॅधनnौ ीयनधign धसcुोngध पनोnौोcपiयnौ, nयप ौूधciीicोििद ंयnधद िोहnकधनing"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Consider the following:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">1.    Photosynthesis</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2.    Respiration</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">3.    Decomposition of organic matter</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">4.    Volcanic activities</p>    <p style=\"orphans:0;widows:0\">Which of the above processes add    carbon dioxide to the Earth’s carbon cycle?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 and 4</p>", " <p style=\"orphans:0;widows:0\">    Only 2 and 3</p>", " <p style=\"orphans:0;widows:0\">    Only 2, 3 and 4</p>", " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Photosynthesis</b> </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Removes carbon      dioxide (CO₂)</b> from the atmosphere</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Plants      absorb CO₂ to produce glucose and oxygen</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Respiration</b> </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Living     organisms release <b>CO₂</b> back into the atmosphere     during respiration</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Decomposition     of organic matter</b> </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Decomposers     (bacteria and fungi) break down dead plants and animals</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">This     process releases <b>carbon dioxide (and sometimes     methane)</b> into the atmosphere</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Volcanic     activities</b> </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Volcanoes     emit <b>carbon dioxide</b> stored in Earth’s interior     into the atmosphere</p>     </li><li><p style=\"orphans:0;widows:0\">Hence, above processes <b>only     photosynthesis cannot</b> <b>add carbon dioxide to the     Earth’s carbon cycle.</b> </p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Bharatiya Nagarik Suraksha Samhita (BNSS) ensures    access to FIR through which portal? </p>", "options": ["<p style=\"orphans:0;widows:0\">    CCTNS </p>", " <p style=\"orphans:0;widows:0\">    National Crime Portal </p>", " <p style=\"orphans:0;widows:0\">    DIGI-FIR </p>", " <p style=\"orphans:0;widows:0\">    BHAVISHYA </p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The Bharatiya Nagarik Suraksha     Samhita <b>(BNSS), 2023</b> —<b> replaces</b> the     old Code of Criminal Procedure <b>(CrPC), 1973 </b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Under     the BNSS, citizens are ensured <b>access to their FIR</b> (First     Information Report) <b>through the CCTNS portal. </b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Full     form:</b> Crime and Criminal Tracking Network &amp; Systems </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Launched     by</b>: Ministry of Home Affairs <b>(MHA) </b>under the     National e-Governance Plan <b>(NeGP</b> </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Objective:</b> To <b>connect</b> <b>all     police stations</b> across India <b>through a digital     network.</b> </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Functions:</b> Register     and <b>track FIRs online.</b> </p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Parts of the following sentence have been given as xplanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Sincere</b>     – honest and dedicated efforts; fits the context of     appreciation</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Random</b>     – without plan</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Reluctant</b>     – unwilling</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Careless</b>     – lacking attention</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Arrange the following sentences in the most logical and meaningful    order:</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">As a     result, he decided to follow a strict study schedule.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">He     realized that his performance in previous exams was     unsatisfactory.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Gradually,     his confidence improved and his results became better.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">This     consistent effort helped him understand concepts more clearly.<br> <br> <br>      </p>    </li></ol>    <p style=\"orphans:0;widows:0\"><br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    2 → 1 → 4 → 3</p>", " <p style=\"orphans:0;widows:0\">    1 → 2 → 3 → 4</p>", " <p style=\"orphans:0;widows:0\">    2 → 4 → 1 → 3</p>", " <p style=\"orphans:0;widows:0\">    1 → 4 → 2 → 3</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Sentence     2</b> → Introduces the problem (poor performance)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Sentence     1</b> → Action taken (<i>as a result</i>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Sentence     4</b> → Effect of the action</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Sentence     3</b> → Final result (improvement)</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Fill in the blank with the correct article:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">She was    appointed ___ head of the department after years of experience.</p>    <p style=\"orphans:0;widows:0\"><br> <br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    a</p>", " <p style=\"orphans:0;widows:0\">    an</p>", " <p style=\"orphans:0;widows:0\">    the</p>", " <p style=\"orphans:0;widows:0\">    no article</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0\">When a <b>post/position</b>     is used after a verb like <i>appointed/elected/made</i> and is     <b>unique or descriptive</b>, <b>no article</b> is used.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Choose the correct passive form of the given sentence:</p>    <p style=\"orphans:0;widows:0\">“<b>The committee will announce    the results tomorrow.”</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    The results will announce by the committee tomorrow.</p>", " <p style=\"orphans:0;widows:0\">    The results will be announced by the committee tomorrow.</p>", " <p style=\"orphans:0;widows:0\">    The results are announced by the committee tomorrow.</p>", " <p style=\"orphans:0;widows:0\">    The results were announced by the committee tomorrow.</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Future     tense passive structure: <b>will be + past participle</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Correct     form: <b>will be announced</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Other     options have incorrect tense or verb form</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> <b>Exam     Tip:<br> </b> In passive voice questions, first identify the     <b>tense</b>, then apply:<br>  <b>Object + auxiliary (as per     tense) + past participle + by + subject</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate synonym of the given word:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Meticulous</p>    <p style=\"orphans:0;widows:0\"><br> <br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    careless</p>", " <p style=\"orphans:0;widows:0\">    precise</p>", " <p style=\"orphans:0;widows:0\">    hurried</p>", " <p style=\"orphans:0;widows:0\">    negligent</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Meticulous</b>     – very careful and attentive to details</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Precise</b>     – exact and accurate; closest in meaning</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Careless     / negligent</b> – opposite meanings</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Hurried</b>     – done too quickly</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Words     related to <b>care, accuracy, detail</b> often have synonyms like     <i>precise, thorough, exact</i></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Replace the underlined word with its correctly spelt version:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The    committee admired his <u><b>perseverence</b></u> despite repeated    failures.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br> <br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    perseverence</p>", " <p style=\"orphans:0;widows:0\">    perseverencee</p>", " <p style=\"orphans:0;widows:0\">    perseverance</p>", " <p style=\"orphans:0;widows:0\">    perserverance</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Perseverance     </b>(<span style=\"font-family:'Mangal'\"><span style=\"font-size:10pt\"><span>धैर्यपूर्वक     प्रयास करते रहना </span></span></span>/     <span style=\"font-family:'Mangal'\"><span style=\"font-size:10pt\"><span>निरंतर     प्रयास</span></span></span>) - The quality of     continuing to try <b>despite difficulties or repeated failures. </b></p>    </li></ul>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Synonyms:      </b>Persistence, Determination, Tenacity</p>     </li></ul>    </ul>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Antonyms</b>:      Giving up, Weakness, Indecision</p>     </li></ul>    </ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    The following sentence has been split into four segments. Identify    the segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The    committee called off / the meeting at the last minute / due to    lack of quorum / despite all members were present.</p>    <p style=\"orphans:0;widows:0\"><br> <br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    The committee called off</p>", " <p style=\"orphans:0;widows:0\">    the meeting at the last minute</p>", " <p style=\"orphans:0;widows:0\">    due to lack of quorum</p>", " <p style=\"orphans:0;widows:0\">    despite all members were present</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Error     is in segment D:</b> “despite all members were present”</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Despite</b>      is a <b>preposition</b>, not a conjunction. It cannot be      directly followed by a <b>finite verb (were)</b>.<br> <br> <br> <br>       </p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Correct     structures:</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">despite      + noun/gerund → <b>despite all members being present</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">despite      the fact that + clause → <b>despite the fact that all members      were present</b></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Rearrange the jumbled words and choose the alternative that    correctly completes the given sentence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">I missed    the ________ for the next.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">usually /    hour / which / for / board / had / wait / an / bus / I / and / to</p>    <p style=\"orphans:0;widows:0\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    bus and had to wait for an hour which I usually board</p>", " <p style=\"orphans:0;widows:0\">    bus which I usually board and had to wait for an hour</p>", " <p style=\"orphans:0;widows:0\">    bus which usually I board and had to wait for an hour</p>", " <p style=\"orphans:0;widows:0\">    bus and I had to wait which for an hour usually board</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>bus”</b>     must come immediately after <b>missed the</b> → <i>missed the     bus</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>which     I usually board”</b> is a <b>relative clause</b> describing     <i>bus</i>, so it must follow <b>bus</b> directly</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>and     had to wait”</b> correctly connects the second action after     missing the bus</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>for     an hour”</b> is the correct time expression and fits after <i>wait</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>for     the next”</b> is already given in the sentence and completes     the idea</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate option that can substitute the    underlined segment in the given sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Rohit is    <u>more ambitious than practical</u> in his approach to work.</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    ambitious rather than practical</p>", " <p style=\"orphans:0;widows:0\">    more ambitious to practical</p>", " <p style=\"orphans:0;widows:0\">    as ambitious as practical</p>", " <p style=\"orphans:0;widows:0\">    ambitious instead practical</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     sentence compares <b>two qualities of the same person</b>:     ambitious and practical.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">In     such comparisons, the <b>correct and idiomatic structure</b> is:<br>      <b>adjective + rather than + adjective</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">This     structure shows <b>preference or dominance of one quality over     another</b>, not a numerical comparison.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Option     B:</b> Incorrect preposition; <i>to</i> is not used for comparing     qualities.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Option     C:</b> Shows equality, which changes the intended meaning.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Option D:</b>     Grammatically incomplete and incorrect structure.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Rearrange the jumbled words and choose the alternative that    correctly completes the given sentence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The    villagers of _______ to survive.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">often /    this / region / lack / basic / resources / required / in / remote    / are</p>    <p style=\"orphans:0;widows:0\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    this remote region often lack basic resources required</p>", " <p style=\"orphans:0;widows:0\">    this region often lack basic resources required remote</p>", " <p style=\"orphans:0;widows:0\">    this remote region often lacks basic resources required</p>", " <p style=\"orphans:0;widows:0\">    remote this region often lack required basic resources</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>this     remote region”<br> </b> • <i>Remote</i> correctly qualifies     <i>region</i> and must come before it.<br>  • Options placing     <i>remote</i> elsewhere break adjective–noun order.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>often     lacks”<br> </b> • <i>Region</i> i estyle.</p>    <p style=\"orphans:0;widows:0\"><br> <br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    Gradually</p>", " <p style=\"orphans:0;widows:0\">    Rarely</p>", " <p style=\"orphans:0;widows:0\">    Annually</p>", " <p style=\"orphans:0;widows:0\">    Immediately</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    The sentence talks about a <b>slow and progressive realization</b>    of something over time. The adverb <b>“gradually”</b>    correctly conveys this sense of steady development.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Gradually</b>     – Indicates a slow, continuous process; fits the context     perfectly      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Rarely</b>     – Refers to frequency</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Annually</b>     – Indicates time interval<br> <br> <br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Immediately</b>     – Suggests instant action</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the option that expresses the given sentence in indirect    speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The    teacher said, “I have been checking your answer sheets since    morning.”</p>    <p style=\"orphans:0;widows:0\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    The teacher said that she had been checking their answer sheets    since morning.</p>", " <p style=\"orphans:0;widows:0\">    The teacher said that she has been checking your answer sheets    since morning.</p>", " <p style=\"orphans:0;widows:0\">    The teacher said that she was checking your answer sheets since    morning.</p>", " <p style=\"orphans:0;widows:0\">    The teacher said that she had checked their answer sheets since    morning.</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     reporting verb <b>“said”</b> is in the <b>past tense</b>, so     the tense of the reported speech must shift back.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Present     perfect continuous (“have been checking”)</b> changes to <b>past     perfect continuous (“had been checking”)</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     pronoun <b>“I”</b> refers to <b>the teacher</b>, so it     becomes <b>“she”</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“<b>Your”</b>     changes to <b>“their”</b> to match the reported context.</p>     </li><li><p style=\"orphans:0;widows:0\">The time expression <b>“since     morning”</b> remains unchanged as it is still relevant.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate phrasal verb that can substitute the    underlined segment in the given sentence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The rescue    team struggled for hours to <u>locate </u>the missing hikers in    the dense forest.</p>    <p style=\"orphans:0;widows:0\"><br> <br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    Put off</p>", " <p style=\"orphans:0;widows:0\">    Come across</p>", " <p style=\"orphans:0;widows:0\">    look for </p>", " <p style=\"orphans:0;widows:0\">    give up</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     word <b>“locate”</b> means to search for or find the position     of something deliberately. The phrasal verb <b>“look for”</b>     conveys the same meaning and fits naturally in the sentence.</p>     </li><li><p style=\"orp
