 ironic</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0\">The passage     highlights <b>Eshan’s ordinary yet heroic acts</b> with     admiration: <i>“…true steadiness often resides in the     unassuming acts of ordinary individuals.”</i><br> → The tone     is <b>respectful and reflective</b>, celebrating quiet     heroism.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate synonym of the given word: Obfuscate</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    Clarify</p>", " <p style=\"orphans:0;widows:0\">    Confuse</p>", " <p style=\"orphans:0;widows:0\">    Illuminate</p>", " <p style=\"orphans:0;widows:0\">    Simplify</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Obfuscate</b> means     to make something unclear, obscure, or confusing.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Confuse</b> –     to make unclear or bewilder; closest synonym </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Clarify</b> –     to make clear </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Illuminate</b> –     to enlighten or make understandable </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Simplify</b> – to     make simpler </p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Choose the correctly spelled word.</p>", "options": ["<p style=\"orphans:0;widows:0\">    Bourgoisie</p>", " <p style=\"orphans:0;widows:0\">    Bourgeosie</p>", " <p style=\"orphans:0;widows:0\">    Bourgeousie</p>", " <p style=\"orphans:0;widows:0\">    Bourgeoisie</p>"], "correct": 4, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Bourgeoisie     (</b><span style=\"font-family:'Mangal'\"><span style=\"font-size:10pt\"><span><b>मध्यम     वर्ग</b></span></span></span><b>):</b> This refers     to the middle class, typically with reference to its perceived     materialistic values or conventional attitudes. In Marxist     theory, it refers to the class that, in contrast to the     proletariat or wage-earning class, owns the means of production.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Spelling Tip:</b> Break     it down into three parts: <b>Bourg</b> + <b>eois</b> + <b>ie</b>.     Remember the \"eo\" combination followed by \"is.\"</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Arrange the following four sentences (1, 2, 3, 4) in a logical    sequence to form a coherent paragraph:</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Modern     neurobiology suggests that memory is not a static recording but a     dynamic process that reconsolidates every time it is recalled.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">For     decades, the prevailing theory was that memories were stored like     files in a cabinet, unchanging and permanent once encoded.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">This     new understanding has profound implications for how we treat     post-traumatic stress and other memory-related disorders.</p>     </li><li><p style=\"orphans:0;widows:0\">However, recent experiments     have shown that the very act of remembering can alter the     original trace of the event in the brain.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    2-1-4-3</p>", " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", " <p style=\"orphans:0;widows:0\">    2-4-1-3</p>", " <p style=\"orphans:0;widows:0\">    4-2-1-3</p>"], "correct": 3, "marks": "1", "explanation": "Sधnपधncध 2 (Tुध Pोौप/Cयnपधसप): Tुiौ ौधnपधncध धौपोृिiौुधौ पुध ौपोनपing ूयinप—पुध \"ूनधॅोiिing पुधयनद\" यी पुध ूोौप. Iप ौधपौ पुध ौपोgध ृद कधौcनiृing थुोप ूधयूिध हौधक पय ृिधiधॅध (ंधंयनiधौ ोनध िiाध ीiिधौ). Sधnपधncध 4 (Tुध Piॅयप/Cुोििधngध): Tुध थयनक \"Hयथधॅधन\" ौignोिस ो ौुiीप. Iप inपनयकहcधौ पुध \"नधcधnप धसूधनiंधnपौ\" पुोप cुोििधngधक पुध ियक \"cोृinधप\" पुधयनद ंधnपiयnधक in Sधnपधncध 2. Sधnपधncध 1 (Tुध Mयकधनn Dधीiniपiयn): Tुiौ ौधnपधncध ौहंंोनप्रधौ पुध cहननधnप ौपोपध यी ाnयिथधकgध (\"Mयकधनn nधहनयृiिययgद ौहggधौपौ...\") ृोौधक यn पुयौध धसूधनiंधnपौ. Iप धसूिोinौ पुध \"कदnोंic ूनयcधौौ\" यी ंधंयनद. Sधnपधncध 3 (Tुध Cयncिहौiयn/Iंूिicोपiयn): Tुiौ ौधnपधncध ृधginौ थiपु \"Tुiौ nधथ हnकधनौपोnकing,\" थुicु कiनधcिपद नधीधनौ पय पुध कधीiniपiयn ूनयॅiकधक in Sधnपधncध 1."}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate antonym of the word: Exacerbate</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "options": ["<p style=\"orphans:0;widows:0\">    Aggravate</p>", " <p style=\"orphans:0;widows:0\">    Intensify</p>", " <p style=\"orphans:0;widows:0\">    Alleviate</p>", " <p style=\"orphans:0;widows:0\">    Worsen</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Exacerbate</b> –     to make a situation worse or more severe.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Alleviate</b> –     to make a problem or suffering less severe; the opposite of     exacerbate.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Other     options:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Aggravate</b> –      to worsen, similar to exacerbate.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Intensify</b> –      to make stronger, similar in effect to exacerbate.</p>      </li><li><p style=\"orphans:0;widows:0\"><b>Worsen</b> – same      meaning as exacerbate.</p>     </li></ul>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Choose the sentence in which the idiom \"hold a candle to\"    is used correctly.</p>", "options": ["<p style=\"orphans:0;widows:0\">    Although she is a brilliant lawyer, she cannot hold a candle to    her father’s legendary reputation in court.</p>", " <p style=\"orphans:0;widows:0\">    The power went out, so he had to hold a candle to the map to see    the directions clearly.</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    After the wax started dripping, the monk had to hold a candle to    the altar carefully.</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", " <p style=\"orphans:0;widows:0\">    The protesters decided to hold a candle to the city hall to show    their solidarity with the victims.</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>To     hold a candle to (</b><span style=\"font-family:'Mangal'\"><span style=\"font-size:10pt\"><span><b>किसी     की बराबरी करना</b></span></span></span><b>):</b> This     idiom is almost always used in the negative (\"cannot hold a     candle to\"). It means to be as good as or comparable to     someone or something else. If you \"cannot hold a candle\"     to someone, it means you are significantly inferior to them.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Origin:</b> Historically,     an apprentice would hold a candle for a master craftsman to see     his work. The apprentice was seen as inferior and merely a     helper.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the most appropriate option to fill in the blank<b>:</b></p>    <p style=\"orphans:0;widows:0\">Despite the government’s    efforts to boost tourism, the sector remained in a state of    __________, with visitor numbers barely improving year after year.</p>", "options": ["<p style=\"orphans:0;widows:0\">    boom</p>", " <p style=\"orphans:0;widows:0\">    stagnation</p>", " <p style=\"orphans:0;widows:0\">    expansion</p>", " <p style=\"orphans:0;widows:0\">    surge</p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     sentence describes a sector showing little or no improvement     despite efforts.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Stagnation</b> –     a period of slow or no growth, fits perfectly.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Other     options:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Boom</b> –      rapid growth, opposite of stagnation.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Expansion</b> –      growth or increase, does not fit the context.</p>      </li><li><p style=\"orphans:0;widows:0\"><b>Surge</b> –      sudden increase, also opposite of stagnation.</p>     </li></ul>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Change the following sentence into indirect speech:<br> The    manager said to the staff, “Ensure that all reports are    submitted before 5 PM, and do not forget to review the summary.”</p>", "options": ["<p style=\"orphans:0;widows:0\">    The manager instructed the staff to submit all reports before 5 PM    and reminded them not to forget reviewing the summary.</p>", " <p style=\"orphans:0;widows:0\">    The manager told the staff that all reports must be submitted    before 5 PM and advised them not to forget the summary.</p>", " <p style=\"orphans:0;widows:0\">    The manager instructed the staff to submit all reports before 5 PM    and not to forget to review the summary.</p>", " <p style=\"orphans:0;widows:0\">    The manager said to the staff that they should submit all reports    before 5 PM and review the summary.</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“Ensure     that all reports are submitted before 5 PM” →     becomes <b>instructed them to submit all reports before 5     PM</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">“Do     not forget to review the summary” → becomes <b>not to     forget to review the summary</b> (maintains polite     imperative).</p>     </li><li><p style=\"orphans:0;widows:0\">Option c correctly preserves     the commands in indirect speech without altering meaning or tone.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate meaning of the word “incongruous”:</p>", "options": ["<p style=\"orphans:0;widows:0\">    Suitable</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Harmonious</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", " <p style=\"orphans:0;widows:0\">    Inappropriate</p>", " <p style=\"orphans:0;widows:0\">    Ordinary</p>"], "correct": 3, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Incongruous</b> –     not in harmony or keeping with the surroundings; inappropriate or     out of place.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Suitable / Harmonious /     Ordinary</b> – all suggest fittingness or normalcy, which     is opposite to incongruous.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Choose the correct one-word substitution for the phrase below: </p>    <p style=\"orphans:0;widows:0\">A person who lives by begging,    especially for religious reasons.</p>", "options": ["<p style=\"orphans:0;widows:0\">    Mendicant</p>", " <p style=\"orphans:0;widows:0\">    Ascetic</p>", " <p style=\"orphans:0;widows:0\">    Philanthropist</p>", " <p style=\"orphans:0;widows:0\">    Hermit</p>"], "correct": 1, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Mendicant</b> –     a person who depends on alms (begging) for living.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Ascetic</b> –     practices self-discipline, usually for religious purposes, but     not necessarily begging.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Philanthropist</b> –     someone who gives to charity.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Hermit</b> – lives     in seclusion, not necessarily begging.</p>    </li></ul>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In each of the following questions, find out which of the answer    figures (1), (2), (3) and (4) completes the figure matrix?</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_fb0596f0dc71ba1c.jpg\" width=\"250\" height=\"188\" > </p>", "options": [" <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    a.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_8bd83766933b59ba.jpg\" width=\"144\" height=\"122\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    b.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_d04db8eeb167624.jpg\" width=\"250\" height=\"168\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    c.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_fa5fbba0b8196ddc.jpg\" width=\"150\" height=\"113\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    d.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_7db11a651a51ec27.jpg\" width=\"156\" height=\"112\" > </p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0\">    <b>Correct answer:</b> <b>(B)</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, <b>‘He is honest man’</b> is    coded as <b>‘ka la ta pa’</b>, ‘<b>honest is better’</b> is    coded as <b>‘ka la te’</b> and <b>‘handsome    man’</b> is coded as <b>‘pa ja’</b>. What will be    the code of <b>‘bette</b>r’?</p>", "options": ["<p style=\"orphans:0;widows:0\">    ka</p>", " <p style=\"orphans:0;widows:0\">    la</p>", " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    ta</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", " <p style=\"orphans:0;widows:0\">    te</p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (D) te</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">We have    given:</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">He is     honest man - <b>ka la ta pa</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">honest     is better - <b>ka la te</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">handsome     man - <b>pa ja</b></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>As we    are asked to find the code for Better, we will decode only those    words which are present in second sentence.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Common     words in sentence 1 and 2 = <b>honest</b>, <b>is</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Common     codes between sentence 1 and 2 = <b>ka, la</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Remaining     code in sentence 2 = <b>te</b></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Since <b>better</b> appears     only in sentence 2 and the extra code there is <b>te.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Therefore, Code of “better”    = te.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    <b>PT</b> is related to <b>NV</b>, <b>AM</b> is    related to <b>YO</b>. In the same way <b>DL</b> is    related to?</p>", "options": ["<p style=\"orphans:0;widows:0\">    BJ</p>", " <p style=\"orphans:0;widows:0\">    NF</p>", " <p style=\"orphans:0;widows:0\">    NB</p>", " <p style=\"orphans:0;widows:0\">    BN</p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct Answer: (D) BN</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">We have    Given:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>P     T - N V</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>A     M - Y O</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Pattern in    first letter:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>P     to N</b> (2 letters backward i.e. <b>−2</b>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>A     to Y</b> (2 letters backward, cyclic i.e. <b>-2</b>)</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Second    letter:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>T     to V</b> (2 letters forward i.e. <b>+2</b>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>M     to O</b> (2 letters forward i.e. <b>+2</b>)</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Applying    same to D L:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>D     -2= B</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>L     +2= N</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Therefore,    DL is related to BN and final answer is BN.</b></p>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Six people R, S, T, U, V and W are seating in a linear row facing    north. V sits at the end of the row and S is third to the right of    V. W is second to the right of S while R is second to the left of    S. U is not the immediate neighbour of W. <b>What is the    position of R?</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    Second from left end</p>", " <p style=\"orphans:0;widows:0\">    Third to the right of U</p>", " <p style=\"orphans:0;widows:0\">    Second from right end</p>", " <p style=\"orphans:0;widows:0\">    Third to the left of W</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (A)</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">V     sits at <b>one end</b>. If V is at the <b>right end</b>,     S cannot be third to the right of V.  So, <b>V must be     at the left end</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>W</b> is <b>second     to the right of S </b>and <b>R</b> is <b>second     to the left of S</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">U is     not the immediate neighbour of W. T will be sitting there.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Final     pattern: V  R  U  S  T  W</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A question is given, followed by two statements labelled 1 and 2.    Identify which of the statements is/are sufficient/necessary to    answer the question.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b><br> </b><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>There    are 4 tasks X, Y, Z, A to be done in a day, one after another.    Which task is done second?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b><br> </b><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">I. X is    done immediately before Z.</p>    <p style=\"orphans:0;widows:0\">II. W is done first and Y is not    last.</p>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 is sufficient</p>", " <p style=\"orphans:0;widows:0\">    Only 2 is sufficient</p>", " <p style=\"orphans:0;widows:0\">    Both together are sufficient</p>", " <p style=\"orphans:0;widows:0\">    Both are not sufficient</p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct Answer: (D) both are not sufficient.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>From     statement I alone</b>, we know X is immediately before Z but not     full order.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>From     statement 2 alone</b>, we know W is first and Y is not last, but     second could be X or Y or Z.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>By Combining both     statements </b>still leaves multiple possibilities (e.g., W,     X, Z, Y or W, Y, X, Z).</p>    </li></ul>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>How many squares are there in the given figure below?</b></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_53c77bc2fdfd18ca.jpg\" width=\"175\" height=\"144\" > </p>", "options": ["<p style=\"orphans:0;widows:0\">    51</p>", " <p style=\"orphans:0;widows:0\">    41</p>", " <p style=\"orphans:0;widows:0\">    61</p>", " <p style=\"orphans:0;widows:0\">    59</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (C) 61</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Big     square- 30</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Smaller     square- 30</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Diamond     shaped square- 1</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Total square- 61</b></p>"}, {"qid": "", "question": "Rधोक पुध giॅधn ौपोपधंधnपौ ोnक cयncिहौiयnौ cोनधीिहिद. Aौौहंing पुोप पुध inीयनंोपiयn giॅधn in पुध ौपोपधंधnप(ौ) iौ पनहध, धॅधn iी iप ोूूधोनौ पय ृध ोप ॅोनiोncध थiपु cयंंयnिद ाnयथn ीोcपौ, कधciकध थुicु यी पुध giॅधn cयncिहौiयnौ ियgicोििद ीियियथ(ौ) ीनयं पुध ौपोपधंधnप(ौ). Sपोपधंधnप: Aिि ौपोििस ोनध cोंूौ Sयंध cोंूौ ोनध पधnप Cयncिहौiयn: Sयंध ौपोििस ोनध पधnपौ. Sयंध cोंूौ ोनध ौपोिि.", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 follows</p>", " <p style=\"orphans:0;widows:0\">    Only 2 follows</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 follow</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2 follow</p>"], "correct": 2, "marks": "1", "explanation": "Cयननधcप ोnौथधन: (B) यnिद 2 ीियियथौ Cयncिहौiयn 1: Wध यnिद ाnयथ पुोप ौयंध ूोनपौ यी cोंूौ ोनध पधnपौ. Tुधनध iौ nय कiनधcप cयnnधcपiयn giॅधn ृधपथधधn ौपोििस ोnक पधnपौ. Sय, पुiौ कयधौ nयप nधcधौौोनiिद ीियियथ. Cयncिहौiयn 2: Wध ाnयथ पुोप ोिि ूोनप यी ौपोििस ोनध cोंूौ. Tुधनध iौ ौयंध ूोनप यी ौपोिि पुोप iौ यॅधिनोूूing यन ंोाing निधोपiयn थiपु cोंू. Sय, पुiौ cयncिहौiयn कधीiniपिधद ीियियथौ."}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In this question, the statement is followed by two conclusions.    Which of the two conclusion(s) is/are true?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement:</b> K&gt;L≤T=U≥V&gt;W</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Conclusion:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">K&gt;U</p>     </li><li><p style=\"orphans:0;widows:0\">U&gt;W</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 follows.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 follows</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 follow</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2 follow</p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (B) Only 2 follows</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Conclusion     1: </b>From K &gt; L and L ≤ U, we <b>cannot</b> compare     K and U directly. So, <b>this does not follow. </b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Conclusion     2: </b>U ≥ V and V &gt; W. So, <b>U &gt; W</b> is     definitely true. So, <b>this conclusion definitely     follows.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    What should come in place of question mark?</p>    <p style=\"orphans:0;widows:0\"><b>2, 4, 16, ?, 128</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    48</p>", " <p style=\"orphans:0;widows:0\">    32</p>", " <p style=\"orphans:0;widows:0\">    64</p>", " <p style=\"orphans:0;widows:0\">    128</p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>The correct answer: (B) 32</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">We have    given:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">2 ×2     = 4</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">4 ×4     = 16</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">16 ×2     =?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">? ×4     = 128</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">So, the    pattern is <b>×2, ×4, ×2, ×4 …</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>The    missing number is 32</b></p>    <ul>     <li><p style=\"orphans:0;widows:0\">16 × 2 = <b>32 </b>and <b>32</b> ×     4 = 128.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In a row of students Mohit is 15th from left and 24th from right.    Total number of students in that row?</p>", "options": ["<p style=\"orphans:0;widows:0\">    37</p>", " <p style=\"orphans:0;widows:0\">    36</p>", " <p style=\"orphans:0;widows:0\">    39</p>", " <p style=\"orphans:0;widows:0\">    38</p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>The correct answer: (D) 38</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">We have    given: </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Mohit     is <b>15th from the left</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Mohit     is <b>24th from the right</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Total students = (Left position + Right position) −1</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">15+24−1=38</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Total number of students = 38</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A question is given, followed by two statements labelled 1 and 2.    Identify which of the statements is/are sufficient/necessary to    answer the question.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>What is    the shortest distance between points X and Y?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statements:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">X is     6 m East of Z, and Y is 8 m North of Z.</p>     </li><li><p style=\"orphans:0;widows:0\">Z is 10 m West of W.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 is sufficient.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 is sufficient.</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 are sufficient.</p>", " <p style=\"orphans:0;widows:0\">    neither 1 nor 2 is sufficient.</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct Answer: (A) only 1 is sufficient</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement     1</b> gives the exact positions of <b>X</b> and <b>Y</b> with     respect to <b>Z</b>, which is enough to calculate the     distance using Pythagoras theorem.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement     2 </b>only talks about <b>W</b>, which has <b>no     role</b> in finding the distance between <b>X</b> and <b>Y</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Only Statement 1 is     required</b> <b>to give the answer.</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    You have given a statement which is true and followed by three    assumptions. You have to answer which among those assumptions    is/are implicit.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b><br> </b><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement: </b>Many    schools have decided to start awareness campaigns about cyber    safety among students.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Assumptions:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Many     students use the internet without knowing about cyber safety.</p>     </li><li><p style=\"orphans:0;widows:0\">Cyber safety can be improved     through awareness programs.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 is implicit.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 is implic rgin-bottom:0.11in\">5th     blank - <b>e</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Now write    them continuously<b>: </b>a b c<b> b </b>c d c<b> d    e </b>d<b> e </b>f</p>    <p style=\"orphans:0;widows:0\"><b>So, the missing letters are b    d e d e.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    How many meaningful words will be made from the <b>1</b><sup><b>st</b></sup><b>,    3</b><sup><b>rd</b></sup><b>, 5</b><sup><b>th</b></sup><b> and    7</b><sup><b>th</b></sup><b>  letters</b> of    word <b>‘SUPPORT’</b> using all at a time and using    them only once?</p>", "options": ["<p style=\"orphans:0;widows:0\">    Four</p>", " <p style=\"orphans:0;widows:0\">    Three</p>", " <p style=\"orphans:0;widows:0\">    Five</p>", " <p style=\"orphans:0;widows:0\">    None</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>correct answer is (A) four</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Letters     from SUPPORT:<b> S, O, P, T</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Words     that can be formed are <b>Spot, Stop, Pots and tops.</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Hence, we can make four     words.</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In this question, the statement is followed by two conclusions.    Which of the two conclusion(s) is/are true?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement:</b> Many    banks have started using biometric systems for customer    verification.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Conclusions:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Banks     are focusing on improving security in transactions.</p>     </li><li><p style=\"orphans:0;widows:0\">Customers are finding it     difficult to use passwords.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 follows.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 follows.</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 follow.</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2 follow.</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:</b> <b>(A) Only conclusion 1 follow.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">From     the statement, it is clear that banks adopting biometric systems     indicates an effort to <b>enhance security</b>.     Hence, <b>Conclusion 1 logically follows</b>.</p>     </li><li><p style=\"orphans:0;widows:0\">There is <b>no     information</b> in the statement about customers having     difficulty using passwords. That is an assumption, not a given     fact. Hence, <b>Conclusion 2 does not follow</b>.</p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Which among the following doesn't belong to the group:</p>", "options": ["<p style=\"orphans:0;widows:0\">    Virus</p>", " <p style=\"orphans:0;widows:0\">    Bacteria</p>", " <p style=\"orphans:0;widows:0\">    Ameoba</p>", " <p style=\"orphans:0;widows:0\">    Paramecium</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (A) Virus</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Amoeba</b> –     A unicellular <b>eukaryotic</b> organism</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Bacteria</b> –     A unicellular <b>prokaryotic</b> organism</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Paramecium</b> –     A unicellular <b>eukaryotic</b> organism</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Virus</b> – <b>Acellular</b> (not     made of cells) and can reproduce only inside a living host cell</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Amoeba,    bacteria, and paramecium are <b>living, single-celled    organisms</b>, whereas a <b>virus is not a true cell and is    inactive outside a host</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Therefore, virus does    not belong to the group</b>.</p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>23</b> is related to <b>190</b> following a    certain logic. Following the same logic, <b>13</b> is    related to <b>110</b>. To which of the following    is <b>19</b> related, following the same logic?</p>    <p style=\"orphans:0;widows:0\"><b>(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g. 19 – Operations on 19    such as adding /subtracting / multiplying etc. to 19</b> <b>can    be performed. Breaking down 19 into 1 and 9 and then performing    mathematical operations on 1 and 9 is not allowed.)</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    158</p>", " <p style=\"orphans:0;widows:0\">    166</p>", " <p style=\"orphans:0;widows:0\">    125</p>", " <p style=\"orphans:0;widows:0\">    151</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (A) 158</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The given    relations:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">·         (23    to 190)<br> (23 × 8 = 184,; 184 + 6 = 190)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">·         (13    to 110)<br> (13 × 8 = 104,; 104 + 6 = 110)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>So, the    rule is: (Number × 8) + 6</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Applying    the same logic to 19:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">19 × 8 =    152; 152 + 6 = 158</p>    <p style=\"orphans:0;widows:0\"><b>19 is related to 158</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    What should come in place of question mark?</p>    <p style=\"orphans:0;widows:0\"><b>42: 36 :: 92 :</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    96</p>", " <p style=\"orphans:0;widows:0\">    104</p>", " <p style=\"orphans:0;widows:0\">    121</p>", " <p style=\"orphans:0;widows:0\">    124</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:</b> <b>(C)121</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Look at    the relation between <b>42 and 36</b>:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(4 +     2 = 6); (6^2 = 36)</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">So, the    rule is:  <b>Square of the sum of the digits.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Apply the    same logic to <b>92</b>:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">(9 +     2 = 11); (11^2 = 121)</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Therefore, 42 : 36 :: 92    : 121</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    In a certain code <b>DEVICE</b> is coded    as <b>EDWHDD</b> and <b>SENDER</b> is coded    as <b>TDOEDS</b>. What is the code of <b>BUNDLE</b>?</p>", "options": ["<p style=\"orphans:0;widows:0\">    ATMEKD</p>", " <p style=\"orphans:0;widows:0\">    CVOEMF</p>", " <p style=\"orphans:0;widows:0\">    CTOEMD</p>", " <p style=\"orphans:0;widows:0\">    AVMCKF</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:</b> <b>(3) CTOEMD</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">We have    given:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>DEVICE     - EDWHDD</b><br> <br> <br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>SENDER     - TDOEDS</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Coding    Logic: The letters are changed:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> <b>consonant     + 1</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>vowel-1</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Apply    the same rule to BUNDLE:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>B     +1= C</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>U-1     = T</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>N+1=     O</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>D+1=     E</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>L+1=     M</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>E-1=     D</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Therefore, Final Code    for BUNDLE is CTOEMD.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In this question, a statement is followed by two courses of    action, numbered I and II. You must assume everything in the    statement to be true and on the basis of the information given in    the statement, decide which of the course of action/s logically    follows for pursuing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b><br> </b><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement:</b> According    to a newspaper article “Many farmers are facing crop loss    due to irregular rainfall and extreme summers”.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Course    of Action:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Government     should promote rainwater harvesting and irrigation facilities.</p>     </li><li><p style=\"orphans:0;widows:0\">Farmers should stop growing     crops that need more water.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 follows.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 follows</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 follow</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2 follow</p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:(3) both 1 and 2 follow</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Improving     irrigation and harvesting rainwater can help in summers. <b>Hence,     1 follows.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Adjusting     crops according to today’s climate can help. <b>Hence, 2     follows.</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, final answer     is both 1 and 2 follow.</b></p>    </li></ul>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A$B means A is sister of B</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">A%B means    A is father of B</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">A&amp;B    means A is daughter of B</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">A*B means    A is son of B</p>    <p style=\"orphans:0;widows:0\"><b>If H%M%R&amp;K$L*P. Then, how    is L related to M?</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    Son in law</p>", " <p style=\"orphans:0;widows:0\">    Uncle</p>", " <p style=\"orphans:0;widows:0\">    Sister in law</p>", " <p style=\"orphans:0;widows:0\">    Brother in law</p>"], "correct": 4, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (4) Brother in law</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>H     % M </b>means H is father of M</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>M     % R</b> means M is father of R</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>R     &amp; K</b> means R is daughter of K. So, K is <b>mother     of R.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>K     $ L</b> - K is sister of L. So, L is <b>brother of     K</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>L     * P</b> - L is <b>son of P</b> (confirms L is     male).</p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Final    relations are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_68530e4d66e76ef6.jpg\" width=\"244\" height=\"171\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Therefore,    L is the brother-in-law of M (wife’s brother).</b></p>    <p style=\"orphans:0;widows:0\"></p>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Select the correct mirror image of the given combination when the    mirror is placed at line MN as shown.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_4a33468bf2059c90.jpg\" width=\"250\" height=\"208\" > </p>", "options": [" <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A. </p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_af16608c35c0590b.jpg\" width=\"144\" height=\"55\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    B.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_6f15aaf0d9c9ee19.jpg\" width=\"157\" height=\"49\" > </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    C.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_f3945e6ab187002.jpg\" width=\"157\" height=\"42\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    D.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_1cd828677defefbe.jpg\" width=\"157\" height=\"37\" > </p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0\">    <b>Correct answer:</b> <b>(D)</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    You have given the statement along with four other Sentences that    can be inferred from the statement. Which of these sentences can    be inferred from the given statement?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b><br> </b><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement:</b> The    city hospital has increased the number of ICU beds this year.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Inference:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     number of serious patients has increased.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     hospital wants to attract more doctors.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">People     are becoming careless about health.</p>     </li><li><p style=\"orphans:0;widows:0\"> The hospital has more     space now.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    only 1</p>", " <p style=\"orphans:0;widows:0\">    Only 2</p>", " <p style=\"orphans:0;widows:0\">    both 3 and 4</p>", " <p style=\"orphans:0;widows:0\">    All of the above</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:</b> <b>(A) Only 1 follows.</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Inference     1:</b> This is a reasonable and likely inference.     Hospitals usually increase ICU beds when there is a rise in     critically ill patients.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Inference     2:</b> No direct connection is given between ICU beds and     attracting doctors.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Inference     3:</b> This is an assumption about public behavior, not     supported by the statement.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Inference     4:</b> Extra space is not mentioned or implied.</p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Therefore, Only Inference 1    follows.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Rahul is going to market. He starts moving towards north direction    for 15km and then move towards its right for 12km. After that he    move towards his left for 10km. At last, he moved 12km towards his    left. <b>What is the shortest distance between his home    and market?</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    15km</p>", " <p style=\"orphans:0;widows:0\">    25km</p>", " <p style=\"orphans:0;widows:0\">    35km</p>", " <p style=\"orphans:0;widows:0\">    30km</p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Initial    position:</b> Rahul is at home.</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">He     moves <b>15 km north</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Then     he turns <b>right</b> (east) and moves <b>12 km</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Then     he turns <b>left</b> (north) and moves <b>10 km</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Finally,     he turns <b>left</b> again (west) and moves <b>12     km</b>.</p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_c8dbf823dff7ac1e.jpg\" width=\"250\" height=\"257\" > </p>    <p style=\"orphans:0;widows:0\"><b>The shortest distance between    Rahul’s home and the market is 25 km.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Statement:</b> Should our government invest more in public    transport?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Arguments:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Yes,     it will reduce traffic congestion and pollution.</p>     </li><li><p style=\"orphans:0;widows:0\">No, most people prefer     private vehicles for comfort.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Argument 1 is strong.</p>", " <p style=\"orphans:0;widows:0\">    Argument 2 is strong.</p>", " <p style=\"orphans:0;widows:0\">    Both arguments are strong.</p>", " <p style=\"orphans:0;widows:0\">    Both arguments are weak.</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct Answer: (A) argument 1 is strong.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Argument     A: Strong Argumen >    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">Applying    the logic on the given option:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>B+     2= D</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>F+     6= L</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>E+5=     J</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>L+     12=Z not V</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Therefore, LV does not belong    to the group.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    A question is given, followed by two statements labelled 1 and 2.    Identify which of the statements is/are sufficient / necessary to    answer the question.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><br> <br> <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>What is    the simple interest earned on ₹5000 in 2 years?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statements:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\">The     rate of interest is 8% per annum.</p>     </li><li><p style=\"orphans:0;widows:0\">The compound interest on     ₹5000 for 2 years at the same rate is ₹816.</p>    </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">    Only 1 is sufficient.</p>", " <p style=\"orphans:0;widows:0\">    Only 2 is sufficient.</p>", " <p style=\"orphans:0;widows:0\">    Both 1 and 2 are sufficient.</p>", " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2 is sufficient.</p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer:</b> (<b>A) only 1 is sufficient.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>From     statement 1;</b> With principal, time, and rate, we can     directly find SI. <b>So, this statement is sufficient.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Statement     2</b> gives a different concept (CI), not directly     needed. <b>So, it is not sufficient.</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the final     answer is only 1 is sufficient to give the answer.</b></p>    </li></ul>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    In the following problem, a square transparent sheet with a    pattern is given. Figure out from amongst the four alternatives as    to how the pattern would appear when the transparent sheet is    folded at the dotted line.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_af568b604e03ebb3.jpg\" width=\"250\" height=\"200\" > </p>", "options": [" <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    a.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_2e78f4740cebd533.jpg\" width=\"250\" height=\"208\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    b.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_ec22d52f29af61a1.jpg\" width=\"250\" height=\"179\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    c.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_3bedddee5fa42a69.jpg\" width=\"250\" height=\"192\" > </p>", "  <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    d.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_e3be49ebcf350bfb.jpg\" width=\"250\" height=\"180\" > </p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0\">    <b>Correct answer: (C)</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    Balance the following equation by replacing * with mathematical    signs:</p>    <p style=\"orphans:0;widows:0\"><b>270 * 30 * (117 * 93) * 12 =    228</b></p>", "options": ["<p style=\"orphans:0;widows:0\">    ÷ + × −</p>", " <p style=\"orphans:0;widows:0\">    ÷ × - +</p>", " <p style=\"orphans:0;widows:0\">    × − + ÷</p>", " <p style=\"orphans:0;widows:0\">    ÷ × + −</p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">    <b>Correct answer: (B) ÷ × - +</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">To balance    the given options, we have to check each of the given    options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Option     A: (117 × 93),</b> the value will be very high. Hence, this     option is incorrect.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in\"><b>Option     B: (117 - 93) = 24</b>, this could be correct option. Let’s     solve further by replacing all signs.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0.11in\">270 ÷ 30    × 24 + 12 = 228 <b>(which balances the equation).</b></p>    <p style=\"orphans:0;widows:0\"><b>No need to check other given    options, option B is the answer.</b></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    If ‘<span style=\"font-family:'Cambria Math'\">𝒑</span>’ is <span style=\"font-family:'Cambria Math'\">𝟕𝟓</span>%    of ‘<span style=\"font-family:'Cambria Math'\">𝒒</span>’ and ‘<span style=\"font-family:'Cambria Math'\">𝒒</span>’    is <span style=\"font-family:'Cambria Math'\">𝟏𝟐𝟎</span>% of ‘<span style=\"font-family:'Cambria Math'\">𝒓</span>’,    then ‘<span style=\"font-family:'Cambria Math'\">𝒑</span>’ is what    percentage more/less than ‘<span style=\"font-family:'Cambria Math'\">𝒓</ ">𝟓</span>)</p>", " <p style=\"orphans:0;widows:0\">    (−<span style=\"font-family:'Cambria Math'\">𝟏</span>.<span style=\"font-family:'Cambria Math'\">𝟓</span>,    <span style=\"font-family:'Cambria Math'\">𝟑</span>)</p>", " <p style=\"orphans:0;widows:0\">    (<span style=\"font-family:'Cambria Math'\">𝟑</span>, −<span style=\"font-family:'Cambria Math'\">𝟏</span>.<span style=\"font-family:'Cambria Math'\">𝟓</span>)</p>", " <p style=\"orphans:0;widows:0\">    (<span style=\"font-family:'Cambria Math'\">𝟏</span>.<span style=\"font-family:'Cambria Math'\">𝟓</span>,    <span style=\"font-family:'Cambria Math'\">𝟑</span>)</p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_5e723f15c356c794.jpg\" width=\"250\" height=\"130\" > </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Find the standard deviation of {<span style=\"font-family:'Cambria Math'\">𝟏𝟏</span>,<span style=\"font-family:'Cambria Math'\">𝟕</span>,<span style=\"font-family:'Cambria Math'\">𝟏𝟎</span>,<span style=\"font-family:'Cambria Math'\">𝟏𝟑</span>,<span style=\"font-family:'Cambria Math'\">𝟗</span>}</p>", "options": ["<p style=\"orphans:0;widows:0\">    1</p>", " <p style=\"orphans:0;widows:0\">    2</p>", " <p style=\"orphans:0;widows:0\">    4</p>", " <p style=\"orphans:0;widows:0\">    5</p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_5a351a0704246a37.jpg\" width=\"250\" height=\"282\" > </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Tickets numbered 1 to 100 are mixed up and then a ticket is drawn    at random. What is the probability that the ticket drawn has a    number which is a multiple of 3 or 5?</p>", "options": ["<p style=\"orphans:0;widows:0\">    1/20</p>", " <p style=\"orphans:0;widows:0\">    9/20</p>", " <p style=\"orphans:0;widows:0\">    47/100</p>", " <p style=\"orphans:0;widows:0\">    1/4</p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_3b38fc2052b8204e.jpg\" width=\"250\" height=\"281\" > </p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    Find the number of different signals that can be generated by    arranging at least 2 flags in order (one below the other) on a    vertical staff, if five different flags are available.</p>", "options": ["<p style=\"orphans:0;widows:0\">    152</p>", " <p style=\"orphans:0;widows:0\">    26</p>", " <p style=\"orphans:0;widows:0\">    320</p>", " <p style=\"orphans:0;widows:0\">    240</p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_5ab0c6eb26b5095c.jpg\" width=\"250\" height=\"138\" > </p>"}, {"qid": "", "question": "  <p style=\"orphans:0;widows:0\">    The expression <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_c5bba2d7fab225e6.jpg\" width=\"250\" height=\"57\" >  is    equal to:</p>", "options": ["<p style=\"orphans:0;widows:0\">    √𝟑+√<span style=\"font-family:'Cambria Math'\">𝟐</span>−√<span style=\"font-family:'Cambria Math'\">𝟓</span></p>", " <p style=\"orphans:0;widows:0\">    √𝟑-√<span style=\"font-family:'Cambria Math'\">𝟐</span>−√<span style=\"font-family:'Cambria Math'\">𝟓</span></p>", " <p style=\"orphans:0;widows:0\">    √𝟑−√𝟐+√<span style=\"font-family:'Cambria Math'\">𝟓</span></p>", " <p style=\"orphans:0;widows:0\">    √2−√<span style=\"font-family:'Cambria Math'\">𝟑</span>−√<span style=\"font-family:'Cambria Math'\">𝟓</span></p>"], "correct": 1, "marks": "1", "explanation": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1767612152170_html_ca62b0cd85779efa.jpg\" width=\"250\" height=\"127\" > </p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
