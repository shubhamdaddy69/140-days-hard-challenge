y _______.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">migrated</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">sheltered</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">skilled</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">counted</span></p>"], "correct": 3, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">A country can benefit from its demographic dividend only when the working-age population has the necessary</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">skills</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">to participate productively in the economy.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Merely being migrated, sheltered, or counted does not contribute to economic growth — but being</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">skilled</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">does.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Select the option that expresses the given sentence in indirect speech.</span><br><span style=\"font-family:Calibri\">Akash said to Akshay, “I have been working on the forest restoration project for five years, and I will submit the report by next Monday.”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Akash told Akshay that he had been working on the forest restoration project for five years and would submit the report by next Monday.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Akash said to Akshay that he has worked on the forest restoration project for five years and will submit the report by next Monday.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Akash told Akshay that he is working on the forest restoration project for five years and will submit the report by next Monday.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Akash said Akshay that he had been working on the forest restoration project for five years and will submit the report by next Monday.</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The direct speech uses</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">present perfect continuous</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">(“have been working”) and future (“will submit”).</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">In indirect speech, the tenses shift: present perfect continuous → past perfect continuous, and will →</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">would</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">The reporting verb “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">told</span><span style=\"font-family:Calibri;font-size:12pt\">” is used correctly, and pronouns are adjusted to match the perspective.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Parts of the following sentence have been given as options. Select the option that contains an error.</span><br><span style=\"font-family:Calibri\">Hardly had the committee announced the new policy, when the employees started raising objections about its implementation.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Hardly had the committee announced</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">the new policy</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">when the employees started raising objections</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">about its implementation</span></p>"], "correct": 3, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Error - The conjunction “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">when</span><span style=\"font-family:Calibri;font-size:12pt\">” is incorrect here. After introductory negative adverbs like hardly, scarcely, or barely,</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">inversion is required</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">and the clause should use “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">than</span><span style=\"font-family:Calibri;font-size:12pt\">” instead of “when.”</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Negative adverbs</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">at the beginning of a sentence trigger inversion - Hardly had…, Scarcely had…, etc.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Select the most appropriate option to fill in the blank.</span><br><span style=\"font-family:Calibri\">Saurya watched as the smoke _________ steadily from the chimney.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">hung</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">rose</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">left</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">went</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The sentence describes smoke coming out of a chimney. In English, we use the verb “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">rise</span><span style=\"font-family:Calibri;font-size:12pt\">” for smoke, steam, or hot air that goes upwards.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">“</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Hung</span><span style=\"font-family:Calibri;font-size:12pt\">” implies staying in one place, “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">left</span><span style=\"font-family:Calibri;font-size:12pt\">” or “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">went</span><span style=\"font-family:Calibri;font-size:12pt\">” are incorrect because smoke doesn’t “leave” in that sense.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</span><br><span style=\"font-family:Calibri\">In a quaint village, there lived a young girl named Manya who loved gardening. Every morning, she would tend to her plants with great care. One day, she noticed that the flowers in the village park were wilting due to lack of water. Determined to help, Manya decided to ________(1) the villagers to come together for watering the plants. At first, many were reluctant, thinking it was ________(2) work, but Manya’s enthusiasm was contagious. Soon, a group of volunteers joined her efforts. Within weeks, the park was blooming again, and the villagers appreciated the change. Manya realized that with cooperation and ________(3), even small efforts could bring remarkable results. Her dedication also inspired others to take responsibility for their environment and ________(4) in community activities.</span><br><span style=\"font-family:Calibri\">Select the most appropriate word to fill in blank (1):</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">persuade</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Snub</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Chastise</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Appall</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Manya wanted the villagers to join her efforts, so “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">persuade</span><span style=\"font-family:Calibri;font-size:12pt\">” (</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">convince</span><span style=\"font-family:Calibri;font-size:12pt\">) is the most suitable word.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Snub</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">– To deliberately ignore or show disdain for someone.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Chastise</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">– To scold or reprimand severely.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Appall</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">– To shock or horrify someone, often creating fear.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</span><br><span style=\"font-family:Calibri\">In a quaint village, there lived a young girl named Manya who loved gardening. Every morning, she would tend to her plants with great care. One day, she noticed that the flowers in the village park were wilting due to lack of water. Determined to help, Manya decided to ________(1) the villagers to come together for watering the plants. At first, many were reluctant, thinking it was ________(2) work, but Manya’s enthusiasm was contagious. Soon, a group of volunteers joined her efforts. Within weeks, the park was blooming again, and the villagers appreciated the change. Manya realized that with cooperation and ________(3), even small efforts could bring remarkable results. Her dedication also inspired others to take responsibility for their environment and ________(4) in community activities.</span><br><span style=\"font-family:Calibri\">Select the most appropriate word to fill in blank (2):</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Breezy</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">tedious</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">exciting</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Rapturous</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Initially, villagers were reluctant, implying they thought the work would be boring or tiresome. “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Tedious</span><span style=\"font-family:Calibri;font-size:12pt\">” fits this context.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Breezy</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- cheerful, or effortless in manner</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Rapturous</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- Feeling or expressing great pleasure</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</span><br><span style=\"font-family:Calibri\">In a quaint village, there lived a young girl named Manya who loved gardening. Every morning, she would tend to her plants with great care. One day, she noticed that the flowers in the village park were wilting due to lack of water. Determined to help, Manya decided to ________(1) the villagers to come together for watering the plants. At first, many were reluctant, thinking it was ________(2) work, but Manya’s enthusiasm was contagious. Soon, a group of volunteers joined her efforts. Within weeks, the park was blooming again, and the villagers appreciated the change. Manya realized that with cooperation and ________(3), even small efforts could bring remarkable results. Her dedication also inspired others to take responsibility for their environment and ________(4) in community activities.</span><br><span style=\"font-family:Calibri\">Select the most appropriate word to fill in blank (3):</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">patience</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Precipitation</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Ire</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Indolence</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The passage emphasizes that sustained effort and careful work lead to results. “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Patience</span><span style=\"font-family:Calibri;font-size:12pt\">” is the right choice.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Precipitation</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- The quality of acting quickly and rashly; excessive speed</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Ire</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- Intense, often sudden, anger; wrath.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Indolence</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- Avoidance of activity or exertion; habitual laziness</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</span><br><span style=\"font-family:Calibri\">In a quaint village, there lived a young girl named Manya who loved gardening. Every morning, she would tend to her plants with great care. One day, she noticed that the flowers in the village park were wilting due to lack of water. Determined to help, Manya decided to ________(1) the villagers to come together for watering the plants. At first, many were reluctant, thinking it was ________(2) work, but Manya’s enthusiasm was contagious. Soon, a group of volunteers joined her efforts. Within weeks, the park was blooming again, and the villagers appreciated the change. Manya realized that with cooperation and ________(3), even small efforts could bring remarkable results. Her dedication also inspired others to take responsibility for their environment and ________(4) in community activities.</span><br><span style=\"font-family:Calibri\">Select the most appropriate word to fill in blank (4):</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">participate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Recede</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Contention</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Grumble</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Manya’s actions inspired others to be active in community work. “Participate” is the most appropriate word.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Recede</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- To move back or move away from a previous position</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Contention</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- Heated disagreement; an assertion maintained in argument</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Grumble</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- To express discontent or dissatisfaction in a murmuring way</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Select the most appropriate idiom to fill in the blank.</span><br><span style=\"font-family:Calibri\">Completely redesigning the ancient inventory system and launching it globally in three months is simply trying to boil the ocean.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To successfully complete a large and complex task through careful planning.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To attempt a task that is unnecessarily large, impossible, or overwhelming.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To waste time on trivial details instead of focusing on major goals.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To delay a project until the very last possible moment.</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Boil the ocean</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">= to do something that is too ambitious, unrealistic, or impossible, usually because the task is too large or overwhelming</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">In the sentence, redesigning the entire ancient inventory system and launching it globally in three months is an impractically huge task, which fits this meaning.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Read the following passage and answer the questions based on the passage.</span><br><span style=\"font-family:Calibri\">The Ministry of Commerce and Industry’s recent proposal to allow foreign direct investment (FDI) in inventory-based e-commerce, though presently restricted to export operations, underscores an urgent need to modernise and rationalise India’s retail and investment policies. Currently, India’s FDI policy permits 100% foreign investment only in the marketplace model of e-commerce, where online platforms merely act as intermediaries connecting independent buyers and sellers, while prohibiting FDI in the inventory-based model in which platforms own, manage, and sell goods directly to consumers. This restriction was originally justified as a means to protect small and traditional traders from unfair competition, deep discounting, and predatory pricing practices that large foreign-funded platforms might indulge in. However, given that India’s e-commerce sector has expanded enormously in scale, diversity, and competitiveness over the past decade, this rigid differentiation now seems outdated and counterproductive.</span><br><span style=\"font-family:Calibri\">Permitting FDI in inventory-led e-commerce could infuse much-needed capital, modern technology, and managerial expertise into critical areas such as warehousing, logistics, cold storage, packaging, and quality assurance — all of which remain weak links in India’s retail supply chain. It would enable farmers, artisans, and small and medium enterprises (SMEs) to connect more efficiently with both domestic and international consumers, ensuring fair prices, better market access, and higher income stability. For consumers, such a move would translate into improved product quality, greater variety, enhanced reliability, and better after-sales service. Additionally, FDI-driven expansion would help create large-scale employment opportunities in manufacturing, logistics, IT services, and customer support, while promoting formalisation and greater tax compliance within the retail ecosystem.</span><br><span style=\"font-family:Calibri\">At the same time, concerns of small traders and local shopkeepers deserve due consideration. These can be effectively addressed through a strong regulatory framework that enforces transparency in pricing, ensures non-discriminatory access for sellers, prevents abuse of dominant market positions, and mandates periodic audits to verify compliance. Rather than blocking investment altogether, India should trust its growing regulatory capacity and entrepreneurial maturity to balance growth with fairness.</span><br><span style=\"font-family:Calibri\">What is the main objective behind the Ministry of Commerce and Industry’s proposal to allow FDI in inventory-based e-commerce?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To modernise India’s retail sector and attract investment</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To restrict foreign participation in domestic trade</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To reduce competition among online platforms</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">To promote only small-scale traditional businesses</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The passage clearly mentions that “</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">the proposal underscores an urgent need to modernise and rationalise India’s retail and investment policies</span><span style=\"font-family:Calibri;font-size:12pt\">.” This line directly supports the idea that the main objective of allowing FDI in inventory-based e-commerce is to</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">modernise the retail sector and bring in foreign investment</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">to strengthen India’s e-commerce and retail ecosystem.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Read the following passage and answer the questions based on the passage.</span><br><span style=\"font-family:Calibri\">The Ministry of Commerce and Industry’s recent proposal to allow foreign direct investment (FDI) in inventory-based e-commerce, though presently restricted to export operations, underscores an urgent need to modernise and rationalise India’s retail and investment policies. Currently, India’s FDI policy permits 100% foreign investment only in the marketplace model of e-commerce, where online platforms merely act as intermediaries connecting independent buyers and sellers, while prohibiting FDI in the inventory-based model in which platforms own, manage, and sell goods directly to consumers. This restriction was originally justified as a means to protect small and traditional traders from unfair competition, deep discounting, and predatory pricing practices that large foreign-funded platforms might indulge in. However, given that India’s e-commerce sector has expanded enormously in scale, diversity, and competitiveness over the past decade, this rigid differentiation now seems outdated and counterproductive.</span><br><span style=\"font-family:Calibri\">Permitting FDI in inventory-led e-commerce could infuse much-needed capital, modern technology, and managerial expertise into critical areas such as warehousing, logistics, cold storage, packaging, and quality assurance — all of which remain weak links in India’s retail supply chain. It would enable farmers, artisans, and small and medium enterprises (SMEs) to connect more efficiently with both domestic and international consumers, ensuring fair prices, better market access, and higher income stability. For consumers, such a move would translate into improved product quality, greater variety, enhanced reliability, and better after-sales service. Additionally, FDI-driven expansion would help create large-scale employment opportunities in manufacturing, logistics, IT services, and customer support, while promoting formalisation and greater tax compliance within the retail ecosystem.</span><br><span style=\"font-family:Calibri\">At the same time, concerns of small traders and local shopkeepers deserve due consideration. These can be effectively addressed through a strong regulatory framework that enforces transparency in pricing, ensures non-discriminatory access for sellers, prevents abuse of dominant market positions, and mandates periodic audits to verify compliance. Rather than blocking investment altogether, India should trust its growing regulatory capacity and entrepreneurial maturity to balance growth with fairness.</span><br><span style=\"font-family:Calibri\">According to the passage, how could allowing FDI in inventory-led e-commerce benefit India’s economy?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By creating jobs, improving infrastructure, and connecting small producers to wider markets</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By limiting consumer choices and discouraging exports</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By increasing dependence on foreign goods and reducing tax compliance</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By replacing domestic retailers with international players</span></p>"], "correct": 1, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">second paragraph</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">of the passage clearly mentions that</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">FDI could bring capital, technology, jobs, and help farmers, artisans</span><span style=\"font-family:Calibri;font-size:12pt\">, and SMEs connect to domestic and global consumers.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Read the following passage and answer the questions based on the passage.</span><br><span style=\"font-family:Calibri\">The Ministry of Commerce and Industry’s recent proposal to allow foreign direct investment (FDI) in inventory-based e-commerce, though presently restricted to export operations, underscores an urgent need to modernise and rationalise India’s retail and investment policies. Currently, India’s FDI policy permits 100% foreign investment only in the marketplace model of e-commerce, where online platforms merely act as intermediaries connecting independent buyers and sellers, while prohibiting FDI in the inventory-based model in which platforms own, manage, and sell goods directly to consumers. This restriction was originally justified as a means to protect small and traditional traders from unfair competition, deep discounting, and predatory pricing practices that large foreign-funded platforms might indulge in. However, given that India’s e-commerce sector has expanded enormously in scale, diversity, and competitiveness over the past decade, this rigid differentiation now seems outdated and counterproductive.</span><br><span style=\"font-family:Calibri\">Permitting FDI in inventory-led e-commerce could infuse much-needed capital, modern technology, and managerial expertise into critical areas such as warehousing, logistics, cold storage, packaging, and quality assurance — all of which remain weak links in India’s retail supply chain. It would enable farmers, artisans, and small and medium enterprises (SMEs) to connect more efficiently with both domestic and international consumers, ensuring fair prices, better market access, and higher income stability. For consumers, such a move would translate into improved product quality, greater variety, enhanced reliability, and better after-sales service. Additionally, FDI-driven expansion would help create large-scale employment opportunities in manufacturing, logistics, IT services, and customer support, while promoting formalisation and greater tax compliance within the retail ecosystem.</span><br><span style=\"font-family:Calibri\">At the same time, concerns of small traders and local shopkeepers deserve due consideration. These can be effectively addressed through a strong regulatory framework that enforces transparency in pricing, ensures non-discriminatory access for sellers, prevents abuse of dominant market positions, and mandates periodic audits to verify compliance. Rather than blocking investment altogether, India should trust its growing regulatory capacity and entrepreneurial maturity to balance growth with fairness.</span><br><span style=\"font-family:Calibri\">How does the author suggest addressing the concerns of small traders regarding FDI in e-commerce?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By banning all forms of foreign investment in retail</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By introducing strict regulations to ensure fairness and transparency</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By allowing only marketplace models to operate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">By reducing the role of government oversight in e-commerce activities</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The author acknowledges that the concerns of small traders and local shopkeepers are genuine, but instead of blocking foreign investment, he suggests handling these concerns through a strong regulatory framework.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Reference from the 3rd paragraph</span><span style=\"font-family:Calibri;font-size:12pt\">:</span><ul><li><span style=\"font-family:Calibri;font-size:12pt\">“These can be effectively addressed through a strong regulatory framework that enforces transparency in pricing, ensures non-discriminatory access for sellers, prevents abuse of dominant market positions, and mandates periodic audits to verify compliance.”</span></li></ul></li><li><span style=\"font-family:Calibri;font-size:12pt\">This clearly indicates that the author supports introducing strict regulations to maintain fairness and protect small traders — not banning FDI or reducing oversight.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Read the following passage and answer the questions based on the passage.</span><br><span style=\"font-family:Calibri\">The Ministry of Commerce and Industry’s recent proposal to allow foreign direct investment (FDI) in inventory-based e-commerce, though presently restricted to export operations, underscores an urgent need to modernise and rationalise India’s reta mproved efficiency — while also suggesting that small traders’ concerns can be handled through regulation. The language is balanced yet encouraging, aiming to convince readers that liberalising FDI in this sector would</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">modernise and strengthen</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">India’s retail ecosystem.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Select the most appropriate synonym of the given word: Esoterica</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Common knowledge</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Secret or specialized knowledge</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Entertainment</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Simplicity</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Esoterica</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">refers to things that are understood by or meant for only a small, specialized group, often obscure or rare knowledge.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Options a, c, and d are unrelated, so the correct answer is b – Secret or specialized knowledge.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Arcana</span><span const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
