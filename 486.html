<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the word</span><span style=\"font-family:Calibri;font-weight:bold\"> </span><span style=\"font-family:Calibri;font-weight:bold\">CONSISTENCY</span><span style=\"font-family:Calibri\">, if we replace vowels with preceding letters and consonants with succeeding letters. How many letters will appear more than once.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">5</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Correct answer: (3) three</span></p><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">3</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">letters: D (3times), O (2 times), t (2 times)</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">vowels in preceding letters</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">; O-N, I- H, E- D</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">consonants in succeeding letters</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">; C-D, N-O, S-T, S-T, T-U, N-O, C-D, Y-Z</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the given series below find the number in place of question mark:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">24, 13, 15, ?, 136</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">240</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">32</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">33</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">11</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Correct answer: (3)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><a name=\"_heading_h.2kmppj3ol54c\"></a><span style=\"font-family:Calibri\">24× 0.5+ 1= 13</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">13× 1+ 2= 15</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">15× 2+ 3= 33</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">33× 4+ 4= 136</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Which letter cluster will come in place of question mark?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">UTK, TSL, SRM, RQN, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">QOP</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">ROS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">POS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">QPO</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Correct Answer: (4)</span></p><ul><li><span style=\"font-family:Calibri;font-size:12pt\">First letter- 1. For example; U-1=T, T-1=S…….</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Middle letter- 1 or subtract 1 from first letter to make middle one. For example; T-1=S, S-1=R….</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Last letter+1. For example; K+1= L, L+1=M…</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">So, R-1=Q, Q-1=P, N+1=O; QPO is the answer.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">If A$B means A&gt; B, A#B means A&lt;B, A%B means A=B, A@B means A≤B, A*B means A≥B. Then what will be the relation between W and Z according to the equation given below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">U $ V # W * X % Y $ Z</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">&lt;</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">&gt;</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">≥</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">≤</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">The correct answer is: (2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\"> </span></p><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">U&gt;V&lt;W≥X=Y&gt;Z</span></li></ul>"}, {"qid": "", "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">What should come in place of the question mark?</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1763879391177_image001.jpeg\" width=\"97\" height=\"81\" alt ></p>", "options": [" <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1763879391177_image002.jpeg\" width=\"77\" height=\"69\" alt=\"A black and white logo\n\nAI-generated content may be incorrect.\" ></p>", "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://appx-content-v2.classx.co.in/website/bulk_uploader_images/1763879391177_image003.jpeg\" width=\"74\" height=\"67\" alt=\"A black and white logo\n\nAI-generated content may be incorrect.\" ></p>", "  <p style=\"margin-top:0pt;margin-b e the feat.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Bharatiya Space Station</span><span style=\"font-family:Calibri;font-size:12pt\"> – Planned by </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">2035</span><span style=\"font-family:Calibri;font-size:12pt\">, enabled by SPADEx tech.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Which of the following is NOT included in India’s eight core sectors?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Coal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Fertilizers</span><span style=\"font-family:Calibri\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Electricity</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Chemicals</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 4, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Eight core sectors of India are industries that play a crucial role in the overall economic and industrial growth.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Collectively contribute</span><span style=\"font-family:Calibri;font-size:12pt\"> approximately </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">40.27%</span><span style=\"font-family:Calibri;font-size:12pt\"> to the Index of Industrial Production </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">(IIP).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Eight core sectors</span><span style=\"font-family:Calibri\"> are:</span><span style=\"font-family:Calibri\"> </span><br><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">1. Coal</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">2. Crude Oil</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">3. Natural Gas</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">4. Refinery Products</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">5. Fertilizers</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">6. Steel</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">7. Cement</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">8. Electricity</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">What is the decreasing order of the following contributors to the 'Greenhouse Effect'?</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">CO2 &gt; CH4 &gt; CFCs &gt; N2O</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">CH4 &gt; CO2 &gt; CFCs &gt; N2O</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">CO2 &gt; CFCs &gt; CH4 &gt; N2O</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">CO2 &gt; CH4 &gt; N2O &gt; CFCs</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 4, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">According to the WMO Greenhouse Gas Bulletin (October 2022), the relative contribution of significant long-lived greenhouse gases to global warming as follows:</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><ul><li><span style=\"font-family:Calibri;font-size:12pt\">Carbon Dioxide </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">(CO2) approximately 66%</span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li></ul><ul><li><span style=\"font-family:Calibri;font-size:12pt\">Methane (CH4) approximately 16-20%</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li></ul><ul><li><span style=\"font-family:Calibri;font-size:12pt\">Nitrous Oxide (N2O) higher than</span></li></ul><ul><li><span style=\"font-family:Calibri;font-size:12pt\">Chlorofluorocarbons (CFCs)</span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li></ul></li><li><span style=\"font-family:Calibri;font-size:12pt\">Other info-</span><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Kyoto Protocol (1997):</span><span style=\"font-family:Calibri;font-size:12pt\"> Set binding targets for 6 GHGs.</span></li></ul><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Paris Agreement (2015):</span><span style=\"font-family:Calibri;font-size:12pt\"> Limit warming to </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">below 2°C</span><span style=\"font-family:Calibri;font-size:12pt\">, aiming for </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">1.5°C</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li></ul><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Montreal Protocol (1987):</span><span style=\"font-family:Calibri;font-size:12pt\"> Controlled </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">CFCs</span><span style=\"font-family:Calibri;font-size:12pt\"> to protect ozone layer (also GHGs).</span></li></ul></li><li><span style=\"font-family:Calibri;font-size:12pt\">India aims for </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Net Zero by 2070</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Who among the following has the right of audience in all courts of India to discharge their duties?</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Advocates General </span><span style=\"width:13.57pt;font-family:Calibri;display:inline-block\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Attorney General of India</span><span style=\"font-family:Calibri\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Additional Advocates General </span><span style=\"width:32.64pt;font-family:Calibri;display:inline-block\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">None of the above</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The Attorney General is the </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">highest law officer</span><span style=\"font-family:Calibri;font-size:12pt\"> of India.</span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Appointed </span><span style=\"font-family:Calibri;font-size:12pt\">by:</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\"> President</span><span style=\"font-family:Calibri;font-size:12pt\"> under </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Article 76,</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Part</span><span style=\"font-family:Calibri;font-size:12pt\">:</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\"> V</span><span style=\"font-family:Calibri;font-size:12pt\"> (The Union Executive)</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Term:</span><span style=\"font-family:Calibri;font-size:12pt\"> holds office during the</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\"> pleasure of the President</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Eligibility:</span><span style=\"font-family:Calibri;font-size:12pt\"> Must be a person qualified to be a </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Judge of the Supreme Court</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">He has the </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">“Right of Audience”</span><span style=\"font-family:Calibri;font-size:12pt\"> in all courts including SC, HC and other. Also he has not a government servant </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">can do private practice</span><span style=\"font-family:Calibri;font-size:12pt\"> as well.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Current position: R. Venkataramani</span><span style=\"font-family:Calibri;font-size:12pt\"> (since </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">October 1, 2022</span><span style=\"font-family:Calibri;font-size:12pt\">)</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">At </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">state level</span><span style=\"font-family:Calibri;font-size:12pt\"> there is same position hold by </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Advocates General</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Attorney general of India </span><span style=\"font-family:Calibri;font-weight:bold\">Assisted by:</span></p><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Solicitor General of India</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Additional Solicitors General</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Which of the following statements is correct regarding population stabilization?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Stabilization occurs when birth rate exceeds death rate.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:1 ri;font-size:12pt;font-weight:bold\">Duration</span><span style=\"font-family:Calibri;font-size:12pt\"> of scheme</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\"> 6 years</span><span style=\"font-family:Calibri;font-size:12pt\"> from 2025-26.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Which of the following statements is correct?</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">1. Pahalgam is a town located in Anantnag district, Jammu &amp; Kashmir.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">2. It is a major tourist destination on the banks of the Lidder river and an important point for the Amarnath Yatra.</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Only 2</span><span style=\"font-family:Calibri\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Both 1 and 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">None</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 3, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">Pahalgam is a </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">town in Anantnag district</span><span style=\"font-family:Calibri;font-size:12pt\">, lo e=\"font-family:Calibri;font-size:12pt;font-weight:bold\">UT of Ladakh</span><span style=\"font-family:Calibri;font-size:12pt\"> (without legislature)</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">J&amp;K No. of Districts:</span><span style=\"font-family:Calibri;font-size:12pt\"> 20, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Capitals:</span><span style=\"font-family:Calibri;font-size:12pt\"> Srinagar (summer),</span><span style=\"font-family:Calibri;font-size:12pt;font-style:italic\"> </span><span style=\"font-family:Calibri;font-size:12pt;font-style:italic\"> </span><span style=\"font-family:Calibri;font-size:12pt\">Jammu (winter)</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">National park J&amp;K</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">: Dachigam NP famous for Hangul (Kashmir stag)</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">A person meets with an accident and needs a blood transfusion, but there is no time to test his blood group. Which of the following blood groups can be given to him?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">O+</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">O-</span><span style=\"font-family:Calibri\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">AB+</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">AB-</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">In 1900, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Karl Landsteiner</span><span style=\"font-family:Calibri;font-size:12pt\"> discovered four blood groups </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">(A, B, AB, O).</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\"> </span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Later, a </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">separate factor</span><span style=\"font-family:Calibri;font-size:12pt\"> was found in rhesus monkeys and was named </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">the Rh factor</span><span style=\"font-family:Calibri;font-size:12pt\">.</span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Since </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">O- blood group</span><span style=\"font-family:Calibri;font-size:12pt\"> does </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">not contain</span><span style=\"font-family:Calibri;font-size:12pt\"> any antigen or </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Rh factor</span><span style=\"font-family:Calibri;font-size:12pt\">, transfusing it to any person </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">does not cause clotting</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Identify the dance style recognized for its spiritual devotion and connection to the Vaishnavite movement.</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Bharatnatyam</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Kathak</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Odissi</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Sattriya</span></p>"], "correct": 4, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Sattriya</span><span style=\"font-family:Calibri;font-size:12pt\">(</span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Assam)</span><span style=\"font-family:Calibri;font-size:12pt\"> is one of India’s </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">8 classical dances</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Introduced in the </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">15th century</span><span style=\"font-family:Calibri;font-size:12pt\"> by </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Srimanta Sankardeva</span><span style=\"font-family:Calibri;font-size:12pt\">, the great </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Vaishnavite saint and reformer</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li><li><span style=\"font-family:Calibri;font-size:12pt\">Dance originated in </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Sattras</span><span style=\"font-family:Calibri;font-size:12pt\"> (monasteries) of the </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Vaishnavite movement</span><span style=\"font-family:Calibri;font-size:12pt\">, performed as an act of </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">devotion to Lord Vishnu (especially Krishna)</span><span style=\"font-family:Calibri;font-size:12pt\">.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Mnemonic</span><span style=\"font-family:Calibri;font-size:12pt\"> for </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">learn 8 classical</span><span style=\"font-family:Calibri;font-size:12pt\"> dances </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">“BKMK O MMS”</span><span style=\"font-family:Calibri;font-size:12pt\">:</span><br><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">B</span><span style=\"font-family:Calibri;font-size:12pt\">haratanatyam, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">K</span><span style=\"font-family:Calibri;font-size:12pt\">athak, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">M</span><span style=\"font-family:Calibri;font-size:12pt\">anipuri, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">K</span><span style=\"font-family:Calibri;font-size:12pt\">athakali, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">O</span><span style=\"font-family:Calibri;font-size:12pt\">dissi, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">M</span><span style=\"font-family:Calibri;font-size:12pt\">ohiniyattam, </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">M</span><span style=\"font-family:Calibri;font-size:12pt\">(for Manipuri), </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">S</span><span style=\"font-family:Calibri;font-size:12pt\">attriya.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Net National Product (NNP at market prices) is –</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Gross National Product at market prices − Net income from abroad</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Gross National Product at market prices − Transfer payments</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Gross National Product at market prices − Depreciation</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Gross National Product at market prices − Subsidies</span><span style=\"font-family:Calibri\"> </span></p>"], "correct": 3, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">NNP (Net National Product)</span><span style=\"font-family:Calibri;font-size:12pt\"> measures the total value of goods and services produced by a country’s residents </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">after accounting for depreciation</span><span style=\"font-family:Calibri;font-size:12pt\"> (wear and tear of capital assets).</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">NNP at Market Price </span><span style=\"font-family:Calibri;font-size:12pt\">= GNP at Market Price – Depreciation</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">NNP at Factor Cost </span><span style=\"font-family:Calibri;font-size:12pt\">= NNP at Market Price − (Indirect Taxes − Subsidies)</span><br><span style=\"font-family:Calibri;font-size:12pt\">→Also known as </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">National Income</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Other info:</span></p><ul><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">GDP (Gross domestic product):</span><span style=\"font-family:Calibri;font-size:12pt\"> Total value of </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">all final goods and services</span><span style=\"font-family:Calibri;font-size:12pt\"> produced </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">within a country’s borders</span><span style=\"font-family:Calibri;font-size:12pt\"> during a given year.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Example:</span><span style=\"font-family:Calibri;font-size:12pt\"> If a Japanese company produces cars in India → included in </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">India’s GDP</span><span style=\"font-family:Calibri;font-size:12pt\">, not Japan’s</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">GNP (Gross national product)</span><span style=\"font-family:Calibri;font-size:12pt\">: GNP=GDP + (Net</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">income</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">from</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">abroad)</span><span style=\"font-family:Calibri;font-size:12pt\"> </span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Example:</span><span style=\"font-family:Calibri;font-size:12pt\"> An Indian engineer working in the US contributes to </span><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">India’s GNP</span><span style=\"font-family:Calibri;font-size:12pt\">, not GDP</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:jus d by data analytics) and its immediate positive outcome (increased user engagement and loyalty).</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Sentence 3 (Contrast/Conclusion)-</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">The strong contrasting conjunction \"Conversely\" signals a shift to the downside. It introduces the main drawback—privacy and bias concerns—which are the direct result of the greater collection of user data mentioned as the fuel in 4.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Read the given passage and answer the question that follows.</span><br><span style=\"font-family:Calibri\">Smoking remains one of the most insidious public health challenges worldwide, inflicting profound and often irreversible damage on individuals and society alike. The chemical constituents of cigarettes—including nicotine, tar, carbon monoxide, and numerous carcinogens—detrimentally affect cardiovascular efficiency, compromise pulmonary function, and significantly increase susceptibility to malignancies such as lung, throat, and esophageal cancer. Chronic tobacco use also perturbs mental and emotional well-being, reinforcing dependency cycles, heightening stress, anxiety, and irritability, and diminishing overall life satisfaction. Beyond individual harm, second-hand smoke presents substantial risks to non-smokers, particularly vulnerable populations like children, pregnant women, and the elderly, exacerbating the societal burden of disease and straining public healthcare systems. The economic implications are equally severe, as smokers bear recurrent expenditure on tobacco products while incurring escalating medical costs to manage smoking-related illnesses. Moreover, smoking perpetuates intergenerational behavioral patterns, normalizing the habit among youth and creating long-term public health challenges. Given the extensive health, psychological, social, and economic repercussions, comprehensive interventions—including stringent tobacco control policies, public awareness campaigns, and accessible cessation programs—are imperative to mitigate the multifaceted dangers of smoking and promote healthier, longer, and more productive lives.</span><br><span style=\"font-family:Calibri\">Which of the following best describes the overall tone of the passage?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Humorous and light-hearted</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Cautionary and analytical</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Neutral and descriptive</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Persuasive but optimistic</span></p>"], "correct": 2, "marks": "1", "explanation": " <ul><li><span style=\"font-family:Calibri;font-size:12pt\">The passage warns readers about multiple serious consequences of smoking while analyzing its physical, psychological, and societal impacts.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Humorous and light-hearted</span><span style=\"font-family:Calibri;font-size:12pt\"> </span><span style=\"font-family:Calibri;font-size:12pt\">- When passages meant to entertain, amuse, or make the reader laugh.</span></li><li><span style=\"font-family:Calibri;font-size:12pt;font-weight:bold\">Neutral and descriptive</span><span style=\"font-family:Calibri;font-size:12pt\">- Passages that simply describe facts, processes, or events without giving opinions or advice.</span></li><li><span style=\"font-f
