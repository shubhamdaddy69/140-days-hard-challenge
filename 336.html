<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 18 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>

    <button class="start-btn" onclick="startTest()">Start Test</button>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">

        <div class="q-header">

          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

ance to the respiratory tract.<br> C. For inhalation it     has two cavities, separated from one another by a wall     of cartilage called the septum. <br> D. Apart from     filtering the air, it also cleans itself of foreign debris     extracted from inhalations.</span></p>", "options": [" <p>     BADC</p>", " <p>     DBCA</p>", " <p>     ACDB</p>", " <p>     BACD</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct order to form a meaningful and coherent paragraph is: A)     BADC.</span></span></p>     <ol>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Sentence      B:</b></span><span>      This sentence introduces the topic of the paragraph by      describing the nose as the prominent structure serving as the      entrance to the respiratory tract.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Sentence      A:</b></span><span>      Following the introduction, this sentence provides the first set      of functions of the nose, which include providing air for      respiration, serving the sense of smell, and conditioning the      air through filtering, warming, and moistening.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Sentence      D:</b></span><span>      This sentence explains another important function of the nose,      which is cleaning itself by filtering out foreign debris from      the inhaled air.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Sentence      C:</b></span><span>      The paragraph concludes by elaborating on the structure of the      nose, mentioning its two cavities for inhalation separated by      the septum, a cartilaginous wall.</span></span></p>     </li></ol>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct arrangement is: BADC: </span><i><b>The     nose is the prominent structure between the eyes that     serves as the entrance to the respiratory tract. Firstly, it     provides air for respiration, serves the sense of smell     and conditions the air by filtering, warming and moistening it.     Apart from filtering the air, it also cleans itself of foreign     debris extracted from inhalations. For inhalation it has two     cavities, separated from one another by a wall     of cartilage called the septum.</b></i></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in reported speech. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Rohit     said, “My mentor is planning to build a huge house in Andaman”</span></p>", "options": [" <p>     Rohit said that     his mentor planned to build a huge house in Andaman.</p>", " <p>     Rohit said that     his mentor is planning to build a huge house in Andaman.</p>", " <p>     Rohit said that     his mentor’s plan is to build a huge house in Andaman.</p>", " <p>     Rohit said that     his mentor was planning to build a huge house in Andaman.</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Option D. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct indirect form of the given sentence is: <i><b>Rohit     said that his mentor was planning to build a huge house in     Andaman.</b></i></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Rule:</b><b>     </b><span><b>If     the reporting verb is in Past Tense then: </b></span><span> </span></span></p>     <table>      <col>       <col>       <tr>       <td><p>        <span style=\"display:inline-block;bord      a <i>transition     point from one space to another, just like a threshold does</i>.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>exit</b>     - An \"exit\" is the opposite of an entrance, as it is a     way to leave a place, not enter it.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>stairs</b>     - \"Stairs\" are a set of steps used to ascend or descend     between different levels, which is not the same as a \"threshold.\"</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>window</b>     - A \"window\" is an opening in a wall that allows light     and air to come in, but it is not related to an entrance or     starting point like a \"threshold.\"</span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     novel's intricate plot twists and __________ characters kept the     readers engaged until the very end.</span></p>", "options": [" <p>     mundane</p>", " <p>     enigmatic</p>", " <p>     predicatable</p>", " <p>     conventional      </p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     most appropriate word to fill in the blank is ‘enigmatic’. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>b)     enigmatic:</b>     This option means \"mysterious\" or \"difficult to     understand.\" Given the context of the sentence, where the     plot twists and characters are mentioned, \"enigmatic\"     fits well. It implies that the characters were intriguing and     kept the readers guessing, making it a the door</b></u></i><i>     someone peeped through the window.</i></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in indirect     speech.<br> “Please allow me to leave now,” Ritika said to     her teacher.</span></p>", "options": [" <p>     Ritika     requested her teacher to allow her to leave then.</p>", " <p>     Ritika     requested her teacher to allow me to leave now.</p>", " <p>     Ritika     requested my teacher to allow her to leave now.</p>", " <p>     Ritika     requested her teacher to allow me to leave then.</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     option that expresses the given sentence in indirect speech is:     Ritika requested her teacher to allow her to leave then. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">If     there is a sense of Request, we change Reporting Verb [Said To]     into Requested. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Changes     in Place and Time</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">             <span><b>Direct     Speech ----          Indirect Speech</b></span></span></p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Now                                    Then</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Here                                    There</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Today                                    That day</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Tomorrow                          The next day</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Last      week              The previous week</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>This                                 That</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Tonight                                 That night</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Ago                                  Before</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Thus                                  So</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Hither                                 Thither</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Come                                Go</b></span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Hence                                Thence</b></span></span></p>     </li></ul>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in reported speech.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Virat     said, “Hurray! We have won this match.” </span>     </p>", "options": [" <p>     Virat exclaimed with joy that they had won that match.</p>", " <p>     Virat exclaimed     with sorrow that they had won that match.</p>", " <p>     Virat exclaimed     with joy that they had won this match.</p>", " <p>     Virat exclaimed     with joy that we had won that match.</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct reported speech of the given sentence is: <i><b>Virat     exclaimed with joy that they had won that match.</b></i></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">EXCLAMATORY     SENTENCES: </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Rules:     </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">1.     Said + Hurray ----------------- exclaimed with joy.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">2.     Conjunction ‘that’ will replace comma and inverted commas. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">3.     Tense and pronoun change according to rules. </span>     </p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the INCORRECTLY spelt word.</span></p>", "options": [" <p>     Partner</p>", " <p>     Digonal</p>", " <p>     Tenure</p>", " <p>     Oblique</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><i><b>Diagonal</b></i><i>     </i><i><b>is     incorrectly spelt in option b.</b></i><i>       </i></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Partner</b>:     an associate in an activity or endeavor or sphere of common     interest. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Diagonal</b>:     connecting two nonadjacent corners of a plane figure or any two     corners of a solid that are not in the same face. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Tenure</b>:     the term during which some position is held. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Oblique</b>:     If something is <i>oblique</i>,     it has a slanting position or direction.</span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>In     the following passage, some words have been deleted. Read the     passage carefully and select the most appropriate option to fill     in each blank.</b></span></p>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Pollution     is destroying nature. The smoke that is (1) ______ from the     chimneys of the factories, and from vehicles is the mixture of     poisonous gases. Due to environmental pollution, there is (2)     ______ in nature, so, many birds, animals, and plants are on the     verge of (3) ______ day by day. The only way to eradicate     environmental pollution is to plant many trees. By planting     trees, we can get rid of many harmful poisonous gases. It is the     responsibility of everyone to (4) ______ and protect our     environment. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option for blank 1.</span></p>", "options": [" <p>     generated</p>", " <p>     emitted</p>", " <p>     created</p>", " <p>     absorbed</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     most appropriate option for blank 1 is: B) emitted. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Option     (B) \"emitted\":</b>     In the context of the passage, the sentence is discussing the     smoke that comes out of chimneys and vehicles. This smoke     contains poisonous gases. The word that fits in the blank is     \"emitted,\" which means released or discharged. It     accurately conveys the idea that smoke, which contains poisonous     gases, is released from chimneys and vehicles.</span></p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>(A)      </span><span><b>generated</b></span><span>      - While pollution might be generated in the sense of being      produced, the specific focus of the sentence is on the smoke      being released or coming out.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>(C)      </span><span><b>created</b></span><span>      - \"Created\" doesn't capture the idea of smoke being      released; it implies more of a deliberate act of making      something.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>(D)      </span><span><b>absorbed</b></span><span>      - \"Absorbed\" means taken in or soaked up, which is the      opposite of what the sentence is conveying. The smoke is being      released, not absorbed.</span></span></p>     </li></ul>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>In     the following passage, some words have been deleted. Read the     passage carefully and select the most appropriate option to fill     in each blank.</b></span></p>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Pollution     is destroying nature. The smoke that is (1) ______ from the     chimneys of the factories, and from vehicles is the mixture of     poisonous gases. Due to environmental pollution, there is (2)     ______ in nature, so, many birds, animals, and plants are on the     verge of (3) ______ day by day. The only way to eradicate     environmental pollution is to plant many trees. By planting     trees, we can get rid of many harmful poisonous gases. It is the     responsibility of everyone to (4) ______ and protect our     environment. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option for blank 2.</span></p>", "options": [" <p>     a balance</p>", " <p>     a difference</p>", " <p>     an imbalance</p>", " <p>     an inequality</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is ‘an imbalance’.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is about environmental pollution. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     most appropriate word to fill in the blank is ‘an imbalance’.       </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">\"Imbalance\"     refers to a lack of balance or an uneven distribution. In this     passage, the context is about the negative effects of pollution     on nature, which results in an uneven and harmful situation. </span>     </p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>(A)      a balance - While it's true that pollution disrupts the natural      balance, the context of the passage is about the disruption      itself rather than restoring balance.</span></span></p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\"><span>(B)      a difference - \"Difference\" doesn't accurately convey      the concept of the negative effects of pollution and the      consequences mentioned in the passage.</span></span></p>      </li><li><p>      <span style=\"display:inline-blo pan>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Destroy</b>:     do away with, cause the destruction or undoing of.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Neglect</b>:     leave undone or leave out. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Ruin</b>:     an irrecoverable state of devastation and destruction.  </span>     </p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Read     the given passage and answer the questions that follow.</b></span></p>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Growth     of rural economy depends primarily on infusion of capital, from     time to time, to realise higher productivity in agriculture and     non-agriculture sectors. As the time gestation between crop     sowing and realisation of income after production is quite long,     farmers borrow from various sources to meet their initial     investment on seeds, fertilisers, implements and other family     expenses of marriage, death, religious ceremonies etc. At the     time of independence, moneylenders and traders exploited small     and marginal farmers and landless labourers by lending to them on     high interest rates and by manipulating the accounts to keep them     in a debt-trap. A major change occurred after 1969 when India     adopted social banking and multiagency approach to adequately     meet the needs of rural credit. Later, the National Bank for     Agriculture and Rural Development (NABARD) was set up in 1982 as     an apex body to coordinate the activities of all institutions     involved in the rural financing system. The Green Revolution was     a harbinger of major changes in the credit system as it led to     the diversification of the portfolio of rural credit towards     production-oriented lending. Th span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is option C</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     Green Revolution was a period of increased agricultural     productivity that occurred in the mid-20th century, primarily     through the adoption of high-yield crop varieties, modern     agricultural techniques, and increased use of fertilizers and     irrigation. This revolution led to significant changes in farming     practices and agricultural output. In the context of the rural     credit system, the Green Revolution brought about a     transformation by shifting the focus of credit from traditional     methods to production-oriented lending.</span></p>"}, {"qid": "", "question": "Rधोक पुध giॅधn ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ पुोप ीियियथ. Gनयथपु यी नहनोि धcयnयंद कधूधnकौ ूनiंोनiिद यn inीहौiयn यी cोूiपोि, ीनयं पiंध पय पiंध, पय नधोिiौध ुigुधन ूनयकहcपiॅiपद in ोgनicिहपहनध ोnक nयn-ोgनicिहपहनध ौधcपयनौ. Aौ पुध पiंध gधौपोपiयn ृधपथधधn cनयू ौयथing ोnक नधोिiौोपiयn यी incयंध ोीपधन ूनयकहcपiयn iौ तहiपध ियng, ीोनंधनौ ृयननयथ ीनयं ॅोनiयहौ ौयहनcधौ पय ंधधप पुधiन iniपiोि inॅधौपंधnप यn ौधधकौ, ीधनपiिiौधनौ, iंूिधंधnपौ ोnक यपुधन ीोंiिद धसूधnौधौ यी ंोननiोgध, कधोपु, निधigiयहौ cधनधंयniधौ धपc. Aप पुध पiंध यी inकधूधnकधncध, ंयnधिदधnकधनौ ोnक पनोकधनौ धसूियiपधक ौंोिि ोnक ंोनginोि ीोनंधनौ ोnक िोnिकधौौ िोृयहनधनौ ृद िधnकing पय पुधं यn ुigु inपधनधौप नोपधौ ोnक ृद ंोniूिहोपing पुध ोccयहnपौ पय ाधधू पुधं in ो कधृप-पनोू. A ंोुयन cुोngध यccहननधक ोीपधन 1969 थुधn Inकiो ोकयूपधक ौयciोि ृोnाing ोnक ंिहपiोgधncद ोूूनयोcु पय ोकधतहोपिधद ंधधप पुध nधधकौ यी नहनोि cनधकiप. Lोपधन, पुध Nोपiयnोि Bोnा ीयन Agनicिहपहनध ोnक Rहनोि Dधॅिधयूंधnप (NABARD) थोौ ौधप हू in 1982 ोौ ोn ोूधस ृयकद पय cययनकinोपध पुध ोcपiॅiपiधौ यी ोिि inौपiपहपiयnौ inॅियॅधक in पुध नहनोि ीinोncing ौदौपधं. Tुध Gनधधn Rधॅियहपiयn थोौ ो ुोनृingधन यी ंोुयन cुोngधौ in पुध cनधकiप ौदौपधं ोौ iप िधक पय पुध कiॅधनौiीicोपiयn यी पुध ूयनपीियiय यी नहनोि cनधकiप पयथोनकौ ूनयकहcपiयn-यनiधnपधक ns": ["<p>Principle of natural justice</p>", "<p>Principle of sovereignty</p>", "<p>Principle of Separability</p>", "<p>Principle of pseudoscience</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The expression mentioned in Article 13 of the Constitution of India, <strong>&quot;to the extent of inconsistency or contravention,&quot;</strong> refers to the <strong>principle of separability. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This principle allows a court to declare a law or provision void only to the extent that it is inconsistent with or contravenes the Constitution. In other words, if a part of a law violates the Constitution, only that specific part will be considered void while the rest of the law remains valid. This principle helps preserve as much of the legislation as possible while removing the unconstitutional elements.</span></span></p>"}, {"qid": "", "question": "<p>At which site of the Indus Valley Civilization was a large granary found?</p>", "options": ["<p>Kalibanga site</p>", "<p>Lothal site</p>", "<p>Banawali site</p>", "<p>Mohenjodaro site</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option D is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The large granary found in the Indus Valley Civilization was at the Mohenjodaro site.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mohenjodaro was one of the major cities of the ancient Indus Valley Civilization, located in present-day Sindh, Pakistan. It was a significant urban center with a od for the plant.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(C) <strong>Root</strong> <strong>- Absorbs water from the soil:</strong> This is a correct match. Roots are responsible for anchoring the plant in the soil and absorbing water and nutrients from the soil. The absorbed water is transported from the roots to other parts of the plant for various physiological processes.</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">(D) <strong>Fruit - Protects seeds:</strong> This is a correct match. Fruits develop from the ovary of a flower after fertilization. They often protect the seeds within by providing a protective covering. Fruits also play a role in seed dispersal, aiding the seeds in being transported away from the parent plant. </span></span></p>"}, {"qid": "", "question": "<p>Select the correct combination of folk music and its respective state / union territory.</p>", "options": ["<p>Sohar &ndash; Puducherry</p>", "<p>Chakri &ndash; Jammu &amp; Kashmir</p>", "<p>Sorathi &ndash; Kerala</p>", "<p>Thumri &ndash; Meghalaya</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer.  </span></span></p>\r\n\r\n<table border=\"1\" style=\"width:529px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Folk Music</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:95px\">\r\n\t on": "<p>Which of the following pairs of &#39;soil &ndash; characteristics&#39; is correct?<br />\r\nI. Sandy &ndash; proportion of fine particles is relatively higher<br />\r\nII. Clayey &ndash; greater proportion of big particles</p>", "options": ["<p>Neither I nor II</p>", "<p>Both I and II</p>", "<p>Only II</p>", "<p>Only I</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is (A) Neither I nor II. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Explanation</strong>: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">I. Sandy soil is characterized by a relatively higher proportion of large particles, not fine particles. It has a coarse texture and drains water quickly due to the larger spaces between particles.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">II. Clayey soil is characterized by a greater proportion of small particles, not big particles. It has a fine texture and retains water due to the small spaces between particles.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following Airport become 1st airport in India to be run entirely on hydro and solar energy?</p>", "options": ["<p>Indira Gandhi International Airport, Delhi</p>", "<p>Dabolim Airport, Goa</p>", "<p>Chhatrapati Shivaji Maharaj International Airport, Mumbai</p>", "<p>Chennai International Airport, Tamil Nadu</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option A <strong>Indira Gandhi International Airport, Delhi</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Delhi Airport or Indira Gandhi International Airport</strong> has become the <strong>first airport in the country</strong> to run entirely on <strong>hydro and solar power</strong> from this month in a major step toward achieving the ambitious goal of becoming a <strong>Net Zero Carbon Emission Airport by 2030.</strong></span></span></p>"}, {"qid": "", "question": "<p>Which of the following is correct regarding the Private Income?</p>", "options": ["<p>Private Income = Factor income from net domestic product accruing to the private sector &ndash; National debt interest + Net factor income from abroad + Current transfers from government + Other net transfers from the rest of the world</p>", "<p>Private Income = Factor income from net domestic product accruing to the private sector + National debt interest + Net factor income from abroad + Current transfers from government + Other net transfers from the rest of the world</p>", "<p>Private Income = Factor income from net domestic product accruing to the private sector + National debt interest + Net factor income from abroad &ndash; Current transfers from government + Other net transfers from the rest of the world</p>", "<p>Private Income = Factor income from net domestic product accruing to the private sector + National debt interest &ndash; Net factor income from abroad + Current transfers from government + Other net transfers from the rest of the world</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Private Income = Factor income from net domestic product accruing to the private sector + National debt interest + Net factor income from abroad + Current transfers from government + Other net transfers from the rest of the world. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Priv  that joins two larger pieces of land.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Hence Neither statement I not Statement II is correct.  </span></span></p>"}, {"qid": "", "question": "<p>Which of the following statements is correct?</p>", "options": ["<p>Non-metals react with oxygen to produce non- metallic oxides which are basic in nature.</p>", "<p>On burning, metals react with oxygen to produce metal oxides which are acidic in nature.</p>", "<p>Metals react with acids and produce metal salts and hydrogen gas.</p>", "Lधौौ नधोcपiॅध ंधपोिस कiौूिोcध ंयनध नधोcपiॅध ंधपोिस ीनयं पुधiन cयंूयहnकौ in ोतहधयहौ ौियहपiयnौ."], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(C) Metals react with acids and produce metal salts and hydrogen gas: This statement is correct. Metals react with acids to produce metal salts and hydrogen gas. For instance, when zinc reacts with hydrochloric acid, it produces zinc chloride (a metal salt) and hydrogen gas: <strong>Zn + 2HCl &rarr; ZnCl2 + H2</strong>.</span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">When an acid reacts with metal, salt and hydrogen are produced: </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Acid + metal --- Salt + Hydrogen. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Example: Nitric Acid + Calcium ---- Nitrate + Hydrogen.   </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The salt that is produced depends upon which acid and which metal react. </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following statements is correct regarding the demand curve?<br />\r\nI. It is a graphical representation of the relationship between price and quantity demanded.<br />\r\nII. It gives the quantity demanded by the consumer at each price.</p>", "options": ["<p>Both I and II</p>", "<p>Only II</p>", "<p>Neither I nor II</p>", "<p>Only I</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option A is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">I. <strong>&quot;It is a graphical representation of the relationship between price and quantity demanded.&quot;</strong> This statement is correct. The demand curve is a graphical representation that shows the relationship between the price of a product and the quantity of that product that consumers are willing and able to purchase at various price levels. It typically slopes downward to reflect the law of demand, which states that as the price of a product decreases, the quantity demanded increases, and vice versa.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">II<strong>. &quot;It gives the quantity demanded by the consumer at each price.&quot;</strong> This statement is also correct. The demand curve visually displays the quantity of a product that consumers are willing to buy at different price points. Each point on the demand curve represents a specific price-quantity combination, indicating the quantity that consumers are willing to purchase at that particular price.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Both statements I and II accurately describe the nature and purpose of the demand curve, so the correct answer is option [a] &ndash; Both I and II.</span></span></p>"}, {"qid": "", "question": "<p>Article 26 of the Indian constitution is related with which of the following?</p>", "options": ["<p>Freedom to manage religious affairs</p>", "<p>Non-payment of religious taxes</p>", "<p>Freedom as to payment of taxes for promotion of any particular religion</p>", "<p>Protection of interests of minorities</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><span style=\"font-family:&quot;Segoe UI&quot;,sans-serif\">Option A is the correct answer. </span></span></span></p>\r\n\r\n<table border=\"1\" style=\"width:529px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:129px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Option</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:394px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Explanation</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:129px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(A) Freedom to manage religious affairs</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:394px\">\r\n\t\t\t<p><span style=\"font-si erif\">Not related to Article 26. Article 27 addresses taxes and their appropriation for religious purposes, stating that no one can be compelled to pay taxes for promoting a specific religion.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:129px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(D) Protection of interests of minorities</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:394px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Not related to Article 26. Article 29 and 30 deal with the rights of minorities to establish and administer educational institutions of their choice, safeguarding their interests.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "Wुicु ciपप्रधn यी पुध Rधूहृिic यी Inकiो थोौ ोथोनकधक पुध Nयृिध Pधोcध Pनप्रध in पुध दधोन 2014?", "options": ["<p>C. V. Raman</p>", "<p>Kailash Satyarthi</p>", "<p>Rabindranath Tagore</p>", "<p>Amartya Sen</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">In the year 2014, Kailash Satyarthi, an Indian social reformer and child rights activist, was awarded the Nobel Peace Prize for his significant efforts to combat child labor and child exploitation. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He shared the Nobel Peace Prize with Malala Yousafzai, a Pakistani education activist. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This recognition highlighted their relentless commitment to the rights of children and their struggle against the suppression of children and young people.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Kailash Satyarthi founded the Bachpan Bachao Andolan (Save Childhood Movement) in India, which works towards the eradication of child labor and the promotion of education for all children. </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following pairs of &quot;Himalayas &ndash; feature&quot; is correct?<br />\r\nI. Kumaon Himalayas &ndash; lying between Satluj and Kali rivers<br />\r\nII. Nepal Himalayas &ndash; lying between Teesta and Dihang rivers</p>", "options": ["<p>Both I and II</p>", "<p>Only I</p>", "<p>Neither I nor II</p>", "<p>Only II</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option b is the correct answer.     </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Only I statement is correct. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The part of the Himalayas lying between Satluj and Kali rivers is known as Kumaon Himalayas.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Nepal Himalayas lies between the <strong>Kali and Teesta rivers</strong>. Nepal Himalayas, the highest segment of the Himalayan Mountain ranges in south-central Asia, extends 500 miles (800 kilometers) east from the Kali River to the Tista River.</span></span></p>"}, {"qid": "", "question": "<p>Why can you not see objects in a dim lit room when you come from a brightly lit room?</p>", "options": ["<p>The cornea contracts the pupil to allow less light to enter the eye.</p>", "<p>The iris contracts the pupil to allow less light to enter the eye.</p>", "<p>The iris dilates the eye lens to allow less light to enter the eye.</p>", "<p>The vitreous humour dilates the pupil to allow less light to enter the eye.</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is <strong>(B) The iris contracts the pupil to allow less light to enter the eye. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">In a dimly lit room, there is less available light compared to a brightly lit room. To adjust to the lower light conditions and prevent an overwhelming amount of light from entering the eye, the iris contracts the pupil. The iris is the colored part of the eye, and it controls the size of the pupil. When the iris contracts, the pupil becomes smaller, allowing less light to enter the eye.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">By reducing the amount of incoming light, the eye can better adapt to the lower light levels in the dimly lit room. This process helps improve vision in low-light environments and prevents the eyes from being overwhelmed by excessive light.</span></span></p>"}, {"qid": "", "question": "<p>Which Chinese traveller visited India during the reign of Harshavardhana?</p>", "options": ["<p>Faxian</p>", "<p>Hsuan Tsang</p>", "<p>Ibn Battuta</p>", "<p>Etsing<br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is (B) Hsuan Tsang. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Hsuan Tsang, also known ween M and P. N lives on an odd numbered floor immediately above Q. </span></p><p><span>(II) O lives on an even numbered floor immediately below M. Only one person lives between O and Q. N lives on topmost floor.</span></p>", "options": ["<span> Data in either statement I alone or statement II alone is sufficient to answer the question</span>", "<span> Data in statements I and II together is sufficient to answer the question</span>", "<span> Data in statement II alone is sufficient to answer the question while data in statement I is not</span>", "<span> Data in statement I alone is sufficient to answer the question while data in statement II is not</span>"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image045.png\" width=\"434\" height=\"309\" alt=\"\"></p>"}, {"qid": "", "question": " <span> ‘P </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image009.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> Q’ means ‘P is the sister of Q’.</span><p><span>‘P @ Q’ means ‘P is the wife of Q’.</span></p><p><span>‘P $ Q’ means ‘P is the son of Q’.</span></p><p><span>‘P % Q’ means ‘P is the mother of Q’.</span></p><p><span>What is the relation between ‘J and A’ in the expression ‘A @ F $ M % J + T ?</span></p>", "options": ["<span> J is the mother-in-law of A</span>", "<span> A is the aunt of J</span>", "<span> J is the sister-in-law of A</span>", "<span> A is the husband of J</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image046.png\" width=\"274\" height=\"286\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Seven people, A, B, C, D, E, F and G are sitting in a straight row, facing north. A sits second from the left. Only two people sit between A and C. Only three peopl ": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>In the given statement “The fare – paying capacity of people who travel on routes connecting to small towns is very low. Most successful airlines which operate in such regions have a large number of seats”.</span></p><p><span>From the given statement we can conclude only inference II, which is “Regional airlines have to change low fares in order to be profitable”.</span></p><p><span>Hence, only II follows.</span></p>"}, {"qid": "", "question": " <span> In the following series, select the wrong figure from the given series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image049.jpeg\" width=\"244\" height=\"53\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image050.jpeg\" width=\"50\" height=\"48\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image051.jpeg\" width=\"49\" height=\"49\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image052.jpeg\" width=\"49\" height=\"47\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image053.jpeg\" width=\"48\" height=\"51\" alt=\"\">"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span>"}, {"qid": "", "question": " <span> Select the correct combination of mathematical signs to sequentially replace the * signs and balance the given equation.</span><p><span>56 * 63 * 15 * 21 * 27 = 74</span></p>", "options": ["<span> ×</span><span>  </span><span>−</span><span>  </span><span>÷</span><span>  </span><span>+</span>", "<span> ÷</span><span>  </span><span>×</span><span>  </span><span>−</span><span>  </span><span>+</span>", "<span> +</span><span>  </span><span>×</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span></span><span>  </span><span>+</span><span>  </span><span>− ÷</span><span>  </span><span>×</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image054.png\" width=\"386\" height=\"347\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, a statement is followed by two courses of action, numbered I and II. You must assume everything in the statement to be true and on the basis of the information given in the statement, decide which course of action/s logically follows for pursuing.</span><p><span>Statement: Many people have encroached into the government property and built their houses and business establishments.</span></p><p><span>Course of action:</span></p><p><span>I. The government should take immediate steps to remove all unauthorised constructions on government land.</span></p><p><span>II. All the encroachers should immediately be put behind bars and also be slapped with a hefty fine.</span></p>", "options": ["<span> Only II follows</span>", "<span> Both I and II follow</span>", "<span> Neither I nor II follows</span>", "<span> Only I follows</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>In the given statement ‘Many people have encroached into the government property and built their houses and business establishments’. According to the given statement Only course of action I is suitable to follow because the government should check all unauthorised construction on government land. II course of action is too harsh to be suitable.</span></p><p><span>Hence, Only I course of action the given statement.</span></p>"}, {"qid": "", "question": "\r\n<p>Two figures given on the left side of (: :) are related with some logic/ rule/ relation. Select the missing figure on the right of (: :) from the given alternatives based on the same logic/rule/relation.</p>\r\n\r\n<p><img alt=\"\" src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image055.jpeg\" style=\"height:49px; width:280px\" /></p>", "options": ["\r\n<p><img alt=\"\" src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image056.jpeg\" style=\"height:50px; width:50px\" /></p>", "\r\n<p><img alt=\"\" src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image057.jpeg\" style=\"height:50px; width:50px\" /></p>", "\r\n<p><img alt=\"\" src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image058.jpeg\" style=\"height:50px; width:50px\" /></p>", "\r\n<p><img alt=\"\" src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image059.jpeg\" style=\"height:50px; width:50px\" /></p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p>The correct answer is d.</p>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>0.5, 0.55, 0.65, 0.8, ?</span></p>", "options": ["<span> 0.85</span>", "<span> 1</span>", "<span> 0.9</span>", "<span> 0.95</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532737343_image060.png\" width=\"441\" height=\"310\" alt=\"\"></p>"}, {"qid": "", "question": "\r\n<p>In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct answer.</p>\r\n\r\n<p>I. The university authority has decided to conduct all terminal examinations in March/April every year to enable them to declare results in time.</p>\r\n\r\n<p>II. There has been considerable delay in declaring results in the past due to shortage of teachers evaluating the answer sheets of the examination conducted by the university.</p>", "options": ["\r\n<p>I is the cause and II is its possible effect.</p>", "\r\n<p>Both I and II are independent causes.</p>", "\r\n<p>Both I and II are effects of independent causes.</p>", "\r\n<p>II is the cause and I is its possible effect.</p>"], "correct": 3, "marks": "1", "explanation": "\r\n<p>The correct answer is C.</p>\r\n\r\n<p>Clearly, each statement is self-sufficient in itself and stands independent of the other. Thus, I and II are independent causes.</p>\r\n\r\n<p>Hence, both I and II are effects of independent causes.</p>\r\n\r\n<p> </p>\r\n\r\n<p> </p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
