 is a folk dance of which of the following states of India?</p>", "options": ["<p>Karnataka</p>", "<p>Odisha</p>", "<p>Punjab</p>", "<p>Kerala</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: B) Odisha</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Dalkhai</strong> is a popular folk dance of the Indian state of Odisha. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is a religion based traditional folk dance linked to the agrarian culture of society.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dalkhai is said to be &ldquo;the Goddess of Fertility&rdquo; worshipped by the native like Mirdhas, Kondhs, Kuda, Gonds, Binjhals etc. Basically, it is group dance accompanied with a song which adores &lsquo;Goddess Dalkhai Devi &ndash; a physical manifestation of Goddess Durga.&rsquo;  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Important facts about Odisha: </span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>National Parks</strong></span></span></p>\r\n\r\n<ul style=\"list-style-type:square\">\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Bhitarkanika National Park</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Simlipal National Park</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Tiger Reserves</strong></span></span></p>\r\n\r\n<ul style=\"list-style-type:square\">\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Simlipal Tiger Reserve</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Satkosia Tiger Reserve</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>UNESCO World Heritage Sites</strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Sun Temple, Konarak</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>KONARK &ndash; Famous for the Sun Temple</strong><strong>, this small hamlet plays host to a huge number of visitors who are spellbound by both the size of the temple as well as the delicacy of the erotic sculpture. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Odisha is drained by three main rivers &ndash; Mahanadi, Brahmani and Baitarni</strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Hirakud Dam</strong><strong> which is built on Mahanadi river is the fourth largest dam of world</strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Chilka lake </strong><strong>is about 64 Km long and about 20 Km wide. There are two beautiful islands in the lake &ndash; Parikud and Malud</strong></span></span></p>"}, {"qid": "", "question": "<p>Macroeconomics deals with which of the following studies?<br />\r\nI. Reasons behind the unemployment of resources<br />\r\nII. Determination of total output</p>", "options": ["<p>Neither I nor II</p>", "<p>Only I</p>", "<p>Both I and II</p>", "<p>Only II</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: C) Both I and II</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Macroeconomics</strong> is the branch of economics that deals with the economy as a whole, focusing on large-scale economic phenomena such as aggregate production, consumption, investment, and government spending. It includes the study of both the determinants of total output (II) and the reasons behind the unemployment of resources (I), among other aspects. Macroeconomics examines factors that influence economic growth, unemployment, inflation, and overall stability in the economy.</span></span></p>\r\n\r\n<table border=\"1\" style=\"width:557px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:82px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Aspect</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:215px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Macroeconomics</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:252px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Microeconomics</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px r the question while data in statement II is not</span>"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image039.png\" width=\"379\" height=\"388\" alt=\"\"></p>"}, {"qid": "", "question": " <span> ‘P # Q’ means ‘P is the father of Q’</span><p><span>‘P + Q’ means ‘P is the mother of Q’</span></p><p><span>‘P – Q’ means ‘P is the brother of Q’</span></p><p><span>‘P * Q’ means ‘P is the sister of Q’</span></p><p><span>Which of the following shows that A is the aunt of E?</span></p>", "options": ["<span> A + B – C * D # E</span>", "<span> A # B * C + D – E</span>", "<span> A * B # C * D – E</span>", "<span> A – B + C # D * E</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image040.png\" width=\"455\" height=\"372\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Eight people are sitting in two parallel rows with 4 people each in such a way that there is equal distance between adjacent persons. In row I – A, B, C and D are seated and all of them are facing south. In row II – V, X, Y and Z are seated and all of them are facing north. B is the only neighbour of A and A sits exactly opposite Y. V sits at the extreme left end of their row and is exactly opposite C. D sits to the immediate left of C and exactly opposite X. Who sits opposite to the immediate left of Y?</span>", "options": ["<span> C</span>", "<span> B</span>", "<span> A</span>", "<span> D</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image041.png\" width=\"395\" height=\"339\" alt=\"\"></p>"}, {"qid": "", "question": " <span style=\"font-weight:bold\"> </span><span>In a certain code, the word ‘GLAMOUR’ is written as ‘IJCNMWP’ and ‘MISRULE’ is written as ‘OGUSSNC’. In the same code, how is ‘TOPICAL’ written?</span>", "options": ["<span> VMRKACJ</span>", "<span> VMRJACJ</span>", "<span> VNRJBCK</span>", "<span> VMJRAJC</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image042.png\" width=\"415\" height=\"324\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Directions: A statement is given followed by two inferences I and II. You have to consider the statement to be true even if it seems to be at variance with commonly known facts. You have to decide which of the given inferences, if any, follow from the given statement.</span><p><span>Statements:</span></p><p><span>Punctuality and sincerity are one of the key points which will be surely reviewed. Hard work and dedication towards work will be applauded. Just to quantity an amount in the salary package of employee with no reason will not be entertained.</span></p><p><span>Inference: </span></p><p><span>I. Punching machine of office will be evaluated to analyse the punctuality of the employees. </span></p><p><span>II. There will be minimum 10% increment for deserving employee based on their performance.</span></p><p><span>III. Some of employees of company have done a tremendous job with complete determination and enthusiasm.</span></p>", "options": ["<span> If only I follow.</span>", "<span> Both II and III follow.</span>", "<span> If only III follows.</span>", "<span> All I, II and III follow.</span>"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><span>For I: Yes, it can be inferred from the given statements as it is clearly mentioned punctuality and sincerity are one of the key points which will surely reviewed.</span></p><p><span>For II: No, it is clear form the given the given statements that there will be increment but percentage cannot be inferred.</span></p><p><span>For III: No, as it is mentioned by manager that hard work and dedication towards work will be applauded. But, is there some employee who have done their work with complete determination and enthusiasm, it cannot be inferred. We can assume it but it cannot be inferred from it.</span></p>"}, {"qid": "", "question": " <span> In the following question, select the figure which can be placed at the sign of question mark (?) from the given alternatives.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image043.jpeg\" width=\"442\" height=\"104\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image044.jpeg\" width=\"78\" height=\"78\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image045.jpeg\" width=\"79\" height=\"77\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image046.jpeg\" width=\"75\" height=\"76\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image047.jpeg\" width=\"73\" height=\"76\" alt=\"\">"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image044.jpeg\" width=\"78\" height=\"78\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the correct combination of mathematical signs to sequentially replace the * signs and balance the given equation.</span><p><span>48 * 12 * 10 * 8 * 4 = 36</span></p>", "options": ["<span> ×</span><span>  </span><span>−</span><span>  </span><span>÷</span><span>  </span><span>+</span>", "<span> ÷</span><span>  </span><span>×</span><span>  </span><span>−</span><span>  </span><span>+</span>", "<span> +</span><span>  </span><span>×</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span></span><span>  </span><span>+</span><span>  </span><span>− ÷</span><span>  </span><span>×</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image048.png\" width=\"382\" height=\"304\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, a statement is followed by two courses of action, numbered I and II. You must assume everything in the statement to be true and on the basis of the information given in the statement, decide which course of action/s logically follows for pursuing.</span><p><span>Statement: Many students of the local school fell ill for the fourth time in a row in the last six months after consuming food prepared by the school canteen.</span></p><p><span>Course of action:</span></p><p><span>I. The School management should immediately terminate the contract of the canteen and ask for compensation.</span></p><p><span>II. The school management should advice all the students not to eat food articles from the canteen.</span></p><p><span>III. The owner of the canteen should immediately be arrested for negligence.</span></p>", "options": ["<span> Only II follows.</span>", "<span> Both I and III follow.</span>", "<span> Only III follows.</span>", "<span> Both I and II follow.</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>As the incident is repeated again and again, so the contract of the canteen should be terminated and compensation should be asked. Students should be advised not to eat food articles from the canteen. So, courses of action I and II follow. Course of action III is too harsh, so it does not follow.</span></p><p><span>Hence, d is the correct answer.</span></p>"}, {"qid": "", "question": " <span> Select the option that is related to the third figure in the same way as the second figure is related to the first figure.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image049.png\" width=\"322\" height=\"100\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image050.jpeg\" width=\"118\" height=\"86\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image051.jpeg\" width=\"98\" height=\"84\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image052.jpeg\" width=\"100\" height=\"95\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image053.jpeg\" width=\"102\" height=\"98\" alt=\"\">"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>(d) </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711533850802_image053.jpeg\" width=\"102\" height=\"98\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>13, 35, 57, 79, 911, ?</span></p>", "options": ["<span> 1110</span>", "<span> 1112</span>", "<span> 1113</span>", "<span> 1315</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>The terms of the given series are numbers formed by joining together consecutive odd numbers in order i.e. 1 and 3, 3 and 5, 5 and 7, 7 and 9, 9 and 11, …..</span></p><p><span>So, missing term = number formed by joining 11 and 13 = 1113.</span></p>"}, {"qid": "", "question": " <span> In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct answer.</span><p><span>I. There is considerable reduction in the number of people affected by water-borne diseases in City A during this rainy season.</span></p><p><span>II. The government has opened four new civil hospitals in City A in the beginning of the year.</span></p>", "options": ["<span> I is the cause and II is its possible effect.</span>", "<span> Both I and II are independent causes.</span>", "<span> Both I and II are effects of independent causes.</span>", "<span> II is the cause and I is its possible effect.</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>The given statement are self sufficient and depict independent events. Therefore, both the given statement are independent causes.</span></p><p><span>Hence, option b “Both I and II are independent causes”.</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
