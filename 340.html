<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 20 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "<p>     The amount (in Rs.) received at 30% per annum compound interest     after 3 yrs is Rs.8,78,800. What was the principal (in lakhs)</p>     <p><br>      </p>", "options": ["<p>     2</p>", "<p>     3</p>", "<p>     4</p>", "<p>     5</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_ada4748436de6abd.png\" width=\"407\" height=\"368\" > </p>"}, {"qid": "", "question": "<p>     A man travelled a distance of 84 km in 7 hrs, partly on foot at     the rate of 10 km per hour and partly on a bicycle at 25 km per     hour. The distance travelled on the foot is</p>     <p><br>      </p>", "options": ["<p>     36.66 km</p>", "<p>     48.66 km</p>", "<p>     60.66 km</p>", "<p>     96 km</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_ff0fdd552a10342f.png\" width=\"365\" height=\"272\" > </p>"}, {"qid": "", "question": "<p>     A sum of Rs.12719 is divided amongst A, B, C and D in the ratio     <span>13:30:24:12</span>. What is the sum of the     shares of A and D?</p>     <p>     <br>      </p>", "options": ["<p>     <span>Rs.     4064  </span>     </p>", "<p>     <span>Rs.     4025</span></p>", "<p>     <span>Rs.     4725  </span>     </p>", "<p>     <span>Rs.     4765</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_ba55bd507de47f89.jpg\" width=\"269\" height=\"222\" > </p>"}, {"qid": "", "question": "<p>     A triangle PQR is inscribed in the circle whose radius is 14 cm.     If PQ is the diameter of the circle and PR=10 cm, then what is     the area of the triangle PQR?</p>     <p>     <br>      </p>", "options": ["<p>     196</p>", " <p>     30<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_40f7cc6ed88a7ed0.gif\" > </p>", " <p>     40<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_f09b9edcf245f017.gif\" > </p>", " <p>     35<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_b62022b0d19423c3.gif\" > </p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_2ea767a8c757173.png\" width=\"347\" height=\"519\" > </p>"}, {"qid": "", "question": "<p>     A is 20% more efficient than B and C is 30% less efficient than     B. Working together, they can finish a work in 5 days. In how     many days will A alone complete 12/5 of that work?</p>     <p><br>      </p>", "options": ["<p>     12</p>", "<p>     19</p>", "<p>     29</p>", "<p>     7</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_228758a4d27320bb.png\" width=\"444\" height=\"508\" > </p>"}, {"qid": "", "question": " <p>     A policeman saw a thief at a distance of 625m and start to chase.     Policeman can run 5.625 Km in 25 minutes and the thief can run      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_9a35ac5bb94cf242.gif\" >      Km in 20 minutes. Find the distance travelled by thief before     being caught.</p>     <p><br>      </p>", "options": ["<p>     3.75 km</p>", "<p>     4.75 km</p>", "<p>     1.75 km</p>", "<p>     2.75 km</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_93a244f30446afed.png\" width=\"368\" height=\"453\" > </p>"}, {"qid": "", "question": "<p>     A man sells 1/6th of his stock at 10% profit and 1/3rd stock at     15% profit and the remaining at 5% profit. In total his gain is     equal to cost of 132 items of this stock. How much was his stock?         </p>     <p>     <br>      </p>", "options": ["<p>     1440</p>", "<p>     1210</p>", "<p>     1690</p>", "<p>     1260</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_4221ac75dc6b8cf0.png\" width=\"395\" height=\"650\" > </p>"}, {"qid": "", "question": "<p>     Find the least number which when divided by 14, 15, 18, or 46     leaves a remainder 6 in each case?      </p>     <p><br>      </p>", "options": ["<p>     14484</p>", "<p>     14496</p>", "<p>     28984</p>", "<p>     28994</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_6cc8cdec01a0b3b4.jpg\" width=\"396\" height=\"233\" > </p>"}, {"qid": "", "question": " <p>     The base of a right pyramid is an equilateral triangle of side     1<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_37a1a05089e4ef39.gif\" > .     If the total surface area of the pyramid is 270<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a0fa21055e8c6bac.gif\" >      cm<sup>2</sup>, its height is:</p>     <p>     <br>      </p>", "options": [" <p>     12<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a0fa21055e8c6bac.gif\" >      cm</p>", " <p>     10<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a0fa21055e8c6bac.gif\" >      cm</p>", "<p>     10 cm</p>", "<p>     12 cm</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_5456ea3893a140a0.png\" width=\"465\" height=\"482\" > </p>"}, {"qid": "", "question": " <p>     If tan7<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_2d18b495615e4fd5.gif\" >      then the value of      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_99024c02deb8f199.gif\" >      is:</p>     <p><br>      </p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a0fa21055e8c6bac.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_5b60e5053530f00b.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a9769edb752971ce.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_2f8743391314f72d.gif\" > </p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_80e09c31c6cacbaf.png\" width=\"347\" height=\"332\" > </p>"}, {"qid": "", "question": "<p>     The simple interest on a certain sum for 4 months at 31% per     annum is Rs 147 more than the simple interest on the same sum for     15 months at 5% per annum. The sum is?</p>     <p>     <br>      </p>", "options": ["<p>     <span>Rs.     2400</span></p>", "<p>     <span>Rs.     3600</span></p>", "<p>     <span>Rs.     4800</span></p>", "<p>     <span>Rs.     5600</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_5014313aafd9dac6.png\" width=\"372\" height=\"244\" > </p>"}, {"qid": "", "question": " <p>     If      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_65530647472d47f8.gif\" >      and ab = 11, (a<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_84d21f403aaedcde.gif\" > )     then the value of (<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_28e886fef50faf2f.gif\" > )     is:</p>     <p><br>      </p>", "options": ["<p>     1250</p>", "<p>     968</p>", "<p>     1100</p>", "<p>     1080</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_465994c790f057bb.png\" width=\"289\" height=\"290\" > </p>"}, {"qid": "", "question": "<p>     If p is the third proportional to 6, 12 and q is the fourth     proportional to 6, 15, 18, then find the value of (q+p).</p>     <p><br>      </p>", "options": ["<p>     69</p>", "<p>     104</p>", "<p>     81</p>", "<p>     57</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_ced9784f2bca98ab.jpg\" width=\"406\" height=\"321\" > </p>"}, {"qid": "", "question": "<p>     A is 60% more than B and C is 31.25% less than A. By what percent     is the difference of A and B less than C?</p>     <p><br>      </p>", "options": ["<p>     44.44</p>", "<p>     45</p>", "<p>     45.45</p>", "<p>     40</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_83beebbb4f38e24a.jpg\" width=\"215\" height=\"296\" > </p>"}, {"qid": "", "question": "<p>     Shashi sells two articles for ₹67,000 each with no loss and no     profit in the overall transaction. If one article is sold at 25%     loss, then the other is sold at a profit of:</p>     <p>     <br>      </p>", "options": ["<p>     20%</p>", "<p>     25%</p>", "<p>     50%</p>", "<p>     40%</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_ae29c9d3246652f0.png\" width=\"327\" height=\"304\" > </p>"}, {"qid": "", "question": " <p>     What is the value of      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_8ed420e80258628a.gif\" > ?</p>     <p>     <br>      </p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_4a75060176a93944.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_1388807600ae1cf6.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_26897274963b58ec.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_e83715b9085ed87a.gif\" > </p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_6d8eb6d25b9c76a5.png\" width=\"433\" height=\"244\" > </p>"}, {"qid": "", "question": "<p>     One type of liquid contains 30% water in a mixture of milk and     water and second type of liquid 75% of milk in the same type of     milk and water solution. A glass is filled with 7 Kg of the first     liquid and 14 Kg of the second liquid. Find the percentage of     water in the mixture?</p>     <p><br>      </p>", "options": ["<p>     80/7%</p>", "<p>     40%</p>", "<p>     80%</p>", "<p>     80/3%</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_57a7531b5916297d.jpg\" width=\"353\" height=\"330\" > </p>"}, {"qid": "", "question": " <p>     On walking 100 metres towards a building in a horizontal line,     the angle of elevation of its top changes from 45<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_65129b8454d17d9f.gif\" >      to 60<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_65129b8454d17d9f.gif\" > .     What will be the height (in metres) of the building?</p>     <p>     <br>      </p>", "options": [" <p>     50(3+<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_887dfe0751b86247.gif\" > </p>", " <p>     100(1+<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_887dfe0751b86247.gif\" > </p>", "<p>     150</p>", " <p>     100<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_a0fa21055e8c6bac.gif\" > </p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_9eaf53953c8fc4bc.png\" "https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_fd2b42619f98e1f7.png\" width=\"353\" height=\"492\" > </p>"}, {"qid": "", "question": " <p>     What is the value of      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_855887455dbdd5d1.gif\" > ?</p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_f3e2549c2507682e.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_3fd12287c4d1b3ac.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_cc0dd0770e9d9a7a.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_58c4807891e5ba1f.gif\" > </p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_f30832317219f048.png\" width=\"434\" height=\"254\" > </p>"}, {"qid": "", "question": "<p>     The ratio of the monthly incomes of X and Y is 17:15 and that of     their monthly expenditures is 11:9. If the income of Y is equal     to the expenditure of X, then what is the ratio of the savings of     X and Y?</p>     <p><br>      </p>", "options": ["<p>     12:19</p>", "<p>     7:22</p>", "<p>     11:15</p>", "<p>     6:13</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_98dff5b84addc580.jpg\" width=\"234\" height=\"299\" > </p>"}, {"qid": "", "question": "<p>     A shopkeeper marks his goods 50% above the cost price and gives a     20% discount to his customers. At the time of selling, he uses     750 gm weight instead of 1 kg. Find his profit %.      </p>     <p><br>      </p>", "options": ["<p>     65%</p>", "<p>     62%</p>", "<p>     60%</p>", "<p>     55%</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693906869172_html_c80aedfe12dd77aa.png\" width=\"341\" height=\"400\" > </p>"}, {"qid": "", "question": "<p>    <span style=\"display:inline-block;border:none;padding:0in\">Select    the option that expresses the given sentence in passive voice.</span></p>    <p>    <span style=\"display:inline-block;border:none;padding:0in\">People    have made these sculptures with great care.</span></p>", "options": ["<p>    These sculptures    were made by people with great care.</p>", "<p>    These sculptures    have been made with great care by people.</p>", "<p>    With great care,    people have been making these sculptures.</p>", "<p>    These sculptures    have been carefully made by people.</p>"], "correct": 2, "marks": "1", "explanation": "<p>    <span style=\"display:inline-block;border:none;padding:0in\">Option    B is the correct answer. </span>    </p>    <p><a name=\"_Hlk143182556\"></a>    <span style=\"display:inline-block;border:none;padding:0in\"><u><b>Active    and Passive Voice Rules for Present Perfect Tense: </b></u></span>    </p>    <table>     <col>      <col>      <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">                    <b>Active       Voice</b></span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">                        <b>Passive       Voice</b></span></p>       <p>       <span style=\"display:inline-block;border:none;padding:0in\"><b>(Auxiliary       Verb- has/have +been)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Subject       + has/have+ v3+ object</span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Object+       has/have+ been+ V3+ by + subject</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Subject       + has/have+ not+ v3+ object</span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Object       + has/have+ not + been+V3+ by Subject</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Has/have+       subject+ v3 + object+?</span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\">Has/Have       + Object+ been+V3+ by subject +?</span></p>      </td>     </tr>    </table>    <p>    <br> <br>     </p>    <p>    Thus, the correct passive voice of the given sentence is: <i><b>These    sculptures have been made with great care by people.</b></i></p>    <p>    <br> <br>     </p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the right order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> A.     Though they had never ever heard Subha utter their names, they     unfailingly recognized her footsteps as she came into their shed.     <br> B. They even understood the precious moments between them     as she loved and cuddled them, scolded them, and pleaded to     them.<br> C. Subha did really have a close circle of friends and     companions; they were Sarbasi and Panguli, the two cows living in     their cow-shed.<br> D. They understood the silent, melancholy     tune of her unspoken words during those moments, and the     intensity of her expressions more easily than the spoken language     of other humans.</span></p>", "options": ["<p>     ADBC</p>", "<p>     DABC</p>", "<p>     CBDA</p>", "<p>     CADB</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: CADB: <i><b>Subha     did really have a close circle of friends and companions; they     were Sarbasi and Panguli, the two cows living in their cow-shed.     Though they had never ever heard Subha utter their names, they     unfailingly recognized her footsteps as she came into their shed.     They understood the silent, melancholy tune of her unspoken words     during those moments, and the intensity of her expressions more     easily than the spoken language of other humans. They even     understood the precious moments between them as she loved and     cuddled them, scolded them, and pleaded to them.</b></i></span></p>     <p>     <br>      </p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in indirect speech.<br />\r\nSuryakumar Yadav said, &ldquo;I was playing cricket in my dreams.&rdquo;</p>", "options": ["<p>Suryakumar Yadav said that he had been playing cricket in his dreams.</p>", "<p>Suryakumar Yadav said I was playing cricket in his dreams.</p>", "<p>Suryakumar Yadav said that I was playing cricket in his dreams.</p>", "<p>Suryakumar Yadav said that he was playing cricket in his dreams.</p>"], "correct": 1, "marks": "1", "explanation": "<p>Option A is the correct answer.</p>\r\n\r\n<p><strong>Transformation rule (If the Reporting Verb is in Past Tense)</strong></p>\r\n\r\n<p>Past Continuous ----- Past perfect continuous</p>\r\n\r\n<p>(Subject +was/were+V1 +ing+ Object) -- (Subject +had been+V1 +ing+ Object)</p>\r\n\r\n<p>Thus, the correct passive voice of the given sentence is: <em><strong>Suryakumar Yadav said that he had been playing cricket in his dreams.</strong></em></p>"}, {"qid": "", "question": "<p>    <span style=\"display:inline-block;border:none;padding:0in\">Select    the option that expresses the given sentence in passive voice.<br> The    fielder at the slip position took a brilliant catch.</span></p>", "options": ["<p>    A brilliant    catch has been taken by the fielder at the slip position.</p>", "<p>    A brilliant    catch was taken by the fielder at the slip position.</p>", "<p>    A brilliant    catch was being taken by the fielder at the slip position.</p>", "<p>    A brilliant    catch had been taken by the fielder at the slip position.</p>"], "correct": 2, "marks": "1", "explanation": "<p>    <span style=\"display:inline-block;border:none;padding:0in\">Option    B is the correct answer.   </span>    </p>    <p>    <span style=\"display:inline-block;border:none;padding:0in\"><span><u><b>Active    and Passive Voice Rules for Past Simple Tense</b></u></span><span><b>:    </b></span></span>    </p>    <table>     <col>      <col>      <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Active       Voice</b></span></span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Passive       Voice</b></span></span></p>       <p>       <span style=\"display:inline-block;border:none;padding:0in\"><span><b>(Auxiliary Verb-       was/were)</b></span></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject       + V2+ object</span></span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Object+       was/were V3+ by + subject</span></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject       +did+ not+v1+ object</span></span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Object       + was/were+ not +V3+ by Subject</span></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Did+       subject+V1+ object+?</span></span></p>      </td>      <td><p>       <span style=\"display:inline-block;border:none;padding:0in\"><span>Was/were       + Object+ V3+ by subject +?</span></span></p>      </td>     </tr>    </table>    <p>    <br> <br>     </p>    <p>    <span style=\"display:inline-block;border:none;padding:0in\">Thus,    the correct passive voice of the given sentence is: <i><b>A    brilliant catch was taken by the fielder at the slip position.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the right order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> A.     A fox, hearing the cock and thinking to make a meal of him, came     and stood under the tree.<br> B. As the night passed away and     the day dawned, the cock, according to his custom, set up a     shrill crowing.<br> C. A dog and a cock having struck up an     acquaintance went out on their travels together.<br> D.     Nightfall found them in a forest, so the cock, flying up on a     tree, perched among the branches, while the dog dozed below at     the foot.</span></p>", "options": ["<p>     BCDA</p>", "<p>     CABD</p>", "<p>     DCAB</p>", "<p>     CDBA</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     D is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: CDBA: <i><b>A     dog and a cock having struck up an acquaintance went out on their     travels together. Nightfall found them in a forest, so the cock,     flying up on a tree, perched among the branches, while the dog     dozed below at the foot. As the night passed away and the day     dawned, the cock, according to his custom, set up a shrill     crowing. A fox, hearing the cock and thinking to make a meal of     him, came and stood under the tree.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the right order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> A.     Information Communication Technology tools have brought in     additional changes along with means of communication. <br> B.     These changes have enabled man to communicate faster.<br> C.     Communication has not only become faster but easier too.<br> D.     The result is a more relaxed life than ever before.</span></p>", "options": ["<p>     ABDC</p>", "<p>     ABCD</p>", "<p>     CDBA</p>", "<p>     DBCA</p>"], "correct": 2, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     B is the correct answer.  </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: <b>ABCD</b>:     <i><b>Information     Communication Technology tools have brought in additional changes     along with means of communication. These changes have enabled man     to communicate faster. Communication has not only become faster     but easier too. The result is a more relaxed life than ever     before.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is divided in some segments. Select the segment     that contains error. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Ruhi     requested him/ to take her to the doctor/ as she has very high     fever. </span>     </p>", "options": ["<p>     Ruhi requested     him</p>", "<p>     to take her to     the doctor</p>", "<p>     as she has very     high fever</p>", "<p>     No error</p>"], "correct": 3, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     C is the correct answer. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is erroneous. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>To     rectify the sentence ---</b></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Replace     ‘has with ‘had’. In indirect speech ‘Simple Present     Tense’ Changes into ‘Simple Past Tense’. </b></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     segment 3 is the correct answer. </span>     </p>"}, {"qid": "", "question": "<p>     Select the INCORRECTLY spelt word.</p    </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Apply:</b></span><span>     This word means to put to use or implement, but it doesn't convey     the idea of following customs in this context.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Adhere:</b></span><span>     This word means to stick to or follow closely, which fits well     with the idea of following traditional customs. Therefore, this     is the correct choice.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Abide:</b></span><span>     This word means to comply with or accept, but it doesn't capture     the sense of strict adherence that the sentence requires.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Appeal:</b></span><span>     This word means to make a request or plea, and it doesn't fit the     context of following traditional customs.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>So,     the correct option is </span><span><b>(B)     adhere,</b></span><span>     and the sentence reads: \"The people of Rajasthan strictly     adhere to the traditional customs.\"</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.<br> The worst     possible ______ for human society is that we will destroy     ourselves with nuclear weapons.</span></p>", "options": ["<p>     Prediction</p>", "<p>     Preceptive</p>", "<p>     Presentation</p>", "<p>     Privilege</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     most appropriate word to fill in the blank is “Prediction”. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Prediction:</b></span><span>     A prediction is a statement about what is likely to happen in the     future based on observations, knowledge, or analysis. In this     context, \"the worst possible prediction\" refers to a     grim outlook for the future.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Preceptive:</b></span><span>     This word means relating to precepts, which are principles or     rules of conduct. However, it doesn't fit the context of     foreseeing a negative outcome for human society.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Presentation:</b></span><span>     Presentation refers to the act of showing or displaying     something. It doesn't convey the sense of foreseeing a negative     outcome as required in the sentence.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Privilege:</b></span><span>     Privilege refers to a special right or advantage granted to a     certain individual or group. It is unrelated to the context of     predicting a negative outcome.</span></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">The     following sentence has been divided into parts. One of them     contains an error. Select the part that contains the error from     the given options.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> Mithila     art tradition is passed on / from one generation through a next /     by children watching and helping / their mothers and     grandmothers.</span></p>", "options": ["<p>     Mithila art     tradition is passed on</p>", "<p>     their mother     and grandmothers</p>", "<p>     by children     watching and helping</p>", "<p>     from one     generation through a next</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     D is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><b>Rule:</b>     </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">When     expressing the concept of passing something from one instance of     a group to the following instance of that group, We use the     phrase \"from... to...\" instead of \"from...     through...\". This is especially true when referring to     generations, time periods, or sequential items. </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct sentence is: <i><b>Mithila     art tradition is passed on from one generation to the next by     children watching and helping their mothers and grandmothers.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the given idiom.<br> To fight     tooth and nail</span></p>", "options": ["<p>     To fight or     compete with great ferocity and intensity</p>", "<p>     To silently     leave the scene of battle</p>", "<p>     To use unusual     weapons to fight</p>", "<p>     To keep the     enemy guessing about the weapons used</p>"], "correct": 1, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     A is the correct answer.   </span>     </p>     <ul>      <li><p>      <span style=\"display:inline-block;border:none;padding:0in\">The      idiom \"to fight tooth and nail\" means to fiercely and      vigorously defend or contend for something, using all available      means and with great determination. </span>      </p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\">It      implies that a person is willing to put forth maximum effort and      use every resource at their disposal to achieve a goal, win a      battle, or protect their interests. </span>      </p>      </li><li><p>      <span style=\"display:inline-block;border:none;padding:0in\">This      expression often conveys the idea of a relentless and intense      struggle.</span></p>     </li></ul>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct answer is Option A) <i><b>To fight     or compete with great ferocity and intensity.</b></i></span></p>"}, {"qid": "", "question": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the right order to form a meaningful and coherent     paragraph.</span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><br> A.     Inspector: “Were you sleeping when the robbers entered the     bank?”<br> B. Guard: “The iron grill lock was broken and the     bank looked ransacked but the robbers could not take away     anything as I had returned quickly.”<br> C. Inspector: “What     did you see when you came back?”<br> D. Guard: “No Sir. The     bank had closed and I had just gone to relieve myself.”</span></p>", "options": ["<p>     CDAB</p>", "<p>     ABCD</p>", "<p>     BADC</p>", "<p>     ADCB</p>"], "correct": 4, "marks": "1", "explanation": "<p>     <span style=\"display:inline-block;border:none;padding:0in\">Option     D is the correct answer.   </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: ADCB: </span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><i><b>Inspector:     “Were you sleeping when the robbers entered the bank?”.     Guard: “No Sir. The bank had closed and I had just gone to     relieve myself.” Inspector: “What did you see when you came     back?” Guard: “The iron grill lock was broken and the bank     looked ransacked but the robbers could not take away anything as     I had returned quickly.”< 024 to 2027. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">CAG is already holding this position in WHO since 2019 for a four-year term from 2019 to 2023.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Important Information about CAG: </strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">CAG is an independent authority under the Constitution of India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He is the head of the Indian audit &amp; account department and chief Guardian of Public purse. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 148</strong> broadly deals with the CAG appointment, oath and conditions of service. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 149</strong> deals with Duties and Powers of the Comptroller and Auditor-General of India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 150</strong> says that the accounts of the Union and of the States shall be kept in such form as the President may, on the advice of the CAG, prescribe. </span></span></li>\r\n\t<li><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Article 151</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\"> says that the reports of the Comptroller and Auditor-General of India relating to the accounts of the Union shall be submitted to the president, who shall cause them to be laid before each House of Parliament.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>The Cabinet Mission came to India in ________ to discuss the ultimate transfer of power.</p>", "options": ["<p>1942</p>", "<p>1945</p>", "<p>1943</p>", "<p>1946</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: D) 1946.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Cabinet Mission reached Delhi on March 24, 1946 to decide on interim government; and principles and procedures for framing a new constitution giving freedom to India. As the Congress and the League could not come to any agreement the mission put forward its own plan for the solution of the constitutional problem. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">League rejected Mission proposal of interim government but Wavell quietly brought the Muslim League into the Interim Government on October 26, 1946. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The League was allowed to join without giving up the &lsquo;direct action&rsquo;; despite its rejection of the Cabinet Mission&rsquo;s long term and short-term plans; and despite insistence on compulsory grouping. </span></span></li>\r\n</ul>\r\n\r\n<table border=\"1\" style=\"width:364px\">\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#ed7d31; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:13px; vertical-align:top; width:138px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Cabinet Mission Members</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#ed7d31; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:13px; vertical-align:top; width:220px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Cabinet Mission Members &ndash; Designation</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:138px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Pethick Lawrence</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:220px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Secretary of State for India</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:138px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Stafford Cripps</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:220px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">President of the Board of Trade</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:138px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A.V. Alexander</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#d9d9d9; border-bottom:1px solid #444444; border-left:1px solid #444444; border-right:1px solid #444444; border-top:1px solid #444444; height:17px; vertical-align:top; width:220px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">First Lord of Admiralt</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Consider the following statements about the ozone layer:<br />\r\nA. The ozone layer is primarily located in the troposphere.<br />\r\nB. Ozone depletion is mainly caused by natural processes like volcanic activity.<br />\r\nC. Ozone molecules absorb harmful ultraviolet (UV) radiation from the Sun.<br />\r\nWhich of these statements are correct?</p>", "options": ["<p>A and B</p>", "<p>Only C</p>", "<p>A and C</p>", "<p>A, B, and C</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option B.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A. This statement is incorrect. <strong>The ozone layer is primarily located in the stratosphere, not the troposphere.</strong> The stratosphere is the second major layer of Earth&#39;s atmosphere, located above the troposphere. The ozone layer is found at an altitude of about 10 to 50 kilometers (6 to 31 miles) above the Earth&#39;s surface.    </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Statement B is partially correct, as natural processes like volcanic activity can contribute to ozone depletion, but human-made ozone-depleting substances are the main cause.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Statement C is correct, as ozone molecules in the stratosphere absorb harmful UV radiation from the Sun, providing a protective shield for life on Earth.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Therefore, the correct answer is (B) Only C.</span></span></p>"}, {"qid": "", "question": "<p>Which class has the largest number of animals?</p>", "options": ["<p>fishes</p>", "<p>Mammals</p>", "<p>Insects</p>", "<p>Reptiles<br />\r\n </p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: (C) Insects.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The class with the largest number of animals is <strong>Insects</strong>. Insects belong to the phylum Arthropoda and class Insecta. In the animal kingdom, insects are by far the most diverse and numerous group. They make up the largest portion of animal species on Earth.   </span></span></p>\r\n\r\n<table border=\"1\" style=\"width:557px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Animal Class</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:208px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Characteristics</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Explanation</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Fishes</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:208px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Aquatic vertebrates with fins and gills; diverse species in aquatic ecosystems</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">While fishes are diverse and play important roles in aquatic ecosystems, insects outnumber them.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"> Mammals</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:208px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Warm-blooded vertebrates with mammary glands, fur, and varied adaptations</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mammals have diverse species, but their numbers are lower compared to insects.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Insects</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:208px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Invertebrates with three body segments and six legs; highly diverse and numerous species</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Insects are the most abundant and diverse class, occupying various niches and habitats.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"> Reptiles</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:208px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Cold-blooded vertebrates with scales; occupy terrestrial and aquatic habitats</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">While reptiles are diverse, they are outnumbered by insects in terms of species.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Select the correct statement.</p>", "options": ["<p>Chloroplast, ribosomes and nucleus are present in fungal cell.</p>", "<p>Mitochondria and nucleus are found in bacteria.</p>", "<p>Mitochondria and nucleus are absent in plant cell.</p>", "<p>Ribosomes, mitochondria and lysosomes are found in animal cells.</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct statement is: D) Ribosomes, mitochondria, and lysosomes are found in animal cells.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Explanation: (A) This statement is incorrect. Fungal cells typically contain ribosomes and nuclei, but they lack chloroplasts. Chloroplasts are primarily found in plant cells and some protists.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(B) This statement is incorrect. Bacteria are prokaryotic cells that lack a nucleus and membrane-bound organelles like mitochondria.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(C) This statement is incorrect. Plant cells contain both mitochondria and nuclei. Mitochondria are the energy-producing organelles, and nuclei contain genetic information.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(D) This statement is correct. Animal cells contain ribosomes for protein synthesis, mitochondria for energy production, and lysosomes for cellular waste management. </span></span></p>"}, {"qid": "", "question": "<p>Due to attraction of the sun and the moon, what is the frequency of up and falls down of ocean water in a day?</p>", "options": ["<p>Three</p>", "<p>Two</p>", "<p>Four</p>", "<p>One</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: (B) Two.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The gravitational pull of both the Moon and the Sun on Earth&#39;s oceans creates tides. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">As Earth rotates, different parts of its oceans experience two high tides and two low tides every day. This results in a total of two cycles of rising and falling ocean water levels within a 24-hour period. Therefore, the correct frequency of the rise and fall of ocean water in a day is two tides.</span></span></p>"}, {"qid": "", "question": "<p>Which Article of the Constitution of India mentions that law declared by Supreme Court is binding on all courts?</p>", "options": ["<p>Article 141</p>", "<p>Article 142</p>", "<p>Article 143</p>", "<p>Article 144</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: A) Article 141.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 141:</strong> Article 141 of the Indian Constitution states that the law declared by the Supreme Court of India is binding on all courts within the territory of India. This means that the decisions and judgments made by the Supreme Court set legal precedents that lower courts are obligated to follow. </span></span></p>\r\n\r\n<p> </p>\r\n\r\n<table border=\"1\" style=\"width:488px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:24px; vertical-align:bottom; width:70px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:24px; vertical-align:bottom; width:412px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Explanation</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:70px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 141</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:412px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Law declared by the Supreme Court is binding on all courts within the territory of India.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:70px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 142</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:412px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Grants special powers to the Supreme Court for passing orders to ensure complete justice.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:70px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 143</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:412px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Allows the President to seek the Supreme Court&#39;s advice; the court&#39;s opinion is binding on the President.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:70px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Article 144</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:39px; vertical-align:bottom; width:412px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Authorities, civil and judicial, in India shall act in aid of the Supreme Court&#39;s authority.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Trichloromethane is better known as:</p>", "options": ["<p>butanes</p>", "<p>chloroform</p>", "<p>LPG</p>", "<p>laughing gas</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: B) Chloroform. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Trichloromethane, which is better known by its common name <strong>chloroform</strong>, is a chemical compound with the molecular formula CHCl₃. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is a colorless, heavy, sweet-smelling liquid that was historically used as an anesthetic. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It has also been used in chemical reactions and industrial processes. Its use as an anesthetic has significantly declined due to safety concerns.</span></span></li>\r\n</ul>\r\n\r\n<table border=\"1\" style=\"width:538px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td st nt-family:Calibri,sans-serif\">-</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mixture of propane and butane used as a fuel for heating, cooking, vehicles.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:119px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">(D) Laughing Gas</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:140px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Nitrous Oxide</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:271px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Used as an anesthetic in dentistry and as a recreational inhalant.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "\r\n<p>What is the rank of Indian in the International Intellectual (IP) Index for 2024?</p>", "options": ["\r\n<p>40th</p>", "\r\n<p>35th</p>", "\r\n<p>42nd</p>", "\r\n<p>45th</p>"], "correct": 3, "marks": "1", "explanation": "\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option C - 42nd.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The International Intellectual Property (IP) Index, developed by the U.S. Chamber of Commerce.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It was 12th edition. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">India ranks 42nd in this Index out of 55 countires evalutaed. India&#39;s overall score also remained unchanged at 38.64% according to this index.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The report noted that India has made some progress in strengthening its IP environment but still has significant room for improvement, particularly in the areas of patent protection and enforcement.   </span></span></p>"}, {"qid": "", "question": "<p>GDP deflator = _________</p>", "options": ["<p>(nominal GDP / Real GDP) &times; 100</p>", "<p>(nominal GDP &minus; Real GDP) &times; 100</p>", "<p>(nominal GDP + Real GDP) &times; 100</p>", "<p>(nominal GDP &times; Real GDP) &times; 100</p>"], "correct": 1, "marks": "1", "explanation": "<p>The correct answer is: A) (nominal GDP / Real GDP) &times; 100.   </p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">GDP deflator, also known as the implicit price deflator, is used to measure inflation. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is used to determine the levels of prices of the new domestically produced final goods and services in a country in a year.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">GDP deflector shows the changes in the average price levels in an economy, and therefore, it is used in conjunction with the Consumer Price Index (CPI) for measuring inflation.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">GDP deflator consists of two important components, which are the nominal GDP and real GDP.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Nominal GDP is the monetary value of all the goods and services produced in an economy and is valued at current prices, while the real GDP shows the monetary value of all the finished goods and services in an economy calculated at constant prices.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which waterway provides connectivity with mainland India through the India-Bangladesh Protocol route?</p>", "options": ["<p>NW-2</p>", "<p>NW-15</p>", "<p>NW-10</p>", "<p>NW-83</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is: A) NW-2. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">NW-2 is the most important waterway in North East Region of India. It also provides connectivity with mainland India through Indo-Bangladesh Protocol route, thereby reducing congestion on the Siliguri Corridor (the only direct corridor connecting mainland India with North east). </span></span></p>"}, {"qid": "", "question": "\r\n<p>Match the following</p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Ministry                                                                                           Minister</strong></span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ministry of Road transport &amp; Highways                       I. Jitan Ram Manjhi</span></span><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"> \t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:410px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Tyndall&#39;s Law states that the scattering of light by colloidal particles makes them visible.</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Kepler&#39;s Law</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:410px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Kepler&#39;s Laws describe the motion of planets around the Sun and are related to planetary orbits.</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Pascal&#39;s Law</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:410px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Pascal&#39;s Law stat
