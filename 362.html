<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 11 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p>     The     average of six positive numbers is 19. If the first number is     one-eighteenth of the sum of the last five numbers, then 200% of     the average of the last five numbers is:</p>     <p><br>      </p>", "options": [" <p>     33.2</p>", " <p>     43.2</p>", " <p>     53.2</p>", " <p>     36.2</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_78b6f0bd1bec1389.jpg\" width=\"304\" height=\"438\" > </p>"}, {"qid": "", "question": " <p>     <span>Find     the ratio of the area of a square to that of the square drawn on     its diagonal is:</span></p>     <p><br>      </p>", "options": [" <p>     <span>1:1</span></p>", " <p>     <span>1:2</span></p>", " <p>     <span>1:3</span></p>", " <p>     <span>1:4</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_98ea16f7401565bd.png\" width=\"329\" height=\"475\" > </p>"}, {"qid": "", "question": " <p>     <span>Two     circles having radii r units intersect each other in such a way     that each of them passes through the centre of the other. Then,     the length of their common chord is:</span></p>     <p><br>      </p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_3158c59fd0335f12.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_cdf77090b73007cc.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_560805ae7f4b1e81.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_394521b6c82dc059.gif\" > </p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_c952c368c55f83ff.png\" width=\"236\" height=\"216\" \"https://appxcontent.kaxa.in//bulk_uploader_images/1692619014671_html_1972fb4fe6dafc0e.png\" width=\"327\" height=\"306\" > </p>"}, {"qid": "", "question": " <p>     Select the option that expresses the given sentence in passive     voice.      </p>     <p>     Naman won’t receive any better choice than this from anywhere.</p>", "options": [" <p>     Any better     choice shouldn’t be received by Naman than this from anywhere.</p>", " <p>     Any better     choice won’t be received by Naman than this from anywhere.</p>", " <p>     Any better     choice wouldn’t have received by Naman than this from anywhere.</p>", " <p>     Any better     choice won’t have been be received by Naman than this from     anywhere.</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>option     b is the correct answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Active     to Passive rule: -</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sub     + won’t (Modal verb) + v1 + Obj ------ Obj + won’t + be + V3     + by + Sub.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>So,</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Nanam     won’t receive any better choice than this from anywhere --- Any     better choice won’t be received by Naman than this from     anywhere. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is - Any better choice won’t be received by     Naman than this from anywhere.</span></span></p>"}, {"qid": "", "question": " <p>     Select the option that expresses the given sentence in     active/passive voice.</p>     <p>     Himanshi made a cup of tea in the evening.</p>", "options": [" <p>     A cup of tea     was being made by Himanshi in the evening.</p>", " <p>     In the evening     a cup of tea have been made by Himanshi.</p>", " <p>     A cup of tea     was made by Himanshi in the evening.</p>", " <p>     A cup of tea     has been made since evening.</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Option     c is the correct answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Rule:</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Active     to Passive: </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Subject     + V2 + Object ----- Object + was/were + V3 + by + Subject.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Himanshi     made a cup of tea in the evening.  ---- A cup of tea was made by     Himanshi in the evening.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Hence     the correct answer is : A cup of tea was made by Himanshi in the     evening.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     following sentence has been divided into parts. One of them may     contain an error. Select the part that contains the error from     the given options. If you don’t find any error, mark ‘No     error’ as your answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Because     Anita is intelligent, / therefore she gets good / marks in all     the examinations.</span></span></p>", "options": [" <p>     Because Anita     is intelligent,</p>", " <p>     therefore she     gets good</p>", " <p>     marks in all     the examinations</p>", " <p>     No error</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Option     b is the correct answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>In     the given sentence the error is in part b: </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\">‘<span>Because’/     ‘as’ / ‘since’ are not followed by ‘therefore’.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>So,     therefore is not correct in the given sentence.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>To     rectify the sentence, we will use remove ‘Therefore’.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>So,     the correct sentence:</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Because     Anita is intelligent, she gets good marks in all the     examinations.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Hence,     b is the correct answer.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Choose     the ANTONYM of the word </span><span><b>‘disenfranchise’</b></span><span>     in the given sentence.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     parliament of Tonoco authorised the king to take over the reins     of the government and disabled the power of the council of     ministers.</span></span></p>", "options": [" <p>     Authorised</p>", " <p>     Powers</p>", " <p>     Disabled</p>", " <p>     Reins</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Option     a is the correct answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding s SI unit of magnetic flux density?</p>", "options": ["<p>Farad</p>", "<p>Weber</p>", "<p>Tesla</p>", "<p>Siemens</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Tesla.     </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Tesla(T)</strong> is the SI unit of <strong>Magnetic flux density</strong>. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Farad (F)</strong> is the SI unit of <strong>Capacitance</strong>. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Weber (Wb)</strong> is the SI unit of <strong>Magnetic flux</strong>. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Siemens (S)</strong> is the SI unit of <strong>Electrical Conductance</strong>. </span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Magnetic flux density: </strong>It is defined as the <strong>force acting per unit current per unit length on a wire placed at right angles to the magnetic field</strong>. <strong>CGS unit</strong> of Magnetic flux Density is &lsquo;<strong>Gauss</strong>&rsquo;.   </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Magnetic Flux</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">: It is defined as the number of <strong>magnetic field lines passing through a given closed surface</strong>. It provides the measurement of the total magnetic field that passes through a given surface area.</span></span></p>"}, {"qid": "", "question": "<p>What is the rank of India in the Global Fire Power Index 2023?</p>", "options": ["<p>1st</p>", "<p>3rd</p>", "<p>4th</p>", "<p>9th</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is 4th.                  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The <strong>Global Firepower Index</strong> ranks the countries based on their potential <strong>military strength</strong>. <strong>India</strong> is ranked <strong>fourth</strong> in the index. The Global Firepower Index ranked <strong>145 countries</strong>. The countries were evaluated based on prolonged offensive and defensive military campaigns.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Global Firepower Index, 2023, puts the US at the top, Russia at the second spot, China at No. 3, and India at No. 4. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Global Firepower Index is calculated using <strong>fifty individual factors</strong> from geography to logistical capability. It also includes <strong>manpower, land forces, airpower, natural resources, naval forces, logistics and financials. </strong></span></span></p>"}, {"qid": "", "question": "<p>Shipki La pass is located in which state?</p>", "options": ["<p>Himachal Pradesh</p>", "<p>Uttarakhand</p>", "<p>Sikkim</p>", "<p>Arunachal Pradesh</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Himachal Pradesh.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Shipki La Pass</strong> is located through Sutlej Gorge. It connects <strong>Himachal Pradesh with Tibet</strong>. It is India&rsquo;s third border post for trade with China after Lipu Lekh and Nathula Pass.                      </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:14.0pt\">Other Passes in Himachal Pradesh: </span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Rohtang Pass</strong>: This is located in the state of Himachal Pradesh. It has excellent road transportation. This pass <strong>connects Kullu, Spiti and Lahul</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Debsa Pass</strong>: It <strong>joins Spiti Valley and Parvati Valley</strong>. It is a high mountain pass in between the Kullu and Spiti of Himachal Pradesh. It is a bypass route of <strong>Pin-Parvati Pass</strong>.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">                                          </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:14.0pt\">Passes in Uttarakhand: </span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:12.0pt\">Lipu Lekh: </span></strong><span style=\"font-size:12.0pt\">It is located in Uttarakhand. It connects Uttarakhand with Tibet. This pass is an important border post for trade with China. The pilgrims for Manasarovar travel through this pass. </span></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:12.0pt\">Mana Pass:</span></strong><span style=\"font-size:12.0pt\"> It is located in the Greater Himalayas and connects Tibet with Uttarakhand. It remains under snow for six months during winter. </span></span></span></p>\r\n\r\n<p><strong><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Muling La:</span></span></strong><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\"> It is situated in the north of Gangotri, at an elevation of 5669 m in the Great Himalayas. This seasonal pass that connects Uttarakhand with Tibet remains snow-covered during the winter season.</span></span></p>"}, {"qid": "", "question": "Wुicु यी पुध ीियियथing ौपोपधंधnपौ ोनध cयननधcप ोccयनकing पय पुध Pनधोंृिध यी Inकiो? A. Iप ूनयॅiकधौ पुनधध पदूधौ यी Jहौपicध- Sयciोि, Ecयnयंic ोnक Pियiपicोि. B. Iप ूनयॅiकधौ Liृधनपद यी पुयहgुप, धसूनधौौiयn, ृिधiधी, ीोiपु ोnक थयनौुiू. C. Tुध पधनं &िसतहयेSयciोिiौप&नौतहये, &िसतहयेSधcिहोन&नौतहये, ोnक &िसतहयेInपधgनiपद&नौतहये थधनध ोककधक पय पुध ूनधोंृिध पुनयहgु 42nक Aंधnकंधnप Acप, 1976.", "options": ["<p>A and B only</p>", "<p>A, B and C</p>", "<p>B and C only</p>", "<p>A and C only</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option b is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">All the above statements are correct.   </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:16.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Preamble of India:</span></span></strong></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Berubari Case</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\"> and <strong>Kesavananda Bharti</strong> Case is related to the Preamble of India.</span></span></p>"}, {"qid": "", "question": "<p>Which of the given statements about the Union Budget is/are true?<br />\r\n <br />\r\n1. Vote on Account deals only with the expenditure side of the government budget.<br />\r\n2. Vote on Account and Interim Budget are not the same.<br />\r\n3. An Interim Budget gives a complete financial statement, similar to a full budget.<br />\r\n4. Article 113 talks about Annual Financial Statement.</p>", "options": ["<p>Only 1, 2 and 4</p>", "<p>Only 1,2 and 3</p>", "<p>All 1, 2, 3 and 4</p>", "<p>Only 2 and 4<br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option b is the correct answer.             </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">A vote-on-account contains only the expenditure of the government. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Vote on account and interim budget are not the same. A vote-on-account contains only the expenditure of the government whereas the interim budget deals with both receipts and expenditure. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The interim budget gives a complete financial statement and a complete set of accounts consisting of both; expenditures and receipts similar to the full budget. </span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Article 112 deals with the<strong> Annual financial statement</strong>. It says that the President shall in respect of every financial year cause to be laid before both the Houses of Parliament a statement of the estimated receipts and expenditure of the Government of India for that year, in this Part referred to as the <strong>annual financial statement.</strong></span></span></p>"}, {"qid": "", "question": "<p>Intensified Mission Indradhanush 4.0 is related to which ministry?</p>", "options": ["<p>Ministry of Health &amp; Family Welfare</p>", "<p>Ministry of Education</p>", "<p>Ministry of Skill Development &amp; Entrepreneurship</p>", "<p>Ministry of Women and Child Development.</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Mission Indradhanush (MI) was launched by the Ministry of Health and Family Welfare (MOHFW) on 25th December 2014 with the aim of expanding immunization coverage to all children across India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Intensified Mission Indradhanush 4.0 was launched in 2022. It ensure the <strong>Routine Immunization (RI) services reach unvaccinated and partially vaccinated children and pregnant women.  </strong></span></span></li>\r\n</ul>\r\n\r\n<p> </p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Mission Indradhanush </span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Provides <strong>vaccination against 12 Vaccine-Preventable Diseases (VPD)</strong> i.e., diphtheria, Whooping cough, tetanus, polio, tuberculosis, hepatitis B, meningitis and pneumonia, Haemophilus influenzae type B infections, Japanese encephalitis (JE), rotavirus vaccine, pneumococcal conjugate vaccine (PCV) and measles-rubella (MR).</span></span></p>"}, {"qid": "", "question": "<p>Which of the following articles states that &ldquo;The State shall take steps to improve public health and prohibit consumption of intoxicating drinks and drugs that are injurious to health&rdquo;</p>", "options": ["<p>Article 40</p>", "<p>Article 46</p>", "<p>Article 47</p>", "<p>Article 48</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Article 47. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 47</strong>: The State shall take steps to<strong> improve public health</strong> and prohibit consumption of intoxicating drinks and drugs that are injurious to health. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 40</strong>: The State shall take steps to<strong> organise village panchayats</strong> as units of Self Government,</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 46</strong>: The State shall<strong> promote educational and economic interests of the weaker sections</strong> of the people particularly that of the <strong>Scheduled Castes (SCs), Scheduled Tribes (STs)</strong> and <strong>other weaker sections</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 48:</strong> To <strong>prohibit the slaughter of cows, calves and other milch</strong> and draught cattle and to improve their breeds.                                                                   </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Kuki tribes belongs to which state?</p>", "options": ["<p>Madhya Pradesh</p>", "<p>Manipur</p>", "<p>Nagaland</p>", "<p>Sikkim</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Manipur. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Kukis are a multi-tribal ethnic group that live in India&rsquo;s north-eastern regions of Manipur, Mizoram, and Assam, as well as parts of Bangladesh and Myanmar. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>&lsquo;Mim Kut&rsquo;</strong> is the main festival of the Kuki tribe. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Kuki tribe is <strong>majorly found in Manipur</strong> with other states of North Eastern India.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following is/are correct about Jainism?</p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The word &lsquo;Jain&rsquo; is derived from jina or jaina which means the<strong> </strong>&lsquo;Conqueror&rsquo;. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">There were 24 great teachers<strong>,</strong> the first of whom was<strong> </strong>Lord Mahavira. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Three Jewels or Triratna of Jainism are: Right Faith, Right Knowledge and Right Action. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Five Doctrines of Jainism are: Ahimsa, Satya, Asteya, Aparigraha and Brahamcharya. </span></span></li>\r\n</ol>", "options": ["<p>Only 1 and 3</p>", "<p>Only 1, 2 and 4</p>", "<p>Only 1, 3 and 4</p>", "<p>All 1, 2, 3 and 4</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Only Option 2 is incorrect about Jainism. Lord Mahavir was the last i.e. 24th teacher of Jainism. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The word &lsquo;Jain&rsquo; is derived from <strong>jina</strong> or <strong>jaina</strong> which means the<strong> &lsquo;Conqueror&rsquo;. </strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Vardhamana Mahavira, the 24th Tirthankara, was born in 540 B.C. in a village called <strong>Kundagrama</strong> near<strong> Vaishali. </strong>He belonged to <strong>Jnatrika clan</strong> and was connected to the royal family of Magadha.   </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Jainism mainly aims at the attaining of liberation. And it can be attend through Triratna-</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Right Action, Right Knowledge and Right Action. </strong></span></span></li>\r\n</ul>\r\n\r\n<p> </p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Five Doctrines of Jainism. </strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Ahimsa</strong>: Non-injury to living being</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Satya</strong>: Do not speak a lie</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Asteya</strong>: Do not steal</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Aparigraha</strong>: Do not acquire property</span></span></li>\r\n\t<li><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Brahmacharya</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">: Observe continence</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following does not belong to class insecta?<br />\r\n </p>", "options": ["<p>Cockroach</p>", "<p>Mosquito</p>", "<p>Scorpion</p>", "<p>Silverfish<br />\r\n </p>"], "correct": 3, "marks": "1", "explanation": "<p>The correct answer is &lsquo;Scorpion&rsquo;.</p>\r\n\r\n<p>Spiders belong to class Arachnida and they are not included in insects. The insects have antennae and wings. The spiders are arachnids and do not have antenna or wing for flying. The other examples, mosquito, housefly and butterfly possess these characters and so they are included in Insecta.    </p>"}, {"qid": "", "question": "<p>Which of the following statement is Incorrect about the characteristic features of the Indian Desert?<br />\r\n </p>", "options": ["<p>It has sand dunes</p>", "<p>It lies northwest of the Aravalli hills</p>", "<p>It receives 250 mm rainfall per year.</p>", "<p>It is also known as Marusthali</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Indian Desert, also known as the Thar Desert, is a hot desert located in northwest India. It is known for its arid and dry conditions, and it receives very little rainfall. The average annual rainfall in the Thar Desert is much lower than 250 mm, typically ranging from about 100 to 500 mm</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Indian Desert, also known as the Thar Desert, is characterized by extensive sand dunes. These dunes are formed by the wind&#39;s action on sand, resulting in various shapes and sizes of sand formations. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Indian Desert (Thar Desert) is located in the northwestern part of India, to the northwest of the Aravalli mountain range, which runs through the states of Gujarat, Rajasthan, and Haryana. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">The Thar Desert is also known as &quot;Marusthali,&quot; which translates to &quot;Land of the Dead&quot; in Sanskrit. This name reflects the harsh and arid conditions of the desert, making it a challenging place for survival without proper adaptations.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which water-soluble vitamin found in various foods, including liver, milk, eggs and fish, helps to keep your body&rsquo;s blood and nerve cells healthy?</p>", "options": ["<p>Vitamin A</p>", "<p>Vitamin E</p>", "<p>Vitamin C</p>", "<p>Vitamin B12</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Vitamin B12. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Vitamin B12, also known as <strong>cobalamin</strong>, is a <strong>water-soluble vitamin</strong> that is found naturally in certain foods. It is primarily obtained from animal-based sources like liver, milk, eggs, and fish. Vitamin B12 is crucial for maintaining the health of your body&#39;s blood and nerve cells.</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Formation of Red Blood Cells: Vitamin B12 plays a key role in the synthesis of red blood cells. Red blood cells are responsible for carrying oxygen throughout the body, and a deficiency in Vitamin B12 can lead to anemia, where there is a reduced number of red blood cells or a decrease in their ability to carry oxygen.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">DNA Synthesis: Vitamin B12 is involved in the synthesis of DNA, the genetic material in all cells. It is necessary for cell division and growth, making it important for overall health and development.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Nervous System Function: Vitamin B12 is essential for the proper functioning of the nervous system. It helps in the maintenance of myelin, a protective sheath that surrounds nerve fibers, which is crucial for nerve signal transmission. A deficiency in Vitamin B12 can lead to neurological problems, such as tingling sensations, numbness, and difficulty with balance and coordination.</span></span></li>\r\n</ol>"}, {"qid": "", "question": "<p>The Kandariya Mahadeva temple, which is dedicated to Shiva and was constructed in 999 by the Chandela dynasty, is an example of which of the following styles of architecture?</p>", "options": ["<p>Nagara Style</p>", "<p>Ahom Style</p>", "<p>Dravida Style</p>", "<p>Pagoda Style</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Nagara Style.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Kandariya Mahadeva temple is an example of the Nagara style of architecture. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">This style is a prominent form of Hindu temple architecture and is characterized by its distinctive tower (shikhara) with a curvilinear shape, often adorned with intricate carvings and sculptures. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Nagara style of architecture is prevalent in the northern parts of India and is associated with temples dedicated to various deities, including Shiva, Vishnu, and others. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Kandariya Mahadeva temple, constructed by the Chandela dynasty in 999 AD, is one of the finest examples of Nagara-style temples and is located in the Khajuraho group of monuments in Madhya Pradesh, India.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Rajya Sabha has to return the money bill to Lok Sabha with or without the recommendation within ___________.</p>", "options": ["<p>10 days</p>", "<p>30 days</p>", "<p>14 days</p>", "<p>21 days</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is 14 days. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Rajya Sabha, the upper house of the Indian Parliament, has to return a money bill to Lok Sabha (the lower house) with or without its recommendations within 14 days. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Constitution of India specifies this time frame in Article 109 regarding the procedure for a money bill. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Unlike other bills, which can be amended and debated by both houses, a money bill can only be introduced in Lok Sabha, and Rajya Sabha can suggest amendments but cannot reject or amend it. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">If Rajya Sabha does not return the money bill within the specified 14-day period, it is deemed to have been passed by both houses.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following pair of dances belongs to Kerala?</p>", "options": ["<p>Sattriya and Bharatnatyam</p>", "<p>Kathakali and Kuchipudi</p>", "<p>Mohiniyattam and Kathak</p>", "<p>Kathakali and Mohiniyattam</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Kathakali and Mohiniyattam are the dance forms that belong to Kerala.</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Kathakali</strong> is a classical dance-drama form known for its vibrant makeup, elaborate costumes, and expressive movements. It incorporates elements of dance, drama, music, and rituals to portray stories from Hindu epics and mythology.</span></span></li>\r\n</ol>\r\n\r\n<p> </p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Mohiniyattam</strong> is another classical dance form from Kerala, known for its graceful and fluid movements. It is typically performed by women and is characterized by its gentle, swaying movements and storytelling through dance.</span></span></li>\r\n</ol>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The other options:</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">(A) Sattriya is a classical dance form from Assam, while Bharatnatyam is a classical dance form from Tamil Nadu.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">(B) Kuchipudi is a classical dance form from Andhra Pradesh.</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">(C) Mohiniyattam, as mentioned earlier, belongs to Kerala, while Kathak is a classical dance form from North India.</span></span></p>"}, {"qid": "", "question": "<p>Zakir Hussain is renowned for playing the ____________.<br />\r\n </p>", "options": ["<p>Tabla</p>", "<p>Shehnai</p>", "<p>Santoor</p>", "<p>Sitar</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Tabla. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Zakir Hussain is renowned for playing the Tabla. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">He is a world-famous tabla player and percussionist hailing from India. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Zakir Hussain is considered a virtuoso in his field and has made significant contributions to Indian classical music, both as a performer and composer. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">He has received numerous awards and honors for his contributions to music, including the Padma Shri (1988), Padma Bhushan (2002), and Padma Vibhushan (2018) &ndash; some of the highest civilian awards in India.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>What does the &ldquo;Green Revolution&rdquo; refer to in Indian Agriculture?</p>", "options": ["<p>Increase in forest cover</p>", "<p>Increase in land under grassland</p>", "<p>Increase in Agro based industries</p>", "<p>Spectacular increase in production of food grains<br />\r\n </p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The &quot;Green Revolution&quot; in Indian Agriculture refers to a period of significant agricultural advancement and modernization that took place in India during the 1960s and 1970s. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The primary focus of the Green Revolution was to increase the production of food grains, particularly wheat and rice, to address the growing food crisis in the country.</span></span><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">             </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">The key components of the Green Revolution in India included the adoption of <strong>high-yielding varieties (HYVs) of seeds</strong>, <strong>increased use of fertilizers and pesticides</strong>, better irrigation practices, and <strong>agricultural research</strong> and extension services to disseminate modern farming techniques to farmers.</span></span>   </li>\r\n</ul>"}, {"qid": "", "question": "<p>What is another name for centre-seeking force?<br />\r\n </p>", "options": ["<p>Centrifugal</p>", "<p>Van der Waals</p>", "<p>Gravitational</p>", "<p>Centripetal</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Another name for center-seeking force is &quot;centripetal force.&quot; </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Centripetal Force</strong>: This force acts towards the center of rotation or the axis of circular motion, keeping an object moving in a circular path. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">It is responsible for maintaining the object&#39;s direction and preventing it from moving in a straight line tangent to the circular path. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The centripetal force is essential for keeping objects in orbits, such as planets orbiting around the sun or satellites orbiting around the Earth. </span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Centrifugal Force</strong>: Centrifugal force is the apparent <strong>outward force on a mass when it is rotated.   </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Vanderwalls force: </strong>Van der Waals forces are weak intermolecular forces that are dependent on the distance between atoms or molecules. These forces arise from the interactions between uncharged atoms/molecules.<strong> </strong></span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Gravitational force: </span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Gravitation or gravity is the force of attraction between any two bodies.</span></span></p>"}, {"qid": "", "question": "<p>Peeling, cutting or crushing onion tissue releases which enzyme that makes our eyes water?</p>", "options": ["<p>Alliinases</p>", "<p>Bordelaises</p>", "<p>Pectinases</p>", "<p>Xylanases<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Peeling, cutting, or crushing onion tissue releases an enzyme called alliinase. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Alliinase is responsible for converting the sulfur-containing compounds present in onions, such as alliin, into sulfenic acids. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">These sulfenic acids, in turn, react with other substances to produce a volatile compound called syn-propanethial-S-oxide. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">When this compound comes into contact with the eyes, it causes irritation and leads to the familiar sensation of tearing or watering of the eyes while cutting onions.</span></span></li>\r\n</ul>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Pectinases</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">: Pectinase is used in the extraction, clarification, filtration, and depectinization of fruit juices and wines by enzymatically breaking down the cell wall, and for the maceration of fruits and vegetables and removal of the inner wall of lotus seed, garlic, almond, and peanut. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following women personalities has the honour of being a &lsquo;Double Medalist&rsquo; at the Olympics?</p>", "options": ["<p>Saina Nehwal</p>", "<p>P V Sindhu</p>", "<p>Sakshi Malik</p>", "<p>Karnam Malleswari</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is P V Sindhu. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Indian badminton ace <strong>PV Sindhu</strong> is the only Indian woman to have won multiple medals at the Olympics - a <strong>silver medal</strong> in women&#39;s singles at <strong>Rio 2016</strong> and a <strong>bronze</strong> at <strong>Tokyo 2020</strong>. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Karnam Malleswari</strong> is an Indian weightlifter who won a bronze medal at the 2000 Sydney Olympics in the 69 kg weight category, becoming the <strong>first Indian woman to win an Olympic medal. </strong></span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Saina Nehwal</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\"> is the <strong>first-ever badminton</strong> player from India to clinch an Olympic medal. The Indian shuttler created history when she won the <strong>bronze medal at the London 2012 Games.</strong></span></span></p>"}, {"qid": "", "question": "<p>Who among the following founded the Asiatic Society in 1784 in Calcutta?</p>", "options": ["<p>Warren Hastings</p>", "<p>Charles Eyre</p>", "<p>Jonathan Duncan</p>", "<p>William Jones</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is William Jones. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">William Jones founded the Asiatic Society in 1784 in Calcutta. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">He was a British philologist, Orientalist, and judge who made significant contributions to the study of ancient Indian languages, culture, and history. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Asiatic Society of Bengal, as it was initially known, played a crucial role in promoting research and scholarship on Asian cultures, languages, and literature.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">The organisation was mainly concerned with studying Hindu culture and philosphy, as well as examining the importance of the Sanskrit language</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following Articles of the Constitution of India lays down the maximum strength of the Rajya Sabha as 250?</p>", "options": ["<p>Article 83</p>", "<p>Article 81</p>", "<p>Article 85</p>", "<p>Article 80</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Article 80. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Article 80 of the Constitution of India lays down the maximum strength of the Rajya Sabha as 250 members. </span></span></li>\r\n</ul>\r\n\r\n<p> </p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Rajya Sabha, also known as the Council of States, is the upper house of the Indian Parliament. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">It is a permanent body, not subject to dissolution, and its members are elected by the members of the State Legislative Assemblies through a system of indirect elections. </span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 83</strong>: It states that the term of the Lok Sabha will be five years from the date of its first sitting. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong>Article 81</strong>: Article 81 of the Indian Constitution defines the makeup of the House of The people, Lok Sabha. The House of Representatives shall have no more over 550 members elected, with little than 20 from Territories. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Article 80</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">: Article 80 of the Indian Constitution specifies the Composition of the Council of States. According to Article 80, the Council of States shall consist of: Twelve members are to be nominated by the President. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following is NOT a Constitutional Body in India?</p>", "options": ["<p>Election Commission of India</p>", "<p>State Human Rights Commission</p>", "<p>Union Public Service Commission of India</p>", "<p>State Public Service Commission</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option b is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">State Human Rights Commission is NOT a Constitutional Body in India. It is a <strong>statutory body, not mentioned in the Constitution.</strong> </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The State Human Rights Commissions are established under the Protection of Human Rights Act, 1993, at the state level <strong>to promote and protect human rights within their respective states. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">On the other hand, all the other options mentioned, such as the <strong>Election Commission of India, Union Public Service Commission, and State Public Service Commission</strong>, are Constitutional Bodies as they are <strong>explicitly mentioned in the Constitution of India and derive their powers and functions directly from it.</strong></span></span></p>"}, {"qid": "", "question": "<p>Who among the following founded the Depressed Classes Association, in 1930?</p>", "options": ["<p>Jaiprakash Narayan</p>", "<p>Mahatma Gandhi</p>", "<p>Dr. BR Ambedkar</p>", "<p>Swami Sahajanand Saraswati</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Dr. BR Ambedkar. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Dr. BR Ambedkar founded the Depressed Classes Association in 1930. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The organization was formed to advocate for the rights and upliftment of the socially and economically marginalized sections of society, who were referred to as the &quot;Depressed Classes&quot; during that time. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:12.0pt\">Important information about Dr. Bhimrao Ambedkar: </span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Popularly known as <strong>Baba Saheb</strong>. He was the Chairman of the Drafting Committee of the Constituent Assembly and is called the &lsquo;<strong>Father of the Indian Constitution&rsquo;.</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"> </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Born into a caste that was considered <strong>untouchable</strong>, he faced many injustices and discrimination in society. He was born in Mhow in the Central Provinces (modern-day Madhya Pradesh) to a Marathi family with roots in the Ambadawe town of Ratnagiri, Maharashtra. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">He established the Bahishkrit Hitakarini Sabha to promote education and socio-economic improvements among the Dalits. </span></span></li>\r\n</ul>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">He advocated separate electorates for the &lsquo;Depressed Classes&rsquo;</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">, the term with which Dalits were called at that time. He was in disagreement with <strong>Mahatma Gandhi at that time since Gandhi was against any sort of reservation in the electorates.</strong> When the British government announced the &lsquo;Communal Award&rsquo; in 1932, Gandhi went on a fast in Yerwada Jail. <strong>An agreement was signed between</strong> <strong>Gandhi and Ambedkar in the jail</strong> <strong>whereby it was agreed to give reserved seats to the depressed classes within the general electorate.</strong> <strong>This was called the</strong> <strong>Poona Pact. </strong></span></span></p>"}, {"qid": "", "question": "<p>Who is the author of book titled &ldquo;Freedom in Exile&rdquo;?</p>", "options": ["<p>Salman Rushdie</p>", "<p>Dalai Lama</p>", "<p>Ruskin Bond</p>", "<p>L.K Advani</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is Dalai Lama.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">&quot;<strong>Freedom in Exile</strong>&quot; is a book written by the <strong>14th Dalai Lama, Tenzin Gyatso</strong>. The book is his autobiography and provides insights into his life, his struggles, and his experiences in exile after he fled from Tibet in 1959. It delves into the Dalai Lama&#39;s spiritual journey, his leadership of the Tibetan people, and his efforts to promote peace and compassion worldwide. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:14.0pt\">Salman Rushdie books</span></strong><strong><span style=\"font-size:12.0pt\">: </span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Satanic City, Midnight Children, Victory City, Quichotte, The Golden House. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\"><strong><span style=\"font-size:14.0pt\">Ruskin Bond books: </span></strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Blue Umbrella, The Room on the Roof, The Golden years, Angry River, etc. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">L.K. Advani Book&mdash;My Country My Life. </span></span></strong></p>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>16, 20, 36, 72, ?</span></p>", "options": ["<span> 134</span>", "<span> 146</span>", "<span> 144</span>", "<span> 136</span>"], "correct": 4, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711530821589_image001.png\" width=\"189\" height=\"245\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Find the number among the following which is different from others.</span>", "options": ["<span> 549</span>", "<span> 279</span>", "<span> 639</span>", "<span> 159</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>Except (d) “159”. All ar logically follows from the statement.</span><p><span>Statements: The distance of 800 km by road between Delhi and Jharkhand be reduced to 280 km by Railways. This will lead to a saving of Rs. 6.65 crores per annum on fuel.</span></p><p><span>Conclusions:</span></p><p><span>I. Transportation by Highway is cheaper than by Railways.</span></p><p><span>II Fuel must be saved to the greatest extent.</span></p>", "options": ["<span> Only conclusion I follows</span>", "<span> Only conclusion II follows</span>", "<span> Neither I nor II follows</span>", "<span> Both I and II follow.</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>According to the statement, railways transport is cheaper than road transport in the case of route from Delhi to Jharkhand, not in all the cases. So, conclusion I does not follow. The statement stresses on the saving of fuel. So, conclusion II follows.</span></p>"}, {"qid": "", "question": " <span> In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct answer.</span><p><span>I. Standard of living among the middle-class society is constantly going up since past</span><span>  </span><span>five years.</span></p><p><span>II. Indian Economy is observing remarkable growth.</span></p>", "options": ["<span> Statement I in the cause and statement II is its effect.</span>", "<span> Statement II is the cause and statement I is its effect.</span>", "<span> Both the statements I and II are effects of independent causes.</span>", "<span> Both I and II are independent causes.</span>"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><span>Since the standard of living among the middle-class society is constantly going up so Indian economy is observing remarkable growth.</span></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
