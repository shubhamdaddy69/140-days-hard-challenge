ly:'Cambria Math'\">. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This marks his </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fifth term</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> as the chairman of the council, showing strong confidence from the apparel export industry in his leadership. </span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">He succeeded </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sudhir Sekhri</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and is also known as the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">founder of Poppys Knitwear Pvt Ltd</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, a major knitwear export company. </span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which country has banned social media nationally for children under the age of 16 in February 2026?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Finland</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Australia</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Spain</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Germany</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (b) Australia</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Australia</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> became the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first country to implement a nationwide ban on social media for children under 16</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, which began taking effect in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">February 2026</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The law requires social media platforms such as Instagram, TikTok, and Snapchat to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">prevent users under 16 from creating accounts</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The objective of this policy is to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">protect children from online harm, cyberbullying, and mental health issues linked to excessive social media use</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following articles of the Indian Constitution provides Provisions as to introduction and passing of Bills in parliament?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 101</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 105</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 107</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Article 103</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Article 107</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 107 of the Indian Constitution</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> deals with the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">provisions relating to the introduction and passing of Bills in Parliament</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It states that a Bill may originate in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">either House of Parliament (Lok Sabha or Rajya Sabha)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, except Money Bills which can originate only in Lok Sabha.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The Article also explains the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">procedure for passing a Bill in both Houses before it is sent to the President for assent</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">\"A king cannot survive without soldiers. And soldiers cannot survive without salary.\" Who among the following wrote the above sentence in the context of Delhi Sultanate in the thirteenth century?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fakhr-i Mudabbir</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Minhaj-us-Siraj</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ziauddin Barani</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Abul Fazl</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (a) Fakhr-i Mudabbir</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The statement about the importance of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">soldiers and their salaries for the survival of the king</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was written by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Fakhr-i Mudabbir</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in the context of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Delhi Sultanate in the 13th century</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Fakhr-i Mudabbir was a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Persian historian and political writer</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> who served the early Delhi Sultans.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">He wrote the work </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Adab-ul-Harb wa-al-Shujaʿat”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, which discusses </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">military organisation, administration, and duties of rulers and soldiers</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">His writings emphasised that a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">stable army supported by regular payment is essential for maintaining political authority and the state</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the first step in the break-down of glucose in all organisms?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conversion of glucose into carbon dioxide and water</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conversion of pyruvate into ethanol</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Break-down of glucose into pyruvate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Conversion of pyruvate into lactic acid</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Break-down of glucose into pyruvate</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first step of glucose breakdown in all organisms is glycolysis</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, in which </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">glucose (6-carbon molecule) is broken down into two molecules of pyruvate (3-carbon molecules)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This process occurs in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">cytoplasm of the cell</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and does </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">not require oxygen</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, so it happens in both aerobic and anaerobic organisms.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The pyruvate formed may further convert into </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">CO₂ and water (aerobic respiration)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> or into </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">ethanol or lactic acid (anaerobic respiration)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> depending on the organism.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What is the sequence of stages involved in the budding process of hydra? </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bud maturation → Bud initiation → Bud detachment → New individual</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New individual → Bud maturation → Bud detachment → Bud initiation</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bud initiation → Bud detachment → Bud maturation → New individual</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bud initiation → Bud maturation → Bud detachment → New individual</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) Bud initiation → Bud maturation → Bud detachment → New individual</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hydra</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, reproduction occurs by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">budding</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, which is a type of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">asexual reproduction</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">First, a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">small outgrowth (bud) forms on the body wall of the parent Hydra</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, known as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">bud initiation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The bud </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">grows and develops tentacles and mouth</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, which is called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">bud maturation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Finally, the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mature bud detaches from the parent body</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and becomes a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">new independent individual</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Consider the following statements and select the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement A: Baking soda is a mild non-corrosive basic salt.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement B: It can neutralise acids and relieve stomach acidity. </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement A is incorrect but B is correct.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements A and B are incorrect.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements A and B are correct.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement A is correct but B is incorrect.</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Both statements A and B are correct.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Baking soda (Sodium hydrogen carbonate – NaHCO₃)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mild basic salt</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">non-corrosive</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, unlike strong bases such as sodium hydroxide.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Because of its </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">weak basic nature</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, it can </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">neutralise excess acid in the stomach</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Hence, it is used as an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">antacid to relieve stomach acidity and indigestion</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What does the Laffer Curve in economics suggest?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Lower taxes always increase government revenue.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Tax revenue is independent of tax rates.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Higher taxes always raise government revenue.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">There exists an optimal tax rate that maximises revenue.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) There exists an optimal tax rate that maximises revenue.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Laffer Curve</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> illustrates the relationship between </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tax rates and government tax revenue</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It suggests that </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">both extremely low and extremely high tax rates generate lower revenue</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, because very high taxes discourage work, investment, and production.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Therefore, there exists an </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">optimal tax rate at which government revenue is maximised</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The concept was popularised by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">economist Arthur Laffer</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">According to the new system of justice established by the British in 1772, which of the following courts was to be there in every district?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. Faujdari court</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Diwani court</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Both I and II</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1772, Warren Hastings introduced a new judicial system</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in Bengal as part of his administrative reforms.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Under this system, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">two types of courts were established in every district</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">: </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Diwani Adalat</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">civil cases</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> such as revenue, property, and marriage disputes.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Faujdari Adalat</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was set up for </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">criminal cases</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, dealing with crimes and punishments.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This reform aimed to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">organise and regulate the judicial administration under British control</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The blending of Greek and Indian art led to the development of ____________ art which developed later.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Vaishali</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Amaravati</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mathura</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gandhara</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) Gandhara</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gandhara art</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> developed due to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fusion of Greek (Hellenistic) and Indian artistic traditions</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> after the invasions of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Alexander and the Indo-Greek rulers</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It flourished mainly during the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Kushan period (1st–4th century CE)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in regions of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">present-day Pakistan and Afghanistan</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Gandhara art is especially known for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">first human-like images of Buddha</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, showing </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Greek-style drapery, curly hair, and realistic features</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This style represents a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">unique cultural synthesis of Western and Indian artistic elements</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following is a typical example of Revenue Expenditure?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Construction of a railway terminal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Purchase of land for a PSU facility</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Interest paid on a government loan</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Funding a national highway project</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Interest paid on a government loan</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Revenue expenditure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> refers to government spending that </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">does not create assets or reduce liabilities</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and is used for the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">normal functioning of government operations</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Interest paid on government loans</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a regular payment obligation and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">does not create any physical asset</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, so it is classified as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">revenue expenditure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In contrast, activities like </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">construction of infrastructure or purchase of land</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> lead to asset creation and are treated as </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">capital expenditure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Coriolis force is responsible for deflecting winds towards the right in the northern hemisphere and towards the left in the southern hemisphere, this is known as:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ferrel's Law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Wagner's law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Homes's law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Davis's law</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (a) Ferrel's Law</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ferrel's Law</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> explains the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">deflection of moving objects such as winds and ocean currents due to the Earth's rotation</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">According to this law, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">winds are deflected to the right in the Northern Hemisphere and to the left in the Southern Hemisphere</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> because of the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Coriolis force</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This concept is important in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">meteorology and climatology</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for understanding global wind systems and cyclonic movements.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The law is named after the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">American meteorologist William Ferrel</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statement is correct regarding westerlies?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. It is found between sub-tropical high pressure belt and sub-polar low pressure belt.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. It is a local wind.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (a) Only I</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Westerlies</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> are </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">permanent planetary winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> that blow from the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sub-tropical high-pressure belt (around 30° latitude)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> towards the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sub-polar low-pressure belt (around 60° latitude)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">They generally </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">blow from west to east</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in both hemispheres due to the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Coriolis effect</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Statement II is incorrect because </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">westerlies are global winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">local winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (local winds include Loo, Chinook, Foehn etc.).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Therefore, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">only Statement I is correct</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statement regarding the fundamental rights of the Indian constitution is correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. Article 26 is related Freedom from Taxation for Promotion of a Religion</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">II. Article 27 is related to freedom to manage religious affairs.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I and II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither I nor II</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) Neither I nor II</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 26</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> actually provides the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">freedom to manage religious affairs</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, allowing religious denominations to manage their own institutions and property.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Article 27</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> provides </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">freedom from taxation for promotion of any particular religion</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, meaning citizens cannot be forced to pay taxes for the promotion of a specific religion.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In the question, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">both statements are interchanged</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, so both statements are incorrect.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Hence, the correct option is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Neither I nor II</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When is total revenue maximized in relation to elasticity?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When elasticity is greater than one</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When elasticity is less than one</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When marginal cost equals marginal revenue</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">When elasticity equals one</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (d) When elasticity equals one</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Total revenue (TR)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> depends on </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">price elasticity of demand (PED)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">When </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">elasticity equals one (unitary elasticity)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the percentage change in price and quantity demanded are equal.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">At this point, </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">total revenue reaches its maximum level</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, because any change in price will not increase total revenue further.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">If elasticity is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">greater than one</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, reducing price increases revenue; if </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">less than one</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, increasing price increases revenue.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">'Rathawa' dance, associated with the Rathwa tribe, is a traditional folk dance of which Indian state?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Rajasthan</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gujarat</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mizoram</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer: (c) Gujarat</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rathawa Dance</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a traditional </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">tribal folk dance</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> performed by the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rathwa tribe</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rathwa tribe mainly lives in Gujarat</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, especially in the districts of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Chhota Udepur and Panchmahal</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This dance is usually performed during </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">festivals, rituals, and community celebrations</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and is closely connected with the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Pithora painting tradition</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> of the tribe.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Therefore, the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Rathawa dance is associated with the state of Gujarat</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In Haripala's \"Sangeeta Sudhakara\", written in the________ century A.D., the terms Carnatic and Hindustani are found for the first time.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">6</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">14</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">18</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (b) 14</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Sangeeta Sudhakara was written by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Haripala</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">14th century A.D.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It is an important </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">treatise on Indian classical music</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">In this work, the terms </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Carnatic” and “Hindustani”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> are mentioned </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">for the first time</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, indicating the gradual distinction between the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">southern and northern styles of Indian classical music</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math' ria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> (c) Bhisham Sahni</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Tamas is a famous </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Hindi novel written by Bhisham Sahni</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, published in </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">1974</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The novel depicts the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">communal violence and social tensions during the Partition of India in 1947</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It received the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sahitya Akademi Award in 1975</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> for its powerful portrayal of human suffering during partition.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Tamas was later </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">adapted into a well-known television series directed by Govind Nihalani</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in the late 1980s.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Choose the word that is most similar in meaning to the word</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">\"Vulnerable\"</span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Strong</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Defenseless</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Secure</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Protected</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Vulnerable</span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">open to harm, attack, or damage; easily hurt or affected</span><span style=\"font-family:'Nirmala UI'\"> (असुरक्षित, कमजोर स्थिति में).</span><br><span style=\"font-family:'Nirmala UI'\">Among the options, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Defenseless</span><s irmala UI'\">Correct sentence:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">If the scientist observes the reaction carefully, the results become clearer.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which of the following idiom given in the alternatives has the meaning?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">To be very pleased, delighted, or amused.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Be in the pink</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Tickled pink</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">See pink elephants</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">See pink spiders</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer:</span><span style=\"font-family:'Nirmala UI'\"> (b) Tickled pink</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The idiom </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“tickled pink”</span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">to be extremely pleased, delighted, or amused</span><span style=\"font-family:'Nirmala UI'\"> (बहुत खुश या प्रसन्न होना).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Meaning of other options: \"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Appropriate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Lend</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer:</span><span style=\"font-family:'Nirmala UI'\"> (d) Lend</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Borrow</span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">to take something from someone with the intention of returning it later</span><span style=\"font-family:'Nirmala UI'\"> (उधार लेना).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The opposite is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Lend</span><span style=\"font-family:'Nirmala UI'\">, which means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">to give something to someone temporarily with the expectation that it will be returned</span><span style=\"font-family:'Nirmala UI'\"> (उधार देना).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Meaning of other options:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Entrust</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> – to give responsibility to someone (सौंपना).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Usurp</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> – to seize power illegally (अवैध रूप से अधिकार छीन लेना).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Appropriate</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> – to take something for one’s own use, often wrongly (अपने उपयोग के लिए ले लेना).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Lend</span><span style=\"font-family:'Nirmala UI'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Select the option with the correct spelling that can replace the underlined word in the given sentence. If the spelling in the given sentence is already correct, choose Option “No replacement required.”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The scientist’s </span><span style=\"text-decoration:underline;font-family:'Nirmala UI'\">meticulus</span><span style=\"font-family:'Nirmala UI'\"> approach ensured that every detail of the experiment was recorded accurately.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">meticilus</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">meticulous</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">meticulious</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">No replacement required</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer:</span><span style=\"font-family:'Nirmala UI'\"> (b) </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">meticulous</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span><br><span style=\"font-family:'Nirmala UI'\">The correct spelling is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">meticulous</span><span style=\"font-family:'Nirmala UI'\">, which means </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">very careful and precise about details</span><span style=\"font-family:'Nirmala UI'\"> (बहुत सावधानीपूर्वक और सूक्ष्मता से काम करने वाला).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Correct sentence:</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The scientist’s meticulous approach ensured that every detail of the experiment was recorded accurately.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A sentence is provided in indirect speech. From the four given options, choose the one that most accurately conveys the sentence in its corresponding direct speech.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The archivist declared that, unless the humidity controls were recalibrated, the papyri could deteriorate beyond salvage.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The archivist declared, \"Unless the humidity controls are recalibrated, the papyri could deteriorate beyond salvage.\"</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The archivist declared, \"If humidity controls were recalibrated, papyri would deteriorate.\"</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The archivist declared, \"Unless humidity controls were recalibrated, the papyri could deteriorate beyond salvage.\"</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The archivist declared, \"Unless humidity controls were recalibrated, papyri can get deteriorated beyond salvage.\"</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Answer:</span><span style=\"font-family:'Nirmala UI'\"> (a) The archivist declared, \"Unless the humidity controls are recalibrated, the papyri could deteriorate beyond salvage.\"</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">In </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">indirect speech</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, the tense often shifts to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">past</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> due to the reporting verb (declared).</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">When converting back to </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">direct speech</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, the statement inside quotation marks usually returns to the </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">original present or future sense</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Therefore </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“were recalibrated” </span><span style=\"font-family:Arial;font-size:12pt;font-weight:bold\">→</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\"> “are recalibrated”</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> in direct speech.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Why other options are incorrect:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">(b)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> changes the meaning by replacing </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">unless</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> with </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">if</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> and altering the result.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">(c)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> keeps past tense and removes </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, making it less accurate.</span></li><li style=\"margin-left:9.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">(d)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> is grammatically incorrect (</span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">can get deteriorated</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">).</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> Hence, the most accurate direct speech is </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Option (a)</span><span style=\"font-family:'Nirmala UI'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Choose the option that contains the homonym of the highlighted word in the given sentence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The teacher asked the student to </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">present</span><span style=\"font-family:'Nirmala UI'\"> a short summary of the chapter in front of the class.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The manager will present the annual report to the board of directors tomorrow.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">She received a beautiful present from her friend on her birthday.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The students were present in the classroom during the inspection.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-si
