<html lang="en">
<head>

<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Live Mock 7 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Each of the digits in the number 7492615 is arranged in descending order from left to right. What will be the sum of the digits which are first from the left and first from the right in the new number thus formed?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">8</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">10</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">12</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">14</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Digits of the number: 7, 4, 9, 2, 6, 1, 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Arranged in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">descending order</span><span style=\"font-family:'Cambria Math'\">:</span><br><span style=\"font-family:'Cambria Math'\">9, 7, 6, 5, 4, 2, 1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">New number formed: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">9765421</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">First digit from the left = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">9</span><br><span style=\"font-family:'Cambria Math'\">First digit from the right = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Required sum = 9 + 1 = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">10</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">What should come in place of the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">84, 86, 91, 93, 98, 100, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">105</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">103</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">102</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">107</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pattern: +2, +5, +2, +5, +2, +5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">84 → 86 (+2)</span><br><span style=\"font-family:'Cambria Math'\">86 → 91 (+5)</span><br><span style=\"font-family:'Cambria Math'\">91 → 93 (+2)</span><br><span style=\"font-family:'Cambria Math'\">93 → 98 (+5)</span><br><span style=\"font-family:'Cambria Math'\">98 → 100 (+2)</span><br><span style=\"font-family:'Cambria Math'\">100 → 105 (+5)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Required answer = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">105</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span><br><span style=\"font-family:'Cambria Math'\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits.)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(486, 9, 6)</span><br><span style=\"font-family:'Cambria Math'\">(245, 7, 5)</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(330, 8, 5)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(256, 8, 4)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(512, 8, 9)</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(729, 9, 8)</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Logic: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">First number = (Second number)² × Third number</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Check given sets:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">486 = 9² × 6 = 81 × 6</span><br><span style=\"font-family:'Cambria Math'\">245 = 7² × 5 = 49 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Now check options:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">(a) 8² × 5 = 64 × 5 = 320 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> (not 330)</span><br><span style=\"font-family:'Cambria Math'\">(b) 8² × 4 = 64 × 4 = 256 </span><span style=\"font-family:'Symbol'\">✔</span><br><span style=\"font-family:'Cambria Math'\">(c) 8² × 9 = 64 × 9 = 576 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> (not 512)</span><br><span style=\"font-family:'Cambria Math'\">(d) 9² × 8 = 81 × 8 = 648 </span><span style=\"font-family:'Segoe UI Emoji'\">❌</span><span style=\"font-family:'Cambria Math'\"> (not 729)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, correct answer is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">(b) (256, 8, 4)</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In the following series, only one letter-cluster is incorrect. Select the INCORRECT letter-cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">KPU, PUZ, UZE, ZEJ, EJO, JOS,</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">JOS</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8 mbria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Statement </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">II</span><span style=\"font-family:'Cambria Math'\"> states that </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Government-run educational institutes</span><span style=\"font-family:'Cambria Math'\"> have kept their course fees </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">unchanged despite the increase in inflation</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both statements describe decisions taken by </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">different types of institutions (private and government)</span><span style=\"font-family:'Cambria Math'\">. Neither statement is the cause or effect of the other. Each statement simply presents the outcome of its own situation, and there is </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">no direct cause–effect relationship</span><span style=\"font-family:'Cambria Math'\"> between them.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">both the statements (I) and (II) are independent effects.</span><span style=\"font-family:'Cambria Math'\"> (Option 3) </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In a class, A's rank is 12th from the top, and B's rank is 15th from the bottom. If there are 8 students between A and B, what is the maximum number of students in the class yle=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Financial Reforms and Banking Mandate</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Federal Revenue and Borrowing Mechanism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Foreign Reserve and Balance Management</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Fiscal Responsibility and Budget Management</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fiscal Responsibility and Budget Management</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Detailed Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">FRBM Act</span><span style=\"font-family:'Cambria Math'\">, or </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Fiscal Responsibility and Budget Management Act, 2003</span><span style=\"font-family:'Cambria Math'\">, is a law enacted by the Government of India with the following key objectives:</span></p><ol type=\"1\"><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Control Fiscal Deficit:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;line-height:108%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The Act aims to reduce the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">fiscal deficit</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> (the gap between government expenditure and revenue) to ensure the government does not overspend.</span></li></ul></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Promote Fiscal Discipline:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;line-height:108%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">It requires the government to </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">follow responsible financial management practices</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, avoiding excessive borrowing and maintaining sustainable debt levels.</span></li></ul></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Enhance Transparency and Accountability:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;line-height:108%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The government must </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">present its fiscal targets and outcomes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> clearly in the budget documents, allowing Parliament and the public to track financial health.</span></li></ul></li><li style=\"margin-left:14.11pt;margin-bottom:8pt;line-height:108%;padding-left:3.89pt;font-family:'Cambria Math';font-size:12pt\"><span style=\"font-weight:bold\">Medium-Term Budget Framework:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;line-height:108%;padding-left:7pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The Act mandates setting </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">rolling targets for deficits, debt, and expenditure</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, usually over 3–5 years, to maintain long-term fiscal stability.</span></li></ul></li></ol><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Key Features:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Limit fiscal deficit to a percentage of GDP (originally 3%).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Maintain revenue deficit at a sustainable level.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Introduce </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">medium-term fiscal policy statements</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Encourage better public financial management.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Deccan Traps are associated with which type of rock?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Sedimentary</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Igneous</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Metamorphic</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Limestone</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Igneous</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Deccan Traps</span><span style=\"font-family:'Cambria Math'\"> in western India are formed from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">extensive volcanic eruptions</span><span style=\"font-family:'Cambria Math'\"> that occurred around 66 million years ago. The lava from these eruptions </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">cooled and solidified into basalt</span><span style=\"font-family:'Cambria Math'\">, which is an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">igneous rock</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Sedimentary rocks</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> form from deposited material (like sandstone or shale).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Metamorphic rocks</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> form when existing rocks are altered by heat and pressure (like marble or slate).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Limestone</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is a type of sedimentary rock, so it is incorrect in this context.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Ten Percent Law' regarding the transfer of energy in a food chain was proposed by:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Raymond Lindeman</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Ernst Haeckel</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Charles Darwin</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Gregor Mendel</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Raymond Lindeman</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Ten Percent Law”</span><span style=\"font-family:'Cambria Math'\"> in ecology states that </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">only about 10% of the energy at one trophic level is transferred to the next level</span><span style=\"font-family:'Cambria Math'\"> in a food chain, while the rest is lost largely as heat or used in metabolic processes.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">This concept was proposed by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Raymond Lindeman</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> in 1942 based on his studies of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">energy flow in ecosystems</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Ernst Haeckel</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> was a biologist known for coining the term </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“ecology”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Charles Darwin</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> formulated the theory of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">natural selection</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Gregor Mendel</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is the father of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">genetics</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, known for his work on inheritance in pea plants.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which of the following statements about 'Katabatic Winds' is correct?</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1. They are warm winds that blow up a mountain slope during the day.</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2. They are cold, dense winds that flow down a valley or slope at night due to gravity.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Neither 1 &amp; 2</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">2 only</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Katabatic winds</span><span style=\"font-family:'Cambria Math'\"> are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">cold, dense winds</span><span style=\"font-family:'Cambria Math'\"> that flow </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">downhill or along a valley at night</span><span style=\"font-family:'Cambria Math'\"> under the influence of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">gravity</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">They are formed when the air at higher elevations cools, becomes denser, and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">sinks down slopes or valleys</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">The first statement is incorrect because warm winds that blow </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">up a slope during the day</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> are called </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">anabatic winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, not katabatic winds.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So only statement 2 accurately describes katabatic winds.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seraikella, Mayurbhanj, and Purulia are the three styles of which Indian Dance?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihu</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Pandavni</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Suwa</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Chhau</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chhau</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Seraikella, Mayurbhanj, and Purulia</span><span style=\"font-family:'Cambria Math'\"> are the three main </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">styles of Chhau dance</span><span style=\"font-family:'Cambria Math'\">, a traditional </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">folk dance of eastern India</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Seraikella Chhau</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – Originates in Jharkhand; known for </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">graceful movements</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">mask usage</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mayurbhanj Chhau</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – Originates in Odisha; performed </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">without masks</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, emphasizing </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">martial and acrobatic movements</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Purulia Chhau</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – Originates in West Bengal; features </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">colorful masks and vigorous movements</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The 'Mango Showers' are common in which states?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Punjab &amp; Haryana</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Bihar &amp; Bengal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Kerala &amp; Karnataka</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Odisha &amp; Andhra</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala &amp; Karnataka</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Mango Showers”</span><span style=\"font-family:'Cambria Math'\"> refer to the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">pre-monsoon rains</span><span style=\"font-family:'Cambria Math'\"> that occur in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">April–May</span><span style=\"font-family:'Cambria Math'\"> in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">southern India</span><span style=\"font-family:'Cambria Math'\">, especially in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala and Karnataka</span><span style=\"font-family:'Cambria Math'\">.</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">These showers are called “Mango Showers” because they </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">help in the early ripening of mangoes</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">They are caused by </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">southwest monsoon winds</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and local convectional rainfall during the hot summer months.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Other states listed (Punjab, Haryana, Bihar, Bengal, Odisha, Andhra) do not typically experience these pre-monsoon showers.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">In which part of the plant cell does Dark Reaction of photosynthesis take place?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Grana</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Stroma</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line- %;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Grana</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – contain thylakoid membranes where the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">light reactions</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> occur.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Vacuole</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – stores water and nutrients; not involved in photosynthesis.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Mitochondria</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – site of cellular respiration, not photosynthesis.</span></li></ul>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Unemployment caused by a mismatch between worker skills and jobs available is:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Frictional</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seasonal</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Structural </span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Cyclical</span></p>"], "corre mmunity participation.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">With reference to the Sangam administration, the term 'Enadi' referred to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The title bestowed on army captains</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Council of Ministers</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The tax collectors of the Chola kingdom</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The village headmen in the Pandya region</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">The title bestowed on army captains</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">In the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sangam age</span><span style=\"font-family:'Cambria Math'\">, the title </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Enadi”</span><span style=\"font-family:'Cambria Math'\"> was given as an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">honorific title to captains of the army or selected military commanders</span><span style=\"font-family:'Cambria Math'\">. It was not a term for council members, tax collectors, or village headmen — rather, it denoted </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">distinguished warriors who led troops in battle</span><span style=\"font-family:'Cambria Math'\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Chief Election Commissioner can be removed from office in a manner similar to:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Vice-President</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Judge of the Supreme Court</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Attorney General</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The Governor</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The correct answer is: </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Judge of the Supreme Court</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span><br><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chief Election Commissioner (CEC)</span><span style=\"font-family:'Cambria Math'\"> of India can be removed from office </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">onl ize:12pt;font-family:'Cambria Math'\">While Thumri developed in the </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Lucknow and Benaras Gharanas</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, it reached its </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">zenith under the patronage of Wajid Ali Shah</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, the last Nawab of </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Awadh (Lucknow)</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, in the 19th century.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Wajid Ali Shah was a </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">great connoisseur and patron of music and dance</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">, particularly promoting Thumri, Kathak, and other cultural arts.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">Other rulers:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Akbar</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> – Patron of Dhrupad and classical music.</span></li><li style=\"margin-left:29pt;margin-bottom:8pt;padding-left:7pt\"><span style=\"line-height:108%;font-size:12pt;font-we
