<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 17 - Hindi</h1>

        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>

=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693637362135_html_bd963716e0dd8d01.png\" width=\"345\" height=\"449\" > </p>"}, {"qid": "", "question": " <p>     Ram is 10 times as good workman as Shyam. If Shyam can complete a     work in 88 days. In how many days they can complete the work     together.</p>     <p><br>      </p>", "options": [" <p>     11</p>", " <p>     10</p>", " <p>     8 4/5</p>", " <p>     8</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693637362135_html_86a609d48bb69a9c.png\" width=\"414\" height=\"395\" > </p>"}, {"qid": "", "question": "On ौिधिing 26 ृोििस ोप Rौ.2860, पुधनध iौ ो ियौौ धतहोि पय पुध cयौप ूनicध यी 4 ृोििस. Tुध cयौप ूनicध यी 2 ृोििस iौ धतहोि पय:", "options": [" <p>     240</p>", " <p>     120</p>", " <p>     130</p>", " <p>     260</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693637362135_html_51703332710c48ee.png\" width=\"306\" height=\"459\" > </p>"}, {"qid": "", "question": " <p>     A survey was conducted by a group of students as a part of their     environment awareness program, in which they collected the     following data regarding the number of plants in 20 houses in a     locality. Find the mean number of plants per house.</p>     <p>     <br>      </p>     <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693637362135_html_cbccc484da765cd4.png\" width=\"447\" height=\"113\" > </p>     <p><br>      </p>", "options": [" <p>     10.5</p>", " <p>     8.1</p>", " <p>     9.4</p>", " <p>     8.8</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693637362135_html_bad91ad94af45580.png\" width=\"320\" height=\"319\" > </p>"}, {"qid": "", "question": " <p>     Find the least number which when doubled will be exactly     divisible by 14, 9, 36 and 98?</p>", "options": [" <p> r_images/1693637362135_html_40610a7ff95accfd.png\" width=\"367\" height=\"495\" > </p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that expresses the given sentence in active voice.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Shubhankar     was interviewing the political leaders.</span></span></p>", "options": [" <p>     <span>The     political leaders were being interviewed by Shubhankar.</span></p>", " <p>     <span>The     political leaders was being interviewed by Shubhankar.</span></p>", " <p>     <span>The     political leaders are being interviewed by Shubhankar.</span></p>", " <p>     <span>The     political leaders is being interviewed by Shubhankar.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option a.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Active     Voice to Passive Voice transformation: </b></span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Sub     + was/were + verb (Ing) + object ----------- Object + was/ were +     being + verb (Ing) + by + Sub.</b></span></span></p>"}, {"qid": "", "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. P. Tय पुinा यी iप यपुधनथiौध iौ पय ूनधॅधnप ंोn ीनयं हnकधनौपोnकing पुध नधोि पनहपु यी ुiौ gनधोपधौप यी ोिि हniॅधनौोि िोथौ. Q. Bहप iप iौ ोिसय पुयहgुप यी in निधोपiयn पय पुध ॅोनiयहौ inौपincपौ in ंोn. R. Lयॅध iौ यीपधn पुयहgुप पय ृध पुध ुigुधौप ोnक ंयौप ीिहीiििing धंयपiयn पुोप ंधn ोnक थयंधn cोn धसूनधौौ. S. Tुधनधीयनध, थध ंहौप नधोिप्रध ीनयं पुध ंदौपicोि ूयinप यी ॅiधथ iौ पुध ुigुधौप धंयपiयn यी ंोn ोnक पुध यnध धंयपiयn पुोप निधोपधौ ंोn पय Gयक.", "options": ["\r\n<p>RQSP< ></span><span>:     to push (something) into something quickly and forcefully.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate meaning of the given idiom.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Make     up the leeway</span></span></p>", "options": [" <p>     create a new     pathway</p>", " <p>     Struggle out of     a bad position</p>", " <p>     take a break     from work</p>", " <p>     make a quick     decision</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option b.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Make     up the leeway: </b></span><span>struggle     out of a bad position, especially by recovering lost time.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>We     got sidetracked with the lunch party, but hopefully we can </span><span><b>make     up the leeway</b></span><span>     by getting everyone to pitch in with loading the trucks. </span></span>     </p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>A.     A country’s economic performance is measured using three key     indicators, one of which is the unemployment rate. </span></span>     </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>B.     When adults who are willing and able to work cannot find a job,     it may be a sign that an economy is producing less than it could.     </spa ></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Spore Formation</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:328px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Production of specialized reproductive cells (spores) that can develop into new individuals under suitable conditions. Common in some fungi, plants, and organisms.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Budding</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:328px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Asexual reproduction where a small bud grows on the parent organism, eventually detaching to become a new independent organism.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:1 ke marble, granite</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:33px; vertical-align:bottom; width:106px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Threats</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:33px; vertical-align:bottom; width:288px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Deforestation, mining activities</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:51px; vertical-align:bottom; width:106px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Conservation Efforts</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:51px; vertical-align:bottom; width:288px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Efforts to protect biodiversity, prevent degradation</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Which amongst the following part of brain is responsible for Main thinking part, center of wisdom, knowledge, will power etc.?</p>", "options": ["<p>Hind brain (Cerebellum)</p>", "<p>Midbrain</p>", "<p>Forebrain (Cerebrum)</p>", "<p>Reflex Action</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer.                                                                                              </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Forebrain or Cerebrum</strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Main thinking part, center of wisdom, knowledge, will power etc.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Receives information from the sense organs.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Controls our thoughts, sensations, actions, movements.</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Mid-brain</strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Controls reflex actions of head, neck, trunk.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Controls reflex movements of eye muscles, change in pupil size and change of eye lens.</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Hind brain</strong></span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Pones</strong></span></span></li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Regulates respiration.</strong></span></span></li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Cerebellum</strong></span></span></li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Helps in maintaining posture and balance of the body.</strong></span></span>\r\n\r\n\t<ul style=\"list-style-type:circle\">\r\n\t\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Helps in walking, dancing and bicycle riding.</strong></span></span></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Spinal cord</strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Begins in continuation with medulla oblongata.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Enclosed in a bony cage called vertebral column.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Surrounded by membranes called meninges.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>31 pairs of nerves arise from spinal cord.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Concerned with spinal reflex action and conduction of nerve impulse to and from brain.</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Reflex action</strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Simplest form of response in the nervous system.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Not under the voluntary control of brain.</strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Concept was first given by Marshall Hall.</strong></span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following Sultans of Delhi established a strong and large standing army to protect and defeat the Mongol invasion?</p>", "options": ["<p>Alauddin Khilji</p>", "<p>Ghiyasuddin Balban</p>", "<p>Jalal-ud-din Khilji</p>", "<p>Muhammad bin Tughlaq</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Allaudin Khilji&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ghiyasuddin Balban, one of the Sultans of Delhi, established a strong and large standing army to protect against external threats, including the Mongol invasions. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">He ruled during the late 13th century and was known for his efforts to strengthen the military and administration of the Delhi Sultanate. </span></span></p>\r\n\r\n<p> </p>\r\n\r\n<table border=\"1\" style=\"width:463px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Sultan</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:49px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Reign</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:314px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Key Contributions and Characteristics</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Alauddin Khilji</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:49px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1296-1316</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:314px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Strengthened the Delhi Sultanate militarily; Introduced market controls to regulate prices and control inflation; Known for his expeditions and campaigns against Mongols and Southern India. He built the Alai Darwaza, a prominent gateway at the Qutub Complex.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ghiyasuddin Balban</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:49px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1266-1287</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:314px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Strengthened the military and administration to counter external threats; Implemented a strict law and order regime; Used the title &quot;Ulugh Khan&quot; before becoming Sultan; Played a crucial role in consolidating the Delhi Sultanate.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Jalal-ud-din Khilji</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:49px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1290-1296</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:314px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The first ruler of the Khilji dynasty; Ascended to the throne by assassinating the previous Sultan; Began the Khilji dynasty&#39;s rule in Delhi; His reign marked the end of the Slave dynasty&#39;s rule.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:91px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Muhammad bin Tughlaq</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:49px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">1325-1351</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:314px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Known for his ambitious but often impractical policies; Introduced token currency; Proposed the shifting of the capital from Delhi to Daulatabad, which resulted in logistical challenges; His reign saw various administrative and military experiments.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>From which of the following Constitutions, India adopted the concept of &quot;Rule of Law&quot; in its Constitution?</p>", "options": ["<p>Spanish Constitution</p>", "<p>Constitution of Sri Lanka</p>", "<p>Irish Constitution</p>", "<p>British Constitution</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option D is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">From British Constitutions, India adopted the concept of <strong>&quot;Rule of Law&quot;</strong> in its Constitution. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following is referred to as a cell&#39;s suicide sack?</p>", "options": ["<p>Mitochondrion</p>", "<p>Lysosome</p>", "<p>Golgi complex</p>", "<p>Nucleus</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option B &ldquo;Lysosome&rdquo;.    </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A lysosome is referred to as a cell&#39;s &quot;suicide sack.&quot; </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Lysosomes are membrane-bound organelles found in eukaryotic cells, and they contain enzymes that are responsible for breaking down various types of cellular waste materials, foreign invaders (such as bacteria or viruses), and even worn-out or malfunctioning organelles. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This process is called &quot;lysosomal digestion&quot; or &quot;autophagy.&quot; </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Lysosomes play a crucial role in maintaining cellular health and homeostasis by preventing the accumulation of waste products and maintaining proper recycling of cellular components. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">When a cell is damaged or no longer functional, lysosomes can release their enzymes to break down its contents, leading to a process known as apoptosis or programmed cell death. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This controlled self-destruction mechanism is important for eliminating damaged or potentially harmful cells and maintaining the overall health of the organism.</span></span></li>\r\n</ul>\r\n\r\n<table border=\"1\" style=\"width:491px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:93px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Organelle</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:270px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Function</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:120px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Nickname</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:93px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mitochondrion</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px th:446px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Achieve self-sufficiency in edible oil production by promoting oilseed cultivation and reducing imports.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:82px; vertical-align:bottom; width:105px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">White Revolution</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:82px; vertical-align:bottom; width:107px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dairy</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; height:82px; vertical-align:bottom; width:446px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Increase milk production through improved breeding, feeding, and management of dairy animals.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>A fountain pen work on the principle of:</p>", "options": ["<p>Gravity</p>", "<p>Capillary action</p>", "<p>Electromagnetic induction</p>", "<p>Osmosis</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Capillary action.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A fountain pen utilizes capillary action, which involves the adhesive and cohesive forces of liquids, to transfer ink from the pen&#39;s reservoir to the paper, allowing for smooth and controlled writing or drawing.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Capillary Action:</strong> Capillary action is the ability of a liquid to flow in narrow spaces against the force of gravity. This phenomenon occurs due to the combination of two primary forces: adhesive forces and cohesive forces. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Adhesive Forces:</strong> Adhesive forces refer to the attraction between the molecules of the liquid and the molecules of the surface material. In the case of a fountain pen, the liquid ink is attracted to the surface of the nib (usually made of metals like stainless steel or gold) due to adhesive forces. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Cohesive Forces:</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\"> Cohesive forces are the forces that hold the molecules of a liquid together. These forces allow the liquid to maintain its shape and resist breaking apart. In a fountain pen, cohesive forces keep the ink molecules together. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following foods has all the essential amino acids required in the human diet?</p>", "options": ["<p>Tomatoes</p>", "<p>Soya bean</p>", "<p>Berries</p>", "<p>Avocados</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Soyabean&rdquo;. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Soybeans are a remarkable plant-based protein source that contains all the essential amino acids required by the human body. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">These essential amino acids are the building blocks of proteins that our bodies cannot synthesize on their own and must be obtained through the diet. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The fact that soybeans contain all of them makes them a &quot;complete protein.&quot;</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Tomato:</span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Vitamins (Vitamin C, Vitamin A)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Minerals (Potassium)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Antioxidants</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Carotenoids (Lycopene)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Fiber</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Soya Bean: </span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Complete Proteins </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dietary Fiber</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Vitamins (B Vitamins)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Minerals (Iron, Calcium, Magnesium)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Healthy Fats</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Berries: </span></strong></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Vitamins (Vitamin C, Vitamin K)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Antioxidants (Anthocyanins)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dietary Fiber</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Phytochemicals (Flavonoids)</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong><span style=\"font-size:14.0pt\">Avocados</span></strong><span style=\"font-size:14.0pt\">:</span></span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Healthy Fats (Monounsaturated Fats)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Vitamins (Vitamin E, Vitamin K)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Minerals (Potassium)</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Dietary Fiber (Soluble Fiber)</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Phytochemicals (Carotenoids)</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Recently, Ubinas Volcano has erupted. It is in which of the following countries?</p>", "options": ["<p>Indonesia</p>", "<p>Peru</p>", "<p>Uganda</p>", "<p>Korea</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option B &ldquo;Peru&rdquo;.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Ubinas is a <strong>stratovolcano</strong> located in the Ce<strong>ntral Volcanic Zone of the Andes. </strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is one of the m<strong>ost active volcanoes in Peru</strong>, with more than 26 eruptive episodes recorded in the last 500 years. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Ubinas volcano is <strong>part of a group of seven volcanoes in southern Peru</strong> located within a volcanic zone that extends from southern Peru to northern Chile. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The affected area is situated w<strong>ithin the &quot;Ring of Fire</strong>,&quot; a region encompassing the edges of the Pacific Ocean that is renowned for its volcanic activity and seismic events, such as earthquakes. </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>What is the duration of monsoon in India?</p>", "options": ["<p>140 days &ndash; 160 days</p>", "<p>120 days &ndash; 140 days</p>", "<p>100 days &ndash; 120 days</p>", "<p>80 days &ndash; 100 days</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option C &ldquo;100 days &ndash; 120 days&rdquo;.    </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The duration of monsoon in India extends for an average period of 100-120 days. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The monsoon or rainy season in India lasts from June till September. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The south-west monsoon, known as the summer monsoon blows from sea to land after crossing the Indian Ocean, the Arabian Sea, and Bay of Bengal.   </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The North-east monsoon, commonly known as the winter monsoon blows from land to sea. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Western and central India receiving more than 90% of their total annual precipitation during the period.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Southern and northwestern India receiving 50%-75% of their total annual rainfall.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Overall, monthly totals average 200-300 mm over the country as a whole, with the largest values observed during the heart of the monsoon season in July and August.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which basic objective has been included in the Constitution by the 86th Amendment Act?</p>", "options": ["<p>To maintain and protect the sovereignty, unity and integrity of India</p>", "<p>Protecting public property and ending violence</p>", "<p>who is a parent or guardian, to provide opportunities for education to his child or such ward, as the case may be, who may be between the ages of six and fourteen years</p>", "<p>To value and preserve the rich heritage of our composite culture</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The <strong>86th Constitutional Amendment in 2002,</strong> provided Right to Education as a fundamental right in Part-III of the Constitution.</span></span><br />\r\n </p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It <strong>inserted Article 21A</strong> which made Right to Education a fundamental right for children between 6-14 years.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">It provided for a follow-up legislation <strong>Right to Education Act 2009. </strong></span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Which of the following states of India is situated closest to the equator?</p>", "options": ["<p>Andhra Pradesh</p>", "<p>Telangana</p>", "<p>Goa</p>", "<p>Tamil Nadu</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option D &ldquo;Tamil Nadu&rdquo;.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Tamil Nadu &amp; Kerala both are closest to equator. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">There is no Equator going via India. India is north to the equator. But in India, the Tropic of Cancer travels via eight states.</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Rajasthan</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Jharkhand</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Mizoram</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Chhattisgarh</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Tripura</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Gujarat</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Madya Pradesh</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">West Bengal</span></span></li>\r\n</ol>"}, {"qid": "", "question": "<p>On which of the following occasions is the Raut Nacha performed by the Yadav community of Chhattisgarh?</p>", "options": ["<p>Holi</p>", "<p>Buddha Purnima</p>", "<p>Makar Sankranti</p>", "<p>Deepawali</p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option D &ldquo;Deepawali&rdquo;.   </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Raut Nacha is a ceremonial dance performed mainly by the tribal community of Chhattisgarh. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is performed during the &ldquo;dev udhni ekadashi&rdquo;, after the Diwali festival. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is mainly performed by Yaduvanshis. The dance form carries with itself sacred mythological and religious traditions.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Raut Nacha translating literally to &lsquo;Night Dance&rsquo;, is a dance performed by the Yadav community of Chattisgarh. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">This dance is performed usually at night to worship Lord Krishna. The people of the Yadav community believe that Lord Krishna was of the Yadav bloodline >×</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span> ×</span><span>  </span><span>+</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span></span><span>  </span><span>÷</span><span>  </span><span>×</span><span>  </span><span>+</span><span>  </span><span>−</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532327528_image057.png\" width=\"356\" height=\"279\" alt=\"\"></p>"}, {"qid": "", "question": " <span> If + means −, − means ×, × means ÷, and ÷ means +, what will be the value of the following expression?</span><p><span>175 </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532327528_image058.png\" width=\"155\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> </span></p>", "options": ["<span> 88</span>", "<span> 44</span>", "<span> 70</span>", "<span> 77</span>"], "correct": 4, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532327528_image059.png\" width=\"283\" height=\"152\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span><p><span>(NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</span></p><p><span>(29, 21, 20), (25, 24, 7)</span></p>", "options": ["<span> (39, 24, 27)</span>", "<span> (17, 15, 8)</span>", "<span> (55, 43, 37)</span>", "<span> (17, 13, 9)</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532327528_image060.png\" width=\"372\" height=\"444\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Information given below represents the number codes for the given letters. Select the combination of numbers so that the letters arranged accordingly will form a meaningful word.</span><p><span>R = 1, A = 2, C = 3, F = 4, T = 5, E = 6, S = 7, O = 8</span></p>", "options": ["<span> 4,3,1,5,6,7,8,2</span>", "<span> 4,8,1,6,3,2,7,5</span>", "<span> 4,1,2,3,5,6,7,8</span>", "<span> 4,8,1,2,3,5,8,6</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>The correct sequence is:</span></p><p><span>F O R E C A S T = 4,8,1,6,3,2,7,5</span></p>"}, {"qid": "", "question": " <span> Eight people, A, B, C, D, E, F, G and H are sitting in a straight line, facing north. Only three people sit to the right of A. Only one person sits between A and B. Only four people sit between B and D. F sits to the immediate right of D. C is neither an immediate neighbour of B nor D. E sits second to the right of G. How many people sit between H and A?</span>", "options": ["<span> One</span><span>   </span>", "<span> Two</span><span>   </span>", "<span> Three</span><span>   </span>", "<span> None</span><span>   </span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711532327528_image061.png\" width=\"417\" height=\"155\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In the given question, the statement is followed by two conclusions. Which of the two conclusions is/are true?</span><p><span>Statement: Y = D ≥ Q &gt; F &lt; X &gt; P = G</span></p><p><span>Conclusions:</span></p><p><span>I. Q &lt; G</span></p><p><span>II. Q ≥ Y</span></p>", "options": ["<span> Only conclusion I is true</span>", "<span> Only conclusion II is true</span>", "<span> Both conclusions I and II are true</span>", "<span> Neither conclusion I nor II is true</span>"], "correct": 4, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ D.I. Q &िपे G (Fोिसध) (पुधनध iौ nय कiनधcप निधोपiयn ृधपथधधn Q ोnक G).II. Q ≥ Y (Fोिसध) (पुधनध iौ nय कiनधcप निधोपiयn ृधपथधधn Q ोnक Y).Hधncध, Nधiपुधन cयncिहौiयn I nयन II iौ पनहध."}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
