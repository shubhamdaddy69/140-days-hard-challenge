<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 16 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p>     If     the amount on a certain principal in 5 years at 13% rate of     interest compounded annually is Rs.15,000, what will be the     amount (in Rs.) after the 6<sup>th</sup>     year?</p>     <p><br>      </p>", "options": [" <p>     <span>16950</span></p>", " <p>     <span>18440</span></p>", " <p>     <span>16440</span></p>", " <p>     <span>18550</span></p>"], "correct": 1, "marks": "1", "explanation": " <p>                                                                                                                                                        <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_e0b0276b2a910948.png\" width=\"427\" height=\"151\" > </p>"}, {"qid": "", "question": " <p>     <span>A,     B and C start a business. A invests 33</span><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_ee8bcf0e105de675.gif\" > <span>     of the total capital, B invests 25% of the remaining and C     invests the rest. If the total profit at the end of the year is     1,86,000, then A’s share of the profit is:</span></p>     <p><br>      </p>", "options": [" <p>     <span>62,000</span></p>", " <p>     <span>59,000</span></p>", " <p>     <span>61,000</span></p>", " <p>     <span>64,000</span></p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_19024dba3d94609e.png\" width=\"247\" height=\"340\" > </p>"}, {"qid": "", "question": " <p>     <span>In     a mixture, milk and water are in ration of 1 : 4 Some milk is     added to the mixture because of which ratio of milk and water     becomes 2 : 1. How much milk was added as a percentage of initial     mixture?</span></p>     <p><br>      </p>", "options": [" <p>     <span>700</span></p>", " <p>     <span>140</span></p>", " <p>     <span>400</span></p>", " <p>     <span>240</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_ec8369b239ca5b8c.png\" width=\"239\" height=\"211\" > </p>"}, {"qid": "", "question": " <p>     Radius     of base of a hollow cone is 8 cm and its height is 15 cm. A     sphere of largest radius is put inside the cone. What is the     ratio of radius of base of cone to the radius of sphere?</p>     <p><br>      </p>", "options": [" <p>     5:3</p>", " <p>     4:1</p>", " <p>     2:1</p>", " <p>     7:3</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_adb013217c826ce0.png\" width=\"177\" height=\"332\" > </p>"}, {"qid": "", "question": " <p>     If     30% of a certain work is done by A and after that remaining 70%     of the work is done by B. Total time taken to complete the work     is 30 days. If 30% of a certain work is done by B and after that     remaining 70% of the work is done by A, total time taken to     complete the work is 40 days. In how many days A can complete the     whole work alone?</p>     <p><br>      </p>", "options": [" <p>     171/2</p>", " <p>     90/4</p>", " <p>     71/2</p>", " <p>     19/4</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_bc2b74d4246b7603.png\" width=\"273\" height=\"274\" > </p>"}, {"qid": "", "question": " <p>     <span>After     selling 288 articles, man losses selling price of 36 articles.     Find loss %.</span></p>     <p><br>      </p>", "options": [" <p>     <span>12.5%</span></p>", " <p>     <span>11.11%</span></p>", " <p>     <span>9.09%</span></p>", " <p>     <span>10%</span></p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_5f4aa80b06d255da.png\" width=\"330\" height=\"269\" > </p>"}, {"qid": "", "question": " <p>     The     following data set represents the ages of a group of people: 25,     30, 35, 40, 45. What is the standard deviation of this data set     (round up to the nearest integer)?</p>     <p><br>      </p>", "options": [" <p>     5</p>", " <p>     6</p>", " <p>     7</p>", " <p>     8</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_b1ddd8a3c4eccea7.png\" width=\"309\" height=\"350\" > </p>"}, {"qid": "", "question": " <p>     Find     the least number which when divided by 5,7 and 9 leaves remainder     3,5, and 7 respectively?</p>     <p><br>      </p>", "options": [" <p>     315</p>", " <p>     300</p>", " <p>     313</p>", " <p>     317</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_127cf6116d220936.jpg\" width=\"345\" height=\"263\" > </p>"}, {"qid": "", "question": " <p>     A     pyramid has a square base. The side of square is 12 cm and height     of pyramid is 21 cm. The pyramid is cut into 3 parts by 2 cuts     parallel to its base. The cuts are at height of 7 cm and 14 cm     respectively from the base. What is the difference (in cm<sup>3</sup>)     in the volume of top most and bottom most part?</p>     <p><br>      </p>", "options": [" <p>     872</p>", " <p>     944</p>", " <p>     786</p>", " <p>     672</p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_84cf739fd5160b6.png\" width=\"379\" height=\"227\" > </p>"}, {"qid": "", "question": " <p>     If          <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_6d68ec104dd033cf.gif\" > ,     then the value of       <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_a96a1f8796724eab.gif\" >      is?</p>     <p><br>      </p>", "options": [" <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_85b58d97328835f.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_929fb4b863669efa.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_12a7c8eb02590a58.gif\" > </p>", " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_67f6f4f3dc1e226.gif\" > </p>"], "correct": 4, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_b97c9465c0aea065.png\" width=\"198\" height=\"369\" > </p>"}, {"qid": "", "question": " <p>     <span>A     person buys 60 Kg of rice and sells it at a profit of as much     money as he paid for 15 Kg. His profit percent is:</span></p>     <p><br>      </p>", "options": [" <p>     <span>40</span></p>", " <p>     <span>25</span></p>", " <p>     <span>35</span></p>", " <p>     20</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_de15c6414194bd5.png\" width=\"328\" height=\"235\" > </p>"}, {"qid": "", "question": " <p>     <span>If     a³ + b³ = 405 and a+b = 9, then the value of ab is:</span></p>     <p><br>      </p>", "options": [" <p>     15</p>", " <p>     10</p>", " <p>     12</p>", " <p>     8</p>"], "correct": 3, "marks": "1", "explanation": " <p>     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1693567043849_html_3d3f23ea6a7f752f.png\" width=\"245\" height=\"250\" > </p>"}, {"qid": "", "question": " <p>     <span>If     SI on a certain sum of money for 11 years at the rate of 4 (6/11)     % per annum is Rs 3000 less than its principal, find the sum and     SI.</span></p>     <p><br>      </p>", "options": [" <p>     <span>6000,     3000</span></p>", " <p>     <span>6000,     4000</span></p>", " <p>     <span>8000,     3000</span></p>", " <p>     <span>8000,     4000</span></p>"], "correct": 1, "marks": "1", "explanation   era (P), and concluding with the principles and their application     (S).</b></span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate meaning of the highlighted idiom in the     given sentence.<br> When Bindu told Dhiraj the secret, I </span><span><b>let     the genie out of the bottle.</b></span></span></p>", "options": [" <p>     Sharing a     secret with someone</p>", " <p>     Releasing     magical powers</p>", " <p>     Hiding     important information</p>", " <p>     Cleaning a bottle containing a genie</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option a.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Let     the genie out of the bottle</b></span><span>:     to allow something to happen that cannot then be stopped.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     genie is out of the bottle means that something has been     done that cannot be undone; a secret may have been revealed,     forces may have been put into motion, privileges may have been     granted that cannot be retracted, etc. When the genie is out of     the bottle, things cannot be restored to the way they were     before.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the most appropriate option to fill in the blank.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     police were on high alert on account of the ________ convict who     had killed many people.</span></span></p>", "options": [" <p>     eloped</p>", " <p>     run after</p>", " <p>     walk away</p>", " <p>     run away</p>"], "correct": 4, "marks": "1", "explanation": " <p>     < tween two main parties.     Several other parties may exist, contest elections and win a few     seats in the national legislatures. But only the two main parties     have a serious chance of winning majority of seats to form     government. Such a party system is called two-party system. The     United States of America and the United Kingdom are examples of     two-party system. If several parties compete for power, and more     than two parties have a reasonable chance of coming to power     either on their own strength or in alliance with others, we call     it a multiparty system. Thus in India, we have a multiparty     system. In this system, the government is formed by various     parties coming together in a coalition.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Q.     What is the tone of the passage?</span></span></p>", "options": [" <p>     Informative</p>", " <p>     Opinionated</p>", " <p>     Argumentative</p>", " <p>     Humorous</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option A</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     tone of the passage is informative, as it provides factual     information and explanations about different types of political     party systems within a democracy. It presents information about     one-party systems, two-party systems, and multiparty systems     while explaining their characteristics and examples. The passage     aims to educate the reader about these concepts rather than     expressing personal opinions or making arguments.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Read     the following passage and answer the questions given after it.</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>One     of the best-known differences between British and American     English is the fact that the sport known as football in Great     Britain is usually called soccer in the United States. Because     the sport originated in England, it is often assumed that soccer     is an Americanism. In fact, the word is thoroughly British in     origin. So why is it that Americans (not to mention Canadians,     Australians, and others) are likelier to use the word than Brits     are? The answer lies in how the sport developed in each country.     Although football-type games have been around for centuries, the     sport we know today is often said to have begun in 1863, when     England’s newly formed Football Association wrote down a set of     rules. At the time, it was the most widely played game of its     kind in the country, but it wasn’t the only one. Rugby     football, named after an English boarding school, was a variation     that allowed players to carry and run with the ball to advance it     toward the goal. The game played under the Football Association’s     rules thus became known as association football.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Inevitably,     the names would be shortened. Linguistically creative students at     the University of Oxford in the 1880s distinguished between the     sports of “rugger” (rugby football) and “assoccer”     (association football). The latter term was further shortened to     “soccer” (sometimes spelled “socker”), and the name     quickly spread beyond the campus. However, “soccer” never     became much more than a nickname in Great Britain. By the 20th     century, rugby football was more commonly called rugby, while     association football had earned the right to be known as just     plain football.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Meanwhile,     in the United States, a sport emerged in the late 19th century     that borrowed elements of both rugby and association football.     Before long, it had proved more popular than either of them. In     full, it was known as gridiron football, but most people never     bothered with the first word. As a result, American     association-football players increasingly adopted soccer to refer     to their sport. The United States Football Association, which had     formed in the 1910s as the official organizing body of American     soccer, changed its name to the United States Soccer Football     Association in 1945, and it later dispensed with the “Football”     altogether. No longer just a nickname, soccer had stuck.</span></span></p>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Q.     Why is the term \"soccer\" more commonly used in the     United States than in Britain?</span></span></p>", "options": [" <p>     Americans     originated the term \"soccer.\"</p>", " <p>     \"Soccer\"     is considered an Americanism.</p>", " <p>     The sport of     soccer developed independently in the United States.</p>", " <p>     British     footballers do not play soccer.</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option B</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     passage explains that while the term \"soccer\" is     thoroughly British in origin, it is more commonly used in the     United States due to the development of the sport and the     linguistic creativity of students at the University of Oxford. In     Britain, the term \"football\" is more commonly used,     while \"soccer\" became popular in the United States as a     way to distinguish the sport from other variations of football.     Therefore, the correct answer is that \"soccer\" is     considered an Americanism.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span><b>Read     the following passage and answer the questions given after it.</b></span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>One     of the best-known differences between British and American     English is the fact that the sport known as football in Great     Britain is usually called soccer in the United States. Because     the sport originated in England, it is often assumed that soccer     is an Americanism. In fact, the word is thoroughly British in     origin. So why is it that Americans (not to mention Canadians,     Australians, and others) are likelier to use the word than Brits     are? The answer lies in how the sport developed in each country.     Although football-type games have been around for centuries, the     sport we know today is often said to have begun in 1863, when     England’s newly formed Football Association wrote down a set of     rules. At the time, it was the most widely played game of its     kind in the country, but it wasn’t the only one. Rugby     football, named after an English boarding school, was a variation     that allowed players to carry and run with the ball to advance it     toward the goal. The game played under the Football Association’s     rules thus became known as association football.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Inevitably,     the names would be shortened. Linguistically creative students at     the University of Oxford in the 1880s distinguished between the     sports of “rugger” (rugby football) and “assoccer”     (association football). The latter term was further shortened to     “soccer” (sometimes spelled “socker”), and the name     quickly spread beyond the campus. However, “soccer” never     became much more than a nickname in Great Britain. By the 20th     cen y spread beyond the campus. However, “soccer” never     became much more than a nickname in Great Britain. By the 20th     century, rugby football was more commonly called rugby, while     association football had earned the right to be known as just     plain football.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Meanwhile,     in the United States, a sport emerged in the late 19th century     that borrowed elements of both rugby and association football.     Before long, it had proved more popular than either of them. In     full, it was known as gridiron football, but most people never     bothered with the first word. As a result, American     association-football players increasingly adopted soccer to refer     to their sport. The United States Football Association, which had     formed in the 1910s as the official organizing body of American     soccer, changed its name to the United States Soccer Football     Association in 1945, and it later dispensed with the “Football”     altogether. No longer just a nickname, soccer had stuck.</span></span></p>     <p>     <br> <br>      </p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Q.     What is the primary reason why the term \"soccer\" is not     commonly used in Britain?</span></span></p>", "options": [" <p>     The term is     associated with the United States.</p>", " <p>     British     footballers prefer the term \"rugger.\"</p>", " <p>     The sport     developed differently in Britain.</p>", " <p>     Linguistically     creative students were not present in Britain.</p>"], "correct": 2, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct answer is option B</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     primary reason why the term \"soccer\" is not commonly     used in Britain is that the sport developed differently in     Britain. While the term \"soccer\" was coined and used in     Britain, it did not gain as much popularity as it did in the     United States. In Britain, the term \"football\" became     more commonly used, and other factors contributed to the     differentiation of terminology</span></span></p>"}, {"qid": "", "question": "<p>__________ is the property of material of a body by virtue of which the body acquires its original shape and size after the removal of deforming force.</p>", "options": ["<p>Viscosity</p>", "<p>Elasticity</p>", "<p>Malleability</p>", "<p>Harden ability</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Elasticity. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Elasticity: </strong>It is the property of a material that allows it to return to its original shape and size after being deformed by an external force. This property is important in materials like rubber bands, springs, and certain metals, which are used in applications requiring deformation and recovery. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Viscosity: </strong>It is the property of a fluid (liquid or gas) that describes its resistance to flow. It is a measure of the internal friction within the fluid as it flows. Viscous materials, like honey or syrup, have a high resistance to flow and tend to flow slowly. In contrast, less viscous materials, like water, flow more easily. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Malleability</strong>: It is the property of a material that allows it to be deformed under compression without fracturing or breaking. Malleable materials can be hammered, rolled, or pressed into various shapes without cracking. Metals like gold and silver are highly malleable, making them suitable for jewelry and coin minting.  </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Hardenability</strong>: It is the property of a material that indicates its ability to be hardened through heat treatment or other processes. It is particularly relevant in the context of metallurgy. Materials with good hardenability can be transformed into stronger and tougher forms by controlled heating and cooling processes. </span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>Recently, which of the following companies has been announced as the lead sponsor of India&rsquo;s national cricket team?</p>", "options": ["<p>PUMA</p>", "<p>Dream 11</p>", "<p>Amazon</p>", "<p>Vivo</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Dream 11&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The popular fantasy gaming platform Dream11 has reportedly taken over as the main jersey sponsor for the Indian cricket team from July 2023 to March 2026, replacing Byju&#39;s.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>The ICC Men&#39;s Cricket World Cup 2023 will be held in India from October 5 to November 19, 2023. </strong></span></span></p>"}, {"qid": "", "question": "<p>Where is the &ldquo;Great Barrier Reef&rdquo; is located?</p>", "options": ["<p>Pacific Ocean</p>", "<p>Atlantic Ocean</p>", "<p>Indian Ocean</p>", "<p>Arctic Ocean</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Pacific Ocean&rdquo;.  </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Cal =\"background-color:#e5e5e5; height:31px; width:124px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Neeraj Chopra</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#e5e5e5; height:31px; width:61px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Gold</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#e5e5e5; height:31px; width:179px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Men&#39;s javelin throw</span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#e5e5e5; height:31px; width:78px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Tokyo 2020</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Who is known as &lsquo;Bismark of India&rsquo;?</p>", "options": ["<p>Rabindranath Tagore</p>", "<p>Vallabhbhai Patel</p>", "<p>Jawaharlal Nehru</p>", "<p>Dr. Shrikrishna Singh</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Vallabh Bhai Patel&rdquo;.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Sardar Vallabh Bhai Patel</strong> is considered as the <strong>Bismarck</strong> <strong>of India</strong> with regard to his stellar contribution to the political integration of the country. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Sardar Vallavbhai Patel, the first Deputy Prime Minister and Home Minister of free India, was different from the Bismarck because as against Bismarck&#39;s 36 states, Sardar unified <strong>535 diverse princely States spread</strong> over an area at least <strong>ten times larger than Germany</strong>, integrating those into the newly formed Union of India smoothly within a least possible time frame. The geographical entity and identity of modern India which we are proud of today was possible largely because of him. He integrated India through nonviolence i.e., by peaceful methods. </span></span></p>"}, {"qid": "", "question": "<p>Which article states that &ldquo;Superintendence, direction and control of elections to be vested in an Election Commission&rdquo;?</p>", "options": ["<p>Article 324</p>", "<p>Article 326</p>", "<p>Article 112</p>", "<p>Article 352</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Article 324&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 324: </strong>This article of the Indian Constitution deals with the establishment and functions of the Election Commission of India. It states that the &quot;superintendence, direction and control of elections&quot; to the Parliament, State Legislatures, and the offices of the President and Vice-President are vested in the Election Commission. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article 326</strong>: This article of the Indian Constitution pertains to the composition of the House of the People (Lok Sabha) and the right to vote. It states that the elections to the House of the People shall be on the basis of adult suffrage, which means that every citizen who is 18 years of age or older has the right to vote.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Article</strong> <strong>112</strong>: This article of the Indian Constitution relates to the annual financial statement, or the budget, of the Union government. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Article</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\"> <strong>352</strong>: This article of the Indian Constitution empowers the President to proclaim a state of emergency when he or she is satisfied that the security of India or any part of its territory is threatened by war, external aggression, or armed rebellion.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following statement/statements is/are correct about RNA?<br />\r\nA. Messenger RNA brings the message from DNA found in the nucleus to cytoplasm in the coded form.<br />\r\nB. Ribosomal RNA present in ribosome which is the site of protein synthesis.<br />\r\nC. Transfer RNA is the carrier of amino acid and transfer it to the ribosome.<br />\r\n </p>", "options": ["<p>Only Statement A</p>", "<p>Only Statement A and B</p>", "<p>All the statement A, B and C</p>", "<p>Only Statement A and C</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option c is the correct answer. All the statement are correct.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">RNA, or ribonucleic acid, plays several critical roles in the cell. Its functions are diverse and essential for various biological processes. Some of the key roles of RNA include:</span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Messenger RNA (<a name=\"_Hlk144478321\">mRNA</a>):</strong> mRNA carries genetic information from the DNA in the cell&#39;s nucleus to the ribosomes in the cytoplasm. It serves as a template for protein synthesis. The information encoded in the DNA is transcribed into mRNA, which then guides the ribosomes in assembling amino acids into a polypeptide chain to form a protein.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Ribosomal RNA (<a name=\"_Hlk144478313\">rRNA</a>):</strong> rRNA is a major structural component of ribosomes, which are cellular organelles responsible for protein synthesis. rRNA helps in the binding of mRNA and tRNA during translation and provides the catalytic site for the formation of peptide bonds between amino acids.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Transfer RNA (<a name=\"_Hlk144478301\">tRNA</a>):</strong> tRNA is responsible for carrying specific amino acids to the ribosome during protein synthesis. Each tRNA molecule has an anticodon sequence that is complementary to a specific codon on the mRNA. This ensures the correct placement of amino acids in the growing protein chain.</span></span></li>\r\n</ol>"}, {"qid": "", "question": "<p>Kamakhya Temple is located in ___________?</p>", "options": ["<p>Assam</p>", "<p>Kashmir</p>", "<p>Maharashtra</p>", "<p>Uttar Pradesh</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Assam&rdquo;. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Kamakhya Temple is a renowned Hindu temple situated in Assam.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Kamakhya Temple is dedicated to the goddess Kamakhya, who is considered one of the forms of the Mother Goddess or Shakti. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is one of the 51 Shakti Peethas (sacred shrines associated with the goddess Shakti) in Hindu tradition.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The annual Ambubachi Mela, a religious festival, is celebrated here. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The temple complex is known for its distinctive architecture, featuring a dome-like structure with minarets. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The main sanctum of the temple houses a rock-cut cavity symbolizing the yoni (female reproductive organ) of the goddess.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>The &quot;Jog Falls,&quot; the highest plunge waterfall in India, is located on which river?</p>", "options": ["<p>Yamuna</p>", "<p>Ganga</p>", "<p>Sharavati</p>", "<p>Cauvery</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Sharavati River&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Jog Falls is situated in the Shimoga district of the state of Karnataka, India. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is part of the Western Ghats, a UNESCO World Heritage Site known for its rich biodiversity and scenic landscapes. </span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The falls are formed on the Sharavathi River, which originates in the Western Ghats and flows through the region. The Sharavathi River splits into four distinct cascades &ndash; Raja, Rani, Rover, and Rocket &ndash; as it plunges down the rocky cliffs, collectively forming Jog Falls.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>In physics, the phenomenon known as &quot;quantum entanglement&quot; refers to:</p>", "options": ["<p>The bending of light as it passes through a medium</p>", "<p>The correlation of particles&#39; properties even when they are spatially separated</p>", "<p>The behavior of light as both a particle and a wave</p>", "<p>The creation of antimatter particles in particle accelerators</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option B is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Quantum entanglement is a fascinating phenomenon in quantum mechanics where two or more particles become linked in such a way that the state of one particle instantly influences the state of the other, regardless of the distance between them. This phenomenon defies classical intuition and highlights the unique nature of quantum physics. </span></span></p>"}, {"qid": "", "question": "<p>The Siachen Glacier, the world&#39;s second-longest glacier outside the polar regions, is located in which mountain range?</p>", "options": ["<p>Himalayas</p>", "<p>Western Ghats</p>", "<p>Eastern Ghats</p>", "<p>Vindhya Range</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Himalayas&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Siachen Glacier is situated in the eastern Karakoram Range, which is a part of the greater Himalayan Mountain system. </span></span></p>\r\n\r\n<ul style=\"list-style-type:square\">\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Siachen Glacier is located in the <strong>Eastern Karakoram range in the Himalayas,</strong> just northeast of <strong>Point NJ9842 where the LOC</strong> between India and Pakistan ends.</span></span>\r\n\r\n\t<ul>\r\n\t\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The entire Siachen Glacier, with all major passes, has been under the administration of India since <strong>1984 (Operation Meghdoot)</strong></span></span></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>\r\n\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Siachen Glacier lies<strong> immediately south of the great drainage</strong> divide that separates the <strong>Eurasian Plate from the Indian subcontinent</strong> in the extensively glaciated portion of the <strong>Karakoram sometimes called the &quot;Third Pole&quot;</strong></span></span></p>\r\n\t</li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Nubra river originates from Siachen Glacier.</span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The Siachen Glacier is the <strong>world&#39;s highest battlefield</strong></span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Western</strong> <strong>Ghats</strong>: The Western Ghats are a mountain range located along the western coast of India. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Eastern</strong> <strong>Ghats</strong>: The Eastern Ghats are another mountain range located on the eastern coast of India. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Vindhya</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\"> <strong>Range</strong>: The Vindhya Range is a mountain range in central India, running roughly east to west.</span></span></p>"}, {"qid": "", "question": "<p>The term &quot;stagflation&quot; refers to a situation where an economy experiences:</p>", "options": ["<p>Rapid economic growth and low inflation</p>", "<p>High unemployment and high inflation</p>", "<p>Low unemployment and low inflation</p>", "<p>Economic stagnation and deflation</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Option B) High unemployment and high inflation. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Stagflation is a period of rising inflation but falling output and rising unemployment.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Stagflaton is often a period of falling real incomes as wages struggle to keep up with rising prices.</span></span></li>\r\n</ul>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Stagflation is an economic condition characterized by a combination of stagnant economic growth, high unemployment, and high inflation. </span></span></p>\r\n\r\n<ol>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Stagnant Economic Growth:</strong> Stagflation occurs when an economy experiences slow or no growth in its gross domestic product (GDP), which is the measure of the value of all goods and services produced within a country. Stagnant growth can lead to reduced job creation and lower consumer spending.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>High Unemployment:</strong> Despite the lack of economic growth, unemployment rates remain high. This indicates that businesses are not creating enough jobs to absorb the available workforce, resulting in widespread joblessness.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>High Inflation:</strong> In addition to high unemployment and sluggish growth, stagflation includes high inflation, which is the general increase in the prices of goods and services. This creates a situation where consumers experience rising costs of living and reduced purchasing power.</span></span></li>\r\n</ol>"}, {"qid": "", "question": "<p>Who amongst the following has been reappointed as the Solicitor-General of India?</p>", "options": ["<p>Tushar Mehta</p>", "<p>R. Venkataramani</p>", "<p>D. Y. Chandrachud</p>", "<p>U.U. Lalit</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is &ldquo;Tushar Mehta&rdquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Tushar Mehta has been reappointed as the Solicitor General of India for three more years, along with six additional solicitor generals in the Supreme Court.</span></span></p>\r\n\r\n<table border=\"1\" style=\"width:491px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:119px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Aspect</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:366px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Details</strong></span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9d9e3; border-right:1px solid #d9d9e3; border-top:1px solid #d9d9e3; vertical-align:bottom; width:119px\">\r\n\t\t\t<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Position</span></span></p>\r\n\t nd Kanhu.<br />\r\nB. The Santhal Rebellion was one of the earliest and most significant tribal uprisings against British rule.<br />\r\nC. The Santhals rose against the oppressive revenue policies, exploitation, and land alienation imposed by the British and local landlords.<br />\r\nD. The rebellion took place in present-day Tamil Nadu and Andhra Pradesh.</p>", "options": ["<p>Only statement A and B are correct</p>", "<p>Only statement B, C and D are correct</p>", "<p>Only A, B and C are correct</p>", "<p>All statement A, B, C and D are correct</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Option C is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Only Statement A,B and C are correct. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Statement D is incorrect because <strong>Santhal Rebellion took place in Present-day Jharkhand and West Bengal. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">A. The leaders of the Santhal revolt were Sidhu and Kanhu - This statement is correct.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">B. The Santhal Rebellion was one of the earliest and most significant tribal uprisings against British rule - This statement is correct.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">C. The Santhals rose against the oppressive revenue policies, exploitation, and land alienation imposed by the British and local landlords - This statement is correct. </span></span></p>\r\n\r\n<table border=\"1\" style=\"width:453px\">\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<td style=\"background-color:#fff2cc; border-bottom:1px solid #d9d9e3; border-left:1px solid #d9 trong>Under Nirbhaya Fund, a scheme of Ministry of Women &amp;Child Development namely Scheme for critical care and support for accessing justice to rape gang rape survivors and minor girls who get pregnant was appraised at the total cost of Rs.74.10 cr. </strong></span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>The scheme aims at providing shelter, food &amp; daily needs, safe transportation for attending court hearings and legal aid to the minor girls who have been abandoned by the family due to forced pregnancy, either due to rape/ gang rape or due to any other reason, and have no other means to support themselves. </strong></span></span></li>\r\n</ul>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>2744, 3375, ?, 4913, 5832, 6859</span></p>", "options": ["<span> 4637</span>", "<span> 4096</span>", "<span> 4913</span>", "<span> 4075</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>14</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3</span><span>, 15</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3</span><span>, 16</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3</span><span>, 17</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3</span><span>, 18</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3</span><span>, 19</span><span style=\"line-height:108%;font-size:7.33pt;vertical-align:super\">3 </span><span>: 2744, 3375, 4096, 4913, 5832, 6859</span></p>"}, {"qid": "", "question": " <span> The second number in the given number-pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) is/are followed in all the number-pairs except one. Find that odd   const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
