<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>

      <div class="result" id="result">

        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     Resulted in a steady home market and a worldwide reputation for     Indian crafts.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BACD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BADC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CBAD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BCAD</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">the     paragraph flows logically, starting with the mention of crafts'     importance in India's exports, followed by their exceptional     quality, historical factors influencing their popularity, and     finally, the result of a strong domestic market and international     reputation for Indian crafts. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Hence     the correct arrangement is: BACD: <i><b>When     you see the wonderful displays in the crafts museums of India you     will not be surprised to learn that crafts formed a major part of     our exports throughout history. In fact, India’s crafts     communities produced such fine and artistic objects that     merchants travelled from far to acquire these goods.     Seventeenth-century courtly patronage, trade, the jajmani system,     and the demand for everyday utility crafts by the rural     population (until the second half of the seventeenth century)     resulted in a steady home market and a worldwide reputation for     Indian crafts.</b></i></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted word in a     sentence.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">He     was arrested for his <i><b>concealment</b></i>     of important evidence during the investigation. </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Disclosure</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Discovery</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Revelation</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Hiding</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is ‘Hiding’.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">In     the sentence, \"He was arrested for his concealment of     important evidence during the investigation,\" \"concealment\"     means the act of hiding or keeping something secret or not     revealing important evidence. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Therefore,     the synonym that best matches the meaning of \"concealment\"     is \"hiding,\" which also implies keeping something     secret or not making it known. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     other options, \"disclosure,\" \"discovery,\" and     \"revelation,\" have the opposite meaning as they     indicate the act of making something known or revealing     information.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A     man who hates women</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Philanthropist</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Misanthropist</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Misogamist</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Misogynist</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Misogynist:     a man who hates women. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Philanthropist:     a rich person who helps the poor and those in need, especially by     giving money. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Misanthropist:     a person who hates or avoids other people. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Misogamist:     a person who hates, avoids, or opposes marriage.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in indirect speech.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">My     teacher said, “Do you think you can complete the syllabus     within five weeks?”</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     My teacher     asked me whether I thought I could complete the syllabus within     five weeks.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     My teacher says     do I thought I could complete the syllabus within five weeks.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     My teacher said     to me if I think I can complete the syllabus within five weeks.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     My teacher     asked me whether I think I could complete the syllabus within     five weeks.</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     teacher is clearly asking a question so asked will be used.   </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Indirect     speech contains the past participle form of the verb. So think     changes to thought and can changes to could. So, Option a is the     correct answer.   </span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option that can substitute the highlighted     segment in the given sentence.<b>     </b></span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A     lot of people are seen gathering, <i><b>discussing     and negotiating</b></i>     in front of our stall in the town.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Bargaining</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Collecting</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jostling</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Dealing</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     original sentence mentions that a lot of people are seen     gathering, discussing, and negotiating in front of the stall in     the town. The term \"bargaining\" captures the idea of     negotiating or haggling over prices or terms of a deal, which     aligns perfectly with the context of the sentence. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Option     (d) \"dealing\" can also be related to business     transactions, but it doesn't specifically capture the act of     negotiating or discussing terms.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>On     the other hand, option (a) \"bargaining\" directly     encompasses the act of negotiating, which is mentioned in the     original sentence. </span></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the correct homonym from the given options to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     team's performance was __________ by the unexpected rain, leading     to their defeat.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     affected</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     infected</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     reflected</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     deflected</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>In     this sentence, \"The team's performance was __________ by the     unexpected rain, leading to their defeat,\" we need a verb     that indicates how the unexpected rain impacted the team's     performance.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     word \"affected\" fits the context as it means to have an     influence on or cause a change in something. So, the sentence     would be: \"The team's performance was affected by the     unexpected rain, leading to their defeat.\"</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     other options don't appropriately fit the context: [b] infected -     This does not convey the idea of how rain affected the team's     performance. [c] reflected - This means to show or mirror, which     is not relevant to the context of the sentence. [d] deflected -     This means to divert or turn aside, which is not the intended     meaning in this context.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Therefore,     the most appropriate answer is [a] affected.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate ANTONYM of the highlighted word.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     superhero </span><span><i><b>unleashed</b></i></span><span>     his full power and defeated the supervillain in an epic battle.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Emancipated</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Liberate</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Restrained</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Larkish</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Unleashed</b>:     turn loose or free from restraint. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Restrained</b>:     not showing strong feelings. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Emancipated</b>:     to give somebody the same legal, social and political rights as     other people. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Liberate</b>:     to allow somebody/something to be free. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Larkish</b>:     gaily mischievous; frolicsome. a larkish mood.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given in jumbled order. Arrange the sentences     in the correct order to form a meaningful and coherent paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     As a result those in charge of the shawl manufacturing units     strongly influenced the economy of this State, as the sale of     shawls brought in more money than the entire land revenue of the     State! At its peak in 1861 it generated an enormous revenue.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     The Kashmiri shawl was the mainstay of the valley’s economy     from approximately 1600 to 1860, over 250 years.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     By the nineteenth century, it was popular in princely courts and     commercial cities all over South Asia, leave alone Europe.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     It was a luxury textile, patronised by the Mughal, Afghan, Sikh     and Dogra dynasties that ruled Kashmir successively.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BCAD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BDCA</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BACD</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     paragraph flows logically, starting with the importance of the     Kashmiri shawl in the region's economy, followed by its luxurious     status and popularity across different ruling dynasties and     regions, and concluding with the substantial revenue it     generated, shaping the state's economic landscape.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: BDCA: <i><b>The     Kashmiri shawl was the mainstay of the valley’s economy from     approximately 1600 to 1860, over 250 years. It was a luxury     textile, patronised by the Mughal, Afghan, Sikh and Dogra     dynasties that ruled Kashmir successively. By the nineteenth     century, it was popular in princely courts and commercial cities     all over South Asia, leave alone Europe. As a result those in     charge of the shawl manufacturing units strongly influenced the     economy of this State, as the sale of shawls brought in more     money than the entire land revenue of the State! At its peak in     1861 it generated an enormous revenue.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in active voice.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     poor will be greatly benefited by this scheme. </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     This scheme has     greatly benefitted the poor.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     This scheme     will greatly benefit the poor.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     This scheme is     goin artistic talents have continued to grow and improve over the years, resulting in worldwide recognition. The present perfect tense is used to describe actions or situations that started in the past and continue into the present or have a connection to the present.</p>\r\n\r\n<p>So, the sentence would be: &quot;Her artistic talents have flourished over the years, earning her worldwide recognition.&quot;</p>\r\n\r\n<p>The other options don&#39;t appropriately fit the context:</p>\r\n\r\n<p>[b] flourished - This is the simple past tense and does not convey the idea of continued growth over time.</p>\r\n\r\n<p>[c] flourishes - This is the simple present tense and does not show the growth of talents over the years.</p>\r\n\r\n<p>[d] are flourishing - This is the present continuous tense and does not convey the idea of talents developing over time.</p>\r\n\r\n<p>Therefore, the most appropriate answer is [a] have flourished.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that can be used as a one-word substitute for the     given group of words.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">What     do you call a person who is skilled in using words effectively,     especially in writing or public speaking?</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Logophile</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Orator</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Altruist</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Raconteur</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>An     \"orator\" is a person who is skilled in using words     effectively, especially in public speaking or eloquent writing.     Orators are known for their ability to articulate ideas,     captivate an audience, and deliver persuasive speeches. They have     a talent for communication and often possess charisma that allows     them to engage and inspire others through their words.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     other options are: </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>[a]     Logophile - A logophile is a person who loves words and enjoys     studying and collecting words, but it does not specifically refer     to someone skilled in using words effectively in speaking or     writing. </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>[c]     Altruist - An altruist is a person who selflessly cares for the     well-being of others, which is unrelated to the skill of using     words effectively. </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>[d]     Raconteur - A raconteur is a person who is skilled in telling     entertaining stories or anecdotes, but it does not specifically     focus on public speaking or persuasive writing.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Therefore,     the correct answer is [b] Orator, as it precisely identifies a     person skilled in using words effectively, especially in writing     or public speaking.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     When the villagers heard the cry, they came running up the hill     to drive the wolf away.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     Once, there was a boy who became bored when he watched over the     village sheep grazing on the hillside.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     <span>To     entertain himself, he sang out, “Wolf! Wolf! The wolf is     chasing the sheep!”</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     <span>But,     when they arrived, they saw no wolf. The boy was amused when     seeing their angry faces.</span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     DCAB</p>", "<p style=\"orphans  so     proud of her beautiful looks. Her only complaint was growing next     to an ugly cactus.</b></i></span></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span><i><b>Every     day, the beautiful rose would insult and mock the cactus on his     looks, all while the cactus remained quiet. All the other plants     nearby tried to make the rose see sense, but she was too swayed     by her own looks.</b></i></span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in direct speech.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>She     says that Aishwarya is a talented actress.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     She says,     “Aishwarya is a talented actress.”</p>", "<p style=\"orphans:0;widows:0\">     She said, “Aishwarya was a talented actress.”</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     She told,     “Aishwarya is a talented actress.”</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     She asks, “Is     Aishwarya a talented actress.”</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Di ;border:none;padding:0in\"><b>Beneficial</b>:     promoting or enhancing well-being. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span><b>Advantageous</b></span><span>:     giving an advantage.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate meaning of the highlighted idiom in the     given sentence.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     constant threat of impending layoffs at the company hung over the     employees like a <b>Damocles     sword</b>,     causing anxiety and uncertainty in the workplace.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     A powerful     weapon used by the ancient Greek warrior Damocles.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A dangerous and     unpredictable situation that poses a constant threat or impending     doom.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A famous sword     that belongs to a mythical hero from ancient Greek mythology.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A symbol of     strength and protection that hangs over someone's head.</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     idiom \"Damocles sword\" is used to describe any perilous     or threatening situation that hangs over someone's head, causing     a constant sense of impending doom or danger. It represents the     idea that those in positions of power or authority also carry     great responsibilities and risks, even if they appear to lead     comfortable lives on the surface.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     following sentence has been split into four segments. Identify     the segment that contains a grammatical error.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Neither     Kriti nor/ Abhisek are staying with/ his parents in Bangalore. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Neither Kriti     nor</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Abhisek are     staying with</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     his parents in     Banglore</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     No error</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     given sentence is grammatically incorrect.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">When     there are 2 diffferent subjects that are joined by either _______     or/ Neither ____ nor/ not only __________ but also/ _____ or     _____ and are different in numbers, the subject closer to the     verb decides whether the verb will be singular or plural. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Here,     the subject closer to the verb is ‘Abhishek’ and thus the     verb ‘are’ will be replaced by ‘is’ to agree with the     singular subject.   </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in active voice.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     story of his uncle’s mysterious disappearance was first heard     by Rajesh in his childhood</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     The story uncle     heard first time was about Rajesh’s mysterious disappearance in     his childhood.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Rajesh’s     first story that uncle heard in his childhood was about his     mysterious disappearance.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Rajesh first     heard the story of his uncle’s mysterious disappearance in his     childhood.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The story     Rajesh first heard in his childhood was about his uncle’s     mysterious disappearance.</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     Voice to Passive Voice transformation rules: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + v2 + Obj ----- Obj + was/were + v3 + by + Sub. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct passive form of the given sentence is: <i><b>Rajesh     first heard the story of his uncle’s mysterious disappearance     in his childhood.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Identify     the INCORRECTLY spelt word in the given sentence.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">\"The     beginning of the movie was captivating, with its stuning visuals     and intriguing storyline.\"</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Beginning</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Captivating</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Stuning</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Intriguing</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:in ;widows:0;text-decoration:none\">     Protein</p>"], "correct": 1, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ iनयn. Iनयn iौ ोn धौौधnपiोि िधधंधnप ीयन ृिययक ूनयकहcपiयn. Aृयहप 70 ूधनcधnप यी दयहन ृयकदैौ iनयn iौ ीयहnक in पुध नधक ृिययक cिधिस यी दयहन ृिययक cोििधक ुधंयgियृin ोnक in ंहौcिध cिधिस cोििधक ंदयgियृin."}, {"qid": "", "question": "\r\n\r\n<p>Which of the following states hold the maximum number of Geographical Indication (GI)-tagged goods as of Sep 2024?</p>", "options": ["\r\n\r\n<p>Tamil Nadu</p>", "\r\n\r\n<p>Uttar Pradesh</p>", "\r\n\r\n<p>Bihar</p>", "\r\n\r\n<p>West Bengal</p>"], "correct": 2, "marks": "1", "explanation": "\r\n\r\n<ul>\r\n\t<li>The correct answer is Uttar Pradesh. It has total 75 GI-tagged goods, Tamil Nadu and Karnataka follow with 58 and 46 GI products respectively.</li>\r\n\t<li>With these six new additions, Uttar Pradesh retains its position as the state with the most GI-tagged products in India, reaching a total of 75. These include the famous Tirangi Barfi&#39; of Kashi, a tricoloured sweet. Varanasi: Six more products from Uttar Pradesh have been given the Geographical Indication (GI) tag.                                </li>\r\n\t<li>GI tag is a sign used on products that have a specific geographical origin and possess qualities or a reputation that are due to that origin. The GI tag helps to protect the products from imitation and ensures that consumers get the genuine product.</li>\r\n</ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Chief     Minister of which of the following states has declared the state     as a total-e-governance state?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Bihar</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kerala</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Mizoram</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil     Nadu</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Kerala.          </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                                   </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Kerala     has become India’s first “total e-governed state.” Building     upon its reputation as the first fully-literate state in India.     Kerala is referred to as ‘God’s own country. Alappuzha, a     city in Kerala, is known as ‘Venice of East. Vasco Da Gama     landed in the Kozhikode city of Kerala. The literacy rate of     Kerala is 94% and is the highest of all of India.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which     of the following is an indirect tax?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Goods     and services tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Capital     gains tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Wealth     tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Gift     tax</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Good and Service Tax (GST).       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                                                 </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Indirect     Tax: Indirect tax is the tax levied on the consumption of     goods and services. It is not directly levied on the income of a     person. Instead, he/she has to pay the tax along with the price     of goods or services bought by the seller.         </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Yakshagana     is a famous folk dance of which state?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Odisha</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Karnataka</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kerala</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Assam</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     correct answer is Karnataka. Yakshagana is a traditional folk     dance popular in the coastal districts of Karnataka. This     is a distinctive dance form representing mythological and     historical stories of India. A lot of effort and details go     into the performance of the Yakshagana dance.</p>"}, {"qid": "", "question": "\r\n<p>Which of the following country doesn&rsquo;t share its border with Iran?</p>", "options": ["\r\n<p>Turkmenistan</p>", "\r\n<p>Afghanistan</p>", "\r\n<p>Pakistan</p>", "\r\n<p>Kyrgyzstan</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p>The correct answer is Kyrgyzstan. It doesn&rsquo;t share its border with Iran.</p>\r\n\r\n<p>Iran is bounded to the north by Azerbaijan, Armenia, Turkmenistan, and the Caspian Sea; to the east by Pakistan and Afghanistan; to the south by the Persian Gulf and the Gulf of Oman; and to the west by Turkey and Iraq.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following is not an ore of Aluminium?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Bauxite</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Corundum</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Cryolite</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Dolomite</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Dolomite. Dolomite is an ore of Magnesium.                           </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Bauxite,     Corundum, Felspar, Cryolite, Alunite, Kaolin are ores of     Aluminium.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     article is related to the Annual Financial Budget?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     110</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     112</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     114</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article     124</p>"], "correct": 2, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Aनपicिध 112. Iप iौ निधोपधक पय पुध Annहोि ीinोnciोि ृहकgधप. Aनपicिध 110: Dधीiniपiयn यी “Mयnधद Biििस”. Aनपicिध 114: Aूूनयूनiोपiयn Biििस. Aनपicिध 124: Eौपोृिiौुंधnप यी Sहूनधंध cयहनप."}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which     of the following statement is correct?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      Article 23 of the Indian Constitution forbids employment of      children below the age of 14 years in dangerous jobs like      factories and mines.</p>      </li><li><p style=\"orphans:0;widows:0\">The      Article 24 of the Indian constitution forbids human      trafficking and begar (forced labour without payment) to protect      the millions of underprivileged and deprived people of the      country.</p>     </li></ol>", "options": ["<p style=\"orphans:0;widows:0\">     Only     Statement A</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     Statement B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Both     Statement A and B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Neither     A Nor B</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Neither A nor B.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Article     23: It prohibits human trafficking and begar (forced labour     without payment) to protect the millions of underprivileged and     deprived people of the country.                                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Article     24: It forbids employment of children below the age of 14 years     in dangerous jobs like factories and mines.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     is the author of the famous book titled “The God of Small     Things”?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Arundhati     Roy</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sashi     Tharoor</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ruskin     Bond</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     J.K.     Rowling</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Arundhati Roy. Her famous books are: The God of     Small Things, Azadi, The Algebra of Infinite Justice, The cost of     Living, Capitalism: A Ghost Story, Walking With Comrades, Things     that can and cannot Be Said, etc.                                                       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Sashi     Tharoor Books: An Era of Darkness, Pax Indica, Why I am a Hindu,     Nehru: The Invention of India, The great Indian Novel, Pride     Prejudice and Punditry, etc.                                                       <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Ruskin     Bond Famous books: The Room on the Roof, The Blue Umbrella, Angry     River, Vagrants in the Valley, A Flight of Pigeons, Book of     Humour, A Little Book of India: Celebrating 75 years of     Independence, The Golden Years: The Many Joys of Living a Good     Long Life, etc.                                                                                                                                                             </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     J.K     Rowling Famous Books: Harry Potter, The Ink black Heart, The     Christmas Pig.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Identify     which of the following statements are correct.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     1.The     headquarter of ICAR-Directorate of Groundnut Research is located     in Junagarh.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2.The     headquarter of ICAR-Directorate of Rapeseed &amp; Mustard     Research is located in Bharatpur.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     3.The     headquarter of ICAR-Directorate of Soybean Research is located in     Indore.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     2     and 3 only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1     and 3 only</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1,     2 and 3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1     and 2 only</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Option     c is the correct answer.                                                            </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     headquarter of ICAR-Directorate of Groundnut Research is located     in Junagarh. The headquarter of ICAR-Directorate of Rapeseed &amp;     Mustard Research is located in Bharatpur. The headquarter of     ICAR-Directorate of Soybean Research is located in Indore.                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                        ICAR,     Formerly known as Imperial Council of Agricultural Research, it     was established on 16 July 1929 as a registered society     under the Societies Registration Act, 1860 in pursuance of the     report of the Royal Commission on Agriculture. The ICAR has its     headquarters at New Delhi.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     International     Yoga day is observed on which day?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     2<sup>nd</sup>     February</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1<sup>st</sup>     March</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     20<sup>th</sup>     October</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     21<sup>st</sup>     June</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     correct answer is 21<sup>st</sup>     June. International Yoga Day is celebrated annually on June 21     with a motive to promote Yoga across the world. J&amp;K     Lieutenant Governor Manoj Sinha led the celebrations at the     Botanical Garden on the banks of Dal Lake in Srinagar.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following is the study of insects and their relationship     to humans, the environment, and other organisms?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Entomology</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ethology</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ornithology</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Mycology</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Entomology. It is the study of insects and     encompasses the biological, agricultural, and environmental     sciences related to insects and their interaction with humans and     other organisms.                                                                                                                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Ethology:      Ethology is the scientific study of animal     behavior—including animal communication, predation, defense,     aggression, mating, imprinting, fixed action patterns and     releasers, and migration—most often in their natural     conditions.                                               </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Ornithology:     It is a branch of zoology which deals with the study of birds.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                                  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Mycology:     <b>Mycology</b> is     the branch of biology concerned with the study     of fungi, including     their genetic and biochemical properties,     their taxonomy and their use to humans, including     as a source for tinder, traditional medicine, food,     and entheogens, as well as their dangers, such     as toxicity or infection.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Girnar     Hills is located in which of the following state?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Gujarat</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Himachal     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Uttarakhand</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Jharkhand</p>"], "correct": 1, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Gहुोनोप. Fोंयहौ ुiििस in Gहुोनोप ोनध: Sोपूहनो, Wiिसयn Hiििस, Dयn Hiििस, Giनnोन ुiििस. Hiंोcुोि Pनोकधौु: Dोिुयहौiध, Dुोनोंौुोिो, Kोौोिहi, Kिहिह ॅोििधद, Mोnोिi, Sुiंिो, Sियोn, Kधिदयng, Kुोुुiोन, Kहीनi, Kiोनigुोप, Cुोiि, Cुोंृो, Cुiपािह. Uपपोनोाुोnक: Aिंयनो, Lोnौकयथnध, Mहौौययनiध, Nोiniपोि. Jुोनाुोnक: Nधपोनुोप, Sोपi Hiििस, Rोncुi, Pोनोौnोपु Hiििस, Kुोnकियi Pोुोनi."}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Bordo     Cham is a famous folk dance of which state?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Arunachal     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Nagaland</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Meghalaya</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Manipur</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Arunachal Pradesh. Bordo Cham is a famous dance     of Arunachal Pradesh.                                                                                                                                            </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Famous     dance of Arunachal Pradesh: Bordo Cham, Buiya, Wancho Dance,     Ponung.                             </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Nagaland:     Chang Lo</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Ibn     Batuta is a famous traveller who came to India, He was from which     country?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Damascus</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Moroccan</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Portugal</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Iran</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     correct answer is Moroccan. He was a Morrish traveller, he     visited India during the reign of Muhammad-bin-Tughlaq. His book     ‘Rehla’ (the Travelogue) throws a lot of light on the reign     of Muhammad-bin-Tughlaq and the geographical, economic and social     conditions in India.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Boycott     of Simon Commission and broadcasting started in India in which of     the following year?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1920</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1927</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1942</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1945</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is 1927. Boycott of Simon Commission and     broadcasting started in India in 1927.                                                                                                      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Khilafat     Movement was launched in 1920.                                                                                            </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     In     1942 Cripps mission arrived in India, Quit India Movement     launched (August 8).                       </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     In     1945: Trial of Indian National Army at Red Fort; Shimla     Conference; World War II ends.      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": " <span> Select the option in which the following figure is embedded. (Rotation is NOT allowed)</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image001.png\" width=\"114\" height=\"116\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.i ause.</span>", "<span> I is the cause and II is its possible effect.</span>", "<span></span><span>  </span><span>II is the cause and I is its possible effect.</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><a name=\"_Hlk137485706\"><span>I. Over the last five years 42% of the Company R’s manpower was laid off. This statement talk about negative outcomes that the company R’s manpower was laid off due to various reason like financial difficulty, and management changes. </span></a></p><p><span>II. Over the past five years Company R has sold off many of their major assets. This statement is also talk about negative outcomes that the company R has sold off many of their major assets due to various reason like financial difficulty, management changes. </span></p><p><span>So, Both I and II are effects of a common cause.</span></p><p><span>Hence, option b is correct answer. </span></p>"}, {"qid": "", "question": " <span> Select the correct mirror image of the given combination when the mirror is held at the right side of the image.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image048.png\" width=\"321\" height=\"69\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image049.jpeg\" width=\"122\" height=\"24\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image050.jpeg\" width=\"125\" height=\"24\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image051.jpeg\" width=\"125\" height=\"26\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image052.jpeg\" width=\"122\" height=\"26\" alt=\"\">"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>[b]</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_
