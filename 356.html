e a software engineer, we want you as our developer.” An advertisement by company Y.</span></p><p><span>Inferences:</span></p><p><span>I. Software engineer are expected to be better performers by company Y.</span></p><p><span>II. The company Y needs developer.</span></p>", "options": ["<span> If only assumption I is implicit</span>", "<span> If only assumption II is implicit</span>", "<span> Both I and II are implicit</span>", "<span> Neither I nor II is implicit</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>I is not implicit. The company wants software engineers. One reason could be that the company excepts software engineers to be good performers, as I suggest. But there could be another reason; for example, the company’s developer job could be such that only a software engineer could perform it. But one thing is certain. The advertisement was for developers; this means developers are needed. Hence II is implicit.</span></p><p><span>Hence, option B is correct.</span></p>"}, {"qid": "", "question": " <span> Select the correct combination of mathematical signs to sequentially replace the * signs and balance the given equation.</span><p><span>11 * 8 * 375 * 5 * 41 = 122</span></p>", "options": ["<span> ÷</span><span>  </span><span>−</span><span>  </span><span>+</span><span>  </span><span>×</span>", "<span> +</span><span>  </span><span>×</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span> ×</span><span>  </span><span>+</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span></span><span>  </span><span>÷</span><span>  </span><span>×</span><span>  </span><span>+</span><span>  </span><span>−</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image054.png\" width=\"419\" height=\"408\" alt=\"\"></p>"}, {"qid": "", "question": " <span> If + means −, − means ×, × means ÷, and ÷ means +, what will be the value of the following expression?</span><p><span>56 ÷ 16 + 4 – 111 × 37 = ?</span></p>", "options": ["<span> 80</span>", "<span> 40</span>", "<span> 50</span>", "<span> 60</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image055.png\" width=\"366\" height=\"350\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span><p><span>(NOTE): Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</span></p><p><span>(28, 49, 70), (31, 54, 77)</span></p>", "options": ["<span> (24, 64,96)</span>", "<span> (17, 28, 49)</span>", "<span> (45, 71, 97)</span>", "<span> (31, 52, 84)</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image056.png\" width=\"437\" height=\"388\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Information given below represents the number codes for the given letters. Select the combination of numbers so that the letters arranged accordingly will form a meaningful word.</span><p><span>P = 1, C = 2, T = 3, M = 4, R = 5, O = 6, E = 7, U = 8</span></p>", "options": ["<span> 4,8,1,6,3,7,5,2</span>", "<span> 1,6,4,2,3,8,5,7</span>", "<span> 2,6,4,1,8,3,7,5</span>", "<span> 2,8,4,1,6,3,5,7</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image057.png\" width=\"383\" height=\"273\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Seven persons are sitting around a circular dining table facing the towards the centre. Sarita is sitting to the immediate left of Yash and third to the right of Riya. Riya is sitting to the immediate left of Adhya and immediate right of Puneet.</span><span>  </span><span>Adhya is sitting to the immediate left of Deepak. Qamar Jahan is sitting to the immediate left of Puneet. If Yash exchanges seat with Deepak and Puneet with Sarita, then who is sitting to the immediate right of Puneet?</span><span>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </span>", "options": ["<span> Riya</span>", "<span> Qamar Jahan</span>", "<span> Yash</span>", "<span> Deepak</span>"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image058.png\" width=\"471\" height=\"258\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In the given question, the statement is followed by two conclusions. Which of the two conclusions is/are true?</span><p><span>Statement: R </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> C &lt; N, A &gt; R, T &gt; C </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> U</span></p><p><span>Conclusions:</span></p><p><span>I. R </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> U</span></p><p><span>II. N &gt; T</span></p>", "options": ["<span> Only conclusion I is true</span>", "<span> Only conclusion II is true</span>", "<span> Both conclusions I and II are true</span>", "<span></span><span>  </span><span>Neither conclusion I nor II is true</span>"], "correct": 1, "marks": "1", "explanation": "<span> The correct answer is A.</span><p><span>Only conclusion I follows.</span></p><p><span>Conclusion:</span></p><p><span>I. R </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> U (true) (R </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> C </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523273478_image059.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> U)</span></p><p><span>II. N &gt; T (False) (N &gt; C &lt; T)</span></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
