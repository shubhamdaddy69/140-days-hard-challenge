<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 1 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": "\r\n<p>If interest be compounded quarterly, then find the compound interest on ₹19,683 at the rate of 44.44% per annum for 1 year.</p>", "options": ["\r\n<p>30,000</p>", "\r\n<p>13,000</p>", "\r\n<p>10,317</p>", "\r\n<p>10,517</p>"], "correct": 3, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_1f28c0a9e266fdcf.jpg\" style=\"height:358px; width:298px\" /></p>"}, {"qid": "", "question": "<p>A, B and C started a business with the investment of Rs. 10,000, Rs 27,000 and Rs 33,000 respectively. After 4 months, C left the business. 6 months after C left the business, B also left the business. B and C took their investments with them. At the end of the year, C received his share of profit as Rs. 209. What is the total share of profits of A and B?</p>\r\n\r\n<p> </p>", "options": ["<p>190</p>", "<p>292.5</p>", "<p>237.5</p>", "<p>617.5</p>"], "correct": 4, "marks": "1", "explanation": "<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_23e98a4cf1383ef8.jpg\" style=\"height:233px; width:345px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     ratio of milk to water in a 100 litres mixture is 3:7. 10 litres     of mixture is withdrawn and replaced with milk. This process is     repeated 2 more times. What is the percentage of milk in the     final mixture.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     51.03</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     48.97</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     54.63</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     46.37</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_710843595b08f51e.jpg\" width=\"350\" height=\"333\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     What     is the volume of the largest sphere that can be carved out of a     wooden cube whose body diagonal is 21<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_bdd5331ff86f145e.gif\" >      cm? (use      <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_4954ad72c002102.gif\" >      = 22/7)</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     4851     cm<sup>3</sup></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     5821     cm<sup>3</sup></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     6858     cm<sup>3</sup></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     3851     cm<sup>3</sup></p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_dce8e13f94d07f68.jpg\" width=\"290\" height=\"411\" > </p>"}, {"qid": "", "question": "\r\n<p>There are three taps of diameter 3 cm, 4 cm and 6 cm, respectively. The ratio of the water flowing through them is equal to the ratio of the square of their diameters. The biggest tap can fill an empty tank alone in 50 min. If all the taps are opened simultaneously, then how long will the tank take (in min) to be filled?</p>\r\n\r\n<p> </p>", "options": ["\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/170358617399c66a13-1703586173.png\" style=\"height:36px; width:38px\" /></p>", "<p>29 (31/61)</p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586174aef55fb8-1703586174.png\" style=\"height:36px; width:38px\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586174f9830863-1703586174.png\" style=\"height:36px; width:38px\" /></p>"], "correct": 2, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_716f351bb08e89a.jpg\" style=\"height:324px; width:319px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A     scooter is sold for ₹ 95,030 by allowing a discount of 35% on     its marked price. The marked price (in ₹) of the scooter is:</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1,56,200</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1,36,200</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1,46,200</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1,66,200</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_b309966343272381.jpg\" width=\"336\" height=\"183\" > </p>"}, {"qid": "", "question": "<p>Find the mean for the given distribution.</p>\r\n\r\n<p> </p>", "options": ["<p>100.5</p>", "<p>21.22</p>", "<p>10.5</p>", "<p>20</p>"], "correct": 2, "marks": "1", "explanation": ""}, {"qid": "", "question": "\r\n<p>The product of the two numbers is 2880 and their HCF is 12. The number of such possible co-prime pairs is/are:</p>\r\n\r\n<p> </p>", "options": ["\r\n<p>2</p>", "\r\n<p>3</p>", "\r\n<p>4</p>", "\r\n<p>1</p>"], "correct": 1, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_f25a2122c4b81e.jpg\" style=\"height:235px; width:375px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     difference between the areas of two concentric circles is 330     cm<sup>2</sup>.     Then what is the difference between their radii if the sum of     diameters of both the circles is 35 cm?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     3     cm</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     5     cm</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     6     cm</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     4     cm</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_f43d30bd60904ab4.jpg\" width=\"349\" height=\"312\" > </p>"}, {"qid": "", "question": "\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:Calibri,sans-serif\">Find the value of </span></span></p>", "options": ["\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586174904bd12a-1703586174.png\" style=\"height:40px; width:47px\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586175993bb8ac-1703586175.png\" style=\"height:40px; width:47px\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/17035861759819607c-1703586175.png\" style=\"height:40px; width:47px\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in/paperimages/1727337299_1727337299949454_thump.png\" style=\"height:40px; width:47px\" /></p>"], "correct": 1, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in/paperimages/1727337318_1727337318312971_thump.png\" style=\"height:634px; width:486px\" /></p>"}, {"qid": "", "question": "<p><span style=\"font-size:12.0pt\"><span style=\"font-family:Cambria-Bold\">Determine the ratio in which the line </span></span><em><span style=\"font-size:12.0pt\"><span style=\"font-family:&quot;Cambria Math&quot;,serif\">2x+y-4=0</span></span></em> le=\"orphans:0;widows:0;text-decoration:none\">     ₹54250,     ₹35875</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹54260,     ₹35880</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹54230,     ₹35970</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹35875,     ₹54250</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690009046360_html_9972ac10f8c3d34d.gif\" alt=\"Picture 49\" width=\"329\" height=\"326\" > </p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in passive voice.<br />\r\nWe can purchase clothes online from Myntra.<br />\r\n </p>", "options": ["<p>Clothes were to be purchased online from Myntra.<br />\r\n </p>", "<p>Clothes can be purchased online from Myntra.<br />\r\n </p>", "<p>Clothes are purchased online from Myntra.<br />\r\n </p>", "<p>Clothes could be purchased online from Myntra.<br />\r\n <br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option b is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Active to Passive rule: - </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Sub + Can (Modal Verb) + v1 +Obj ------ Obj + Can+ be + V3 + by + Sub. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The correct answer is- Clothes can be purchased online from Myntra. </span></span></p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in passive voice.<br />\r\nThey drew a circle in the evening.<br />\r\n </p>", "options": ["<p>A circle was being drawn by them in the evening.<br />\r\n </p>", "<p>A circle was drawn by them in the evening.<br />\r\n </p>", "<p>In the evening a circle have been drawn by them.<br />\r\n </p>", "<p>A circle has been drawing since evening.<br />\r\n <br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p>Option b is the correct answer.</p>\r\n\r\n<p>Active to Passive rule-: Sub + Verb 2 + Obj ---- Obj + was/were + v3 + by + Sub.</p>\r\n\r\n<p>Hence the correct answer is-: A circle was drawn by them in the evening.   </p>"}, {"qid": "", "question": "<p>The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don&rsquo;t find any error, mark &lsquo;No error&rsquo; as your answer.<br />\r\nNeither of them/ are going to attend the meeting/ on 19 August.</p>", "options": ["<p>Neither of them<br />\r\n </p>", "<p>are going to attend the meeting<br />\r\n </p>", "<p>No error<br />\r\n </p>", "<p>on 19 August<br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "Oूपiयn ृ iौ पुध cयननधcप ोnौथधन. Nधiपुधन यी ंधोnौ &िसतहयेnयप धiपुधन यी पुध पथय पुingौ यन ूधयूिध&नौतहये. Sधcयnक ौधgंधnप iौ incयननधcप. Tय नधcपiीद पुध ौधnपधncध, थध थiिि हौध &िसतहयेiौ&नौतहये inौपधोक यी &िसतहयेोनध&नौतहये. Tुध nयहn/ूनयnयहn ीियियथing &िसतहयेnधiपुधन&नौतहये iौ ूिहनोि, ृहप पुध ॅधनृ ीियियथing पुध nयहn/ूनयnयहn ंहौप ृध ौingिहोन."}, {"qid": "", "question": "<p>Select the most appropriate ANTONYM of the highlighted word.<br />\r\n&ldquo;On the face of it, there does seem to be something <strong>amiss</strong> here.&rdquo;<br />\r\n </p>", "options": ["<p>Marred<br />\r\n </p>", "<p>Impeccable<br />\r\n </p>", "<p>Vitiated<br />\r\n </p>", "<p>Gaily<br />\r\n <br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p>Option b is the correct answer.</p>\r\n\r\n<p>Amiss means not right; not suitable or as expected.</p>\r\n\r\n<p>Impeccable: without any mistakes or faults; perfect.</p>\r\n\r\n<p>Marred: to harm or damage something good.</p>\r\n\r\n<p>Vitiated: to make something less effective; to spoil something.</p>\r\n\r\n<p>Gaily: brightly, or in a happy manner.     </p>"}, {"qid": "", "question": "<p>Select the most appropriate ANTONYM of the highlighted word.<br />\r\nThe teenager faced <strong>objurgation</strong> from his parents when he returned home after midnight.</p>", "options": ["<p>Endorsement<br />\r\n </p>", "<p>Hamper<br />\r\n </p>", "<p>Reproof<br />\r\n </p>", "<p>Commination<br />\r\n <br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p>Option b is the correct answer. Objurgation:</p>\r\n\r\n<p>Objurgation is a harsh reprimand or criticism.</p>\r\n\r\n<p>Endorsement: An endorsement is a form of public support or approval.</p>\r\n\r\n<p>Hamper: prevent the progress or free movement of.</p>\r\n\r\n<p>Reproof: an act or expression of criticism and censure.</p>\r\n\r\n<p>Commination:  a threat of divine punishment or vengeance.</p>\r\n\r\n<p>Hence the correct antonym of the give word &lsquo;Objurgation&rsquo; is Endorsement.   </p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in passive voice.<br />\r\nHer proposal was objected to and everyone laughed at her.<br />\r\n </p>", "options": ["<p>Everyone objected her proposal and laughed at her.<br />\r\n </p>", "<p>Everyone objected to her proposal and she was laughed at.<br />\r\n </p>", "<p>Everyone objected to and laughed at her and her proposal.<br />\r\n </p>", "<p>Her proposal was objected and she was laughed.<br />\r\n <br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p>Option b is the correct answer.</p>\r\n\r\n<p>Active to Passive Rule-: Sub + v2 + Obj ------ Obj + was/were + v3 + Sub.</p>\r\n\r\n<p>Hence the correct answer is: Everyone objected to her proposal and she was laughed at.  </p>"}, {"qid": "", "question": "<p>Select the option that can be used as a one-word substitute for the given group of words.<br />\r\nA publication containing astronomical or meteorological information.<br />\r\n </p>", "options": ["<p>Conscription<br />\r\n </p>", "<p>Allegory<br />\r\n </p>", "<p>Almanac<br />\r\n </p>", "<p>Bane<br />\r\n <br />\r\n </p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option c is the correct answer.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Almanac: In the traditional sense, an almanac is a publication containing astronomical and meteorological data for a given year that often includes other miscellaneous information.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Conscription: Compulsory enrollment of persons especially for military service.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Allegory: the expression of truths or generalizations about human existence by means of symbolic fictional figures and their actions.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Bane: something that causes trouble and makes somebody unhappy.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Hence the correct answer is Almanac. </span></span></p>"}, {"qid": "", "question": "<p>Select the correct homonym from the given options to fill in the blank.<br />\r\nThe crowd __________ in excitement as the team scored the winning goal.</p>", "options": ["<p>roared<br />\r\n </p>", "<p>whispered<br />\r\n </p>", "<p>sneezed<br />\r\n </p>", "<p>yawned<br />\r\n <br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The word &ldquo;roared&quot; indicates a loud and enthusiastic reaction, which aligns with the context of the ndo-Tibbet Road has been blocked. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Sentences DB is the correct pair ( B is the detailing of sentence D).   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Hence the correct arrangement is-: ACDB:</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Floods in Jummagad river in the border area of the Chamoli district of Uttarakhand have washed away the bridge built on it, blocking the Indo-Tibet border road there while contact with over a dozen border villages has also been lost.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Flooding in Jummagad river flowing near Jumma village on the Joshimath-Niti highway, about 45 km from Joshimath, continued till late night on Monday evening, during which the bridge collapsed.</span></span></p>"}, {"qid": "", "question": "<p>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.<br />\r\nEvery / curious child / want to / rip open a toy.<br />\r\n </p>", "options": ["<p>want to<br />\r\n </p>", "<p>Every<br />\r\n </p>", "<p>rip open a toy<br />\r\n </p>", "<p>curious child<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The given sentence is grammatically incorrect.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Rule: Each, Every, Everyone, Someone, Nobody and One takes singular verb. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Thus, &lsquo;Wants to&rsquo; will come instead of &lsquo;Wan d.<br />\r\nD. Mahabharata and Ramayana are two great examples of colossal works that unquestionably enjoy the virtue of being peak sources for the cultural ethos of the country.<br />\r\n </p>", "options": ["<p>BDAC<br />\r\n </p>", "<p>DACB<br />\r\n </p>", "<p>BACD<br />\r\n </p>", "<p>ACBD<br />\r\n <br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer.     </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">All the given sentence talks about the India&rsquo;s greatness in storytelling. Sentence B is the starting sentence and followed by sentence D (as sentence D is the example of sentence B). </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Sentence DA is the correct pair because use of &lsquo;they&rsquo; in the sentence A refers to Mahabharata and Ramayana. And sentence C will come to the end as it is the conclusive statement.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Thus, the correct arrangement is: BDAC: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">India is a country where people are full of immense prolixity and exemplary storytelling. Mahabharata and Ramayana are two great examples of colossal works that unquestionably enjoy the virtue of being peak sources for the cultural ethos of the country. They stand undefeated in the realms of Shakespeare and Homer. Additionally, the philosophical discourse and discussions on various dilemmas of life associated with the Bhagavad Gita are highly appreciated by scholars from all over the world.</span></span></p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p>Select the most appropriate option to fill in the blank.<br />\r\nGlobal warming or climate change has today become a major ______ to mankind.<br />\r\n </p>", "options": ["<p>threat<br />\r\n </p>", "<p>penalty<br />\r\n </p>", "<p>punishment<br />\r\n </p>", "<p>endanger<br />\r\n <br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer. Threat suits the best. </span></span></p>\r\n\r\n<p> </p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Threat: the possibility of trouble or danger. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Penalty: a punishment for breaking a law, rule or contract. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Punishment: the action or way of punishing somebody. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Endanger: to cause danger to somebody/something.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Thus, the correct sentence is: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Global warming or climate change has today become a major threat to mankind.</span></span></p>"}, {"qid": "", "question": "<p>Select the option that gives the most appropriate meaning of the highlighed idiom.<br />\r\n<span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The Chairman of our company takes care of the <strong>rank and file</strong> in the company.</span></span></p>", "options": ["<p>Ordinary people<br />\r\n </p>", "<p>Documents and files<br />\r\n </p>", "<p>Only the top rank people<br />\r\n </p>", "<p>Officers<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Rank and file: the ordinary workers in a company or the ordinary members of an organization, and not the leaders.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Example: Central leadership controls the rank and file politicians through this hierarchical channel.</span></span></p>"}, {"qid": "", "question": "<p>Select the most appropriate SYNONYM of the given word.<br />\r\nTaciturn<br />\r\n </p>", "options": ["<p>Reserved<br />\r\n </p>", "<p>Lively<br />\r\n </p>", "<p>Noisy<br />\r\n </p>", "<p>Verbose<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Taciturn: tending not to speak very much, in a way that seems unfriendly; silent/reserved/reticent/restrained. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Lively: full of energy, interest, excitement, etc.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Noisy: making a lot of or too much noise; full of noise. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Verbose: containing more words than necessary</span></span></p>"}, {"qid": "", "question": "<p>Select the most appropriate option that can substitute the highlighted segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.<br />\r\nThe first meeting of the Standing Committee <strong>will be hold next week.</strong><br />\r\n </p>", "options": ["<p>No substitution required<br />\r\n </p>", "<p>will held next week<br />\r\n </p>", "<p>will be holding next week<br />\r\n </p>", "<p>will be held next week<br />\r\n </p>"], "correct": 4, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option d is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The given sentence is grammatically incorrect and to rectify it, &lsquo;will be held next week&rsquo; should be used instead of &lsquo;will be hold next week&rsquo;.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The structure &lsquo;Will + be&rsquo; is followed by present participle/past participle form of the verb. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Thus, the correct sentence is: The first meeting of the Standing Committee will be held next week. </span></span></p>"}, {"qid": "", "question": "<p>Select the most appropriate option to substitute the highlighted segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.<br />\r\nOf the two plans submitted by the architect, this is the one <strong>more likely</strong> to be accepted.<br />\r\n </p>", "options": ["<p>much likely<br />\r\n </p>", "<p>No substitution required<br />\r\n </p>", "<p>most likely<br />\r\n </p>", "<p>most likelihood<br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option b is the correct answer.    </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The given sentence is grammatically correct. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">When we compare two things then we use comparative degree and  the given sentence is talking about two plans of architect. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Hence the comparative degree more is correctly used.</span></span></p>\r\n\r\n<p> </p>"}, {"qid": "", "question": "<p>Select the correct indirect speech form of the given sentence.<br />\r\nMother said, &ldquo;I&rsquo;m worried about your safety.&rdquo;<br />\r\n </p>", "options": ["<p>Mother told me that she was worried about my safety.<br />\r\n </p>", "<p>Mother told me that she had been worried about my safety.<br />\r\n </p>", "<p>Mother said she is worried about your safety.<br />\r\n </p>", "<p>Mother said that I was worrying about your safety.<br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option a is the correct sentence. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Rule to change Direct speech into Indirect speech-: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">If the reporting verb (sentence outside the inverted comma) is in the past tense and Reported speech (inside the inverted comma) is in the present tense, then the following transformation will occur: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Simple Present ----- Simple Past.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Continuous ------ Past Continuous. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Perfect ------- Past Perfect. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Perfect Continuous ----- Past Perfect Continuous. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Thus, the correct Indirect form of the given sentence is: </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">Mother told me that she was worried about my safety.</span></span></p>"}, {"qid": "", "question": "<p>Select the option that expresses the given sentence in reported speech.<br />\r\nEverybody said, &ldquo;How well she dances!&rdquo;<br />\r\n </p>", "options": ["<p>Everybody told us that she dances very well.<br />\r\n </p>", "<p>Everybody exclaimed that she dances very well.<br />\r\n </p>", "<p>Everybody exclaimed that she danced very well.<br />\r\n </p>", "<p>Everybody told us that how she danced very well.<br />\r\n <br />\r\n </p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Rule to change Direct speech into Indirect speech-: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">If the reporting verb (sentence outside the inverted comma) is in the past tense and Reported speech (inside the inverted comma) is in the present tense, then the following transformation will occur: </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Simple Present ----- Simple Past.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Continuous ------ Past Continuous. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Perfect ------- Past Perfect. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Present Perfect Continuous ----- Past Perfect Continuous. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">The given sentence is an exclamatory sentence hence exclaimed will be used instead of &lsquo;said&rsquo;. </span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Cambria&quot;,serif\">The correct sentence is-: Everybody exclaimed that she danced very well.</span></span></p>"}, {"qid": "", "question": "<p>Identify the CORRECTLY spelt word.<br />\r\n </p>", "options": ["<p>Drunkenness<br />\r\n </p>", "<p>Consciencious<br />\r\n </p>", "<p>Decieve<br />\r\n </p>", "<p>Definately<br />\r\n <br />\r\n </p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Option c is the correct answer. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Drunkenness is correctly spelt which means a temporary state resulting from excessive consumption of alcohol.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Conscientious: characterized by extreme care and great effort. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Deceive:  To deceive means to trick or lie.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Cambria,serif\">Definitely: without question and beyond doubt.</span></span></p>"}, {"qid": "", "question": "<p>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.<br />\r\n <br />\r\nThe importance of physical exercise in (1) ______ the incidence of heart attacks cannot be under estimated. The rise of heart attacks has been attaining (2) ______ proportion in recent times causing grave concern specially to the medical (3) ______. Walking is the best mode of physical exercise which (4) ______ no equipment, money, material or membership of a club.<br />\r\n <br />\r\nSelect the most appropriate option to fill in blank number 1.<br />\r\n </p>", "options": ["<p>minimising<br />\r\n </p>", "<p>increasing<br /  ocean with an average depth of 4,200 meter.          </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      Mariana Trench is the world’s deepest trench with a depth of      11,033 meters.       </p>      </li><li><p style=\"orphans:0;widows:0\">Most      of the islands of this ocean are of volcanic or coral origin.       </p>     </li></ul>"}, {"qid": "", "question": "\r\n<p>International Women&rsquo;s Day is observed on ______.</p>", "options": ["\r\n<p>8th March</p>", "\r\n<p>16th March</p>", "\r\n<p>3rd March</p>", "\r\n<p>15th March</p>"], "correct": 1, "marks": "1", "explanation": "<p>The correct answer is 8th March.   </p>\r\n\r\n<p>In 1975, during the International Women&#39;s Year, the United Nations began celebrating 8 March as International Women&#39;s Day.</p>\r\n\r\n<p><strong>2024 Theme: &ldquo;Invest in women: Accelerate progress&rdquo;. </strong></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following states has announced that Nauradehi and     Durgavati Wildlife Sanctuaries combined protected area will be     created as the tiger reserve?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Madhya     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Maharashtra</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Chhattisgarh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Uttar     Pradesh</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Madhya Pradesh.        </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Nauradehi     Wildlife Sanctuary, spanning around 1,197 sq km, is the largest     wildlife sanctuary in Madhya Prades :0in\">     <b>5.     Tiger Reseves</b></p>     <p style=\"orphans:0;widows:0;margin-left:-0.2in;margin-bottom:0in;border:none;padding:0in\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Kanha      Tiger Reserve, Mandla, Balaghat</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Pench      Tiger Reserve, Seoni, Chhindwara</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Bandhavgarh      Tiger Reserve, Umaria</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Panna      Tiger Reserve, Panna</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Satpura      Tiger Reserve, Hoshangabad</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span><b>Sanjay-Dubri      Tiger Reserve</b></span></p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Subsidiary     Alliance Treaty Bassein was signed in which of the following     Angle-Maratha War?      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     First     Anglo-Maratha War</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Second     Anglo-Maratha War</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Third     Anglo-Maratha War</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     None     of these</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Second Anglo-Maratha war.                                                   </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <b>First      Anglo-Maratha War (1775-82)-: </b>Favouring the cause of      Raghunath Rao for Peshwarsip, Englis (Hastings) came in conflict      with the Marathas. On being defeated, the British had to sign      the humiliating <b>Convention of</b> <b>Wadgaon</b> (1179).       </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.3in;margin-bottom:0.14in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <b>Second      Anglo-Maratha War (1803-06)-: </b>The<b> </b>Maratha Peshwa      signed the<b> Subsidiary Alliance Treaty of Bassein (1882).</b></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-left:0.3in;margin-bottom:0.14in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <b>Third      Anglo-Maratha war (1817-18)-: </b>Lord Hastings was determined      to proclaim British Paramountacy in India. He moved against      Pindaris transgressed the sovereignty of the Maratha chiefs and      the war began. The Maratha were decisively defeated.       </p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following is an Indirect Tax in India?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Goods     and Service Tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Income     Tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Corporation     Tax</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Capital     Gain Tax</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The     correct answer is Goods and Service Tax.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                    <b>Indirect     Tax-:   </b>Indirect     tax is the tax levied on the consumption of goods and     services. It is not directly levied on the income of a person.     Instead, he/she has to pay the tax along with the price of goods     or services bought by the seller. A few examples of indirect     taxes in India include service tax, GST, central excise and     customs duty, and value added tax (VAT).      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">                  <b>Direct     Tax-: </b>A     direct tax is a tax that a person or organization pays     directly to the entity that imposed it. Examples include income     tax, real property tax, personal property tax, and taxes on     assets, all of which are paid by an individual taxpayer directly     to the government.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which     of the following Amendments of the Constitution of India added a     new fundamental duty under Article 51-A?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Eighty-Fifth     Amendment Act, 2001</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Eighty-Sixth     Amendment Act, 2002</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Eighty-Eighth     Amendment Act, 2003</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Eighty-Seventh     Amendment Act, 2003</p>"], "correct": 2, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Eigुपद-Siसपु Aंधnकंधnप Acप, 2002. Tुध 86पु Aंधnकंधnप Acप 2002 िोपधन ोककधक पुध 11 tyle=\"orphans:0;widows:0;margin-bottom:0.14in\">      This      Veda contains hymns many of which were charms and magic spells      which are meant to be pronounced by the person who seeks some      benefit, or more often by a sorcerer who would say it on his or      her behalf.</p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p>Who among the following wrote &lsquo;India Wins freedom&rsquo;?</p>\r\n\r\n<p> </p>", "options": ["<p>Abul Kalam Azad</p>", "<p>A.P.J. Abdul Kalam</p>", "<p>Jawahar Lal Nehru</p>", "<p>Rajendra Prasad</p>"], "correct": 1, "marks": "1", "explanation": "<p>The correct answer is Abul Kalam Azad.</p>\r\n\r\n<p>&ldquo;<strong>India Wins Freedom&rdquo;</strong> is an enlightened account of the partition from the author, Maulana Azad&rsquo;s perspective. It includes his personal experiences when India became independent, and his ideas on freedom and liberty.</p>\r\n\r\n<p><strong>A.P.J. Abdul Kalam books-: </strong></p>\r\n\r\n<p>Wings of Fires, India 2020, Ignited Minds, You are born to blossom, etc.</p>\r\n\r\n<p><strong>Jawahar Lal Nehru books-: </strong></p>\r\n\r\n<p>The Discovery of India, An Autobiography, Letters from a Father to his daughter, Glimpses of World History, India and the World, etc.</p>\r\n\r\n<p> </p>"}, {"qid": "", "question": " <span> Information given below represents the number codes for the given letters. Select the combination of numbers so that the letters arranged accordingly will form a meaningful word.</span><p><span>R = 1, A = 2, T = 3, U = 4, P = 5, A = 6, R = 7, L = 8, I = 9, C = 10</span></p>", "options": ["<span> 5, 7, 2, 3, 9, 8, 6, 1, 10, 4</span>", "<span> 5, 2, 7, 3, 9, 10, 4, 8, 6, 1</span>", "<span></span><span>  </span><span>5, 2, 7, 3, 10, 9, 4, 8, 1, 6</span>", "<span> 5, 2, 7, 3, 9, 10, 8, 4, 1, 6</span>"], "correct": 2, "marks": "1", "explanation": "<span></span><p><span>P A R T I C U L A R = 5, 2, 7, 3, 9, 10, 4, 8, 6, 1</span></p><p><span>Hence, option b is correct answer.</span></p>"}, {"qid": "", "question": " <span> In the given question, the statement is followed by two conclusions. Which of the two conclusions is/are true?</span><p><span>Statement: A = P ≥ R &gt; G &lt; Y &gt; Q = S</span></p><p><span>Conclusions:</span></p><p><span>I. R &lt; S</span></p><p><span>II. R ≥ A</span></p>", "options": ["<span> Only conclusion I is true</span>", "<span> Only conclusion II is true</span>", "<span> Both conclusions I and II are true</span>", "<span> Neither conclusion I nor II is true</span>"], "correct": 4, "marks": "1", "explanation": "<span> </span><p><span>Conclusion I: there is no relation between R and S. So, this conclusion does not follow.</span></p><p><span>conclusion II: in the given statement A is equal to P and P is either equal to or greater than R. therefore, A is either greater than or equal to R. but in the given conclusion R ≥ A which does not follow. </span></p><p><span>Therefore, neither conclusion I nor II is true.</span></p><p><span>Hence, option d is correct answer.</span></p>"}, {"qid": "", "question": " <span> Which of the option figures represents the correct water image of the figure given below?</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image001.png\" width=\"95\" height=\"83\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image002.png\" width=\"93\" height=\"104\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image003.png\" width=\"92\" height=\"100\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image004.png\" width=\"92\" height=\"95\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image005.png\" width=\"92\" height=\"97\" alt=\"\">"], "correct": 4, "marks": "1", "explanation": "<span> </span><p><span>According to water image option d is correct.</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image006.png\" width=\"96\" height=\"102\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Three statements are given, followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.</span><p><span>Statement:</span></p><p><span>Some Basketball are Tennis.</span></p><p><span>All Cricket are Badminton.</span></p><p><span>Some Tennis are Cricket.</span></p><p><span>Conclusions:</span></p><p><span>(I) Some Basketball are Badminton.</span></p><p><span>(II) Some Cricket are Basketball.</span></p><p><span>(III) Some Badminton are Tennis.</span></p>", "options": ["<span> Both Conclusions I and III follow.</span>", "<span> Only Conclusion III follows.</span>", "<span> Neither Conclusions I nor II follow.</span>", "<span> Only Conclusion I follows.</span>"], "correct": 2, "marks": "1", "explanation": "<span></span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image007.png\" width=\"250\" height=\"303\" alt=\"\"></p><p><span>Conclusions I: some Basketball are badminton. There is a possibility of being some Basketball are badminton but it is not sure. So, conclusion I doesn’t follow.</span></p><p><span>Conclusion II: some Cricket are Basketball. There is a possibility of being some Cricket are Basketball, but it is not sure. So, conclusion II doesn’t follow.</span></p><p><span>Conclusion III: some Badminton are Tennis. ATQ some Tennis are Cricket and all Cricket are Badminton. So, some Badminton are also Tennis.</span></p><p><span>hence, (B) (Only Conclusion III follows) is the correct answer.</span></p>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?)  for pursuing.</p>\r\n\r\n<p>Statement: A very large number of students have failed in the final year examination due to faulty questions in one of the subjects.</p>\r\n\r\n<p>Courses of action:</p>\r\n\r\n<p>I. All the students who have failed in the subject should be allowed to take supplementary examination.</p>\r\n\r\n<p>II. All those who are responsible for the error should be suspended and an enquiry should be initiated to find out the facts.</p>", "options": ["\r\n<p>Only I follow</p>", "\r\n<p>Only II follows</p>", "\r\n<p>Neither I nor II follows</p>", "\r\n<p>Both I and II follows</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p>Given statement is talking about A very large number of students have failed in the final year examination due to faulty questions in one of the subjects. The faulty questions in the examination paper are a big mistake of school management and students should not be made to suffer on account of this. Thus, a re-test should be organised for the students and those responsible for the error be penalised to prevent reoccurrence of such mistake in the future.</p>\r\n\r\n<p>Hence, both the courses follow.</p>"}, {"qid": "", "question": " <span> Select the figure from among the given options that can replace the question mark (?) in the following series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image025.png\" width=\"304\" height=\"89\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image026.png\" width=\"101\" height=\"107\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image027.png\" width=\"102\" height=\"110\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image028.png\" width=\"99\" height=\"114\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image029.png\" width=\"102\" height=\"113\" alt=\"\">"], "correct": 3, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image028.png\" width=\"99\" height=\"114\" alt=\"\"></p><p><span>Hence, option c is correct answer.</span></p>"}, {"qid": "", "question": " <span> If + means −, − means ×, × means ÷, and ÷ means +, what will be the value of the following expression?</span><p><span>35 ÷ 6 + 3 – 42 × 6 =? </span></p>", "options": ["<span> 21</span>", "<span> 19</span>", "<span> 18</span>", "<span> 20</span>"], "correct": 4, "marks": "1", "explanation": "<span></span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image030.png\" width=\"270\" height=\"422\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span><p><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g., 13 – Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</span></p><p><span>(28, 34, 40), (37, 48, 59)</span></p>", "options": ["<span> (24, 64,96)</span>", "<span> (17, 28, 49)</span>", "<span> (37, 47, 57)</span>", "<span> (31, 52, 84)</span>"], "correct": 3, "marks": "1", "explanation": "<span></span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image031.png\" width=\"269\" height=\"560\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Three of the following words are alike in some manner and hence form a group. Which word does NOT belong to that group?</span><span>  </span><span>(The words must be considered as meaningful English words and must not be grouped based on the number of letters/number of consonants/vowels in the word)</span>", "options": ["<span> Despondency</span>", "<span> Euphoria</span>", "<span> Melancholy</span>", "<span> Sorrow</span>"], "correct": 2, "marks": "1", "explanation": "<span> ll the given words except Euphoria are negative words. Euphoria means a state of being in intense happiness. Despondency, Melancholy and sorrow are synonyms of Sadness.</span>"}, {"qid": "", "question": " <span> Amrita ranked 12th from the top and 37th from the bottom in his class. How many students are there in the class?</span>", "options": ["<span> 49</span>", "<span> 48</span>", "<span> 47</span>", "<span> 25</span>"], "correct": 2, "marks": "1", "explanation": "<span></span><p><span>Amrita is 12th from the top and 37th from the bottom. </span></p><p><span>Total number of students = (12 + 37)</span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image015.png\" width=\"18\" height=\"19\" alt=\"\" style=\"vertical-align:middle\"><span> 1 = 48 (we deduct 1 because we count twice the position of amrita)</span></p><p><span>Hence, option b is correct answer.</span></p>"}, {"qid": "", "question": " <span> In a certain code language, ‘ABOLISH’ is written as ‘130’ and ‘FLIP’ is written as ‘69’. How will ‘UNCONTROL’ be written in that language?</span>", "options": ["<span> 114</span>", "<span> 120</span>", "<span> 128</span>", "<span> 129</span>"], "correct": 2, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image032.png\" width=\"325\" height=\"507\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct answer.</span><p><span>I. Over the last four years 32% of the Company X’s manpower was laid off.</span></p><p><span>II. Over the past four years Company X has sold off many of their major assets.</span></p>", "options": ["<span> Both I and II are independent causes.</span>", "<span> I is the cause and II is its possible effect</span>", "<span> Both I and II are effects of a common cause.</span>", "<span> II is the cause and I is its possible effect.</span>"], "correct": 3, "marks": "1", "explanation": "<span></span><p><span>I. Over the last four years 32% of the Company X’s manpower was laid off. This statement is talking about negative outcomes that the company X’s manpower was laid off due to various reason like financial difficulty, and management changes. </span></p><p><span>II. Over the past four years Company X has sold off many of their major assets. This statement is also talking about negative outcomes that the company X has sold off many of their major assets due to various reason like financial difficulty, management changes. </span></p><p><span>So, Both I and II are effects of a common cause.</span></p><p><span>Hence, option c is correct answer. </span></p>"}, {"qid": "", "question": " <span> Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.</span><p><span>M C Q _ V M _ Q _ V _ C _ K V M _ Q L _</span></p>", "options": ["<span> I C I M Q C V</span>", "<span> I C J M Q C V</span>", "<span> J D J M Q D V</span>", "<span> J C J M Q C V</span>"], "correct": 2, "marks": "1", "explanation": "<span></span><p><span>M C Q _ V M _ Q _ V _ C _ K V M _ Q L _</span></p><p><span>M C Q I V/ M C Q J V/ M C Q K V/ M C Q L V</span></p><p><span>Therefore, (I C J M Q C V) option b is correct answer.</span></p>"}, {"qid": "", "question": " <span> A question is given, followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements is sufficient to answer the question. Read both the statements and select the appropriate answer.</span><p><span>Q. Four people, P, Q, R and S, are sitting in a ><span>Inference I is talking about non smokers are healthy. From the given statement we cannot say that every non smokers are healthy. There are many people who don’t smoke but still have some health issues. Therefore, this inference doesn’t follow.</span></p><p><span>Inference II is talking about cigarette leads to many diseases. So, all smokers are not healthy. Cigarette is very dangerous for health but it is not true that all smokers have some disease. So, this inference doesn’t follow.</span></p><p><span>Neither I not II follows. </span></p><p><span>Hence, option c is correct answer.</span></p>"}, {"qid": "", "question": " <span> Seven persons are sitting around a circular dining table facing the towards the centre. L is sitting to the immediate left of M and third to the right of N. N is sitting to the immediate left of O and immediate right of G. O is sitting to the immediate left of H. I is sitting to the immediate left of G. then who is sitting to the second to the right of H?</span>", "options": ["<span> M</span>", "<span> O</span>", "<span> L</span>", "<span> I</span>"], "correct": 1, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image047.png\" width=\"307\" height=\"328\" alt=\"\"></p>"}, {"qid": "", "question": "\r\n<p>Three of the following four triads are alike in a certain way as they are formed by performing same mathematical operations among themselves and thus form a group. Which triad does NOT belong to that group?</p>", "options": ["\r\n<p>9 : 7 : 128</p>", "\r\n<p>5 : 3 : 32</p>", "\r\n<p>7 : 5 : 72</p>", "\r\n<p>8 : 6 : 102</p>"], "correct": 4, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in/paperimages/1727337188_1727337188920373_thump.png\" style=\"height:606px; width:400px\" /></p>"}, {"qid": "", "question": " <span> A cube is made by folding the given sheet. In the cube so formed, which letter/symbol will be on the face opposite to the face showing ‘Q’?</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image049.png\" width=\"107\" height=\"141\" alt=\"\"></p>", "options": ["<span> #</span>", "<span> @</span>", "<span> A</span>", "<span> P</span>"], "correct": 1, "marks": "1", "explanation": "<span></span><p><span>A = @</span></p><p><span>Q = #</span></p><p><span>P = R</span></p><p><span>Hence, option a is correct answer.</span></p>"}, {"qid": "", "question": " <span> Out of the following five figures, four are alike in some manner and one differs from these in the manner. Select the odd figure.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image050.png\" width=\"343\" height=\"75\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image051.png\" width=\"102\" height=\"95\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image052.png\" width=\"98\" height=\"98\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image053.png\" width=\"104\" height=\"95\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image054.png\" width=\"99\" height=\"94\" alt=\"\">"], "correct": 1, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711456170272_image055.png\" width=\"105\" height=\"96\" alt=\"\"></p><p><span>According to the pattern option a is correct answer. </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
