<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL T-2 Mock 12 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 130</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

ing:0in\"><span>(A)     However, with advancements in technology, online learning     platforms have gained popularity.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(B)     Traditional education systems have long been the primary mode of     acquiring knowledge and skills.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(C)     This shift towards digital learning has led to a transformation     in the way education is delivered and accessed.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>(D)     Students now have the flexibility to learn at their own pace and     access a wide range of resources.</span></span></p>", "options": [" <p>     BACD</p>", " <p>     DCBA</p>", " <p>     ACBD</p>", " <p>     CABD</p>"], "correct": 1, "marks": "1", "explanation": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>option     A is correct answer.</span></span></p>     <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     paragraph discusses the transformation in education due to     advancements in technology and the rise of online learning     platforms. It begins with the statement (B) that introduces     traditional education systems. Sentence (A) follows, introducing     advancements in technology and online learning platforms as an     alternative to traditional education. Sentence (C) provides     further information about the shift towards digital learning and     its impact. The paragraph concludes with sentence (D), which     emphasizes the advantages of online learning, such as flexibility     and access to resources. The correct sequence ensures a logical     flow of ideas and coherent paragraph structure.</span></span></p>"}, {"qid": "", "question": " <p>     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that expresses th ical evergreen forests are found have a humid and tropical climate, with high temperatures and heavy rainfall.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The high annual precipitation is a crucial factor that supports the growth of tall and dense trees, as well as a wide variety of plant and animal species. The constant moisture and warmth create an ideal environment for diverse flora and fauna to thrive.</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">All other three option are correct. </span></span></p>"}, {"qid": "", "question": "<p>Which of the following capital city has become the first Indian city to be part of the World Cities Culture Forum (WCCF)?</p>", "options": ["<p>Delhi</p>", "<p>Mumbai</p>", "<p>Bangalore</p>", "<p>Chennai</p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Bangalore. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Bengaluru,</strong> the capital of Karnataka became the first Indian city to be part of the <strong>World Cities Culture Forum (WCCF),</strong> a global network of cities that share research and intelligence to explore the role of culture in future prosperity. Bengaluru became the 41st city to join the forum and the network currently includes 40 cities across six continents. <strong>The forum includes cities like New York, London, Paris, Tokyo, and Dubai. </strong></span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Bengaluru is commonly referred to as the &lsquo;Silicon Valley of India&rsquo; because of its role as the nation&rsquo;s leading information technology exporter.</span></span></p>"}, {"qid": "", "question": "<p>Which of the following Articles of t plants that thrive and prefer to grow in <strong>shady or partially shaded</strong> conditions. These plants have adaptations that allow them to tolerate lower light levels and compete effectively in areas with limited sunlight. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Psamophytes</strong>: Psamophytes are plants that are well-adapted to grow in sandy or sandy-loam soils. These plants have specific adaptations to cope with the challenges of sandy habitats, such as rapid drainage and low water-holding capacity.</span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Helophytes</strong>: Helophytes are plants that are specially adapted to grow in marshy or swampy areas. These plants are well-suited to survive in waterlogged conditions and often have various adaptations to cope with fluctuating water levels. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Monocots</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">: Monocots are a class of flowering plants belonging to the group Monocotyledonae, characterized by having one cotyledon (seed leaf) in their seeds. Monocots encompass a vast range of plant species, including grasses, lilies, orchids, and palms, among others.</span></span></p>"}, {"qid": "", "question": "<p>Raja and Radha Reddy received the Sangeet Natak Akademi Award for their contribution to _____________ dance.</p>", "options": ["<p>Kuchipudi</p>", "<p>Sattriya</p>", "<p>Kathak</p>", "<p>Kathakali</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Kuchipudi.</span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Raja and Ra he lowest literacy rate at 63.82%.</span></span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>"}, {"qid": "", "question": "<p>Which of the following is the major female hormone?</p>", "options": ["<p>Estrogen</p>", "<p>Progesterone</p>", "<p>Testosterone</p>", "<p>Cortisol</p>"], "correct": 1, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Estrogen.   </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Estrogen</strong>: It is the primary female sex hormone responsible for the development and regulation of the female reproductive system and secondary sexual characteristics. It plays a crucial role in various physiological processes, including the menstrual cycle, pregnancy, and bone health. Estrogen is produced primarily in the ovaries, although small amounts are also produced in other tissues, such as the adrenal glands and fat cells.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Progesterone</strong>: It is another important female sex hormone. It works in conjunction with estrogen to regulate the menstrual cycle and prepare the uterus for pregnancy. Progesterone is primarily produced by the ovaries after ovulation, and its levels increase during the second half of the menstrual cycle. If pregnancy occurs, progesterone helps maintain the uterine lining and supports the early stages of pregnancy. If pregnancy does not occur, progesterone levels drop, leading to menstruation.  </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Testosterone</strong>: It is the major male sex hormone, although females also have small amounts of it in their bodies. It is primarily produced in the testes in males and in small quantities in the ovaries in females. Testosterone plays a crucial role in the development of male reproductive tissues, as well as secondary sexual characteristics such as facial and body hair, deepening of the voice, and muscle mass. In females, testosterone contributes to libido and plays a role in maintaining bone density and muscle mass. </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Cortisol</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">: It is a steroid hormone produced by the adrenal glands in response to stress. Cortisol plays a significant role in the body&#39;s stress response, helping to regulate various physiological processes such as metabolism, immune response, and blood pressure.</span></span></p>"}, {"qid": "", "question": "<p>The Atacama Desert, one of the driest places on Earth, is located in which South American country?</p>", "options": ["<p>Canada</p>", "<p>Chile</p>", "<p>Argentina</p>", "<p>Bolivia</p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Chile. </span></span></p>\r\n\r\n<ul>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The Atacama Desert is primarily located in Chile, and it extends from northern Chile into southern Peru.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">It is bordered by the Andes Mountains to the east and the Pacific Ocean to the west.</span></span></li>\r\n\t<li><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The extreme aridity of the Atacama is due to its geographical location, which results in a rain shadow effect caused by the Andes blocking moisture-laden clouds from the Amazon Basin and the Atlantic Ocean. </span></span></li>\r\n\t<li><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">As a result, the Atacama Desert has some regions where no significant rainfall has been recorded for hundreds of years, making it one of the most challenging environments for life on Earth.</span></span></li>\r\n</ul>"}, {"qid": "", "question": "<p>World Breastfeeding week is observe in____________?</p>", "options": ["<p>1-7 July</p>", "<p>1-7 August</p>", "<p>1-7 January</p>", "<p>1-7 November<br />\r\n </p>"], "correct": 2, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is 1-7 August. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">August 1-7 is World Breastfeeding Week, a global annual observance to promote breastfeeding and improve the health of babies, mothers, and families. The week is coordinated by the World Health Organization (WHO) and the United Nations Children&rsquo;s Fund (UNICEF).</span></span></p>\r\n\r\n<p><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">The theme for World Breastfeeding Week 2023 is <strong>&ldquo;Protect Breastfeeding: A Shared Responsibility.&rdquo;</strong> This theme highlights the importance of everyone working together to protect breastfeeding and ensure that all babies have the opportunity to benefit from it.</span></span></p>"}, {"qid": "", "question": "<p>Expenditure on military, infrastructure and government institutions are examples of which of the following?</p>", "options": ["<p>Personal expenditure</p>", "<p>Revenue expenditure</p>", "<p>Fixed Capital expenditure</p>", "<p>Private Final Consumption expenditure<br />\r\n </p>"], "correct": 3, "marks": "1", "explanation": "<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">The correct answer is Fixed Capital expenditure. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Fixed Capital expenditure</strong> refers to the spending by the government on acquiring or improving long-term assets and capital goods that are used to enhance the productive capacity of the economy. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">These expenditures are considered investments in the country&#39;s future and contribute to economic growth and development. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\">Expenses on military, infrastructure, and government institutions fall under this category as they involve the acquisition and improvement of long-lasting assets and facilities. </span></span></p>\r\n\r\n<p><span style=\"font-size:11pt\"><span style=\"font-family:Calibri,sans-serif\"><strong>Revenue</strong> <strong>expenditure</strong>: It refers to the regular recurring expenses of the government that are incurred for the ongoing operation and maintenance of various services and programs. These expenses do not result in the creation of physical assets or reduction in liabilities. Examples of revenue expenditure include salaries of government employees, interest payments, subsidies, and other routine expenses necessary for the functioning of the government.  </span></span></p>\r\n\r\n<p><strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Personal expenditure/</span></span> <span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\">Private Final Consumption expenditure:</span></span></strong><span style=\"font-size:11.0pt\"><span style=\"font-family:&quot;Calibri&quot;,sans-serif\"> It refers to the spending by households and individuals on goods and services for their personal consumption.</span></span></p>"}, {"qid": "", "question": "<p>Kelucharan Mohapatra, awarded with the Padma Vibhushan in the year 2000, was a dancer of which of the following classical const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;

  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
