<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>

ertical-align:super\">2 </span><span style=\"font-family:Calibri;font-weight:bold\">– 1, 7</span><span style=\"font-family:Calibri;font-size:8pt;font-weight:bold;vertical-align:super\">3</span><span style=\"font-family:Calibri;font-weight:bold\"> +1, 11</span><span style=\"font-family:Calibri;font-size:8pt;font-weight:bold;vertical-align:super\">2</span><span style=\"font-family:Calibri;font-weight:bold\"> -1.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">In the given options below one set of numbers is different from others in some way. Find the </span><span style=\"font-family:Calibri;font-weight:bold\">odd number set out</span><span style=\"font-family:Calibri\">:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">7, 14, 112</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">12, 24, 312</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">9, 18, 180</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">16, 32, 216</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Correct answer: (4)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Symbol'\">●</span><span style=\"width:10.8pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri\">All options except 4 are correct.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:Calibri\">7×2=14, 14× (7+1) =112</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:Calibri\">12×2= 24, 24× (12+1) = 312 so on…….</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Symbol'\">●</span><span style=\"width:10.8pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri;font-weight:bold\">In option 4; 16×2= 32, 32× (16+1)=544 not 216</span><span style=\"font-family:Calibri\">.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">What will come in place of question mark?</span></p><p style=\"margin-top:0pt;margin-bottom:11pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">DLF, GOI, KSM, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">MVO</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">PVR</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">OWQ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">OXR</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">Correct Answer: (4)</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:Calibri\">In this addition to last alphabet is happening;</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:Calibri\">●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri\">D, D+2= F, F+6=L.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:Calibri\">●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri\">F+1= G, G+2=I, I+6= O.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:Calibri\">●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri\">I+2=K, K+2= M, M+6=S.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:Calibri\">●</span><span style=\"width:10.75pt;font:7pt 'Times New Roman';display:inline-block\">       </span><span style=\"font-family:Calibri;font-weight:bold\">M+3= P, P+2= R, R+6= X</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">Select the letter cluster that is related to the third letter cluster in the same manner as second letter cluster is related to the first letter cluster ?</span></p><p style=\"margin-top:0pt;margin-bottom:11pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri;font-weight:bold\">DOT:WLG :: BOX: ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">YCL</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">ANZ</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:justify;font-size:12pt\"><span style=\"font-family:Calibri\">YLC</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;text-align:j ibri\"> for the operation and maintenance of the Barakah Nuclear Power Plant.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">This agreement reinforces India’s commitment to peaceful nuclear energy and strengthens bilateral relations.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">The </span><span style=\"font-family:Calibri;font-weight:bold\">UAE is India’s third-largest</span><span style=\"font-family:Calibri\"> </span><span style=\"font-family:Calibri;font-weight:bold\">trading partner.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">With reference to the 'Joint Sitting of Parliament', which of the following statements is/are correct?</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">1. Article 109 of the Constitution of India provides for the Joint Sitting of Parliament.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">2 A Joint Sitting of Parliament may be called to pass a Constitution Amendment Bill.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">Select the correct answer from the code given below:</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Neither 1 nor 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both 1 and 2</span><span style=\"font-family:'Times New Roman'\"> </span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri;font-weight:bold\">Article 108</span><span style=\"font-family:Calibri\"> — not Article 109 — of the Indian Constitution provides for a </span><span style=\"font-family:Calibri;font-weight:bold\">Joint Sitting</span><span style=\"font-family:Calibri\"> of Parliament.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">A Joint Sitting can be summoned by the President to resolve a deadlock between the Lok Sabha and Rajya Sabha </span><span style=\"font-family:Calibri;font-weight:bold\">over an ordinary bill, But joint sitting not allowed for Constitutional Amendment Bills (Art 368) </span><span style=\"font-family:Calibri\">or money bill.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">In the case of Maneka Gandhi vs Union of India (1978), which important constitutional principle was recognized by the Supreme Court of India?</span><span style=\"font-family:Calibri\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Judicial Review</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Rule of Law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Due Process of Law</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Basic Structure Doctrine</span><span style=\"font-family:'Times New Roman'\"> </span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">Article 21 — “No person shall be deprived of his life or personal liberty except according to procedure established by law.”</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\"> In this case, SC ruled that Article 21 should be interpreted broadly and the procedure established by law must be fair, just, and reasonable. </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">Also, introduced the </span><span style=\"font-family:Calibri;font-weight:bold\">American concept of “Due Process of Law” into Indian jurisprudence.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">Scope of </span><span style=\"font-family:Calibri;font-weight:bold\">Article 21, linking it with Articles 14 </span><span style=\"font-family:Calibri\">(Right to Equality) </span><span style=\"font-family:Calibri;font-weight:bold\">and 19</span><span style=\"font-family:Calibri\"> (Freedom of Speech, Movement, etc.), creating that </span><span style=\"font-family:Calibri;font-weight:bold\">is known as the “Golden Triangle” of fundamental rights.</span><span style=\"font-family:Calibri;font-weight:bold\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\"> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">Assertion (A): The \"Phillips Curve\" shows an inverse relationship between inflation and unemployment.</span><span style=\"font-family:Calibri\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\">Reason (R): Higher unemployment causes higher inflation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\"> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both A and R are correct, and R is the explanation of A</span><span style=\"font-family:'Times New Roman'\"> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both A and R are correct, but R is not the explanation of A</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Only A is correct</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Only R is correct</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri;font-weight:bold\">Phillips Curve</span><span style=\"font-family:Calibri\">, proposed by A.W. Phillips (1958), demonstrates an </span><span style=\"font-family:Calibri;font-weight:bold\">inverse (negative) relationship between inflation and unemployment</span><span style=\"font-family:Calibri;font-weight:bold\"> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-family:Calibri\">R is incorrect because </span><span style=\"font-family:Calibri;font-weight:bold\">higher unemployment</span><span style=\"font-family:Calibri\"> usually leads to </span><span style=\"font-family:Calibri;font-weight:bold\">lower inflation </span><span style=\"font-family:Calibri\">since demand falls</span></p><p style=\"margin-top:0pt;margin-left:18pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Calibri\"> </span><span style=\"font-family:Calibri\">Other facts:</span><span style=\"font-family:Calibri\"> </span></p><p style=\" ily:'Times New Roman'\">Select the option that expresses the given sentence in indirect speech.</span><br><span style=\"font-family:'Times New Roman'\">The commander said to the trainees, “Complete the task by evening, and don’t share any information with the media.”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The commander ordered the trainees to complete the task by evening and not share any information with the media.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The commander said the trainees to complete the task by evening and not to share any information with the media.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The commander advised the trainees that they should complete the task by evening and shouldn’t share any information with the media.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The commander ordered the trainees to complete the task by evening and not to share any information with the media.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:Cardo\">1. The sentence expresses a command, so “said to” → “ordered.”</span><br><span style=\"font-family:Cardo\">2. The imperative verbs (“Complete,” “Don’t share”) change to the infinitive form — “to + verb” and “not to + verb.”</span><br><span style=\"font-family:Cardo\">3. We do not use “that” in indirect imperative sentences.</span><br><span style=\"font-family:Cardo\">4. Verb forms remain in base form after “to.”</span><br><span style=\"font-family:Cardo\">5. Option a is wrong because after ordered, we must use to + verb, not the base form.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The given sentence has an error which has been underlined. The underlined word is given as options with some changes. Select the option that rectifies the error.</span><br><span style=\"font-family:'Times New Roman'\">Archna felt a surge of exhileration as she crossed the finish line after months of hard training.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">exhiliration</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">exhilaration</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">exhillaration</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">exhilleration</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1. The word “Exhilaration” (n) means a feeling of great happiness or excitement (</span><span style=\"font-family:'Mangal'\">उत्साह</span><span style=\"font-family:'Times New Roman'\">,</span><span style=\"font-family:'Times New Roman'\"> </span><span style=\"font-family:'Mangal'\">प्रसन्नता</span><span style=\"font-family:'Times New Roman'\">,</span><span style=\"font-family:'Times New Roman'\"> </span><span style=\"font-family:'Mangal'\">या रोमांच</span><span style=\"font-family:'Times New Roman'\">).</span><br><span style=\"font-family:'Times New Roman'\">2. Synonyms - Exultation, Jubilation, Rhapsody, Elation, Ecstasy</span><br><span style=\"font-family:'Times New Roman'\">3. Antonyms - Despondency, Dejection, Torpor, Languor</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times Ne n-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Choose the correctly spelled word.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Forseeable</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Foressiable</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Foreseeable</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Forseable</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1. The correct spelling has “fore + see + able”.</span><br><span style=\"font-family:'Times New Roman'\">2. Foreseeable - That which can be predicted or anticipated.</span><br><span style=\"font-family:'Times New Roman'\">3. Synonyms - Imminent, Predictable, Envisageable, Previsible</span><br><span style=\"font-family:'Times New Roman'\">4. Antonyms - Unforeseeable, Incalculable, Incognizable, Improbable</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Arrange the following four sentences (1, 2, 3, 4) in a logical sequence to form a coherent paragraph-</span><br><span style=\"font-family:'Times New Roman'\">1. During the recent World Cup, she faced harsh trolling for a few failures.</span><br><span style=\"font-family:'Times New Roman'\">2. Jemimah Rodrigues, one of India’s brightest cricket talents, showed the world what it means to know your power and stand tall.</span><br><span style=\"font-family:'Times New Roman'\">3. Yet she stayed calm and joyful, focusing on the game instead of the noise.</span><br><span style=\"font-family:'Times New Roman'\">4. She knew her worth.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">2 – 3 – 1 – 4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1 – 2 – 4 – 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">2 – 1 – 3 – 4</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1 – 4 – 2 – 3</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1. 2 introduces Jemimah and her strength.</span><br><span style=\"font-family:'Times New Roman'\">2. 1 describes the challenge she faced.</span><br><span style=\"font-family:'Times New Roman'\">3. 3 shows her composed reaction.</span><br><span style=\"font-family:'Times New Roman'\">4. 4 ends with her self-belief.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Choose the sentence in which the idiom “fly off at a tangent” is used correctly.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Whenever we discuss serious matters, he flies off at a tangent and starts talking about movies.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The bird flew off at a tangent when it saw the hunter in the Jungle.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The driver flew off at a tangent to avoid the traffic jam.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">The students flew off at a tangent to finish their assignments on given time frame.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1. fly off at a tangent - to suddenly start talking or thinking about something completely different from the main topic of conversation. (</span><span style=\"font-family:'Mangal'\">मुद्दे से भटकना</span><span style=\"font-family:'Times New Roman'\">)</span><br><span style=\"font-family:'Times New Roman'\">2. Option A correctly shows this meaning — the person changes the topic from serious matters to movies.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Read the given passage and answer the question that follows.</span><br><span style=\"font-family:'Times New Roman'\">During the second century AD, Rome was ruled by a line of emperors born in Iberia, in whose veins probably flowed at least a few drops of local Iberian blood. The reigns of these Iberian emperors—from Trajan to Marcus Aurelius—are often seen as the empire’s golden age. After that, all the ethnic barriers were broken down. Emperor Septimius Severus (193–211) was the scion of a Punic family from Libya. Elagabalus (218–222) was a Syrian. Emperor Philip (244–249) was known colloquially as Philip the Arab. The empire’s new citizens adopted Roman imperial culture with such zest that, for centuries—and even millennia—after the empire collapsed, they continued to speak the empire’s language, live by its laws, and believe in the Christian God that the empire had adopted from one of its Levantine provinces. A similar process occurred in the Arab Empire. When it was established in the mid-seventh century AD, it was based on a sharp division between the ruling Arab-Muslim elite and the subjugated Egyptians, Syrians, Iranians, and Berbers, who were neither Arabs nor Muslims.</span><br><span style=\"font-family:'Times New Roman'\">Many of the empire’s subjects gradually adopted the Muslim faith, the Arabic language, and a hybrid imperial culture. The old Arab elite looked upon these new converts (parvenus) with deep hostility, fearing the loss of their unique status and identity. The frustrated converts clamoured for an equal share within the empire and in the world of Islam. Eventually, they got their way: Egyptians, Syrians, and Mesopotamians came to be seen as ‘Arabs’. Arabs, in their turn—whether authentic Arabs from Arabia or newly minted Arabs from Egypt and Syria—came to be increasingly dominated by non-Arab Muslims, in particular by Iranians, Turks, and Berbers. The great success of the Arab imperial project was that the imperial culture it created was wholeheartedly adopted by numerous non-Arab peoples, who continued to uphold it, develop it, and spread it even after the original empire collapsed and the Arabs as an ethnic group lost their dominion.</span><br><span style=\"font-family:'Times New Roman'\">What parallel does the author draw between the Roman Empire and the Arab Empire?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both expanded primarily through conquest and trade.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both initially divided people by ethnicity but later saw cultural assimilation across groups.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both maintained strict ethnic hierarchies throughout their rule.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Both collapsed due to religious conflicts among their citizens.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">1. The passage compares how both empires started with a clear ethnic division (Romans vs provincials; Arabs vs non-Arabs) but gradually saw those barriers dissolve as conquered peoples adopted the ruling culture and religion.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Times New Roman'\">Read the given passage and answer the question that follows.</span><br><span style=\"font-family:'Times New Roman'\">During the second century AD, Rome was ruled by a line of emperors born in Iberia, in whose veins probably flowed at least a few drops of local Iberian blood. The reigns of these Iberian emperors—from Trajan to Marcus Aurelius—are often seen as the empire’s golden age. After that, all the ethnic barriers were broken down. Emperor Septimius Severus (193–211) was the scion of a Punic family from Libya. Elagabalus (218–222) was a Syrian. Emperor Philip (244–249) was known colloquially as Philip the Arab. The empire’s new citizens adopted Roman imperial culture with such zest that, for centuries—and even millennia—after the empire collapsed, they continued to speak the empire’s language, live by its laws, and believe in the Christian God that the empire had adopted from one of its Levantine provinces. A similar process occurred in the Arab Empire. When it was established in the mid-seventh century AD, it was based on a sharp division between the ruling Arab-Muslim elite and the subjugated Egyptians, Syrians, Iranians, and Berbers, who were neither Arabs nor Muslims.</span><br><span style=\"font-family:'Times New Roman'\">Many of the empire’s subjects gradually adopted the Muslim faith, the Arabic language, and a hybrid imperial culture. The old Arab elite looked upon these new converts (parvenus) with deep hostility, fearing the loss of their unique status and identity. The frustrated converts clamoured for oS)-</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    DoS – An attack that floods a system or network with excessive    traffic to make it slow or completely unavailable.</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>SQL Injection Attack -</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in\">    SQL Injection – A database attack where malicious SQL code is    inserted into input fields to access or manipulate data</p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    <span><span>A computer    program that protects websites against bots by generating and    grading tests that humans can pass but current computer programs    are unable to pass is known as—</span></span></p>", "options": ["<p style=\"orphans:0;widows:0\">    <span><span>Firewall</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>CAPTCHA</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Authorised    Access Control</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Password</span></span></p>"], "correct": 2, "marks": "1", "explanation": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span> </span><b>CAPTCHA –</b> (<b>C</b>ompletely     <b>A</b>utomated <b>P</b>ublic <b>T</b>uring test to tell     <b>C</b>omputers and <b>H</b>umans <b>A</b>part) <span><span>is     a technique used to differentiate between computers and humans.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span><span>It is used in     online activities.</span></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><span>It     is a type of challenge–response test that confirms whether the     input is given by a human a    Cell references are used in formulas to refer to the value or     content of a specific cell or range of cells.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     Types of Cell refrencing :-      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0in\">    <br>     </p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Relative Cell Referencing -</b> Relative referencing means the     cell reference automatically adjusts to its new position when a     formula is copied or moved to another cell, allowing Excel to     recalculate based on the relative row and column positions.</p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <b>Example:</b></p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    =A1 + B1 becomes =A2 + B2 when copied down.</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <b>2. Absolute Cell Referencing - </b>Absolute referencing keeps    the cell address completely fixed using dollar signs ($), so the    reference does not change no matter where the formula is copied or    moved in the worksheet.</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <b>Example:</b></p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    =A2 * $B$1 — $B$1 will remain constant everywhere.</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <b>3. Mixed referencing – It </b>locks either the row or the    column (using a single $), so one part of the cell reference stays    fixed while the other part changes when the formula is copied.</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <b>Example:</b></p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-left:0.25in;margin-bottom:0in\">    $A1 (column A fixed, row changes)</p>    <p style=\"orphans:0;widows:0;margin-left:0.25in\">    A$1 (row 1 fixed, column changes)</p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    <span><span>______ adds    extra space to the side margin, top margin or inside margins of a    document that you plan to bind in MS Word 2010.</span></span></p>", "options": ["<p style=\"orphans:0;widows:0\">    <span><span>Gutter Margin</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Paper Size</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Left Margin</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Top Margin</span></span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>In MS Word,    there are five types of margins: top margin, bottom margin, left    margin, right margin, and gutter margin.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>A gutter margin    is used to add extra space for binding a page, ensuring content is    not hidden during binding.</span></span></p>    <p style=\"orphans:0;widows:0\">    <span><span>By default, the    gutter margin is set to “0”.</span></span></p>"}, {"qid": ) Encrypts data for ransom</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>B. Phishing                → (ii) Sends deceptive emails to steal data</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>C. Key logging          → (iii) Captures keyboard inputs</span></span></p>    <p style=\"orphans:0;widows:0\">    <span><span>D. DDoS                    → (iv) Overloads servers with traffic</span></span></p>"}, {"qid": "", "question": "Mोपcु पुध ीियियथing nधपथयना ूनयपयcियस थiपु पुधiन ंधोningौ: Pनयपयcिय (i) SNTP (ii) FTP (iii) DNS (iॅ) TELNET Mधोning A. Mोूौ पुध कयंोin nोंध पय ोn IP ोककनधौौ. B. Sदncुनयnप्रधौ पुध ौदौपधं पiंध in पुध nधपथयना. D. Cयnnधcपौ पुध ियcोि cयंूहपधन पय पुध नधंयपध cयंूहपधन. C. Sधnकौ ीiिधौ ीनयं यnध cयंूहपधन पय ोnयपुधन. Oूपiयnौ:", "options": ["<p style=\"orphans:0;widows:0\">    <span><span>i-C, ii-B,    iii-A, iv-D</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>i-B, ii-C,    iii-A, iv-D</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>i-B, ii-C,    iii-D, iv-A</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>i-B, ii-D,    iii-A, iv-C</span></span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span><b>Correct    Answer: (b)</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span><b>Protocol Meaning</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>(i) SNTP          →  B. Synchronizes the system time in the network.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>(ii) FTP            →  C. Sends files from one computer to another.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span>(iii) DNS          → A. Maps the domain name to an IP address.</span></span></p>    <p style=\"orphans:0;widows:0\">    <span><span>(iv) TELNET → D.    Connects the local computer to the remote computer.</span></span></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    <span><span>The Network is    overloaded with enormous data sent by many computers within the    network. The inability of the network to deliver the data is    termed as —</span></span></p>", "options": ["<p style=\"orphans:0;widows:0\">    <span><span>Access control</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Congestion</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Error    propagation</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Deadlock</span></span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0\">    <span><span><b>Correct    Answer: (b) Congestion</b></span></span></p>"}, {"qid": "", "question": " <p style=\"orphans:0;widows:0\">    <span><span>Which of the    following system software is the operational software installed on    the computer motherboards that helps the operating system to    identify the Flash, ROM, EPROM, EEPROM, and memory chips?</span></span></p>", "options": ["<p style=\"orphans:0;widows:0\">    <span><span>Firmware</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Device drivers</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Programming    language translators</span></span></p>", " <p style=\"orphans:0;widows:0\">    <span><span>Utility software</span></span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"orphans:0;widows:0\">    <span><span>Correct Answer:    (a) Firmware</span></span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
