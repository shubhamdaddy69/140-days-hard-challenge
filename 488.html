<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;

}
body.dark-mode {

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 20px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following words are alike in some manner and hence form a group. Which of the following doesn't belong to the group:</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Catalyst</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Enzyme </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Inhibitor </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Substrate </span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer:</span><span> </span><span style=\"font-weight:bold\">(D) Substrate</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Catalyst</span><span> </span><span>– speeds up a chemical reaction</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Enzyme</span><span> </span><span>– a biological catalyst</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Inhibitor</span><span> </span><span>– slows down or prevents a reaction (often by affecting enzymes)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All three</span><span> </span><span style=\"font-weight:bold\">affect the rate of a reaction</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Substrate</span><span>, however, is the</span><span> </span><span style=\"font-weight:bold\">substance on which the reaction acts</span><span>, not something that regulates or influences the reaction rate.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore,</span><span> </span><span style=\"font-weight:bold\">substrate</span><span> </span><span>does</span><span> </span><span style=\"font-weight:bold\">not</span><span> </span><span>belong to the group.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is Rohan’s present age?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Five years ago, Rohan was half the age of his father.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. The present age of his father is 40 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II is sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II together are sufficient</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither I nor II is sufficient</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct answer: (C)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>From</span><span> </span><span style=\"font-weight:bold\">Statement II</span><span>, father’s present age =</span><span> </span><span style=\"font-weight:bold\">40 years</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>So, father’s age</span><span> </span><span style=\"font-weight:bold\">5 years ago</span><span> </span><span>= 40 − 5 =</span><span> </span><span style=\"font-weight:bold\">35 years</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>From</span><span> </span><span style=\"font-weight:bold\">Statement I</span><span>, 5 years ago Rohan was</span><span> </span><span style=\"font-weight:bold\">half of his father’s age</span><br><span>Rohan’s age 5 years ago = 35 ÷ 2 =</span><span> </span><span style=\"font-weight:bold\">17.5 years</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Rohan's present age= 17.5+5= 22.5 years</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Therefore, both statements together are required</span><span> </span><span>to find the answer.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which two signs should be interchanged to make the given equation correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(60 ÷ 5 + 4) × 3 − 18 = 42</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷ and +</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>× and −</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+ and −</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷ and ×</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (C) + and –</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>After interchanging + and –, the new equation is: (60 ÷ 5 - 4) × 3 + 18 = 42</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>here, (12-4) × 3 =24</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>24 + 18= 42; </span><span style=\"font-weight:bold\">which balances the equation.</span><br><span style=\"font-weight:bold\">Answer: ‘+’ and ‘−’ should be interchanged.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span><span> </span><span>The inflation rate in the country has increased for the fourth consecutive month.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Courses of Action:</span></p><ol type=\"1\"><li><span>The central bank should consider increasing interest rates to control inflation.</span></li><li><span>The government should increase subsidies on essential goods.</span></li></ol><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only</span><span> </span><span>1 follows.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2 follows.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Either1 or 2 follows.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both1 and 2 follow.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The correct answer: (A) Only 1 follows</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">From 1:</span><span> This is a logical and economically favorable step because increasing interest rates helps reduce money supply and control inflation. </span><span style=\"font-weight:bold\">So, I follows</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">From 2:</span><span> Increasing subsidies would increase government expenditure and may worsen inflation rather than control it. </span><span style=\"font-weight:bold\">So, II does not follow.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(4, 45, 9)</span><span> and (</span><span style=\"font-weight:bold\">5, 78, 13)</span><span> follow the same pattern. Which of the following doesn't follow the same pattern?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 35 – Operations on 35 such as adding /subtracting /multiplying etc. to 35 can be performed. Breaking down 35 into 3 and 5 and then performing mathematical operations on 3 and 5 is not allowed).</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 28, 7</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 15, 5</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6, 56, 8</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7, 95, 12</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Correct Answer: (D) 7, 95, 12</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:1 <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 2 and 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 and 3 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 only</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 only</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The</span><span> </span><span style=\"font-weight:bold\">Directive Principles of State Policy (DPSPs)</span><span> </span><span>are included in</span><span> </span><span style=\"font-weight:bold\">Part IV of the Constitution of India (Articles 36–51)</span><span>.</span><br><span style=\"font-weight:bold\">Key feature:</span><span> </span><span>DPSPs are</span><span> </span><span style=\"font-weight:bold\">non-justiciable</span><span> </span><span>(not enforceable by courts) but are</span><span> </span><span style=\"font-weight:bold\">fundamental in the governance of the country</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>DPSPs are inspired by the</span><span> </span><span style=\"font-weight:bold\">Irish Constitution</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>They complement</span><span> </span><span style=\"font-weight:bold\">Fundamental Rights</span><span> < -size:12pt\"><span>Veneration of indigenous tribal deities</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Commemoration of Tripura's statehood day</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Worship of River Goddess Yamuna</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The</span><span> </span><span style=\"font-weight:bold\">Kharchi Festival</span><span> </span><span>is a</span><span> </span><span style=\"font-weight:bold\">traditional and important festival of Tripura</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It is</span><span> </span><span style=\"font-weight:bold\">primarily associated with the worship of indigenous tribal deities</span><span>, especially the</span><span> </span><span style=\"font-weight:bold\">14 deities (Chaturdasha Devata)</span><span> </span><span>who are considered protectors of the state.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The festival is held annually at</span><span> </span><span style=\"font-weight:bold\">Chaturdasha Devata Temple, Old Agartala</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Kharchi literally means</span><span> </span><span style=\"font-weight:bold\">“cleansing of sins”</span><span>, and the rituals symbolise the purification of Mother Earth after the menstruation period, according to local beliefs.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It reflects the</span><span> </span><span style=\"font-weight:bold\">tribal culture, customs, and religious traditions</span><span> </span><span>of Tripura and is celebrated by both tribal and non-tribal communities.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Consider the following statements regarding no-confidence motion in India –</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>1. There is no mention of any no confidence motion in the Constitution of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>2. A no-confidence motion can be moved only in the Lok Sabha.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Which of the above statements is/are correct?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither 1 nor 2</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">As per Article 75(3), the Council of Ministers is collectively responsible to the Lok Sabha.</span><span style=\"font-weight:bold\"> </span><span>Therefore a</span><span> </span><span style=\"font-weight:bold\">no-confidence motion can only be moved in the Lok Sabha.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>At the same time there is no mention of a no-confidence motion in the Constitution.</span><span> </span><span style=\"font-weight:bold\">As per Article 118(1), each House of Parliament may make its rules of procedure and conduct of business.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Hence the Lok Sabha has made rules (Rule 198) for the procedure of no-confidence motion against the Council of Ministers.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Thus the</span><span> </span><span style=\"font-weight:bold\">no-confidence motion is not mentioned in the Constitution but exists in Lok Sabha Rule-198.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Which of the following is the new criteria for becoming a small enterprise in the definition of the Ministry of Micro, Small &amp; Med t;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Within this</span><span> </span><span style=\"font-weight:bold\">200 nautical miles</span><span>, the coastal state has:</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sovereign rights</span><span> </span><span>for exploration, exploitation, conservation, and management of</span><span> </span><span style=\"font-weight:bold\">natural resources</span><span> </span><span>(living and non-living)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Parts of the following sentence have been given as options. Select the option that contains an error.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Hardly had the committee members finished the discussion when the chairman announce a decision that surprised everyone present.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hardly had the committee members</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>finished the discussion when</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the chairman announce a decision</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>that surprised everyone present</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The sentence begins with</span><span> </span><span style=\"font-weight:bold\">“Hardly had …”</span><span>, which requires</span><span> </span><span style=\"font-weight:bold\">past perfect tense</span><span> </span><span>in the first clause and</span><span> </span><span style=\"font-weight:bold\">simple past tense</span><span> </span><span>in the second clause.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The verb</span><span> </span><span style=\"font-weight:bold\">“announce”</span><span> </span><span>is in the present tense, which is incorrect.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It should be</span><span> </span><span style=\"font-weight:bold\">“announced”</span><span> </span><span>(simple past).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Select the correct spelling of the word that best completes the sentence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The historian cautioned that drawing grand conclusions from fragmented evidence is an exercise in __________, as it risks oversimplifying complex social and political realities.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>reductionism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>reducationism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>reductonism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>reductionisam</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Reductionism (सरलीकरण की प्रवृत्ति)</span><span> </span><span>— the tendency to explain complex phenomena by reducing them to overly simple factors.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Synonyms:</span><span> </span><span>Oversimplification, Simplification</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Antonyms:</span><span> </span><span>Holism, Complexity, Integration</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Reductionism</span><span> </span><span>precisely matches the idea of oversimplifying complex realities.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Parts of the following sentence have been given as options. Select the option that contains an error.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>By the time the final report was submitted, the project lead was confident that the team has been working diligently on all aspects of the assignment since the previous quarter. </span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By the time the final report was submitted</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the project lead was confident that the team</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>has been working diligently on all aspects</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>of the assignment since the previous quarter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>The sentence establishes a main action in the past: \"the final report</span><span> </span><span style=\"font-weight:bold\">was submitted</span><span>\" (Simple Past).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>It then describes a state of confidence about an activity that started in the past (\"since the previous quarter\") and continued up to that past time when the report was submitted.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>This structure requires the</span><span> </span><span style=\"font-weight:bold\">Past Perfect Continuous Tense</span><span> </span><span>to show the longer, preceding action in the past, not the Present Perfect Continuous Tense.</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Incorrect Tense (C):</span><span> </span><span>\"...the team</span><span> </span><span style=\"font-weight:bold\">has been working</span><span> </span><span>diligently...\" (Present Perfect Continuous)</span></p><p style=\"margin-top:0pt;margin-left:72pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-family:'Courier New';font-size:10pt\">o</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Required Tense:</span><span> </span><span>\"...the team</span><span> </span><span style=\"font-weight:bold\">had been working</span><span> </span><span>diligently...\" (Past Perfect Continuous)</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Select the option that expresses the given sentence in indirect speech.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The manager said, “The company is expanding its operations in overseas markets, and we are hiring skilled professionals to support the growth.”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The manager said the company was expanding its operations in overseas markets and is hiring skilled professionals to support the growth.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The manager said that the company had been expanding its operations in overseas markets and they were hiring skilled professionals to support the growth.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The manager said that the company is expanding its operations in overseas markets and we are hiring skilled professionals to support the growth.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The manager said that the company was expanding its operations in overseas markets and they were hiring skilled professionals to support the growth.</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Present continuous (“is expanding”, “are hiring”)</span><br><span>→ changes to</span><span> </span><span style=\"font-weight:bold\">past continuous (“was expanding”, “were hiring”)</span><span> </span><span>after reporting verb</span><span> </span><span style=\"font-weight:bold\">said</span><span>.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Pronoun change</span><span>:</span><br><span>“we” → “they”</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">That</span><span> </span><span>is optional but grammatically correct.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Parallel tense structure is maintained.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Correct sentence:</span><br><span style=\"font-weight:bold\">The manager said that the company was expanding its operations in overseas markets and they were hiring skilled professionals to support the growth.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Select the most appropriate option to fill in the blank.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The historian cautioned against drawing ________ conclusions from fragmented evidence, as such haste often distorts the complexity of past events.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>perfunctory</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>precipitous</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>redundant</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>arbitrary</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Precipitous (अत्यंत जल्दबाज़ / उतावला)</span><span> </span><span>– done too quickly and without enough thought</span><span> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Perfunctory (औपचारिक मात्र)</span><span> </span><span>– done with little interest</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Redundant (अनावश्यक)</span><span> </span><span>– unnecessary or repetitive</span><span> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Arbitrary (मनमाना)</span><span> </span><span>– based on random choice</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option that best expresses the given sentence in the passive voice.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Critics argue that the committee’s failure to address systemic flaws has undermined the credibility of the entire reform process.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>It is argued by critics that the credibility of the entire reform process has been undermined by the committee’s failure to address systemic flaws.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The credibility of the entire reform process is argued by critics to have been undermined by the committee’s failure to address systemic flaws.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt on": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 2</span><span> </span><span>introduces the historical debate, providing context and setting the stage.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 1</span><span> </span><span>describes the human brain’s remarkable capabilities, elaborating on why the debate exists.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 3</span><span> </span><span>explains the modern technological advancement that sheds light on these capabilities.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Sentence 4</span><span> </span><span>concludes with the implication of these findings, highlighting the complexity of neural processes.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Choose the sentence in which the idiom “call someone’s bluff” is used correctly.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The poker player called his friend’s bluff to invite him to the game.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The teacher called the student’s bluff by checking his homework notebook.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The mountaineer called his bluff before attempting the steep climb.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The chef called the bluff while preparing a new recipe.</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The idiom</span><span> </span><span style=\"font-weight:bold\">“call someone’s bluff”</span><span> </span><span>means to challenge someone to prove that a threat or claim is real, especially when it is suspected to be empty.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option b</span><span> </span><span>correctly uses the idiom in a figurative sense: the teacher challenged the student’s claim by checking the homework.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option a</span><span> </span><span>uses “bluff” incorrectly as an invitation.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option c</span><span> </span><span>wrongly treats “bluff” as a personal quality.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Option d</span><span> </span><span>has no figurative or logical connection to the idiom.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Select the most appropriate option to fill in the blank.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Even after multiple stimulus packages were announced, economic recovery remained __________, as demand failed to revive and employment growth stayed sluggish.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tentative</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>imminent</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>inevitable</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>exponential</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sentence suggests</span><span> </span><span style=\"font-weight:bold\">weak, uncertain recovery</span><span>, not something assured or rapid.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Tentative (अनिश्चित / अस्थायी)</span><span> </span><span>→ weak, hesitant, or not firmly established</span><span> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Imminent</span><span> </span><span>→ about to happen very soon (not supported by context)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Inevitable</span><span> </span><span>→ certain to happen (contradicts uncertainty)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Exponential</span><span> </span><span>→ extremely rapid growth (clearly incorrect)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Change the following sentence into indirect speech:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The principal said to the teachers, “Please submit the reports by tomorrow and do not disclose the matter to anyone.”</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The principal requested the teachers to submit the reports by tomorrow and warned them not to disclose the matter to anyone.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The principal ordered the teachers to submit the reports by tomorrow and forbade them to disclose the matter to anyone.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The principal requested the teachers that they should submit the reports by tomorrow and should not disclose the matter to anyone.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The principal asked the teachers to submit the reports by tomorrow and said not to disclose the matter to anyone.</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">“Please submit…”</span><span> </span><span>→ polite command →</span><span> </span><span style=\"font-weight:bold\">requested</span><span>, not ordered.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">“Do not disclose…”</span><span> </span><span>→ negative command →</span><span> </span><span style=\"font-weight:bold\">warned / advised / requested not to</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Use of</span><span> </span><span style=\"font-weight:bold\">to-infinitive</span><span> </span><span>is correct: requested the teachers to submit…</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Option</span><span> </span><span style=\"font-weight:bold\">c</span><span> </span><span>is grammatically weak due to unnecessary</span><span> </span><span style=\"font-weight:bold\">“that they should”</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Option</span><span> </span><span style=\"font-weight:bold\">d</span><span> </span><span>is informal and structurally incorrect</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span>Option</span><span> </span><span style=\"font-weight:bold\">b</span><span> </span><span>is too forceful; the original sentence is polite, not authoritative</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Choose the correct one-word substitution for the phrase below:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The belief that all events are predetermined and that human beings have no free will.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Existentialism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Determinism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nihilism</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fatalism</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Determinism</span><span> </span><span>— the philosophical doctrine that all events, including human actions, are determined by previously existing causes, leaving no room for free will.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Existentialism</span><span> </span><span>— emphasizes individual freedom, choice, and responsibility (opposite idea).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Nihilism</span><span> </span><span>— belief that life lacks inherent meaning or value.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Fatalism</span><span> </span><span>— belief that outcomes are inevitable, but it does not fully deny free will in all actions (less precise than determinism).</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Choose the correct pair of homonyms to complete the sentence meaningfully.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The witness refused to ________ under pressure and chose not to ________ the truth during cross-examination.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>waiver / waver</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>waive / waver</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>waver / waive</span><br><span> </span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>waver / waiver</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Waver</span><span> </span><span>= to hesitate or show uncertainty</span><br><span>refused to waver under pressure</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block\">        </span><span style=\"font-weight:bold\">Waive</span><span> </span><span>= to give up or relinquish a right</span><br><span>not to waive the truth (meaning: not to give up the truth)</span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}
function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
