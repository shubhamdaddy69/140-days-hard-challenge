<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Robot" target="_blank" rel="noopener">Boss_Quiz_Robot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    <button class="submit-btn" onclick="submit()" id="submitBtn">Submit</button>
    <div class="timer" id="timer">Time: 60:00</div>
  </div>

  <div class="start-screen" id="start">
    <h1 class="start-title">CGL 2026 Paid Mock 4 - Hindi</h1>
    <div class="instructions">
      <h2>Test Instructions</h2>
      <div class="instruction-item">Total Questions: 100</div>
      <div class="instruction-item">Time Limit: 60 minutes</div>
      <div class="instruction-item">Use keyboard: Arrows, 1-5, M</div>
    </div>
    <button class="start-btn" onclick="startTest()">Start Test</button>
  </div>

  <div class="container" id="main" style="display:none;">
    <div class="question-panel">
      <div id="qContainer">
        <div class="q-header">
          <span id="qNum">Question 1</span>
          <span class="q-marks" id="marks">2</span>
        </div>
        <div class="q-timer" id="qTimer">Time: 00:00</div>
        <div class="q-text" id="qText"></div>
        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>
      </div>
      <div class="result" id="result">
        <div class="result-title">Performance Summary</div>
        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>
    </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">100</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">100</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

<script>
const Q = [{"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Find the next term of the Series: </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">2, 10, 30, 68, 130, ?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">223</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">221</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">222</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">220</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Each term follows</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">n³ + n</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1³ + 1 = 2, 2³ + 2 = 10, , 3³ + 3 = 30, , 4³ + 4 = 68, 5³ + 5 = 130</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Next term: 6³ + 6 = 216 + 6 = </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">222</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Answer:</span><span style=\"font-family:'Cambria Math'\"> </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">222</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Seven people M, N, O, P, Q, R, and S are sitting in a row facing North. R is sitting exactly in the middle of the row. M and N are sitting at the extreme ends. P is sitting second to the left of N. Q is sitting to the immediate right of M. S is sitting between Q and R. Who is sitting to the immediate left of P?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">M</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Q</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">O</span></p>"], "correct": 3, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769519121333_image001.png\" width=\"275\" height=\"99\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is given p is left of n which is not possible in this case. </span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">So lets draw other case</span></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769519121333_image002.png\" width=\"444\" height=\"140\" alt ></p><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">R is immediate left of P.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements:</span><br><span style=\"font-family:'Cambria Math'\">All Plants are Leaves.</span><br><span style=\"font-family:'Cambria Math'\">Some Leaves are Green.</span><br><span style=\"font-family:'Cambria Math'\">Only a few Green are Fruits.</span><br><span style=\"font-weight:bold;font-family:'Cambria Math'\">Conclusions:</span><br><span style=\"font-family:'Cambria Math'\"> I. All Fruits can be Green. </span><br><span style=\"font-family:'Cambria Math'\">II. All Plants being Green is a possibility.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I</span></p>", " <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">None </span></p>"], "correct": 2, "marks": "1", "explanation": "  <p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1769519121333_image003.png\" width=\"279\" height=\"144\" alt ></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">“Only a few Green are Fruits”</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> means </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">some Green are Fruits and some Green are not Fruits</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. There is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no restriction</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> that Fruits cannot all be Green.</span><br><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">👉</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Conclusion I is possible.</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">All Plants are Leaves</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> and </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">some Leaves are Green</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">. There is </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">no statement denying Plants being Green</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\">.</span><br><span style=\"line-height:108%;font-family:'Segoe UI Emoji';font-size:12pt\">👉</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> </span><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">Conclusion II is also possible.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> H -left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">I</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> is too extreme and impractical (complete ban is not suggested by the statement).</span></li><li style=\"margin-left:9.6pt;margin-bottom:8pt;line-height:108%;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"line-height:108%;font-size:12pt;font-weight:bold;font-family:'Cambria Math'\">II</span><span style=\"line-height:108%;font-size:12pt;font-family:'Cambria Math'\"> directly addresses the cause (lack of physical play) and is a practical preventive step.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:8pt;line-height:108%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Only Conclusion II follows.</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which writ is issued by a high court or the Supreme Court to compel a subordinate public authority to perform its mandatory duty?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Habeas Corpus</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Certiorari</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Prohibition</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Mandamus</span></p>"], "correct": 4, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The writ issued by a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">High Court or the Supreme Court</span><span style=\"font-family:'Cambria Math'\"> to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">compel a subordinate public authority to perform its mandatory duty</span><span style=\"font-family:'Cambria Math'\"> is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Cambria Math'\"> Writ of Mandamus</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mandamus</span><span style=\"font-family:'Cambria Math'\"> literally means “we command.”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It is issued to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">public officials, authorities, or lower courts</span><span style=\"font-family:'Cambria Math'\"> to enforce the performance of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">public duties</span><span style=\"font-family:'Cambria Math'\"> mandated by law.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">cannot</span><span style=\"font-family:'Cambria Math'\"> be issued against a private individual or to enforce a private contract.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: Mandamus</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">With reference to the Indian taxation system, consider the following pairs:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">I. Progressive Tax: The tax rate increases as the income of the taxpayer increases. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">II. Indirect Tax: The burden of the tax can be shifted from the initial payer to the final consumer. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">III. Goods and Services Tax (GST): A direct tax levied on the consumption of goods and services at the final point of sale.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">Which of the pairs given above is/are correctly matched?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II &amp; III</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I &amp; III</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II &amp; III All</span></p>"], "correct": 1, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Pairs I and II are correctly matched. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Progressive Tax</span><span style=\"font-family:'Cambria Math'\"> means the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">tax rate increases with an increase in the taxpayer’s income</span><span style=\"font-family:'Cambria Math'\">, e.g., income tax in India.</span><br><span style=\"font-family:'Cambria Math'\">II. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indirect Taxes</span><span style=\"font-family:'Cambria Math'\"> can be </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">shifted from the initial payer to the final consumer</span><span style=\"font-family:'Cambria Math'\">, e.g., excise duty, customs duty.</span><br><span style=\"font-family:'Cambria Math'\">III. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">GST</span><span style=\"font-family:'Cambria Math'\"> is an </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">indirect tax</span><span style=\"font-family:'Cambria Math'\">, not a direct tax. It is levied on the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">supply and consumption of goods and services</span><span style=\"font-family:'Cambria Math'\">, and the burden can be passed to the consumer.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: I and II only</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math' >seasonal reversal of wind direction</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">most distinctive characteristic</span><span style=\"font-family:'Cambria Math'\"> of the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">monsoon climate</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">III. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">North-East (retreating) Monsoon</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">main source of winter rainfall</span><span style=\"font-family:'Cambria Math'\"> for the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Coromandel Coast</span><span style=\"font-family:'Cambria Math'\"> (Tamil Nadu and adjoining areas).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: I, II and III</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Which part of a plant is primarily responsible for the process of transpiration?</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Roots</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Stem</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Leaves</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Flowers</span></p> y:'Cambria Math'\"> 9th–11th centuries CE</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Famous for its </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">temples with intricate sculptures</span><span style=\"font-family:'Cambria Math'\">, including </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">erotic art</span><span style=\"font-family:'Cambria Math'\"> and depictions of everyday life.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Chandela kings</span><span style=\"font-family:'Cambria Math'\">, particularly </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Dhanga</span><span style=\"font-family:'Cambria Math'\"> and </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vikramaditya</span><span style=\"font-family:'Cambria Math'\">, were the main patrons.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: Chandela Dynasty</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">Which of the following statements about the Attorney General of India (AGI) is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">I. The AGI is the highest law officer of the country and must be qualified to be a Judge of the Supreme Court.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\"> </span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">II. He can take part in the proceedings of either House of Parliament or a joint sitting but cannot vote.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\"> </span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">III. The term of office and remuneration of the AGI are fixed by the President of India.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I, II &amp; III All</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only II &amp; III</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only I &amp; III</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">All three statements are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">I. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Attorney General of India (AGI)</span><span style=\"font-family:'Cambria Math'\"> is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">highest law officer of the country</span><span style=\"font-family:'Cambria Math'\"> and must be </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">qualified to be appointed as a Judge of the Supreme Court</span><span style=\"font-family:'Cambria Math'\"> (Article 76).</span><br><span style=\"font-family:'Cambria Math'\">II. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – The AGI has the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">right to take part in the proceedings</span><span style=\"font-family:'Cambria Math'\"> of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">either House of Parliament or a joint sitting</span><span style=\"font-family:'Cambria Math'\">, but </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">does not have the right to vote</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">III. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">term of office and remuneration</span><span style=\"font-family:'Cambria Math'\"> of the Attorney General are </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">determined by the President of India</span><span style=\"font-family:'Cambria Math'\">, and the AGI holds office </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">during the pleasure of the President</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: I, II and III</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">Consider the following statements regarding the major classical dance forms of India:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math :'Cambria Math'\">I. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Sattriya</span><span style=\"font-family:'Cambria Math'\"> is a classical dance form from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Assam</span><span style=\"font-family:'Cambria Math'\">, originating in </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vaishnavite monasteries (Satras)</span><span style=\"font-family:'Cambria Math'\"> and based on the teachings of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Srimanta Sankardev</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">II. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kathakali</span><span style=\"font-family:'Cambria Math'\"> is a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">dance-drama from Kerala</span><span style=\"font-family:'Cambria Math'\">, noted for </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">elaborate costumes and facial makeup</span><span style=\"font-family:'Cambria Math'\">. Traditionally, it was </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">performed exclusively by men</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">III. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Mohiniyattam</span><span style=\"font-family:'Cambria Math'\"> is from </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Kerala</span><span style=\"font-family:'Cambria Math'\" Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Typhoid</span><span style=\"font-family:'Cambria Math'\"> is caused by the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">bacterium Salmonella Typhi</span><span style=\"font-family:'Cambria Math'\"> and spreads mainly through </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">contaminated food and water</span><span style=\"font-family:'Cambria Math'\">.</span><br><span style=\"font-family:'Cambria Math'\">III. </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Polio</span><span style=\"font-family:'Cambria Math'\"> is caused by a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">virus</span><span style=\"font-family:'Cambria Math'\">, primarily affects the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">central nervous system</span><span style=\"font-family:'Cambria Math'\">, and can lead to </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">paralysis</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: II and III only</span></p>"}, {"qid": "", "question": "Rधgोनकing पुध ूनयूधनपiधौ यी िधधंधnपौ ोnक पुध Pधनiयकic Tोृिध, cयnौiकधन पुध ीियियथing ौपोपधंधnपौ:I. Aपयंic ौप्रध gधnधनोििद कधcनधोौधौ ोcनयौौ ो ूधनiयक ीनयं िधीप पय नigुप ोnक incनधोौधौ कयथn ो gनयहू. II. Iयnप्रोपiयn धnधनgद iौ पुध धnधनgद नधतहiनधक पय नधंयॅध ोn िधधcपनयn ीनयं ोn iौियोपधक gोौधयहौ ोपयं. Wुicु यी पुध ौपोपधंधnपौ giॅधn ोृयॅध iौ/ोनध cयननधcप?", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Both I &amp; II</span></p>", " <p style=\"margin-top:0pt;margin-  Math'\">Lord Dufferin</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">he </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ilbert Bill controversy</span><span style=\"font-family:'Cambria Math'\"> is associated with </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Ripon</span><span style=\"font-family:'Cambria Math'\">. </span><span style=\"font-family:'Segoe UI Emoji'\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Ilbert Bill (1883)</span><span style=\"font-family:'Cambria Math'\"> was introduced during the viceroyalty of </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Lord Ripon</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">It sought to allow </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Indian judges</span><span style=\"font-family:'Cambria Math'\"> to try </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">European offenders</span><span style=\"font-family:'Cambria Math'\">, leading to strong opposition from Europeans in India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">The controversy exposed </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">racial discrimination</span><span style=\"font-family:'Cambria Math'\"> in the colonial judicial system.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✔️</span><span style=\"font-family:'Cambria Math'\"> Correct Answer: Lord Ripon</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">Which of the following statements accurately describe the reign of Samudragupta?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">1. He is often referred to as the 'Napoleon of India' for his military campaigns.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\"> </span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">2.</span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">  </span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">The main source of information about his military achievements is the Allahabad Pillar Inscription, composed by his court poet Harisena.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"color:#1f1f1f;font-family:'Cambria Math'\"> </span><span style=\"color:#1f1f1f;font-family:'Cambria Math'\">3. He was a devout Buddhist and provided patronage to the famous Buddhist scholar Vasubandhu.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 2 &amp; 3</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">Only 1 &amp; 2</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Cambria Math'\">1, 2 &amp; 3 All</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Statements 1 and 2 are correct. </span><span style=\"font-family:'Segoe UI Emoji';font-weight:bold\">✅</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – Samudragupta is often called the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">“Napoleon of India”</span><span style=\"font-family:'Cambria Math'\"> (by historian </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">V. A. Smith</span><span style=\"font-family:'Cambria Math'\">) due to his extensive and successful </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">military conquests</span><span style=\"font-family:'Cambria Math'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Correct</span><span style=\"font-family:'Cambria Math'\"> – The </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Allahabad Pillar Inscription (Prayag Prashasti)</span><span style=\"font-family:'Cambria Math'\">, composed by his court poet </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Harisena</span><span style=\"font-family:'Cambria Math'\">, is the </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">principal source</span><span style=\"font-family:'Cambria Math'\"> of information about his military achievements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Cambria Math'\">Incorrect</span><span style=\"font-family:'Cambria Math'\"> – Samudragupta was primarily a </span><span style=\"font-weight:bold;font-family:'Cambria Math'\">Vaishnavite</span><span style=\"font-family:'Cambria Math'\">, not a devout Buddhist. A ly</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation (English):</span><br><span style=\"font-family:'Nirmala UI'\">After expressions like </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“It is imperative that”</span><span style=\"font-family:'Nirmala UI'\">, the verb should be in the </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">base form (subjunctive mood)</span><span style=\"font-family:'Nirmala UI'\">.</span><br><span style=\"font-family:'Nirmala UI'\">So, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">examines</span><span style=\"font-family:'Nirmala UI'\"> is incorrect; it should be </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">examine</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Symbol'\">✔</span><span style=\"font-family:'Nirmala UI'\"> Correct sentence:</span><br><span style=\"font-family:'Nirmala UI'\">It is imperative that the researcher </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">examine</span><span style=\"font-family:'Nirmala UI'\"> the data meticulously before publishing the final report in the journal.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या (Hindi):</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“It is imperative that”</span><span style=\"font-family:'Nirmala UI'\"> के बाद क्रिया का </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">base form</span><span style=\"font-family:'Nirmala UI'\"> प्रयोग होता है।</span><br><span style=\"font-family:'Nirmala UI'\">इसलिए </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">examines</span><span style=\"font-family:'Nirmala UI'\"> गलत है, सही रूप </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">examine</span><span style=\"font-family:'Nirmala UI'\"> होगा।</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Improve the highlighted part of the sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">He is working hard </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">with a view to attain</span><span style=\"font-family:'Nirmala UI'\"> the first rank.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">with a view for attaining</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">with a view to have attained</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">with a view to attaining</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">No Improvement</span></p>"], "correct": 3, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> Correct Answer:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">with a view to attaining</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The phrase </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“with a view to”</span><span style=\"font-family:'Nirmala UI'\"> is an idiomatic expression.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">In English, </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“to”</span><span style=\"font-family:'Nirmala UI'\"> here is a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">preposition</span><span style=\"font-family:'Nirmala UI'\">, not part of the infinitive.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Therefore, it must be followed by a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">gerund (-ing form)</span><span style=\"font-family:'Nirmala UI'\">, not the base verb.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Correct usage: “with a view to attaining…”</span></p>"}, {"qid": "", "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Identify the grammatical error in the given sentence:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">If the board of directors / would have acted more decisively last year, / the company would not be facing bankruptcy today.</span></p>", "options": ["<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">the company would not be facing bankruptcy today.</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">would have acted more decisively last year,</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">If the board of directors</span></p>", " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">No Error</span></p>"], "correct": 2, "marks": "1", "explanation": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Segoe UI Emoji'\">✅</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Correct answer:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">would have acted more decisively last year,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Explanation (English):</span><br><span style=\"font-family:'Nirmala UI'\">In a </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">conditional sentence (Type 3 mixed)</span><span style=\"font-family:'Nirmala UI'\">, the if-clause should </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">not use “would have”</span><span style=\"font-family:'Nirmala UI'\">. It must be in the </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">past perfect tense</span><span style=\"font-family:'Nirmala UI'\">.</span><br><span style=\"font-family:'Nirmala UI'\">Correct structure: If + had + past participle, not would have.</span><br><span style=\"font-family:'Nirmala UI'\">Correct sentence: If the board of directors </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">had acted</span><span style=\"font-family:'Nirmala UI'\"> more decisively last year, the company would not be facing bankruptcy today.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">व्याख्या (Hindi):</span><br><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Conditional sentence</span><span style=\"font-family:'Nirmala UI'\"> में if-clause के साथ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">“would have” का प्रयोग गलत होता है</span><span style=\"font-family:'Nirmala UI'\">। वहाँ </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">past perfect tense (had + verb का तीसरा रूप)</span><span style=\"font-family:'Nirmala UI'\"> आता है।</span><br> const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
