<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">

<script>
const Q = [{"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span>The     rate of simple interest for the first two years is 8% p.a, for     the next 4 years, it is 10% p.a. And for the period beyond 6     years, it is 12% p.a. If a person gets 18358.60 as simple after 9     years, then how much money (in rupee) did he invest?</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>21075</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>20087</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>19674</span></p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>19955</span></p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_bf9d07cd85e9356b.png\" width=\"395\" height=\"231\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A man rows to a     place 48 km distant and comes back in 14 hours. He finds that he     can row 4 km with the stream in the same time as 3 km against the     stream. The speed of the stream is:</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     1.8 km/h</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1 km/h</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     1.5 km/h</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     3.5 km/h</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_9f7a7cf45018ced5.png\" width=\"224\" height=\"377\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Raju spends 20     percent and 15 percent of his income on transport and food     respectively. He spends 40 percent of the remaining income on     clothing. He saves rest of his income. If his saving is 21840,     then what will be total expenditure on transport and clothing     together?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹24900       </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹25760       </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹23480       </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ₹26420</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_4567b90ba3443901.jpg\" width=\"226\" height=\"403\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A circle is     inscribed in a semicircle. What is the maximum possible area of     the circle, If the radius of semicircle is ‘r’.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_430330d0d60471ed.gif\" > </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_ffef4bdc53290946.gif\" > </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_fc7c9fb4953c4479.gif\" > </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     <span>None</span></p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_ee99f8373d377461.gif\" alt=\"Shape1\" width=\"307\" height=\"269\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The work     efficiency of A and B are in the ratio 3:4. If together, they can     complete 600% a work in 24 days. In how many days A alone can do     the work.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     9 1/3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     5 2/3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     8 2/3</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     9 2/3</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_cafe6a3266f694b7.png\" width=\"237\" height=\"257\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A car covers     1/7 of the distance from A to B at the speed of 33 km/hr, 1/11 of     the distance at 28 km/hr and the remaining at the speed of 118 km     per hour. Find the average speed of the whole journey.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     75km/hr</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     72.07 km/hr</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     71.08 km/hr</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     79 km/hr                       </p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_b762716a8 gular sheet of paper, when halved by folding it at the mid-point of its longer side, results in a rectangle, whose longer and shorter sides are in the same proportion as the longer and shorter sides of the original rectangle. If the shorter side of the original rectangle is 2, what is the area of the smaller rectangle?</p>", "options": ["\r\n<p>2</p>", "\r\n<p>2<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_1879db9ab1139aa3.gif\" /></p>", "\r\n<p>4<img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_1879db9ab1139aa3.gif\" /></p>", "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_1879db9ab1139aa3.gif\" /></p>"], "correct": 2, "marks": "1", "explanation": "\r\n<p><img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_d7f53ae9f04d3761.png\" style=\"height:336px; width:254px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     A is 20% more     efficient than B and C is 30% less efficient than B. Working     together, they can finish a work in 5 days. In how many days will     A alone complete 12/5 of that work?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     12</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     19</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     29</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     7</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690195084625_html_d3cdc1b6fab06b35.png\" width=\"258\" height=\"243\" > </p>"}, {"qid": "", "question": "<p>A sold an article to B at a profit of 35%. B sold it to C at a profit of 20%. The profit made by B is Rs.32 less than the profit made by A. What is 60% of cost price (in Rs.) of the article for A?</p>\r\n\r\n<p> </p>", "options": ["<p>546</p>", "<p>400</p>", "<p>640</p>", "<p>240</p>"], "correct": 4, "marks": "1", "explanation": "<p><img src=\"https://appxcontent.kaxa.in/test_s3_migration/2023-12-26/1703586385d419a388-1703586385.png\" style=\"height:1280px; width:1100px\" /></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in active voice.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     work will be finished by him in a fortnight.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     He     will be finishing the work in a fortnight.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     He     will finish the work in a fortnight.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     work will finished by them in a fortnight.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     work will finish him in a fortnight.</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     Voice to Passive Voice transformation: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + Shall/Will + v1 + Obj. ------- Obj + shall/will + be + v3 + by     + Sub. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct active voice of the given sentence is: <i>He     will finish the work in a fortnight.  </i></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Suppose we connect one end of a copper wire to a neutral pith     ball and the other end to a negatively charged plastic rod.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     A metal rod held in hand and rubbed with wool will not show any     sign of being charged. However, if a metal rod with a wooden or     plastic handle is rubbed without touching its metal part, it     shows signs of charging.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     We will find that the pith ball acquires a negative charge.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     If a similar experiment is repeated with a nylon thread or a     rubber band, no transfer of charge will take place from the     plastic rod to the pith ball.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     ACDB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BDAC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     BACD</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     paragraph explains the outcomes of different experiments     involving charging objects using a plastic rod and observing the     transfer of charge using a copper wire. The sentences are     arranged in a logical order to present the setup, the result, and     a comparison to highlight the importance of the copper wire in     the experiment. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct arrangement is<b>:     BACD:</b>     <i><b>A     metal rod held in hand and rubbed with wool will not show any     sign of being charged. However, if a metal rod with a wooden or     plastic handle is rubbed without touching its metal part, it     shows signs of charging.</b></i><i><b><span style=\"background:#f7f7f8\">     </span></b></i><i><b>Suppose     we connect one end of a copper wire to a neutral pith ball and     the other end to a negatively charged plastic rod. We will find     that the pith ball acquires a negative charge. If a similar     experiment is repeated with a nylon thread or a rubber band, no     transfer of charge will take place from the plastic rod to the     pith ball. </b></i></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Which     option accurately changes the following direct speech into     indirect speech? </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Direct     Speech: \"I won the first prize in the competition,\" he     proudly said.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     He     proudly said that he had won the first prize in the competition.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     He     proudly said that he has won the first prize in the competition.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     He     proudly said, \"I won the first prize in the competition.\"</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     He     proudly said that he won the first prize in the competition.</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>In     indirect speech, the reporting verb \"said\" changes to     \"said that,\" and the pronoun \"I\" changes to     \"he\" to match the subject of the reporting clause.     Additionally, the verb \"won\" changes to \"had won\"     to indicate that the action happened before the time of     reporting.</span></span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     complete indirect speech is: \"He proudly said that he had     won the first prize in the competition.\"</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the option that expresses the given sentence in active voice.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Abhinandan     landed the plane safely. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     The     plane had been landed safely by Abhinandan.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     plane was landed safely by Abhinandan.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     plane has been landed safely by Abhinandan.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     plane was to be landed safely by Abhinandan.</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     to Passive Voice transformation: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + v2 + Obj ------ Obj + was/were + v3 + by + Sub. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct passive voice: The plane was landed safely by Abhinandan.     </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     While knowing about its past in ancient and medieval times is     very important, its colonial experience is particularly     significant for comprehending modern India. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">     B.     It is also because such an exposure to modern ideas was     contradictory or paradoxical.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     Understanding the present usually involves some grasp of its     past. This holds true probably as much for an individual or     social group as for an entire country such as India. India has a     long and rich history.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">     D.     This is not just because many modern ideas and institutions     reached India through colonialism. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ADBC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CADB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDBA</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">the     paragraph discusses the importance of understanding India's     history, with a specific focus on its colonial experience and the     complex influence it had on shaping the modern nation.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: <b>CADB:</b>     <i><b>Understanding     the present usually involves some grasp of its past. This holds     true probably as much for an individual or social group as for an     entire country such as India. India has a long and rich history.     While knowing about its past in ancient and medieval times is     very important, its colonial experience is particularly     significant for comprehending modern India. This is not just     because many modern ideas and institutions reached India through     colonialism. It is also because such an exposure to modern ideas     was contradictory or paradoxical. </b></i></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     We have ‘bread-omlette’ and ‘cutlets’ as menu offered in     many roadside eateries and canteens.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">     B.     A very popular manufacturer of biscuits, is actually named after     Britain. Many school uniforms include neck-ties.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     We have a parliamentary and a legal system, a police and     educational system built very much on the British model. We drive     on the left side of the road like the British.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     We often admire the west and as often resent it. These are just     some of the many and complex ways that British colonialism lives     on in contemporary India. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     BADC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DBCA</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-left:0.5in;text-indent:-0.5in;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: <b>CABD</b>:     <i><b>We     have a parliamentary and a legal system, a police and educational     system built very much on the British model. We drive on the left     side of the road like the British. We have ‘bread-omlette’     and ‘cutlets’ as menu offered in many roadside eateries and     canteens. A very popular manufacturer of biscuits, is actually     named after Britain. Many school uniforms include neck-ties. We     often admire the west and as often resent it. These are just some     of the many and complex ways that British colonialism lives on in     contemporary India.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the correct indirect speech for the given direct speech:</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">\"I     have never seen such a beautiful sunset,\" she marveled. </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     She     marveled that she had never seen such a beautiful sunset.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     She     marveled that I have never seen such a beautiful sunset.\"</p>", "<p style=\"orphans:0;widows:0\">     She marveled that she had     never seen such a beautiful sunrise.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     She     marveled that she has never seen such a beautiful sunset.</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>In     indirect speech, the reporting verb \"marveled\" remains     the same, and the pronoun \"I\" changes to \"she\"     to match the subject of the reporting clause. </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Additionally,     the verb \"have never seen\" changes to \"had never     seen\" to indicate that the action of seeing the beautiful     sunset occurred before the time of reporting. </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     complete indirect speech is: \"She marveled that she had     never seen such a beautiful sunset.\"   </span></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Select     the INCORRECTLY spelt word.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Restaurant</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Relevant</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Quarentine</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Promise</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Quarantine     is incorrectly spelt in option c.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Quarantine:     isolation to prevent the spread of infectious disease. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Restaurant:     a building where people go to eat.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Relevant:     having a bearing on or connection with the subject at issue.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Promise:     a verbal commitment by one person to another agreeing to do (or     not to do) something in the future. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate homonym to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     detective carefully examined the crime scene, meticulously     collecting __________ evidence.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     incriminating</p>", "<p style=\"orphans:0;widows:0;text-dec r someone that provides a source of happiness. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Despair</b>:     a state in which all hope is lost or absent. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Gloom</b>:     a state of partial or total darkness. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span><b>Boredom</b></span><span>:     the feeling of being bored by something tedious.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that can be used as a one-word substitute for the     given group of words.<br> Policy of racial discrimination</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Commonwealth</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Diplomacy</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Non-alignment</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Apartheid</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is ‘Apartheid’.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Apartheid:</b>     Policy of racial discrimination; the former official government     policy in South Africa of separating people of different races style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Bhattcharjya     and many members of the FIFS believe that a change in valuation     to tax on the total consideration will cause irreversible damage     to the industry, lead to loss of revenue to the exchequer, and     loss of employment for lakhs of skilled engineers. “This     decision will have a chilling effect on the USD 2.5 billion of     FDI already invested by investors and jeopardise potentially any     further FDI in the sector,” he said adding that the decision     will push users towards illegal betting platforms leading to user     risk and loss of revenue for the government.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     Indian online gaming industry has been witnessing significant     growth over the years and today there are nearly 1,000 companies     operating in this industry which employ over 1 lakh people. The     numbers are expected to grow substantially, transforming the     online gaming industry into an economic powerhouse.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Regardless     of the prospects, the industry has been grappling with some     complex challenges related to the regulatory framework. And, one     of these challenges is the implementation of the GST on online     gaming. While the government has been in the process of     finalising a GST structure for the industry, the latest     development seems like a major challenge for many stakeholders in     the online gaming industry. The latest decision by the GST     Council has come as a shock to the gaming industry in India which     is estimated to be worth around $ 2.8 billion in FY22. When it     comes to online games in India, taxation and legality largely     depend on if they are considered a game of chance or a game of     skill. Games of chance are seen to attract more indirect tax or     GST, while games of skill attract lower GST. The council has now     argued that there should be no distinction between the two kinds     of gaming. Much before the decision to levy 28 per cent GST, the     primary dilemma was whether GST should be applied to the total     pool of cash or just the service element earned by the online     gaming platform. However, now the Finance Minister has said that     the tax will be levied on the entire value. The tax will     essentially be levied on the full face value of the bet placed     (or money paid to play the game) and not on the gross gaming     revenue, which the industry sought. Industry insiders strongly     feel that this will have a huge impact.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"> The     online gaming industry in India is estimated to be worth     approximately _______ in FY22.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     $2.5     billion</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     $2.8     billion</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     $1.5     billion</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     $3.2     billion</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     passage mentions that the online gaming industry in India is     estimated to be worth around $2.8 billion in FY22. This means     that the total value of the Indian online gaming industry's     market is approximately $2.8 billion during the financial year     2022. The passage provides this figure as part of the information     about the growth and significance of the online gaming industry     in India.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     was the founder of Sayyid Dynasty?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Mubarak     Shah</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Khizr     Khan</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Muhammad     Shah</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Alam     Shah</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     The     correct answer is Khizr Khan. He was followed by Mubarak Shah,     Muhammad Shah and Alam Shah respectively.                  </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     In     India, who among the following is responsible for auditing all     receipts and expenditure of the Union and State governments?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Attorney     General for India</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Comptroller     and Auditor- General</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Union     Public Service Commission</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Advocate     General</p>"], "corre roup. The plants in this group are commonly called algae. These     plants are predominantly aquatic.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Pteridophyta</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Thallophyta</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Angiosperms</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Bryophyta</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Thallophyta.      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      It consists      of plants that do not have a well-differentiated body design.       </p>      </li><li><p style=\"orphans:0;widows:0\">The      plants in this group are commonly called algae. They are found      in wet and damp places. They are autotrophic. Some of them are      used as food.                       </p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     The     longest continuous wall in India, the second longest in the     world, is at ______ Fort.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Kumbhalgarh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Mehrangarh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kangra</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Chittorgarh</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is Kumbhalgarh.      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      Greatest Wall of India - Kumbhalgarh fort!       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      It      is the 2nd longest continuous wall in the World,       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      It      is also known as the <b>Great Wall of India</b>.       </p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "\r\n\r\n<p>Who amongst the following has been awarded the 58th Jnanpith Award?</p>", "options": ["\r\n\r\n<p>Radha Menon &amp; Gulzar</p>", "\r\n\r\n<p>Vikram Seth &amp; Damodar Mauzo</p>", "\r\n\r\n<p>Gulzar &amp; Rambhadracharya</p>", "\r\n\r\n<p>Damodar Mauzo &amp; Ramabhadracharya</p>"], "correct": 3, "marks": "1", "explanation": "\r\n\r\n<p>The correct answer is Gulzar &amp; Rambhadracharya.</p>\r\n\r\n<p>The Jnanpith Award is the oldest and the highest Indian literary award presented annually by the Bharatiya Jnanpith to an author for their &quot;outstanding contribution towards literature&quot;. Instituted in 1961, the award is bestowed only on Indian writers writing in Indian languages included in the Eighth Schedule to the Constitution of India and English, with no posthumous conferral.</p>\r\n\r\n<p>The first recipient of the award was the Malayalam writer G. Sankara Kurup who received the award in 1965 for his collection of poems, Odakkuzhal</p>\r\n\r\n<p>57th Jnanpith Award:- Damodar Mauzo, Konkani Writer.</p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Who     among the following was the President of the Indian National     Congress during the 1925 session?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Mahatma     Gandhi</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Sarojini     Naidu</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Abul     Kalam Azad</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     S.     Srinivasa Iyengar</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is option B,     Sarojini Naidu.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      In      <b>1925</b> Kanpur session <b>Sarojini Naidu </b>became the      second woman president and the first Indian Woman president to      preside over the Congress.       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      first woman president of congress was <b>Annie Besant </b>in      <b>1917 </b>Calcutta session.       </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <b>WC      Banerjee</b> was the first president of INC in <b>1885</b>      Bombay session (establishment year) followed by <b>Dadabhai      Naoroji</b> in <b>1886</b> Calcutta session.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <b>Syed      Badruddin Tayyabji</b> was the first muslim president of INC in      <b>1887</b> Madras session.</p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     Following statements are made     regarding Green House Effect.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     A. The greenhouse effect is one of     the things that makes Earth a comfortable place to live.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     B. The greenhouse effect is a process     that occurs when gases in Earth's atmosphere release the Sun's     heat.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     C. Greenhouse gases include carbon     dioxide, methane, nitrous oxides, and water vapor. In which Water     Vapor is the major constituent.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Which of these statements are     correct?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     A     and B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only     B</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A     and C</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     A,     B and C</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct answer is option C. Both     A and C are correct statements.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      greenhouse effect is a process that occurs when gases in      Earth's atmosphere <b>trap</b> the Sun's heat. This process      makes Earth much warmer than it would be without an atmosphere.      The greenhouse effect is one of the things that makes Earth a      comfortable place to live.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      Water      vapour accounts for the largest percentage of the greenhouse      effect, as it is the most abundant greenhouse gas.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      The      main greenhouse gases whose concentrations are rising are carbon      dioxide, methane, nitrous oxide, hydrochlorofluorocarbons      (HCFCs), hydrofluorocarbons (HFCs) and ozone in the lower      atmosphere.</p>     </li></ul>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Cloud     seeding is a process that involves the introduction of various     chemical agents into clouds to enhance the chances of     precipitation. Which institution has recently undertaken the     significant test flight with the aim of cloud seeding.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     IIT     Madras</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     IIT     Kanpur</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     IIT     Bombay</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     IISc     Bangalore</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The correct option is the option B,     IIT Kanpur.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The Indian Institute of Technology     Kanpur (IITK) has recently undertaken a significant test flight     with the aim of cloud seeding. Cloud seeding is a process that     involves the introduction of various chemical agents into clouds     to enhance the chances of precipitation.  </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The primary purpose of the test     flight conducted by IIT Kanpur was to explore cloud seeding as a     potential solution to combat dry conditions and air pollution.     The technique involves modifying atmospheric conditions to     encourage rainfall and improve air quality. </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Cloud seeding entails the application     of various chemical agents like silver iodide, dry ice, common     salt, and other substances. These agents are introduced into     clouds to facilitate the for ika.</span></p>"}, {"qid": "", "question": " <span> Select the figure that will replace the question mark (?) in the following figure series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image047.png\" width=\"462\" height=\"124\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image048.jpeg\" width=\"93\" height=\"83\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image049.jpeg\" width=\"94\" height=\"86\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image050.jpeg\" width=\"94\" height=\"84\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image051.jpeg\" width=\"95\" height=\"85\" alt=\"\">"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><span>[b]</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image049.jpeg\" width=\"94\" height=\"86\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the correct mirror image of the given combination when the mirror is placed at ‘PQ’ as shown below.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image052.png\" width=\"207\" height=\"91\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image053.jpeg\" width=\"94\" height=\"17\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image054.jpeg\" width=\"96\" height=\"15\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image055.jpeg\" width=\"95\" height=\"18\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image056.jpeg\" width=\"94\" height=\"15\" alt=\"\">"], "correct": 4, "marks": "1", "explanation": "<span> The correct answer is D.</span><p><span>[d]</span></p><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image056.jpeg\" width=\"94\" height=\"15\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.</span><p><span>R X _ S U R _ G S _ R X _ _ U _ _ I S U</span></p>", "options": ["<span> G X U H S R Y</span>", "<span> F Y U H S R Y</span>", "<span> F X U H S R X</span>", "<span> F X U I T R X</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>R X F S U/ R X G S U/ R X H S U/ R X I S U.</span></p>"}, {"qid": "", "question": " <span> All 32 students in a class are standing in a row facing south. Akshita is 12th from the right end while Priyanka is 18th from the left end. How many people are standing between Akshita and Priyanka?</span>", "options": ["<span> Three</span>", "<span> Five</span>", "<span> Four</span>", "<span> Two</span>"], "correct": 4, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image057.png\" width=\"393\" height=\"300\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of ::?</span><p><span># : FMT :: REN: %</span></p>", "options": ["<span> # = EQS, % = QIJ</span>", "<span> # = CPS, % = OHO</span>", "<span> # = HJV, % = PHL</span>", "<span></span><span>  </span><span># = DPR, % = PHL</span>"], "correct": 3, "marks": "1", "explanation": "<span> </span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711522965203_image058.png\" width=\"389\" height=\"260\" alt=\"\"></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
