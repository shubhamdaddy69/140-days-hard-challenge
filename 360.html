<style>
:root {
  --primary:#4a90e2; --secondary:#22c55e; --danger:#ef4444; --warning:#f59e0b;
  --bg:#f8f9fa; --bg2:#e9ecef; --card:#fff; --text:#333; --muted:#666; --border:#ddd;
  --shadow:0 4px 6px rgba(0,0,0,0.1); --grad:linear-gradient(135deg,#667eea,#764ba2);
  --opt:#f9f9f9; --optH:#e3f2fd;
}
body.dark-mode {
  --bg:#1a1a1a; --bg2:#252525; --card:#2d2d2d; --text:#e0e0e0; --muted:#b0b0b0; --border:#444; --opt:#333; --optH:#404040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(to bottom,var(--bg),var(--bg2));color:var(--text);line-height:1.6;padding:10px}
.header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;z-index:1001;flex-wrap:wrap;align-items:center}
.brand{background:#0b1220;color:#c7d2fe;border:1px solid #1f2937;padding:8px 12px;border-radius:999px;font-weight:700;text-decoration:none}
.brand:hover{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.timer{margin-left:auto;background:var(--grad);color:#fff;padding:12px 20px;border-radius:25px;font-weight:700;box-shadow:var(--shadow)}
.timer.warning{background:linear-gradient(135deg,#ef4444,#f97316);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.7}}
.theme-btn,.submit-btn{background:#6c757d;color:#fff;padding:10px 20px;border:0;border-radius:20px;font-weight:700;cursor:pointer}
.submit-btn{background:var(--secondary)}
.theme-btn:hover{background:#5a6268}

.start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--grad);text-align:center}
.start-title{font-size:2.3em;font-weight:800;color:#fff;margin-bottom:16px}
.instructions{background:var(--card);padding:24px;border-radius:16px;box-shadow:var(--shadow);max-width:640px}
.instructions h2{color:var(--primary);margin-bottom:12px}
.instruction-item{margin:10px 0}
.start-btn{background:var(--grad);color:#fff;padding:12px 28px;border:0;border-radius:40px;font-weight:800;cursor:pointer;margin-top:16px}

.container{display:flex;max-width:100%;margin:70px auto 0;gap:15px;min-height:calc(100vh - 90px)}
.question-panel{flex:3;background:var(--card);padding:24px;border-radius:15px;box-shadow:var(--shadow);overflow-y:auto}
.q-header{font-size:20px;font-weight:800;color:var(--primary);border-bottom:3px solid var(--primary);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.q-marks{background:var(--secondary);color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
.q-timer{color:var(--primary);padding:8px;background:var(--optH);border-radius:5px;text-align:right;margin-bottom:12px}
.q-text{margin:16px 0;line-height:1.8;font-size:18px;background:var(--opt);padding:18px;border-radius:10px;border-left:4px solid var(--primary)}

.options{list-style:none}
.option{margin:12px 0;padding:15px 18px;border-radius:10px;background:var(--opt);border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px}
.option:hover{background:var(--optH);border-color:var(--primary)}
.option input{transform:scale(1.2)}
.option.selected{background:var(--optH);border-color:var(--primary);font-weight:500}
.option.correct{background:#d4edda!important;border-color:#22c55e!important;color:#155724;font-weight:700}
.option.wrong{background:#f8d7da!important;border-color:#ef4444!important;color:#721c24;font-weight:700}

.palette{flex:1;background:var(--card);padding:20px;border-radius:15px;box-shadow:var(--shadow);height:fit-content;max-height:calc(100vh - 90px);overflow-y:auto}
.status-legend{background:var(--opt);padding:15px;border-radius:10px;margin-bottom:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}
.status-item div:first-child{font-size:24px;margin-bottom:6px;font-weight:800}
.palette-title{font-weight:800;margin-bottom:12px;color:var(--primary);text-align:center;font-size:18px}
.q-numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-num{background:#d1d5db;padding:12px;text-align:center;cursor:pointer;border-radius:50%;font-weight:800;transition:.2s;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-num.answered{background:#22c55e;color:#052e12}
.q-num.viewed{background:#3b82f6;color:#fff}
.q-num.reviewed{background:#f59e0b;color:#111827}
.q-num.current{border:3px solid var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.3);transform:scale(1.06)}

/* Dark mode visibility */
body.dark-mode .q-num { color:#111827; background:#d1d5db; border:1px solid #374151; }
body.dark-mode .q-num.current { color:#1e3a8a; background:#e5e7eb; }
body.dark-mode .q-num.answered { color:#052e12; background:#22c55e; }
body.dark-mode .q-num.viewed { color:#ffffff; background:#3b82f6; }
body.dark-mode .q-num.reviewed { color:#111827; background:#f59e0b; }

#nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:10px;width:calc(100% - 20px);max-width:900px;background:var(--card);padding:12px;border-radius:15px;box-shadow:var(--shadow)}
#nav button{padding:12px 10px;border:2px solid var(--primary);background:var(--card);color:var(--primary);cursor:pointer;border-radius:25px;font-weight:800;flex:1}
#nav button:disabled{background:#e5e7eb;color:#6b7280;cursor:not-allowed;border-color:#e5e7eb}

.result{text-align:center;padding:32px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);border-radius:15px;display:none}
body.dark-mode .result{background:linear-gradient(135deg,#2d2d2d,#3d3d3d)}
.result-title{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.metrics{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.metric{background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);min-width:140px}
.metric .metric-value{font-size:24px;font-weight:800;color:var(--primary)}

@media(max-width:768px){
  .container{flex-direction:column;margin-top:100px}
  .question-panel,.palette{width:100%;margin-bottom:100px}
  #nav{flex-direction:column}
  .header{flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
  <div class="header" id="header" style="display:none;">
    <a class="brand" href="https://t.me/Boss_Quiz_Autobot" target="_blank" rel="noopener">Boss_Quiz_Autobot</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>

        <div id="solutionSlot"></div>
        <ul class="options" id="options"></ul>

      <div class="result" id="result">

        <div class="metrics" id="metrics"></div>
        <button class="start-btn" onclick="review()">Review Answers</button>
      </div>

    <div class="palette">
      <div class="status-legend">
        <div class="metric"><div class="metric-value" id="ans">0</div><div>Answered</div></div>
        <div class="metric"><div class="metric-value" id="notAns">130</div><div>Not Answered</div></div>
        <div class="metric"><div class="metric-value" id="notVis">130</div><div>Not Visited</div></div>
        <div class="metric"><div class="metric-value" id="rev">0</div><div>Review</div></div>
      </div>
      <div class="palette-title">Questions</div>
      <div class="q-numbers" id="palette"></div>
    </div>
  </div>

  <div id="nav" style="display:none;">
    <button id="prevBtn" onclick="prev()">← Prev</button>
    <button id="clearBtn" onclick="clearResponse()" style="border-color:#ef4444; color:#ef4444;">Clear Response</button>
    <button id="markBtn" onclick="mark()">⭐ Mark</button>
    <button id="nextBtn" onclick="next()">Next →</button>
  </div>

an>20%</span></p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;text-decoration:none\">     <img src=\"https://appxcontent.kaxa.in//bulk_uploader_images/1690288636241_html_6f1381042302f7ba.png\" width=\"420\" height=\"334\" > </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Every object experiences this force due to every other object in     the universe. All objects on the earth, for example, experience     the force of gravity due to the earth.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     In particular, gravity governs the motion of the moon and     artificial satellites around the earth, motion of the earth and     planets around the sun, and, of course, the motion of bodies     falling to the earth.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     It plays a key role in the large-scale phenomena of the universe,     such as formation and evolution of stars, galaxies and galactic     clusters.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">D.     The gravitational force is the force of mutual attraction between     any two objects by virtue of their masses. It is a universal     force.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br>      </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     DCAB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ABCD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CABD</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Putting     all the sentences together in the order DABC, the paragraph     provides a comprehensive explanation of the gravitational force     and its effects at various scales, from objects on Earth to     celestial bodies and even the formation of galaxies. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentence     D introduces the topic of the paragraph. Sentence A further     elaborates on the concept of the gravitational force. And     followed by Sentence B and C. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: DABC: <i><b>The     gravitational force is the force of mutual attraction between any     two objects by virtue of their masses. It is a universal force.     Every object experiences this force due to every other object in     the universe. All objects on the earth, for example, experience     the force of gravity due to the earth. In particular, gravity     governs the motion of the moon and artificial satellites around     the earth, motion of the earth and planets around the sun, and,     of course, the motion of bodies falling to the earth. It plays a     key role in the large-scale phenomena of the universe, such as     formation and evolution of stars, galaxies and galactic clusters.</b></i></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the correct active voice of the given sentence.<br> Ronit was     pushed into the pool by Kuldeep.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Ronit had     pushed Kuldeep into the pool.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kuldeep pushed     Ronit into the pool.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kuldeep was     pushing Ronit into the pool.</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Ronit pushed     Kuldeep into the pool.</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Active     Voice to Passive Voice transformation rules: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Sub     + v2 + Obj -------- Obj + was/were + v3 + by + Sub. </b></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Thus,     the correct active voice of the given sentence is: </span><spa <p style=\"orphans:0;widows:0;text-decoration:none\">     CDBA</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: BDCA: <i><b>Once     there was a race going on. A tortoise and a Hare participated     when the hare started to run faster. After a while, the hare     stopped near a tree and looked back. He couldn't find the     tortoise anywhere near him. He thought that the tortoise was     lagging. So, he started to sleep under the tree. When he woke up,     he couldn't see the tortoise. He started to run again towards the     final point. But when he got there, he was surprised. The race     was already finished. The tortoise has reached there before him.     The tortoise has won the game, even if he was the slowest one.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>Select     the option that can be used as a one-word substitute for the     given group of words.<br> Sharpness and accuracy of judgment</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Knowledge</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Estimation</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Acumen</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Experience</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Acumen</b>:     the ability to understand and judge things quickly and clearly. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Knowledge</b>:     knowledge (of about something) information, understanding and     skills that you have gained through learning or experience. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Estimation</b>:     your opinion of someone or something. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Experience</b>:     the things that you have done in your life; the knowledge or     skill that you get from seeing or doing something. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to replace the underlined word in the     given sentence.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">This     math problem is ____________ than the one we did yesterday.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     easier</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     easy</p>", "<p style=\"orphans:0;widows:0;text-d ingular verb. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Thus,     the correct sentence is: The amount of money is not sufficient     for the project. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate synonym of the given word. </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Fragrance     </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Taste</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Aroma</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Touch</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Prodigy</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Fragrance</b>:     A <i>fragrance</i> is     a smell, usually a pleasant or sweet smell. Often perfumes are     called <i>fragrances</i>.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Aroma</b>:     <i>Aroma</i> is     the word for a fragrant scent, one that pleases the nose in a way     that makes you lick your lips. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Taste</b>:     <i>Taste</i> is     the ability to tell the difference between flavors in your mouth.     </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Touch</b>:     make physical contact with, come in contact with. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Prodigy</b>:     an unusually gifted or intelligent (young) person; someone whose     talents excite wonder and admiration. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Thus,     the correct synonym of the given word ‘Fragrance’ is ‘Aroma’.      </span></span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sentences     of a paragraph are given below in jumbled order. Arrange the     sentences in the correct order to form a meaningful and coherent     paragraph.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     Based on whether there is participation of one organism or two in     the process of reproduction, it is of two types.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     When two parents (opposite sex) participate in the reproductive     process and also involve fusion of male and female gametes, it is     called sexual reproduction.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     There is a large diversity in the biological world and each     organism has evolved its own mechanism to multiply and produce     offspring. The organism's habitat, its internal physiology and     several other factors are collectively responsible for how it     reproduces.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>D.     When offspring is produced by a single parent with or without the     involvement of gamete formation, the reproduction is asexual.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     CBAD</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     DABC</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CADB</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     CDAB</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     c is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct arrangement is: CADB: <i><b>There     is a large diversity in the biological world and each organism     has evolved its own mechanism to multiply and produce offspring.     The organism's habitat, its internal physiology and several other     factors are collectively responsible for how it reproduces. Based     on whether there is participation of one organism or two in the     process of reproduction, it is of two types. When offspring is     produced by a single parent with or without the involvement of     gamete formation, the reproduction is asexual. When two parents     (opposite sex) participate in the reproductive process and also     involve fusion of male and female gametes, it is called sexual     reproduction.</b></i></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate synonym of the word given in brackets to     fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Despite     the challenging circumstances, her ____________ determination     never wavered.</span></p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     indomitable</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     ephemeral</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     incongruous</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     abstruse</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     word \"determination\" in the sentence indicates that we     need an adjective that describes a strong, unwavering, and     persistent quality. Let's examine each option: </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>indomitable</b>     - This adjective means not easily discouraged or defeated; unable     to be subdued. It perfectly fits the context, as it describes a     strong and unwavering determination. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>ephemeral</b>     - This adjective means lasting for a short period, transient, or     fleeting.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>incongruous</b>     - This adjective means not in harmony or not in agreement with     something else. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>abstruse</b>     - This adjective means difficult to understand or comprehend,     often related to complex and obscure subjects.  </span>     </p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Therefore,     the correct answer is A) indomitable. It describes the unwavering     and strong determination despite challenging circumstances.</span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Select the     INCORRECTLY spelt word.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Sergeant</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Recomend</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Supersede</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Similar</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inl d. If the question is of ‘wh family’ no     conjunction will be used.  </b></span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>The     correct Indirect speech of the given sentence is: </span><span><i><b>Gita     asked Babita if she could beat that wrestler.</b></i></span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Select     the most appropriate option to fill in the blank.</span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sukesh     Fernandes died ____________ Cancer. </span>     </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     from</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     of</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     against</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     due</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Rule     of Preposition: </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Died     of disease. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Died     from reason. </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding: g the perpetrators to book or to     step aside and let the judiciary take action are a stinging     indictment of their failure in restoring normalcy in Manipur.     After outrage expressed by Members of Parliament and     political representatives cutting across party lines, Mr. Modi,     who has maintained a conspicuous and unexplained silence on the     raging violence in Manipur, weighed in on the crime and promised     punishment of the guilty. For a leader who has always sought the     limelight and the need to dominate the airwaves, Mr. Modi’s     stand on the Manipur violence till now had betrayed an insouciant     attitude towards the crisis in the State. The renewed attention     on the Manipur conflict has finally led the State government to     promise that it will bring the perpetrators to book, but the     events of the last two and a half months reveal a significant     gulf between the Meitei and the Kuki-Zo communities. Steps     towards reconciliation would require much better leadership than     what the much touted “double engine” government of the     Bharatiya Janata Party (BJP) has offered so far. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"> <span>Q1.     The word \"insouciant\" in the passage means:</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Heinous</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Indifferent</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Conspicuous</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Condemning</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is indifferent.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Insouciant:     marked by blithe unconcern. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     word \"insouciant\" is an adjective used to describe     someone who is carefree or indifferent, often to the point of     being unconcerned or nonchalant. In the context of the passage,     it is used to describe Prime Minister Narendra Modi's attitude     towards the crisis in Manipur. The passage criticizes Mr. Modi's     lack of response and delayed action, suggesting that his initial     silence betrayed a careless or indifferent attitude towards the     ongoing violence in the state.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">A.     \"Heinous\" is not the correct meaning of \"insouciant.\"     The word \"heinous\" means extremely wicked or evil,     which is not the intended meaning here.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">B.     \"Conspicuous\" is not the correct meaning of     \"insouciant.\" The word \"conspicuous\" means     easily noticeable or standing out, which is not relevant to Mr.     Modi's attitude in the passage.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">C.     \"Condemning\" is not the correct meaning of     \"insouciant.\" The word \"condemning\" means     expressing strong disapproval or criticism, which is not the     intended meaning here.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">In     conclusion, \"insouciant\" in the passage means careless     or indifferent, reflecting the criticism of Mr. Modi's lack of     response and apparent unconcern towards the crisis in Manipur.</span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\">     <br>      </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Read     the following passage and answer the questions given after it.</b></span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">After     two and a half months of widespread and continuing violence in     Manipur, which included a conflagration in early May, Prime     Minister Narendra Modi finally broke his silence,     after video images of tribal women being paraded naked in     Thoubal district on May 4 once again showed up the heinous nature     of the conflict in the State. But Mr. Modi is yet to acknowledge     the causes and the consequences of the conflict that is     threatening to spiral out of control. The Supreme Court of     India’s suo motu cognisance of the sexual assault seen in     the video and its issuance of ultimatums to both the Union and     the State governments to bring the perpetrators to book or to     step aside and let the judiciary take action are a stinging     indictment of their failure in restoring normalcy in Manipur.     After outrage expressed by Members of Parliament and     political representatives cutting across party lines, Mr. Modi,     who has maintained a conspicuous and unexplained silence on the     raging violence in Manipur, weighed in on the crime and promised     punishment of the guilty. For a leader who has always sought the     limelight and the need to dominate the airwaves, Mr. Modi’s s:0;text-decoration:none\">     June 1922</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     December 1922</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is February 1922.   </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Mahatma      Gandhi abruptly called off the Non-Cooperation Movement when it      took a violent turn. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">From      1921–1922, the Non-Cooperation Movement grew in popularity. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Numerous      students abandoned government institutions. Lawyers ceased      practising. Legislative bodies were disregarded, and British      titles were given up. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">But      in an unfortunate event, the police's use of force in Chauri      Chaura against a peasants' non-violent protest infuriated them. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">In      retaliation, the police station in Chauri Chaura was set on fire      by the peasants in February 1922. Twenty-two police officers      were killed. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;border:none;padding:0in\">      <span style=\"display:inline-b >"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0\">     In 1757, ______ led the Company’s     army against Sirajuddaulah at Plassey.      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Lord Cornwallis</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Robert Clive</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Warren Hastings</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Lord Minto</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Robert Clive.     </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The Battle     of Plassey was fought in north-eastern India on 23 June     1757. Troops of the British East India Company, led by Robert     Clive, came up against the forces of Siraj-ud-Daulah, the last     Nawab of Bengal, and his French allies.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Robert     Clive (1757 – 1760), (1765 – 1767) </b></span>     </p>     <ul>      <ul>       <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">       <span style=\"display:inline-block;border:none;padding:0in\">Battle       of Plassey, 1757</span></p>       </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">       <span style=\"display:inline-block;border:none;padding:0in\">Treaty       of Allahabad, 1765</span></p>       </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">       <span style=\"display:inline-block;border:none;padding:0in\">He       applied dual governance is Bengal in 1765.</span>< wer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">When     electricity is passed through aqueous sodium chloride, it     decomposes to form <b>sodium     hydroxide.  </b></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Salts     of a strong acid and weak base are acidic with pH value less than     7.  </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Basicity     of an acid</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\"><b>Number      of removable hydrogen ions in an acid. Eg: </b></span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\"><b>Monobasic      acids = HCl, HNO</b><b><sub>3</sub></b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.11in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\"><b>Dibasic      acids = H</b><b><sub>2</sub></b><b>SO</b><b><sub>4</sub></b><b>,      H</b><b><sub>2</sub></b><b>CO</b><b><sub>3</sub></b><b>,      H</b><b><sub>3</sub></b><b>PO</b><b><sub>3</sub></b><b>      etc.</b></span></p>      </li><li><p style=\"orphans:0;widows:0;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\"><b>Tribasic      acids= H</b><b><sub>3</sub></b><b>PO</b><b><sub>4</sub></b></span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     The Indira Sagar Dam is built over     river Narmada in which of the following none;padding:0in\">Koyna     Dam – Maharashtra. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Bisalpur     Dam – Rajasthan.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Mettur     Dam – Rajasthan. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Indira     Sagar Dam – Madhya Pradesh. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Tehri     Dam – Uttarakhand.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which article     of the Indian constitution mentions that it is duty of the Union     government to protect States against external aggression and     internal disturbance?</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Article 353</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article 356</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article 358</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Article 355</p>"], "correct": 4, "marks": "1", "explanation": "Tुध cयननधcप ोnौथधन iौ Aनपicिध 355. Aनपicिध 355: Iप ौुोिि ृध पुध कहपद यी पुध Uniयn पय ूनयपधcप धॅधनद Sपोपध ोgोinौप धसपधनnोि ोggनधौौiयn ोnक inपधनnोि कiौपहनृोncध ोnक पय धnौहनध पुोप पुध gयॅधनnंधnप यी धॅधनद Sपोपध iौ cोननiधक यn in ोccयनकोncध थiपु पुध ूनयॅiौiयnौ यी पुiौ Cयnौपiपहपiयn. Aनपicिध 356: Aनपicिध 356 यी पुध Cयnौपiपहपiयn धंूयथधनौ पुध cधnपनोि gयॅधनnंधnप पय iंूयौध iपौ कiनधcप निहध यॅधन ोnद ौपोपध, ाnयथn ोौ पुध Pनधौiकधnप’ौ Rिहध. Tुiौ iौ ोिसय cोििधक ो ‘Sप    <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in\">     <br> <br>      </p>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in\">      <span style=\"display:inline-block;border:none;padding:0in\">These      crops do not require as much water as the Kharif crops. A      few examples of the rabi crops include wheat, barley, Peas,      Mustard, oats(cereals), etc.</span></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0\"><span style=\"display:inline-block;border:none;padding:0in\">Its      harvesting season is from April - May.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which of the     following pair of \"player – sports\" is correct?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br> I.     Lovlina Borgohain – Boxing<br> II. Nikhat Zareen – Wrestling</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only I</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Neither I nor     II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Both I and II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only II</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     a is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Lovlina     Borgohain is an Indian woman amateur boxer born on 2nd     October 1997 who won a bronze medal for India in the Tokyo     Olympics. She hails from Assam's Golaghat district. She     represents India in the 69kg Welterweight category     internationally. </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Nikhat     Zareen is an Indian boxer. She won gold medal at the     International Boxing Association Women's Youth &amp; Junior World     Championships organised in Antalya in 2011.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     Which of the     following statements regarding the lenses is/are correct?</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <br> I. Power     of a convex lens is represented as a positive number.<br> II.     Power of a concave lens is represented as a negative number.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Neither I nor     II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Both I and II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Only I</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     b is the correct answer.    </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Power     of a convex lens is represented as a positive number. As a convex     lens has a positive focal length, it will have positive power. It     is so because we know the relation between power and focal length     as P=1/f. Convex lenses, therefore, have positive power.  </span>     </p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><span style=\"display:inline-block;border:none;padding:0in\"><span>Power     of a concave lens is represented as a negative number. A concave     lens will always have a negative focal length because it is a     diverging lens.</span></span></p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;text-decoration:none\">     Nashik is also     known as ______ capital of India.</p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Gold</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Orange</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Wine</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Cotton</p>"], "correct": 3, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is “Wine”. Nashik is also known as ‘Wine     capital of India’.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     Nashik valley wine's quality is due to the high altitude at which     the grapes are grown and is marked by distinct high acidity with     \"specific acid-sugar balance.\"</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Nashik     is a holy city in Maharashtra that is celebrated for its abundant     production of redolent grapes.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>City     and their Nicknames-: </b></span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Jaipur-      Pink City.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Surat      – Silk City/Diamond City.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Jodhpur      – Rajasthan. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Ahmedabad      - Manchester of India/ Boston of India/India’s first world      heritage city. </span>      </p>      </li><li><p style=\"orphans:0;widows:0;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Asansol      - Land of Black Diamond</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span>The     simultaneous shifts of both the demand curve and the supply curve     can happen in which of the following ways? </span></span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     <span style=\"display:inline-block;border:none;padding:0in\"><span><br> I.     Supply curve shifts leftward and demand curve shifts rightward.     <br> II. Both supply and demand curves shift leftwards. <br> III.     Supply curve shifts rightward and demand curve shifts leftward.</span></span></p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Only I</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     I and II</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     II and III</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     I, II and III</p>"], "correct": 4, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Option     d is the correct answer. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     simultaneous shifts of both the demand curve and the supply curve     can happen in four possible ways: </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">1.     Both supply and demand curves shift rightwards. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">2.     Both supply and demand curves shift leftwards. </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">3.     Supply curve shifts leftward and demand curve shifts rightward. </span></p>     <p style=\"orphans:0;widows:0;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">4.     Supply curve shifts rightward and demand curve shifts leftward. </span>     </p>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;margin-bottom:0in;text-decoration:none\">     ______     administration became the model followed by the great emperor     Akbar when he consolidated the Mughal Empire.</p>     <p style=\"orphans:0;widows:0;text-decoration:none\"><br>      </p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Sher Shah     Suri’s         </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Muhammad     Tughluq’s         </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Genghis Khan’s             </p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Alauddin     Khalji’s</p>"], "correct": 1, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     correct answer is Sher Shah Suri’s.   </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sher     Shah's administration became the model followed by the great     emperor Akbar (1556-1605) when he consolidated the Mughal Empire.     </span>     </p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Sher     Shah Suri was the administrator of a small region in Bihar. He     defeated Humayun and established his own dynasty in Delhi. He     ruled for just fifteen years. But his administrative model was     efficient.</span></p>     <p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"><b>Akbar-:     </b></span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Akbar      became independent of the regent Bairam Khan and other members      of his domestic staff. Military campaigns were launched against      the Suris and other Afghans, against the neighbouring kingdoms      of Malwa and Gondwana, and to suppress the revolt of his      half-brother Mirza Hakim and the Uzbegs.</span></p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\"> </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">In      1568 the Sisodiya capital of Chittor was seized and in 1569      Ranthambhor. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Military      campaigns in Gujarat were followed by campaigns in the east in      Bihar, Bengal and Orissa. These campaigns were complicated by      the 1579-1580 revolt in support of Mirza Hakim.</span></p>     </li></ul>"}, {"qid": "", "question": "<p>In which of the following articles of the Indian constitution is the procedure for impeachment of the President of India mentioned?</p>\r\n\r\n<p> </p>", "options": ["<p>60</p>", "<p>59</p>", "<p>62</p>", "<p>61</p>"], "correct": 4, "marks": "1", "explanation": "<p>The correct answer is Article 61.</p>\r\n\r\n<p>The president is removed for the violation of the constitution and the process of impeachment is discussed in Article 61 of the Indian Constitution. Impeachment of the president can be initiated by either house of the Parliament.<br />\r\n </p>\r\n\r\n<p><strong>Articles related to President-: </strong></p>\r\n\r\n<p>Article 52-: The President of India.</p>\r\n\r\n<p>Article 53-: Executive Power of the Union.</p>\r\n\r\n<p>Article 54-: Election of President.</p>\r\n\r\n<p>Article 55-: Description of the Presidents.</p>\r\n\r\n<p>Article 56-: President Tenure of Office.</p>\r\n\r\n<p>Article 57-: Re-Election Eligibility.</p>\r\n\r\n<p>Article 58-: Qualification for Presidential Election.</p>\r\n\r\n<p>Article 59-: President&rsquo;s Office Conditions.</p>\r\n\r\n<p>Article 60-: Presidents Affirmation or Oath.</p>\r\n\r\n<p>Article 61-: President&rsquo;s Impeachment Procedure.</p>\r\n\r\n<p>Article 62-: Election Holding Time To Fill The Off e=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">Both     the statement I and II are correct. </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">Controlled      breathing (pranayam) is a specific set of respiratory exercises      within yoga that has been shown to improve the resting      respiratory rate, vital capacity, maximum voluntary ventilation,      breath-holding time, and maximal inspiratory and expiratory      pressures. </span>      </p>     </li></ul>     <p style=\"orphans:0;widows:0;margin-left:0.5in;margin-bottom:0.14in;border:none;padding:0in\">     <br> <br>      </p>     <ul>      <li><p style=\"orphans:0;widows:0;border:none;padding:0in\">      <span style=\"display:inline-block;border:none;padding:0in\">During      inhalation, the ribs move up and outward and the      diaphragm moves in. this movement decrease the space in our      chest cavity and the air rushes in. During exhalation, the ribs      moves down and inward and the diaphragm moves up.</span></p>     </li></ul>"}, {"qid": "", "question": "<p style=\"orphans:0;widows:0;text-decoration:none\">     Which of the     following has become the first state to establish a welfare fund     for Mahatma Gandhi Rural Employment Guarantee Scheme (MNREGS)     workers?</p>", "options": ["<p style=\"orphans:0;widows:0;text-decoration:none\">     Tamil Nadu</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Kerala</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Himachal     Pradesh</p>", "<p style=\"orphans:0;widows:0;text-decoration:none\">     Uttarakhand</p>"], "correct": 2, "marks": "1", "explanation": "<p style=\"orphans:0;widows:0;margin-bottom:0.14in;border:none;padding:0in\">     <span style=\"display:inline-block;border:none;padding:0in\">The     cor  FXDATXJQV </span>", "<span> FXCATWJQU</span>", "<span> FXCBSXJQV</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image048.png\" width=\"602\" height=\"697\" alt=\"\"></p>"}, {"qid": "", "question": " <span> Directions: A statement is given followed by two inferences I and II. You have to consider the statement to be true even if it seems to be at variance with commonly known facts. You have to decide which of the given inferences, if any, follow from the given statement.</span><p><span>Statement:</span></p><p><span>The fare – paying capacity of people who travel on routes connecting to small towns is very low. Most successful airlines which operate in such regions have a large number of seats.</span></p><p><span>Inference:</span></p><p><span>I. People from cities are increasingly travelling to small towns.</span></p><p><span>II. Regional airlines have to change low fares in order to be profitable.</span></p>", "options": ["<span> If only I follows</span>", "<span> If both I and II follow</span>", "<span> In only II follows</span>", "<span> If neither I nor II follows</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>In the given statement “The fare – paying capacity of people who travel on routes connecting to small towns is very low. Most successful airlines which operate in such regions have a large number of seats”.</span></p><p><span>From the given statement we can conclude only inference II, which is “Regional airlines have to change low fares in order to be profitable”.</span></p><p><span>Hence, only II follows.</span></p>"}, {"qid": "", "question": " <span> In the following series, select the wrong figure from the given series.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image049.png\" width=\"339\" height=\"71\" alt=\"\"></p>", "options": [" <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image050.jpeg\" width=\"50\" height=\"48\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image051.jpeg\" width=\"49\" height=\"49\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image052.jpeg\" width=\"49\" height=\"47\" alt=\"\">", " <span> </span><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image053.jpeg\" width=\"48\" height=\"51\" alt=\"\">"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span>"}, {"qid": "", "question": " <span> Select the correct combination of mathematical signs to sequentially replace the * signs and balance the given equation.</span><p><span>56 * 63 * 15 * 21 * 27 = 74</span></p>", "options": ["<span> ×</span><span>  </span><span>−</span><span>  </span><span>÷</span><span>  </span><span>+</span>", "<span> ÷</span><span>  </span><span>×</span><span>  </span><span>−</span><span>  </span><span>+</span>", "<span> +</span><span>  </span><span>×</span><span>  </span><span>÷</span><span>  </span><span>−</span>", "<span></span><span>  </span><span>+</span><span>  </span><span>− ÷</span><span>  </span><span>×</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image054.png\" width=\"340\" height=\"311\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, a statement is followed by two courses of action, numbered I and II. You must assume everything in the statement to be true and on the basis of the information given in the statement, decide which course of action/s logically follows for pursuing.</span><p><span>Statement: Many people have encroached into the government property and built their houses and business establishments.</span></p><p><span>Course of er is D.</span>"}, {"qid": "", "question": " <span> Select the number from among the given options that can replace the question mark (?) in the following series.</span><p><span>0.5, 0.55, 0.65, 0.8, ?</span></p>", "options": ["<span> 0.85</span>", "<span> 1</span>", "<span> 0.9</span>", "<span> 0.95</span>"], "correct": 2, "marks": "1", "explanation": "<span> The correct answer is B.</span><p><img src=\"https://appx-db.akamai.net.in/bulk_uploader_images/1711523862394_image060.png\" width=\"306\" height=\"234\" alt=\"\"></p>"}, {"qid": "", "question": " <span> In this question, two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct answer.</span><p><span>I. The university authority has decided to conduct all terminal examinations in March/April every year to enable them to declare results in time.</span></p><p><span>II. There has been considerable delay in declaring results in the past due to shortage of teachers evaluating the answer sheets of the examination conducted by the university.</span></p>", "options": ["<span> I is the cause and II is its possible effect.</span>", "<span> Both I and II are independent causes.</span>", "<span> Both I and II are effects of independent causes.</span>", "<span> II is the cause and I is its possible effect.</span>"], "correct": 3, "marks": "1", "explanation": "<span> The correct answer is C.</span><p><span>Clearly, each statement is self-sufficient in itself and stands independent of the other. Thus, I and II are independent causes.</span></p><p><span>Hence, both I and II are effects of independent causes.</span></p><p><span style=\"font-weight:bold\"> </span></p><p><span> </span></p>"}];
const TIME = 3600;

let time = TIME, curr = 0, ans = {}, rev = [], vis = [], qTimes = [], qStart = null;
let done = false, reviewMode = false, timerHandle = null;

function toggleTheme(){
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = '☀️ Light Mode';
  }
});

function startTest(){
  document.getElementById('start').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('main').style.display='flex';
  document.getElementById('qContainer').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('nav').style.display='flex';
  if (document.getElementById('palette').children.length === 0) {
    initPalette();
  }
  show(0);
  if (!timerHandle) startTimer();
}

function initPalette(){
  const p = document.getElementById('palette');
  p.innerHTML = '';
  Q.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-num'; d.textContent = i + 1; d.onclick = () => show(i);
    p.appendChild(d); rev[i] = false; vis[i] = false; qTimes[i] = 0;
  });
  updateStats();
}

function renderOptionHTML(text){ return text; }

function show(i){
  if (qStart !== null && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  if (done && !reviewMode) return;
  vis[i] = true; curr = i; const q = Q[i];
  document.getElementById('qNum').textContent = `Question ${i+1} of ${Q.length}`;
  document.getElementById('marks').textContent = q.marks;
  document.getElementById('qText').innerHTML = q.question;

  const opts = document.getElementById('options'); opts.innerHTML = '';
  document.getElementById('solutionSlot').innerHTML = ''; // single solution panel

  if (reviewMode) {
    const t = qTimes[i];
    document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(t/60))}:${pad(t%60)}`;
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      li.innerHTML = `${letter}. ` + renderOptionHTML(o);
      const isCorrect = (j + 1) === q.correct;
      const isUser = ans[i] === (j + 1);
      if (isUser && isCorrect) li.classList.add('correct');
      else if (isUser) li.classList.add('wrong');
      else if (isCorrect) li.classList.add('correct');
      opts.appendChild(li);
    });

    const slot = document.getElementById('solutionSlot');
    const sol = document.createElement('div');
    sol.className = 'solution-wrap';
    sol.style.marginTop = '14px';
    const body = (Q[i].explanation || '');
    sol.innerHTML = `
      <details style="background:var(--opt);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--primary)">View Solution</summary>
        <div style="margin-top:10px" class="solution-body">${body}</div>
      </details>
    `;
    slot.appendChild(sol);
    sol.querySelectorAll && sol.querySelectorAll('img').forEach(img => { img.style.maxWidth = '100%'; img.style.height = 'auto'; });
    const det = sol.querySelector('details');
    if (ans[i] && ans[i] !== q.correct) det.setAttribute('open','open');

    document.getElementById('nav').style.display = 'flex';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('prevBtn').disabled = (curr === 0);
    document.getElementById('nextBtn').disabled = (curr === Q.length - 1);
  } else {
    document.getElementById('qTimer').textContent = 'Time: 00:00';
    q.options.forEach((o, j) => {
      const li = document.createElement('li'); li.className = 'option';
      const letter = String.fromCharCode(65 + j);
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'answer'; inp.value = j + 1; inp.id = `o${i}-${j}`;
      if (ans[i] === (j + 1)) { inp.checked = true; li.classList.add('selected'); }
      inp.onchange = () => {
        ans[i] = parseInt(inp.value); updatePalette(); updateStats();
        document.querySelectorAll('#options .option').forEach(x => x.classList.remove('selected'));
        li.classList.add('selected');
      };
      const lbl = document.createElement('label'); lbl.htmlFor = inp.id; lbl.innerHTML = `${letter}. ` + renderOptionHTML(o);
      li.appendChild(inp); li.appendChild(lbl);
      li.onclick = e => { if (e.target.tagName !== 'INPUT') { inp.checked = true; inp.onchange(); } };
      opts.appendChild(li);
    });
    document.getElementById('markBtn').disabled = false;
    document.getElementById('nav').style.display = 'flex';
    qStart = Date.now();
  }
  updatePalette(); updateStats(); updateNav();
  if (window.MathJax) MathJax.typeset([document.getElementById('qText'), document.getElementById('options'), document.getElementById('solutionSlot')]);
}

function updatePalette(){
  document.querySelectorAll('.q-num').forEach((n, i) => {
    n.classList.remove('viewed','answered','reviewed','current');
    if (i === curr) n.classList.add('current');
    if (rev[i]) n.classList.add('reviewed');
    else if (ans[i]) n.classList.add('answered');
    else if (vis[i]) n.classList.add('viewed');
  });
}
function updateStats(){
  const a = Object.keys(ans).length;
  document.getElementById('ans').textContent = a;
  document.getElementById('notAns').textContent = Q.length - a;
  document.getElementById('notVis').textContent = vis.filter(v => !v).length;
  document.getElementById('rev').textContent = rev.filter(Boolean).length;
}
function updateNav(){
  const atEnd = curr === Q.length - 1;
  document.getElementById('prevBtn').disabled = curr === 0 && !reviewMode;
  document.getElementById('nextBtn').disabled = atEnd;
}

function clearResponse() {  // <--- Double braces here
  if (done || reviewMode) return;
  
  // 1. Remove answer from data
  delete ans[curr]; 
  
  // 2. Visual reset
  const opts = document.querySelectorAll('#options .option');
  opts.forEach(li => {      // <--- Double braces here
    li.classList.remove('selected');
    const radio = li.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });                       // <--- Double braces here

  // 3. Update dashboard/palette
  updatePalette(); 
  updateStats();
}                           // <--- Double braces here

function mark(){ if (!done) { rev[curr] = !rev[curr]; updatePalette(); updateStats(); updateNav(); } }
function prev(){ if (curr > 0) show(curr - 1); }
function next(){ if (curr < Q.length - 1) show(curr + 1); }

function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (!reviewMode && qStart) {
      const e = Math.floor((Date.now() - qStart) / 1000);
      document.getElementById('qTimer').textContent = `Time: ${pad(Math.floor(e/60))}:${pad(e%60)}`;
    }
    const m = Math.floor(time / 60); const s = time % 60;
    document.getElementById('timer').textContent = `Time: ${pad(m)}:${pad(s)}`;
    if (time <= 300) document.getElementById('timer').classList.add('warning');
    if (time > 0) time--; else { stopAll(); alert('Time up!'); submit(true); }
  }, 1000);
}
function stopAll(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } qStart = null; }

function submit(auto=false){
  if (done) return;
  if (!auto) {
    const un = Q.length - Object.keys(ans).length;
    if (un > 0 && time > 0 && !confirm(`${un} unanswered. Submit?`)) return;
  }
  if (qStart && !reviewMode) qTimes[curr] += Math.floor((Date.now() - qStart) / 1000);
  done = true; stopAll();

  document.getElementById('submitBtn').disabled = true;
  document.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);

  let cor = 0, wrg = 0, una = 0;
  Q.forEach((q, i) => { if (!ans[i]) una++; else if (ans[i] === q.correct) cor++; else wrg++; });
  const score = cor - (wrg * 0.25);
  const acc = (cor + wrg) ? (cor / (cor + wrg) * 100).toFixed(1) : "0.0";
  const spent = TIME - time; const tm = `${pad(Math.floor(spent/60))}:${pad(spent%60)}`;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-value">${score.toFixed(1)}/${Q.length}</div><div>Score</div></div>
    <div class="metric"><div class="metric-value">${cor}</div><div>Correct</div></div>
    <div class="metric"><div class="metric-value">${wrg}</div><div>Wrong</div></div>
    <div class="metric"><div class="metric-value">${una}</div><div>Skipped</div></div>
    <div class="metric"><div class="metric-value">${acc}%</div><div>Accuracy</div></div>
    <div class="metric"><div class="metric-value">${tm}</div><div>Time</div></div>
  `;
  document.getElementById('qContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('nav').style.display = 'none';
}

function review(){
  reviewMode = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qContainer').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  show(curr = 0);
}

function pad(n){ return String(n).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
});
</script>
</body>
</html>
